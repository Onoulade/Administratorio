name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read release metadata
        id: meta
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const cp = require("node:child_process");

          const sh = (command) => cp.execSync(command, { encoding: "utf8" }).trim();
          const exists = (command) => {
            try {
              cp.execSync(command, { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          };

          const info = JSON.parse(fs.readFileSync("info.json", "utf8"));
          const version = info.version;

          if (exists(`git rev-parse --verify --quiet refs/tags/v${version}`)) {
            throw new Error(`Tag v${version} already exists — did you forget to merge the prepare-release PR?`);
          }

          // Extract the top changelog block as release notes
          const changelog = fs.readFileSync("changelog.txt", "utf8");
          const blocks = changelog.split(/^-{50,}/m).filter(Boolean);
          const releaseNotes = ("---------------------------------------------------------------------------------------------------\n" + (blocks[0] || "")).trimEnd() + "\n";
          fs.writeFileSync("release-notes.md", releaseNotes);

          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`version=${version}\n`);
          output.write(`tag=v${version}\n`);
          output.write(`mod_name=${info.name}\n`);
          output.write(`zip_name=${info.name}_${version}.zip\n`);
          output.end();
          NODE

      - name: Tag release
        run: |
          git tag -a "${{ steps.meta.outputs.tag }}" -F release-notes.md
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: Build release zip
        run: |
          git archive \
            --format=zip \
            --prefix="${{ steps.meta.outputs.mod_name }}_${{ steps.meta.outputs.version }}/" \
            --output="${{ steps.meta.outputs.zip_name }}" \
            HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.zip_name }}#Packaged Mod" \
            --title "${{ steps.meta.outputs.version }}" \
            --notes-file release-notes.md

      - name: Upload to Factorio mod portal
        env:
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
        run: |
          init_response="$(
            curl -fsS \
              -H "Authorization: Bearer ${FACTORIO_TOKEN}" \
              -F "mod=${{ steps.meta.outputs.mod_name }}" \
              https://mods.factorio.com/api/v2/mods/releases/init_upload
          )"
          upload_url="$(node -e 'process.stdin.on("data", d => process.stdout.write(JSON.parse(d).upload_url))' <<< "$init_response")"
          curl -fsS -F "file=@${{ steps.meta.outputs.zip_name }}" "$upload_url"
