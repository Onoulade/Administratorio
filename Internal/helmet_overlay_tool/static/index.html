<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Helmet Overlay Alignment</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Helmet Overlay Alignment</h1>
          <p id="status">Loading frames...</p>
        </div>
        <button id="regenerate" type="button">Regenerate spritesheets</button>
      </header>

      <section class="workspace">
        <aside class="panel">
          <label>
            Direction
            <input id="direction" type="number" min="0" max="15" value="0">
          </label>
          <label>
            Frame
            <input id="frame" type="number" min="0" max="15" value="0">
          </label>
          <label>
            X offset
            <input id="offsetX" type="number" value="0">
          </label>
          <label>
            Y offset
            <input id="offsetY" type="number" value="0">
          </label>
          <label>
            Helmet opacity
            <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.85">
          </label>
          <label>
            Helmet size
            <input id="helmetGrow" type="number" min="-64" max="64" value="0">
          </label>
          <div class="preset-row">
            <button class="sizePreset secondary" type="button" data-grow="0">0 px</button>
            <button class="sizePreset secondary" type="button" data-grow="1">+1 px</button>
            <button class="sizePreset secondary" type="button" data-grow="2">+2 px</button>
            <button class="sizePreset secondary" type="button" data-grow="3">+3 px</button>
          </div>
          <label>
            Nudge target
            <select id="scope">
              <option value="frame">Current frame</option>
              <option value="direction">Current direction</option>
              <option value="animation-frame">Same frame in every direction</option>
              <option value="all">All frames</option>
            </select>
          </label>
          <div class="button-grid">
            <button id="up" type="button">Up</button>
            <button id="left" type="button">Left</button>
            <button id="right" type="button">Right</button>
            <button id="down" type="button">Down</button>
          </div>
          <div class="section">
            <label>
              Column X step
              <input id="driftX" type="number" value="1">
            </label>
            <label>
              Column Y step
              <input id="driftY" type="number" value="0">
            </label>
            <label>
              Column anchor
              <select id="driftAnchor">
                <option value="start">Frame 1 unchanged</option>
                <option value="end">Frame 8 unchanged</option>
              </select>
            </label>
            <button id="applyDrift" class="secondary" type="button">Apply cumulative correction</button>
            <button id="applyDriftAll" class="secondary" type="button">Apply to whole sheet</button>
            <button id="invertDrift" class="secondary" type="button">Apply inverse correction</button>
          </div>
          <button id="reset" class="secondary" type="button">Reset target</button>
          <button id="copyPrevious" class="secondary" type="button">Copy previous frame</button>
        </aside>

        <section class="preview">
          <canvas id="canvas" width="398" height="310"></canvas>
          <div id="filmstrip" class="filmstrip"></div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
