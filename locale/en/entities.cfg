[entity-description]
slop-refinery=Everything downstream of a token. Draws Inference Tokens off the optic fibre and refines them into Administrative Slop, slop into fabricated paperwork, and handles the Fabricated Citations that fall out. The [entity=ai-server] only makes the inference; this is what turns it into filing.
optical-fibre=Carries [fluid=inference-token] and nothing else. Will not connect to ordinary pipes or to pneumatic tubes.
involuntary-relocation-cannon=Fires biter-family staff to another planet, a batch per shot. Not a turret; it needs no aiming.\n\nLoad the cargo into its input slot. Nothing else is needed — it fires whenever a matching [entity=involuntary-relocation-receiver] on another planet asks for it, spending one of that receiver's transfer orders per item that arrives.\n\n[font=default-bold]There is no target setting.[/font] Any receiver on another planet with a matching request is answered. Biter-family staff only, never eggs, planets only. A planet that both sends and receives builds one of each.
involuntary-relocation-receiver=Requests biter-family staff from another planet, a batch per shot.\n\nLoad [item=involuntary-transfer-order] forms into its input slot, and wire it to a circuit network with a signal for each item [color=green]this[/color] planet wants pulled in. It spends one order per item that arrives, and arrivals land in its output slots.\n\n[font=default-bold]There is no target setting.[/font] Any [entity=involuntary-relocation-cannon] on another planet with matching cargo answers. A planet that both sends and receives builds one of each.
synthetic-personnel-bureau=Manufactures professions rather than buildings. Synthesises Licensed Notaries, Conciliation Officers, Relay Clerks, and Cryoprint Technicians from biter eggs, inference tokens, and administrative slop — so a specialist no longer means a Nauvis round trip. Its power draw is the real constraint.
ai-server=Aquilo's compute core, and its only job. Consumes a great deal of electricity to produce Inference Tokens, and emits real heat into the vanilla heat network while it works. A server that cannot dump its heat stops outright — it does not throttle. It takes no recipe choice, and its tokens leave only by optic fibre, to a [entity=slop-refinery].
heat-exhaust=Caps the temperature of a heat network, voiding the surplus. For players who want the compute without the power generation. It is never more efficient than actually using the heat.
interplanetary-terminus=Moves paperwork between planets through a slow, narrow shared pool. Base research carries black paperwork only; cyan, yellow, magenta, and composite forms require [technology=interplanetary-tube-chromatic] on Aquilo. Rockets remain the route for every other item.
trajectory-compliance-array=Consumes routine or priority orbital deviation orders to apply a slow outward push to small and medium asteroids within 20 tiles. Priority orders push twice as hard; overlapping shots and arrays stack, but create no chunks.
senior-trajectory-compliance-array=Consumes routine or priority orbital deviation orders to push small, medium, and big asteroids within 30 tiles. Priority orders push twice as hard; big asteroids may still require overlapping arrays.
executive-trajectory-compliance-array=Consumes routine or priority orbital deviation orders to push every asteroid size within 40 tiles. Priority orders push twice as hard; huge Administratorium asteroids usually require several simultaneous pushes.
orbital-employment-catapult=Deploys [item=voluntary-exploration-space-miner] projectiles up to 56 tiles through a narrow 18° firing corridor. Miners attach on impact and perform 137.5 base mining damage per second after a short startup delay. Each asteroid accepts one miner initially and up to five through staffing research. A destroyed asteroid becomes its full vanilla-equivalent chunk yield plus one collectible employee chunk per attached miner; collecting that chunk returns reusable VESM ammunition directly to the collector output.
bullshit-ore=A rich deposit of naturally occurring nonsense. Mine it to obtain raw bullshit ore for the bureaucratic economy.
politician-fluid=A pressurized underground fissure of political essence. Extract with a pumpjack to obtain politician fluid.
redundant-rubble=A geological deposit of mineralized oversight. Mine it to obtain redundant rubble for binding official documents.
amber-sap-seep=A sticky Gleba seep. Pump it to obtain amber sap for the planet's nonsense, ink, and yellow-form alternatives.
verdigris-crust=A copper-green Vulcanus mineral deposit. Mine it to bootstrap the planet's cyan paperwork chain.
office-desk=Consolidated workstation for filing, supplies, and basic administrative tasks. Closes at night unless fitted with an [item=overtime-exemption].
field-office=Summons biters from nests within 200 tiles as one-per-craft workers. Only operates while a biter is on site — zero pollution during operation. Operates day and night and accepts no modules.
biter-station=Dispatches multiple biter workers in parallel to enable nearby managed buildings. Each enabled machine runs one craft, then waits for the next visit. At night, each dispatch also consumes liquid coffee from any of its four side pipe entrances.
biterport=Holds up to 8 biter logistics workers and taxpayer funding. Connected biterports form a walking construction/logistics network with vanilla roboport-sized logistics and construction areas: biters can build ghosts and move requester chest items inside biterport coverage, while normal robots may still use the overlapping native roboport area. Returned workers rest for a brief 30-tick turnaround before they can be dispatched again. At night, each dispatch also consumes liquid coffee from any of its four side pipe entrances.
paperwork-provider-chest=One-slot passive provider chest for biter-operated logistics. Robots can still use it.
paperwork-storage-chest=One-slot storage chest for biter-operated logistics and deconstruction disposal.
paperwork-requester-chest=One-slot requester chest for biter-operated logistics.
formation-center=Biter training and managerial briefing facility. Profession formation is restricted to Nauvis; reusable MMMMs can attend cheap briefings on any planet. Accepts liquid coffee through either side and supports speed modules.
rideable-biter=Personal transport with an unusually enthusiastic civil servant underneath. Fueled only by [item=taxpayer-money], fitted with a very small cargo pouch, and permanently assigned once placed. Leave it unfunded for 10 minutes and it returns to civilian complaint duty.
field-office-no-working-hours=Summons biters from nests within 200 tiles as one-per-craft workers. Only operates while a biter is on site — zero pollution during operation.
office-desk-no-working-hours=Consolidated workstation for filing, supplies, and basic administrative tasks.
administrative-clock=1x1 circuit clock. Outputs [virtual-signal=signal-daytime] on a 0–100 scale with midnight at 0/100, plus the configured [virtual-signal=signal-day-shift-start] and [virtual-signal=signal-day-shift-end] constants.
admin-station=5x5 biter interface. Stores complaint tickets and resolved items. Biters arrive, get registered, and wait for resolution. No crafting — storage only.
resolution-office=3x3 resolution crafting office. Handles filing, casework, and final rulings with two fluid input ports.
union-headquarters=Negotiates workforce approval and now handles the consolidated late-game executive workload: grants, written approvals, policy drafting, and tax audits. The first copy bootstraps from treasury bonds and verbal paperwork. Closes at night unless fitted with an [item=overtime-exemption].
union-headquarters-no-working-hours=Negotiates workforce approval and now handles the consolidated late-game executive workload: grants, written approvals, policy drafting, and tax audits. The first copy bootstraps from treasury bonds and verbal paperwork.
union-headquarters-space-age=Negotiates workforce approval and handles the consolidated late-game executive workload: grants, written approvals, and policy drafting. Space Age funding is earned through orbital tourism rather than tax-audit laundering. The first copy bootstraps from treasury bonds and verbal paperwork. Closes at night unless fitted with an [item=overtime-exemption].
union-headquarters-space-age-no-working-hours=Negotiates workforce approval and handles the consolidated late-game executive workload: grants, written approvals, and policy drafting. Space Age funding is earned through orbital tourism rather than tax-audit laundering. The first copy bootstraps from treasury bonds and verbal paperwork.
propaganda-distillery=5x5 administrative fluid refinery. Refines politician fluid into lies, synthesizes misinformation, produces justifications and slush funds. Symmetric pipe layout with two west-side inputs and two east-side outputs.
propaganda-distillery-space-age=5x5 administrative fluid refinery. Refines politician fluid into lies, synthesizes misinformation, and produces justifications. In Space Age, renewable public funding comes from orbital tourism instead of slush-fund laundering. Symmetric pipe layout with two west-side inputs and two east-side outputs.
locomotive=A transit permit chest is automatically placed at each train stop. Load [item=transit-authorization] forms into it — one is consumed per arrival. The station's train limit equals the number of forms in the chest.
greenhouse=Slowly grows wood from water, or cultivates rare coffee beans. Electric-powered.
printer-t1=Slow but reliable electric printer. Produces documents from ink cartridges. 50kW power draw.
printer-t2=Fast industrial printer with copy mode. On planets it requires a [item=worker-biter] visit from a nearby [entity=biter-station]. On space platforms onboard authorization replaces dispatch and enables advanced orbital printing.
chromatic-printer=Prints black and planet-colored paperwork on atmospheric worlds. The colors originate on Vulcanus (cyan), Gleba (yellow), and Fulgora (magenta); importing a color supports remote printing but never unlocks its jurisdiction's recipes. Aquilo needs a Laser Printer instead.
laser-printer=Aquilo's solid-media printer. It replaces liquid inks with imported colored forms and local transfer media; plan for cross-planet inputs before building a cryogenic or final-charter line.
capture-bureau=Dedicated hostile-acquisitions machine. Feed it lure spores to create a visible spore cloud: workforce spores attract biters, tourism spores attract spitters, and oviposition spores attract Gleba pentapods.
petition-counter=Permit-approval station. Processes unapproved permits only when at least one biter nest is nearby.
conciliation-desk=Dedicated Gleba conciliation office. Finalizes the compact yellow-form family for launch shortcuts and biological exception handling.
digital-services-bureau=Dedicated Fulgora digital office. Handles office-desk-class administrative processing at high speed and without night shutdown.
administrative-space-station=Dedicated orbital admin office. Ordinary offices remain ground-bound; Industrial and Laser Printers are the only separate administrative machines cleared for vacuum. Produces renewable platform paperwork from asteroid materials.
notary-office=Dedicated Vulcanus certification office. Handles seals, charters, endorsements, and local fallback launch paperwork with fluid-backed notarial processing.
territorial-arbitration-post=Dedicated Vulcanus resettlement office. Consumes Territorial Resettlement Orders and Liquid Lie to suppress demolisher activity around contested chunks, clearing territory toward a Territorial Deed.
archive-recombination-bureau=Uses the normal Recycler input and output inventories and is permanently staffed by the [item=relay-clerk] used in its construction. Insert one supported form. Its three same-rank, color-safe replacement candidates each roll independently at 25%, so one operation can return zero, one, two, or three forms.
mechanical-printer=A crude but functional hand-cranked printer (0.5x speed). Reliable early-game workhorse.
corporate-breakroom=Consumes liquid coffee and dubious data to generate watercooler gossip. Each craft requires a [entity=biter-station] within 30 tiles with a [item=worker-biter] and [item=taxpayer-money] available for dispatch. At night, the employment office also needs liquid coffee.
corporate-breakroom-no-working-hours=Consumes liquid coffee and dubious data to generate watercooler gossip. Each craft requires a [entity=biter-station] within 30 tiles with a [item=worker-biter] and [item=taxpayer-money] available for dispatch.
pneumatic-pipe=Manila-colored sealed pipe for transporting fluidized paperwork. Cannot connect to regular fluid pipes.
pneumatic-pipe-to-ground=Underground pneumatic pipe. Cannot connect to regular fluid infrastructure.
tube-intake=1x1 intake station. Inserters can feed valid paperwork items directly into the tube network.
tube-outtake=1x1 outtake station. Items from the tube network appear in its inventory — use your own inserter or logistics to extract. Set a filter on the inventory slot to request a specific item type.
overtime-exemption=Certifies a single administrative building for legal overnight staffing. One module is enough to keep the whole building open after dark; additional copies are just decorative corruption.
