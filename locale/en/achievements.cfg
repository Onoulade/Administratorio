[achievement-description]
tube-terminus=Build __ENTITY__interplanetary-terminus__. The same inbox, now with shipping costs.
chromatic-trunk=Research __TECHNOLOGY__interplanetary-tube-chromatic__. You can now reply all to planets that never asked to be included.
research-with-promethium=Research a technology using Administratorium science packs. Even the endgame needs references.
welcome-to-the-department=Build __ENTITY__admin-station__. Your cubicle awaits; the biter has concerns.
discovery-of-bullshit=Research __TECHNOLOGY__discovery-bullshit__. It was under your feet the whole time, which explains several industries.
ink-stained=Research __TECHNOLOGY__printing-technology__. The printer is jammed again; the printer denies jurisdiction.
form-27b-6-achievement=Produce 100 __ITEM__form-27b-6__ per hour. You still have not filed your own 27B/6, naturally.
paper-pusher=Produce 1,000 __ITEM__blank-form__ per hour. The trees did not die for nothing; they died for throughput.
capsule-promise=Use 1 __ITEM__promise__. A promise is comfort to a fool and crowd control to a professional.
its-a-copy-of-a-copy=Research __TECHNOLOGY__local-precedents__. Somehow the copy is more official than the original, which is the whole thesis.
permit-denied=Build 10 __ENTITY__train-stop__. No train moves without paperwork; punctuality is now an administrative privilege.
coffee-break=Build __ENTITY__corporate-breakroom__. Finally, the critical infrastructure.
pneumatic-delivery=Research __TECHNOLOGY__pneumatic-form-transport__. Woooosh: forms through pipes, like a bank heist designed by a compliance officer.
propaganda-machine=Build __ENTITY__propaganda-distillery__. Manufacturing consent, one barrel and one carefully selected adjective at a time.
endless-meetings=Research __TECHNOLOGY__board-meetings__. This could have been an email; instead it became a technology.
union-strong=Build __ENTITY__union-headquarters__. The workers have organised. Management has opened a spreadsheet.
environmental-compliance-achievement=Research __TECHNOLOGY__environmental-compliance__. The oil and chemical economy may now proceed beneath a tasteful layer of documentation.
constitutional-scholar=Research __TECHNOLOGY__administratorio-behemoth-complaints__. You authorised bigger complaints. The achievement committee thanks you for the content.
know-it-all=Produce 1,000 __ITEM__useless-documentation__ in one game. A thousand sources, and not one answers the question.
eviction-notice-achievement=Use 100 __ITEM__eviction-notice__ in one game. Nothing personal; it is simply policy, printed at scale.
mass-transit=Have a train plan a route longer than 2,000 tiles. The journey is optional; the projected efficiency is award-winning.
first-complaint=Register your first biter at an Admin Station. They have concerns, and now they have a ticket number.
first-protest=Let a biter's frustration become a protest. You saw this coming; the dashboard saw it first.
case-closed=Resolve your first biter complaint. One down, infinity to go, all properly indexed.
protest-suppressed=Pacify a protesting biter with a Promise. The issue has been moved to a future quarter.
department-of-everything=Have 10 administration desks at once. You built a management game inside a factory game. Now manage the management.
full-resolution=Resolve each of the eight complaint types. A grievance for every occasion, and an occasion for every grievance.
behemoth-paperwork=Register a behemoth biter or spitter at an administration desk. You wanted endgame content. It wants to speak to your manager.
terms-and-conditions-apply=Research __TECHNOLOGY__vulcanus-certification__. The demolishers have retained counsel.
organically-sourced-nonsense=Research __TECHNOLOGY__gleba-conciliation__. It is, emotionally, compost.
file-not-found=Build __ENTITY__archive-recombination-bureau__. Deleting the original is now a feature, not a support ticket.
frozen-pdf=Research __TECHNOLOGY__aquilo-cryogenic-administration__. Even on Aquilo, the paperwork needs a warm introduction.
workforce-formation-achievement=Research __TECHNOLOGY__worker-formation__. The tech tree is now a career ladder. Neither comes with an exit interview.
administrative-space-station-achievement=Build __ENTITY__administrative-space-station__. Management said the overhead was too low. You took that literally.
orbital-employment-catapult-achievement=Build __ENTITY__orbital-employment-catapult__. The job advert promised a launchpad for your career.
trajectory-compliance-array-achievement=Build __ENTITY__trajectory-compliance-array__. Push asteroids with paperwork; gravity has been asked to complete a form.
senior-trajectory-compliance-array=Build __ENTITY__senior-trajectory-compliance-array__. Bigger rocks, bigger titles. Same meeting.
executive-trajectory-compliance-array=Build __ENTITY__executive-trajectory-compliance-array__. This decision has been made at a level where consequences are someone else’s job.
vesm-mass-production=Produce 10 __ITEM__voluntary-exploration-space-miner__ per hour. The application form has only one checkbox: voluntary.
orbital-permit-mill=Produce 50 __ITEM__orbital-infrastructure-permit__ per hour. Space is mostly empty. The department sees room for more forms.
chromatic-printing-achievement=Research __TECHNOLOGY__chromatic-printing__. The bureaucracy has unlocked colour. Your budget remains in the red.
chromatic-printer-achievement=Build __ENTITY__chromatic-printer__. Saving the galaxy can wait. The printer is out of cyan.
triple-ink-threat=Produce 100 __ITEM__trichromatic-permit__ per hour. Cyan, magenta, yellow, black—and somehow still no plain answer.
ink-hoarder=Produce 10,000 __ITEM__ink__ in one game. The ink budget is classified, which is why the budget meeting lasts all day.
cyan-magenta-yellow-black=Produce 1,000 __ITEM__trichromatic-permit__ in one game. Four inks for a trichromatic permit. Even the item name needs an audit.
notary-public=Build __ENTITY__notary-office__. Official seals for official deals, now with a dedicated building and absolutely no shortcuts.
territorial-arbitrator=Build __ENTITY__territorial-arbitration-post__. The demolishers have been served; the terrain is preparing a statement.
demolisher-eviction-specialist=Produce 5 __ITEM__territorial-deed__ in one game. Evicted by bureaucracy: less dramatic than dynamite, more insulting.
chartered-accountant=Produce 100 __ITEM__offworld-metallurgy-charter__ in one game. Vulcanus IP has gone interplanetary, wearing a lanyard.
conciliation-officer-achievement=Build __ENTITY__conciliation-desk__. Biology meets bureaucracy and immediately schedules a follow-up.
capture-bureau-achievement=Build __ENTITY__capture-bureau__. A job fair for hostile wildlife, with worse networking.
space-tourism-mogul=Produce 500 __ITEM__public-transportation-contract__ in one game. You invented public transport; Legal invented 500 reasons to miss it.
symbiosis-specialist=Produce 100 __ITEM__symbiosis-record__ per hour. You have industrialised specimen bookkeeping, which is a niche but real kind of power.
digital-services-bureau-achievement=Build __ENTITY__digital-services-bureau__. The queue is now electronic. This counts as eliminating the queue.
archive-recombinator=Research __TECHNOLOGY__fulgora-salvage-administration__. Someone else abandoned this paperwork. You bought the expansion to inherit it.
form-gambler=Produce 1,000 __ITEM__old-archive__ in one game. Archaeology, but every discovery could have been an email.
relay-clerk-corps=Produce 10 __ITEM__relay-clerk__ in one game. Electromagnetic routing specialists, reporting for duty and somehow still copying people on every email.
laser-printer-achievement=Build __ENTITY__laser-printer__. Liquid ink has failed Aquilo's dress code; solid media understood the assignment.
thermal-paper-pusher=Produce 5,000 __ITEM__thermal-transfer-sheet__ in one game. Premium substrate for a planet that made “paperwork, but frozen” a lifestyle.
ribbon-collector=Produce 2,000 __ITEM__composite-chroma-ribbon__ in one game. Compressed colour for the colourless void, which is still somehow under-documented.
interplanetary-correspondent=Produce 50 __ITEM__unified-operations-charter__ in one game. You have coordinated four worlds into one very expensive group chat.
cyan-yellow-bureaucrat=Produce 500 __ITEM__cyan-yellow-form__ in one game. Vulcanus and Gleba, merged without either department agreeing on naming.
cyan-magenta-bureaucrat=Produce 500 __ITEM__cyan-magenta-form__ in one game. Vulcanus and Fulgora, heat-sealed against both damage and accountability.
yellow-magenta-bureaucrat=Produce 500 __ITEM__yellow-magenta-form__ in one game. Gleba and Fulgora, biologically archived and electrically overexplained.
hardened-data-hoarder=Produce 100 __ITEM__hardened-data-vault__ in one game. Data custody for the apocalypse, because a backup without a committee is just optimism.
bureaucratic-transcendence-achievement=Research __TECHNOLOGY__bureaucratic-transcendence__. Transit paperwork is no longer the bottleneck; this is how every new bottleneck gets promoted.
form-free-transit=Build 50 __ENTITY__public-train-stop__. Trains that just work: a miracle so profound it required late-game research.
maxed-out-orbital-capacity=Research __TECHNOLOGY__orbital-employment-capacity-4__. Five miners per asteroid. HR has discovered density.
maxed-out-orbital-damage=Research __TECHNOLOGY__orbital-employment-damage-5__. Your miners now hit like a ton of bricks with performance targets.
speed-demon-arrays=Research __TECHNOLOGY__trajectory-compliance-speed-9__. A deviation order every 1.5 seconds. Marking everything urgent has finally worked.
executive-jurisdiction=Research __TECHNOLOGY__trajectory-compliance-jurisdiction-3__. Every asteroid size, no appeals, no ombudsman.
vulcanus-export-licensed=Research __TECHNOLOGY__vulcanus-export-charters__. Metallurgy goes interplanetary; the licence travels better than the lava.
cyan-yellow-merged=Research __TECHNOLOGY__cyan-yellow-bureaucracy__. Two planets, one form, twice the stakeholders.
cyan-magenta-merged=Research __TECHNOLOGY__cyan-magenta-bureaucracy__. Metallurgy meets electromagnetics and both request a sign-off.
yellow-magenta-merged=Research __TECHNOLOGY__yellow-magenta-bureaucracy__. Biology meets salvage, which is either innovation or a warning label.
boots-on-the-ground=Build __ENTITY__field-office__. You automated the factory and invented a commute.
human-resources=Produce 10 __ITEM__biter-logistics-formation__ in one game. The department name has survived the complete absence of humans.
last-mile-management=Build __ENTITY__biterport__. The delivery network has legs. Management still takes the credit.
company-car=Build __ENTITY__rideable-biter__. The company vehicle has requested dental coverage.
business-class=Build __ENTITY__passenger-wagon__. Your complaints now travel together. This is called networking.
middle-management=Build __ENTITY__personnel-routing-multisign__. Three directions, one manager, and everyone else does the walking.
per-my-last-prompt=Build __ENTITY__ai-server__. You automated the emails that should have replaced the meetings.
procedurally-generated-excuses=Produce 1,000 __ITEM__administrative-slop__ in one game. An AI wrote the paperwork. Another AI will congratulate it.
manufactured-consent=Build __ENTITY__synthetic-personnel-bureau__. The job advert said you would help shape the next employee.
mandatory-team-building=Build __ENTITY__involuntary-relocation-cannon__. Attendance is compulsory. Travel is ballistic.
