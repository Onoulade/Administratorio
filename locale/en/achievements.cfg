[achievement-description]
tube-terminus=Build an Interplanetary Terminus. You have invented paperwork diplomacy, a slower and narrower version of diplomacy with better circuit signals.
chromatic-trunk=Research the Chromatic Tube Trunk. At last, your interplanetary bureaucracy can discriminate in full colour.
research-with-promethium=Research a technology using Administratorium science packs. The shattered planet has been peer-reviewed and found economically interesting.
terms-and-conditions-apply=Formalise Vulcanus certification and begin litigating with the landscape. The demolishers have retained counsel.
organically-sourced-nonsense=Formalise Gleba conciliation while insisting the paperwork is biodegradable. It is, emotionally, compost.
file-not-found=Build an Archive Reassignment Recycler. The originals will not be returned; they have been strategically recontextualised.
frozen-pdf=Unlock Aquilo's chromatic trunk and stop piping liquid ink into a freezer. A triumph of applied thermodynamics and basic self-respect.
workforce-formation-achievement=Research Workforce Formation. Your biters now have career paths, performance reviews, and absolutely no escape from either.
administrative-space-station-achievement=Build an Administrative Space Station. You took paperwork to orbit because ground-level inefficiency was not ambitious enough.
orbital-employment-catapult-achievement=Build an Orbital Miner Deployment Catapult. It is a railgun for HR, which is exactly as unsettling as it sounds.
trajectory-compliance-array-achievement=Build a Trajectory Compliance Array. Push asteroids with paperwork; gravity has been asked to complete a form.
senior-trajectory-compliance-array=Build a Senior Trajectory Compliance Array. Big rocks need senior stakeholders and correspondingly larger forms.
executive-trajectory-compliance-array=Build an Executive Trajectory Compliance Array. No asteroid appeals this decision, and no asteroid has calendar access.
vesm-mass-production=Produce 10 Voluntary Exploration Space Miners per hour. That is a lot of resumes to launch into the void.
asteroid-miner-veteran=Recover 100 Returning Voluntary Space Miners. Welcome back; please complete the re-entry survey.
orbital-permit-mill=Produce 50 Orbital Infrastructure Permits per hour. Space construction requires space forms, because vacuum does not exempt you from compliance.
chromatic-printing-achievement=Research Chromatic Printing. The administrative state now supports brand guidelines.
chromatic-printer-achievement=Build a Chromatic Printer. Four ink tanks, zero compromises, one extremely judgmental maintenance schedule.
triple-ink-threat=Produce 100 Trichromatic Permits per hour. Cyan, magenta, yellow, black—and somehow still no plain answer.
ink-hoarder=Produce 10,000 Ink. The ink budget is classified, which is why the budget meeting lasts all day.
cyan-magenta-yellow-black=Produce 1,000 Composite Chroma Ribbons. All the colours of the bureaucratic rainbow, compressed for management.
notary-public=Build a Notary Office. Official seals for official deals, now with a dedicated building and absolutely no shortcuts.
territorial-arbitrator=Build a Territorial Arbitration Post. The demolishers have been served; the terrain is preparing a statement.
demolisher-eviction-specialist=Earn 5 Territorial Deeds. Evicted by bureaucracy: less dramatic than dynamite, more insulting.
chartered-accountant=Produce 100 Offworld Metallurgy Charters. Vulcanus IP has gone interplanetary, wearing a lanyard.
conciliation-officer-achievement=Build a Conciliation Desk. Biology meets bureaucracy and immediately schedules a follow-up.
capture-bureau-achievement=Build a Capture Bureau. A job fair for hostile wildlife, with worse networking.
space-tourism-mogul=Produce 500 Public Transportation Contracts. Space tourism: now with waivers, receipts, and no refund policy.
symbiosis-specialist=Produce 100 Symbiosis Records per hour. You have industrialised specimen bookkeeping, which is a niche but real kind of power.
digital-services-bureau-achievement=Build a Digital Services Bureau. Twenty-four-hour uptime, zero coffee breaks, and one very concerned power grid.
archive-recombinator=Build an Archive Recombination Bureau. One form in, three maybes out: probability wearing a tie.
form-gambler=Process 1,000 Old Archives. The house always wins, but occasionally the house issues a permit.
relay-clerk-corps=Train 10 Relay Clerks. Electromagnetic routing specialists, reporting for duty and somehow still copying people on every email.
laser-printer-achievement=Build a Laser Printer. Liquid ink has failed Aquilo's dress code; solid media understood the assignment.
thermal-paper-pusher=Produce 5,000 Thermal Transfer Sheets. Premium substrate for a planet that made “paperwork, but frozen” a lifestyle.
ribbon-collector=Produce 2,000 Composite Chroma Ribbons. Compressed colour for the colourless void, which is still somehow under-documented.
interplanetary-correspondent=Produce 50 Unified Operations Charters. You have coordinated four worlds into one very expensive group chat.
cyan-yellow-bureaucrat=Produce 500 Cyan-Yellow Forms. Vulcanus and Gleba, merged without either department agreeing on naming.
cyan-magenta-bureaucrat=Produce 500 Cyan-Magenta Forms. Vulcanus and Fulgora, heat-sealed against both damage and accountability.
yellow-magenta-bureaucrat=Produce 500 Yellow-Magenta Forms. Gleba and Fulgora, biologically archived and electrically overexplained.
hardened-data-hoarder=Produce 100 Hardened Data Vaults. Data custody for the apocalypse, because a backup without a committee is just optimism.
bureaucratic-transcendence-achievement=Research Bureaucratic Transcendence. Transit paperwork is no longer the bottleneck; this is how every new bottleneck gets promoted.
form-free-transit=Build 50 Public Train Stops. Trains that just work: a miracle so profound it required late-game research.
maxed-out-orbital-capacity=Research Orbital Employment Capacity 4. Five miners per asteroid. HR has discovered density.
maxed-out-orbital-damage=Research Orbital Employment Damage 5. Your miners now hit like a ton of bricks with performance targets.
speed-demon-arrays=Research Trajectory Compliance Speed 9. Fire deviation orders every half second; the asteroid's inbox is untenable.
executive-jurisdiction=Research Trajectory Compliance Jurisdiction 3. Every asteroid size, no appeals, no ombudsman.
vulcanus-export-licensed=Research Vulcanus Export Charters. Metallurgy goes interplanetary; the licence travels better than the lava.
cyan-yellow-merged=Research Cyan-Yellow Bureaucracy. Two planets, one form, twice the stakeholders.
cyan-magenta-merged=Research Cyan-Magenta Bureaucracy. Metallurgy meets electromagnetics and both request a sign-off.
yellow-magenta-merged=Research Yellow-Magenta Bureaucracy. Biology meets salvage, which is either innovation or a warning label.
welcome-to-the-department=Build your first Biter Administration Desk. Your cubicle awaits; the biter has concerns.
discovery-of-bullshit=Research Discovery of Bullshit. It was under your feet the whole time, which explains several industries.
ink-stained=Research Printing Technology. The printer is jammed again; the printer denies jurisdiction.
form-27b-6-achievement=Produce 100 Form 27B/6 per hour. You still have not filed your own 27B/6, naturally.
paper-pusher=Produce 1,000 Blank Forms per hour. The trees did not die for nothing; they died for throughput.
capsule-promise=Use a Promise Capsule. A promise is comfort to a fool and crowd control to a professional.
its-a-copy-of-a-copy=Research Local Precedents. Somehow the copy is more official than the original, which is the whole thesis.
permit-denied=Build 10 train stops. No train moves without paperwork; punctuality is now an administrative privilege.
coffee-break=Build a Corporate Breakroom. Finally, the critical infrastructure.
pneumatic-delivery=Research Pneumatic Form Transport. Woooosh: forms through pipes, like a bank heist designed by a compliance officer.
propaganda-machine=Build a Propaganda Distillery. Manufacturing consent, one barrel and one carefully selected adjective at a time.
endless-meetings=Research Board Meetings. This could have been an email; instead it became a technology.
union-strong=Build a Union Headquarters. The workers have organised. Management has opened a spreadsheet.
environmental-compliance-achievement=Research Environmental Compliance. The oil and chemical economy may now proceed beneath a tasteful layer of documentation.
constitutional-scholar=Research Constitutional Law. You have read every regulation. Allegedly.
know-it-all=Research all technologies. Congratulations, you are overqualified and still need a permit.
eviction-notice-achievement=Use 100 Eviction Notices. Nothing personal; it is simply policy, printed at scale.
mass-transit=Have a train travel more than 2,000 tiles. Every stop had paperwork, because distance only makes the forms stronger.
first-complaint=Register your first biter at an Admin Station. They have concerns, and now they have a ticket number.
first-protest=Let a biter's frustration become a protest. You saw this coming; the dashboard saw it first.
case-closed=Resolve your first biter complaint. One down, infinity to go, all properly indexed.
protest-suppressed=Pacify a protesting biter with a Promise. The issue has been moved to a future quarter.
department-of-everything=Power 10 Admin Stations at once. The bureaucracy expands to meet the needs of the bureaucracy expanding.
full-resolution=Resolve each of the eight complaint types. A grievance for every occasion, and an occasion for every grievance.
behemoth-paperwork=Register a behemoth biter at an Admin Station. That is not a complaint; it is a capital project.
