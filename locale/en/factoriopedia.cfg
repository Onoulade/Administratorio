paired-unlocks=Unlocks both production routes for paired recipes: the original route and regulated assembly. Open the product in Factoriopedia to compare their ingredients, batches and machines.
acquire-enrolled=On Nauvis, put 1 [item=job-offer] in the citizen's [entity=admin-station] slot before final resolution. Only biters can enroll. The offer is consumed on every attempt; success replaces the money payout with 1 [item=enrolled-biter]. Acceptance by frustration: up to 50% → 75%; over 50% to 75% → 50%; over 75% to 90% → 25%; over 90% → 0%. Train the recruit at a [entity=formation-center].
acquire-worker-base=Put 1 [item=job-offer] in the citizen's [entity=admin-station] slot before final resolution. A resolved biter or spitter accepts and replaces the money payout with [item=worker-biter]: small 1, medium 2, big 3, behemoth 5.
acquire-worker-space=Training on Nauvis: use __1__ at a [entity=formation-center] with [item=enrolled-biter] and [item=provisional-approval].\nDirect capture: a [entity=capture-bureau] supplied with [fluid=workforce-lure-spores] converts each arriving biter into 1 [item=worker-biter], regardless of size. It attracts wildlife within 48 tiles and consumes 1 lure per second. Capture requires free output space.
acquire-workforce=Supply [entity=capture-bureau] with [fluid=workforce-lure-spores] to attract biters within 48 tiles. Each arriving biter becomes 1 [item=worker-biter], regardless of size. Lure consumption: 1 per second, including while waiting. Keep output space available. The lure fluid selects the mode; keep other lure fluids out of the shared supply.
acquire-tourism=Supply [entity=capture-bureau] with [fluid=tourism-lure-spores] to attract spitters within 48 tiles. Each arrival becomes a matching package: [item=small-spitter-tourism-package] [item=medium-spitter-tourism-package] [item=big-spitter-tourism-package] [item=behemoth-spitter-tourism-package]. Lure consumption: 1 per second, including while waiting. Keep output space available. Launch packages before they spoil, then process them at [entity=administrative-space-station]. The lure fluid selects the mode.
acquire-tourism-package=Capture __1__ at a [entity=capture-bureau] supplied with [fluid=tourism-lure-spores]. One captured spitter yields one size-matched package. Attraction radius: 48 tiles; lure consumption: 1 per second; free output space required. Spoils after __2__ minutes into a hostile spitter. Launch it and process it at [entity=administrative-space-station] before that happens.
acquire-eggs-sampling=First eggs on Gleba: throw [item=pentapod-sampling-capsule] directly at a wild pentapod. Small / medium / big yield 1 / 2 / 4 [item=pentapod-egg]. The creature survives; its sampling cooldown is 30 seconds. An early repeat returns the capsule.
acquire-eggs-capture=Wild harvest: supply [entity=capture-bureau] with [fluid=oviposition-lure-spores] to attract pentapods within 48 tiles. Small / medium / big yield 1 / 2 / 4 [item=pentapod-egg] and consume 5 / 8 / 12 lure per capture. No idle lure drain. Requires enough lure and free output space. The lure fluid selects the mode.
acquire-eggs-breeding=Renewable breeding: research [technology=pentapod-egg-cultivation], then run [recipe=pentapod-egg] in a [entity=biochamber]. Sampling and capture supply the first eggs. Eggs spoil and can hatch into hostile pentapods.
