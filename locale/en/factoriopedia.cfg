cross-planet-cyan=[font=default-bold]Origin:[/font] Vulcanus. [font=default-bold]Role:[/font] cyan/tungsten jurisdiction. [font=default-bold]Remote supply:[/font] use off-world when its recipe allows it; send by rocket until Aquilo unlocks the chromatic trunk.
cross-planet-yellow=[font=default-bold]Origin:[/font] Gleba. [font=default-bold]Role:[/font] yellow/biological jurisdiction. [font=default-bold]Remote supply:[/font] it spoils; send finished forms by rocket until Aquilo unlocks the chromatic trunk.
cross-planet-magenta=[font=default-bold]Origin:[/font] Fulgora. [font=default-bold]Role:[/font] magenta/holmium jurisdiction. [font=default-bold]Remote supply:[/font] send by rocket until Aquilo unlocks the chromatic trunk.
cross-planet-cyan-yellow=[font=default-bold]Jurisdictions:[/font] Vulcanus + Gleba. This is an explicit two-planet recipe requirement. Chromatic-trunk payload only after Aquilo research.
cross-planet-cyan-magenta=[font=default-bold]Jurisdictions:[/font] Vulcanus + Fulgora. This is an explicit two-planet recipe requirement. Chromatic-trunk payload only after Aquilo research.
cross-planet-yellow-magenta=[font=default-bold]Jurisdictions:[/font] Gleba + Fulgora. This is an explicit two-planet recipe requirement. Chromatic-trunk payload only after Aquilo research.
cross-planet-vulcanus-charter=[font=default-bold]Origin:[/font] Vulcanus. Explicitly authorizes the named metallurgical process away from Vulcanus. Colored-trunk payload only after Aquilo research.
cross-planet-aquilo=[font=default-bold]Origin:[/font] Aquilo. Required for cryogenic infrastructure. This document needs the chromatic trunk tier, not the base Terminus.
cross-planet-trichromatic=[font=default-bold]Origin:[/font] Aquilo. Explicitly represents Vulcanus + Gleba + Fulgora convergence. Chromatic-trunk payload only.
cross-planet-unified=[font=default-bold]Origin:[/font] Aquilo. Explicitly represents a four-world Vulcanus + Gleba + Fulgora + Aquilo dependency.
