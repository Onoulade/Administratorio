[fluid-description]
politician-fluid=A viscous, foul-smelling fluid extracted from natural fissures. Refine it in a Propaganda Distillery to obtain Liquid Lies.
lie=Distilled deception in liquid form. A critical ingredient for misinformation, good excuses, white papers, and slush funds.
misinformation=Weaponized falsehood in fluid form. Synthesized from lies and dubious data. Used in justifications and policy production.
union-approval=Liquid workforce consent. Negotiated at the Union Headquarters using coffee, paper, data, and taxpayer money.
liquid-coffee=Brewed administrative coffee. The universal lubricant of bureaucracy. Required for approvals, gossip, and resolutions.
slush-fund=Laundered public funds in fluid form. Produced from treasury bonds and lies through propaganda processing.
amber-sap=A sticky Gleba secretion pumped from amber seep fields. It underwrites the planet's cheap nonsense, local black ink, and yellow-form bureaucracy.
liquid-black-ink=Pressurized black writing fluid prepared for chromatic piping and high-throughput liquid-fed printers.
cyan-slurry=A rough mineral suspension extracted from verdigris crust. Refinable into Vulcanus cyan ink and some dubious notarization byproducts.
cyan-ink=The Vulcanus chromatic channel. Fed into Chromatic Printers for local permit and charter drafts.
yellow-ink=The Gleba chromatic channel. Produced from amber sap and biology, then fed into Chromatic Printers for the planet's compact yellow form family.
magenta-ink=The Fulgora chromatic channel. Prepared from salvage toner and documentation for digital processing, archive recovery, and holmium-gating paperwork.
hostile-spore-culture=A Gleba-grown spore base that can be specialized into Capture Bureau lure fluids.
workforce-lure-spores=A job-offer scented lure cloud. Feed it into a Capture Bureau to attract biters for worker intake.
tourism-lure-spores=A transit-scented lure cloud. Feed it into a Capture Bureau to attract spitters for tourism packaging.
oviposition-lure-spores=An experimental Gleba lure cloud. Feed it into a Capture Bureau to attract pentapods for egg harvest.

