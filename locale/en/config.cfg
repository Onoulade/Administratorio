efficiency-module=Craft an Embezzlement Module 1 (Efficiency) from crappy reports and electronic circuits.
efficiency-module-2=Upgrade: requires 4 tier-1 modules, white papers, and advanced circuits.
efficiency-module-3=Upgrade: requires 4 tier-2 modules, policies, processing units, compacted rubble, and credentials.
union-approval-production=Negotiate union approval using coffee, paper, data, and taxpayer money.
