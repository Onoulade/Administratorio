signal-complaint-s=Tracks active smog cases. If this number is climbing, so is your pollution.
signal-complaint-n=Monitors noise complaint backlog. Tends to spike when you build too many machines too close to nests.
signal-complaint-u=Counts unemployment filings. Only behemoth biters file these — a rising count means evolution is outpacing your pipeline.
signal-complaint-lt=Tracks littering complaints from spitters. The acid puddle constituency has concerns.
signal-complaint-h=Monitors hazmat cases. Rising numbers mean your chemical infrastructure is generating attention.
signal-complaint-lo=Counts loitering filings. The restricted-area violations are piling up.
signal-complaint-v=Tracks vagrancy complaints — the heaviest spitter tier. If this number is moving, you need more resolution capacity.
signal-available-slots=How many desk slots are open across connected stations. When this hits zero, protests start.
signal-total-waiting=How many biters are currently in line. The higher this gets, the closer you are to a very bad day.
