iron-plate-batch=Smelt 10 iron ore into 10 iron plates using a carbon offset certificate. For stone and electric furnaces.
copper-plate-batch=Smelt 10 copper ore into 10 copper plates using a carbon offset certificate. For stone and electric furnaces.
steel-plate-batch=Process 25 iron plates into 5 steel plates using a carbon offset certificate. For stone and electric furnaces.
stone-brick-batch=Process 20 stone into 10 bricks using a carbon offset certificate. For stone and electric furnaces.
greenhouse-wood=Grow wood using water in a greenhouse. Steady and sustainable.
greenhouse-discovery=Rummage through wet compost for rare coffee beans. 10% chance per cycle. You recover some wood either way, but never as much as you put in.
synthetic-paper-production=Extrude synthetic paper from plastic, sulfur, and water. Faster than greenhouse-grown wood paper, but significantly more resource-hungry.
coffee-plantation=Cultivate coffee beans using beans and water. Triples your bean supply.
coffee-refining=Brew coffee with beans, water, and a work order. Simple paperwork, immediate results.
corporate-breakroom-production=Build a corporate breakroom for generating watercooler gossip.
watercooler-gossip-production=Generate watercooler gossip from liquid coffee and dubious data. Essential for corporate decision-making.
osha-scrubbing=Process OSHA violations at the resolution office with refined nonsense and union approval to produce justifications.
osha-violation-recycling=Bulk-recycle OSHA violations at the Union HQ, recovering random forms and intermediaries. Cheaper than scrubbing but less predictable.
office-drama-recycling=Process office drama with coffee at the breakroom to randomly recover work orders, watercooler gossip, and basic excuses.
resolution-office-production=Build a 3x3 resolution office for processing complaint resolutions and permits.
copy-blank-form=Duplicate blank forms: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies. Small chance of waste paper.
copy-blank-approval=Duplicate blank approval forms: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies.
copy-blank-directive=Duplicate blank directive forms: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies.
copy-carbon-offset-certificate=Duplicate carbon offset certificates: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies. Requires Industrial Printer.
copy-form-27b-6=Duplicate Form 27B-6: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies. Requires Industrial Printer.
copy-environmental-impact-report=Duplicate environmental impact reports: 1 original + 5 paper + 1 ink cartridge + 1 advanced circuit produces 6 copies. Requires Industrial Printer.
copy-work-order=Duplicate basic work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-safety-work-order=Duplicate safety work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-construction-work-order=Duplicate construction work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-management-verbal-work-order=Duplicate verbal management work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-management-written-work-order=Duplicate written management work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-research-grant-work-order=Duplicate research grant work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-chemical-handling-work-order=Duplicate chemical handling work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
copy-radiological-work-order=Duplicate radiological work orders at the Industrial Printer: 1 original + 5 paper + 1 ink + 1 processing unit produces 6 total copies.
office-desk-production=Build an administrative office desk for filing and supply crafting.
admin-station-production=Build the central 5x5 resolution station for processing high-tier cases.
union-headquarters-production=Build the first Union Headquarters from treasury bonds and verbal paperwork, then use it to negotiate workforce approval, grants, and late executive policy.
propaganda-distillery-production=Build a propaganda distillery for processing administrative fluids like lies and misinformation.
greenhouse-production=Build a greenhouse for wood and coffee production.
printer-t1-production=Build a basic electric printer for ink-based document production.
printer-t2-production=Build an industrial printer with copy capability. Requires a basic printer and advanced circuits as components.
mechanical-printer-production=Assemble a mechanical printer from iron, stone, and paper. A reliable early-game upgrade.
pneumatic-pipe-production=Produce sealed pneumatic pipes from iron and compacted rubble. For paperwork transport only.
pneumatic-pipe-to-ground-production=Produce underground pneumatic pipes. 16-tile underground range.
tube-intake-production=Build a tube intake station. Consumes paperwork items for instant pneumatic transport.
tube-outtake-production=Build a tube outtake station. Dispenses paperwork items from the pneumatic signal network.
speed-module=Craft a Subpoena Module 1 (Speed) from basic excuses and electronic circuits.
speed-module-2=Upgrade: requires 4 tier-1 modules, good excuses, and advanced circuits.
speed-module-3=Upgrade: requires 4 tier-2 modules, narratives, processing units, compacted rubble, and credentials.
productivity-module=Craft an Audit Module 1 (Productivity) from dubious data and electronic circuits.
productivity-module-2=Upgrade: requires 4 tier-1 modules, data, and advanced circuits.
productivity-module-3=Upgrade: requires 4 tier-2 modules, justifications, processing units, compacted rubble, and credentials.
efficiency-module=Craft an Embezzlement Module 1 (Efficiency) from crappy reports and electronic circuits.
efficiency-module-2=Upgrade: requires 4 tier-1 modules, white papers, and advanced circuits.
efficiency-module-3=Upgrade: requires 4 tier-2 modules, policies, processing units, compacted rubble, and credentials.
union-approval-production=Negotiate union approval using coffee, paper, data, and taxpayer money.
treasury-bond-production=Issue a treasury bond from taxpayer money, blank forms, and useless documentation.
government-grant-production=Secure a government grant from treasury bonds, a crappy report, and verbal management approval. Crafted at the Union Headquarters.
tax-audit=Reclassify slush funds using the underlying treasury bond paperwork, documentation, and data into a much larger amount of Taxpayer Money. Corrupt, but effective.
slush-fund-production=Launder treasury bonds with lies into a slush fund.
useless-documentation-production=Wrap redundant rubble in layers of paper. The result is officially documented uselessness, required for filing and financial instruments.
compacted-rubble-production=Compress redundant rubble under certified conditions. Requires a carbon offset certificate. Used in building construction and module manufacturing.
charcoal-production=Batch-burn wood in a furnace with a carbon offset certificate to produce coal. A renewable source of coal when paired with greenhouses.
refined-nonsense-production=Fuse compacted rubble with liquid misinformation to produce pure refined nonsense. The essential ingredient for high-tier bureaucratic processes.
overtime-exemption=Issue a night-work exemption for a single administrative building. Requires a productivity module, a pile of public funding, and enough coffee to keep the lights on legally.

