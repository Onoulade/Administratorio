[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Welcome to Administratorio.[/font]\n\nThis mod replaces military conflict with bureaucracy. Biters and spitters do not attack — they queue. They walk to your [entity=admin-station] admin desks, file complaints, wait, and either get processed or start protesting. You survive by keeping the paperwork moving.\n\n[font=default-bold]The core loop:[/font]\n1. Biters arrive and register at an admin desk\n2. Each biter generates a [item=ticket-landscape] complaint ticket in the desk\n3. Process tickets through your paperwork pipeline\n4. Return the matching resolved item to the desk that biter is sitting at\n5. The biter leaves and pays you [item=taxpayer-money] Taxpayer Money\n\nIf the queue overflows or biters get bored waiting, they protest and shut down nearby buildings. The rest of these tips explain the tools you use to keep that from happening.
administratorio-biter-complaints=[font=default-bold]The admin desk is where biters become revenue.[/font]\n\nBiters and spitters reaching an [entity=admin-station] stop attacking and queue up instead. The waiting zone around each desk holds up to 12 biters, with 4 active service slots.\n\n[font=default-bold]How a citizen flows through:[/font]\n1. The biter sits in a slot and a [item=ticket-landscape] complaint ticket appears in the desk inventory\n2. You pull the ticket out and run it through the [entity=resolution-office] Resolution Office to produce a final [item=resolved-landscape] resolved item\n3. You insert the resolved item into the same slot the biter is sitting in\n4. The biter leaves and drops [item=taxpayer-money] Taxpayer Money into the desk\n\n[item=taxpayer-money] Taxpayer Money is the only way to fund dispatch buildings, capsules, and most expansion. The faster you process complaints, the faster your economy moves.\n\n[font=default-bold]Tip:[/font]\nEach desk emits circuit signals for ticket counts per type, free slots, and total waiting biters. Wire them up to scale capacity automatically before the queue overflows.
administratorio-frustration=[font=default-bold]Every waiting biter is on a frustration timer.[/font]\n\nFrustration ticks up while a biter queues or walks toward a desk. Hover any biter to read its current mood. At [color=red]100%[/color] it leaves the queue, picks a nearby player building, walks over, and disables it — that's a protest. Biters that arrive when no slot is free can skip the wait and protest immediately.\n\n[font=default-bold]Bureaucratic Promise:[/font]\n[item=promise] Promises are a starting throwable. Throw one at the [color=red]protesting biter[/color] (not the building it's targeting):\n• If a desk slot has freed up, the biter heads back into the queue\n• If everything is full, the biter is pacified for 60 seconds and then resumes protesting\n• A promise [color=red]does not[/color] erase the complaint or reset case progress\n\n[font=default-bold]Permanent fix:[/font]\nPromises buy time. The only way to actually clear a citizen is to finish their case and return the resolved item to the desk slot they're sitting in. Stay ahead by adding desks before the queue fills, and by scaling resolution throughput so cases finish faster than frustration accumulates.
administratorio-nest-expropriation=[font=default-bold]Eviction Notices destroy a nest and dump its biters into your queue.[/font]\n\nThrow [item=eviction-notice] Eviction Notices at enemy territory. The nearest spawner in the impact area is destroyed — that's how you reclaim land in this mod.\n\n[font=default-bold]The catch:[/font]\nBiters within roughly [font=default-bold]25 tiles[/font] of the destroyed spawner are not killed. They are [color=red]displaced into your complaint system[/color] and arrive with [font=default-bold]50% starting frustration[/font]. If your desks are full, expect them to start protesting almost immediately.\n\n[font=default-bold]Plan around the load spike:[/font]\nOnly evict when you have spare desk capacity and resolution throughput to absorb the displaced wave. For temporary nest suppression without displacement, use [item=hush-money] Hush Money instead.
administratorio-hush-money=[font=default-bold]A throwable that buys safe passage near nests.[/font]\n\nThrow [item=hush-money] Hush Money at an enemy nest. Spawners inside the effect radius are temporarily silenced for [font=default-bold]3 minutes[/font] and a green money smog marks the suppressed area. After the timer ends, the spawners come back exactly where they were.\n\n[font=default-bold]Use it for:[/font]\n• Walking through enemy territory to scout, lay rail, or place pipes\n• Buying a few minutes of quiet while the complaint queue catches up\n• Suppressing a nest [color=green]without[/color] dumping its biters into your queue\n\nThis is the key difference from [item=eviction-notice] Eviction Notices: hush money does not displace nearby biters into your complaint system. It costs [item=taxpayer-money] Taxpayer Money per capsule, so use it as a tactical tool rather than a permanent solution.
administratorio-working-hours=[font=default-bold]Several buildings stop running at night.[/font]\n\nPaperwork-producing buildings — [entity=office-desk] Office Desk, [entity=corporate-breakroom] Corporate Breakroom, [entity=union-headquarters] Union Headquarters — shut down between dusk and dawn. Dispatch buildings — [entity=biter-station] Biter Stations, [entity=biterport] Biterports, [entity=field-office] Field Offices — stop sending biters out.\n\n[font=default-bold]Two ways to keep things running at night:[/font]\n• [font=default-bold]Office buildings[/font] — install one [item=overtime-exemption] Overtime Exemption in the building's module slot. One copy is enough; extras do nothing.\n• [font=default-bold]Dispatch buildings[/font] — pipe [fluid=liquid-coffee] Liquid Coffee into the rear input. Each night dispatch consumes a unit of coffee.\n\n[font=default-bold]Why it matters:[/font]\nDay throughput is intentionally higher than night throughput. The mechanic exists to push you to surge during office hours rather than drip-feed paperwork 24/7. Protests still disable buildings even with overtime clearance — overtime buys you the night, not the queue.\n\nIf you dislike the mechanic entirely, disable Working Hours in startup settings before loading the mod.
administratorio-biter-employment=[font=default-bold]Resolved biters can be hired instead of released.[/font]\n\nNormally, a biter pays you and walks away when its case resolves. If you place a [item=job-offer] Job Offer in the desk slot before the resolution lands, the biter picks the offer up instead of leaving and becomes a [item=biter-worker] Biter Worker — a usable item in the desk inventory.\n\n[font=default-bold]How to hire:[/font]\n1. Craft a [item=job-offer] Job Offer\n2. Insert it into the slot of the biter you want to hire\n3. Resolve that biter's complaint as normal — the offer is consumed and a worker drops into the desk\n\n[font=default-bold]Yield by size:[/font]\nLarger enemies produce more workers per hire:\n• Small → 1 • Medium → 2 • Big → 3 • Behemoth → 5\nSpitters follow the same scale.\n\nThe hire happens [color=red]instead of[/color] the cash payout, so each job offer is a tradeoff between immediate [item=taxpayer-money] revenue and long-term workforce.
administratorio-biter-workers=[font=default-bold]Biter Workers are stored items that authorize managed machines.[/font]\n\nA [item=biter-worker] sits in a [entity=biter-station] until the station dispatches it to a managed building. The visit authorizes one craft cycle, then the worker walks back to be redispatched. The whole assembler-style production tree runs on this loop.\n\n[font=default-bold]Specialists (built at the [entity=formation-center]):[/font]\nSome buildings cannot be constructed with regular workers — they require trained specialists, all produced at the Formation Center from base workers plus the right paperwork:\n• [item=union-delegate] Union Delegate — to construct the [entity=union-headquarters] Union Headquarters\n• [item=chemical-operator] Chemical Operator — to construct [entity=chemical-plant] Chemical Plants and [entity=oil-refinery] Oil Refineries\n• [item=nuclear-technician] Nuclear Technician — to construct [entity=centrifuge] Centrifuges and nuclear reactors\n• [item=biter-logistics-formation] Biter Logistics Formation — the unit that staffs [entity=biterport] Biterports\n• [item=rideable-biter] Rideable Biter — converts a worker into a personal mount\n\n[font=default-bold]Important:[/font]\nSpecialists are consumed when [color=red]constructing[/color] the target building, not during operation. Once placed, the building runs on regular paperwork like everything else. Plan your specialist supply for build orders, not throughput.
administratorio-rideable-biter=[font=default-bold]A personal vehicle that runs on Taxpayer Money.[/font]\n\nDeploy a [item=rideable-biter] Rideable Biter to ride a worker as a mount. It burns [item=taxpayer-money] from its fuel slot to stay assigned and has only a tiny cargo pouch.\n\n[font=default-bold]Operating rules:[/font]\n• Once placed it [color=red]cannot be mined or deconstructed[/color] — it leaves on its own\n• When unattended, it may wander a short distance\n• If its fuel slot stays empty for [font=default-bold]10 minutes[/font], the contract lapses\n\n[font=default-bold]What happens when funding lapses:[/font]\nThe biter reverts to a wild [entity=medium-biter] and enters the complaint system. If a desk has free capacity it queues normally. If everything is full, it protests like any other unserved citizen — including, potentially, the building you parked it next to.\n\nKeep a few coins in the saddle.
administratorio-biter-station=[font=default-bold]The Biter Station dispatches workers across its coverage zone.[/font]\n\nLoad the [entity=biter-station] with [item=biter-worker] workers and [item=taxpayer-money] Taxpayer Money. It sends workers out to managed buildings inside its zone — each visit lets the target run one craft cycle, then the worker returns. Stations with overlapping zones serve the same buildings more often.\n\nHover any managed building to see which station(s) are dispatching to it. Hover the station itself for live zone coverage, slot counts, and dispatch status.\n\n[font=default-bold]Two upgrade tracks:[/font]\n• [font=default-bold]Inventory capacity[/font] — research expands the station's worker storage in steps, from 10 up to 50 slots. Bigger stations buffer more dispatches before going idle.\n• [font=default-bold]Labor Efficiency[/font] — by default a worker authorizes [font=default-bold]1 machine per trip[/font]. Research raises this to 3, then 5 machines per trip. Combined with overlapping zones, this scales smoothly into dense factory layouts.\n\n[font=default-bold]At night:[/font]\nEach dispatch additionally consumes [fluid=liquid-coffee] Liquid Coffee from the rear pipe input. No coffee, no night dispatches.\n\n[font=default-bold]Economy note:[/font]\nFewer trips means fewer paychecks. Labor Efficiency upgrades reduce [item=taxpayer-money] cost per unit of output, not just dispatch frequency.
administratorio-biterport=[font=default-bold]The Biterport is a walking-biter version of a roboport.[/font]\n\nLoad it with [item=biter-logistics-formation] Biter Logistics Formations (built at the [entity=formation-center] Formation Center) and [item=taxpayer-money] Taxpayer Money. Workers walk out to ferry items between logistic chests and to build entity ghosts inside the coverage area.\n\n[font=default-bold]Coverage:[/font]\n• Logistics radius: [font=default-bold]25 tiles[/font]\n• Construction radius: [font=default-bold]55 tiles[/font]\n• Network range: ports within [font=default-bold]50 tiles[/font] of each other share their worker pool — they do not need to overlap to network\n\n[font=default-bold]Three upgrade tracks:[/font]\n• [font=default-bold]Capacity[/font] — formation slots in the port go from 5 up to 15\n• [font=default-bold]Transport capacity[/font] — items carried per trip go from 1 up to 25\n• [font=default-bold]Worker speed[/font] — formations move 35% then 70% faster\n\n[font=default-bold]At night:[/font]\nEach dispatch consumes [fluid=liquid-coffee] Liquid Coffee from the rear pipe input.\n\nHover any biterport for live network status, active workers, and connection count.
administratorio-field-office=[font=default-bold]Free biter labor without hiring anyone.[/font]\n\nBuild a [entity=field-office] near an enemy nest (within roughly [font=default-bold]100 tiles[/font]). It calls a biter from the nearest nest to perform crafts on-site. After [font=default-bold]5 crafts[/font] the biter walks home and another one is summoned to replace it.\n\n[font=default-bold]Operating rules:[/font]\n• Only crafts while a biter is physically present\n• 1.0× speed and 0 pollution while working\n• Idle when no enemy nest is in range\n• At night, the biter goes home unless an [item=overtime-exemption] Overtime Exemption is installed\n\n[font=default-bold]Why it exists:[/font]\nThe Field Office is the bridge between "no biter workforce" and "fully staffed [entity=biter-station]". It lets you produce a few critical items before the complaint resolution chain has hired you any permanent workers — at the cost of being tethered to a nearby nest.
administratorio-hired-biter=[font=default-bold]A controllable biter you command directly.[/font]\n\nThrow a [item=hired-biter-capsule] Field Agent Capsule to deploy a biter you can give orders to. It carries up to [font=default-bold]20 eviction notices[/font] in its 4-slot inventory and patrols on its own, looking for spawners to evict.\n\n[font=default-bold]Commanding it[/font] (hold the [item=hired-biter-command-capsule] Field Agent Deployment Order):\n• [font=default-bold]Left-click[/font] on ground — toggle selection of agents at cursor\n• [font=default-bold]Right-click[/font] on ground — set waypoint for selected agents\n• [font=default-bold]Shift+Right-click[/font] — append a waypoint (multi-stop route)\n• [font=default-bold]Shift+Left-click[/font] on a chest or supply entity — load eviction notices from it\n\n[font=default-bold]Behavior when stocked:[/font]\nA loaded agent scans within [font=default-bold]60 tiles[/font] for enemy spawners. When it finds one, it walks over and uses an eviction notice to destroy it. A single agent on patrol can keep an area pacified as long as you keep restocking it from a chest along its route.\n\nAgent-delivered evictions still displace nearby biters into your complaint system, just like thrown notices. Plan desk capacity accordingly.

