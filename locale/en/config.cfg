copy-carbon-offset-certificate=Duplicate carbon offset certificates: 1 original produces 6 copies. Requires Industrial Printer.
copy-form-27b-6=Duplicate Form 27B-6: 1 original produces 6 copies. Requires Industrial Printer.
copy-environmental-impact-report=Duplicate environmental impact reports: 1 original produces 6 copies. Requires Industrial Printer.
office-desk-production=Build an administrative office desk for filing and supply crafting.
admin-station-production=Build the central 5x5 resolution station for processing high-tier cases.
union-headquarters-production=Build the union headquarters for negotiating workforce approval.
propaganda-distillery-production=Build a propaganda distillery for processing administrative fluids like lies and misinformation.
greenhouse-production=Build a greenhouse for wood and coffee production.
printer-t1-production=Build a basic electric printer for ink-based document production.
printer-t2-production=Build an industrial printer with copy capability. Requires a basic printer and advanced circuits as components.
mechanical-printer-production=Assemble a mechanical printer from iron, stone, and paper. A reliable early-game upgrade.
pneumatic-pipe-production=Produce sealed pneumatic pipes from iron and compacted rubble. For paperwork transport only.
pneumatic-pipe-to-ground-production=Produce underground pneumatic pipes. 10-tile underground range.
form-liquifier-production=Build a form liquifier intake station. Converts paperwork items into fluid for pneumatic transport.
form-solidifier-production=Build a form solidifier outtake station. Converts pneumatic fluid back into paperwork items.
speed-module=Craft a Subpoena Module 1 (Speed) from basic excuses and electronic circuits.
speed-module-2=Upgrade: requires 4 tier-1 modules, good excuses, and advanced circuits.
