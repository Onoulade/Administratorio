[recipe-description]
paper-production=Convert wood into paper. The first step in any bureaucratic supply chain.
ink-production=Grind coal into raw ink. Handcraftable. The writing begins here.

blank-form-production=Print blank forms using paper and ink. The universal administrative substrate.
blank-approval-production=Print blank approval forms. A higher-quality template for permits and authorizations.
blank-directive-production=Print blank directive forms. Premium triple-ink security template for management approvals.

carbon-offset-certificate-basic=Your license to smelt. One certificate per furnace batch keeps the environmental regulators at bay.
carbon-offset-certificate-verified=A properly verified environmental permit. Required before the bureaucracy will let you build a steel furnace.
provisional-approval-production=The most basic form of bureaucratic approval. Your first taste of redundant rubble, and the gateway to burner-era infrastructure.
work-order-production=The universal assembler permission slip. Without this, your machines are expensive paperweights.
form-27b-6=The form that makes all other forms possible. You haven't filed your 27B-6.
safety-waiver-draft=Absolve the administratorion of all liability using one basic excuse. Needs printer finalization to become legally binding.
safety-waiver-printing=Stamp the safety waiver into existence. Required for T1 construction and heavier operating permits.
transit-authorization-production=Official travel documentation for train logistics. One form consumed per arrival — no form, no train.

environmental-impact-report=A comprehensive (if heavily redacted) assessment of environmental damage. Required for chemical and radiological operating permits.
management-verbal-draft=Corner a manager at the coffee machine and get them to agree to something. Needs printer finalization before anyone can deny it happened.
management-verbal-printing=Commit a spoken promise to paper before the manager changes their mind. Produces the official verbal approval.
management-written-proposal=Draft a written proposal at the Union Headquarters. Requires a good excuse, a narrative, and a treasury bond — managers don't sign for free.
management-written-1st-printing=Finalize the written proposal in one heavy printer pass. Produces a signed, notarized management approval that is impossible to deny.
research-grant-approval-production=The minimum viable funding authorization. Every science pack in the mod starts with one of these.
construction-permit-draft=Begin the permit process at the office desk. The draft is not yet legally binding — it needs a printer's stamp.
construction-permit-printing=Finalize the construction permit with ink and authority. Nothing gets built without one of these.

provisional-work-order-production=The pre-entry assembler clearance. Your machines haven't even started yet, but the paperwork has.
safety-work-order-production=Authorize your assemblers to do anything mildly dangerous — which, in this bureaucracy, is everything. The entry-level assembler permit.
construction-work-order-production=Mid-tier assembler clearance. Your machines have graduated from "probably safe" to "officially permitted."
management-verbal-work-order-production=A manager said it was fine. That counts, right? The T3 assembler authorization, backed by a spoken promise.
management-written-work-order-production=Top-tier assembler clearance with a real signature. The most expensive permission slip in the factory.
research-grant-work-order-production=Science requires funding. Funding requires paperwork. Paperwork requires science packs. The circle of bureaucratic life.
chemical-handling-work-order-production=The operating permit for chemical plants. Combines safety, environmental, and logistical paperwork into one very thick authorization.
radiological-work-order-production=The highest-tier operating permit. Authorizes centrifuges to handle nuclear material — assuming management signed off in writing.
safety-work-order-printing=Bypass the intermediate steps and print safety work orders directly from drafts. Two per craft — the printer does the combining.
construction-work-order-printing=Print construction work orders straight from drafts. Two per craft — faster than assembling them by hand.

dubious-data-batch=Refine nonsense at industrial scale. One certificate covers the whole batch — the regulators don't count individual data points.
dubious-data-refining=Extract something resembling information from raw nonsense. Unreliable, but technically qualifies as data.
basic-excuse-production=Five pieces of unreliable information, compressed into one plausible-sounding justification. The backbone of landscape resolution.
crappy-report-production=Five data points of questionable origin, stapled together and called a report. The foundation for all higher-tier documentation.
politician-fluid-refining=Distill raw political essence into pure liquid deception. The Propaganda Distillery does not judge — it just refines.
data-production=Actual usable information — a rare commodity. Emerges when you cross-reference a crappy report with someone's credentials.
good-excuse-production=Blend real data with liquid lies until the result sounds plausible. Essential for high-tier approvals and narrative construction.
misinformation-production=Weaponize falsehood at fluid scale. A key ingredient in policy-making, justifications, and refined nonsense.
justification-production=A formal legal rationale built from misinformation, credentials, and raw political essence. Used for OSHA scrubbing and narrative construction.
credentials-production=Proof of authority, however dubious the source. The bureaucracy does not verify — it just checks for the stamp.
narrative-production=The official story, woven at the Union Headquarters. Controls public perception of your administratorion.
white-paper-production=An authoritative policy document. Reads like scholarship, funds like corruption, and governs like neither.
policy-production=The product of endless meetings, now in directive form. Feeds the regulation pipeline and higher-tier resolutions.
regulation-production=The ultimate expression of governmental authority. Requires an absurd amount of funding and data to draft.
promise-production=A vague but soothing document you can throw at protesting biters. Non-binding, non-specific, non-permanent — but it buys time.
eviction-notice-production=Legal authority to destroy biter structures, compressed into throwable form. The biters don't leave — they just lose their home.
hush-money-production=Taxpayer money stuffed into a throwable bag with just enough paperwork to make bribery look official. Silences nests for 3 minutes.
rideable-biter=Assign a biter worker to personal transport duty. The resulting vehicle runs on taxpayer money, has only a tiny cargo inventory, cannot be removed after placement, and becomes a complaining biter if unfunded for 10 minutes.
job-offer-production=Draft an employment contract. Place in an admin desk slot — a resolved biter picks it up instead of leaving. You get a worker; they get a career.
biter-logistics-formation=Retrain a general worker for walking logistics duty. The resulting formation staffs biterports and hauls items between chests.
union-delegate-training=A grueling certification process involving formal paperwork, legal boilerplate, and truly excessive coffee consumption. Required to build the Union Headquarters.
chemical-operator-training=Certify a biter for hazardous chemical handling. The training is surprisingly rigorous for a creature that used to spit acid for free.
nuclear-technician-training=Train a biter in radiological safety. Required for reactors and centrifuges — you do not want unlicensed wildlife near enriched uranium.
filing-landscape=Officially acknowledge that you ruined the scenery. The first step toward pretending you care.
filing-smog=The paperwork for smog complaints is thicker than the smog itself. Takes longer to process than you'd expect.
filing-noise=Documenting noise disturbances is, ironically, a very loud process. Requires significant processing time.
filing-unemployment=Filing proof that nobody has work. The person filing this has work. The most complex biter filing.
filing-littering=Formally cataloging acid puddle locations for the record. The entry point for spitter complaint resolution.
filing-hazmat=The filing itself may require hazardous material handling procedures. Expect a longer processing time.
filing-loitering=Criminalizing standing in the wrong place. Peak bureaucracy. Requires extensive restricted-area documentation.
filing-vagrancy=Documenting displacement with the same system that caused it. The most complex spitter filing.
case-smog=Elevate a smog filing into a court-ready case. The evidence is right there in the air, but you still need it on paper.
case-noise=Upgrade a noise filing into a prosecutable case. Requires hard data and environmental certification — hearsay doesn't hold up in biter court.
case-unemployment=Prove systemic economic failure with enough paperwork to employ a small office. Requires government-backed funding to process.
case-hazmat=Compile physical evidence and a filing into a hazmat prosecution package. The rubble samples are load-bearing.
case-loitering=Build a legal argument that standing still is a crime. Requires credentials, data, and just enough refined nonsense to make it stick.
case-vagrancy=Assemble a displacement prosecution backed by policy. The heaviest spitter casework — you need a directive just to open it.
brief-noise=A relic from a more litigious era. Retained for save compatibility — the courts have since streamlined.
brief-unemployment=From the days when unemployment cases went to the supreme court. Retained for save compatibility.
brief-loitering=An artifact of the old loitering prosecution pipeline. Retained for save compatibility.
brief-vagrancy=A supreme court brief from when vagrancy required the highest judicial authority. Retained for save compatibility.
landscape-final=The simplest resolution. One excuse, one filing, one satisfied biter. If only they were all this easy.
smog-final=Officially declare the air quality acceptable. Requires misinformation and coffee — the truth would take too long.
noise-final=Slam the gavel on a noise case. A heavy ruling that consumes policy, credentials, narratives, and a truly unreasonable amount of coffee.
unemployment-final=Resolve unemployment through sheer volume of paperwork. You did not create jobs — you created enough forms to pretend you did.
littering-final=Reclassify acid puddles as a natural feature of the landscape. A light resolution — one report and a filing is all it takes.
hazmat-final=Certify that hazardous materials have been properly mishandled. Requires misinformation and coffee — the standard bureaucratic solvents.
loitering-final=A landmark ruling that standing still is no longer a crime — in this specific case. Requires regulations, narratives, credentials, and coffee.
vagrancy-final=The ultimate spitter resolution. You solved homelessness — or at least generated enough paperwork to close the file.

iron-plate-batch=Permitted iron smelting. One certificate covers the whole batch — the regulators count runs, not ingots.
copper-plate-batch=Permitted copper smelting. One certificate per batch. The environmental impact is carefully unexamined.
steel-plate-batch=Permitted steel processing. The certificate burns faster than the iron. Worth it for the throughput.
stone-brick-batch=Permitted masonry. Even bricks need a carbon offset in this economy.
greenhouse-wood=Renewable wood production. The trees grow back, the paperwork doesn't.
greenhouse-discovery=Dig through wet compost hoping to find coffee beans. 10% chance per cycle. You always get some wood back, but never as much as you put in.
synthetic-paper-production=Oil-derived stationery for high-throughput paperwork supply. Faster than growing trees, but the chemical bill adds up.
coffee-plantation=Plant beans, add water, harvest five beans in half a minute. The most important supply chain in the factory.
coffee-refining=Brew the lifeblood of bureaucracy. A work order ensures the coffee is officially sanctioned.
corporate-breakroom-production=Every office needs a place where productivity goes to die. Also produces gossip, which is somehow essential.
watercooler-gossip-production=Pour coffee over dubious data and see what rumors come out. Essential for corporate decision-making.
osha-scrubbing=Make workplace violations disappear through the proper application of nonsense and union consent. Produces justifications.
osha-violation-recycling=Feed violations back into the union machine and see what paperwork falls out. Cheaper than scrubbing, but you get what you get.
office-drama-recycling=Add coffee to interpersonal conflict and shake. Randomly produces work orders, gossip, or excuses — the three pillars of office culture.
resolution-office-production=Where complaints go to be resolved — or at least reclassified. The workhorse of your resolution pipeline.
copy-blank-form=Mass-producing emptiness at industrial scale. Efficiency at its finest. Small chance of waste paper.
copy-blank-approval=One approval template goes in, six come out. The original is indistinguishable from the copies — which is actually the point.
copy-blank-directive=Bulk-print high-security directive templates. The triple ink application is faithfully reproduced, if not the original intent.
copy-carbon-offset-certificate=Copying environmental compliance documents on an industrial printer. The irony is not lost on anyone.
copy-form-27b-6=The form that breeds. One goes in, six come out. Kafka would be proud.
copy-environmental-impact-report=Copy the impact report before anyone reads it too closely. Six identical assessments of the same damage.
copy-work-order=Keep your assemblers fed with a steady stream of authorization paperwork. One original, six permissions.
copy-safety-work-order=Industrial-scale safety compliance. Print enough waivers to cover every machine on the floor.
copy-construction-work-order=Duplicate construction permits so your expansion never stalls waiting on a single signature.
copy-management-verbal-work-order=Reproduce a manager's spoken promise six times over. Each copy is equally non-binding.
copy-management-written-work-order=Six copies of a signed management directive. Each one is notarized, binding, and impossible to deny.
copy-research-grant-work-order=Multiply research funding authorizations so the labs never go dark. The grant committee doesn't need to know.
copy-chemical-handling-work-order=Duplicate hazardous operating permits. Safety is a numbers game, and six is safer than one.
copy-radiological-work-order=Copy nuclear authorization paperwork at industrial speed. Each copy glows with the same legal authority as the original.
office-desk-production=The nerve center of your paper empire. If it is not on this desk, it does not exist.
admin-station-production=The front desk of civilized governance. Biters queue here, file complaints here, and — with enough paperwork — leave satisfied here.
union-headquarters-production=A sprawling monument to organized labor. The first one bootstraps from bonds and verbal promises, then becomes the beating heart of late-game policy.
propaganda-distillery-production=Manufacturing consent, one barrel at a time. Converts politician fluid into lies, misinformation, and other essential governance byproducts.
greenhouse-production=A climate-controlled facility for the two pillars of bureaucracy: wood for paper, and coffee for the people pushing it.
printer-t1-production=Your first electric printer. Slow, reliable, and permanently jammed in spirit if not in practice.
printer-t2-production=Upgrades your printing infrastructure with copy capability. One document in, six out. Requires biter worker authorization per craft.
chromatic-printer=Build a chromatic printer platform for Space Age paperwork expansion.
conciliation-desk=Build Gleba's compact certification desk for yellow-form exception handling.
notary-office=Build a premium Vulcanus certification office for seals, charters, endorsements, and fallback launch paperwork.
territorial-arbitration-post=Build a tungsten-backed Vulcanus field office that feeds demolisher resettlement paperwork directly inside contested territory.
amber-sap-nonsense-seeding=Use amber sap and Gleba biology to precipitate local bullshit ore without importing the core nonsense economy.
ink-production-gleba=Produce solid writing ink from amber sap and nutrients instead of coal.
carbon-offset-certificate-basic-gleba=Issue a basic carbon offset certificate from blank forms, amber sap, and local biology instead of coal.
yellow-ink-production=Refine amber sap and nutrients into Gleba yellow ink for the compact yellow paperwork family.
mycelial-form-stock=Print the fibrous yellow stationery stock used by Gleba's local exception bureaucracy.
blank-yellow-form-production=Print blank yellow forms for the Conciliation Desk.
symbiosis-record=Finalize a compact biological registry document from a blank yellow form, dubious data, and nutrients.
conciliation-order=Issue a yellow Gleba exception order from a blank yellow form, a symbiosis record, and coffee.
biochamber-operating-waiver=Issue the narrow biological operating waiver used by off-world Gleba bio recipes.
capture-bureau=Convert an admin station into Gleba's worker-biter-staffed hostile-acquisitions bureau.
digital-services-bureau=Build Fulgora's computerized office upgrade for fast around-the-clock administrative throughput.
charged-toner=Recover a magenta toner base directly from Fulgora scrap.
laser-printer=Build Aquilo's high-speed solid-media printer for multicolor forms and fax reconstruction.
interplanetary-fax-exchange=Build Aquilo's capstone fax-routing office for interplanetary document handling.
transfer-emulsion-production=Stabilize cryogenic transfer media for Aquilo's solid-print bureaucracy.
thermal-transfer-sheet-production=Prepare the solid print substrate used by the Laser Printer.
composite-chroma-ribbon-production=Assemble a premium CMY carrier from imported colored forms and Aquilo transfer media.
composite-form-cyan-yellow-production=Converge Vulcanus and Gleba paperwork into a single Aquilo composite form.
composite-form-cyan-magenta-production=Converge Vulcanus and Fulgora paperwork into a single Aquilo composite form.
composite-form-yellow-magenta-production=Converge Gleba and Fulgora paperwork into a single Aquilo composite form.
trichromatic-permit-production=Issue the three-color permit used by recipes that span all early Space Age administrations.
unified-operations-charter-production=Assemble a capstone interplanetary charter from each planet's highest paperwork family.
cryogenic-operations-license-production=Issue the license that authorizes Aquilo cryogenic chemistry and plant operations.
archive-rubble-recovery=Recover Fulgora archive rubble from scrap.
archive-documentation-recovery=Recover archived filler paperwork from scrap and toner.
magenta-ink-production=Blend charged toner into Fulgora magenta ink for archive and electromagnetic paperwork.
signal-form-stock=Print the magenta stationery stock used by Fulgora's digital paperwork family.
blank-magenta-form-production=Print blank magenta forms for Fulgora archive and operating paperwork.
archive-recovery-permit=Issue a salvage reconstruction permit from magenta paperwork, charged toner, and recovered documentation.
digital-processing-certificate=Issue a computerized throughput certificate from magenta paperwork, data, and processing units.
electromagnetic-operating-license=Issue the exported operating license used by electromagnetic infrastructure and holmium-heavy industry.
data-recovery-order=Issue a recovery routing order for reconstructing archived paperwork from salvage.
liquid-black-ink=Convert solid black ink into a pipe-fed fluid supply for chromatic printing.
dubious-data-analysis-vulcanus=Extract local dubious data from verdigris crust so Vulcanus can bootstrap its own permit tree.
cyan-slurry-production=Liquefy verdigris crust into cyan slurry for Vulcanus chromatic bureaucracy.
cyan-ink-production=Refine cyan slurry into cyan ink for liquid-fed chromatic printing.
heatproof-form-stock=Print heat-resistant Vulcanus paperwork stock using cyan ink and sulfuric acid.
blank-cyan-form-production=Print the heatproof cyan stationery that feeds the entire Vulcanus notarial paperwork chain.
permit-draft=Print a reusable cyan permit shell for later notarization.
inspection-docket=Print a reusable industrial review shell for charters, excuses, and lie distillation.
embossed-seal=Press a premium embossed seal from cyan slurry and useless documentation.
industrial-charter=Certify an industrial charter from local Vulcanus draft paperwork.
territorial-resettlement-order=Assemble the dense Vulcanus resettlement packet used to negotiate demolisher retreat one chunk at a time.
liquid-stimulant-production=Distill a cyan-slurry stimulant concentrate that replaces agriculture on Vulcanus.
liquid-coffee-vulcanus=Turn stimulant concentrate and carbon into the coffee substitute used by Vulcanus offices.
heatproof-paper-production=Extrude standard paper from Vulcanus chemistry inputs instead of wood pulp.
molten-promises-production=Liquefy lava and cyan slurry into a rhetoric-rich industrial precursor.
thermal-process-license=Legalize a high-temperature process using a blank cyan form, lies, and a seal.
calcite-reagent-waiver=Legalize calcite-heavy process chemistry using a blank cyan form and dubious data.
offworld-metallurgy-charter=Combine Vulcanus thermal and calcite paperwork into the export charter required by off-world metallurgy.
good-excuse-vulcanus=Promote inspection paperwork, lies, and dubious data into a proper good excuse without the full Nauvis gossip tree.
safety-waiver-vulcanus=Issue a finished safety waiver directly from a blank cyan form, bypassing the normal draft stage.
construction-permit-vulcanus=Issue a finished construction permit directly from a permit draft and thermal license.
management-approval-verbal-vulcanus=Issue a spoken management approval in the Notary Office using coffee and a blank cyan form.
heatproof-filler-documentation=Convert cyan stationery and slurry into the useless documentation required by Vulcanus filing.
form-27b-6-vulcanus=Issue Form 27B-6 locally from useless documentation and an embossed seal.
vulcanus-lie-distillation=Process molten promises and inspection paperwork into a huge volume of lies plus a trickle of dubious data.
formation-center=Build a dedicated workforce bureaucracy center for turning enrolled biters into trained administrative labor.
administrative-space-station=Build the only vacuum-approved administrative office. It produces orbital paperwork for offworld metallurgy, asteroid processing, and deviation work.
job-offer-production=Assemble an obscenely expensive recruitment offer for a fully resolved biter.
worker-biter-formation=Convert an enrolled biter into a usable worker through credentials, excuses, and public funding.
trajectory-compliance-array=Build an orbital compliance array that spends executive staffing or orbital deviation orders to redirect incoming asteroid chunks.
clerical-trainee-formation=Route a worker biter into the clerical track for paperwork-heavy specialist roles.
management-trainee-formation=Route a worker biter into the management track for negotiators and executive absurdity.
astronaut-formation=Train a management-branch orbital specialist for vacuum paperwork and space-platform administration.
night-shift-supervisor-formation=Specialize a clerical trainee into a night-shift supervisor.
licensed-notary-formation=Specialize a clerical trainee into a Vulcanus notary for foundry-adjacent work.
conciliation-officer-formation=Specialize a clerical trainee into a Gleba conciliation officer.
relay-clerk-formation=Specialize a clerical trainee into a Fulgora relay clerk.
cryoprint-technician-formation=Specialize a clerical trainee into an Aquilo cryoprint technician.
field-negotiator-formation=Specialize a management trainee into a field negotiator for expropriation and protest work.
middle-management-managing-manager-formation=Promote a management trainee into an absurd executive sink.
thermal-process-license-orbital=Issue the thermal metallurgy paperwork directly in orbit without relying on the Vulcanus notary chain.
calcite-reagent-waiver-orbital=Issue the calcite-heavy smelting waiver directly in orbit for offworld foundry support.
offworld-metallurgy-charter-orbital=Assemble the finished offworld metallurgy charter inside the orbital admin station.
orbital-deviation-order=Issue a lighter-weight orbital firing order for trajectory compliance arrays before you want to waste full MMMM staffing on every rock.
asteroid-processing-docket=Issue the crusher paperwork required for legal asteroid processing on space platforms.
mechanical-printer-production=A hand-cranked workhorse for the pre-electric era. Slow, but it gets the forms moving.
pneumatic-pipe-production=Sealed tubes for shooting paperwork across your factory at high speed. Regular pipes are for liquids, not legalese.
pneumatic-pipe-to-ground-production=Route pneumatic pipes under buildings and belts. 16-tile underground range.
tube-intake-production=The on-ramp to your pneumatic network. Feed paperwork in, and it appears instantly at any connected outtake.
tube-outtake-production=The off-ramp from your pneumatic network. Set a filter to request the specific form type you need.
speed-module=Draft a legal threat compelling faster machine output. The excuse had better be good enough to justify the energy bill.
speed-module-2=Escalate the subpoena. Four copies of the original threat, upgraded with better excuses and more persuasive circuitry.
speed-module-3=A federal subpoena backed by narratives, credentials, and the full weight of the judiciary. Peak legal acceleration.
productivity-module=Launch an internal investigation that wrings extra output from every cycle. Auditors are thorough but slow.
productivity-module-2=Expand the audit scope. Four preliminary findings, hardened with real data, yield deeper scrutiny.
productivity-module-3=A full federal investigation. Four prior audits, justifications, and credentials merge into the most productive — and most intrusive — oversight possible.
efficiency-module=Cook the energy books. A crappy report and some wiring make the power meter lie just enough.
efficiency-module-2=Bolder accounting fraud. Four prior schemes and some white papers produce significantly more creative bookkeeping.
efficiency-module-3=A full Ponzi scheme of energy accounting. Four prior embezzlement modules, policy cover, and credentials — the auditors will never notice.
union-approval-production=Secure workforce consent through the ancient ritual of coffee, data, and public funding. Nothing moves without the union's blessing.
treasury-bond-production=Package public funds into a tradeable financial instrument. The documentation is useless, but legally required.
government-grant-production=Convert treasury bonds into a major funding allocation. Requires a manager's verbal promise and a report nobody will read.
tax-audit=Reclassify laundered money back into legitimate revenue. The paperwork goes in dirty and comes out clean — and somehow multiplied.
slush-fund-production=Convert legitimate government bonds into untraceable liquid assets. Completely above board. Do not ask questions.
useless-documentation-production=Officially document uselessness. The result is somehow a required input for financial instruments and standardized filing.
compacted-rubble-production=Compress bureaucratic waste into a standardized building material. The certificate proves the compression was environmentally responsible.
compacted-rubble-electric=Compress redundant rubble one unit at a time in an electric furnace without consuming a carbon offset certificate.
charcoal-production=A renewable source of coal, assuming you have greenhouses producing the wood. The certificate covers the emissions.
refined-nonsense-production=The backbone of high-tier bureaucracy. Created when physical waste meets liquid falsehood and neither backs down.
overtime-exemption=Authorize a single building to operate after dark. The module slot doesn't care about your work-life balance — just your coffee supply.

