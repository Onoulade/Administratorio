[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Welcome to Administratorio![/font]\n\nThis is a [font=default-bold]total conversion mod[/font] that replaces Factorio's military conflict with bureaucratic administration. Biters no longer attack your walls. They get intercepted, registered, and turned into [item=ticket-landscape] complaints at your [entity=admin-station] Biter Administration Desk.\n\n[font=default-bold]Key differences from vanilla:[/font]\n• [color=red]No military[/color] — guns, turrets, and military science are removed\n• [color=green]Paperwork gates everything[/color] — machines, smelting, fluids, and research all consume forms\n• [color=green]Citizens replace raids[/color] — biters become queueing complaint sources instead of combat targets\n• [color=green]Throwables are administrative[/color] — [item=promise] promises pacify protesters and [item=eviction-notice] eviction notices clear nests while creating more paperwork\n• [color=green]Office hours matter[/color] — some buildings shut down at night unless you legalize overtime\n\nYour goal: push the human complaint tree through [technology=constitutional-law] Constitutional Law and the spitter tree through [technology=vagrancy-ordinances] Vagrancy Ordinances, while keeping the office functional enough that the backlog does not revolt.
administratorio-paperwork=[font=default-bold]Paper is the foundation of all bureaucracy.[/font]\n\n[item=paper] Paper starts as wood, and [item=ink] ink is refined from coal. After researching [technology=synthetic-stationery], you can also synthesize paper directly from [item=plastic-bar] plastic, [item=sulfur] sulfur, and water for a much faster but more expensive supply.\n\n[font=default-bold]Printers:[/font]\n• [entity=mechanical-printer] [font=default-bold]Mechanical Printer[/font] — you start with one at the crash site for your first printed forms\n• [entity=printer-t1] [font=default-bold]Printer T1[/font] — electric printing for routine form production\n• [entity=printer-t2] [font=default-bold]Printer T2[/font] — faster printing plus bulk copy recipes unlocked with [technology=industrial-printing]\n\n[font=default-bold]Key forms:[/font]\n• [item=blank-form] Blank Form — base for most administrative paperwork\n• [item=blank-approval] Blank Approval — template for waivers, permits, and transit forms\n• [item=form-27b-6] Form 27B-6 — standardized requisition form for rail and compliance paperwork\n• [item=carbon-offset-certificate-basic] Carbon Offset Certificate — required for batch smelting
administratorio-regulation=[font=default-bold]Assembler crafting and building recipes are wrapped in a form-tier system.[/font]\n\n[font=default-bold]Tier System:[/font]\n• [color=green]T0[/color] [item=work-order] Work Order — assembler-only basic utility items\n• [color=green]T1[/color] [item=safety-waiver] Safety Waiver / [item=safety-work-order] Safety Work Order — inserters, radar, walls, poles, boiler, and AM1\n• [color=yellow]T2[/color] [item=construction-permit] Construction Permit / [item=construction-work-order] Construction Work Order — furnaces, mining drills, AM2, and heavy industrial building recipes\n• [color=yellow]T3[/color] [item=management-approval-verbal] Management Approval (Verbal) / [item=management-verbal-work-order] Verbal Management Work Order — rail, roboports, solar, accumulators\n• [color=red]T4[/color] [item=management-approval-written] Management Approval (Written) / [item=management-written-work-order] Written Management Work Order — AM3, beacon, rocket silo, and other megaprojects\n• [item=research-grant-approval] Research Grant Approval — all science packs\n\n[font=default-bold]Important:[/font]\n[item=work-order] Work Orders and their tiered variants are only used by assembling-machine recipes. Furnaces, refineries, chemistry, and centrifuging use separate operating paperwork.\n\n[font=default-bold]Handcrafting:[/font]\nOnly recipes available from the start or unlocked by red-science-tier technology can be handcrafted. Later regulated recipes are hidden from player crafting and must be automated.
administratorio-operating-paperwork=[font=default-bold]Not every machine runs on assembler paperwork.[/font]\n\n[font=default-bold]From day one:[/font]\n• [item=carbon-offset-certificate-basic] Carbon Offset Certificate — furnaces and smelting\n\n[font=default-bold]Later specialist documents:[/font]\n• [item=petrochemical-operating-permit] Petrochemical Operating Permit — oil refineries and oil-processing recipes\n• [item=chemical-handling-work-order] Chemical Handling Work Order — chemical plants and chemistry recipes\n• [item=radiological-work-order] Radiological Work Order — centrifuges and centrifuging recipes\n\nThese specialist forms are built from lower-tier approvals like [item=safety-waiver] Safety Waivers, [item=construction-permit] Construction Permits, and later management approvals. Complaints still stay inside the resolution chain. They fund and unlock your bureaucracy indirectly, but they are not consumed by these operating forms.
administratorio-biter-complaints=[font=default-bold]Admin stations are the front desk of the whole mod.[/font]\n\nEnemy units that would normally attack get rerouted into your [entity=admin-station] queue instead. Registered biters turn neutral, occupy one of the station's [font=default-bold]6 waiting slots[/font], and generate complaint-ticket items in the desk inventory.\n\n[font=default-bold]Basic loop:[/font]\n1. Build an [entity=admin-station] and give it room to store complaint items\n2. Let biters and spitters enter the central waiting zone and register\n3. Pull the complaint tickets out of the desk and process them through the [entity=resolution-office] Resolution Office chain\n4. Put the matching final [item=resolved-landscape] resolved item back into the desk serving that biter\n5. The citizen leaves and pays [item=taxpayer-money] Taxpayer Money\n\n[font=default-bold]Complaint families:[/font]\n• Biters: landscape → smog → noise → unemployment\n• Spitters: littering → hazmat → loitering → vagrancy\nBigger enemies can roll higher tiers, and the game warns you before evolution makes those new tiers start mattering.\n\n[font=default-bold]Scaling:[/font]\nEach desk also outputs circuit signals for complaint counts, free slots, and total waiting biters, so you can monitor backlog and add capacity before protests start.
administratorio-frustration=[font=default-bold]Waiting biters are on a timer.[/font]\n\nEach registered biter tracks its own frustration while waiting or walking to a desk. Hover the biter to inspect its current mood and unresolved complaints.\n\n[font=default-bold]Frustration tiers:[/font]\n• [color=green]0–25%[/color] — Calm\n• [color=yellow]25–50%[/color] — Irritated\n• [color=yellow]50–75%[/color] — Angry\n• [color=red]75–100%[/color] — Furious\nAt [color=red]100%[/color] frustration, the biter leaves the queue and starts protesting. Biters that cannot find any desk capacity can also end up protesting immediately instead of queueing.\n\n[font=default-bold]Important:[/font]\nComplaint tier comes from enemy type and tech progression, [color=red]not[/color] from frustration. Frustration only decides how close you are to having buildings disabled.\n\n[font=default-bold]How to stay ahead:[/font]\nMore [entity=admin-station] desks reduce queue overflow. More [entity=resolution-office] Resolution Offices and paperwork throughput reduce time-to-resolution. If you expand with [item=eviction-notice] Eviction Notices, remember that the displaced biters arrive already half-frustrated.
administratorio-protest-resolution=[font=default-bold]A protest is a live outage, not just a warning.[/font]\n\nWhen frustration caps out, the biter picks a reachable player building, walks there, and [color=red]disables it[/color]. Active protests raise alerts, map tags, and sirens. Overtime exemptions do [color=red]not[/color] protect buildings from protest shutdowns.\n\n[font=default-bold]Your protest tool:[/font]\n[item=promise] [font=default-bold]Bureaucratic Promise[/font] is a throwable capsule available from the early game. Throw it at the [font=default-bold]protesting biter[/font], not the building.\n• If a desk slot is free, the biter immediately reroutes back into the nearest queue\n• If no slot is free, the biter becomes [font=default-bold]pacified[/font] for 60 seconds, then resumes protesting if capacity still has not opened\n• A promise does [color=red]not[/color] erase the complaint or reset partial case progress\n\n[font=default-bold]Permanent fix:[/font]\nPromises buy time. Finishing the complaint and returning the final resolved item to the desk is what actually clears the citizen from the system.
administratorio-nest-expropriation=[font=default-bold]Eviction Notices are your expansion tool.[/font]\n\nResearch [technology=nest-expropriation] Nest Expropriation to craft [item=eviction-notice] Eviction Notices. Throw one at enemy territory and it destroys the nearest enemy nest or spawner in the impact area.\n\n[font=default-bold]The catch:[/font]\nNearby enemy units within roughly [font=default-bold]25 tiles[/font] are not killed. They are [color=red]displaced into your complaint system[/color] with [font=default-bold]50% starting frustration[/font]. If you do not have free desk capacity, those displaced biters can protest almost immediately.\n\nUse evictions when you need land, but treat them like an administrative load spike. Clear territory only when your desks, resolution offices, and paperwork pipeline can absorb the displaced queue.
administratorio-propaganda-distillery=[font=default-bold]The Propaganda Distillery processes all administrative fluids.[/font]\n\nUnlocked with [font=default-bold]Industrial Propaganda[/font], this building replaces chemical processing for bureaucratic fluids.\n\n[font=default-bold]Key recipes:[/font]\n• [fluid=politician-fluid] Politician Fluid → [fluid=lie] Liquid Lies\n• [fluid=lie] Lies + [item=dubious-data] Dubious Data → [fluid=misinformation] Misinformation\n• [fluid=lie] Lies + [item=dubious-data] Dubious Data + [item=refined-nonsense] Refined Nonsense → [item=credentials] Credentials\n• [item=compacted-rubble] Compacted Rubble + [fluid=misinformation] Misinformation → [item=refined-nonsense] Refined Nonsense\n• [item=treasury-bond] Treasury Bonds + lies → [fluid=slush-fund] Slush Funds\n\nChemical plants and oil refineries do [color=red]not[/color] handle these recipes. All lie, misinformation, and slush-fund processing goes through the Propaganda Distillery.
administratorio-complaint-chain=[font=default-bold]Complaints escalate in stages.[/font]\n\nAll complaint processing happens at the [entity=resolution-office]. Early tiers are short chains; later tiers grow into casework and briefs.\n\n[font=default-bold]Human complaints:[/font]\n[item=ticket-landscape] Ticket → [item=filing-l] Filing → resolved\n[item=ticket-smog] Ticket → [item=filing-s] Filing → [item=case-s] Case → resolved\n[item=ticket-noise] Ticket → [item=filing-n] Filing → [item=case-n] Case → [item=brief-n] Brief → resolved\n[item=ticket-unemployment] Ticket → [item=filing-u] Filing → [item=case-u] Case → [item=brief-u] Brief → resolved\n\n[font=default-bold]Spitter complaints:[/font]\n[item=ticket-littering] Ticket → [item=filing-lt] Filing → resolved\n[item=ticket-hazmat] Ticket → [item=filing-h] Filing → [item=case-h] Case → resolved\n[item=ticket-loitering] Ticket → [item=filing-lo] Filing → [item=case-lo] Case → [item=brief-lo] Brief → resolved\n[item=ticket-vagrancy] Ticket → [item=filing-v] Filing → [item=case-v] Case → [item=brief-v] Brief → resolved\n\n[font=default-bold]Late-game split:[/font]\nHuman complaints finish through [technology=noise-ordinances] and [technology=constitutional-law]. Spitter complaints finish through [technology=loitering-ordinances] and [technology=vagrancy-ordinances]. When a chain is complete, return the final resolved item to the desk serving that biter for payout and release.
administratorio-pneumatic-transport=[font=default-bold]Move paperwork through sealed manila pipes.[/font]\n\nThe pneumatic system converts paper forms into fluids for pipe-based transport:\n\n[font=default-bold]Buildings:[/font]\n• [entity=form-liquifier] [font=default-bold]Form Liquifier[/font] — converts 1 form into 10 fluid units\n• [entity=form-solidifier] [font=default-bold]Form Solidifier[/font] — converts 10 fluid units back into 1 form\n• [entity=pneumatic-pipe] [font=default-bold]Pneumatic Pipe[/font] — manila-colored, connects only to pneumatic buildings\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Pneumatic Underground Pipe[/font] — 10 tile range\n\n[font=default-bold]How it works:[/font]\nLiquifiers and solidifiers have hidden inserters that automatically pick up from and place onto adjacent belts or chests. Simply place a belt or chest next to them.\n\nPneumatic pipes use a separate connection category — they [color=red]cannot[/color] connect to regular fluid pipes. Each form type has its own fluid, so you can run multiple form types through separate pipe networks.\n\nUnlocked with [font=default-bold]Pneumatic Form Transport[/font] research after [font=default-bold]Printing Technology[/font] and [font=default-bold]Logistic Science[/font].
administratorio-bullshit-economy=[font=default-bold]Bullshit Ore powers the entire certificate and excuse supply chain.[/font]\n\nMine [item=bullshit-ore] Bullshit Ore to produce:\n• [item=dubious-data] Dubious Data (refined from ore)\n• [item=basic-excuse] Basic Excuse → [item=good-excuse] Good Excuse\n• [item=crappy-report] Crappy Report → [item=justification] Justification → [item=narrative] Narrative\n• [item=white-paper] White Paper → [item=policy] Policy → [item=regulation] Regulation\n\n[font=default-bold]Redundant Rubble derivatives:[/font]\n[item=redundant-rubble] Redundant Rubble is processed into three derivative tiers:\n• [item=useless-documentation] [font=default-bold]Useless Documentation[/font] — rubble + paper, used in Form 27B-6 and treasury bonds\n• [item=compacted-rubble] [font=default-bold]Compacted Rubble[/font] — rubble + carbon cert, used in buildings and late recipes\n• [item=refined-nonsense] [font=default-bold]Refined Nonsense[/font] — compacted rubble + misinformation, used in credentials, narratives, and high-tier resolutions\n\n[font=default-bold]Government funding chain:[/font]\n[item=taxpayer-money] Taxpayer Money (from resolving biters) → [item=treasury-bond] Treasury Bond → [fluid=slush-fund] Slush Fund → [item=taxpayer-money] More Taxpayer Money\n\nTaxpayer Money is the critical bottleneck. Late-game bureaucrats can also perform [font=default-bold]Tax Audits[/font] in the [entity=meeting-room] Meeting Room to turn slush funds, the underlying bond paperwork, and data into extra funding.\n\n[font=default-bold]Multi-building production chain:[/font]\n• [entity=office-desk] Office Desk: forms, science packs, data, and treasury bonds\n• [entity=corporate-breakroom] Breakroom: coffee, gossip, good excuses, verbal approval drafts\n• [entity=union-headquarters] Union HQ: union approvals, government grants, narratives, verified certificates, OSHA cleanup\n• [entity=meeting-room] Meeting Room: written approvals, white papers, policy, regulation, and tax audits\n• [entity=propaganda-distillery] Distillery: lies, misinformation, credentials, slush funds, refined nonsense
administratorio-transit-authorization=[font=default-bold]Train stops have an integrated paperwork chest.[/font]\n\nEvery [entity=train-stop] Train Stop now requires [item=transit-authorization] Transit Authorization (Form 12-T) forms to remain operational.\n\n[font=default-bold]How it works:[/font]\n1. Each Train Stop gets an [entity=transit-permit-chest] integrated transit permit chest.\n2. Insert [item=transit-authorization] Transit Authorizations into that chest.\n3. One form is [font=default-bold]consumed when a train arrives[/font] and begins waiting at the station.\n4. If a station runs out of forms, it closes automatically by setting its train limit to 0.\n\n[font=default-bold]Setup:[/font]\n• Research [font=default-bold]Railway[/font] technology to unlock the form recipe.\n• Craft forms at the [entity=office-desk] Administrative Office Desk.\n• Keep stations stocked with belts, inserters, or logistics so busy hubs do not stall.\n\nThis system makes rail logistics another paperwork problem instead of a combat one.
administratorio-admin-science=[font=default-bold]Administrative Science fuels your bureaucratic expansion.[/font]\n\nAdministrative research requires the [item=administrative-science-pack] Administrative Science Pack (Gray). This pack is the bottleneck for most custom bureaucracy tech.\n\n[font=default-bold]Production:[/font]\nProduced at the [entity=office-desk] Administrative Office Desk from:\n• [item=blank-form] Blank Form\n• [item=provisional-approval] Provisional Approval\n• [item=basic-excuse] Basic Excuse\n• [item=research-grant-approval] Research Grant Approval\n\n[font=default-bold]Usage:[/font]\nThis pack replaces military science in vanilla research costs and is also used throughout the custom tech tree. If your paperwork chain stalls, your research stalls with it.
administratorio-working-hours=[font=default-bold]Some administrative buildings now obey office hours.[/font]\n\nThe [entity=office-desk] Office Desk, [entity=corporate-breakroom] Corporate Breakroom, [entity=union-headquarters] Union Headquarters, and [entity=meeting-room] Meeting Room close at night unless they have an [item=overtime-exemption] Overtime Exemption installed.\n\n[font=default-bold]How night shifts work:[/font]\n• Research [technology=after-hours-operations] to unlock the module\n• Install [font=default-bold]one[/font] copy in the building's module inventory; extras do nothing\n• Daytime throughput is intentionally higher, so early automation is meant to surge in office hours instead of trickling 24/7\n• Protests can [color=red]still[/color] disable these buildings even if they have overtime clearance\n\n[font=default-bold]Optional:[/font]\nIf you dislike the mechanic entirely, disable Working Hours in startup settings before loading the mod. The tip, module, research, and runtime shutdowns all disappear with the setting.

[mod-setting-name]
administratorio-enable-working-hours=Enable Working Hours

[mod-setting-description]
administratorio-enable-working-hours=When enabled, office desks, breakrooms, union headquarters, and meeting rooms close at night unless fitted with an Overtime Exemption. Disabling this removes the night shutdowns, the Overtime Exemption module, the After-Hours Operations research, the working-hours tip, and the daytime speed boosts.

