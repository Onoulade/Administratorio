[mod-setting-description]
administratorio-enable-working-hours=When enabled, office desks and union headquarters close at night unless fitted with an Overtime Exemption, while biter stations and biterports require liquid coffee for night dispatches. Buildings served by biter-station workers do not need their own Overtime Exemption. Disabling this removes the night shutdowns, the Overtime Exemption module, the After-Hours Operations research, the working-hours tip, and the daytime speed boosts.
administratorio-debug-protest-belts-and-inserters=When enabled, protest target selection also includes transport belts, underground belts, splitters, and inserters. Disabled by default because it can make protests much noisier and stall tiny logistics pieces while testing.
administratorio-debug-hard-mode=When enabled, protesting biters keep gaining frustration after the normal protest point. They protest at 70% frustration capacity, then at 100% stay in protest mode and attack the nearest eligible building until a Bureaucratic Promise sends them back toward a desk.

