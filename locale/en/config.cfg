[technology-description]
discovery-bullshit=You found it. Now you just need to refine it into a valid argument. Unlocks dubious data refining, basic excuse production, the first safety-waiver and construction-permit paperwork, and basic landscape resolutions.
discovery-redundant-rubble=Touching the local geology has immediately buried you in a landslide of redundant requirements. Unlocks provisional approvals, the admin station, the resolution office, the first landscape filings, and the burner mining drill.
administrative-science-research=Formalizing the complaint resolution pipeline into a reproducible science. Unlocks gray administrative science packs.
printing-technology=Mechanized document production. Unlocks the Basic Printer and early promises once both bootstrap discoveries are in place.
administrative-bureaucracy=The first formal layer of red tape. Unlocks the Greenhouse and early wood production.
rubble-compaction=Compress redundant rubble into a standardized building material for later infrastructure. Unlocks compacted rubble production.
littering-resolution=Formalize procedures for handling illegal dumping complaints. Unlocks crappy reports, littering filing, and littering resolution.
industrial-printing=Scale paperwork throughput beyond a single electric printer with chemical-era infrastructure. Unlocks the Industrial Printer plus bulk copy recipes for blank forms, blank approvals, carbon certificates, Form 27B-6, and environmental impact reports.
local-precedents=Standardize the legal boilerplate behind rail and compliance paperwork. Unlocks useless documentation and Form 27B-6.
environmental-reporting=Turn requisition boilerplate into actual compliance reporting. Unlocks environmental impact reports.
streamlined-work-orders=Print work orders directly from drafts, bypassing intermediate approval steps. Unlocks direct draft-to-work-order printing at electric printers, producing 2 work orders per craft.
office-agriculture=Industrialize the office coffee supply beyond scavenging. Unlocks coffee plantations and charcoal.
industrial-propaganda=Weaponize misinformation at industrial scale. Unlocks the Propaganda Distillery, compacted rubble production, politician fluid refining, misinformation, refined nonsense, and official credentials.
corporate-hospitality=Turn coffee and office rumor into usable morale. Unlocks coffee discovery, the Corporate Breakroom, coffee refining, watercooler gossip, and office-drama recycling.
information-management=Process gossip and credentials into actionable paper trails. Unlocks data synthesis and good excuses.
verbal-approvals=Formalize the manager's spoken promise into reusable paperwork. Unlocks blank directives, directive copying, and verbal management approvals.
environmental-compliance=Permit the oil economy through properly documented environmental theater. Unlocks petrochemical operating permits.
smog-abatement=Formalize the air-pollution complaint chain. Unlocks smog filing, casework, and final resolution.
hazmat-response=Formalize the hazardous-material complaint chain. Unlocks hazmat filing, casework, and final resolution.
nest-expropriation=Claim territory through paperwork-backed force. Unlocks eviction notices for clearing biter nests.
synthetic-stationery=Formalize oil-derived stationery production. Unlocks synthetic paper made from plastic, sulfur, and water for high-throughput paperwork supply.
public-finance=Bring the treasury and unions into the bureaucracy. Unlocks treasury bonds, the Union Headquarters, union approvals, and government grants.
health-and-safety=Turn union leverage into regulatory theater. Unlocks OSHA scrubbing, justifications, and narrative production.
board-meetings=Build the committee infrastructure for late-stage bureaucracy. Unlocks the Meeting Room.
executive-review=Escalate bureaucracy into signed directives. Unlocks written management approvals and written management work orders.
radiological-compliance=Escalate process paperwork into nuclear territory. Unlocks radiological work orders for centrifuges and uranium processing.
eminent-domain-zoning=Draft the policy scaffolding for large-scale expansion. Unlocks white papers, policy directives, and slush funds.
environmental-certification=Upgrade basic carbon paperwork into an audited environmental certificate. Unlocks the verified carbon offset certificate.
federal-regulation=Turn policy into enforceable federal text. Unlocks regulation drafting.
noise-ordinances=Formalize the noise complaint chain. Unlocks noise filing, casework, briefs, and final resolution.
loitering-ordinances=Formalize the loitering complaint chain. Unlocks loitering filing, casework, briefs, and final resolution.
creative-accounting=Standardize the reclassification of slush funds into official revenue. Unlocks Tax Audit.
constitutional-law=The final human complaint tier. Unlocks unemployment filing, casework, briefs, and final resolution at the production-science stage.
vagrancy-ordinances=The final spitter complaint tier. Unlocks vagrancy filing, casework, briefs, and final resolution at the utility-science stage.
after-hours-operations=Standardize legal night shifts for the administrative apparatus. Unlocks the [item=overtime-exemption] Overtime Exemption module so key office buildings can stay open overnight.
pneumatic-form-transport=Route paperwork through sealed pneumatic pipes. Unlocks form liquifiers, form solidifiers, and pneumatic form pipes. Pneumatic pipes do not connect to regular fluid infrastructure.

