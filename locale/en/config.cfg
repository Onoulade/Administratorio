[recipe-description]
paper-production=Convert wood into paper. The first step in any bureaucratic supply chain.
ink-production=Grind coal into raw ink. Handcraftable. The writing begins here.

blank-form-production=Print blank forms using paper and ink. The universal administrative substrate.
blank-approval-production=Print blank approval forms. A higher-quality template for permits and authorizations.
blank-directive-production=Print blank directive forms. Premium triple-ink security template for management approvals.

carbon-offset-certificate-basic=Issue a basic carbon offset certificate from a blank form and coal. Enables batch smelting.
carbon-offset-certificate-verified=Upgrade a basic certificate with additional dubious data verification at the office desk. Required for steel furnace construction.
provisional-approval-production=Obtain the most basic form of bureaucratic approval. Requires paper and Redundant Rubble.
work-order-production=Draft a work order from a blank form and dubious data. Base authorization for regulated assembling-machine production.
form-27b-6=Print the standardized requisition form from a blank form, ink, and useless documentation.
safety-waiver-draft=Draft a safety waiver at the office desk from a blank approval form and basic excuse. Needs printer finalization.
safety-waiver-printing=Finalize a safety waiver draft with ink at the printer. Produces the official safety waiver.
transit-authorization-production=Draft a transit authorization (Form 12-T) for train stations. Requires a blank approval form and Form 27B-6.

environmental-impact-report=Compile a comprehensive environmental assessment at the office desk from a crappy report, Form 27B-6, and verified carbon certificates. Feeds higher process permits.
petrochemical-operating-permit-production=Issue a refinery operating permit at the office desk by combining a safety waiver with an environmental impact report.
management-verbal-draft=Convince a manager to verbally agree at the breakroom. Requires a blank directive, basic excuse, and coffee. Needs printer finalization.
management-verbal-printing=Finalize a verbal management draft with ink and paper. Produces the official verbal management approval.
management-written-proposal=Draft a written management proposal at the Union Headquarters. Requires a blank directive, good excuse, narrative, and treasury bond.
management-written-1st-printing=Finalize the written management proposal in one heavy printer pass using ink, Form 27B-6, and paper. Produces the official written management approval.
research-grant-approval-production=Issue a basic research grant from a blank form, redundant rubble, and dubious data. Required for all science pack production.
construction-permit-draft=Draft a construction permit at the office desk from a blank approval form, dubious data, and paper. Needs printer finalization.
construction-permit-printing=Finalize a construction permit draft with ink at the printer. Produces the official construction permit.

safety-work-order-production=Combine a safety waiver with a work order. Consumed during T1 regulated assembling-machine production.
construction-work-order-production=Combine a construction permit with a work order. Consumed during T2 regulated assembling-machine production.
management-verbal-work-order-production=Combine verbal management approval with a work order. Consumed during T3 regulated assembling-machine production.
management-written-work-order-production=Combine written management approval with a work order. Consumed during T4 regulated assembling-machine production.
research-grant-work-order-production=Combine a research grant approval with a work order. Consumed during regulated assembling-machine science production.
chemical-handling-work-order-production=Assemble a chemical plant operating work order at the office desk from a petrochemical permit, Form 27B-6, a barrel, and pipework.
radiological-work-order-production=Assemble a centrifuge operating work order at the office desk from chemical paperwork, written management approval, justification, and an environmental report.
safety-work-order-printing=Print a safety work order directly from a draft, producing 2 per craft. Requires an electric printer.
construction-work-order-printing=Print a construction work order directly from a draft, producing 2 per craft. Requires an electric printer.

dubious-data-batch=Batch-smelt bullshit ore into dubious data using a carbon offset certificate. For use in stone and steel furnaces.
dubious-data-refining=Refine raw bullshit ore into dubious data. The backbone of the information economy.
basic-excuse-production=Formulate a basic excuse from 5 dubious data. Used in landscape resolution and low-tier processes.
crappy-report-production=Compile a report from 5 dubious data. The foundation for all higher-tier documentation.
politician-fluid-refining=Refine politician fluid into liquid lies. Requires a Propaganda Distillery.
data-production=Synthesize actual data from a crappy report and official credentials.
good-excuse-production=Craft a convincing excuse by blending real data with liquid lies.
misinformation-production=Produce liquid misinformation from lies and dubious data. A key ingredient in policy-making.
justification-production=Construct a legal justification from misinformation, credentials, and politician fluid.
credentials-production=Produce official credentials from liquid lies, dubious data, and refined nonsense.
narrative-production=Weave an official narrative from justifications, good excuses, and refined nonsense. Controls public perception. Crafted at the Union Headquarters.
white-paper-production=Author an authoritative policy document from data, lies, and a treasury bond at the Union Headquarters.
policy-production=Draft a policy directive at the Union Headquarters. Requires white papers, misinformation, data, and grants.
regulation-production=Draft a federal regulation at the Union Headquarters. Requires empirical facts, credentials, data, and substantial government grants.
promise-production=Handcraft a throwable bureaucratic promise from forms, approvals, and dubious data. Throw at protesting biters to calm them down.
eviction-notice-production=Produce a throwable eviction notice. Destroys biter structures.
hush-money-production=Stuff taxpayer money into a throwable package with just enough paperwork to make it look official. Silences nearby nests for 3 minutes.
rideable-biter=Assign a biter worker to personal transport duty. The resulting vehicle runs on taxpayer money, has only a tiny cargo inventory, cannot be removed after placement, and becomes a complaining biter if unfunded for 10 minutes.
job-offer-production=Draft an official employment contract. Place in an admin station to hire the next resolved biter as a permanent worker.
biter-logistics-formation=Train one biter worker into a dedicated logistics worker for biterport construction and requester-chest jobs.
union-delegate-training=Train a biter worker into a certified union delegate through formal work orders, boilerplate paperwork, and excessive coffee. Required for building the Union Headquarters.
chemical-operator-training=Certify a biter worker for hazardous chemical handling through permit-based training at the Formation Center. Required for chemical plants and oil refineries.
nuclear-technician-training=Train a biter worker in radiological safety procedures. Required for nuclear reactors and centrifuges.
filing-landscape=File a landscape complaint with a blank form. The first step in the complaint resolution pipeline.
filing-smog=File a smog complaint. Takes longer than landscape filing due to additional environmental documentation.
filing-noise=File a noise complaint. Requires significant processing time and documentation.
filing-unemployment=File an unemployment complaint. The most complex filing, requiring extensive documentation.
filing-littering=File a littering complaint with a blank form. The first step in spitter complaint resolution.
filing-hazmat=File a hazmat complaint. Requires additional documentation for hazardous materials.
filing-loitering=File a loitering complaint. Requires extensive restricted-area documentation.
filing-vagrancy=File a vagrancy complaint. The most complex spitter filing, requiring exhaustive displacement records.
case-smog=Build a validated smog case from a filing, paper evidence, and Redundant Rubble.
case-noise=Build a validated noise case from a filing, verified data, and environmental certification.
case-unemployment=Build a validated unemployment case from a filing, empirical facts, and a government grant.
case-hazmat=Build a validated hazmat case from a filing, paper evidence, and compacted rubble.
case-loitering=Build a validated loitering case from a filing, data, credentials, and refined nonsense.
case-vagrancy=Build a validated vagrancy case from a filing, data, and a policy directive.
brief-noise=Legacy compatibility recipe from an older complaint pipeline.
brief-unemployment=Legacy compatibility recipe from an older complaint pipeline.
brief-loitering=Legacy compatibility recipe from an older complaint pipeline.
brief-vagrancy=Legacy compatibility recipe from an older complaint pipeline.
landscape-final=Resolve a landscape complaint using a filing and a basic excuse. The simplest resolution.
smog-final=Resolve a smog complaint using a validated case, misinformation, and liquid coffee.
noise-final=Resolve a noise complaint directly from the validated case, folding the old brief-stage cost into a single heavy final ruling.
unemployment-final=Resolve an unemployment complaint directly from the validated case, folding the old brief-stage cost into a single heavy final ruling.
littering-final=Resolve a littering complaint using a filing and a crappy report. Slightly harder than landscape.
hazmat-final=Resolve a hazmat complaint using a validated case, misinformation, and liquid coffee.
loitering-final=Resolve a loitering complaint directly from the validated case, folding the old brief-stage cost into a single heavy final ruling.
