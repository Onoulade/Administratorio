cyan-magenta-yellow-black=Produce 1,000 Composite Chroma Ribbons. All the colors of the bureaucratic rainbow.
notary-public=Build a Notary Office. Official seals for official deals.
territorial-arbitrator=Build a Territorial Arbitration Post. The demolishers have been served.
demolisher-eviction-specialist=Earn 5 Territorial Deeds. Evicted by bureaucracy.
chartered-accountant=Produce 100 Offworld Metallurgy Charters. Vulcanus IP, now with interplanetary jurisdiction.
conciliation-officer-achievement=Build a Conciliation Desk. Biology meets bureaucracy.
capture-bureau-achievement=Build a Capture Bureau. Job fair for hostile wildlife.
space-tourism-mogul=Produce 500 Public Transportation Contracts. Space tourism: now with paperwork.
symbiosis-specialist=Produce 100 Symbiosis Records per hour. Specimen bookkeeping at scale.
digital-services-bureau-achievement=Build a Digital Services Bureau. 24/7 uptime, zero coffee breaks.
archive-recombinator=Build an Archive Recombination Bureau. One form in, three maybes out.
form-gambler=Process 1,000 Old Archives. The house always wins, but sometimes you get a permit.
relay-clerk-corps=Train 10 Relay Clerks. Electromagnetic routing specialists, reporting for duty.
laser-printer-achievement=Build a Laser Printer. No liquid ink survives Aquilo's dress code.
thermal-paper-pusher=Produce 5,000 Thermal Transfer Sheets. Premium substrate for premium planets.
ribbon-collector=Produce 2,000 Composite Chroma Ribbons. Compressed color for the colorless void.
interplanetary-correspondent=Produce 50 Unified Operations Charters. The capstone of interplanetary bureaucracy.
cyan-yellow-bureaucrat=Produce 500 Cyan-Yellow Forms. Vulcanus and Gleba, merged.
cyan-magenta-bureaucrat=Produce 500 Cyan-Magenta Forms. Vulcanus and Fulgora, heat-sealed.
yellow-magenta-bureaucrat=Produce 500 Yellow-Magenta Forms. Gleba and Fulgora, biologically archived.
hardened-data-hoarder=Produce 100 Hardened Data Vaults. Data custody for the apocalypse.
bureaucratic-transcendence-achievement=Research Bureaucratic Transcendence. Paperwork is no longer a bottleneck for transit.
form-free-transit=Build 50 Public Train Stops. Trains that just work. A miracle.
maxed-out-orbital-capacity=Research Orbital Employment Capacity 4. Five miners per asteroid. HR approved.
maxed-out-orbital-damage=Research Orbital Employment Damage 5. Miners now hit like a ton of bricks.
speed-demon-arrays=Research Trajectory Compliance Speed 9. Fire deviation orders every half second.
executive-jurisdiction=Research Trajectory Compliance Jurisdiction 3. Every asteroid size. No appeals.
vulcanus-export-licensed=Research Vulcanus Export Charters. Metallurgy goes interplanetary.
cyan-yellow-merged=Research Cyan-Yellow Bureaucracy. Two planets, one form.
cyan-magenta-merged=Research Cyan-Magenta Bureaucracy. Metallurgy meets electromagnetics.
yellow-magenta-merged=Research Yellow-Magenta Bureaucracy. Biology meets salvage.
welcome-to-the-department=Build your first Biter Administration Desk. Your cubicle awaits.
discovery-of-bullshit=Research Discovery of Bullshit. It was right under your feet this whole time.
ink-stained=Research Printing Technology. The printer is jammed. Again.
form-27b-6-achievement=Produce 100 Form 27B/6 per hour. You haven't filed your 27B/6.
paper-pusher=Produce 1000 Blank Forms per hour. The trees didn't die for nothing.
capsule-promise=Use a Promise Capsule. A promise is a comfort to a fool.
its-a-copy-of-a-copy=Research Local Precedents. Somehow the copy is more official than the original.
permit-denied=Build 10 train stops. No train moves without paperwork.
coffee-break=Build a Corporate Breakroom. Finally, the most important building.
pneumatic-delivery=Research Pneumatic Form Transport. Woooosh! Forms through pipes. What a time to be alive.
propaganda-machine=Build a Propaganda Distillery. Manufacturing consent, one barrel at a time.
endless-meetings=Research Board Meetings. This still could have been an email.
union-strong=Build a Union Headquarters. The workers have organized. Management is concerned.
environmental-compliance-achievement=Research Environmental Compliance. The oil and chemical economy can now proceed under proper paperwork.
constitutional-scholar=Research Constitutional Law. You have read every regulation. All of them.
know-it-all=Research all technologies. Congratulations, you're overqualified.
eviction-notice-achievement=Use 100 Eviction Notices. Nothing personal, it's just policy.
mass-transit=Have a train travel more than 2000 tiles. Each stop requires its own transit authorization.
first-complaint=Register your first biter at an admin station. They have concerns.
first-protest=Let a biter's frustration boil over into an actual protest. You saw this coming.
case-closed=Resolve your first biter complaint. One down, infinity to go.
protest-suppressed=Pacify a protesting biter with a promise. The biter has been calmed with vague assurances.
department-of-everything=Have 10 admin stations powered simultaneously. The bureaucracy expands to meet the needs of the expanding bureaucracy.
full-resolution=Resolve at least one complaint of each of the 8 types. A complaint for every occasion.
behemoth-paperwork=Register a behemoth biter at an admin station. That's... a lot of forms.
