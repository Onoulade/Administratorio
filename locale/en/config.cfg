[item-description]
bullshit-ore=A naturally occurring deposit of pure, unrefined nonsense. The foundation of the entire bureaucratic economy. Mine it, refine it, weaponize it.
redundant-rubble=Mineralized waste produced by excessive procedural oversight. Entirely useless on its own, but legally required for binding official documents.
compacted-rubble=Industrially compressed bureaucratic waste, certified for use. Made from redundant rubble processed through regulated smelting with a carbon offset certificate.
useless-documentation=Redundant rubble carefully wrapped in layers of paper. Officially documented uselessness. Required for standardized filing and financial instruments.
refined-nonsense=Pure, concentrated bureaucratic absurdity. Created by fusing compacted rubble with liquid misinformation in a Propaganda Distillery. The backbone of high-tier administrative processes.
paper=Standard-issue bureaucratic substrate. Made from wood or synthesized from plastics. Used for everything from blank forms to supreme court briefs.
coffee-bean=A rare and precious commodity. Discovered by sifting through compost. The lifeblood of any functioning bureaucracy.

ink=Raw writing fluid extracted from coal. Can be used for handwritten documents or refined into cartridges.
blank-form=An empty administrative form awaiting its purpose. The blank canvas of bureaucracy. Used in nearly every paperwork recipe.
blank-approval=A pre-printed approval template requiring official ink finalization. Used for safety waivers, construction permits, and transit authorizations.
blank-directive=A high-security directive template with triple ink application. Required for management-level approvals.
safety-waiver-draft=An unfinalized safety waiver awaiting printer verification and ink seal.
construction-permit-draft=An unfinalized construction permit awaiting printer verification and ink seal.
management-verbal-draft=A draft verbal approval extracted from a breakroom conversation. Needs printer finalization.
management-written-proposal=A management proposal from an endless meeting. Requires two rounds of printer finalization.
management-written-review=A management proposal after first printer review. One more printing pass to finalize.
admin-station=The biter interface desk. Its built-in waiting zone shows exactly where biters queue; place resolved items back here to satisfy them. Storage only — no crafting.
resolution-office=A dedicated office for complaint processing. Handles filing, casework, briefs, and final resolutions.
office-desk=A versatile workstation for forms, science packs, funding paperwork, and general administrative tasks. Keeps daytime office hours unless fitted with an [item=overtime-exemption].
office-desk-no-working-hours=A versatile workstation for forms, science packs, funding paperwork, and general administrative tasks.
union-headquarters=A sprawling complex where workforce approval is negotiated. Handles government grants, verified carbon certificates, and OSHA scrubbing. Closes at night unless fitted with an [item=overtime-exemption].
union-headquarters-no-working-hours=A sprawling complex where workforce approval is negotiated. Handles government grants, verified carbon certificates, and OSHA scrubbing.
propaganda-distillery=A specialized facility for processing administrative fluids. Refines politician fluid into liquid lies, synthesizes misinformation, and produces credentials.
administrative-science-pack=The gray science pack. Fuels administrative research. Crafted at the Administrative Office Desk.
taxpayer-money=Hard-earned currency extracted from resolved biter complaints. The primary funding source for government operations.
treasury-bond=A government-backed financial instrument. Combines taxpayer money with useless documentation. Used in high-tier construction and policy.
government-grant=A significant allocation of public funds. Required for major infrastructure, meetings, and policy development.
transit-authorization=Official travel documentation (Form 12-T). Place in the transit permit chest at a train stop. One consumed per arrival — the station's train limit equals the number of forms in the chest.
greenhouse=A climate-controlled growing facility. Produces wood from water, and with proper inputs, rare coffee beans.

pneumatic-pipe=Sealed manila-colored pipe for transporting fluidized paperwork. Does NOT connect to regular fluid pipes.
pneumatic-pipe-to-ground=Underground pneumatic pipe for routing paperwork beneath buildings. Does NOT connect to regular fluid pipes.
form-liquifier=Converts paperwork items into fluidized form for pneumatic transport. Place items adjacent; a hidden inserter feeds them in automatically.
form-solidifier=Converts fluidized paperwork back into solid items. Output items are pushed to adjacent inventory via hidden inserter.
transit-permit-chest=Chest automatically placed at train stops. Load transit authorizations here — one is consumed per train arrival. The station's train limit equals the number of forms. Accessible by inserters and logistics.

safety-work-order=A combined assembler authorization for safety-tier regulated crafting. Used only by assembling machines. Consumed on use.
construction-work-order=A combined assembler authorization for construction-tier regulated crafting. Used only by assembling machines. Consumed on use.
management-verbal-work-order=A combined assembler authorization backed by a manager's verbal promise. Used only by assembling machines. Consumed on use.
management-written-work-order=A combined assembler authorization backed by a signed management directive. Used only by assembling machines. Consumed on use.
research-grant-work-order=A combined assembler authorization for scientific research production. Used only by assembling machines. Consumed on use.
chemical-handling-work-order=A specialist operating work order for chemical plants. Built from petrochemical permits, management approval, and credentials. Consumed by chemistry recipes.
radiological-work-order=A high-security operating work order for centrifuges and radiological processing. Built from chemical paperwork and written management approval. Consumed by centrifuging recipes.

carbon-offset-certificate-basic=A basic certificate that permits limited industrial smelting. Consumed by furnace batch smelting recipes.
carbon-offset-certificate-verified=An upgraded certificate with official verification. Required for steel furnace construction and advanced smelting.

work-order=A basic assembler work authorization for regulated crafting recipes. Used only by assembling machines and to assemble higher-tier assembler paperwork.
form-27b-6=The infamous standardized requisition form. Used in transit paperwork, compliance reporting, and higher-tier bureaucracy.
safety-waiver=A document absolving the administratorion of all liability. Required for T1 entity construction and for assembling heavier operating permits.
environmental-impact-report=A comprehensive (if heavily redacted) assessment of environmental damage. Used to issue petrochemical and radiological operating paperwork.
management-approval-verbal=A manager's spoken agreement, technically binding but easily denied. Requires coffee to extract.
management-approval-written=A signed, notarized management commitment. Much harder to obtain but impossible to deny.
research-grant-approval=A basic research grant authorization. Required for all science pack production. Simple but essential.
petrochemical-operating-permit=A specialist operating permit for oil refineries and petrochemical plants. Built from construction, safety, and environmental paperwork. Consumed by oil-processing recipes.
provisional-approval=An entry-level bureaucratic clearance. Required for stone furnaces and burner equipment. Your first taste of redundant rubble.

filing-l=A formally filed landscape complaint. The first step in resolving a citizen's grievance about the local scenery.
filing-s=A formally filed smog complaint. Documents a citizen's objection to industrial air pollution.
filing-n=A formally filed noise complaint. Records a citizen's grievance about noise disturbances from your infrastructure.
filing-u=A formally filed unemployment complaint. The most severe citizen grievance, alleging systemic economic failure.
filing-lt=A formally filed littering complaint. Documents a spitter's objection to acid puddles left everywhere.
filing-h=A formally filed hazmat complaint. Records a spitter's grievance about hazardous material exposure.
filing-lo=A formally filed loitering complaint. Documents a spitter's objection to restricted area violations.
filing-v=A formally filed vagrancy complaint. The most severe spitter grievance, alleging displacement and homelessness.

case-s=A validated legal case for smog violation. Requires filed complaint, paper evidence, and Redundant Rubble.
case-n=A validated legal case for noise violation. Requires filed complaint, verified data, and environmental certification.
case-u=A validated legal case for unemployment. Requires filed complaint, empirical facts, and a government grant.
case-h=A validated legal case for hazmat violation. Requires filed complaint, paper evidence, and compacted rubble.
case-lo=A validated legal case for loitering violation. Requires filed complaint, data, credentials, and refined nonsense.
case-v=A validated legal case for vagrancy. Requires filed complaint, data, and a policy directive.

brief-n=A supreme court brief arguing the noise case. Requires a validated case, a white paper, and a policy directive.
brief-u=A supreme court brief arguing the unemployment case. The final document tier. Requires a validated case, federal regulation, and treasury bonds.
brief-lo=A supreme court brief arguing the loitering case. Requires a validated case, a white paper, and federal regulation.
brief-v=A supreme court brief arguing the vagrancy case. The final spitter document tier. Requires a validated case, policy, treasury bonds, and refined nonsense.

construction-permit=A standard construction authorization. Required as an ingredient in most building recipes and in heavier operating permits.

dubious-data=Refined from bullshit ore. Unreliable, but technically qualifies as information. The backbone of the excuse economy.
basic-excuse=A simple justification assembled from dubious data. Used in landscape resolution and low-tier bureaucratic processes.
crappy-report=A hastily compiled report of questionable accuracy. The foundation for all higher-tier documentation.
credentials=Official credentials produced from liquid lies, dubious data, and refined nonsense. Proof of authority, however dubious the source.
data=Synthesized from crappy reports and credentials. Actual usable information. A rare commodity in this administratorion.
good-excuse=A well-crafted justification blending real data with liquid lies. Used in high-tier approvals and narrative construction.
justification=A formal legal justification built from misinformation, credentials, and politician fluid. Used in OSHA scrubbing.
narrative=The official story, woven from justifications, good excuses, and refined nonsense. Controls public perception of your administratorion.
white-paper=An authoritative policy document blending data, lies, and raw bullshit. The foundation of government policy.
policy=A directive drafted in endless meetings. Requires white papers, misinformation, data, and government grants.
regulation=A federal regulation drafted through exhaustive bureaucratic process. The ultimate expression of governmental authority.
promise=A throwable capsule containing a bureaucratic promise. Throw at a protesting biter to pacify it temporarily.
eviction-notice=A throwable capsule that destroys biter structures. Use with extreme caution.

resolved-landscape=A fully resolved landscape complaint. Proof that the system works (occasionally).
resolved-smog=A fully resolved smog complaint. Required significant misinformation and coffee to achieve.
resolved-noise=A fully resolved noise complaint. Took a supreme court brief, policies, coffee, narratives, and credentials.
resolved-unemployment=A fully resolved unemployment complaint. The pinnacle of bureaucratic achievement. You solved unemployment.
resolved-littering=A fully resolved littering complaint. The acid puddles have been officially reclassified as decorative features.
resolved-hazmat=A fully resolved hazmat complaint. Required compacted rubble evidence, misinformation, and coffee.
resolved-loitering=A fully resolved loitering complaint. Took a supreme court brief, regulations, coffee, narratives, and credentials.
resolved-vagrancy=A fully resolved vagrancy complaint. The ultimate spitter bureaucratic achievement. You solved homelessness.

ticket-landscape=A citizen complaint about landscape destruction. Generated by small biters at admin stations.
ticket-smog=A citizen complaint about air pollution. Generated by medium or larger biters.
ticket-noise=A citizen complaint about noise pollution. Generated by big or larger biters.
ticket-unemployment=A citizen complaint about unemployment. Generated only by behemoth biters.
ticket-littering=A spitter complaint about acid puddle littering. Generated by small spitters at admin stations.
ticket-hazmat=A spitter complaint about hazardous material exposure. Generated by medium or larger spitters.
ticket-loitering=A spitter complaint about restricted area violations. Generated by big or larger spitters.
ticket-vagrancy=A spitter complaint about displacement and homelessness. Generated only by behemoth spitters.

printer-t1=A basic electric printer. Slow but reliable. Produces printed documents from ink cartridges.
printer-t2=A high-speed industrial printer with copy mode. Can duplicate documents: 1 original produces 6 copies.
mechanical-printer=A hand-cranked printer. Your workhorse until you unlock electric printing.



speed-module=Accelerates machine crafting speed by 20% at the cost of 50% extra energy consumption.
speed-module-2=Accelerates machine crafting speed by 30% at the cost of 70% extra energy consumption.
speed-module-3=Accelerates machine crafting speed by 50% at the cost of 100% extra energy consumption.
productivity-module=Provides 4% productivity bonus. Slows machines and increases energy and pollution.
productivity-module-2=Provides 6% productivity bonus. Slows machines and increases energy and pollution.
productivity-module-3=Provides 10% productivity bonus. Slows machines and increases energy and pollution.
efficiency-module=Reduces energy consumption by 30%.
efficiency-module-2=Reduces energy consumption by 40%.
efficiency-module-3=Reduces energy consumption by 50%.

corporate-breakroom=A social hub where coffee fuels the rumor mill. Produces watercooler gossip, good excuses, and verbal management drafts. Closes at night unless fitted with an [item=overtime-exemption].
meeting-room=A 7x7 conference facility for written management proposals, policy work, and late-stage audits. Closes at night unless fitted with an [item=overtime-exemption].
osha-violation=A workplace safety violation generated by hazardous industrial processing. Can be scrubbed or recycled through the Union Headquarters.
watercooler-gossip=Informal intelligence gathered around the water cooler. Required for corporate decision-making.
office-drama=Interpersonal conflict generated as a byproduct of office gossip. Can be recycled at the breakroom with enough coffee.




