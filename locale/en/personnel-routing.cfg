personnel-routing=Yellow-magenta paperwork authorizes walking personnel transfers. Requires yellow, Gleba and Fulgora science. Trained biter personnel, except Field Agents and rideable biters, travel from sign to sign and queue closely at invalid connections. Extend the lane to resume; forced deletion recovers the original items.
