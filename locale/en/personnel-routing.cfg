[technology-description]
personnel-routing=Green science and Form 27B/6 authorize signed walking lanes, offices and incoming personnel counts. Personnel walk at 50% of vanilla small-biter speed. Extend blocked routes to drain queues. No power or salary required.
personnel-routing-speed-1=Blue science authorizes brisker commuting: all personnel lanes run at 100% of vanilla small-biter speed.
personnel-routing-speed-2=Purple science authorizes expedited commuting: all personnel lanes run at 150% of vanilla small-biter speed.
personnel-routing-multisign=Blue science unlocks a rotatable three-way sign. Independent live circuit signals filter which personnel may use the left, straight and right exits; closed or unavailable exits hold the queue.
