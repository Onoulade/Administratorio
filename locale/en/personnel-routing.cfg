personnel-routing=Personnel Routing
[technology-description]
personnel-routing=Yellow-magenta paperwork authorizes walking personnel transfers between Deployment and Reception Offices. Research requires yellow, Gleba and Fulgora science. Accepts trained biter personnel except Field Agents and rideable biters. Biters queue in reserved 2×2 blocks; broken routes retain their cargo or recover it to a crate.
