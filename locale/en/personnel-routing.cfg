[entity-description]
personnel-deployment-office=Insert trained personnel. Field Agents and rideable biters are excluded. Dispatches one walking biter onto a complete signed route to a Reception Office. Rotate to choose the departure direction. Requires no power or salary. Snaps to the shared rail-style 2×2 grid.
personnel-reception-office=Returns arriving personnel to their original items in the output inventory, ready for inserters. A full output holds the queue safely. Snaps to the shared rail-style 2×2 grid.
personnel-routing-sign=Turns personnel in the arrow direction. Automatically paves a clear, straight, two-tile-wide lane to the next aligned sign or Reception Office. A complete route to reception is required. Reserved signs cannot be mined or rotated. Snaps to the shared rail-style 2×2 grid.
personnel-path=Automatic teal-tinted vanilla concrete marking a protected personnel lane. Appears between connected signs and offices; no pavement item is crafted or placed. Allows belts, inserters and power poles. Updates when idle infrastructure is removed or rotated.
personnel-recovery-crate=Personnel recovered from an interrupted route. Open this crate or use an inserter to retrieve the original items. Protected from combat damage.
personnel-in-transit=Personnel in transit. Moves continuously at vanilla small-biter speed along reserved 2×2 lanes, with native walking animation. The original item is held safely until reception or recovery. Briefed managers show a briefing badge and remaining-time bar. Briefings expire normally while traveling or queued; the overlay disappears at expiry. Body tint identifies the role loaded at departure.
