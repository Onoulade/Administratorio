[entity-description]
personnel-deployment-office=Insert trained personnel. Field Agents and rideable biters are excluded. Dispatches to the next reachable sign or Reception Office; no complete route to reception is required. Personnel queue safely at an invalid onward connection. Rotate to choose departure. Requires no power or salary. Snaps to the rail-style 2×2 grid.
personnel-reception-office=Accepts incoming paths from all four sides and cannot be rotated. Returns arriving personnel to their original items in the output inventory, ready for inserters. A full output holds the queue safely. Snaps to the shared rail-style 2×2 grid.
personnel-routing-sign=Routes personnel along its arrow and automatically paves the clear lane. Wire this sign to read how many of each personnel type are heading toward it on ALL immediate incoming segments, including queues; qualities are summed. Rotate at any time. Entering biters keep their saved turn. An invalid onward route clogs the approach until repaired. Snaps to the shared 2×2 grid. A junction admits one biter at a time; occupied signs cannot be mined.
personnel-path=Automatic teal-tinted vanilla concrete marking a protected personnel lane. Appears between connected signs and offices; no pavement item is crafted or placed. Allows belts, inserters and power poles. Updates when idle infrastructure is removed or rotated.
personnel-recovery-crate=Personnel recovered from an interrupted route. Open this crate or use an inserter to retrieve the original items. Protected from combat damage.
personnel-in-transit=Personnel in transit. Moves continuously at 50% of vanilla small-biter speed; blue research raises it to 100%, purple to 150% on protected lanes. Its 2×2 body stays separated from others; queues use 2.5-tile center spacing. Waits at an invalid next connection or full reception and resumes when clear. The original item stays saved. Briefed managers show a briefing badge and time bar. Spoilage advances at half speed while traveling or queued. Expired briefings and egg couriers become regular MMMM on the path and continue their journey; body tint follows the current role.
personnel-routing-multisign=Three exits relative to the arrow: left, straight and right. Open the body or any brass socket to choose up to five personnel filters per exit, or switch each exit to live circuit signals. Manual filters match all qualities; empty filters close the exit. In circuit mode, positive personnel item signals allow those types; red/green values and qualities are added. A missing route or unmatched type holds biters fully outside the junction. Duplicate matches prefer left, straight, then right, without fallback. Rotate the body or any socket, even while blocked. Entering biters keep their reserved exit. Snaps to the shared 2×2 grid. One biter enters at a time; occupied signs cannot be mined.
personnel-routing-filter-port=Independent red/green circuit input for this exit of the Personnel Multisign. Open to configure the whole sign. In Circuit mode, positive personnel item signals allow those types; no positive signal closes the exit. Manual mode uses the five saved filters and ignores this input. Rotate this socket to turn the whole sign. Wires stay attached; the socket cannot be removed separately.
