[item-description]
personnel-deployment-office=Materializes personnel on a protected signed lane. Green-tier steel, electronic circuits and Form 27B/6 authorize deployment.
personnel-reception-office=Returns walking personnel to items for inserters. Green-tier steel, electronic circuits and Form 27B/6 authorize reception.
personnel-routing-sign=Directional sign for a protected personnel path. Rotate at any time; entering personnel keep their saved direction.
personnel-path=Automatic teal-tinted vanilla concrete marking a protected personnel lane. Appears between connected signs and offices; no pavement item is crafted or placed. Allows belts, inserters and power poles. Updates when idle infrastructure is removed or rotated.
personnel-routing-multisign=Rotatable three-way sign with up to five manual personnel filters per exit or independent live circuit inputs.
