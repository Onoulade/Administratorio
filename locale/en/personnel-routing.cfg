[entity-description]
personnel-deployment-office=Insert trained personnel. Field Agents and rideable biters are excluded. Dispatches to the next reachable sign or Reception Office; no complete route to reception is required. Personnel queue safely at an invalid onward connection. Rotate to choose departure. Requires no power or salary. Snaps to the rail-style 2×2 grid.
personnel-reception-office=Returns arriving personnel to their original items in the output inventory, ready for inserters. A full output holds the queue safely. Snaps to the shared rail-style 2×2 grid.
personnel-routing-sign=Sends personnel toward the next reachable sign or Reception Office and automatically paves the clear, aligned lane. If no valid onward connection exists, personnel stop before the sign’s 2×2 area and queue behind it. Add the next destination to resume. A terminal queue can be redirected even while followers approach. Rotation is blocked only while personnel depend on an admitted outgoing segment or are still clearing its turn. Occupied signs cannot be mined. Snaps to the rail-style 2×2 grid.
personnel-path=Automatic teal-tinted vanilla concrete marking a protected personnel lane. Appears between connected signs and offices; no pavement item is crafted or placed. Allows belts, inserters and power poles. Updates when idle infrastructure is removed or rotated.
personnel-recovery-crate=Personnel recovered from an interrupted route. Open this crate or use an inserter to retrieve the original items. Protected from combat damage.
personnel-in-transit=Personnel in transit. Moves continuously at vanilla small-biter speed on protected lanes. Its 2×2 body stays separated from others; queues use 2.5-tile center spacing. Waits at an invalid next connection or full reception and resumes when clear. The original item stays saved. Briefed managers show a briefing badge and time bar; briefings expire normally while traveling or queued. Body tint identifies the departure role.
