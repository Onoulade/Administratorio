[entity-description]
personnel-deployment-office=Insert trained personnel. Field Agents and rideable biters are excluded. Dispatches to the next reachable sign or Reception Office; no complete route to reception is required. Personnel queue safely at an invalid onward connection. Rotate to choose departure. Requires no power or salary. Snaps to the rail-style 2×2 grid.
personnel-reception-office=Accepts incoming paths from all four sides and cannot be rotated. Returns arriving personnel to their original items in the output inventory, ready for inserters. A full output holds the queue safely. Snaps to the shared rail-style 2×2 grid.
personnel-routing-sign=Routes personnel along its arrow and automatically paves the clear lane. Wire this sign to read how many of each personnel type are heading toward it on ALL immediate incoming segments, including queues; qualities are summed. Rotate at any time. Entering biters keep their saved turn. An invalid onward route clogs the approach until repaired. Snaps to the shared 2×2 grid. A junction admits one biter at a time; occupied signs cannot be mined.
personnel-path=Automatic teal-tinted vanilla concrete marking a protected personnel lane. Appears between connected signs and offices; no pavement item is crafted or placed. Allows belts, inserters and power poles. Updates when idle infrastructure is removed or rotated.
personnel-recovery-crate=Personnel recovered from an interrupted route. Open this crate or use an inserter to retrieve the original items. Protected from combat damage.
personnel-in-transit=Personnel in transit. Moves continuously at 50% of vanilla small-biter speed; blue research raises it to 100%, purple to 150% on protected lanes. Its 2×2 body stays separated from others; queues use 2.5-tile center spacing. Waits at an invalid next connection or full reception and resumes when clear. The original item stays saved. Briefed managers show a briefing badge and time bar; briefings expire normally while traveling or queued. Body tint identifies the departure role.
personnel-routing-multisign=Three exits relative to the arrow: left, straight and right. Wire the matching brass socket at each arrow tip: left, straight or right. Each socket is a separate live circuit input; clicking never opens a signal editor. Positive personnel item signals allow those types on that exit; absent or nonpositive signals close it. Red and green values are added, across all qualities. A missing route or unmatched type clogs the approach. Duplicate matches prefer left, then straight, then right, without fallback. Entering biters keep their saved exit through later signal changes or rotation. Snaps to the shared 2×2 grid. A junction admits one biter at a time; occupied signs cannot be mined.
personnel-routing-filter-port=Independent red/green circuit input for this exit of the Personnel Multisign. Positive personnel item signals allow those types. No positive signal closes the exit. This socket rotates with its sign and cannot be removed separately. Connect wire here; no signals are configured by clicking.
