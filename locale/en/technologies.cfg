[technology-description]
quality-module=Codifies basic administrative certification standards and unlocks Accreditation Module 1.
quality-module-2=Raises certification requirements to an advanced, substantially more expensive administrative level.
quality-module-3=Establishes executive certification, where paperwork becomes both prestigious and fiscally alarming.
epic-quality=Authorizes Cabinet-level accreditation and the epic certification grade.
legendary-quality=Authorizes Ministerial accreditation and the legendary certification grade.
involuntary-relocation=Unlocks the [entity=involuntary-relocation-cannon] and its transfer orders. Moves biter-family personnel between planets a batch at a time — one-tonne couriers outbound, spent managers inbound — so the 30-minute courier window is survivable.
egg-courier-formation=Biter eggs never leave Nauvis: spoiled eggs hatch hostile biters, and offworld there is no Administration Desk to process them. Trains Missionary Managers, Voluntary Research Subjects, and Geotechnical Assessment Managers on Nauvis to carry the authorisation instead.
synthetic-personnel=Unlocks the [entity=synthetic-personnel-bureau] and profession synthesis for every specialist a planet building demands. Ends the Nauvis round trip for specialists; electricity is the constraint.
unstaffed-operations=Unlocks the [item=unstaffed-operations-waiver], a module that lets one biter-station managed building run without a dispatched worker biter. It fits nothing else.
aquilo-ai-inference=Unlocks the [entity=ai-server], the [entity=slop-refinery], the [entity=heat-exhaust] and [entity=optical-fibre]. The server makes inference from electricity alone; the refinery turns it into paperwork. Inference is a fluid that only optic fibre can carry. Servers draw enormous power and emit real heat into the vanilla heat network; an under-cooled server stops. Fabricates rank 0-1 uncolored paperwork.
administratorium-slop-synthesis=Extends slop synthesis to rank 2-3 uncolored paperwork at a huge token cost and a flood of fabricated citations. Colored paperwork is never producible from slop, at any tier.
interplanetary-tube-network=Open a slow, narrow trunk between planets. It carries only regular black-ink paperwork at first (3 items in flight, 30 seconds each); colored and composite paperwork still needs rockets until Aquilo's Chromatic Tube Trunk research.
interplanetary-tube-capacity-2=Widen the interplanetary trunk to 5 items in flight and cut per-item transit to 15 seconds.
interplanetary-tube-capacity-3=Widen the interplanetary trunk to 10 items in flight and cut per-item transit to 5 seconds.
interplanetary-tube-capacity-4=Widen the interplanetary trunk to 15 items in flight and cut per-item transit to 2 seconds.
interplanetary-tube-capacity-5=Widen the interplanetary trunk to 20 items in flight and cut per-item transit to 1 second.
interplanetary-tube-additional-terminus-1=Allow a second Interplanetary Terminus on any one planet.
interplanetary-tube-additional-terminus-2=Allow a third Interplanetary Terminus on any one planet.
interplanetary-tube-additional-terminus-3=Allow another Interplanetary Terminus on any one planet. Research again for one more, without limit.
interplanetary-tube-chromatic=Extend the trunk to cyan, yellow, magenta, and composite paperwork. This is the first Terminus tier that can move planet-colored requirements between worlds; it also unlocks Aquilo's final convergence documents.
discovery-bullshit=You found it. Now you just need to refine it into a valid argument. Unlocks dubious data refining, basic excuse production, the first safety-waiver and construction-permit paperwork, and basic landscape resolutions.
discovery-redundant-rubble=Touching the local geology has immediately buried you in a landslide of redundant requirements. Unlocks the first landscape filings and the burner mining drill.
field-office-deployment=Your first field office establishes just enough local authority to issue provisional approvals, promises, and the first admin station.
administrative-science-research=Formalizing the complaint resolution pipeline into a reproducible science. Unlocks pink administrative science packs.
printing-technology=Mechanized document production. Unlocks the Basic Printer once both bootstrap discoveries are in place.
government-liaison=Formalize biter-government permit sign-off. Unlocks the Petition Counter and all permit approval stamping recipes.
administrative-bureaucracy=Grow renewable wood under controlled greenhouse conditions. Unlocks the Greenhouse and wood production.
admin-station-capacity=Expand each Admin Station waiting zone by one additional slot.
rubble-compaction=Compress redundant rubble into a standardized building material for later infrastructure. Unlocks compacted rubble production.
littering-resolution=Formalize procedures for handling illegal dumping complaints. Unlocks crappy reports, littering filing, and littering resolution.
industrial-printing=Scale paperwork throughput beyond a single electric printer with chemical-era infrastructure. Unlocks the Industrial Printer plus bulk copy recipes for blank forms, blank approvals, carbon certificates, Form 27B-6, environmental impact reports, and blank directives.
chromatic-printing=Introduce the shared Space Age printer, but not a universal color supply. Cyan originates on Vulcanus, yellow on Gleba, and magenta on Fulgora; each planet's bootstrap research authorizes its own forms.
cyan-ink-production=Mine Verdigris Crust on Vulcanus to unlock cyan slurry, cyan ink, heatproof form stock, and the blank cyan forms required before metallurgic science.
fulgora-salvage-administration=Recover charged toner from Fulgoran scrap and establish the magenta ink, archive recovery, and blank-magenta-form chain required before electromagnetic science.
aquilo-cryogenic-administration=Establish Aquilo's frozen-ink workflow. It needs prior-world colored paperwork plus local transfer media; unlocks the Laser Printer, Cryoprint Technician training, and the license required for the first Cryogenic Plant.
worker-formation=Establish the basic post-space workforce route. Unlocks job offers and general worker formation on Nauvis.
management-formation=Train management staff on Nauvis and authorize five cheap, cashless temporary manager briefings that can be held on any planet.
specialized-formation=Train Astronauts for administrative space-platform work without requiring utility, space, or planetary science.
orbital-employment-infrastructure=Unlock the Administrative Space Station and its basic paperwork loop before utility or space science. Space Age's single native space-science recipe runs there using Research Grant Approvals imported from a planet.
orbital-compliance-systems=Authorize Trajectory Compliance Arrays, routine deviation orders, the Orbital Miner Deployment Catapult, and Voluntary Exploration Space Miners before platform propulsion.
workforce-formation=Establish a dedicated post-space workforce bureaucracy. Profession formation stays on Nauvis, while five cheap cashless MMMM briefings can run on any planet.
trajectory-compliance-speed-1=Reduce the array firing cycle to 4.5 seconds through elementary orbital micromanagement.
trajectory-compliance-speed-2=Reduce the array firing cycle to 4 seconds through increasingly aggressive performance reviews.
trajectory-compliance-speed-3=Reduce the array firing cycle to 3.5 seconds by removing several legally ambiguous coffee breaks.
trajectory-compliance-speed-4=Reduce the array firing cycle to 3 seconds through administrative overclocking.
trajectory-compliance-speed-5=Reduce the array firing cycle to 2.5 seconds using the combined bureaucracy of the first three planets.
trajectory-compliance-speed-6=Reduce the array firing cycle to 2 seconds by treating orbital safety as a quarterly metric.
trajectory-compliance-speed-7=Reduce the array firing cycle to 1.5 seconds through interplanetary executive acceleration.
trajectory-compliance-speed-8=Reduce the array firing cycle to 1 second using cryogenic scheduling discipline.
trajectory-compliance-speed-9=Reduce the array firing cycle to 0.5 seconds through Administratorium-grade managerial urgency.
trajectory-compliance-jurisdiction-1=Establish the first orbital review office. Junior arrays may redirect small and medium asteroids from 20 tiles away.
trajectory-compliance-jurisdiction-2=Seat representatives from all three first planets on the orbital review board. Senior arrays may redirect big asteroids from 30 tiles away.
trajectory-compliance-jurisdiction-3=Grant quantum-backed executive authority before the Administratorium expedition begins. Executive arrays may redirect huge asteroids from 40 tiles away.
orbital-employment-damage-1=Authorize improved zero-gravity mining technique. Each attached VESM performs 187.5 mining damage per second.
orbital-employment-damage-2=Replace motivational posters with reinforced drill fittings. Each attached VESM performs 250 mining damage per second.
orbital-employment-damage-3=Combine three planets' mineral law into one aggressive extraction method. Each attached VESM performs 312.5 mining damage per second.
orbital-employment-damage-4=Use cryogenic scheduling to preserve peak extravehicular performance. Each attached VESM performs 375 mining damage per second.
orbital-employment-damage-5=Apply Administratorium-grade exploration doctrine. Each attached VESM performs 437.5 mining damage per second.
orbital-employment-capacity-1=Authorize a second simultaneous voluntary miner assignment per asteroid.
orbital-employment-capacity-2=Establish a three-planet support structure for three miners per asteroid.
orbital-employment-capacity-3=Use cryogenic shift scheduling to support four miners per asteroid.
orbital-employment-capacity-4=Approve an Administratorium-grade exploration team of five miners per asteroid.
vulcanus-certification=Formalize the Vulcanus certification office. Unlocks the Notary Office, the core charter family, local liquid-lie relief, and fallback launch paperwork that keeps a first Vulcanus colony moving toward space.
vulcanus-export-charters=Unlock explicit Vulcanus export permissions. Thermal Process Licenses and Calcite Reagent Waivers let their named processes run off-world; the Offworld Metallurgy Charter covers the key foundry, tungsten, and calcite recipes. Colored documents ship by rocket until the Aquilo chromatic trunk tier.
amber-sap-processing=Pump an Amber Sap Seep to discover Gleba's local bullshit ore, ink, carbon certificate, provisional approval, and construction permit routes.
gleba-conciliation=Formalize Gleba's pre-science capture bureaucracy. Unlocks the Capture Bureau, Conciliation Officer training, egg-harvesting mode, Chemical Plant-compatible lure spores, yellow ink, and the yellow paperwork chain before agricultural science.
fulgora-digital-services=Formalize Fulgora's digital bureaucracy. Unlocks the Digital Services Bureau and the finalized archive-and-electromagnetics paperwork family that sits on top of the earlier magenta salvage chain.
archive-recombination=Standardize Fulgora's salvage bureaucracy. Unlocks the employee-staffed Archive Reassignment Recycler, a one-input Recycler variant with three independently rolled 25% replacement candidates per supported form.
cyan-yellow-bureaucracy=Converge Vulcanus cyan and Gleba yellow paperwork for recipes needing both jurisdictions. This is a genuine two-planet supply requirement; its form is trunk-legal only after Aquilo's Chromatic Tube Trunk research.
cyan-magenta-bureaucracy=Converge Vulcanus cyan and Fulgora magenta paperwork for recipes needing both jurisdictions. This is a genuine two-planet supply requirement; its form is trunk-legal only after Aquilo's Chromatic Tube Trunk research.
yellow-magenta-bureaucracy=Converge Gleba yellow and Fulgora magenta paperwork for recipes needing both jurisdictions. This is a genuine two-planet supply requirement; its form is trunk-legal only after Aquilo's Chromatic Tube Trunk research.
promethium-science-pack=Authorize the Administratorium expedition after completing Aquilo's chromatic tube tier. Unlocks the shattered-planet route and the final science pack; the expedition consumes administrative science and its packs require a signed [item=promethium-research-charter] Administratorium Expedition Charter.
bureaucratic-transcendence=Master the bureaucratic system by merging Vulcanus industrial operations with Fulgora institutional intelligence. Unlock the Public Transportation Contract and deploy vanilla train stops free of transit authorization requirements—the ultimate reward for bureaucratic mastery.
local-precedents=Standardize the legal boilerplate behind rail and compliance paperwork. Unlocks useless documentation and Form 27B-6.
nest-pacification=Formalize the bribery of hostile wildlife into a reusable administrative procedure. Unlocks hush money for temporarily silencing biter nest spawning for 3 minutes.
streamlined-work-orders=Finalize draft permits directly as combined work orders in one electric-printer pass. Unlocks direct draft-to-work-order printing for safety and construction paperwork, producing 2 work orders per craft.
office-agriculture=Industrialize the office coffee supply beyond scavenging. Unlocks coffee plantations.
charcoal-production=Formalize regulated renewable coal production from greenhouse wood. Unlocks charcoal production.
industrial-propaganda=Weaponize misinformation at industrial scale. Unlocks the Propaganda Distillery, politician fluid refining, misinformation, refined nonsense, and official credentials.
corporate-hospitality=Turn coffee and office rumor into usable morale. Unlocks coffee discovery, the Corporate Breakroom, coffee refining, watercooler gossip, and office-drama recycling.
information-management=Process gossip and credentials into actionable paper trails. Unlocks data synthesis and good excuses.
verbal-approvals=Formalize the manager's spoken promise into reusable paperwork. Unlocks blank directives, directive copying, and verbal management approvals.
environmental-compliance=Permit the oil economy through properly documented environmental theater. Unlocks environmental impact reports, chemical-handling work orders, and verified carbon certificates.
smog-abatement=The air quality was fine until someone started measuring it. Unlocks smog filing, casework, and final resolution.
hazmat-response=What you don't know can't hurt you — unless it's radioactive sludge. Unlocks hazmat filing, casework, and final resolution.
nest-expropriation=Claim territory through paperwork-backed force. Unlocks eviction notices for clearing biter nests.
synthetic-stationery=Formalize oil-derived stationery production. Unlocks synthetic paper made from plastic, sulfur, and water for high-throughput paperwork supply.
public-finance=Bring the treasury and unions into the bureaucracy. Unlocks treasury bonds, the Union Headquarters, union approvals, and government grants.
health-and-safety=Turn union leverage into regulatory theater. Unlocks OSHA scrubbing, justifications, and narrative production.
board-meetings=Expand the Union Headquarters into an executive committee floor. Unlocks written management proposals and approvals without adding another dedicated building.
executive-review=Escalate bureaucracy into signed directives. Unlocks written management work orders for the heaviest regulated projects.
radiological-compliance=Escalate process paperwork into nuclear territory. Unlocks radiological work orders for centrifuges and uranium processing.
eminent-domain-zoning=Draft the policy scaffolding for large-scale expansion. Unlocks white papers, policy directives, and slush funds.
eminent-domain-zoning-space-age=Draft the policy scaffolding for large-scale expansion. Unlocks white papers and policy directives. Space tourism, rather than slush-fund laundering, provides renewable public funding in Space Age.
work-order-duplication=Standardize industrial copying of completed authorizations. Unlocks bulk duplication for every work-order family at the Industrial Printer, from basic assembler forms through radiological operating paperwork.
federal-regulation=Turn policy into enforceable federal text. Unlocks regulation drafting.
noise-ordinances=Silence is golden. Documenting noise violations is extremely expensive. Unlocks noise filing, casework, and final resolution.
loitering-ordinances=Standing around doing nothing is now a prosecutable offense. The biters are not amused. Unlocks loitering filing, casework, and final resolution.
creative-accounting=Standardize the reclassification of slush funds into official revenue. Unlocks Tax Audit.
constitutional-law=The final biter complaint tier. Unlocks unemployment filing, casework, and final resolution at the production-science stage.
vagrancy-ordinances=The final spitter complaint tier. Unlocks vagrancy filing, casework, and final resolution at the utility-science stage.
filing-cabinet-logistics-1=Your pockets now have designated filing sections. More request slots and more trash capacity for the discerning administrator.
filing-cabinet-logistics-2=Middle management gets bigger filing cabinets. Further increases personal logistics capacity.
filing-cabinet-logistics-3=Everything is filed, cross-referenced, and color-coded. You have become the bureaucracy. Maximum personal logistics capacity.
after-hours-operations=Standardize legal night shifts for the administrative apparatus. Unlocks the [item=overtime-exemption] Overtime Exemption module so key office buildings can stay open overnight.
pneumatic-form-transport=Route paperwork through sealed pneumatic tubes. Unlocks tube intakes, tube outtakes, and pneumatic pipes. Intakes accept only valid paperwork items, and pneumatic pipes do not connect to regular fluid infrastructure.
pneumatic-capacity=Raise the number of paperwork items each pneumatic tube network can hold in transit.
pneumatic-capacity-1=Reinforce tube junctions to handle more concurrent forms. Increases tube network capacity by 15.
pneumatic-capacity-2=Install pressure regulators for higher-throughput pneumatic delivery. Increases tube network capacity by 25.
pneumatic-capacity-3=Full-bore industrial pneumatic infrastructure. Increases tube network capacity by 50.
pneumatic-capacity-4=Executive-grade document pressure containment. Increases tube network capacity by 100.
biter-employment=Establish a formal employment program for resolved biters. Unlocks job offers, the full Administrative Office Desk, and the Resolution Office. Requires only red tape and administrative science.
biter-employment-office=Open the formal Biter Employment Office to dispatch workers to industrial buildings. Unlocks the Biter Employment Office building.
rideable-biter=Authorize personal transport through supervised biter assignments. Unlocks the Rideable Biter.
automobilism=Restore conventional state-approved motoring. Unlocks the vanilla car at the utility-science stage.
biter-labor-efficiency=Increase the number of managed machines a dispatched biter worker can authorize per trip.
biter-labor-efficiency-1=Improved routing protocols allow each dispatched biter worker to visit up to 3 managed machines per trip instead of 1. Each visited machine is enabled for one craft cycle before requiring another visit.
biter-labor-efficiency-2=Advanced efficiency protocols further increase dispatch capacity to 5 managed machine visits per worker trip.
biterport-logistics=Unlock biterport infrastructure, train biter logistics workers, and unlock cheap one-slot paperwork chests for biter-operated networks.
biterport-transport-capacity=Increase how many items each logistics biter can carry per biterport trip.
biterport-transport-capacity-1=Formalize the first logistics manifests. Each logistics biter can carry 2 items per trip.
biterport-transport-capacity-2=Upgrade biter saddlebags and paperwork clips. Each logistics biter can carry 5 items per trip.
biterport-transport-capacity-3=Standardize bulk handling for mid-scale logistics. Each logistics biter can carry 10 items per trip.
biterport-transport-capacity-4=Issue reinforced transport harnesses for larger hauls. Each logistics biter can carry 25 items per trip.
biterport-worker-speed=Increase the walking speed of logistics workers dispatched from biterports.
biterport-worker-speed-1=Better shoes. Logistics workers move 35% faster between jobs.
biterport-worker-speed-2=Even better shoes. Logistics workers move 70% faster. They're practically jogging.
formation-center=Construct the dedicated Formation Center training facility. Required before any biter profession can be trained. Unlocks the Formation Center building.
union-delegate-training=Certify biter workers as union delegates. Unlocks union delegate training at the Formation Center.
chemical-operator-training=Certify biter workers to construct chemical plants and handle hazardous materials. Unlocks chemical operator training at the Formation Center.
nuclear-technician-training=Certify biter workers as licensed nuclear technicians for reactor operations. Unlocks nuclear technician training at the Formation Center.
hired-biter-fieldwork=Authorize a pilot program for autonomous eviction field agents. Train a single behemoth biter with full legal authority to independently locate and serve eviction notices to enemy nests. Extremely expensive. Extremely effective.

