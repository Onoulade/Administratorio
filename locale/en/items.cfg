[item-description]
administrative-clock=1x1 circuit clock. Outputs [virtual-signal=signal-daytime] on a 0–100 scale with midnight at 0/100, plus the configured [virtual-signal=signal-day-shift-start] and [virtual-signal=signal-day-shift-end] constants.
slop-refinery=Turns Inference Tokens into Administrative Slop, then into fabricated paperwork and the fabricated citations that inevitably crawl out of it. The [entity=ai-server] produces confidence; this building gives confidence a filing number.
optical-fibre=Carries [fluid=inference-token] and nothing else. It will not connect to ordinary pipes or pneumatic tubes: even imaginary intelligence has boundaries, apparently.
involuntary-relocation-cannon=Fires biter-family staff to another planet, a batch per shot. Not a turret; it needs no aiming.\n\nLoad the cargo into its input slot. Nothing else is needed — it fires whenever a matching [entity=involuntary-relocation-receiver] on another planet asks for it, spending one of that receiver's transfer orders per item that arrives.\n\n[font=default-bold]There is no target setting.[/font] Any receiver on another planet with a matching request is answered. Biter-family staff only, never eggs, planets only. A planet that both sends and receives builds one of each.
involuntary-relocation-receiver=Requests biter-family staff from another planet, a batch per shot.\n\nLoad [item=involuntary-transfer-order] forms into its input slot, and wire it to a circuit network with a signal for each item [color=green]this[/color] planet wants pulled in. It spends one order per item that arrives, and arrivals land in its output slots.\n\n[font=default-bold]There is no target setting.[/font] Any [entity=involuntary-relocation-cannon] on another planet with matching cargo answers. A planet that both sends and receives builds one of each.
involuntary-transfer-order=Authorises relocation of exactly one staff member, with or without their agreement. Load it into an [entity=involuntary-relocation-receiver]; the form is consumed on arrival, because consent was never in the bill of materials.
missionary-manager=A MMMM carrying ten biter eggs' worth of authority to Aquilo. Consumed by the captive biter spawner. It expires after 30 minutes into an ordinary manager: the manager survives, the mission statement does not.
voluntary-research-subject=A MMMM who volunteered in the sense that a calendar invite appeared. Consumed by Administratorium science in orbit; expires after 30 minutes into an ordinary manager.
geotechnical-assessment-manager=A MMMM sent to assess Gleba's soil and returned after the craft. Gleba therefore accumulates managers unless you ship them home, a phenomenon economists call “success.” Expires after 30 minutes.
synthetic-personnel-bureau=Manufactures professions rather than buildings: Notaries, Conciliation Officers, Relay Clerks, and Cryoprint Technicians from eggs, inference, and slop. It replaces the Nauvis commute with an electricity bill that has its own weather system.
unstaffed-operations-waiver=Lets one biter-station managed building run without a dispatched worker. It occupies a module slot, costs enough to inspire accountability, and fits nothing that did not already need supervision.
ai-server=Aquilo's compute core. It converts enormous electricity into Inference Tokens and real heat; if the heat network backs up, it stops rather than pretending it is “degraded.” Tokens leave only through [item=optical-fibre] to a [entity=slop-refinery].
heat-exhaust=Caps a heat network and voids the surplus. For when you want compute but not a power plant, which is a perfectly coherent institutional choice.
administrative-slop=Plausible administrative text with no fixed meaning. Refine it into real paperwork, citations that are not real, or a quarterly strategy document if you are feeling brave.
fabricated-citations=A reference with the posture of scholarship and none of the inconvenience. Vent it, fact-check it into raw material, or let it back up and teach the server consequences.
interplanetary-terminus=Moves paperwork between planets through a slow, narrow, shared trunk pool. One per planet.\n\n[font=default-bold]To send:[/font] inserters load the form you want to export into its input slot. It leaves on its own timer — no request needed — and joins a pool shared by every planet on your force. One form type at a time.\n[font=default-bold]To request ([color=green]green[/color] wire):[/font] connect green and set a signal for each form this planet wants. A matching pooled form is claimed instantly, from wherever it came from — even a form this same planet contributed itself, which is a withdrawal, not a shortcut.\n[font=default-bold]To view current pool contents ([color=red]red[/color] wire):[/font] connect red to read what's currently pooled, empire-wide. The two colours share the Terminus's one connector without interfering with each other.\n[font=default-bold]To receive:[/font] arrivals land in its output slots. Take them out yourself with an inserter — moving them onto a belt, into a chest, or into the local tube network is your explicit step, never the trunk's.
bullshit-ore=A naturally occurring deposit of unrefined nonsense. Mine it, refine it, weaponize it: the geological record has reviewed your proposal and found it actionable.
redundant-rubble=Mineralised waste from excessive procedural oversight. Useless alone, indispensable once legally described as “supporting documentation.”
compacted-rubble=Bureaucratic waste compressed into a respectable industrial material. Nothing says circular economy like filing the rubble until it becomes load-bearing.
useless-documentation=Redundant rubble wrapped in paper and given a document number. Its uselessness is now auditable, which is apparently a form of usefulness.
refined-nonsense=Concentrated administrative absurdity made in the [entity=corporate-breakroom]. On Vulcanus, it can instead be produced in the [entity=propaganda-distillery]. The backbone of high-tier processes and several real-world panel discussions.
paper=Standard bureaucratic substrate, made from wood or plastic. Used for everything from a blank form to a supreme court brief, because escalation is mostly typography.
coffee-bean=A rare commodity recovered from compost. The only renewable resource with a credible claim to keeping governance online.
ink=Writing fluid from coal. Works in handwritten documents or cartridges; black market eyeliner for the administrative state.
blank-form=An empty administrative form awaiting a purpose, a signature, and three departments saying it is not their purpose.
blank-approval=A pre-printed approval template. It becomes a safety waiver, construction permit, or transit authorisation once enough people have touched it.
blank-directive=A high-security directive template requiring triple ink application. One layer for policy, one for liability, one for whoever approved this font.
safety-waiver-draft=An unfinalized safety waiver awaiting printer verification and ink seal.
unapproved-safety-waiver=A printed safety waiver awaiting biter-government approval at a Petition Counter.
construction-permit-draft=An unfinalized construction permit awaiting printer verification and ink seal.
unapproved-construction-permit=A printed construction permit awaiting biter-government approval at a Petition Counter.
management-verbal-draft=A draft verbal approval extracted from a breakroom conversation. Needs printer finalization.
management-written-proposal=A management proposal drafted by the Union Headquarters executive committee. Needs one heavy printer finalization pass.
admin-station=The biter interface desk. Its built-in waiting zone shows exactly where biters queue; place resolved items back here to satisfy them. Storage only — no crafting.
resolution-office=A dedicated office for complaint processing. Handles filing, casework, and final resolutions.
office-desk=A workstation for forms, science, funding, and general administrative alchemy. Keeps daytime hours unless fitted with an [item=overtime-exemption]; the desk has stronger labour law than most managers.
office-desk-no-working-hours=A versatile workstation for forms, science packs, funding paperwork, and general administrative tasks.
union-headquarters=A sprawling negotiation complex. The first one bootstraps from treasury bonds and verbal paperwork, then handles grants, audits, and policy; closes at night unless exempted, because even institutional power needs a nap.
union-headquarters-no-working-hours=A sprawling complex where workforce approval and late-stage policy work are negotiated. The first one bootstraps from treasury bonds and verbal paperwork, then handles grants, written approvals, audits, and policy work.
propaganda-distillery=Refines politician fluid into liquid lies, misinformation, and credentials. It is a chemical plant for turning “we should” into “the public has been informed.”
administrative-science-pack=The pink science pack. Fuels administrative research. Crafted at the Administrative Office Desk.
taxpayer-money=Currency extracted from resolved biter complaints. It funds government operations and burns in ordinary fuel burners, which is not metaphorically reassuring.
treasury-bond=Nauvis-only public finance compressed into a denser, tradeable package. The preferred way to launch a rocket without putting loose taxpayer money in the cargo bay like a raccoon.
government-grant=A major allocation assembled from treasury bonds. It exists so expensive projects can say “publicly funded” with a straight face.
job-offer=Place this in an Admin Station before a biter's complaints are fully resolved. Without Space Age it directly creates workers. With Space Age, the offer is consumed and produces one Enrolled Biter: 75% chance at or below 50% frustration, 50% through 75%, 25% through 90%, then 0%; train that enrollee at a Formation Center.
biter-worker=A domesticated biter employee used to construct administrative buildings. Proof that the labour shortage was a paperwork shortage all along.
biter-logistics-formation=A biter worker trained specifically for biterport construction and requester-chest logistics.
biterport=A ground-worker roboport substitute. Holds eight logistics biters and funding, then sends them walking to jobs; night dispatches require coffee, because apparently even apex predators need a breakroom.
paperwork-provider-chest=A one-slot passive provider chest for biter-operated logistics. Robots can use it too, but no one will be impressed.
paperwork-storage-chest=A one-slot storage chest for biter-operated logistics and disposal runs.
paperwork-requester-chest=A one-slot requester chest for biter-operated logistics.
rideable-biter=A biter reassigned to personal transport. Burns taxpayer money, carries a tiny pouch, and cannot be picked back up; leave it unfunded for 10 minutes and it returns to nature with a complaint.
union-delegate=A biter worker trained as a union representative. Required to construct the Union Headquarters.
chemical-operator=A specialist worker certified for hazardous chemical handling. Required for chemical plants.
nuclear-technician=A specialist worker trained in radiological operations. Required for nuclear reactors and centrifuges.
formation-center=A 5×5 facility for training workers, logistics staff, and specialists. A LinkedIn Learning campus built around a creature that used to eat the interns.
field-office=A bureaucratic outpost that summons nearby nest biters, one worker per craft. It operates only while a biter is present and produces no pollution: the cleanest extraction industry is apparently HR.
biter-station=Stores workers and funding, then dispatches biters to authorise nearby managed buildings for one craft each. At night it also wants coffee, because production has discovered work-life balance by becoming physically impossible.
transit-authorization=Form 12-T. Put it in a train stop's permit chest; one burns per arrival and the train limit equals the form count. The railway now has a bouncer.
greenhouse=A climate-controlled growing facility. Produces wood from water, and with proper inputs, rare coffee beans.
notary-office=A premium certification office for dense non-printing bureaucracy. Handles charters, endorsements, seals, and local fallback paperwork on Vulcanus.
verdigris-crust=A copper-green mineral crust found on Vulcanus. Process it into cyan slurry, chromatic inks, and local certification paperwork.
charged-toner=A Fulgora toner concentrate mined from electrostatic deposits or recovered from salvage. Feeds both archive recovery and the magenta ink chain.
transfer-emulsion=A cryogenically stable toner binder produced on Aquilo. Used to reconstruct documents without liquid ink.
thermal-transfer-sheet=A premium solid print substrate for the Laser Printer. Aquilo's answer to liquid-fed stationery.
composite-chroma-ribbon=A high-grade multicolor carrier assembled from imported CMY paperwork and Aquilo transfer media.
old-archive=A compressed bundle of half-legible records recovered from Fulgora scrap. It recycles quickly into random starter forms and nothing else.
archive-recombination-bureau=A Recycler variant permanently staffed by a Relay Clerk. Insert one supported form; three same-rank, color-safe replacement forms each roll independently at a 25% chance.
heatproof-form-stock=Heat-resistant paperwork stock tailored to Vulcanus industry. The local substitute for black-heavy permit paper.
permit-draft=A Vulcanus permit shell printed in cyan on heatproof stock. Feeds charters, permits, and local fallback approvals.
inspection-docket=A dense industrial review packet printed for foundry-era compliance and certification work.
embossed-seal=A premium notarization seal pressed from Vulcanus materials. Used to certify charters and fallback launch paperwork.
industrial-charter=A certified industrial operations packet for Vulcanus metallurgy and heavy infrastructure.
blank-cyan-form=Vulcanus-origin cyan paperwork for tungsten and heatproof industry. It may be used off-world after the relevant recipe is authorized; it enters the Interplanetary Terminus only after Aquilo's Chromatic Tube Trunk research.
mycelial-form-stock=Fibrous Gleba stationery stock printed from yellow ink. Serves as the local substrate for the planet's compact exception paperwork.
blank-yellow-form=Gleba-origin yellow paperwork for biological industry. It spoils, so ship finished forms rather than raw yellow stock; it enters the Interplanetary Terminus only after Aquilo's Chromatic Tube Trunk research.
signal-form-stock=Magenta paperwork stock prepared on Fulgora for digitally processed archive and signal forms.
blank-magenta-form=Fulgora-origin magenta paperwork for holmium, archive, and electromagnetic industry. It may be used off-world after authorization; it enters the Interplanetary Terminus only after Aquilo's Chromatic Tube Trunk research.
cyan-yellow-form=Vulcanus + Gleba convergence paperwork. Use it wherever a recipe combines cyan metallurgy with yellow biology; move it between planets only after Aquilo's Chromatic Tube Trunk research.
cyan-magenta-form=Vulcanus + Fulgora convergence paperwork. Use it wherever a recipe combines cyan metallurgy with magenta electromagnetic work; move it between planets only after Aquilo's Chromatic Tube Trunk research.
yellow-magenta-form=Gleba + Fulgora convergence paperwork. Use it wherever a recipe combines yellow biology with magenta archive work; move it between planets only after Aquilo's Chromatic Tube Trunk research.
symbiosis-record=A compact biological registry document used where Gleba replaces documentation-heavy filler with direct specimen bookkeeping.
conciliation-order=A Gleba authorization document that replaces selected lie-heavy or taxpayer-heavy approvals with direct conciliatory exception handling.
archive-recovery-permit=A Fulgora recovery permit authorizing salvage-driven reconstruction of ruined paperwork and archive fragments.
digital-processing-certificate=A Fulgora certificate authorizing computerized administrative throughput and digitally processed forms.
electromagnetic-operating-license=A Fulgora operating license for electromagnetic infrastructure and holmium-adjacent bureaucracy.
data-recovery-order=A routing-heavy Fulgora work order used to reconstruct and recover archived administrative data.
hardened-data-vault=A Vulcanus-Fulgora custody packet that heat-seals recovered data for late orbital and shattered-planet authorization.
trichromatic-permit=Made on Aquilo from all three first-wave color jurisdictions. Required by recipes that combine Vulcanus, Gleba, and Fulgora industries; chromatic-trunk payload only.
unified-operations-charter=Made on Aquilo from Vulcanus, Gleba, Fulgora, and Aquilo paperwork. It signals an intentional four-world dependency, not a local crafting omission.
cryogenic-operations-license=Made on Aquilo. Required for cryogenic infrastructure; it is a chromatic trunk payload and therefore cannot use the base Interplanetary Terminus tier.
promethium-asteroid-chunk=A classified Administratorium-bearing asteroid fragment recovered near the shattered planet and routed through the orbital bureaucracy.
promethium-science-pack=The final administrative research pack. Produced in orbit from Administratorium chunks, quantum processors, biter eggs, and an [item=promethium-research-charter] Administratorium Expedition Charter.
promethium-research-charter=A shattered-planet expedition charter authorizing Administratorium recovery through orbital dockets and unified interplanetary sign-off.
public-transportation-contract=A two-color transit contract that merges cyan and yellow paperwork into a public-routing exemption.
public-train-stop=A vanilla train stop that operates without transit authorization requirements. Deploy after achieving bureaucratic transcendence.
thermal-process-license=Made on Vulcanus. Required to run high-temperature tungsten-class metallurgy away from Vulcanus; ship it by rocket until Aquilo unlocks chromatic trunk payloads.
calcite-reagent-waiver=Made on Vulcanus. Required to run calcite-heavy chemistry away from Vulcanus; ship it by rocket until Aquilo unlocks chromatic trunk payloads.
offworld-metallurgy-charter=Made on Vulcanus from its two export licenses. This is the explicit permission for key Vulcanus foundry, tungsten, and calcite processes on another planet or platform.
capture-bureau=A Gleba field bureau that receives hostile wildlife, processes job offers, and feeds the worker-biter loop.
petition-counter=A small biter-facing office counter that stamps permit approvals when a nest is nearby.
conciliation-desk=A Gleba specialist office for yellow-form finalization. Handles compact biological exception paperwork without duplicating the full Nauvis permit ladder.
digital-services-bureau=A fast computerized office built on Fulgora. It handles routine administrative processing around the clock without the ordinary night closure.
laser-printer=A high-speed Aquilo printer that uses solid transfer media instead of liquid ink. Handles thermal sheets, ribbon charges, multicolor forms, and final frozen-world printing.
pneumatic-pipe=Sealed manila-colored pipe for transporting fluidized paperwork. Does NOT connect to regular fluid pipes.
pneumatic-pipe-to-ground=Underground pneumatic pipe for routing paperwork beneath buildings. Does NOT connect to regular fluid pipes.
tube-intake=Receives valid paperwork items for instant pneumatic transport. Insert paperwork directly with inserters or logistics.
tube-outtake=Dispenses paperwork items from the pneumatic signal network. Use your own inserter or logistics to extract items from the output chest.
transit-permit-chest=Chest automatically placed at train stops. Load transit authorizations here — one is consumed per train arrival. The station's train limit equals the number of forms. Accessible by inserters and logistics.
provisional-work-order=A combined assembler authorization backed by a provisional approval. Used only by assembling machines. Consumed on use.
safety-work-order=A combined assembler authorization for safety-tier regulated crafting. After [technology=streamlined-work-orders], it can be finalized directly from a safety-waiver draft in one printer pass. Used only by assembling machines. Consumed on use.
construction-work-order=A combined assembler authorization for construction-tier regulated crafting. After [technology=streamlined-work-orders], it can be finalized directly from a construction-permit draft in one printer pass. Used only by assembling machines. Consumed on use.
management-verbal-work-order=A combined assembler authorization backed by a manager's verbal promise. Used only by assembling machines. Consumed on use.
management-written-work-order=A combined assembler authorization backed by a signed management directive. Used only by assembling machines. Consumed on use.
research-grant-work-order=A combined assembler authorization for scientific research production. Used only by assembling machines. Consumed on use.
chemical-handling-work-order=A specialist operating work order for chemical plants. Built from safety and environmental paperwork plus handling hardware. Consumed by every chemistry recipe.
radiological-work-order=A high-security operating work order for centrifuges and radiological processing. Built from chemical paperwork and written management approval. Consumed by centrifuging recipes.
unapproved-radiological-work-order=A radiological operations packet awaiting biter-government approval at a Petition Counter.
carbon-offset-certificate-basic=A basic certificate that permits limited industrial smelting. Consumed by furnace batch smelting recipes.
carbon-offset-certificate-verified=An upgraded certificate with official verification. Issued through the office-desk compliance chain and consumed by selected high-energy production recipes and environmental-compliance paperwork.
work-order=A basic work authorization for regulated construction and crafting recipes. Used to construct regular inserters and to assemble higher-tier paperwork.
form-27b-6=The infamous standardized requisition form. Used in transit paperwork, compliance reporting, and higher-tier bureaucracy.
safety-waiver=A document absolving the administratorion of all liability. Required for selected T1 entity construction and for assembling heavier operating permits.
environmental-impact-report=A comprehensive (if heavily redacted) assessment of environmental damage. Used to issue chemical-handling and radiological operating paperwork.
management-approval-verbal=A manager's spoken agreement, technically binding but easily denied. Requires coffee to extract.
management-approval-written=A signed, notarized management commitment. Much harder to obtain but impossible to deny.
research-grant-approval=A basic research grant authorization. Required for all science pack production; space science consumes imported approvals aboard the Administrative Space Station.
provisional-approval=An entry-level bureaucratic clearance. Your first taste of redundant rubble.
filing-l=A formally filed landscape complaint. The first step in resolving a citizen's grievance about the local scenery.
filing-s=A formally filed smog complaint. Documents a citizen's objection to industrial air pollution.
filing-n=A formally filed noise complaint. Records a citizen's grievance about noise disturbances from your infrastructure.
filing-u=A formally filed unemployment complaint. The most severe citizen grievance, alleging systemic economic failure.
filing-lt=A formally filed littering complaint. Documents a spitter's objection to acid puddles left everywhere.
filing-h=A formally filed hazmat complaint. Records a spitter's grievance about hazardous material exposure.
filing-lo=A formally filed loitering complaint. Documents a spitter's objection to restricted area violations.
filing-v=A formally filed vagrancy complaint. The most severe spitter grievance, alleging displacement and homelessness.
case-s=A court-ready smog dossier. The evidence is literally in the air, but you still need it in triplicate.
case-n=A validated noise case backed by sworn decibel affidavits. Somehow the loudest part of the process is the paperwork.
case-u=Proof of systemic economic failure, compiled using enough paperwork to employ a small office. The irony is structural.
case-h=A hazmat case so thoroughly documented that the dossier itself may require protective handling.
case-lo=A legal argument that standing in the wrong place is a prosecutable offense. The precedent is shaky, but the filing is airtight.
case-v=A displacement case built by the same system that caused the displacement. Nobody said bureaucracy had to be self-aware.
brief-n=A relic from a simpler legal era when noise cases went all the way to the supreme court. Retained for save compatibility — your old paperwork is grandfathered in.
brief-u=An artifact from when unemployment required a supreme court ruling instead of just a really thick folder. Retained for save compatibility.
brief-lo=From the brief period when loitering cases demanded supreme court intervention. The system has since been streamlined. Retained for save compatibility.
brief-v=A supreme court brief from back when vagrancy required the highest judicial authority in the land. Retained for save compatibility — the bureaucracy remembers.
construction-permit=A standard construction authorization. Required as an ingredient in most building recipes and in heavier operating permits.
dubious-data=Refined from bullshit ore. Unreliable, but technically qualifies as information. The backbone of the excuse economy.
basic-excuse=A simple justification assembled from dubious data. Used in landscape resolution and low-tier bureaucratic processes.
crappy-report=A hastily compiled report of questionable accuracy. The foundation for all higher-tier documentation.
credentials=Official credentials produced from liquid lies, dubious data, and refined nonsense. Proof of authority, however dubious the source.
data=Synthesized from crappy reports and credentials. Actual usable information. A rare commodity in this administratorion.
good-excuse=A well-crafted justification blending real data with liquid lies. Used in high-tier approvals and narrative construction.
justification=A formal legal justification built from misinformation, credentials, and politician fluid. Used in narrative construction.
narrative=The official story, woven from justifications, good excuses, and refined nonsense. Controls public perception of your administratorion.
white-paper=An authoritative policy document blending data, lies, and treasury-backed nonsense. The foundation of government policy.
policy=A directive drafted in endless meetings. Requires white papers, misinformation, data, and treasury bonds.
regulation=A federal regulation drafted through exhaustive bureaucratic process. The ultimate expression of governmental authority.
promise=A throwable capsule containing a bureaucratic promise. It pacifies a protest temporarily, proving that ambiguity is a resource when properly packaged.
eviction-notice=A throwable capsule that destroys biter structures. Use with caution, legal review, and the emotional distance of a landlord sending an email at 4:57 PM.
hush-money=A bag of taxpayer money thrown at a biter nest to prevent spawning for three minutes. It creates green smog, because the only thing less suspicious than bribery is visible bribery.
hired-biter-capsule=A fully credentialed behemoth biter field officer. Place it, select it with a Deployment Order, and let logistics refill its concealed eviction notice ledger.
hired-biter-command-capsule=A field remote for Field Agents. Click agents to select or unselect them, right-click charted map positions to send them, and Shift-right-click to append waypoints. Right-click a notice chest to send agents there for resupply.
resolved-landscape=A fully resolved landscape complaint. Proof that the system works (occasionally).
resolved-smog=A fully resolved smog complaint. Required significant misinformation and coffee to achieve.
resolved-noise=A fully resolved noise complaint. Took a validated case, policy stack, coffee, narratives, and credentials.
resolved-unemployment=A resolved unemployment complaint. The system has officially solved unemployment, which is distinct from anyone having a job.
resolved-littering=A fully resolved littering complaint. The acid puddles have been officially reclassified as decorative features.
resolved-hazmat=A fully resolved hazmat complaint. Required compacted rubble evidence, misinformation, and coffee.
resolved-loitering=A fully resolved loitering complaint. Took a validated case, regulations, coffee, narratives, and credentials.
resolved-vagrancy=A resolved vagrancy complaint. The displacement is now documented, classified, and therefore no longer politically visible.
ticket-landscape=A citizen complaint about landscape destruction. Generated by small biters at admin stations.
ticket-smog=A citizen complaint about air pollution. Generated by medium or larger biters.
ticket-noise=A citizen complaint about noise pollution. Generated by big or larger biters.
ticket-unemployment=A citizen complaint about unemployment. Generated only by behemoth biters.
ticket-littering=A spitter complaint about acid puddle littering. Generated by small spitters at admin stations.
ticket-hazmat=A spitter complaint about hazardous material exposure. Generated by medium or larger spitters.
ticket-loitering=A spitter complaint about restricted area violations. Generated by big or larger spitters.
ticket-vagrancy=A spitter complaint about displacement and homelessness. Generated only by behemoth spitters.
printer-t1=A basic electric printer. Slow but reliable. Produces printed documents from ink cartridges.
printer-t2=A high-speed industrial printer with copy mode. On planets it requires Employment Office dispatch; on space platforms permanent onboard authorization keeps it operational.
chromatic-printer=Space Age-ready printer platform. Starts as a compatibility bridge and expands into chromatic paperwork later.
mechanical-printer=A hand-cranked printer. Your workhorse until you unlock electric printing.
speed-module=A legal threat that panics machines into faster output. The energy bill is someone else's problem, as all great policy innovations insist. (+20% speed, +50% energy)
speed-module-2=A class-action subpoena for machinery. Machines work frantically to comply; the energy bill has entered its executive era. (+30% speed, +70% energy)
speed-module-3=A federal subpoena backed by the full weight of the judiciary. Machines have never worked this fast or this expensively. (+50% speed, +100% energy)
productivity-module=An internal audit that squeezes extra output from every cycle. The auditors slow everything down while they work. (+4% productivity, -speed, +energy, +pollution)
productivity-module-2=A forensic audit with expanded scope. More findings, more overhead, more paperwork. (+6% productivity, -speed, +energy, +pollution)
productivity-module-3=A full federal investigation. Output is maximized but morale, speed, and the power bill are all casualties. (+10% productivity, -speed, +energy, +pollution)
efficiency-module=Creative bookkeeping that siphons energy costs off the books. Nobody asks where the savings went. (-30% energy)
efficiency-module-2=Advanced embezzlement techniques. The accountants have gotten bolder. (-40% energy)
efficiency-module-3=A full Ponzi scheme of energy accounting. Machines run at half the power cost and the auditors haven't noticed yet. (-50% energy)
corporate-breakroom=A social hub where coffee fuels the rumor mill. Produces watercooler gossip, good excuses, and verbal management drafts. Each craft requires a [entity=biter-station] within 30 tiles with a [item=worker-biter] and [item=taxpayer-money] available for dispatch, plus liquid coffee and dubious data for the recipe.
osha-violation=A workplace safety violation generated by hazardous industrial processing. Can be scrubbed or recycled through the Union Headquarters.
watercooler-gossip=Informal intelligence gathered around the water cooler. Required for corporate decision-making.
office-drama=Interpersonal conflict generated as a byproduct of office gossip. Can be recycled at the breakroom into random work orders, gossip, and basic excuses.
enrolled-biter=A biter who has signed just enough forms to enter the bureaucracy. Not yet useful without workforce formation.
worker-biter=A bureaucratically formed biter workforce unit. Trained on Nauvis from an enrolled biter and one provisional approval for Space Age infrastructure staffing.
clerical-trainee=A worker biter pushed through the clerical branch. Ready for paperwork-heavy specialist roles.
management-trainee=A worker biter pushed into supervisory theater. Feeds negotiators, absurd management, and other higher-tier staffing roles.
astronaut=A trained orbital administrator packaged for vacuum-safe paperwork work, station compliance, and other offworld absurdities.
night-shift-supervisor=A trained workforce specialist for after-hours administrative compliance.
licensed-notary=A charter-certified specialist for Vulcanus foundries, permits, and formal industrial certification.
conciliation-officer=A bio-credentialed mediation specialist for biochambers, pacification, and workforce reassignment.
relay-clerk=An electromagnetic routing specialist for infrastructure, signal bureaucracy, and digital services.
cryoprint-technician=A cryogenic technical specialist for cold administration and precision print processes.
field-negotiator=A mobile escalation specialist for protest suppression, expropriation, and hostile administrative outreach.
middle-management-managing-manager=An absurd upper-tier manager who contributes nothing until a sufficiently recent meeting makes their attendance mandatory. Briefed managers eventually forget the briefing and revert to this regular form.
training-briefed-middle-management-managing-manager=Recently attended a workforce training meeting. Required once by relevant formation recipes, which return a regular MMMM afterward. The briefing expires after three minutes.
staffing-briefed-middle-management-managing-manager=Recently attended a facilities staffing meeting. Required during employee-dependent construction, despite providing no practical assistance. The briefing expires after three minutes.
compliance-briefed-middle-management-managing-manager=Recently attended a regulatory compliance meeting. Required by selected certifications and high-end formations. The briefing expires after three minutes.
liaison-briefed-middle-management-managing-manager=Recently attended an interdepartmental liaison meeting. Required wherever two departments might otherwise communicate directly. The briefing expires after three minutes.
orbital-briefed-middle-management-managing-manager=Recently attended an orbital operations meeting featuring one shared unit of rocket fuel. Required by space administration and advanced orbital formation. The briefing expires after three minutes.
voluntary-exploration-space-miner=A highly trained astronaut equipped for catapult-assisted asteroid mining. Miners attach to asteroids, perform research-scalable work, and return as collectible employee chunks when recovered.
returning-orbital-employee=A voluntary space miner embedded in asteroid debris. An asteroid collector mines this directly into reusable VESM ammunition in its output inventory; miss it and the employee is permanently lost in space.
orbital-deviation-order=A cheap, asteroid-derived authorization for one sustained outward push. Several overlapping routine orders may be required for heavier asteroids.
priority-orbital-deviation-order=A reinforced authorization printed from advanced asteroid products. Each order provides twice the push of a routine order.
orbital-operations-form=Locally renewable platform paperwork printed from carbon-and-water paper with ferrous carbon ink. Used for fuel, oxidizer, asteroid processing, tourism, and routine orbital administration.
asteroid-processing-docket=Locally printed crusher paperwork for advanced asteroid processing. It contains no terrestrial rubble, nonsense, or disposable personnel.
orbital-infrastructure-permit=A vacuum-specific construction authorization for administrative space-platform infrastructure. Ordinary terrestrial permits have no jurisdiction up there, which is frankly their first sensible boundary.
trajectory-compliance-array=A junior paperwork engine authorised to push small and medium asteroids away from the platform. The rocks remain visible and yield no salvage; heavier targets respond more slowly.
senior-trajectory-compliance-array=A wider senior deviation engine with enough cross-planet jurisdiction to push big asteroids. Overlapping arrays and faster paperwork create a stronger sustained deflection.
executive-trajectory-compliance-array=An unappealable executive deviation engine cleared to push every asteroid size, including huge Administratorium-bearing ones that generally demand several overlapping pushes.
orbital-employment-catapult=A railgun-shaped personnel deployment system. Launched Voluntary Exploration Space Miners attach to asteroids and work once per second until the rocks surrender their full collectible yield. Staffing begins at one miner per asteroid and research raises the cap to five. Every assigned miner then drifts back as a chunk that must actually be collected.

