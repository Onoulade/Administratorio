[tips-and-tricks-item-description]
administratorio-relocation-cannon=[font=default-bold]No target setting. The receiving end asks.[/font]\n\nTwo separate buildings: the [entity=involuntary-relocation-cannon] sends, the [entity=involuntary-relocation-receiver] asks.\n\n[font=default-bold]Sending:[/font] load biter-family staff into the cannon's input slot. That is all. It will answer any receiver on another planet whose request matches what it holds — until that slot is fully fired out, it will not accept a different cargo type.\n\n[font=default-bold]Receiving:[/font] load [item=involuntary-transfer-order] forms into the receiver's input slot, and wire it to a circuit network with a signal naming each item this planet wants. One order is spent per item that lands, and arrivals appear in the output slots for you to take out.\n\n[font=default-bold]A planet doing both directions builds one of each.[/font] Unlike the [entity=interplanetary-terminus], neither is limited to one per planet.\n\n[font=default-bold]It carries staff, never eggs[/font], and only between planets. Rockets keep everything else.
administratorio-egg-couriers=[font=default-bold]Biter eggs never leave Nauvis.[/font]\n\nSpoiled eggs hatch hostile biters, one per 25. Off Nauvis there is no [entity=admin-station], no complaint pipeline, and no way to handle what comes out. So every vanilla recipe that consumed eggs offworld now takes a courier trained on Nauvis instead. Vanilla egg costs are unchanged — only what crosses space is different.\n\n• [item=missionary-manager] — to Aquilo, consumed by [entity=captive-biter-spawner]\n• [item=voluntary-research-subject] — to orbit, consumed by Administratorium science\n• [item=geotechnical-assessment-manager] — to Gleba, [color=green]handed back[/color] after the soil craft\n\n[font=default-bold]All three expire after 30 minutes[/font] into an ordinary [item=middle-management-managing-manager]. An expired courier costs you the eggs and the trip, never the manager.\n\n[font=default-bold]The input-slot trap:[/font] Administratorium science is batched — it needs 250 [item=promethium-asteroid-chunk] and 10 [item=quantum-processor] staged before it will run. A [color=red]Cobaye inserted before the chunks arrive burns its 30-minute clock sitting in the input slot and expires there.[/color] Stage the chunks and processors first, deliver the courier last. This failure is silent and expensive.
administratorio-chromatic-trunk=[font=default-bold]Colored paperwork does not cross the base trunk.[/font]\n\nUntil [technology=interplanetary-tube-chromatic] is researched on Aquilo, the [entity=interplanetary-terminus] carries regular black-ink paperwork only — forms, tickets, filings, cases, briefs, paper, ink, and taxpayer money. Cyan, yellow, magenta, and composite documents are simply not valid payloads, and inserters will refuse to load them.\n\n[font=default-bold]After the chromatic tier:[/font] the blank colored forms, the three bicolor forms, [item=cryogenic-operations-license], [item=hardened-data-vault], [item=trichromatic-permit], [item=unified-operations-charter], and [item=promethium-research-charter] all become trunk-legal.\n\n[font=default-bold]Strategic note:[/font] once pooled, a document is available to any planet's request, including the one that just contributed it. There is no way to reserve a pooled document for a specific destination.
administratorio-interplanetary-terminus=[font=default-bold]The Interplanetary Terminus is the trunk endpoint. One per planet, more with research.[/font]\n\nUnlocked by [technology=interplanetary-tube-network]. Its input slot holds one form type at a time for export, and only valid payloads are accepted. It leaves on its own timer and joins a pool shared by every planet on your force — no request is needed to load it.\n\n[font=default-bold]Green wire:[/font] set a signal for each form this planet wants; a matching pooled form is claimed instantly, from wherever it came from — even a form this same planet contributed itself.\n[font=default-bold]Red wire:[/font] read the pool's current contents, empire-wide. The two colours share the Terminus's one connector without interfering.\n\n[font=default-bold]More than one per planet:[/font] [technology=interplanetary-tube-additional-terminus-3] and its two prerequisites each allow one more Terminus on the same planet. The last of the three is unbounded — expensive, but never capped.\n\n[font=default-bold]Arrivals do not auto-feed.[/font] Landed paperwork sits in the Terminus output inventory until you move it. That is deliberate: it gives you a visible buffer, a circuit-readable contents list, and a real separation between the local tube pool and the interplanetary one.
administratorio-interplanetary-trunk=[font=default-bold]The trunk is narrow and slow on purpose.[/font]\n\nThe local pneumatic network is instant, per-surface, and scales to 200 forms. The interplanetary trunk is a [color=red]separate[/color] pool: it starts at 3 items in flight, 30 seconds each, and never merges with the local one. If it did, you would have free planet-to-planet teleportation and rockets would stop mattering.\n\n[font=default-bold]Transit is per item, not per batch.[/font] Every item carries its own timer, so many can be crossing at once — capacity is how many, transit is how long each takes.\n\n[font=default-bold]Payload:[/font] regular black-ink paperwork only. Colored forms wait for [technology=interplanetary-tube-chromatic] on Aquilo.
administratorio-trunk-capacity=[font=default-bold]Trunk capacity research widens and accelerates the trunk together.[/font]\n\nEach tier raises how many items may be in flight and cuts how long each one takes:\n• base — 3 items, 30 s each\n• [technology=interplanetary-tube-capacity-2] — 5 items, 15 s\n• [technology=interplanetary-tube-capacity-3] — 10 items, 5 s\n• [technology=interplanetary-tube-capacity-4] — 15 items, 2 s\n• [technology=interplanetary-tube-capacity-5] — 20 items, 1 s\n\nThe top tier is Administratorium work. Even fully researched, 20 forms in flight is a trickle next to a rocket — that is the point.
administratorio-aquilo-tube-network=[font=default-bold]Aquilo replaces frozen liquid ink with solid media and opens the chromatic trunk.[/font]\n\nThe [entity=laser-printer] consumes [item=thermal-transfer-sheet] and [item=composite-chroma-ribbon]. The [technology=interplanetary-tube-chromatic] tier extends the interplanetary trunk to colored paperwork, which the base tier will not carry.\n\nThe same branch authorizes three-color paperwork, cryogenic licenses, the Administratorium expedition, and eventually form-free public train stops. Bring a [item=cryoprint-technician] for every printer you intend to construct.
administratorio-workforce-formation-title=[font=default-bold]Space infrastructure has its own staff, permits, operating forms, and asteroid policy.[/font]\n\nThis category follows the complete orbital administrative loop: fund expansion with portable instruments instead of local taxpayer payouts, issue [item=orbital-infrastructure-permit] before construction, train specialists, brief managers just in time, print renewable [item=orbital-operations-form] aboard the platform, and choose whether each asteroid should be pushed away or staffed by a Voluntary Exploration Space Miner.\n\nStart with the funding and permit entries. The workforce and asteroid systems unlock later as their technologies become available.
administratorio-chromatic-printing=[font=default-bold]Color means jurisdiction, origin, and a real supply dependency.[/font]\n\n[fluid=cyan-ink] Cyan comes from Vulcanus, [fluid=yellow-ink] yellow from Gleba, and [fluid=magenta-ink] magenta from Fulgora. A colored-form ingredient means: establish that planet's chain, make the finished form there or with imported ink where authorized, then deliver the form to the consuming world.\n\nA two-color form is one explicit requirement for two planets. The trichromatic permits made on Aquilo declare all three. Before Aquilo's [technology=interplanetary-tube-chromatic] research, move these forms by rocket: the base trunk is black-paperwork only.
administratorio-chromatic-printer=[font=default-bold]The Chromatic Printer is the terrestrial Space Age printing platform.[/font]\n\nIt accepts black, cyan, yellow, and magenta printing recipes as their technologies unlock. Use it for heatproof cyan stock, perishable yellow stock, signal-stable magenta stock, and two-color paperwork. It works on atmospheric planets but not in vacuum or Aquilo's cryogenic pressure regime; use a [entity=laser-printer] there.\n\nThe machine does not make every color from the initial [technology=chromatic-printing] research. Each planet's processing branch unlocks its own ink and final forms, so leave room for four input channels even if the early printer uses only black and cyan.
administratorio-chromatic-inks=[font=default-bold]Each colored ink has a local feedstock and a distinct jurisdiction.[/font]\n\n• [fluid=cyan-ink] — refined from Vulcanus [fluid=cyan-slurry], used for metallurgy and heatproof paperwork\n• [fluid=yellow-ink] — refined from Gleba [fluid=amber-sap] and nutrients, used for biological paperwork\n• [fluid=magenta-ink] — refined from Fulgora salvage, used for archive and electromagnetic paperwork\n• Black [item=ink] — remains the ordinary copy medium\n\nImporting an ink can support remote printing, but it does not bypass the technology that authorizes the corresponding forms. Aquilo cannot use these liquids directly and compresses imported CMY forms into [item=composite-chroma-ribbon] instead.
administratorio-multicolor-forms=[font=default-bold]Composite forms replace stacked planetary paperwork on cross-industry recipes.[/font]\n\nThe three two-color branches issue [item=cyan-yellow-form], [item=cyan-magenta-form], and [item=yellow-magenta-form]. When an ordinary recipe consumes intermediates associated with two planets, Administratorio adds the matching composite form instead of demanding both single-color forms. Three-planet and selected endgame recipes escalate to [item=trichromatic-permit], [item=unified-operations-charter], or another explicit capstone document.\n\nThis gating applies to vanilla Space Age production too. Inspect the affected recipe rather than assuming its vanilla ingredient list survived the interdepartmental review.
administratorio-vulcanus-certification=[font=default-bold]Vulcanus replaces combat with mineral propaganda and territorial arbitration.[/font]\n\nMine [item=verdigris-crust] to start the cyan chain, turn lava into [fluid=molten-promises] and abundant [fluid=lie], certify local industry at a [entity=notary-office], and remove demolisher territory through [entity=territorial-arbitration-post] processing. The resulting [item=territorial-deed] is the planet's local escape milestone.\n\nVulcanus buildings consume their specialist when constructed but no recurring worker or operating form. Bring enough [item=licensed-notary] staff for the offices and foundries you plan to place.
administratorio-gleba-conciliation=[font=default-bold]Gleba grows its administration, and naturally it also spoils.[/font]\n\nStart with [technology=gleba-yellow-administration] for the yellow ink and form branch. Then research [technology=gleba-conciliation] for the [entity=conciliation-desk], [entity=capture-bureau], and biological exception paperwork.\n\nYellow stock and finished conciliation paperwork are perishable. The local chain is intentionally abundant but time-sensitive, like skincare in a bathroom with no lid discipline.
administratorio-cross-planet-bureaucracy=[font=default-bold]Treat every colored form as a supply contract with its source planet.[/font]\n\nCyan originates on Vulcanus, yellow on Gleba, and magenta on Fulgora. A recipe showing one color needs that jurisdiction's finished form; a two-color recipe needs both planetary branches collapsed into the named composite form. That is an intentional cross-planet requirement, not an optional productivity ingredient.\n\n[font=default-bold]Transport rule:[/font] before [technology=interplanetary-tube-chromatic] on Aquilo, colored and composite forms travel by rocket only. The base [entity=interplanetary-terminus] carries black paperwork only. After that research, request colored forms through a Terminus; never expect liquids or arbitrary factory materials to use the trunk.
administratorio-space-age-enrollment=[font=default-bold]Space Age turns direct hiring into a probabilistic enrollment pipeline.[/font]\n\nPlace a [item=job-offer] in a Nauvis [entity=admin-station] slot before a biter's final resolution arrives. The offer is consumed when enrollment is attempted. Only biters are eligible; spitters never enroll. Success depends on frustration at resolution time:\n• At or below 50% frustration — 75% chance\n• Above 50% through 75% — 50% chance\n• Above 75% through 90% — 25% chance\n• Above 90% — 0% chance\n\nA success yields exactly one [item=enrolled-biter], regardless of biter size. Process it through [recipe=worker-biter-formation] at the [entity=formation-center] to obtain one reusable [item=worker-biter]. Without Space Age, the legacy rule instead converts a resolved citizen directly into workers by size.
administratorio-offworld-economy=[font=default-bold]Taxpayer Money is a Nauvis revenue stream, not a universal planetary resource.[/font]\n\nWith Space Age active, resolved citizens pay [item=taxpayer-money] only on Nauvis. Off-world complaint resolution still clears cases but produces no local cash payout. Form biter professions on Nauvis, then re-brief reusable MMMMs locally without spending taxpayer money.\n\n[item=treasury-bond] Treasury Bonds are the portable routine currency. Orbital tourism prepares fulfilled tourists, but their large [item=taxpayer-money] payments are collected only during checkout on Nauvis. Convert that revenue into bonds locally; [item=government-grant] Government Grants remain the capital-project tier used by major construction such as rocket silos.
administratorio-management-briefings=[font=default-bold]Middle-Management Managing Managers must attend the correct meeting before obstructing specialist work.[/font]\n\nEach meeting consumes one regular manager, one small topic material, and 5 [fluid=liquid-coffee], then returns one matching briefed manager. It never consumes [item=taxpayer-money] and can run at a [entity=formation-center] on any planet. The five topics are Training, Staffing, Compliance, Liaison, and Orbital Operations.\n\nBriefed managers expire back into regular managers after [font=default-bold]3 minutes[/font]. Formations and staffed construction return the manager unbriefed, so carry a small reusable manager pool and brief it locally just in time.
administratorio-yellow-paperwork-spoilage=[font=default-bold]Gleba's yellow paperwork has a filing deadline.[/font]\n\n[item=mycelial-form-stock] and [item=blank-yellow-form] spoil into [item=paper] after 5 minutes. Finished [item=symbiosis-record] and [item=conciliation-order] last 10 minutes before returning to paper. Cyan, magenta, and composite forms are stable unless their own tooltip says otherwise.\n\nKeep yellow production close to its consumers, use short buffers, and watch freshness when shipping it. If a durable recipe can consume a finished composite form instead, print that before the yellow component ages out.
administratorio-pentapod-bargaining=[font=default-bold]Pentapod eggs have a manual bootstrap and an automated harvest route.[/font]\n\n[font=default-bold]Bootstrap:[/font] drop [item=taxpayer-money] on the ground within 24 tiles of a wild pentapod. It walks to the money, consumes the nearby pile, and leaves eggs on the ground. Each base egg costs a random 10–20 money; larger pentapods multiply the yield.\n\n[font=default-bold]Automation:[/font] on Gleba, set a [entity=capture-bureau] to its egg-harvest recipe and supply [fluid=oviposition-lure-spores]. The bureau consumes 1 unit of lure per second, attracts compatible pentapods within 48 tiles, and outputs eggs according to species and size.\n\nPentapod eggs retain vanilla spoilage. If they hatch, the premature pentapods are hostile to the player, so process or refrigerate them with some urgency.
administratorio-space-tourism=[font=default-bold]Spitter tourism converts Nauvis wildlife and orbital snacks into a large Nauvis revenue stream.[/font]\n\n1. Place a [entity=capture-bureau] on Nauvis, select tourism intake, and supply [fluid=tourism-lure-spores]. Each captured spitter consumes the mode's [item=cyan-yellow-form] authorization and becomes a size-matched tourism package.\n2. Launch the package within 5 minutes. If it spoils, it hatches back into an angry spitter.\n3. Fulfill it at an [entity=administrative-space-station] with one [item=orbital-operations-form] and asteroid chunks: small needs 1 metallic; medium needs 1 metallic + 1 carbonic; big needs 1 oxide + 1 metallic + 1 carbonic; behemoth needs 2 of each.\n4. Return the fulfilled tourist to a Nauvis [entity=office-desk] and run its checkout recipe with 10 [fluid=liquid-coffee]. Small, medium, big, and behemoth tourists pay 100, 200, 450, and 1,200 [item=taxpayer-money]. The tourist is released peacefully and walks away to despawn.
administratorio-promethium-administration=[font=default-bold]The Administratorium expedition is the final interplanetary paperwork check.[/font]\n\nThe vanilla [technology=promethium-science-pack] path additionally requires [technology=interplanetary-tube-chromatic] and Administrative Science. In orbit, combine a [item=unified-operations-charter], [item=cryogenic-operations-license], [item=hardened-data-vault], and [item=asteroid-processing-docket] into one [item=promethium-research-charter].\n\nEvery [item=promethium-science-pack] recipe consumes that expedition charter in addition to its Space Age ingredients. The trunk can position the prerequisite forms, but the charter itself is assembled in vacuum. Complete the colored planet branches before planning the shattered-planet run.
administratorio-vulcanus-manifest=[font=default-bold]Vulcanus runs on propaganda.[/font]\n\nThe local chain turns lava and cyan minerals into [fluid=molten-promises] Molten Promises and then abundant [fluid=lie] Lies. Territorial Arbitration consumes [item=territorial-resettlement-order] orders plus 50/100/200 lie per second for small/medium/big demolishers. Larger territories cost more because apparently geology has legal standing.\n\n[font=default-bold]Bring deliberately:[/font] enough Nauvis-trained [item=licensed-notary] Licensed Notaries for each specialist building, a small pool of regular MMMMs that can be re-briefed locally, and a [item=chemical-operator] Chemical Operator if wanted.\n[font=default-bold]Produce locally:[/font] cyan paperwork, ordinary forms, cheap MMMM briefings, propaganda fluid, and rocket materials.\n[font=default-bold]Escape milestone:[/font] clear a demolisher territory, receive a [item=territorial-deed], complete the ordinary written-management paperwork, and build the shared rocket-silo recipe.
administratorio-gleba-manifest=[font=default-bold]Gleba has too much bullshit, by design.[/font]\n\nPump amber sap and seed it into large quantities of [item=bullshit-ore]. Local cultivation recipes turn that surplus into dubious data, excuses, refined nonsense, provisional approvals, and disposable documentation. Yellow paperwork still spoils, so supply is abundant while logistics remain biologically annoying.\n\n[font=default-bold]Bring deliberately:[/font] Nauvis-trained [item=conciliation-officer] Conciliation Officers for the biochamber branch, a small reusable MMMM pool, and a [item=chemical-operator] Chemical Operator if wanted.\n[font=default-bold]Produce locally:[/font] ordinary administrative material, cheap MMMM briefings, and rocket supplies.\n[font=default-bold]Escape milestone:[/font] complete the ordinary written-management paperwork and build the same rocket-silo recipe used everywhere else.
administratorio-fulgora-archives=[font=default-bold]Fulgora recycles the filing cabinet, then the files, then the explanation.[/font]\n\nScrap can yield [item=old-archive]. Archives recycle quickly into random starter forms only. Every paperwork form can also be recycled in an ordinary [entity=recycler] Recycler into one [item=paper] with a 25% chance. Redundant rubble and toner provide deterministic ordinary production through local salvage recipes.\n\nThe [entity=archive-recombination-bureau] is a separate one-input Recycler variant. Insert one supported form and it automatically selects that form's reassignment recipe. Three same-rank, color-safe replacement forms each roll independently at 25%, so an operation may return zero, one, two, or three forms through the normal result inventory. Candidates never include the input itself, never jump progression rank, and never invent a color. The [item=relay-clerk] consumed when constructing the machine is its permanent employee.\n\n[font=default-bold]Bring deliberately:[/font] Nauvis-trained Relay Clerks for every staffed digital, electromagnetic, or archive building, a small reusable MMMM pool, and a [item=chemical-operator] Chemical Operator if wanted. Re-brief the managers locally from scrap-friendly materials and a little coffee.
administratorio-aquilo-manifest=[font=default-bold]Aquilo is the first world whose core paperwork deliberately depends on the earlier worlds.[/font]\n\nBring colored forms from Vulcanus, Gleba, and Fulgora, plus Nauvis-trained [item=cryoprint-technician] specialists. Its Laser Printer consumes local solid transfer media and imported chromatic paperwork; it cannot consume liquid ink.\n\n[font=default-bold]Transport checkpoint:[/font] the base [entity=interplanetary-terminus] cannot carry those colored forms. Use rockets until [technology=interplanetary-tube-chromatic] is researched here, then use the chromatic trunk for eligible finished documents. Rockets still carry all non-paperwork supplies.
administratorio-welcome=[font=default-bold]Welcome to Administratorio.[/font]\n\nThis mod replaces military conflict with bureaucracy. Biters and spitters do not form attack groups — they queue. They walk to your [entity=admin-station] desks, file complaints, and wait for you to resolve them. You survive by keeping the paperwork moving.\n\n[font=default-bold]The core loop:[/font]\n1. A biter takes a desk slot and drops complaint tickets\n2. You process the tickets through the [entity=resolution-office] into resolutions\n3. You insert the resolutions back into the slot the biter is sitting in\n4. Once it has every resolution it needs, the biter drops [item=taxpayer-money] and walks home to despawn\n\nIf the queue overflows or a biter waits too long, it protests and shuts down a nearby building. The rest of these tips explain the tools you use to keep that from happening.
administratorio-work-orders=[font=default-bold]Machines run on paperwork as a recipe ingredient.[/font]\n\nAdministrative documents are real inputs to recipes, just like iron or copper. If the right paperwork is missing, the machine idles even when every other ingredient is on the belt.\n\n[font=default-bold]Assembling machines run on Work Orders:[/font]\nEvery assembler recipe consumes a [item=work-order] or one of its transformed variants. Heavier recipes require higher-tier variants — examples include [item=safety-work-order], [item=construction-work-order], [item=management-verbal-work-order], and [item=management-written-work-order]. New recipes unlock alongside the variant they need, so paperwork tiers progress in lockstep with the tech tree.\n\n[font=default-bold]Other machine classes have their own paperwork:[/font]\n• Furnaces consume [item=carbon-offset-certificate-basic]\n• Chemical plants consume [item=chemical-handling-work-order]\n• Centrifuges consume [item=radiological-work-order]\n\nThese are independent supply chains — work orders do not substitute for them, and these documents are not interchangeable across machine classes.\n\n[font=default-bold]Exception — oil refineries:[/font]\nRefineries consume [color=red]no[/color] operating paperwork. They are already gated by biter-station dispatch (a biter has to walk up to authorize each cycle), so the bureaucracy considers that sufficient supervision.\n\nPlan paperwork lines the same way you plan iron and copper.
administratorio-biter-complaints=[font=default-bold]The admin desk replaces enemy attack waves with a queue.[/font]\n\nInstead of forming raids, biters and spitters walk to your [entity=admin-station] desks looking for an open slot. Each desk starts with 4 active service slots; the [technology=admin-station-capacity-1] research line (8 tiers) expands that to 12.\n\n[font=default-bold]How a citizen flows through:[/font]\n1. The biter takes a slot and drops one or more complaint tickets in the desk\n2. You pull the tickets out and process them at the [entity=resolution-office] into matching resolutions\n3. You insert each resolution back into the slot the biter is sitting in\n4. Once it has every resolution it was waiting for, the biter drops [item=taxpayer-money] and walks home to despawn\n\n[font=default-bold]Tiers and biter size:[/font]\nWhich complaints a biter files depends on its type. Biters file landscape, smog, noise, or unemployment complaints; spitters file littering, hazmat, loitering, or vagrancy complaints. As evolution rises, harder tiers appear and your resolution pipeline has to keep up. Bigger enemies file [font=default-bold]multiple complaints at once[/font] — a single behemoth can demand a whole stack of resolutions before it leaves.\n\n[font=default-bold]Evolution still works:[/font]\nNests absorb pollution and slowly raise evolution as in vanilla. Each step shifts what your desks demand, so the resolution chain has to grow with the factory.\n\n[item=taxpayer-money] funds capsules, dispatch buildings, and most expansion — the faster you clear complaints, the more money flows. Each desk also emits circuit signals for ticket counts, free slots, and total waiting biters; wire them up to scale capacity before the queue overflows.
administratorio-frustration=[font=default-bold]Frustration starts the moment a biter leaves its nest.[/font]\n\nThe timer keeps climbing until the biter has received [color=green]every[/color] resolution for [color=green]every[/color] complaint it filed. Hover any biter to see its current mood.\n\n[font=default-bold]Two ways a protest starts:[/font]\n• Frustration reaches 100% before the case is finished\n• A biter arrives at the queue and no desk has a free slot\n\nWhen either happens, the biter walks to a nearby player building and disables it until you intervene.\n\n[font=default-bold]Bureaucratic Promise:[/font]\nThrow a [item=promise] at a [color=red]protesting biter[/color] (not the building):\n• If a slot is open, the biter heads back to a desk at [font=default-bold]50% frustration[/font] and resumes its case\n• If no slot is open, the biter searches for [font=default-bold]one minute[/font] and then resumes protesting if nothing has freed up\n• The promise [color=red]does not[/color] erase the complaint or reset paperwork progress\n\nPromises buy time. The permanent fix is finishing the case so the biter leaves on its own — stay ahead by adding desks before the queue fills, and by scaling resolution throughput so cases finish faster than frustration accumulates.
administratorio-complaint-chain=[font=default-bold]Complaint tickets are the bureaucracy's evolution curve.[/font]\n\nEnemy evolution still rises from pollution absorbed by nests. Instead of upgrading attacks, higher evolution changes which citizens arrive and which paperwork chains they demand. Your first desks mostly see simple tickets; later, the same queue must feed several specialized resolution chains at once.\n\n[font=default-bold]Biters file factory-impact complaints:[/font]\n• [item=ticket-landscape] Landscape complaints start the chain\n• [item=ticket-smog] Smog complaints appear as pollution pressure grows\n• [item=ticket-noise] Noise complaints follow heavier industry\n• [item=ticket-unemployment] Unemployment complaints are the late biter case\n\n[font=default-bold]Spitters file conduct and safety complaints:[/font]\n• [item=ticket-littering] Littering complaints are the early spitter case\n• [item=ticket-hazmat] Hazmat complaints arrive with more dangerous processing\n• [item=ticket-loitering] Loitering complaints add another mid-chain branch\n• [item=ticket-vagrancy] Vagrancy complaints are the late spitter case\n\n[font=default-bold]Size changes the batch size:[/font]\nSmall enemies usually need one resolution. Medium, big, and behemoth enemies can file multiple complaints at once, and they will not leave until [color=green]every[/color] requested resolution has been inserted into their desk slot. A single late-game citizen can therefore tie up one service slot while asking for several different finished resolutions.\n\nEach ticket family has its own recipe path through [entity=resolution-office] processing and later paperwork. Build buffers for every unlocked ticket type, watch desk circuit signals for the current mix, and expand before evolution unlocks the next case family.
administratorio-nest-expropriation=[font=default-bold]Eviction destroys a nest permanently — and shapes your evolution curve.[/font]\n\nThrow [item=eviction-notice] at enemy territory and the nearest spawner is destroyed for good. This is the only way to reclaim land in the mod.\n\n[font=default-bold]Evolution lever:[/font]\nDestroyed nests stop absorbing pollution, so eviction is also how you slow evolution. The catch: nests are also the source of biters, and biters are the source of [item=taxpayer-money]. Wiping out every nest will starve the factory of funding. Balance is the whole game — keep enough nests alive to fund operations, evict enough of them to keep evolution from outpacing your resolution pipeline.\n\n[font=default-bold]Displacement:[/font]\nBiters near the destroyed spawner are not killed. They are dumped straight into your complaint system at elevated frustration. Only evict when your desks and resolution chain can absorb the wave.\n\nFor a non-permanent slowdown that does not displace biters, use [item=hush-money] instead.
administratorio-hush-money=[font=default-bold]Hush Money temporarily stops a nest from spawning.[/font]\n\nThrow [item=hush-money] at an enemy nest. Spawners inside the effect radius go silent for a few minutes, then resume exactly where they were. While suppressed, no new biters leave that nest to file complaints.\n\nUse it when the queue is overloaded and you need to slow the inflow long enough to clear the backlog of pending complaints. It costs [item=taxpayer-money] per throw, so treat it as an emergency valve rather than a long-term plan.\n\nUnlike [item=eviction-notice], hush money does not destroy the nest and does not displace any biters into your queue — its only effect is pausing new arrivals.
administratorio-propaganda-distillery=[font=default-bold]The Propaganda Distillery processes the lie and misinformation fluid chain.[/font]\n\nUnlocked with [font=default-bold]Industrial Propaganda[/font], this building replaces chemical processing for those bureaucratic fluids. Its crafting category is exclusive — only distillery recipes run here.\n\n[font=default-bold]Key recipes:[/font]\n• [fluid=politician-fluid] Politician Fluid → [fluid=lie] Lies\n• [fluid=lie] Lies + [item=dubious-data] Dubious Data → [fluid=misinformation] Misinformation\n• [fluid=misinformation] Misinformation + [item=credentials] Credentials + [fluid=politician-fluid] Politician Fluid → [item=justification] Justification\n• [item=treasury-bond] Treasury Bond + [fluid=lie] Lies → [fluid=slush-fund] Slush Fund (base game only; this recipe does not exist with Space Age active)\n\n[font=default-bold]Not distillery recipes, despite touching the same fluids:[/font]\n[item=credentials] Credentials is printed at the [entity=office-desk], and [item=refined-nonsense] Refined Nonsense is brewed at the [entity=corporate-breakroom]. Chemical plants and oil refineries handle [color=red]none[/color] of this chain.
administratorio-working-hours=[font=default-bold]Buildings that depend on biters close at night.[/font]\n\nThe rule is thematic: if a building either has biters [font=default-bold]coming in to work[/font] (the [entity=office-desk], [entity=corporate-breakroom], [entity=union-headquarters], [entity=biter-station], [entity=biterport]) or has biters [font=default-bold]as a recipe ingredient[/font], its workforce goes home at sundown. Without intervention, the building idles until dawn.\n\nYou keep it open at night by giving it the right consumable:\n• [font=default-bold]Office-style buildings[/font] — install one [item=overtime-exemption] in the building's module slot. One copy is enough; extras do nothing.\n• [font=default-bold]Dispatch buildings[/font] — pipe [fluid=liquid-coffee] into any of its four side entrances. Each night dispatch consumes one unit.\n\nThere is no partial night penalty: a covered building runs at exactly the same speed day or night. Skip the consumable and the building goes fully idle at night instead of slowing down — it is an on/off switch, not a throughput dial. Protests still disable buildings even with overtime clearance — clearance buys you the night, not the queue.\n\nIf you dislike the mechanic entirely, disable Working Hours in startup settings before loading the mod.
administratorio-biter-employment=[font=default-bold]Job Offers redirect resolved citizens into the workforce.[/font]\n\nPlace a [item=job-offer] in an [entity=admin-station] slot before that citizen receives its final resolution. The offer is consumed when hiring is attempted, and a successful hire replaces the normal [item=taxpayer-money] payout.\n\n[font=default-bold]Without Space Age:[/font] every resolved biter or spitter accepts. Size determines the [item=biter-worker] yield: Small 1, Medium 2, Big 3, Behemoth 5.\n\n[font=default-bold]With Space Age:[/font] direct hiring is replaced by enrollment. A Nauvis biter has a 75% chance at or below 50% frustration, 50% above 50% through 75%, 25% above 75% through 90%, and 0% above 90%, producing one [item=enrolled-biter]. Complete [recipe=worker-biter-formation] at a [entity=formation-center] to make the reusable [item=worker-biter].\n\nWorkers staff [entity=biter-station] dispatch, biter logistics, and specialist training. Keep job offers in the exact service slots you intend to recruit from.
administratorio-biter-workers=[font=default-bold]Biter Workers are stored items that authorize managed machines.[/font]\n\nA [item=biter-worker] sits in a [entity=biter-station] until the station dispatches it. The worker walks to a managed building, lets it run one craft cycle, and walks back. The whole assembler-style production tree runs on this loop.\n\n[font=default-bold]Training at the [entity=formation-center]:[/font]\nThe Formation Center works like an assembling machine. Click it to open its recipe menu and select a specialization. Feed [item=biter-worker] items and the required paperwork into its input slots via belts or inserters — the specialist item will appear in the output slot. Collect the specialist and keep it in your inventory. When you [color=red]place[/color] the matching building, the specialist is consumed at placement time, not during operation.\n\nSpecialist types and what they unlock:\n• [item=union-delegate] — to construct the [entity=union-headquarters]\n• [item=chemical-operator] — to construct [entity=chemical-plant]\n• [item=nuclear-technician] — to construct [entity=centrifuge] and nuclear reactors\n• [item=biter-logistics-formation] — the unit that staffs [entity=biterport]\n• [item=rideable-biter] — converts a worker into a personal mount\n\nOil refineries are the exception: they use regulated assembler paperwork for construction and biter-station dispatch for operation, with no Formation Center step. Plan specialist supply for build orders, not throughput.
administratorio-rideable-biter=[font=default-bold]A personal vehicle that runs on Taxpayer Money.[/font]\n\nDeploy a [item=rideable-biter] to ride a worker as a mount. It burns [item=taxpayer-money] from its fuel slot to stay assigned and has only a tiny cargo pouch.\n\n[font=default-bold]Operating rules:[/font]\n• Once placed it [color=red]cannot be mined or deconstructed[/color] — it leaves on its own\n• When unattended, it may wander a short distance\n• If its fuel slot stays empty for [font=default-bold]10 minutes[/font], the contract lapses\n\n[font=default-bold]What happens when funding lapses:[/font]\nThe biter reverts to a wild [entity=medium-biter] and enters the complaint system. If a desk has free capacity it queues normally. If everything is full, it protests like any other unserved citizen — including, potentially, the building you parked it next to.\n\nKeep a few coins in the saddle.
administratorio-biter-station=[font=default-bold]Required infrastructure: some planetary buildings cannot run without one.[/font]\n\nThese managed buildings only craft when a biter walks up to authorize the cycle:\n• [entity=oil-refinery]\n• [entity=centrifuge]\n• [entity=printer-t2] on planetary surfaces\n• [entity=corporate-breakroom]\n• [entity=propaganda-distillery]\n\nWithout a [entity=biter-station] in range, those buildings sit idle no matter how much paperwork you've stockpiled. A [entity=printer-t2] aboard a space platform instead uses permanent onboard authorization. The [entity=union-headquarters] is not in this list — it already consumes a biter as a recipe ingredient.\n\n[font=default-bold]How dispatch works:[/font]\n• Load the station with [item=biter-worker] and [item=taxpayer-money]\n• The station dispatches to all managed buildings within a [font=default-bold]30-tile radius[/font]\n• It sends a worker to each managed building in its zone in rotation\n• Each visit authorizes one craft cycle; the worker then returns\n• A single building can be served by [color=green]multiple stations[/color] at once — overlapping zones mean more frequent visits and more throughput\n\nHover any managed building to see which station(s) are dispatching to it. Hover the station itself for live zone coverage and dispatch status.\n\n[font=default-bold]Labor Efficiency:[/font]\nBy default a worker authorizes 1 machine per trip; research raises this to 3, then 5 per trip. The dispatched worker entity visually upgrades with each tier — a small biter at tier 1, a larger formation at tier 2, and a heavier unit at tier 3. Each trip costs exactly 1 [item=taxpayer-money], regardless of how many buildings the worker authorizes.\n\n[font=default-bold]At night:[/font]\nEach dispatch additionally consumes [fluid=liquid-coffee] from any of its four side pipe entrances. No coffee, no night dispatches.\n\n[font=default-bold]Economy note:[/font]\nFewer trips means fewer paychecks. Labor Efficiency reduces [item=taxpayer-money] cost per unit of output, not just dispatch frequency.
administratorio-biterport=[font=default-bold]The Biterport is a walking-biter version of a roboport.[/font]\n\nLoad it with [item=biter-logistics-formation] (built at the [entity=formation-center]) and [item=taxpayer-money]. Workers walk out to ferry items between logistic chests and to build entity ghosts inside the coverage area.\n\n[font=default-bold]Coverage:[/font]\n• Logistics radius: [font=default-bold]25 tiles[/font]\n• Construction radius: [font=default-bold]55 tiles[/font]\n• Network range: ports within [font=default-bold]50 tiles[/font] of each other share their worker pool — they do not need to overlap to network\n\n[font=default-bold]Transport capacity upgrades[/font] (items carried per worker per trip):\n• Base: [font=default-bold]1[/font]\n• Tier 1: [font=default-bold]2[/font]\n• Tier 2: [font=default-bold]5[/font]\n• Tier 3: [font=default-bold]10[/font]\n• Tier 4: [font=default-bold]25[/font] (requires chemical science)\n\nEach tier also upgrades the worker entity, moving progressively faster. Prioritize transport capacity early — 8 workers at base carry only 8 items between them, which bottlenecks construction badly before the first upgrade.\n\n[font=default-bold]At night:[/font]\nEach dispatch consumes [fluid=liquid-coffee] from any of its four side pipe entrances.\n\nHover any biterport for live network status, active workers, and connection count.
administratorio-field-office=[font=default-bold]Free biter labor without hiring anyone.[/font]\n\nBuild a [entity=field-office] near an enemy nest (within roughly [font=default-bold]200 tiles[/font]). It calls a biter from the nearest nest to perform crafts on-site. After [font=default-bold]2 crafts[/font] the biter walks home and another one is summoned to replace it.\n\n[font=default-bold]Operating rules:[/font]\n• Only crafts while a biter is physically present\n• 0.5× speed and 0 pollution while working\n• Idle when no enemy nest is in range\n• Operates through the night and has no module slots\n\n[font=default-bold]Why it exists:[/font]\nThe Field Office is the bridge between "no biter workforce" and "fully staffed [entity=biter-station]". It lets you produce a few critical items before the complaint resolution chain has hired you any permanent workers — at the cost of being tethered to a nearby nest.
administratorio-hired-biter=[font=default-bold]A controllable biter you command directly.[/font]\n\nThrow a [item=hired-biter-capsule] to deploy a biter you can give orders to. It carries up to [font=default-bold]20[/font] [item=eviction-notice] in its 4-slot inventory and patrols on its own, looking for spawners to evict.\n\n[font=default-bold]Commanding it[/font] (hold the [item=hired-biter-command-capsule]):\n• [font=default-bold]Left-click[/font] on ground — toggle selection of agents at cursor\n• [font=default-bold]Right-click[/font] on ground — set waypoint for selected agents\n• [font=default-bold]Shift+Right-click[/font] on ground — append a waypoint (multi-stop route)\n• [font=default-bold]Shift+Right-click[/font] on a chest — append a supply stop: agent walks to the chest and loads [item=eviction-notice] from it on the way through\n• [font=default-bold]Shift+Left-click[/font] on a chest — immediately load [item=eviction-notice] into the selected agents from that chest right now\n\n[font=default-bold]Behavior when stocked:[/font]\nA loaded agent scans within [font=default-bold]60 tiles[/font] for enemy spawners. When it finds one, it walks over and consumes one [item=eviction-notice] to destroy it. A single agent on patrol can keep an area pacified as long as you keep restocking it.\n\n[font=default-bold]Automatic resupply:[/font]\nAgents inside a vanilla roboport logistics network coverage area will automatically pull [item=eviction-notice] from that network when running low. Set up a passive provider chest with a stack of notices near the agent's patrol area and it will self-maintain without manual restocking or explicit supply waypoints.\n\nAgent-delivered evictions still displace nearby biters into your complaint system, just like thrown notices. Plan desk capacity accordingly.
administratorio-pneumatic-transport=[font=default-bold]Move paperwork instantly through sealed manila tubes.[/font]\n\nThe pneumatic tube system transports paperwork items via a hidden signal chain — items enter at one end and appear instantly at the other:\n\n[font=default-bold]Buildings:[/font]\n• [entity=tube-intake] [font=default-bold]Tube Intake[/font] — consumes valid paperwork items from adjacent belt/chest via hidden inserter\n• [entity=tube-outtake] [font=default-bold]Tube Outtake[/font] — dispenses items from the signal pool; use your own inserter or logistics to extract\n• [entity=pneumatic-pipe] [font=default-bold]Pneumatic Pipe[/font] — manila-colored, connects intakes to outtakes\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Pneumatic Underground Pipe[/font] — 16 tile range\n\n[font=default-bold]How it works:[/font]\nIntake stations have a hidden inserter that pulls only valid paperwork items from adjacent belts or chests. Outtake stations are containers — use your own inserter or logistics to extract items. Set a filter on the outtake inventory slot to request a specific item type.\n\nPneumatic pipes define the signal network — any intakes and outtakes connected by pipes share items instantly. Multiple item types can flow through the same pipe network (sushi transport). Each network has a capacity limit that can be increased through research.\n\nPneumatic pipes use a separate connection category — they [color=red]cannot[/color] connect to regular fluid pipes.\n\nHover over any tube intake or outtake to see a live status panel showing network connection, capacity usage, and item contents.\n\nUnlocked with [font=default-bold]Pneumatic Form Transport[/font] research after [font=default-bold]Printing Technology[/font] and [font=default-bold]Logistic Science[/font].
administratorio-bullshit-economy=[font=default-bold]Bullshit Ore powers the entire certificate and excuse supply chain.[/font]\n\nMine [item=bullshit-ore] Bullshit Ore to produce:\n• [item=dubious-data] Dubious Data (refined from ore)\n• [item=basic-excuse] Basic Excuse → [item=good-excuse] Good Excuse\n• [item=crappy-report] Crappy Report → [item=justification] Justification → [item=narrative] Narrative\n• [item=white-paper] White Paper → [item=policy] Policy → [item=regulation] Regulation\n\n[font=default-bold]Redundant Rubble derivatives:[/font]\n[item=redundant-rubble] Redundant Rubble is processed into three derivative tiers:\n• [item=useless-documentation] [font=default-bold]Useless Documentation[/font] — rubble + paper, used in Form 27B-6 and treasury bonds\n• [item=compacted-rubble] [font=default-bold]Compacted Rubble[/font] — rubble + carbon cert, used in buildings and late recipes\n• [item=refined-nonsense] [font=default-bold]Refined Nonsense[/font] — compacted rubble + misinformation, used in credentials, narratives, and high-tier resolutions\n\n[font=default-bold]Government funding chain:[/font]\n[item=taxpayer-money] Taxpayer Money (Nauvis only) → [item=treasury-bond] Treasury Bond (50 money) → [item=government-grant] Government Grant (10 bonds)\n\nTreasury bonds are the routine, tradeable bureaucratic currency; government grants are reserved for major capital projects such as rocket silos. [fluid=slush-fund] Slush Funds and late-game [font=default-bold]Tax Audits[/font] in the [entity=union-headquarters] Union Headquarters can produce additional Nauvis funding.\n\n[font=default-bold]Multi-building production chain:[/font]\n• [entity=office-desk] Office Desk: forms, science packs, data, treasury bonds, verified certificates, environmental reports, and refinery permits\n• [entity=corporate-breakroom] Breakroom: coffee, gossip, good excuses, verbal approval drafts\n• [entity=union-headquarters] Union HQ: union approvals, government grants, narratives, written approvals, white papers, policy, regulation, and tax audits\n• [entity=propaganda-distillery] Distillery: lies, misinformation, credentials, slush funds, refined nonsense
administratorio-transit-authorization=[font=default-bold]Train stops have an integrated paperwork chest.[/font]\n\nEvery [entity=train-stop] Train Stop now requires [item=transit-authorization] Transit Authorization (Form 12-T) forms to remain operational.\n\n[font=default-bold]How it works:[/font]\n1. Each Train Stop gets an [entity=transit-permit-chest] integrated transit permit chest.\n2. Insert [item=transit-authorization] Transit Authorizations into that chest.\n3. One form is [font=default-bold]consumed when a train arrives[/font] and begins waiting at the station.\n4. If a station runs out of forms, it closes automatically by setting its train limit to 0.\n\n[font=default-bold]Setup:[/font]\n• Research [font=default-bold]Railway[/font] technology to unlock the form recipe.\n• Craft forms at the [entity=office-desk] Administrative Office Desk.\n• Keep stations stocked with belts, inserters, or logistics so busy hubs do not stall.\n\nThis system makes rail logistics another paperwork problem instead of a combat one.
administratorio-admin-science=[font=default-bold]Administrative Science fuels your bureaucratic expansion.[/font]\n\nAdministrative research requires the [item=administrative-science-pack] Administrative Science Pack (Pink). This pack is the bottleneck for most custom bureaucracy tech.\n\n[font=default-bold]Production:[/font]\nProduced at the [entity=office-desk] Administrative Office Desk from:\n• [item=provisional-approval] Provisional Approval ×5\n• [item=basic-excuse] Basic Excuse ×5\n• [item=research-grant-approval] Research Grant Approval ×1\n\n[font=default-bold]Usage:[/font]\nThis pack replaces military science in vanilla research costs and is also used throughout the custom tech tree. If your paperwork chain stalls, your research stalls with it.
administratorio-workforce-formation=[font=default-bold]Space Age workforce progression turns an enrolled citizen into a profession.[/font]\n\n[technology=worker-formation] unlocks [recipe=worker-biter-formation]. Later [technology=management-formation] adds Clerical Trainees, Management Trainees, Middle-Management Managing Managers, and their briefings; [technology=specialized-formation] adds Astronauts. Each planet's pre-science bootstrap unlocks its required specialist before the building that consumes it, while [technology=orbital-compliance-systems] authorizes Voluntary Exploration Space Miners.\n\nAll profession formation remains on Nauvis. Export finished specialists and regular MMMMs; the managers can attend cheap, cashless briefings on any planet. Specialists are usually consumed when their matching building is constructed. VESMs are the exception: they are reusable cannon ammunition if their returning employee chunks are collected.
administratorio-orbital-specialists=[font=default-bold]Specialists are construction consumables, not runtime fuel.[/font]\n\nUnlike biter workers that cycle through [entity=biter-station] dispatches, Astronauts, Licensed Notaries, Conciliation Officers, Relay Clerks, Cryoprint Technicians, and Field Negotiators are formed on Nauvis, stored in your inventory, and consumed when you [color=red]place[/color] the matching building.\n\n[font=default-bold]Planning rule:[/font] Build one specialist for [font=default-bold]each[/font] matching building in your construction queue. For example, every [entity=digital-services-bureau], [entity=interplanetary-terminus], and [entity=archive-recombination-bureau] needs its own [item=relay-clerk]; every [entity=administrative-space-station] needs its own [item=astronaut]. Stockpile them before departure.\n\n[font=default-bold]Middle-Management Managing Managers (MMMM):[/font] Carry a reusable pool of regular managers. Briefed variants are produced locally from one manager, one topic material, and 5 coffee, expire after 3 minutes, and return from staffed construction unbriefed. No taxpayer money is involved.
administratorio-trajectory-compliance-arrays=[font=default-bold]Trajectory Compliance Arrays push asteroids — they do not mine them.[/font]\n\nThe [entity=trajectory-compliance-array] (Junior), [entity=senior-trajectory-compliance-array] (Senior), and [entity=executive-trajectory-compliance-array] (Executive) accept [item=orbital-deviation-order] routine orders and [item=priority-orbital-deviation-order] priority orders. Priority paperwork applies twice the sustained push.\n\n[font=default-bold]Tier jurisdictions:[/font]\n• Junior: small & medium asteroids, 20 tile range\n• Senior: small, medium & big asteroids, 30 tile range\n• Executive: all sizes including huge Administratorium, 40 tile range\n\n[font=default-bold]Mechanics:[/font]\n• Each shot creates a fixed-duration push. Overlapping shots and multiple arrays stack.\n• Asteroid mass dilutes the push — heavy rocks need more simultaneous orders.\n• Arrays retarget every 30 ticks toward the eligible asteroid closest to the platform centerline, then the hub.\n• No chunks are produced by deviation alone — the rock must be mined by VESMs or destroyed by other means to yield salvage.\n• If a miner attaches to an asteroid, all arrays automatically retarget away from it (staffed rocks are protected).\n\n[font=default-bold]Research:[/font] Advanced Asteroid Processing unlocks priority orders made from copper, sulfur, and calcite. [technology=trajectory-compliance-speed-1] through [technology=trajectory-compliance-speed-9] increase firing speed.
administratorio-senior-trajectory-compliance-array=[font=default-bold]Senior Arrays extend jurisdiction to big asteroids.[/font]\n\nUnlocked by [technology=trajectory-compliance-jurisdiction-2] (requires Orbital Compliance Systems + Metallurgic + Agricultural + Electromagnetic science). The Senior Array pushes small, medium, AND big asteroids within 30 tiles. Big asteroids have 2.5× the mass factor of medium, so overlapping Senior Arrays or firing-speed research is often needed for effective deflection.\n\n[font=default-bold]Strategic note:[/font] Big asteroids carry 18 chunks each. Deflecting them protects your platform but yields no resources — consider letting VESMs mine them first, then clean up the remainder with arrays.
administratorio-executive-trajectory-compliance-array=[font=default-bold]Executive Arrays have unappealable jurisdiction over every asteroid size.[/font]\n\nUnlocked by [technology=trajectory-compliance-jurisdiction-3] (requires Senior Arrays + Quantum Processor). The Executive Array pushes small, medium, big, AND huge Administratorium-bearing asteroids within 40 tiles. Huge asteroids have 5× the mass factor and 54 chunk yield — they typically require several simultaneous Executive Arrays or maxed firing speed to deflect meaningfully.\n\n[font=default-bold]Administratorium strategy:[/font] Huge Administratorium asteroids are the primary source of Administratorium chunks. You generally want to MINE them with VESMs, not deflect them. Use Executive Arrays to protect the platform while your miners work, or to clear non-Administratorium huge rocks that threaten the hub.
administratorio-orbital-employment-catapult=[font=default-bold]The Orbital Employment Catapult launches Voluntary Exploration Space Miners (VESMs) at asteroids.[/font]\n\nUnlocked by [technology=orbital-compliance-systems]. The catapult reaches 56 tiles but fires only through a narrow 18° corridor centered on its placed direction. On impact, the VESM attaches and begins mining after a short startup delay.\n\n[font=default-bold]Mining mechanics:[/font]\n• Base damage: 137.5/second per attached miner (scales with [technology=orbital-employment-damage-1..5])\n• Each asteroid accepts 1 miner base capacity, up to 5 with [technology=orbital-employment-capacity-1..4]\n• Damage stacks linearly per attached miner\n• When the asteroid dies, it drops its full vanilla chunk yield PLUS one [item=returning-orbital-employee] chunk per attached miner\n• The employee chunk is mined by asteroid collectors directly into reusable VESM ammunition\n\n[font=default-bold]Critical — collect the employee chunks:[/font] If an asteroid collector misses the employee chunk (it drifts past the collection radius), that miner is LOST PERMANENTLY. Position collectors carefully or use multiple collectors to cover the drift zone.\n\n[font=default-bold]Staffing priority:[/font] The catapult prefers the nearest eligible asteroid inside its firing corridor with available capacity. Launches reserve capacity immediately, and an asteroid with an attached or incoming VESM cannot be deviated. If all eligible asteroids are at capacity, the catapult pauses until a slot frees up.
administratorio-orbital-employment-damage=[font=default-bold]Orbital Employment Damage research scales VESM mining damage.[/font]\n\nFive levels, each +50% damage (additive):\n• Level 1: 206.25/sec • Level 2: 275/sec • Level 3: 343.75/sec • Level 4: 412.5/sec • Level 5: 481.25/sec\n\n[font=default-bold]Prerequisites:[/font] Level 1-2: Orbital Compliance Systems. Level 3-4: +Metallurgic/Agricultural/Electromagnetic. Level 5: +Cryogenic. Level 6 (if extended): +Administratorium.\n\n[font=default-bold]Stacking:[/font] Damage multiplies per attached miner. At capacity 5 with level 5 damage: 5 × 481.25 = 2406.25 damage/sec — enough to crack huge Administratorium asteroids in ~2.1 seconds. Prioritize capacity research first (more miners = linear damage), then damage research.
administratorio-orbital-employment-capacity=[font=default-bold]Orbital Employment Capacity research raises the per-asteroid miner limit.[/font]\n\nFour levels, each +1 miner per asteroid:\n• Level 1: 2 miners • Level 2: 3 miners • Level 3: 4 miners • Level 4: 5 miners\n\n[font=default-bold]Prerequisites:[/font] Level 1: Orbital Compliance Systems. Level 2: +Metallurgic/Agricultural/Electromagnetic. Level 3: +Cryogenic. Level 4: +Administratorium.\n\n[font=default-bold]Economics:[/font] Each additional miner = one more employee chunk to collect = one more reusable VESM. Capacity is the single most impactful orbital research — it linearly scales both mining speed AND ammo recovery. Research capacity to 3-4 before heavy damage investment.
administratorio-administrative-space-station=[font=default-bold]The Administrative Space Station closes the platform paperwork loop.[/font]\n\nUnlocked by [technology=orbital-employment-infrastructure] before utility or space science. It is the full administrative office approved for vacuum; native Space Age asteroid processing remains the only space-science recipe.\n\n[font=default-bold]Basic asteroid loop:[/font]\n• Carbon + water → paper\n• Carbon + iron ore + water → ink\n• Paper + ink → [item=orbital-operations-form]\n• Native space science consumes one imported [item=research-grant-approval] per one-pack craft\n• Operations forms authorize thruster fuel and oxidizer, tourism, routine deviation orders, and [item=asteroid-processing-docket]\n\nBasic asteroid crushing and ice melting remain paperwork-free so a stranded platform cannot deadlock. Advanced crushing consumes dockets and yields copper, sulfur, and calcite for archival paper, secure ink, bulk copying, and [item=priority-orbital-deviation-order].\n\n[font=default-bold]Staffing:[/font] one [item=astronaut] plus the required briefed managers are used during construction. The station returns the managers in regular form; recurring recipes consume no personnel.
administratorio-orbital-infrastructure-permit=[font=default-bold]Orbital Infrastructure Permits authorize administrative space-platform construction.[/font]\n\nUnlocked by [technology=space-platform] (vanilla). Produce them in a registration-capable office from [item=blank-directive], [item=transit-authorization], [item=low-density-structure], and [item=processing-unit].\n\n[font=default-bold]Usage:[/font] Required as an ingredient for placing [entity=administrative-space-station], [entity=trajectory-compliance-array], [entity=orbital-employment-catapult], and other orbital administrative buildings. Ordinary [item=construction-permit] has no jurisdiction in vacuum — this is the space-rated equivalent.\n\n[font=default-bold]Supply chain:[/font] Make permits before or alongside your first platform build. Keep a buffer with your construction materials: every orbital facility consumes one when placed.
administratorio-trajectory-compliance-speed=[font=default-bold]Trajectory Compliance Speed research increases array firing rate.[/font]\n\nNine levels, each reducing cooldown:\n• Level 1: 4.5s → Level 2: 4.0s → Level 3: 3.5s → Level 4: 3.0s → Level 5: 2.5s\n• Level 6: 2.0s → Level 7: 1.5s → Level 8: 1.0s → Level 9: 0.5s\n\n[font=default-bold]Prerequisites:[/font] Level 1: Orbital Compliance Systems. Levels 5-7: +Metallurgic/Agricultural/Electromagnetic. Level 8: +Cryogenic. Level 9: +Administratorium.\n\n[font=default-bold]Impact:[/font] Faster firing = more simultaneous deviation pushes = stronger net deflection on heavy asteroids. Level 9 (0.5s cooldown) with 3 Executive Arrays can push huge Administratorium rocks solo. Expensive science — prioritize capacity and jurisdiction first.
administratorio-cyan-yellow-bureaucracy=[font=default-bold]Cyan-Yellow Bureaucracy merges Vulcanus and Gleba paperwork.[/font]\n\nUnlocked by [technology=cyan-yellow-bureaucracy] (requires Vulcanus Cert + Gleba Conciliation + Metallurgic + Agricultural science). Unlocks:\n• [item=cyan-yellow-form] — dual-ink form printed directly with cyan + yellow\n• [item=public-transportation-contract] — two-color transit contract merging cyan + yellow\n• [item=tourism-lure-spores] — spitter tourism lure for Capture Bureau\n• Orbital tourism fulfillment and Nauvis checkout\n\n[font=default-bold]Tourism:[/font] Package spitters on Nauvis, feed them asteroid chunks in orbit, then check fulfilled tourists out through a Nauvis [entity=office-desk] with coffee. The checkout pays [item=taxpayer-money] and releases each tourist to walk home.
administratorio-cyan-magenta-bureaucracy=[font=default-bold]Cyan-Magenta Bureaucracy merges Vulcanus and Fulgora paperwork.[/font]\n\nUnlocked by [technology=cyan-magenta-bureaucracy] (requires Vulcanus Cert + Fulgora Digital Services + Metallurgic + Electromagnetic science). Unlocks:\n• [item=cyan-magenta-form] — dual-ink form for Vulcanus + Fulgora\n• [item=hardened-data-vault] — heat-sealed custody packet for Vulcanus-Fulgora data transfer\n\n[font=default-bold]Use case:[/font] Orbital and shattered-planet authorization often needs both heavy metallurgy (Vulcanus) and electromagnetic/archive (Fulgora). The dual-color form and hardened vault are the convergent paperwork.
administratorio-yellow-magenta-bureaucracy=[font=default-bold]Yellow-Magenta Bureaucracy merges Gleba and Fulgora paperwork.[/font]\n\nUnlocked by [technology=yellow-magenta-bureaucracy] (requires Gleba Yellow Administration + Fulgora Digital Services + Agricultural + Electromagnetic science). Unlocks:\n• [item=yellow-magenta-form] — dual-ink form for Gleba + Fulgora\n• [item=anecdotal-data-reprocessing] — salvage-heavy shortcut recipe\n\n[font=default-bold]Use case:[/font] Biological archive work and electromagnetic biology crossover. The yellow-magenta form replaces separate yellow + magenta chains for joint Gleba-Fulgora recipes.
administratorio-fulgora-digital-services=[font=default-bold]Fulgora Digital Services unlocks the planet's computerized bureaucracy branch.[/font]\n\nUnlocked by [technology=fulgora-digital-services] (requires Chromatic Printing, triggered by crafting 20 [item=charged-toner]). Unlocks the [entity=digital-services-bureau], [item=archive-recovery-permit], [item=digital-processing-certificate], [item=electromagnetic-operating-license], and [item=data-recovery-order].\n\n[font=default-bold]Research trigger:[/font] Craft 20 [item=charged-toner] (mined from Fulgora scrap deposits or recovered from salvage). This forces you to engage with Fulgora's scrap/recycling loop before unlocking digital services.\n\n[font=default-bold]Key buildings:[/font]\n• [entity=digital-services-bureau] — 24/7 computerized office (no night closure)\n• [entity=archive-recombination-bureau] — one-form → three-form reassignment recycler\n• [entity=interplanetary-terminus] — interplanetary trunk endpoint (shared with Aquilo tech)
administratorio-notary-office=[font=default-bold]The Notary Office is Vulcanus's premium certification office.[/font]\n\nUnlocked by [technology=vulcanus-certification]. Crafting category: [entity=bureaucracy-certification]. 2× speed, 50% base productivity, 4 module slots. Fluid inputs for cyan ink and lie outputs for notarization byproducts.\n\n[font=default-bold]Recipes:[/font]\n• [item=embossed-seal] — premium notarization seal from Vulcanus materials\n• [item=industrial-charter] — certified industrial operations packet for Vulcanus metallurgy\n• [item=good-excuse] — local bridge out of the coffee-and-gossip deadlock\n• [item=management-approval-written] — territorial-deed exception for the escape milestone\n• [item=inspection-docket] — dense industrial review for foundry-era compliance\n\n[font=default-bold]Staffing:[/font] Requires one [item=licensed-notary] (crafted at [entity=formation-center], consumed on placement). The Notary Office is the Vulcanus gateway for local certification work — bring notaries for every specialist building you plan.
administratorio-territorial-arbitration=[font=default-bold]Territorial Arbitration Posts shrink demolisher territories through paperwork.[/font]\n\nUnlocked by [technology=vulcanus-certification]. Fixed recipe: [item=territorial-arbitration-processing]. Consumes [item=territorial-resettlement-order] + [fluid=lie] per processing cycle (60 ticks).\n\n[font=default-bold]Mechanics:[/font]\n1. Place the post overlapping a demolisher territory (must cover at least one territory chunk).\n2. Supply orders and lies. The post gradually removes territory chunks from the demolisher's patrol zone, shrinking its effective area.\n3. Progress is tracked per territory. Multiple posts on the same territory stack progress.\n4. When all chunks are removed, the demolisher is eliminated and drops a [item=territorial-deed].\n5. Territory naturally regrows (decay) if not actively maintained — posts must continuously feed orders/lies.\n\n[font=default-bold]Costs by demolisher size:[/font]\n• Small: 1 order + 50 lie/sec • Medium: 2 orders + 100 lie/sec • Big: 4 orders + 200 lie/sec\n\n[font=default-bold]Lies source:[/font] [entity=propaganda-distillery] on Vulcanus (politician fluid → lies). Bring enough distillery throughput for your target size.\n\n[font=default-bold]Strategic note:[/font] This is the only way to permanently clear Vulcanus demolisher territories. The deed enables the rocket silo escape milestone.
administratorio-vulcanus-export-charters=[font=default-bold]Vulcanus Export Charters let you run Vulcanus metallurgy off-world.[/font]\n\nUnlocked by [technology=vulcanus-export-charters] (requires Vulcanus Certification + Metallurgic Science). Three charters:\n• [item=thermal-process-license] — certifies high-temperature tungsten-class metallurgy off-Vulcanus\n• [item=calcite-reagent-waiver] — authorizes off-world calcite-based industrial chemistry\n• [item=offworld-metallurgy-charter] — required to run key Vulcanus metallurgical processes away from Vulcanus\n\n[font=default-bold]Orbital variants:[/font] [item=thermal-process-license-orbital], [item=calcite-reagent-waiver-orbital], [item=offworld-metallurgy-charter-orbital] produced at [entity=administrative-space-station] for space platform use.\n\n[font=default-bold]Why it matters:[/font] Without these charters, Vulcanus-specific recipes (tungsten, calcite chemistry, foundry processes) cannot run on other planets or platforms. The charters are the bureaucratic export license for Vulcanus industrial IP.
administratorio-conciliation-desk=[font=default-bold]The Conciliation Desk is Gleba's specialist office for yellow-form finalization.[/font]\n\nUnlocked by [technology=gleba-conciliation]. Crafting category: [entity=bureaucracy-conciliation]. 1.75× speed, 50% base productivity, 4 module slots. Fluid inputs for yellow ink and amber sap derivatives.\n\n[font=default-bold]Recipes:[/font]\n• [item=blank-yellow-form] → [item=conciliation-order] — compact biological exception paperwork\n• [item=symbiosis-record] — biological registry replacing documentation-heavy filler\n• Local fallback approvals replacing lie-heavy Nauvis chains\n\n[font=default-bold]Staffing:[/font] Requires one [item=conciliation-officer] (crafted at [entity=formation-center], consumed on placement).\n\n[font=default-bold]Why it exists:[/font] Gleba's biology-heavy progression doesn't need the full Nauvis permit ladder. The Conciliation Desk provides a compact yellow-form branch that bypasses lie/taxpayer-heavy approvals with direct biological conciliation. It's the Gleba-native resolution path.
administratorio-capture-bureau=[font=default-bold]The Capture Bureau has three surface-specific hostile-acquisition modes.[/font]\n\nCraft the building on Gleba, then place it on the surface required by the selected recipe. Supply the matching lure fluid; the active lure consumes 1 unit per second and attracts eligible wildlife within 48 tiles. The output must have room before an animal is accepted.\n\n• [fluid=workforce-lure-spores] on Nauvis — attracts biters and outputs one [item=worker-biter]\n• [fluid=tourism-lure-spores] on Nauvis — attracts spitters and outputs size-matched tourism packages; the mode also consumes [item=cyan-yellow-form]\n• [fluid=oviposition-lure-spores] on Gleba — attracts pentapods and outputs fresh [item=pentapod-egg] by species and size\n\nThe bureau captures directly; animals do not file complaints and workforce mode does not consume a [item=job-offer]. Keep incompatible lure fluids out of the shared fluid system so the intended mode remains active.
administratorio-digital-services-bureau=[font=default-bold]The Digital Services Bureau is Fulgora's 24/7 computerized office.[/font]\n\nUnlocked by [technology=fulgora-digital-services]. Runs only Fulgora-scoped registration and bootstrap recipes:\n• [item=digital-processing-certificate] — authorizes computerized administrative throughput\n• [item=electromagnetic-operating-license] — electromagnetic infrastructure and holmium bureaucracy\n• [item=data-recovery-order] — routing-heavy work order for archive reconstruction\n• [item=archive-recovery-permit] — salvage-driven paperwork recovery\n• Local bootstrap forms for Fulgora progression\n\n[font=default-bold]Mechanics:[/font] 3× base productivity, 6 module slots, NO night closure (digital services run continuously). Fluid input for [fluid=electromagnetic-lubricant] (or equivalent). Staffed by one [item=relay-clerk] (crafted at [entity=formation-center], consumed on placement).\n\n[font=default-bold]Why it matters:[/font] Unlike Nauvis offices, the Digital Services Bureau does not close at night. It is your always-on Fulgora paperwork engine for archive recovery, digital certificates, and electromagnetic licenses.
administratorio-archive-recombination=[font=default-bold]The Archive Recombination Bureau recycles one form into three random same-rank replacements.[/font]\n\nUnlocked by [technology=archive-recombination] (requires Fulgora Digital Services). A Recycler variant permanently staffed by a [item=relay-clerk] (consumed on construction).\n\n[font=default-bold]How it works:[/font]\n1. Insert ONE supported paperwork form (any recyclable form of any rank).\n2. The machine automatically selects that form's reassignment recipe.\n3. THREE candidate replacement forms (same rank, color-safe) each roll independently at 25% chance.\n4. Results output to the 12-slot result inventory. You may get 0, 1, 2, or 3 forms.\n\n[font=default-bold]Constraints:[/font]\n• Candidates NEVER include the input form itself.\n• Candidates NEVER jump progression rank (T1 stays T1, T2 stays T2, etc.).\n• Candidates NEVER invent a color (a black-only form only yields black-only forms; a cyan form yields cyan or black forms).\n• Only works on "recyclable" forms (most printed documents).\n\n[font=default-bold]Use case:[/font] Rebalance surpluses — feed excess T2 permits, get random T2 permits back. Do NOT gamble for critical progression items (the only permit keeping the factory alive) — use deterministic salvage recipes for those.
administratorio-laser-printer=[font=default-bold]The Laser Printer is Aquilo's frozen-ink printer using solid media.[/font]\n\nUnlocked by [technology=interplanetary-tube-chromatic]. No liquid ink — uses:\n• [item=thermal-transfer-sheet] — premium print substrate (replaces paper)\n• [item=composite-chroma-ribbon] — compressed CMY carrier (replaces liquid color inks)\n\n[font=default-bold]Capabilities:[/font]\n• All legacy printing categories\n• Chromatic and multicolor printing, plus advanced orbital printing\n• 5× crafting speed, 50% base productivity, 6 module slots\n• No fluid inputs — purely item-fed\n• Works at Aquilo's low pressure and aboard space platforms\n\n[font=default-bold]Why it exists:[/font] Liquid ink freezes on Aquilo. The Laser Printer uses thermally stable solid media that works in cryogenic conditions. Ribbons are assembled from imported CMY paperwork + Aquilo [item=transfer-emulsion].
administratorio-bureaucratic-transcendence=[font=default-bold]Bureaucratic Transcendence: paperwork is no longer a bottleneck for transit.[/font]\n\nUnlocked by [technology=bureaucratic-transcendence]. The [entity=public-train-stop] is the flagship unlock — a train stop that just works, no forms required.\n\n[font=default-bold]Lore:[/font] Your administration has achieved such throughput and reliability that the central bureau has granted a standing exemption for routine rail operations. The paperwork still exists for everything else — this is transit-specific.\n\n[font=default-bold]Prerequisites:[/font] [technology=interplanetary-tube-chromatic] (the full interplanetary trunk chain). You must have conquered the convergence of all four Space Age planets' bureaucracies before the system trusts you with form-free trains.
administratorio-public-train-stop=[font=default-bold]The Public Train Stop operates without transit authorization paperwork.[/font]\n\nUnlocked by [technology=bureaucratic-transcendence] (requires the Aquilo chromatic tube tier). A vanilla [entity=train-stop] that does NOT require [item=transit-authorization] forms to function.\n\n[font=default-bold]Mechanics:[/font]\n• No transit permit chest is created.\n• No forms are consumed on train arrival.\n• Train limit is not tied to paperwork.\n• Functions exactly like a vanilla train stop.\n\n[font=default-bold]Why it exists:[/font] Bureaucratic Transcendence represents the point where your administration has become efficient enough that routine transit no longer requires per-arrival authorization. It's a quality-of-life unlock for massive rail networks — but you must complete the full interplanetary trunk chain to earn it.
