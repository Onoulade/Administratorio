[tips-and-tricks-item-description]
administratorio-welcome=Biters bring complaints instead of attack waves.\n• Build [entity=admin-station] desks with clear walking access.\n• Process their tickets, then return the matching resolutions to the desk.\n• Finish every complaint to collect [item=taxpayer-money].\nUnserved visitors become frustrated and protest at your buildings. Hover a visitor to inspect its case and mood.
administratorio-work-orders=Many machines need an operating document as a recipe ingredient. Missing paperwork stops production even when other ingredients are supplied.\nCheck the recipe's document requirement and its allowed machines in Factoriopedia. Documents for different machine classes are not interchangeable.
administratorio-field-office=Place [entity=field-office] more than 32 tiles from any nest and within 200 tiles of an enemy nest (normal quality). Select a recipe and supply its ingredients.\nA worker must walk from a nest to the office before crafting starts. After 2 crafts it returns; the next worker takes over. Keep both routes open.\nEach nest supports 10 field workers across all offices. A busy nearest nest makes the office try another in range. No available worker means waiting. Field Offices operate all night without hired workers or salary.
administratorio-biter-complaints=Place [entity=admin-station] more than 32 tiles from any nest and leave its service positions reachable.\nExtract complaint tickets, process them at [entity=resolution-office], and insert matching resolutions into the same desk's inventory. Inventory slots do not need to match a visitor's standing position.\nA visitor leaves only after all its complaints are resolved. Larger visitors file more complaints. Desks start with 4 service places; capacity research adds more.
administratorio-visitor-routing=Visitors choose available destinations within 256 tiles (8 chunks): desks or enabled boarding platforms. A nearer available destination normally wins.\nIf any eligible destination exists within that radius, even full or waiting for a train, they do not search farther. They wait locally and roam toward destinations within 96 tiles (3 chunks).\nPlace pickup platforms near the visitor source. A full nearby desk can keep visitors from seeking a distant platform. Only when no local destination exists do they seek farther away.
administratorio-desk-signals=Wire [entity=admin-station] to read its complaint signals, [virtual-signal=signal-available-slots] free service places, and [virtual-signal=signal-total-waiting] visitors currently at the desk. Reservations already reduce free places.\nUse Available Waiting Slots = 0 for a capacity warning; use a complaint signal > 0 to enable that resolution line. Complaint signals describe visitors' cases, not the inventory contents.\nFor individual problems, hover the visitor. The Administration Desk Overview shows the wider service load.
administratorio-frustration=Frustration rises while visitors seek service or wait for resolutions. Walking to a reserved desk pauses that deadline. In normal mode, 100% frustration starts a protest that disables a building.\nThrow [item=promise] at the protester. With a free desk, it returns at 50% frustration; otherwise it gets 60 seconds to find service before protesting again.\nPromises preserve the unfinished case. Clear its remaining complaints and keep walking routes open.
administratorio-hush-money=Throw [item=hush-money] at nests to stop spawning for 3 minutes. Existing visitors still need service.\nUse the pause to clear a backlog or restore a broken resolution line. Nests resume spawning afterward.
administratorio-nest-expropriation=Throw [item=eviction-notice] near a nest to remove it permanently. Nearby citizens enter the complaint system with elevated frustration.\nPrepare desk capacity before evicting. Keep some nests if you still need visitors for revenue, recruitment, or Field Office labor.
administratorio-biter-employment=Put [item=job-offer] in the desk inventory before a visitor's final resolution is delivered. A successful hire replaces its money payout.\nWithout Space Age, biters and spitters always accept: small/medium/big/behemoth visitors yield 1/2/3/5 [item=worker-biter].\nWorkers are reusable staff for dispatch. Specialists used in building recipes are consumed when crafting the building.
administratorio-space-age-enrollment=Put [item=job-offer] in a Nauvis desk before final resolution. Only biters enroll; spitters do not. The offer is spent on the attempt.\nSuccess by frustration: ≤50%: 75%; >50–75%: 50%; >75–90%: 25%; >90%: 0%.\nSuccess gives one [item=enrolled-biter] instead of money. Train it at [entity=formation-center] into a reusable [item=worker-biter]. Ordinary personnel formation is on Nauvis; manager briefings can run elsewhere.
administratorio-biter-station=Load [entity=biter-station] with [item=worker-biter] and [item=taxpayer-money]. Keep a walking route to machines within 30 tiles of its center.\nEach visit authorizes one craft. Workers return and are reused; each trip costs 1 money. Labor Efficiency lets a trip visit 3, then 5 machines.\nThe closest station owns each machine, even if that station lacks workers or money. Overlapping stations do not multiply its visits. Hover the station to inspect coverage and dispatch status.
administratorio-worker-machines=Worker visits operate [entity=oil-refinery], [entity=centrifuge], [entity=propaganda-distillery], [entity=corporate-breakroom], and planetary [entity=printer-t2].\nOther assemblers do not need station visits. Union Headquarters uses its recipe inputs instead. An orbital printer aboard a space platform is permanently authorized.\nA machine needs a recipe and a clear approach. If it waits, inspect its nearest station, worker supply, salary, and night coffee.
administratorio-biterport=Load [entity=biterport] with [item=biter-logistics-formation] and [item=taxpayer-money]. Each worker trip costs 1 money.\nWorkers walk to logistic chests, players, construction ghosts, and deconstruction jobs. Keep routes open; they cannot fly over obstructions.\nNormal-quality coverage is a square extending 25 tiles on each axis for logistics, 55 for construction. Ports join one network when their centers differ by at most 50 tiles on each axis, including diagonally. Hover a port to inspect its network.
administratorio-biterport-cargo=Keep provider stock, requester space, and storage in the same Biterport network. Workers preserve item quality. Capacity research increases loads; speed research is separate.\nLoose items go to a requester that needs them, then storage. With no suitable destination, a worker keeps its cargo and raises an alert; other workers continue.\nFree space or add storage in that network. The waiting worker retries every 5 seconds. Adding workers cannot fix a missing destination.
administratorio-orphaned-workers=A worker stranded by a removed home, full home inventory, or blocked return route raises an alert and accumulates frustration.\nRebuild a compatible [entity=biter-station] or [entity=biterport], free a worker slot, or clear the route. Workers retry blocked homes every 10 seconds.\nReaching a suitable home clears the warning and frustration. Otherwise the worker eventually becomes a protester.
administratorio-rideable-biter=Deploy [item=rideable-biter] and fuel it with [item=taxpayer-money]. It may wander when unattended.\nA deployed mount cannot be mined or deconstructed. After 10 minutes with an empty fuel slot, it becomes a wild medium biter and enters the complaint system. Keep money in its fuel slot if you want to keep it.
administratorio-hired-biter=Deploy [item=hired-biter-capsule] and supply [item=eviction-notice]. An agent carries up to 20 notices and searches 60 tiles around itself for nests. Each eviction spends one notice.\nStocked agents patrol and evict automatically. They can replenish notices from a roboport logistics network or from supply stops you assign.\nEvictions still displace citizens into your complaint system. Route agents only through areas you intend to clear.
administratorio-field-agent-controls=Hold [item=hired-biter-command-capsule].\n• Left-click: select or deselect agents at the cursor.\n• Right-click ground: replace their route with a waypoint.\n• Shift + right-click ground: append a waypoint.\n• Shift + right-click a chest: append a supply stop.\n• Shift + left-click a chest: load notices into selected agents immediately.
administratorio-working-hours=With Working Hours enabled, [entity=office-desk] and [entity=union-headquarters] close at night unless one [item=overtime-exemption] is installed in a module slot. It is permanent; extra copies add nothing.\n[entity=biter-station] and [entity=biterport] instead consume 5 [fluid=liquid-coffee] per night dispatch. Pipe coffee into a side connection. Their visiting workers authorize managed machines, including the Breakroom.\nField Offices stay open. Night clearance does not remove protests. Disable Working Hours in startup settings to remove night closures.
administratorio-administrative-clock=Wire [entity=administrative-clock] to read [virtual-signal=signal-working-hours]: 1 during the day shift, absent at night. Enable a feeder when this signal > 0 to schedule daytime work.\n[virtual-signal=signal-daytime] runs from 0 to 100, with midnight at 0/100. [virtual-signal=signal-day-shift-start] and [virtual-signal=signal-day-shift-end] mark the shift boundaries.\nThe clock reports the shift; it does not grant overtime or supply coffee.
administratorio-pneumatic-transport=Connect [entity=tube-intake] and [entity=tube-outtake] with pneumatic pipes. Use an inserter to load accepted paperwork into the intake.\nSet the outtake's inventory-slot filter to choose an item; use an inserter to remove it. An unfiltered outtake takes the most abundant item. It requests another only after its slot is empty.\nConnected endpoints share a mixed-item pool instantly. Ordinary fluid pipes do not connect. Hover an endpoint to inspect contents, capacity, and connection status.
administratorio-tube-limits=A tube network starts with room for 10 items in total, shared by every document type. Capacity research expands this pool. Full pools stop intakes until an outtake frees space.\nEvery connected tube must stay within 120 tiles of each endpoint or pump port on that network, measured in a straight line. Exceeding the limit stops the whole network.\nSplit long runs with [entity=tube-pump]. Each side then has its own reach limit and item pool.
administratorio-tube-circuits=Intakes and outtakes emit their network's pooled item counts on both wire colors.\nFor an intake feeding [item=form-27b-6], set its circuit enable condition to Form 27B-6 < 5. It stops adding that form once five are pooled.\nRead one endpoint per circuit network: wiring several endpoints together adds duplicate readings. Avoid enabling inventory-content outputs on the same wire when you need pool-only counts. Outtake slot filters choose what to receive; circuit signals do not request it.
administratorio-tube-pump=Power [entity=tube-pump] and connect separate tube networks to its rear and front. Forms move rear → front while the destination has space.\nUse its allow/block item filters to choose which forms cross. With filters disabled, all accepted forms may cross.\nDo not connect both sides with a bypass pipe: that merges the pools and defeats the range break. The pump cannot transfer when either network is overextended.
administratorio-passenger-rail-service=[item=passenger-wagon] carries 24 unresolved complaint visitors. It does not carry worker items or cargo.\nPlace platforms beside the wagon's stopping position: rail within 2.75 tiles of the platform center, wagon center within 4 tiles. Each platform serves its nearest passenger wagon only. Keep the boarding platform's center walkable.\nFor scheduled service, place exactly one train stop within 24 tiles for automatic pairing. Put an [entity=deboarding-platform] at the destination, with reachable desks nearby.
administratorio-passenger-boarding=An [entity=boarding-platform] accepts up to 24 waiting visitors. Normally it accepts new reservations only with a stationary adjacent passenger wagon and a free seat.\nTo queue before the train arrives, send [virtual-signal=signal-boarding-enabled] Boarding Enabled > 0 on either wire color. Without the signal, an idle platform still keeps visitor searches local.\nVisitors board only at the platform center (within 0.85 tiles). A full queue still boards its existing visitors. Removing the signal does not hard-close boarding when a suitable wagon is present.
administratorio-passenger-unboarding=A stationary wagon unloads through its adjacent [entity=deboarding-platform]. Leave clear space around it for passengers to appear.\nSend [virtual-signal=signal-deboarding-closed] Unboarding Closed > 0 on either wire color to hold passengers aboard; clear it to unload.\nVisitors resume searching for service, skip previously visited stops, and take at most 3 rail legs before seeking desks only. Frustration continues in queues and transit. At the outbreak threshold, affected passengers leave the train to protest. Keep journeys short.
administratorio-passenger-signals=Platforms report their adjacent wagon; paired stops report the whole stopped train.\n• [virtual-signal=signal-train-passengers] Train Passengers: occupied seats.\n• [virtual-signal=signal-train-free-seats] Train Free Seats: available seats.\n• [virtual-signal=signal-boarders-waiting] Boarders Waiting: reserved platform queue.\n• [virtual-signal=signal-passenger-outbreak] Passenger Outbreak: outbreak active.\n• [virtual-signal=signal-passenger-highest-frustration] Highest Passenger Frustration: 0–100.\nUse the stop's whole-train values for schedule conditions, such as Train Passengers = 0 after unloading. Keep platform outputs off that wire: they would add duplicate counts.
administratorio-transit-authorization=Put [item=transit-authorization] into the permit chest beside each ordinary [entity=train-stop]. One permit is spent when a train arrives and waits.\nThe stop's train limit equals its permit count; zero permits closes it. Manual limits and circuit enable/limit controls are overridden.\nRegulate the number of stocked permits to control arrivals. Passenger services also need these permits at ordinary stops.
administratorio-public-train-stop=[entity=public-train-stop] needs no transit permits and creates no permit chest. Use it when you want normal manual or circuit train limits.\nReplace the ordinary stop and preserve the station name used by your schedules. Passenger platforms can pair with this stop too.
administratorio-personnel-routing=Align [entity=personnel-deployment-office], signs, and [entity=personnel-reception-office] on the 2×2 grid. Point deployment toward the next sign or reception; put a sign at each turn. Clear straight connections pave themselves.\nInsert trained personnel or space-tourist packages at deployment; extract the same items at reception. Field Agents and mounts use their own deployment systems.\nOnly the next sign or reception must be connected to start moving. These paths need no power or salary and do not route complaint visitors or working dispatch biters.
administratorio-personnel-traffic=A missing onward connection, occupied lane, unmatched filter, or full reception holds the queue. The first waiting biter blocks those behind it. Repair the route or empty reception to resume.\nRotate signs during traffic: a biter already entering keeps its reserved turn; the next uses the new arrow. Reception accepts all four directions.\nOccupied infrastructure cannot be mined. Stop loading, complete the route to reception, and drain it before rebuilding. Belts, inserters, and poles may share pavement; buildings that obstruct the lane cannot.
administratorio-personnel-multisign=Open [entity=personnel-routing-multisign] or a brass arrow socket. Left, straight, and right are relative to the main arrow. Each exit has its own Manual/Circuit mode.\nManual mode allows up to 5 personnel types; right-click clears a filter. An empty list closes the exit. All qualities match.\nIf several exits match, left wins, then straight, then right. A blocked preferred exit holds the queue; it never falls back. Filter changes affect waiting personnel, not a biter already entering a turn.
administratorio-personnel-circuits=For a multisign exit in Circuit mode, wire that exit's brass socket. A positive personnel item signal allows that type. Red + green and all qualities are summed; zero or negative closes it.\nExample: Worker Biter = 1 on the left socket sends workers left. Keep exit networks separate. Reattach socket wires after placing a blueprint.
administratorio-personnel-spoilage=Briefings and egg couriers spoil at half speed while walking or queued on signed paths. The timer is slowed, never reset.\nOn expiry, the traveler becomes a regular [item=middle-management-managing-manager] and keeps its quality. Later multisigns now need a regular-manager filter; an already reserved turn is unchanged.\nAllow a route home for regular managers so expired personnel cannot block the queue. Briefed managers show their remaining time above the walking biter.
administratorio-management-briefings=Brief managers at [entity=formation-center] near the job that needs them. Briefings expire after 30/25/20/15/10 minutes for Training/Staffing/Compliance/Liaison/Orbital Operations.\nExpiry returns a regular [item=middle-management-managing-manager]. Training and staffed construction also return managers unbriefed. Collect and reuse them.\nBriefings can run on any planet without taxpayer money. Avoid stockpiling briefed managers for long journeys.
administratorio-specialist-approval=[entity=foundry], [entity=biochamber], [entity=electromagnetic-plant], and [entity=cryogenic-plant] first become unapproved chassis. Approve the chassis with its matching license at [entity=corporate-breakroom] or [entity=union-headquarters].\nBreakroom approval needs no worker visit. A higher-quality chassis needs matching-quality paperwork.\nMining or deconstruction returns the unapproved chassis: approve it again before placement. Destruction returns nothing. The specialist is spent while crafting the chassis, not when placing the building.
administratorio-unstaffed-operations=Install one [item=unstaffed-operations-waiver] in a station-managed machine's module slot. It runs without worker visits or dispatch salary, including at night.\nThe waiver is permanent and uses a module slot. Removing it restores the worker requirement immediately. Extra copies provide no benefit. It does not remove recipe ingredients or protests.
administratorio-quality=Field Office nest reach and Biterport coverage gain 10% per quality level: uncommon +10%, rare +20%, epic +30%, legendary +50%. Biterport links still require centers within 50 tiles on each axis; Biter Station reach stays 30 tiles.\nPneumatic hardware gains no capacity or reach from Quality. Tubes and signed paths preserve cargo quality.\nTerminus and relocation requests must specify the cargo's quality. Multisign filters instead combine all qualities of a personnel type.
administratorio-trajectory-compliance-arrays=Load a Trajectory Compliance Array with deviation orders. It pushes asteroids away without producing chunks. Priority orders give twice the push.\nJunior covers small/medium rocks within 24 tiles; Senior adds big rocks within 36; Executive adds huge rocks within 48.\nHeavy rocks need more overlapping pushes. Multiple arrays can stack their effect. Arrays avoid rocks with attached or incoming miners: choose whether to deflect a threat or mine it.
administratorio-orbital-employment-catapult=Load [entity=orbital-employment-catapult] with [item=voluntary-exploration-space-miner]. Its target-priority list selects eligible asteroid sizes; it prefers huge, then big, medium, and small.\nMiners attach and keep mining until the rock breaks. One miner per asteroid is allowed initially; capacity research permits more. Incoming miners already reserve their slots.\nA full target makes the catapult wait. Staffed rocks cannot be deflected, so leave enough time for mining before impact.
administratorio-orbital-miner-recovery=When a staffed asteroid breaks, employee chunks appear before the ordinary asteroid chunks. Asteroid collectors recover them directly as reusable [item=voluntary-exploration-space-miner].\nReturn recovered miners to the catapult. Cover the drift area with collectors: an employee chunk that escapes is a lost miner. Extra miner capacity also means more employees to recover.
administratorio-territorial-arbitration=Place [entity=territorial-arbitration-post] so its footprint overlaps the target territory. Supply resettlement orders and lies continuously.\nSuccessful cycles shrink that territory; several posts combine their progress. If processing stops, territory regrows until arbitration is completed.\nCompletion removes the demolisher and yields [item=territorial-deed]. Check the post's status for progress or missing supplies. Finish the territory before moving your posts.
administratorio-capture-bureau=Place [entity=capture-bureau] more than 32 tiles from nests, within 48 tiles of the wildlife you want. Keep its output clear and supply one lure type.\n• Nauvis + workforce lure: biters become workers.\n• Nauvis + tourism lure: spitters become tourist packages.\n• Gleba + oviposition lure: pentapods yield eggs.\nNauvis modes drain 1 lure/second while waiting. Egg capture spends 5/8/12 lure per small/medium/big pentapod, with no idle drain. Mixed lure fluids can select an unwanted mode.
administratorio-pentapod-bargaining=On Gleba, throw [item=pentapod-sampling-capsule] directly at a wild pentapod. It survives and gives 1/2/4 fresh eggs by size. The same pentapod can be sampled again after 30 seconds; early attempts return the capsule.\nUse a Capture Bureau for automated wild harvest; egg cultivation research later enables breeding. Gleba nests spawn small pentapods only; evolution increases frequency.\nEggs still spoil into hostile pentapods. Keep their production and consumption close together.
administratorio-space-tourism=Capture spitters on Nauvis with tourism lure. Send the resulting package to an [entity=administrative-space-station] for orbital fulfillment, then return the fulfilled tourist to a Nauvis [entity=office-desk] for checkout.\nUnfulfilled packages expire after 5 minutes into angry spitters. Launch promptly.\nCheckout pays taxpayer money and releases the visitor peacefully. Capturing or fulfilling the package alone does not pay; complete the return trip.
administratorio-offworld-economy=With Space Age, complaint resolution pays [item=taxpayer-money] only on Nauvis. Off-world resolution still clears the case.\nImport money for off-world worker salaries and recipes that require it. Tourism also pays only at Nauvis checkout.\nKeep a local stock of reusable managers: their briefings need no money and can be renewed off-world.
administratorio-archive-recombination=Insert a supported form into [entity=archive-recombination-bureau]; it selects the reassignment automatically.\nThree alternative forms each have a separate 25% chance to appear: a cycle can return 0–3 items. Results stay in the same rank and never introduce a new color or reproduce the input.\nFeed surplus paperwork and sort the output. This is a gamble, not a guaranteed supply for a critical production line.
administratorio-ai-cooling=Connect [entity=ai-server] to heat pipes and a heat sink such as [entity=heat-exhaust]. A working server adds 4 MW of heat and stops at 950°C. It resumes only after cooling below that threshold.\nSend its [fluid=inference-token] through [entity=optical-fibre] to [entity=slop-refinery]. Ordinary pipes and pneumatic tubes cannot carry tokens.\nClear the refinery's fabricated-citation byproducts to keep it running. This system makes supported uncolored paperwork; it cannot replace colored-form production.
administratorio-interplanetary-terminus=Build [entity=interplanetary-terminus] on each participating planet. Initially only one per planet is allowed; additional-terminus research raises that limit.\nLoad accepted paperwork into its input slot. After transit, it joins your force's shared pool without needing a receiver request.\nArrivals stay in the receiving Terminus output inventory; extract them yourself. Local pneumatic networks remain separate. The base trunk accepts black paperwork; chromatic research enables supported colored documents.
administratorio-terminus-circuits=On a Terminus, green wire requests and red wire reports shared-pool contents. Send a positive item signal on green to keep receiving that form, with matching quality.\nThe signal is an ongoing request, not a target stock count. Stop it when your local buffer is full.\nAny endpoint can claim pooled forms, including the planet that exported them. The pool cannot reserve stock for one destination. Read one Terminus per red network to avoid adding duplicate pool counts.
administratorio-interplanetary-trunk=Base capacity is 3 items, with 30 seconds of transit per item. Research raises capacity and reduces transit time.\nCapacity counts both traveling items and unclaimed forms in the shared pool. A form that nobody requests can therefore block later exports indefinitely.\nCheck the red-wire pool contents, request stranded forms, and clear receiving output inventories. More Terminuses do not create separate pools or more shared capacity.
administratorio-relocation-cannon=Load staff into [entity=involuntary-relocation-cannon]. On another planet, load [item=involuntary-transfer-order] into [entity=involuntary-relocation-receiver] and send the desired personnel item signal on green wire.\nThe receiver chooses matching cargo; the cannon needs no destination setting. Each arrival spends one order. Red wire reports each building's own inventory.\nRequests repeat while positive; remove the signal when stocked. Provide enough orders for the requested batch. Extract arrivals from the receiver. Eggs and space platforms are unsupported.
administratorio-egg-couriers=Biter eggs stay on Nauvis. Train the appropriate courier there for off-world egg-dependent work: [item=missionary-manager], [item=voluntary-research-subject], or [item=geotechnical-assessment-manager].\nEach expires after 30 minutes into a regular manager. A courier waiting in a machine's input slot still ages.\nStage all other ingredients before delivering a courier, especially for Administratorium science. Signed paths slow spoilage while walking and queuing; they do not renew the courier.
administratorio-hard-mode=Enable HARD MODE in map settings to let unresolved protests escalate. Visitors protest at 70% of their frustration capacity, then attack buildings at 100%.\nUse [item=promise] to interrupt an attacker and send it back toward service. Have a reachable free desk and its resolutions ready; a promise alone does not finish the case.\nThis setting can be changed during a game. The ordinary 100%-means-protest rule applies when Hard Mode is off.
administratorio-personnel-counts=A regular sign emits item counts for personnel approaching on its immediate incoming segments, including queues and all qualities. It does not count the whole route.\nUse these counts to monitor a queue or control the inserter feeding deployment. The offices themselves have no circuit controls.
administratorio-evolution-approvals=Biter and spitter evolution is capped until you research the next complaint approval. Larger sizes also stay locked until their approval is researched.\nBuild the new resolution lines before approving the next size. Raising the cap allows evolution to grow again; it does not instantly raise evolution or release a saved backlog.\nThese limits do not apply to Gleba pentapods.
