[technology-description]
involuntary-relocation=Открывает [entity=involuntary-relocation-cannon] и приказы о переводе. Перевозит персонал семейства кусак между планетами партиями: тонные курьеры уходят наружу, отработавшие менеджеры возвращаются, поэтому окно в 30 минут остаётся выполнимым.
egg-courier-formation=Яйца кусак никогда не покидают Навис: испорченные яйца выводят враждебных кусак, а вне Нависа нет Административного стола, который мог бы их обработать. Готовит на Нависе Менеджеров-миссионеров, Добровольных подопытных и Менеджеров геотехнической оценки, которые несут разрешение вместо яиц.
synthetic-personnel=Открывает [entity=synthetic-personnel-bureau] и синтез профессий для всех специалистов, которых требуют планетарные здания. Больше не нужен рейс на Навис; ограничением служит электричество.
unstaffed-operations=Открывает [item=unstaffed-operations-waiver] — модуль, позволяющий одному зданию, обслуживаемому станцией кусак, работать без отправленного рабочего-кусаки. Ни к чему другому он не подходит.
aquilo-ai-inference=Открывает [entity=ai-server], [entity=slop-refinery], [entity=heat-exhaust] и [entity=optical-fibre]. Сервер производит инференс только из электричества; завод превращает его в документы. Инференс — жидкость, которую переносит только оптоволокно. Серверы потребляют огромную мощность и выделяют настоящее тепло в ванильную тепловую сеть; при недостаточном охлаждении сервер останавливается. Производит бесцветные документы ранга 0–1.
administratorium-slop-synthesis=Расширяет синтез бурды до документов ранга 2-3 без цвета ценой огромного расхода токенов и потока сфабрикованных ссылок. Цветные документы из бурды не производятся никогда.
interplanetary-tube-network=Открывает медленную узкую пневмомагистраль между планетами. Разблокирует [entity=interplanetary-terminus], по одному на планету: 3 предмета в полёте, 30 секунд на каждый.
interplanetary-tube-capacity-2=Расширяет межпланетную магистраль до 5 предметов в полёте и сокращает транзит до 15 секунд.
interplanetary-tube-capacity-3=Расширяет межпланетную магистраль до 10 предметов в полёте и сокращает транзит до 5 секунд.
interplanetary-tube-capacity-4=Расширяет межпланетную магистраль до 15 предметов в полёте и сокращает транзит до 2 секунд.
interplanetary-tube-capacity-5=Расширяет межпланетную магистраль до 20 предметов в полёте и сокращает транзит до 1 секунды.
interplanetary-tube-additional-terminus-1=Позволяет построить второй Межпланетный терминус на одной планете.
interplanetary-tube-additional-terminus-2=Позволяет построить третий Межпланетный терминус на одной планете.
interplanetary-tube-additional-terminus-3=Позволяет построить ещё один Межпланетный терминус на одной планете. Исследуйте снова для ещё одного, без ограничений.
interplanetary-tube-chromatic=Расширяет межпланетную магистраль до голубых, жёлтых, пурпурных и составных документов. Также выдаёт составную ленту, трёхцветные разрешения и итоговые экспедиционные хартии.
promethium-science-pack=Разрешает экспедицию за Администраториумом после завершения хроматического уровня пневмомагистрали Аквило. Открывает маршрут к разрушенной планете и финальный исследовательский пакет; экспедиция расходует административную науку, а для пакетов требуется подписанная [item=promethium-research-charter] экспедиционная хартия.
discovery-bullshit=Вы его нашли. Осталось только переработать эту находку в правдоподобный аргумент. Открывает обработку сомнительных данных, производство дежурных отговорок, отказы от ответственности по ТБ, разрешения на строительство и урегулирование первых жалоб на ландшафт.
discovery-redundant-rubble=При первом изучении местной почвы вы немедленно оказались погребены под лавиной избыточного щебня. Открывает регистрацию жалоб на ландшафт и твердотопливный бур.
field-office-deployment=Ваша первая выездная канцелярия учреждаёт ровно столько местной власти, сколько нужно для выдачи временных согласований, пустых обещаний и установки первой приёмной стойки.
administrative-science-research=Формализует цепочку урегулирования жалоб как воспроизводимую науку. Открывает административные исследовательские пакеты (розовые).
printing-technology=Механизированное производство документов. Открывает офисный принтер после изучения двух стартовых технологий.
administrative-bureaucracy=Выращивайте возобновляемый лес в контролируемых тепличных условиях. Открывает теплицу и производство древесины.
admin-station-capacity=Расширяет зону ожидания у каждой приёмной стойки на одно дополнительное место.
rubble-compaction=Спрессуйте избыточный щебень в стандартизированный стройматериал для возведения будущей инфраструктуры. Открывает уплотнённый щебень.
littering-resolution=Формализует процедуру разбора жалоб на несанкционированные свалки. Открывает некачественные отчёты, регистрацию и разбор жалоб на захламление.
industrial-printing=Масштабирует бумажный поток за пределы одного принтера при помощи технологий химической эры. Открывает промышленный принтер и массовое ксерокопирование бланков, согласований, углеродных сертификатов, Формы 27Б-6, экологических отчётов и директив.
chromatic-printing=Открывает общий хроматический принтер и чёрные чернила. Каждая цветная цепочка остаётся за стартовой технологией своей планеты.
cyan-ink-production=Добудьте корку ярь-медянки на Вулканусе, чтобы открыть циановые чернила и бланки, необходимые до металлургической науки.
vulcanus-certification=Учреждает сертификационное бюро Вулкануса, подготовку нотариусов и местные промышленные хартии после металлургической науки.
vulcanus-export-charters=Расширяет сертификацию Вулкануса на орбитальные лицензии и экспортные металлургические хартии.
amber-sap-processing=Откачайте янтарный сок, чтобы открыть местные стартовые административные рецепты Глебы.
gleba-conciliation=До сельскохозяйственной науки открывает Бюро отлова, подготовку посредников, сбор яиц, приманочные споры и жёлтые бланки.
fulgora-salvage-administration=Извлекает заряженный тонер из лома и открывает пурпурную цепочку до электромагнитной науки.
fulgora-digital-services=После электромагнитной науки открывает цифровое бюро и окончательные электромагнитные разрешения.
archive-recombination=Стандартизирует бюрократию утилизации Фулгоры. Открывает Бюро переназначения архивов — разновидность Рециклера с одним входом, постоянно укомплектованную Релейным клерком: три кандидата на замену выбираются независимо с вероятностью 25% каждый для каждого поддерживаемого бланка.
cyan-yellow-bureaucracy=Объединяет циановые документы Вулкануса и жёлтые документы Глебы для совместных технологий.
cyan-magenta-bureaucracy=Объединяет циановые документы Вулкануса и пурпурные документы Фульгоры для совместных технологий.
yellow-magenta-bureaucracy=Объединяет жёлтые документы Глебы и пурпурные документы Фульгоры для совместных технологий.
aquilo-cryogenic-administration=До криогенной науки открывает техника, лазерный принтер, сухие носители и лицензию для первого криогенного завода.
bureaucratic-transcendence=После завершения межпланетной сети открывает общественную железнодорожную остановку без разовых разрешений.
worker-formation=Открывает вакансии и подготовку обычных рабочих на Наувисе.
management-formation=Готовит менеджеров на Наувисе и открывает пять дешёвых временных инструктажей без денег налогоплательщиков, доступных на любой планете.
specialized-formation=Готовит астронавтов для административных платформ без утилитарной, космической или планетарной науки.
orbital-employment-infrastructure=Открывает административную космическую станцию и её базовый документооборот до утилитарной и космической науки. Единственный штатный рецепт космической науки Space Age расходует там согласования, доставленные с планеты.
orbital-compliance-systems=До тяговой установки открывает массив контроля, приказы отклонения, шахтёрскую пусковую установку и добровольных шахтёров.
trajectory-compliance-jurisdiction-2=Вводит представителей всех трёх первых планет в орбитальный наблюдательный совет. Старшие массивы могут отклонять большие астероиды на расстоянии 30 клеток.
trajectory-compliance-jurisdiction-3=Даёт квантовые полномочия исполнительного уровня перед началом экспедиции за Администраториумом. Исполнительные массивы могут отклонять огромные астероиды на расстоянии 40 клеток.
trajectory-compliance-speed-1=Сокращает цикл массива до 4,5 секунды.
trajectory-compliance-speed-2=Сокращает цикл массива до 4 секунд.
trajectory-compliance-speed-3=Сокращает цикл массива до 3,5 секунды.
trajectory-compliance-speed-4=Сокращает цикл массива до 3 секунд.
trajectory-compliance-speed-5=Сокращает цикл массива до 2,5 секунды с помощью трёх первых планет.
trajectory-compliance-speed-6=Сокращает цикл массива до 2 секунд.
trajectory-compliance-speed-7=Сокращает цикл массива до 1,5 секунды.
trajectory-compliance-speed-8=Сокращает цикл массива до 1 секунды с помощью криогенной науки.
trajectory-compliance-speed-9=Сокращает цикл массива до 0,5 секунды с помощью науки Администраториума.
orbital-employment-damage-1=Увеличивает работу каждого добровольного шахтёра до 187,5 в секунду.
orbital-employment-damage-2=Увеличивает работу каждого добровольного шахтёра до 250 в секунду.
orbital-employment-damage-3=Увеличивает работу каждого добровольного шахтёра до 312,5 в секунду.
orbital-employment-damage-4=Увеличивает работу каждого добровольного шахтёра до 375 в секунду.
orbital-employment-damage-5=Увеличивает работу каждого добровольного шахтёра до 437,5 в секунду.
orbital-employment-capacity-1=Разрешает двух добровольных шахтёров одновременно на одном астероиде.
orbital-employment-capacity-2=Разрешает трёх добровольных шахтёров одновременно на одном астероиде.
orbital-employment-capacity-3=Разрешает четырёх добровольных шахтёров одновременно на одном астероиде.
orbital-employment-capacity-4=Разрешает пять добровольных шахтёров одновременно на одном астероиде.
local-precedents=Утверждаёт юридические шаблоны для транспортных документов и прочих актов. Открывает бесполезную документацию и Форму 27Б-6.
nest-pacification=Превращает подкуп враждебной фауны в стандартизированную административную процедуру. Открывает Взятку за молчание, временно (на 3 минуты) приостанавливающую появление кусак из улья.
streamlined-work-orders=Печатайте наряды-допуски напрямую из черновиков, минуя промежуточные этапы согласования. Открывает прямую печать «из черновика в наряд-допуск» на электропринтерах, выдавая по 2 наряда-допуска за производственный цикл.
office-agriculture=Выводит снабжение офиса кофе на промышленный уровень, заменяя ручной поиск в компосте. Открывает кофейные плантации.
charcoal-production=Вводит регламент на экологически чистое производство древесного угля из тепличного леса. Открывает древесный уголь.
industrial-propaganda=Жидкая дезинформация оружейного класса в промышленных масштабах. Открывает Перегонный цех пропаганды, перегонку политической жидкости, жидкую дезинформацию, рафинированный абсурд и должностные полномочия.
corporate-hospitality=Превращает выпитый кофе и кулуарные сплетни в топливо для рабочей морали. Открывает кофейные зёрна, комнату отдыха, варку кофе, сплетни у кулера и разбор офисной драмы.
information-management=Перерабатывает сплетни и должностные полномочия в пригодные документальные следы. Открывает синтез данных и веские отговорки.
verbal-approvals=Формализует устные согласования руководства в многоразовый документ. Открывает чистые бланки директив, их ксерокопирование и устные согласования руководства.
environmental-compliance=Даёт зелёный свет нефтяной экономике через правильно задокументированный экологический театр. Открывает отчёты о воздействии на экологию, наряды-допуски на химические работы и заверенные углеродные сертификаты.
smog-abatement=Качество воздуха всех устраивало, пока кто-то не додумался начать его измерять. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на смог.
hazmat-response=То, чего вы не знаете, не может вам навредить — если только это не радиоактивная жидкость. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на опасные материалы.
nest-expropriation=Заявите права на территорию, опираясь на документы и силу. Открывает предписания о сносе ульев кусак.
synthetic-stationery=Легализует производство канцелярии из нефти. Открывает синтетическую бумагу из пластика, серы и воды для обеспечения высоконагруженного документооборота.
public-finance=Вводит в оборот казначейство и профсоюзы. Открывает казначейские облигации, Штаб-квартиру профсоюза, согласование профсоюза и государственные гранты.
health-and-safety=Превращает давление профсоюза в театр регуляторной безопасности. Открывает списание нарушений ТБ, официальные обоснования и создание утверждённой версии событий.
board-meetings=Расширяет штаб профсоюза до уровня совета директоров. Позволяет готовить проекты письменных согласований руководства и получать письменные согласования руководства без постройки отдельного здания.
executive-review=Выводит бюрократию на уровень завизированных директив. Открывает наряды-допуски по письменному согласованию для самых тяжёлых регулируемых проектов.
radiological-compliance=Пропускает бюрократию на территорию атомной энергетики. Открывает наряды-допуски на радиологические работы для центрифуг и обогащения урана.
eminent-domain-zoning=Собирает политический фундамент для масштабной экспансии. Открывает аналитические записки, политические директивы и чёрную кассу.
work-order-duplication=Стандартизирует массовое ксерокопирование подписанных нарядов-допусков. Открывает оптовую печать для всех семейств нарядов-допусков на промышленном принтере: от базовых нарядов-допусков для автоматов до радиологических нарядов-допусков.
federal-regulation=Превращает директивы в обязательный федеральный текст. Открывает выпуск регламентов.
noise-ordinances=Тишина — золото. А документирование нарушений тишины обходится ещё дороже. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на шум.
loitering-ordinances=Бесцельно стоять на месте теперь наказуемо. Кусаки не оценили. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на праздношатание.
creative-accounting=Стандартизирует переквалификацию денег из чёрной кассы в официальную выручку. Открывает налоговые проверки.
constitutional-law=Финальная стадия жалоб кусак. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на безработицу (уровень производственных пакетов).
vagrancy-ordinances=Финальная стадия жалоб плевак. Открывает регистрацию жалоб, ведение дел и финальное урегулирование жалоб на бродяжничество (уровень вспомогательных пакетов).
filing-cabinet-logistics-1=В ваших карманах теперь есть встроенная картотека. Больше слотов запроса и больше места для сброса предметов у взыскательного администратора.
filing-cabinet-logistics-2=Менеджеры среднего звена получают шкафы побольше. Дополнительно увеличивает вместимость личной логистики.
filing-cabinet-logistics-3=Всё подшито, сверено и промаркировано цветом. Вы стали частью бюрократии. Максимальная вместимость личной логистики.
after-hours-operations=Узаконивает сверхурочную работу для сотрудников административного аппарата. Открывает модуль [item=overtime-exemption] «Разрешение на сверхурочную работу», позволяющий ключевым офисам не закрываться после заката.
pneumatic-form-transport=Позволяет пересылать документы по герметичным пневмотрубам. Открывает входные/выходные шлюзы и пневмотрубы. Шлюзы принимают только допустимые документы, а трубы не стыкуются с обычными жидкостями.
pneumatic-capacity=Увеличивает количество документов, способных одновременно находиться в пневмосети.
pneumatic-capacity-1=Укрепляет узлы трубопровода, чтобы те выдерживали больший поток документов. Увеличивает вместимость пневмосети на 15.
pneumatic-capacity-2=Устанавливает регуляторы давления для повышения пропускной способности. Увеличивает вместимость пневмосети на 25.
pneumatic-capacity-3=Полноценная промышленная пневматическая инфраструктура. Увеличивает вместимость пневмосети на 50.
pneumatic-capacity-4=Пневмосеть премиального уровня для документооборота высшего руководства. Увеличивает вместимость пневмосети на 100.
biter-employment=Учреждаёт официальную программу трудоустройства для довольных кусак. Открывает трудовые договоры, полноценный стол клерка и отдел урегулирования жалоб. Потребует лишь немного бумажной волокиты и административной науки.
biter-employment-office=Открывает официальный Центр занятости кусак, способный рассылать рабочих по цехам фабрики. Открывает здание Центра занятости кусак.
rideable-biter=Позволяет назначать служебных кусак в автопарк личного транспорта. Открывает ездового кусаку.
automobilism=Возвращает в оборот старый добрый, сертифицированный государством автотранспорт. Открывает обычный автомобиль на этапе вспомогательных пакетов.
biter-labor-efficiency=Увеличивает количество поднадзорных машин, которые рабочий-кусака успевает обойти за один выход из центра занятости.
biter-labor-efficiency-1=Оптимизация маршрутов: теперь рабочий-кусака успевает обойти до 3 машин за рейс вместо 1. Каждая обслуженная машина выполняет один производственный цикл, после чего снова ждёт следующего визита.
biter-labor-efficiency-2=Продвинутая оптимизация труда: пропускная способность вырастает до 5 машин за один рейс рабочего.
biterport-logistics=Открывает кусакопорты, позволяет обучать кусак-грузчиков и создавать дешёвые однослотовые сундуки для логистики.
biterport-transport-capacity=Увеличивает количество предметов, которое кусака-грузчик может унести за один рейс.
biterport-transport-capacity-1=Внедрение первых логистических накладных. Кусака-грузчик уносит 2 предмета за рейс.
biterport-transport-capacity-2=Закупка улучшенных седельных сумок и зажимов для бумаг. Кусака-грузчик уносит 5 предметов за рейс.
biterport-transport-capacity-3=Стандартизация грузоперевозок среднего масштаба. Кусака-грузчик уносит 10 предметов за рейс.
biterport-transport-capacity-4=Выдача усиленной сбруи для крупногабаритных грузов. Кусака-грузчик уносит 25 предметов за рейс.
biterport-worker-speed=Увеличивает скорость перемещения кусак-грузчиков, приписанных к кусакопортам.
biterport-worker-speed-1=Закупка удобной обуви. Кусаки-грузчики передвигаются между задачами на 35% быстрее.
biterport-worker-speed-2=Закупка беговых кроссовок. Кусаки-грузчики бегают на 70% быстрее. Практически летают.
formation-center=Постройте специализированный Учебный центр. Необходим для переобучения кусак на любые другие специальности. Открывает здание Учебного центра.
union-delegate-training=Курсы повышения квалификации для профсоюзных лидеров. Позволяет готовить делегатов в Учебном центре.
chemical-operator-training=Аттестация кусак для возведения химзаводов и работы с опасными материалами. Позволяет обучать операторов химцеха в Учебном центре.
nuclear-technician-training=Сертификация кусак в качестве лицензированных специалистов-ядерщиков. Позволяет обучать специалистов-ядерщиков в Учебном центре.
hired-biter-fieldwork=Утверждаёт пилотную программу по запуску автономных агентов. Обучите одного чудовищного кусаку, наделив его полномочиями самостоятельно выискивать ульи и вручать им предписания о сносе. Безумно дорого. Безумно эффективно.

government-liaison=Формализуйте подписание разрешений администрацией кусак. Открывает Стойку приёма петиций и все рецепты штамповки одобрения разрешений.
workforce-formation=Учредите специализированную постспейсовую бюрократию рабочей силы. Формирование профессий остаётся на Нависе, тогда как пять дешёвых безналичных инструктажей менеджера можно проводить на любой планете.
eminent-domain-zoning-space-age=Собирает политический фундамент для масштабной экспансии. Открывает аналитические записки и политические директивы. В Space Age возобновляемое государственное финансирование обеспечивает космический туризм, а не отмывание через чёрную кассу.

