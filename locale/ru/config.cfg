[fluid-description]
politician-fluid=Вязкая, дурно пахнущая жидкость, извлечённая из природных трещин. Перерабатывайте её в Пропагандном Перегонном Заводе для получения Жидкой Лжи.
lie=Дистиллированный обман в жидкой форме. Критически важный ингредиент для дезинформации, убедительных отмазок, белых книг и тайных фондов.
misinformation=Оружеизированная ложь в жидкой форме. Синтезируется из лжи и сомнительных данных. Используется в обоснованиях и производстве политики.
union-approval=Жидкое согласие рабочей силы. Получается на переговорах в штаб-квартире профсоюза с использованием кофе, бумаги, данных и денег налогоплательщиков.
liquid-coffee=Сваренный административный кофе. Универсальная смазка бюрократии. Необходим для согласований, сплетен и урегулирования.
slush-fund=Отмытые государственные средства в жидкой форме. Производятся из государственных облигаций и лжи посредством пропагандной обработки.

