[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Добро пожаловать в Administratorio.[/font]\n\nЭтот мод заменяет военный конфликт бюрократией. Кусачи и плеваки не формируют атакующие группы — они становятся в очередь. Они идут к вашим стойкам [entity=admin-station], подают жалобы и ждут, пока вы их разрешите. Вы выживаете, поддерживая движение документации.\n\n[font=default-bold]Основной цикл:[/font]\n1. Кусач занимает место за стойкой и оставляет жалобы\n2. Вы обрабатываете жалобы через [entity=resolution-office] в решения\n3. Вы вставляете решения обратно в место, где сидит кусач\n4. Когда у него есть все необходимые решения, кусач оставляет [item=taxpayer-money] и уходит домой, чтобы исчезнуть\n\nЕсли очередь переполняется или кусач ждёт слишком долго, он протестует и отключает ближайшее здание. Остальные подсказки объясняют инструменты, которые вы используете, чтобы этого не произошло.
administratorio-work-orders=[font=default-bold]Машины работают на документации как на ингредиенте рецепта.[/font]\n\nАдминистративные документы — реальные входные данные для рецептов, как железо или медь. Если правильной документации нет, машина простаивает, даже когда все остальные ингредиенты на ленте.\n\n[font=default-bold]Сборочные машины работают на рабочих нарядах:[/font]\nКаждый рецепт сборщика потребляет [item=work-order] или один из его трансформированных вариантов. Более тяжёлые рецепты требуют вариантов более высокого уровня — примеры включают [item=safety-work-order], [item=construction-work-order], [item=management-verbal-work-order] и [item=management-written-work-order]. Новые рецепты открываются вместе с нужным им вариантом, поэтому уровни документации прогрессируют синхронно с деревом технологий.\n\n[font=default-bold]У других классов машин своя документация:[/font]\n• Печи потребляют [item=carbon-offset-certificate-basic]\n• Химические заводы потребляют [item=chemical-handling-work-order]\n• Центрифуги потребляют [item=radiological-work-order]\n\nЭто независимые цепочки поставок — рабочие наряды не заменяют их, и эти документы не взаимозаменяемы между классами машин.\n\n[font=default-bold]Исключение — нефтеперерабатывающие заводы:[/font]\nНефтеперерабатывающие заводы [color=red]не[/color] потребляют операционную документацию. Они уже регулируются отправкой с биржи труда кусачей (кусач должен подойти и авторизовать каждый цикл), поэтому бюрократия считает этот надзор достаточным.\n\nПланируйте линии документации так же, как вы планируете железо и медь.
administratorio-biter-complaints=[font=default-bold]Стойка администрирования заменяет атакующие волны врагов очередью.[/font]\n\nВместо формирования рейдов кусачи и плеваки идут к вашим стойкам [entity=admin-station] в поисках открытого места. Каждая стойка имеет 4 активных места обслуживания и зону ожидания, вмещающую до 12 кусачей в общей сложности.\n\n[font=default-bold]Как гражданин проходит через систему:[/font]\n1. Кусач занимает место и оставляет одну или несколько жалоб в стойке\n2. Вы вытаскиваете жалобы и обрабатываете их в [entity=resolution-office] в соответствующие решения\n3. Вы вставляете каждое решение обратно в место, где сидит кусач\n4. Когда у него есть все решения, которых он ждал, кусач оставляет [item=taxpayer-money] и уходит домой, чтобы исчезнуть\n\n[font=default-bold]Уровни и размер кусача:[/font]\nКакие жалобы подаёт кусач, зависит от его типа. Кусачи подают жалобы на ландшафт, смог, шум или безработицу; плеваки подают жалобы на загрязнение, опасные вещества, праздношатание или бродяжничество. По мере роста эволюции появляются более сложные уровни, и ваш конвейер решений должен поспевать. Более крупные враги подают [font=default-bold]несколько жалоб одновременно[/font] — один бегемот может потребовать целую стопку решений до того, как уйдёт.\n\n[font=default-bold]Эволюция всё ещё работает:[/font]\nГнёзда поглощают загрязнение и медленно повышают эволюцию, как в ванили. Каждый шаг сдвигает то, что требуют ваши стойки, поэтому цепочка решений должна расти вместе с фабрикой.\n\n[item=taxpayer-money] финансирует капсулы, диспетчерские здания и большинство расширения — чем быстрее вы очищаете жалобы, тем больше денег приходит. Каждая стойка также излучает сигналы схемы для счётчиков жалоб, свободных мест и общего количества ожидающих кусачей; подключите их, чтобы масштабировать ёмкость до того, как очередь переполнится.
administratorio-frustration=[font=default-bold]Фрустрация начинается в момент, когда кусач покидает гнездо.[/font]\n\nТаймер продолжает расти, пока кусач не получит [color=green]каждое[/color] решение по [color=green]каждой[/color] поданной им жалобе. Наведите курсор на любого кусача, чтобы увидеть его текущее настроение.\n\n[font=default-bold]Два способа начать протест:[/font]\n• Фрустрация достигает 100% до завершения дела\n• Кусач прибывает в очередь, и ни на одной стойке нет свободного места\n\nКогда происходит любое из этих, кусач идёт к ближайшему зданию игрока и отключает его, пока вы не вмешаетесь.\n\n[font=default-bold]Бюрократическое обещание:[/font]\nБросьте [item=promise] в [color=red]протестующего кусача[/color] (не в здание):\n• Если место открыто, кусач возвращается к стойке с [font=default-bold]50% фрустрации[/font] и возобновляет своё дело\n• Если ни одно место не открыто, кусач ищет [font=default-bold]одну минуту[/font], а затем возобновляет протест, если ничего не освободилось\n• Обещание [color=red]не[/color] стирает жалобу и не сбрасывает прогресс документации\n\nОбещания покупают время. Постоянное решение — завершить дело, чтобы кусач ушёл сам по себе — оставайтесь впереди, добавляя стойки до того, как очередь заполнится, и масштабируя пропускную способность решений так, чтобы дела завершались быстрее, чем накапливается фрустрация.
administratorio-nest-expropriation=[font=default-bold]Выселение уничтожает гнездо навсегда — и формирует вашу кривую эволюции.[/font]\n\nБросьте [item=eviction-notice] на вражескую территорию, и ближайший спавнер уничтожается окончательно. Это единственный способ вернуть землю в моде.\n\n[font=default-bold]Рычаг эволюции:[/font]\nУничтоженные гнёзда перестают поглощать загрязнение, поэтому выселение — также способ замедлить эволюцию. Подвох: гнёзда — также источник кусачей, а кусачи — источник [item=taxpayer-money]. Уничтожение каждого гнезда лишит фабрику финансирования. Баланс — суть всей игры — оставьте достаточно гнёзд живыми, чтобы финансировать операции, выселяйте достаточно из них, чтобы эволюция не обогнала ваш конвейер решений.\n\n[font=default-bold]Вытеснение:[/font]\nКусачи возле уничтоженного спавнера не убиваются. Они сбрасываются прямо в вашу систему жалоб с повышенной фрустрацией. Выселяйте только когда ваши стойки и цепочка решений могут поглотить волну.\n\nДля непостоянного замедления, не вытесняющего кусачей, используйте вместо этого [item=hush-money].
administratorio-hush-money=[font=default-bold]Деньги за молчание временно останавливают спавн в гнезде.[/font]\n\nБросьте [item=hush-money] во вражеское гнездо. Спавнеры внутри радиуса эффекта молчат несколько минут, затем возобновляют работу ровно с того места, где остановились. Пока подавлены, новые кусачи не покидают это гнездо для подачи жалоб.\n\nИспользуйте, когда очередь перегружена и вам нужно замедлить приток достаточно, чтобы очистить накопившиеся жалобы. Стоит [item=taxpayer-money] за бросок, поэтому относитесь к этому как к аварийному клапану, а не к долгосрочному плану.\n\nВ отличие от [item=eviction-notice], деньги за молчание не уничтожают гнездо и не вытесняют кусачей в вашу очередь — их единственный эффект — приостановка новых прибытий.
administratorio-working-hours=[font=default-bold]Здания, зависящие от кусачей, закрываются ночью.[/font]\n\nПравило тематическое: если у здания либо кусачи [font=default-bold]приходят на работу[/font] ([entity=office-desk], [entity=corporate-breakroom], [entity=union-headquarters], [entity=biter-station], [entity=biterport], [entity=field-office]), либо кусачи [font=default-bold]как ингредиент рецепта[/font], его рабочая сила уходит домой на закате. Без вмешательства здание простаивает до рассвета.\n\nВы держите его открытым ночью, давая ему правильный расходник:\n• [font=default-bold]Здания офисного типа[/font] — установите один [item=overtime-exemption] в слот модуля здания. Одной копии достаточно; дополнительные ничего не делают.\n• [font=default-bold]Диспетчерские здания[/font] — подайте [fluid=liquid-coffee] в любой из четырёх боковых входов. Каждая ночная отправка потребляет одну единицу.\n\nДневная пропускная способность намеренно выше, чем ночная. Механика существует, чтобы подтолкнуть вас к пиковому производству в офисные часы, а не к равномерной подаче документации 24/7. Протесты всё ещё отключают здания, даже с разрешением на сверхурочные — разрешение покупает вам ночь, а не очередь.\n\nЕсли вам совсем не нравится механика, отключите Рабочие часы в стартовых настройках перед загрузкой мода.
administratorio-biter-employment=[font=default-bold]Предложения о работе превращают решённых кусачей в нанимаемых рабочих.[/font]\n\nПоместите [item=job-offer] в любой слот [entity=admin-station]. Когда кусач, сидящий в этом слоте, получит [color=green]каждое[/color] решение, которого он ждал, он подбирает предложение вместо того, чтобы уйти. Предложение расходуется, и предмет [item=biter-worker] попадает в инвентарь стойки. [color=red]Никаких[/color] [item=taxpayer-money] не выплачивается за этого кусача — найм заменяет наличные.\n\n[font=default-bold]Доход в зависимости от размера:[/font]\nБолее крупные враги нанимаются как больше рабочих за предложение:\n• Малый → 1 • Средний → 2 • Большой → 3 • Бегемот → 5\nПлеваки следуют той же шкале.\n\nОттуда рабочий может быть загружен в [entity=biter-station] для прямой отправки или отправлен в [entity=formation-center] для специализированного обучения. Каждое предложение о работе — это компромисс — вы отказываетесь от немедленной денежной выплаты, чтобы вырастить рабочую силу, без которой не может работать поздняя игра.
administratorio-biter-workers=[font=default-bold]Рабочие кусачи — это хранимые предметы, которые авторизуют управляемые машины.[/font]\n\n[item=biter-worker] сидит в [entity=biter-station], пока станция не отправит его. Рабочий идёт к управляемому зданию, позволяет ему выполнить один цикл крафта и возвращается обратно. Всё дерево производства в стиле сборщика работает на этом цикле.\n\n[font=default-bold]Обучение в [entity=formation-center]:[/font]\nЦентр формирования работает как машина-сборщик. Кликните по нему, чтобы открыть меню рецептов и выбрать специализацию. Подавайте [item=biter-worker] и необходимую документацию в входные слоты через конвейеры или манипуляторы — специалист появится в выходном слоте. Заберите его и держите в инвентаре. Когда вы [color=red]размещаете[/color] соответствующее здание, специалист потребляется при размещении, а не во время работы.\n\nТипы специалистов и что они открывают:\n• [item=union-delegate] — для строительства [entity=union-headquarters]\n• [item=chemical-operator] — для строительства [entity=chemical-plant]\n• [item=nuclear-technician] — для строительства [entity=centrifuge] и ядерных реакторов\n• [item=biter-logistics-formation] — юнит, который укомплектовывает [entity=biterport]\n• [item=rideable-biter] — превращает рабочего в личное верховое животное\n\nНефтеперерабатывающие заводы — исключение: они используют документацию регулируемого сборщика для строительства и отправку с биржи труда кусачей для работы, без этапа в центре формирования. Планируйте поставки специалистов для строительных заказов, а не для пропускной способности.
administratorio-rideable-biter=[font=default-bold]Личное транспортное средство, работающее на деньгах налогоплательщиков.[/font]\n\nРазверните [item=rideable-biter], чтобы кататься на рабочем как на верховом животном. Он сжигает [item=taxpayer-money] из своего слота топлива, чтобы оставаться назначенным, и имеет лишь крошечную грузовую сумочку.\n\n[font=default-bold]Правила эксплуатации:[/font]\n• После размещения [color=red]не может быть добыт или разобран[/color] — он уходит сам\n• Без присмотра может немного побродить\n• Если его слот топлива остаётся пустым [font=default-bold]10 минут[/font], контракт истекает\n\n[font=default-bold]Что происходит при истечении финансирования:[/font]\nКусач возвращается к статусу дикого [entity=medium-biter] и входит в систему жалоб. Если на стойке есть свободная ёмкость, он становится в очередь обычным образом. Если всё переполнено, он протестует, как любой другой необслуженный гражданин — включая, потенциально, здание, рядом с которым вы его припарковали.\n\nДержите несколько монет в седле.
administratorio-biter-station=[font=default-bold]Необходимая инфраструктура: некоторые здания не могут работать без неё.[/font]\n\nЭти управляемые здания крафтят только когда кусач подходит, чтобы авторизовать цикл:\n• [entity=oil-refinery]\n• [entity=centrifuge]\n• [entity=printer-t2]\n• [entity=corporate-breakroom]\n• [entity=propaganda-distillery]\n\nБез [entity=biter-station] в радиусе эти здания простаивают, независимо от того, сколько документации вы накопили. [entity=union-headquarters] не в этом списке — он уже потребляет кусача как ингредиент рецепта.\n\n[font=default-bold]Как работает отправка:[/font]\n• Загрузите станцию [item=biter-worker] и [item=taxpayer-money]\n• Станция обслуживает все управляемые здания в радиусе [font=default-bold]30 клеток[/font]\n• Она по очереди отправляет рабочего к каждому управляемому зданию в её зоне\n• Каждый визит авторизует один цикл крафта; рабочий затем возвращается\n• Одно здание может обслуживаться [color=green]несколькими станциями[/color] одновременно — перекрывающиеся зоны означают более частые визиты и большую пропускную способность\n\nНаведите курсор на любое управляемое здание, чтобы увидеть, какая(ие) станция(и) отправляют к нему. Наведите на саму станцию для просмотра живого охвата зоны и статуса отправки.\n\n[font=default-bold]Эффективность труда:[/font]\nПо умолчанию рабочий авторизует 1 машину за поход; исследования увеличивают это до 3, затем 5 за поход. Отправляемый юнит визуально меняется с каждым уровнем: маленький кусач на уровне 1, более крупное формирование на уровне 2, тяжёлый юнит на уровне 3. Зарплата за отправку меняется так же: 1, 2 и затем 3 [item=taxpayer-money] за поход.\n\n[font=default-bold]Ночью:[/font]\nКаждая отправка дополнительно потребляет [fluid=liquid-coffee] из любого из четырёх боковых трубопроводных входов. Нет кофе — нет ночных отправок.\n\n[font=default-bold]Экономическое замечание:[/font]\nМеньше походов означает меньше зарплат. Эффективность труда снижает стоимость [item=taxpayer-money] на единицу выпуска, а не только частоту отправок.
administratorio-biterport=[font=default-bold]Кусачепорт — это пешеходная версия робопорта.[/font]\n\nЗагрузите его [item=biter-logistics-formation] (созданным в [entity=formation-center]) и [item=taxpayer-money]. Рабочие выходят, чтобы перевозить предметы между логистическими сундуками и строить призраков сущностей внутри зоны охвата.\n\n[font=default-bold]Охват:[/font]\n• Логистический радиус: [font=default-bold]25 клеток[/font]\n• Радиус строительства: [font=default-bold]55 клеток[/font]\n• Дальность сети: порты в [font=default-bold]50 клетках[/font] друг от друга делят свой пул рабочих — им не нужно перекрываться, чтобы образовать сеть\n\n[font=default-bold]Улучшения грузоподъёмности[/font] (предметов на рабочего за поход):\n• База: [font=default-bold]1[/font]\n• Уровень 1: [font=default-bold]2[/font]\n• Уровень 2: [font=default-bold]5[/font]\n• Уровень 3: [font=default-bold]10[/font]\n• Уровень 4: [font=default-bold]25[/font] (требует науки химии)\n\nКаждый уровень также улучшает юнита рабочего, который начинает двигаться быстрее. Приоритизируйте грузоподъёмность в первую очередь — 8 рабочих с базой несут только 8 предметов суммарно, что сильно замедляет строительство до первого улучшения.\n\n[font=default-bold]Ночью:[/font]\nКаждая отправка потребляет [fluid=liquid-coffee] из любого из четырёх боковых трубопроводных входов.\n\nНаведите курсор на любой кусачепорт для просмотра живого статуса сети, активных рабочих и счётчика соединений.
administratorio-field-office=[font=default-bold]Бесплатный труд кусачей без найма кого-либо.[/font]\n\nПостройте [entity=field-office] возле вражеского гнезда (в радиусе примерно [font=default-bold]100 клеток[/font]). Он призывает кусача из ближайшего гнезда для выполнения крафта на месте. После [font=default-bold]5 крафтов[/font] кусач уходит домой, и призывается другой ему на замену.\n\n[font=default-bold]Правила работы:[/font]\n• Крафтит только пока кусач физически присутствует\n• Скорость 1.0× и 0 загрязнения во время работы\n• Простаивает, когда нет вражеского гнезда в радиусе\n• Ночью кусач уходит домой, если в слот модуля здания не установлен [item=overtime-exemption]\n\n[font=default-bold]Зачем он существует:[/font]\nВыездной офис — это мост между «нет рабочей силы кусачей» и «полностью укомплектованная [entity=biter-station]». Он позволяет вам производить несколько критических предметов до того, как цепочка решения жалоб наняла вам постоянных рабочих — ценой привязки к ближайшему гнезду.
administratorio-hired-biter=[font=default-bold]Контролируемый кусач, которым вы командуете напрямую.[/font]\n\nБросьте [item=hired-biter-capsule], чтобы развернуть кусача, которому вы можете отдавать приказы. Он несёт до [font=default-bold]20[/font] [item=eviction-notice] в своём 4-слотовом инвентаре и патрулирует самостоятельно, ища спавнеры для выселения.\n\n[font=default-bold]Командование им[/font] (держите [item=hired-biter-command-capsule]):\n• [font=default-bold]Левый клик[/font] по земле — переключить выбор агентов под курсором\n• [font=default-bold]Правый клик[/font] по земле — установить путевую точку для выбранных агентов\n• [font=default-bold]Shift+правый клик[/font] по земле — добавить путевую точку (маршрут с несколькими остановками)\n• [font=default-bold]Shift+правый клик[/font] по сундуку — добавить остановку пополнения: агент зайдёт в сундук за [item=eviction-notice] по пути\n• [font=default-bold]Shift+левый клик[/font] по сундуку — немедленно загрузить [item=eviction-notice] из этого сундука в выбранных агентов\n\n[font=default-bold]Поведение, когда снаряжён:[/font]\nЗагруженный агент сканирует в радиусе [font=default-bold]60 клеток[/font] вражеские спавнеры. Когда находит, он подходит и потребляет один [item=eviction-notice], чтобы уничтожить его. Один агент на патрулировании может удерживать область усмирённой, пока вы продолжаете его пополнять.\n\n[font=default-bold]Автоматическое пополнение:[/font]\nАгенты в зоне покрытия логистического робопорта vanilla автоматически берут [item=eviction-notice] из логистической сети когда запас заканчивается. Поставьте пассивный поставляющий сундук с запасом уведомлений рядом с зоной патрулирования — и агент будет самостоятельно поддерживать запас без ручного вмешательства.\n\nВыселения, осуществлённые агентом, всё ещё вытесняют ближайших кусачей в вашу систему жалоб, как и брошенные уведомления. Планируйте ёмкость стоек соответственно.

[mod-setting-name]
administratorio-enable-working-hours=Включить рабочие часы

[mod-setting-description]
administratorio-enable-working-hours=Когда включено, офисные столы, комнаты отдыха и штаб-квартиры профсоюзов закрываются ночью, если не оснащены Разрешением на сверхурочные, а биржи труда кусачей и кусачепорты требуют жидкий кофе для ночных отправок. Отключение этого удаляет ночные отключения, модуль Разрешения на сверхурочные, исследование Внеурочных операций, подсказку о рабочих часах и дневные ускорения скорости.

