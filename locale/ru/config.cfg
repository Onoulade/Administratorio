terms-and-conditions-apply=Формализуйте сертификацию Вулкануса и начните тяжбу с ландшафтом.
organically-sourced-nonsense=Формализуйте примирение Глебы, притворяясь, что документация биоразлагаема.
file-not-found=Постройте Бюро переназначения архивов. Оригиналы не возвращаются.
frozen-pdf=Откройте хроматическую магистраль Аквило и наконец перестаньте закачивать жидкие чернила в морозильник.
workforce-formation-achievement=Изучите Подготовку рабочей силы. Теперь у ваших кусак есть карьерный путь.
administrative-space-station-achievement=Постройте Административную космическую станцию. Наконец-то орбитальная бюрократия.
trajectory-compliance-array-achievement=Постройте Массив траекторного контроля. Отталкивайте астероиды документами.
senior-trajectory-compliance-array=Постройте Старший массив траекторного контроля. Большим камням нужны большие бланки.
executive-trajectory-compliance-array=Постройте Исполнительный массив траекторного контроля. Ни один астероид не обжалует это решение.
vesm-mass-production=Производите 10 Добровольцев-шахтёров-исследователей в час. Это очень много резюме.
asteroid-miner-veteran=Верните 100 Возвращающихся добровольцев-шахтёров. С возвращением, сотрудник.
orbital-permit-mill=Производите 50 Разрешений на орбитальную инфраструктуру в час. Космическому строительству нужны космические бланки.
chromatic-printing-achievement=Изучите Хроматическую печать. Теперь в полном цвете.
chromatic-printer-achievement=Постройте Хроматический принтер. Четыре бака с чернилами, ноль компромиссов.
triple-ink-threat=Производите 100 Трёхцветных разрешений в час. Циан, пурпурный, жёлтый и капля чёрного.
ink-hoarder=Произведите 10 000 единиц чернил. Бюджет на чернила — государственная тайна.
cyan-magenta-yellow-black=Произведите 1000 Композитных хромолент. Все цвета бюрократической радуги.
notary-public=Постройте Нотариальное бюро. Официальные печати для официальных сделок.
territorial-arbitrator=Постройте Пост территориального арбитража. Разрушителям вручили повестку.
demolisher-eviction-specialist=Заработайте 5 Территориальных актов. Выселены бюрократией.
chartered-accountant=Произведите 100 Хартий внепланетной металлургии. Интеллектуальная собственность Вулкануса теперь под межпланетной юрисдикцией.
conciliation-officer-achievement=Постройте Бюро примирения. Биология встречается с бюрократией.
capture-bureau-achievement=Постройте Бюро захвата. Ярмарка вакансий для враждебной живности.
space-tourism-mogul=Произведите 500 Контрактов общественного транспорта. Космический туризм: теперь с документацией.
symbiosis-specialist=Производите 100 Реестров симбиоза в час. Учёт особей в промышленных масштабах.
digital-services-bureau-achievement=Постройте Бюро цифровых услуг. Круглосуточная работа, ноль перерывов на кофе.
archive-recombinator=Постройте Бюро переназначения архивов. Один бланк на входе, три вероятных на выходе.
form-gambler=Обработайте 1000 Старых архивов. Казино всегда в выигрыше, но иногда вам достаётся разрешение.
relay-clerk-corps=Обучите 10 Релейных клерков. Специалисты электромагнитной маршрутизации, к службе готовы.
laser-printer-achievement=Постройте Лазерный принтер. Ни одни жидкие чернила не переживут дресс-код Аквило.
thermal-paper-pusher=Произведите 5000 Термопереносных листов. Премиальный носитель для премиальных планет.
ribbon-collector=Произведите 2000 Композитных хромолент. Сжатый цвет для бесцветной пустоты.
interplanetary-correspondent=Произведите 50 Хартий единых операций. Венец межпланетной бюрократии.
cyan-yellow-bureaucrat=Произведите 500 Цианово-жёлтых бланков. Вулканус и Глеба, объединены.
cyan-magenta-bureaucrat=Произведите 500 Цианово-пурпурных бланков. Вулканус и Фулгора, термозапечатаны.
yellow-magenta-bureaucrat=Произведите 500 Жёлто-пурпурных бланков. Глеба и Фулгора, архивированы биологически.
hardened-data-hoarder=Произведите 100 Бронированных хранилищ данных. Хранение данных на случай апокалипсиса.
bureaucratic-transcendence-achievement=Изучите Бюрократическую трансценденцию. Документация больше не тормозит движение поездов.
form-free-transit=Постройте 50 Общественных железнодорожных остановок. Поезда, которые просто работают. Настоящее чудо.
maxed-out-orbital-capacity=Изучите Вместимость орбитальной добычи 4. Пять шахтёров на астероид. Одобрено отделом кадров.
maxed-out-orbital-damage=Изучите Эффективность добычи астероидов 5. Теперь шахтёры бьют как тонна кирпичей.
speed-demon-arrays=Изучите Скорость траекторного контроля 9. Выпускайте приказы об отклонении каждые полсекунды.
executive-jurisdiction=Изучите Исполнительную астероидную юрисдикцию. Любой размер астероида. Обжалование невозможно.
vulcanus-export-licensed=Изучите Экспортные хартии Вулкануса. Металлургия выходит на межпланетный уровень.
cyan-yellow-merged=Изучите Цианово-жёлтую бюрократию. Две планеты, один бланк.
cyan-magenta-merged=Изучите Цианово-пурпурную бюрократию. Металлургия встречается с электромагнетизмом.
yellow-magenta-merged=Изучите Жёлто-пурпурную бюрократию. Биология встречается с ломом.
research-with-promethium=Исследуйте технологию с помощью исследовательских пакетов Администраториума.
welcome-to-the-department=Поставьте свою первую приёмную стойку. Ваша кабинка уже ждёт.
discovery-of-bullshit=Изучите Эмпирическую некомпетентность. Бред всё это время лежал прямо у вас под ногами.
ink-stained=Изучите технологию печати. Принтер опять зажевал бумагу.
form-27b-6-achievement=Штампуйте по 100 форм 27Б-6 в час. Вы так и не подали свою 27Б-6.
paper-pusher=Штампуйте по 1000 чистых бланков в час. Деревья погибли не зря.
capsule-promise=Примените капсулу с пустым обещанием. Обещание утешает доверчивых.
its-a-copy-of-a-copy=Изучите Местные прецеденты. Каким-то образом ксерокопия оказалась легитимнее оригинала.
permit-denied=Постройте 10 железнодорожных станций. Ни один состав не сдвинется с места без документов.
coffee-break=Обустройте комнату отдыха. Наконец-то, самое важное здание на фабрике.
pneumatic-delivery=Изучите Пневмотранспорт бланков. Формы летят по трубам. До чего техника дошла!
propaganda-machine=Постройте перегонный цех пропаганды. Производство согласия, по одному баррелю за раз.
endless-meetings=Изучите Заседания совета директоров. Этот вопрос всё ещё можно было решить одним имейлом.
union-strong=Учредите штаб-квартиру профсоюза. Рабочие организовались. Руководство обеспокоено.
environmental-compliance-achievement=Изучите Экологические нормативы. Теперь нефтехимическая экономика может работать при надлежащем документообороте.
constitutional-scholar=Изучите Конституционное право. Вы прочитали каждый регламент. Все до единого.
know-it-all=Изучите абсолютно все технологии. Поздравляем, вы избыточно квалифицированы.
eviction-notice-achievement=Используйте 100 предписаний о сносе. Ничего личного, просто политика компании.
mass-transit=Отправьте поезд на расстояние более 2000 клеток. Каждая остановка требует отдельного проездного ордера.
first-complaint=Зарегистрируйте первого кусаку на приёмной стойке. У граждан накопились к вам вопросы.
first-protest=Позвольте раздражению кусаки перерасти в настоящий протест. Вы же этого ждали.
case-closed=Закройте первое дело по жалобе кусаки. Одно дело закрыто, впереди ещё бесконечность.
protest-suppressed=Успокойте бастующего кусаку пустым обещанием. Клиент удовлетворен расплывчатыми гарантиями.
department-of-everything=Запитайте 10 приёмных стоек одновременно. Бюрократия расширяется, чтобы удовлетворить нужды расширяющейся бюрократии.
full-resolution=Закройте хотя бы по одной жалобе из всех 8 категорий. На каждый чих найдётся своя папка.
behemoth-paperwork=Зарегистрируйте чудовищного кусаку на приёмной стойке. Для этого потребуется очень много бланков.
orbital-employment-catapult-achievement=Постройте орбитальную катапульту для развёртывания шахтёров. Космический рельсотрон, но для отдела кадров.
