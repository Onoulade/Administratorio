[recipe-description]
paper-production=Преобразуйте дерево в бумагу. Первый шаг в любой бюрократической цепочке поставок.
ink-production=Перемелите уголь в сырые чернила. Можно создать вручную. Письмо начинается здесь.

blank-form-production=Печатайте чистые бланки, используя бумагу и чернила. Универсальная административная основа.
blank-approval-production=Печатайте чистые бланки одобрения. Шаблон более высокого качества для разрешений и санкций.
blank-directive-production=Печатайте чистые бланки директивы. Премиальный защищённый шаблон с тройными чернилами для управленческих одобрений.

carbon-offset-certificate-basic=Выдайте базовый сертификат углеродной компенсации из чистого бланка и угля. Включает пакетную плавку.
carbon-offset-certificate-verified=Усовершенствуйте базовый сертификат дополнительной проверкой сомнительных данных за офисным столом. Требуется для строительства стальной печи.
provisional-approval-production=Получите самую базовую форму бюрократического одобрения. Требует бумаги и избыточного щебня.
work-order-production=Составьте рабочий наряд из чистого бланка и сомнительных данных. Базовое разрешение для регулируемого производства на сборочной машине.
form-27b-6=Напечатайте стандартизированную форму заявки из чистого бланка, чернил и бесполезной документации.
safety-waiver-draft=Составьте отказ от претензий по безопасности за офисным столом из чистого бланка одобрения и базовой отговорки. Требует финализации на принтере.
safety-waiver-printing=Завершите черновик отказа от претензий по безопасности чернилами на принтере. Производит официальный отказ от претензий по безопасности.
transit-authorization-production=Составьте транзитное разрешение (форма 12-Т) для ж/д станций. Требует чистый бланк одобрения и форму 27Б-6.

environmental-impact-report=Составьте всеобъемлющую экологическую оценку за офисным столом из дрянного отчёта, формы 27Б-6 и заверенных углеродных сертификатов. Питает разрешения процессов более высокого уровня.
management-verbal-draft=Убедите менеджера дать устное согласие в комнате отдыха. Требуется чистая директива, базовая отговорка и кофе. Требует финализации на принтере.
management-verbal-printing=Завершите черновик устного управленческого одобрения чернилами и бумагой. Производит официальное устное управленческое одобрение.
management-written-proposal=Составьте письменное управленческое предложение в Штаб-квартире профсоюза. Требуется чистая директива, хорошая отговорка, нарратив и казначейская облигация.
management-written-1st-printing=Финализируйте письменное управленческое предложение за один тяжёлый проход на принтере, используя чернила, форму 27Б-6 и бумагу. Производит официальное письменное управленческое одобрение.
research-grant-approval-production=Выдайте базовый исследовательский грант из чистого бланка, избыточного щебня и сомнительных данных. Требуется для производства всех наборов науки.
construction-permit-draft=Составьте разрешение на строительство за офисным столом из чистого бланка одобрения, сомнительных данных и бумаги. Требует финализации на принтере.
construction-permit-printing=Завершите черновик разрешения на строительство чернилами на принтере. Производит официальное разрешение на строительство.

safety-work-order-production=Объедините отказ от претензий по безопасности с рабочим нарядом. Расходуется во время регулируемого производства T1 на сборочных машинах.
construction-work-order-production=Объедините разрешение на строительство с рабочим нарядом. Расходуется во время регулируемого производства T2 на сборочных машинах.
management-verbal-work-order-production=Объедините устное управленческое одобрение с рабочим нарядом. Расходуется во время регулируемого производства T3 на сборочных машинах.
management-written-work-order-production=Объедините письменное управленческое одобрение с рабочим нарядом. Расходуется во время регулируемого производства T4 на сборочных машинах.
research-grant-work-order-production=Объедините одобрение исследовательского гранта с рабочим нарядом. Расходуется во время регулируемого производства науки на сборочных машинах.
chemical-handling-work-order-production=Соберите операционный рабочий наряд химического завода за офисным столом из отказа от претензий по безопасности, отчёта о воздействии на окружающую среду, формы 27Б-6, бочки и трубопровода.
radiological-work-order-production=Соберите операционный рабочий наряд центрифуги за офисным столом из химической документации, письменного управленческого одобрения, обоснования и экологического отчёта.
safety-work-order-printing=Напечатайте рабочий наряд по безопасности напрямую из черновика, производя 2 за крафт. Требует электрический принтер.
construction-work-order-printing=Напечатайте строительный рабочий наряд напрямую из черновика, производя 2 за крафт. Требует электрический принтер.

dubious-data-batch=Пакетно расплавьте руду чуши в сомнительные данные с использованием сертификата углеродной компенсации. Для каменных и стальных печей.
dubious-data-refining=Очистите сырую руду чуши в сомнительные данные. Основа информационной экономики.
basic-excuse-production=Сформулируйте базовую отговорку из 5 сомнительных данных. Используется в разрешении ландшафтных дел и низкоуровневых процессах.
crappy-report-production=Составьте отчёт из 5 сомнительных данных. Основа для всей документации более высокого уровня.
politician-fluid-refining=Очистите политическую жидкость в жидкую ложь. Требует Пропагандистскую перегонную.
data-production=Синтезируйте реальные данные из дрянного отчёта и официальных полномочий.
good-excuse-production=Создайте убедительную отговорку, смешивая реальные данные с жидкой ложью.
misinformation-production=Произведите жидкую дезинформацию из лжи и сомнительных данных. Ключевой ингредиент в разработке политики.
justification-production=Постройте юридическое обоснование из дезинформации, полномочий и политической жидкости.
credentials-production=Произведите официальные полномочия из жидкой лжи, сомнительных данных и очищенной бессмыслицы.
narrative-production=Сплетите официальный нарратив из обоснований, хороших отговорок и очищенной бессмыслицы. Контролирует общественное восприятие. Создаётся в Штаб-квартире профсоюза.
white-paper-production=Напишите авторитетный политический документ из данных, лжи и казначейской облигации в Штаб-квартире профсоюза.
policy-production=Составьте директиву политики в Штаб-квартире профсоюза. Требует белые книги, дезинформацию, данные и гранты.
regulation-production=Составьте федеральное предписание в Штаб-квартире профсоюза. Требует эмпирические факты, полномочия, данные и существенные государственные гранты.
promise-production=Создайте вручную метаемое бюрократическое обещание из бланков, одобрений и сомнительных данных. Бросьте в протестующих кусачей, чтобы их успокоить.
eviction-notice-production=Произведите метаемое уведомление о выселении. Уничтожает структуры кусачей.
hush-money-production=Запихните деньги налогоплательщиков в метаемый пакет с достаточным количеством документации, чтобы это выглядело официально. На 3 минуты заглушает близлежащие гнёзда.
rideable-biter=Назначьте рабочего кусача на службу личного транспорта. Получившееся транспортное средство работает на деньгах налогоплательщиков, имеет лишь крошечный грузовой инвентарь, не может быть удалено после размещения и становится жалующимся кусачом, если оставить без финансирования на 10 минут.
job-offer-production=Составьте официальный трудовой договор. Поместите в стойку администрирования, чтобы нанять следующего решённого кусача в качестве постоянного рабочего.
biter-logistics-formation=Обучите одного рабочего кусача в специализированного логистического рабочего для строительства кусачепортов и работ с сундуками запросов.
union-delegate-training=Обучите рабочего кусача как сертифицированного профсоюзного делегата через формальные рабочие наряды, шаблонную документацию и чрезмерное количество кофе. Требуется для строительства Штаб-квартиры профсоюза.
chemical-operator-training=Сертифицируйте рабочего кусача для обращения с опасными химикатами через обучение на основе разрешений в Центре подготовки. Требуется для химических заводов.
nuclear-technician-training=Обучите рабочего кусача процедурам радиологической безопасности. Требуется для ядерных реакторов и центрифуг.
filing-landscape=Подайте жалобу на ландшафт с чистым бланком. Первый шаг в системе обработки жалоб.
filing-smog=Подайте жалобу на смог. Занимает больше времени, чем подача жалобы на ландшафт, из-за дополнительной экологической документации.
filing-noise=Подайте жалобу на шум. Требует значительного времени обработки и документации.
filing-unemployment=Подайте жалобу на безработицу. Самая сложная подача, требующая обширной документации.
filing-littering=Подайте жалобу на загрязнение с чистым бланком. Первый шаг в обработке жалоб плеваков.
filing-hazmat=Подайте жалобу на опасные вещества. Требует дополнительной документации для опасных материалов.
filing-loitering=Подайте жалобу на праздношатание. Требует обширной документации по запретным зонам.
filing-vagrancy=Подайте жалобу на бродяжничество. Самая сложная подача от плеваков, требующая исчерпывающих записей о вытеснении.
case-smog=Постройте подтверждённое дело о смоге из заявки, бумажных доказательств и избыточного щебня.
case-noise=Постройте подтверждённое дело о шуме из заявки, проверенных данных и экологической сертификации.
case-unemployment=Постройте подтверждённое дело о безработице из заявки, эмпирических фактов и государственного гранта.
case-hazmat=Постройте подтверждённое дело об опасных веществах из заявки, бумажных доказательств и спрессованного щебня.
case-loitering=Постройте подтверждённое дело о праздношатании из заявки, данных, полномочий и очищенной бессмыслицы.
case-vagrancy=Постройте подтверждённое дело о бродяжничестве из заявки, данных и директивы политики.
brief-noise=Устаревший рецепт совместимости из старой системы обработки жалоб.
brief-unemployment=Устаревший рецепт совместимости из старой системы обработки жалоб.
brief-loitering=Устаревший рецепт совместимости из старой системы обработки жалоб.
brief-vagrancy=Устаревший рецепт совместимости из старой системы обработки жалоб.
landscape-final=Решите жалобу на ландшафт, используя заявку и базовую отговорку. Самое простое решение.
smog-final=Решите жалобу на смог, используя подтверждённое дело, дезинформацию и жидкий кофе.
noise-final=Решите жалобу на шум напрямую из подтверждённого дела, объединяя стоимость старой стадии записок в одно тяжёлое окончательное решение.
unemployment-final=Решите жалобу на безработицу напрямую из подтверждённого дела, объединяя стоимость старой стадии записок в одно тяжёлое окончательное решение.
littering-final=Решите жалобу на загрязнение, используя заявку и дрянной отчёт. Немного сложнее, чем ландшафт.
hazmat-final=Решите жалобу на опасные вещества, используя подтверждённое дело, дезинформацию и жидкий кофе.
loitering-final=Решите жалобу на праздношатание напрямую из подтверждённого дела, объединяя стоимость старой стадии записок в одно тяжёлое окончательное решение.
vagrancy-final=Решите жалобу на бродяжничество напрямую из подтверждённого дела, объединяя стоимость старой стадии записок в одно тяжёлое окончательное решение.

iron-plate-batch=Расплавьте 10 железной руды в 10 железных пластин с использованием сертификата углеродной компенсации. Для каменных и электрических печей.
copper-plate-batch=Расплавьте 10 медной руды в 10 медных пластин с использованием сертификата углеродной компенсации. Для каменных и электрических печей.
steel-plate-batch=Переработайте 25 железных пластин в 5 стальных пластин с использованием сертификата углеродной компенсации. Для каменных и электрических печей.
stone-brick-batch=Переработайте 20 камня в 10 кирпичей с использованием сертификата углеродной компенсации. Для каменных и электрических печей.
greenhouse-wood=Выращивайте дерево, используя воду в теплице. Стабильно и устойчиво.
greenhouse-discovery=Покопайтесь в мокром компосте в поисках редких кофейных зёрен. 10% шанс за цикл. Вы в любом случае восстановите немного дерева, но никогда столько, сколько вложили.
synthetic-paper-production=Выдавите синтетическую бумагу из пластика, серы и воды. Быстрее, чем бумага из выращенного в теплице дерева, но значительно более ресурсоёмко.
coffee-plantation=Культивируйте кофейные зёрна, используя зёрна и воду. Даёт пять зёрен за полминуты.
coffee-refining=Заварите кофе с зёрнами, водой и рабочим нарядом. Простая документация, немедленный результат.
corporate-breakroom-production=Постройте корпоративную комнату отдыха для генерации сплетен у кулера.
watercooler-gossip-production=Сгенерируйте сплетни у кулера из жидкого кофе и сомнительных данных. Необходимы для корпоративного принятия решений.
osha-scrubbing=Обработайте нарушения охраны труда в офисе решений с очищенной бессмыслицей и профсоюзным одобрением для производства обоснований.
osha-violation-recycling=Массово переработайте нарушения охраны труда в Штаб-квартире профсоюза, восстанавливая случайные бланки и полуфабрикаты. Дешевле, чем очистка, но менее предсказуемо.
office-drama-recycling=Обработайте офисную драму с кофе в комнате отдыха, чтобы случайно восстановить рабочие наряды, сплетни у кулера и базовые отговорки.
resolution-office-production=Постройте офис решений 3x3 для обработки разрешений жалоб и разрешений.
copy-blank-form=Дублируйте чистые бланки: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий. Небольшой шанс отходов бумаги.
copy-blank-approval=Дублируйте чистые бланки одобрения: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий.
copy-blank-directive=Дублируйте чистые бланки директивы: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий.
copy-carbon-offset-certificate=Дублируйте сертификаты углеродной компенсации: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий. Требуется промышленный принтер.
copy-form-27b-6=Дублируйте форму 27Б-6: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий. Требуется промышленный принтер.
copy-environmental-impact-report=Дублируйте отчёты о воздействии на окружающую среду: 1 оригинал + 5 бумаги + 1 чернильный картридж + 1 продвинутая микросхема производит 6 копий. Требуется промышленный принтер.
copy-work-order=Дублируйте базовые рабочие наряды на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-safety-work-order=Дублируйте рабочие наряды по безопасности на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-construction-work-order=Дублируйте строительные рабочие наряды на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-management-verbal-work-order=Дублируйте устные управленческие рабочие наряды на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-management-written-work-order=Дублируйте письменные управленческие рабочие наряды на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-research-grant-work-order=Дублируйте рабочие наряды исследовательского гранта на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-chemical-handling-work-order=Дублируйте рабочие наряды по обращению с химикатами на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
copy-radiological-work-order=Дублируйте радиологические рабочие наряды на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 вычислительный блок производит 6 копий всего.
office-desk-production=Постройте административный офисный стол для подачи документов и крафта расходных материалов.
admin-station-production=Постройте центральную станцию решений 5x5 для обработки дел высокого уровня.
union-headquarters-production=Постройте первую штаб-квартиру профсоюза из казначейских облигаций и устной документации, затем используйте её для заключения одобрений трудовых ресурсов, грантов и поздней исполнительной политики.
propaganda-distillery-production=Постройте пропагандистскую перегонную для обработки административных жидкостей, таких как ложь и дезинформация.
greenhouse-production=Постройте теплицу для производства дерева и кофе.
printer-t1-production=Постройте базовый электрический принтер для производства документов на основе чернил.
printer-t2-production=Постройте промышленный принтер с возможностью копирования. Требует базовый принтер и продвинутые микросхемы в качестве компонентов.
mechanical-printer-production=Соберите механический принтер из железа, камня и бумаги. Надёжное улучшение для ранней игры.
pneumatic-pipe-production=Произведите запечатанные пневматические трубы из железа и спрессованного щебня. Только для транспортировки документации.
pneumatic-pipe-to-ground-production=Произведите подземные пневматические трубы. Подземный диапазон 16 клеток.
tube-intake-production=Постройте станцию приёма пневмопочты. Потребляет предметы документации для мгновенной пневматической транспортировки.
tube-outtake-production=Постройте станцию выдачи пневмопочты. Выдаёт предметы документации из пневматической сигнальной сети.
speed-module=Создайте модуль повестки 1 (скорость) из базовых отговорок и электронных микросхем.
speed-module-2=Улучшение: требует 4 модуля 1 уровня, хорошие отговорки и продвинутые микросхемы.
speed-module-3=Улучшение: требует 4 модуля 2 уровня, нарративы, вычислительные блоки, спрессованный щебень и полномочия.
productivity-module=Создайте модуль аудита 1 (производительность) из сомнительных данных и электронных микросхем.
productivity-module-2=Улучшение: требует 4 модуля 1 уровня, данные и продвинутые микросхемы.
productivity-module-3=Улучшение: требует 4 модуля 2 уровня, обоснования, вычислительные блоки, спрессованный щебень и полномочия.
efficiency-module=Создайте модуль растраты 1 (эффективность) из дрянных отчётов и электронных микросхем.
efficiency-module-2=Улучшение: требует 4 модуля 1 уровня, белые книги и продвинутые микросхемы.
efficiency-module-3=Улучшение: требует 4 модуля 2 уровня, директивы политики, вычислительные блоки, спрессованный щебень и полномочия.
union-approval-production=Заключите профсоюзное одобрение, используя кофе, бумагу, данные и деньги налогоплательщиков.
treasury-bond-production=Выпустите казначейскую облигацию из денег налогоплательщиков, чистых бланков и бесполезной документации.
government-grant-production=Получите государственный грант из казначейских облигаций, дрянного отчёта и устного управленческого одобрения. Создаётся в Штаб-квартире профсоюза.
tax-audit=Переклассифицируйте чёрные кассы, используя базовую документацию казначейских облигаций, документацию и данные, в гораздо большее количество денег налогоплательщиков. Коррумпированно, но эффективно.
slush-fund-production=Отмойте казначейские облигации с ложью в чёрную кассу.
useless-documentation-production=Оберните избыточный щебень слоями бумаги. Результат — официально задокументированная бесполезность, необходимая для подачи документов и финансовых инструментов.
compacted-rubble-production=Сожмите избыточный щебень в сертифицированных условиях. Требует сертификат углеродной компенсации. Используется в строительстве зданий и производстве модулей.
charcoal-production=Пакетно сожгите дерево в печи с сертификатом углеродной компенсации, чтобы произвести уголь. Возобновляемый источник угля в сочетании с теплицами.
refined-nonsense-production=Слейте спрессованный щебень с жидкой дезинформацией, чтобы произвести чистую очищенную бессмыслицу. Существенный ингредиент для бюрократических процессов высокого уровня.
overtime-exemption=Выдайте разрешение на ночную работу для одного административного здания. Требует модуль производительности, кучу государственного финансирования и достаточно кофе, чтобы законно держать свет включённым.

