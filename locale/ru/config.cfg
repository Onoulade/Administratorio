[achievement-description]
welcome-to-the-department=Постройте свою первую Стойку администрирования кусачей. Ваша кабинка ждёт.
discovery-of-bullshit=Исследуйте Открытие чуши. Она была прямо у вас под ногами всё это время.
ink-stained=Исследуйте Технологию печати. Принтер снова заело.
form-27b-6-achievement=Производите 100 форм 27Б/6 в час. Вы не подали свою 27Б/6.
paper-pusher=Производите 1000 чистых бланков в час. Деревья погибли не зря.
safety-first=Исследуйте Производство дерева. OSHA была бы горда. Если бы OSHA здесь существовала.
capsule-promise=Используйте капсулу обещания. Обещание — утешение для дурака.
its-a-copy-of-a-copy=Исследуйте Местные прецеденты. Каким-то образом копия более официальна, чем оригинал.
permit-denied=Постройте 10 ж/д остановок. Ни один поезд не движется без документации.
coffee-break=Постройте Корпоративную комнату отдыха. Наконец-то, самое важное здание.
pneumatic-delivery=Исследуйте Пневматическую транспортировку бланков. Вуууш! Бланки через трубы. Какое прекрасное время для жизни.
propaganda-machine=Постройте Пропагандистскую перегонную. Производство согласия, по бочке за раз.
endless-meetings=Исследуйте Заседания совета. Это всё ещё могло бы быть электронным письмом.
union-strong=Постройте Штаб-квартиру профсоюза. Рабочие организовались. Руководство обеспокоено.
environmental-compliance-achievement=Исследуйте Экологическое соответствие. Нефтяная и химическая экономика теперь может развиваться при надлежащей документации.
constitutional-scholar=Исследуйте Конституционное право. Вы прочитали все правила. Все до единого.
know-it-all=Исследуйте все технологии. Поздравляем, вы переквалифицированы.
eviction-notice-achievement=Используйте 100 уведомлений о выселении. Ничего личного, просто такая политика.
mass-transit=Заставьте поезд проехать более 2000 клеток. Каждая остановка требует своего собственного транзитного разрешения.
first-complaint=Зарегистрируйте своего первого кусача на стойке администрирования. У него есть вопросы.
case-closed=Решите свою первую жалобу кусача. Один долой, бесконечность осталось.
protest-suppressed=Усмирите протестующего кусача обещанием. Кусач успокоен расплывчатыми заверениями.
department-of-everything=Имейте 10 одновременно работающих стоек администрирования. Бюрократия расширяется, чтобы удовлетворить потребности расширяющейся бюрократии.
full-resolution=Решите хотя бы одну жалобу каждого из 8 типов. Жалоба на каждый случай.
behemoth-paperwork=Зарегистрируйте бегемотового кусача на стойке администрирования. Это... много документации.
