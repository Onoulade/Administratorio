[fluid-description]
politician-fluid=Вязкая, дурно пахнущая жидкость, извлекаемая из природных трещин. Очистите её в Пропагандистской перегонной, чтобы получить жидкую ложь.
lie=Дистиллированный обман в жидкой форме. Критический ингредиент для дезинформации, хороших отговорок, белых книг и чёрных касс.
misinformation=Оружейная ложь в жидкой форме. Синтезируется из лжи и сомнительных данных. Используется в обоснованиях и производстве политики.
union-approval=Жидкое согласие трудовых ресурсов. Заключается в Штаб-квартире профсоюза с использованием кофе, бумаги, данных и денег налогоплательщиков.
liquid-coffee=Заваренный административный кофе. Универсальная смазка бюрократии. Требуется для одобрений, сплетен и решений.
slush-fund=Отмытые государственные средства в жидкой форме. Производится из казначейских облигаций и лжи через пропагандистскую обработку.

