[fluid-description]
inference-token=Машинное рассуждение, производимое ценой разорительных затрат электроэнергии из материалов, которые никто не читал. Это поток, а не груз: его нельзя разлить в бочки, погрузить на конвейер или отправить — он передаётся только по оптоволокну. Перерабатывается в административную бурду и укомплектовывает Бюро синтетического персонала.
amber-sap=Липкое выделение Глебы, откачиваемое из полей янтарных источников. Оно обеспечивает дешёвую бессмыслицу планеты, местные чёрные чернила и бюрократию жёлтых бланков.
liquid-black-ink=Чёрная пишущая жидкость под давлением, подготовленная для хроматических труб и высокопроизводительных принтеров на жидких чернилах.
cyan-slurry=Грубая минеральная суспензия, извлечённая из корки ярь-медянки. Перерабатывается в вулканусские циановые чернила и некоторые сомнительные побочные продукты нотариального заверения.
cyan-ink=Хроматический канал Вулкануса. Подаётся в Хроматические принтеры для местных черновиков разрешений и хартий.
yellow-ink=Хроматический канал Глебы. Производятся из янтарного сока и биологии, затем подаются в Хроматические принтеры для компактного семейства жёлтых бланков планеты.
magenta-ink=Хроматический канал Фулгоры. Изготавливаются из трофейного тонера и документации для цифровой обработки, восстановления архивов и документации холмиевого доступа.
hostile-spore-culture=Споровая основа, выращенная на Глебе, которую можно специализировать в приманочные жидкости для Бюро захвата.
workforce-lure-spores=Приманочное облако с запахом предложения о работе. Загрузите его в Бюро захвата, чтобы привлечь кусак для набора работников.
tourism-lure-spores=Приманочное облако с запахом транзита. Загрузите его в Бюро захвата, чтобы привлечь плевак для туристической упаковки.
oviposition-lure-spores=Экспериментальное приманочное облако Глебы. Загрузите его в Бюро захвата, чтобы привлечь пентаподов для сбора яиц.
politician-fluid=Вязкая, дурно пахнущая жидкость, добываемая из природных разломов. Отправьте её в Перегонный цех, чтобы получить жидкую ложь.
lie=Дистиллированный обман в жидком виде. Базовый ингредиент для создания жидкой дезинформации, веских отговорок, аналитических записок и пополнения чёрной кассы.
misinformation=Жидкая дезинформация оружейного класса. Синтезируется из жидкой лжи и сомнительных данных. Идёт на официальные обоснования и выпуск управленческих директив.
union-approval=Жидкое согласование рабочей силы. Согласовывается в штабе профсоюза за жидкий кофе, бумагу, данные и деньги налогоплательщиков.
liquid-coffee=Сваренный жидкий кофе. Универсальная смазка бюрократического аппарата. Без него не будет ни согласований, ни сплетен, ни закрытых дел.
slush-fund=Отмытые бюджетные средства в агрегатном состоянии жидкости. Перегоняются из казначейских облигаций и жидкой лжи через цеха пропаганды.

