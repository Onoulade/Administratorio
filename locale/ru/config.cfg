[entity-description]
bullshit-ore=Богатое месторождение природной чепухи. Добывайте, чтобы получить сырую руду чепухи для бюрократической экономики.
politician-fluid=Подземная трещина под давлением политической сущности. Извлекайте с помощью насоса для получения флюида политиканства.
redundant-rubble=Геологическое месторождение минерализованного надзора. Добывайте, чтобы получить избыточный щебень для скрепления официальных документов.
office-desk=Многофункциональная рабочая станция для подачи документов, расходных материалов и базовых административных задач. Закрывается на ночь, если не оснащён [item=overtime-exemption].
office-desk-no-working-hours=Многофункциональная рабочая станция для подачи документов, расходных материалов и базовых административных задач.
admin-station=Интерфейс жуков размером 5×5. Хранит жалобы и урегулированные предметы. Жуки прибывают, регистрируются и ожидают урегулирования. Никакого крафта — только хранение.
resolution-office=Офис урегулирования размером 3×3. Обрабатывает подачи, делопроизводство и окончательные решения с двумя входными портами для жидкостей.
union-headquarters=Ведёт переговоры об одобрении рабочей силы и теперь выполняет консолидированную рабочую нагрузку исполнительного уровня позднего этапа: гранты, письменные согласования, разработку политики и налоговые проверки. Первый экземпляр загружается с помощью государственных облигаций и устных документов. Закрывается на ночь, если не оснащён [item=overtime-exemption].
union-headquarters-no-working-hours=Ведёт переговоры об одобрении рабочей силы и теперь выполняет консолидированную рабочую нагрузку исполнительного уровня позднего этапа: гранты, письменные согласования, разработку политики и налоговые проверки. Первый экземпляр загружается с помощью государственных облигаций и устных документов.
propaganda-distillery=Административный нефтеперегонный завод размером 5×5. Перерабатывает флюид политиканства в ложь, синтезирует дезинформацию, производит обоснования и тайные фонды. Симметричная схема труб с двумя входами с западной стороны и двумя выходами с восточной стороны.
locomotive=Сундук транзитных разрешений автоматически размещается на каждой остановке поезда. Загружайте формы [item=transit-authorization] в него — одна расходуется при каждом прибытии. Лимит поездов станции равен количеству форм в сундуке.
greenhouse=Медленно выращивает дерево из воды или культивирует редкие кофейные зёрна. Работает от электричества.
printer-t1=Медленный, но надёжный электрический принтер. Производит документы из картриджей с чернилами. Потребление энергии 50 кВт.
printer-t2=Быстрый промышленный принтер с режимом копирования. Может дублировать печатные документы в соотношении 1:6. Потребление энергии 200 кВт.
mechanical-printer=Грубый, но функциональный принтер с ручным приводом (скорость 0,5×). Надёжный помощник в начале игры.
corporate-breakroom=Потребляет жидкий кофе и сомнительные данные для генерации сплетен у кулера. Незаменим для принятия корпоративных решений. Закрывается на ночь, если не оснащён [item=overtime-exemption].
corporate-breakroom-no-working-hours=Потребляет жидкий кофе и сомнительные данные для генерации сплетен у кулера. Незаменим для принятия корпоративных решений.
pneumatic-pipe=Запечатанная труба манильского цвета для транспортировки бумажных форм. Не подключается к обычным трубам для жидкостей.
pneumatic-pipe-to-ground=Подземная пневматическая труба. Не подключается к обычной инфраструктуре для жидкостей.
tube-intake=Приёмная станция размером 1×1. Скрытый манипулятор перемещает действительные бумажные предметы с соседних лент или из сундуков в трубную сеть.
tube-outtake=Станция выдачи размером 1×1. Предметы из трубной сети появляются в её инвентаре — используйте собственный манипулятор или логистику для извлечения. Установите фильтр в ячейку инвентаря, чтобы запрашивать определённый тип предметов.
overtime-exemption=Даёт одному административному зданию право на законную работу в ночное время. Одного модуля достаточно, чтобы всё здание работало после наступления темноты; дополнительные экземпляры — это просто декоративная коррупция.

