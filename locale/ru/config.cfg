[achievement-description]
research-with-promethium=Исследуйте технологию с помощью исследовательских пакетов Администраториума.
welcome-to-the-department=Поставьте свою первую приёмную стойку. Ваша кабинка уже ждёт.
discovery-of-bullshit=Изучите Эмпирическую некомпетентность. Бред всё это время лежал прямо у вас под ногами.
ink-stained=Изучите технологию печати. Принтер опять зажевал бумагу.
form-27b-6-achievement=Штампуйте по 100 форм 27Б-6 в час. Вы так и не подали свою 27Б-6.
paper-pusher=Штампуйте по 1000 чистых бланков в час. Деревья погибли не зря.
capsule-promise=Примените капсулу с пустым обещанием. Обещание утешает доверчивых.
its-a-copy-of-a-copy=Изучите Местные прецеденты. Каким-то образом ксерокопия оказалась легитимнее оригинала.
permit-denied=Постройте 10 железнодорожных станций. Ни один состав не сдвинется с места без документов.
coffee-break=Обустройте комнату отдыха. Наконец-то, самое важное здание на фабрике.
pneumatic-delivery=Изучите Пневмотранспорт бланков. Формы летят по трубам. До чего техника дошла!
propaganda-machine=Постройте перегонный цех пропаганды. Производство согласия, по одному баррелю за раз.
endless-meetings=Изучите Заседания совета директоров. Этот вопрос всё ещё можно было решить одним имейлом.
union-strong=Учредите штаб-квартиру профсоюза. Рабочие организовались. Руководство обеспокоено.
environmental-compliance-achievement=Изучите Экологические нормативы. Теперь нефтехимическая экономика может работать при надлежащем документообороте.
constitutional-scholar=Изучите Конституционное право. Вы прочитали каждый регламент. Все до единого.
know-it-all=Изучите абсолютно все технологии. Поздравляем, вы избыточно квалифицированы.
eviction-notice-achievement=Используйте 100 предписаний о сносе. Ничего личного, просто политика компании.
mass-transit=Отправьте поезд на расстояние более 2000 клеток. Каждая остановка требует отдельного проездного ордера.
first-complaint=Зарегистрируйте первого кусаку на приёмной стойке. У граждан накопились к вам вопросы.
first-protest=Позвольте раздражению кусаки перерасти в настоящий протест. Вы же этого ждали.
case-closed=Закройте первое дело по жалобе кусаки. Одно дело закрыто, впереди ещё бесконечность.
protest-suppressed=Успокойте бастующего кусаку пустым обещанием. Клиент удовлетворен расплывчатыми гарантиями.
department-of-everything=Запитайте 10 приёмных стоек одновременно. Бюрократия расширяется, чтобы удовлетворить нужды расширяющейся бюрократии.
full-resolution=Закройте хотя бы по одной жалобе из всех 8 категорий. На каждый чих найдётся своя папка.
behemoth-paperwork=Зарегистрируйте чудовищного кусаку на приёмной стойке. Для этого потребуется очень много бланков.
