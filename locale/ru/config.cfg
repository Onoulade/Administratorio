[item-description]
slop-refinery=Всё, что происходит после жетона. Забирает жетоны инференции с оптоволокна и перерабатывает их в административную бурду, бурду — в сфабрикованную документацию, а также обрабатывает сфабрикованные цитаты, которые из этого выпадают. [entity=ai-server] выполняет только инференцию; именно здесь она превращается в документы.
optical-fibre=Переносит только [fluid=inference-token] и больше ничего. Не подключается ни к обычным трубам, ни к пневмотрубам.
involuntary-relocation-cannon=Отправляет персонал из семейства кусак на другую планету, партиями за выстрел. Это не турель; прицеливание не требуется.\n\nЗагрузите груз в его входной слот. Больше ничего не нужно — она стреляет всякий раз, когда соответствующий [entity=involuntary-relocation-receiver] на другой планете запрашивает это, расходуя один приказ о переводе этого приёмника на каждый прибывший предмет.\n\n[font=default-bold]Настройки цели нет.[/font] Отвечает любой приёмник на другой планете с подходящим запросом. Только персонал из семейства кусак, никогда яйца, только планеты. Планета, которая и отправляет, и принимает, строит по одному экземпляру каждого.
involuntary-relocation-receiver=Запрашивает персонал из семейства кусак с другой планеты, партиями за выстрел.\n\nЗагрузите бланки [item=involuntary-transfer-order] в его входной слот и подключите к сети схем с сигналом для каждого предмета, который [color=green]эта[/color] планета хочет получить. Он расходует один приказ на каждый прибывший предмет, а прибытия попадают в его выходные слоты.\n\n[font=default-bold]Настройки цели нет.[/font] Отвечает любая [entity=involuntary-relocation-cannon] на другой планете с подходящим грузом. Планета, которая и отправляет, и принимает, строит по одному экземпляру каждого.
involuntary-transfer-order=Разрешает перемещение ровно одного сотрудника, с его согласия или без. Загружается в [entity=involuntary-relocation-receiver] и расходуется по одному на каждый прибывший предмет.
missionary-manager=Менеджер среднего звена с полномочиями на десять яиц кусак, направленный на Аквило. Потребляется генератором пленных кусак. Через 30 минут превращается в обычного менеджера — вы теряете яйца и поездку, но не менеджера.
voluntary-research-subject=Менеджер среднего звена, вызвавшийся добровольцем в том смысле, что его никто не спрашивал. Потребляется наукой Администраториума на орбите. Через 30 минут превращается в обычного менеджера.
geotechnical-assessment-manager=Менеджер среднего звена, направленный оценить грунт Глебы. Возвращается после рецепта, поэтому Глеба накапливает менеджеров, если не отправлять их домой. Через 30 минут превращается в обычного менеджера.
synthetic-personnel-bureau=Производит профессии, а не здания. Синтезирует лицензированных нотариусов, посредников, релейных клерков и техников криопечати из яиц кусак, жетонов инференции и административной бурды — так что специалист больше не требует поездки на Наувис. Реальным ограничением служит энергопотребление.
unstaffed-operations-waiver=Разрешает одному зданию, обслуживаемому центром занятости кусак, работать без отправленного рабочего-кусаки. Занимает слот модуля, который иначе пошёл бы на продуктивность. Не истекает, но дорого стоит и подходит только зданиям, ожидающим отправленного рабочего.
ai-server=Вычислительное ядро Аквило и его единственная задача. Потребляет огромное количество электроэнергии для производства жетонов инференции и выделяет настоящее тепло в обычную тепловую сеть во время работы. Сервер, неспособный сбросить тепло, останавливается полностью — он не снижает нагрузку постепенно. Он не предполагает выбора рецепта, и его жетоны уходят только по оптоволокну на [entity=slop-refinery].
heat-exhaust=Ограничивает температуру тепловой сети, отводя излишек. Для игроков, которым нужны вычисления без выработки энергии. Никогда не эффективнее, чем реальное использование тепла.
administrative-slop=Правдоподобный административный текст без устойчивого смысла. Перерабатывается в настоящую документацию и в цитаты, которые таковыми не являются.
fabricated-citations=Ссылка, которая выглядит настоящей, но таковой не является. Стравите её, проверьте фактами обратно в сырьё, либо дайте ей накопиться и застопорить сервер.
interplanetary-terminus=Перемещает документацию между планетами через медленный, узкий общий пул ствола. По одному на планету.\n\n[font=default-bold]Чтобы отправить:[/font] манипуляторы загружают экспортируемый бланк в его входной слот. Он уходит по собственному таймеру — запрос не нужен — и попадает в пул, общий для всех планет вашей команды. Одновременно только один тип бланка.\n[font=default-bold]Чтобы запросить (провод [color=green]зелёного[/color] цвета):[/font] подключите зелёный провод и задайте сигнал для каждого бланка, нужного этой планете. Подходящий бланк из пула забирается мгновенно, откуда бы он ни пришёл — даже бланк, вложенный в пул этой же планетой, что является изъятием, а не обходным путём.\n[font=default-bold]Чтобы увидеть текущее содержимое пула (провод [color=red]красного[/color] цвета):[/font] подключите красный провод, чтобы прочитать, что сейчас в пуле по всей империи. Оба цвета используют один разъём Терминуса, не мешая друг другу.\n[font=default-bold]Чтобы получить:[/font] прибытия попадают в его выходные слоты. Забирайте их сами манипулятором — переместить их на конвейер, в сундук или в местную сеть труб — это ваш явный шаг, а не задача ствола.
promethium-asteroid-chunk=Засекреченный кусок астероида с Администраториумом, добытый у разрушенной планеты и проведённый через орбитальную бюрократию.
promethium-science-pack=Финальный административный исследовательский пакет. Производится на орбите из кусков Администраториума, квантовых процессоров, яиц кусак и [item=promethium-research-charter] экспедиционной хартии Администраториума.
promethium-research-charter=Хартия экспедиции к разрушенной планете, разрешающая добычу Администраториума при наличии орбитальных досье и единого межпланетного согласования.
bullshit-ore=Природное месторождение чистейшего, нерафинированного бреда. Фундамент всей бюрократической экономики. Добывайте, перерабатывайте, используйте как оружие.
redundant-rubble=Минерализованные отходы чрезмерного процедурного надзора. Сами по себе абсолютно бесполезны, но по закону обязательны для скрепления официальных документов.
compacted-rubble=Промышленно спрессованные бюрократические отходы. Производятся из избыточного щебня в электрической печи либо в любой печи через легальную переплавку по углеродным сертификатам.
useless-documentation=Избыточный щебень, заботливо завёрнутый в слои бумаги. Официально задокументированная бесполезность. Необходима для стандартной отчётности и выпуска финансовых инструментов.
refined-nonsense=Чистый, концентрированный абсурд. Получается путём слияния уплотнённого щебня с жидкой дезинформацией в перегонном цехе пропаганды. Несущая конструкция для административных процедур высшего уровня.
paper=Стандартный бюрократический носитель. Производится из древесины или синтезируется из пластика. Идёт на всё: от чистых бланков до судебных меморандумов.
coffee-bean=Редчайший и драгоценный ресурс. Добывается путём ковыряния в компосте. Кровеносная система любой функционирующей бюрократии.

ink=Сырая пишущая жидкость, получаемая из угля. Годится для рукописных документов или для заправки картриджей.
blank-form=Чистый бланк, ожидающий своего предназначения. Чистый лист бюрократии. Требуется почти в каждом бумажном рецепте.
blank-approval=Чистый бланк согласования, которому не хватает только финального заверения чернилами. Используется для отказов от ответственности по ТБ, разрешений на строительство и проездных ордеров.
blank-directive=Чистый бланк директивы с особым уровнем защиты и тройным расходом чернил. Необходим для визирования документов у начальства.
safety-waiver-draft=Незаконченный отказ от ответственности по ТБ. Ждёт распечатки и штампа.
construction-permit-draft=Незаконченное разрешение на строительство. Ждёт распечатки и штампа.
management-verbal-draft=Черновик устного согласования, полученный из разговора в комнате отдыха. Требует финализации на принтере.
management-written-proposal=Проект письменного согласования руководства, составленный исполнительным комитетом профсоюза. Требует одного тяжёлого прохода через принтер.
admin-station=Приёмная стойка для кусак. Во встроенной зоне ожидания видно, кто стоит в очереди; чтобы удовлетворить жалобу, просто верните закрытые дела обратно на стойку. Работает только как хранилище, ничего не производит.
resolution-office=Отдел, целиком посвящённый разбору жалоб. Отвечает за регистрацию, ведение дел и вынесение окончательных решений.
office-desk=Универсальное рабочее место для оформления бланков, исследовательских пакетов, финансовых выписок и прочей рутины. Работает только в дневные часы, если не установлен модуль [item=overtime-exemption].
office-desk-no-working-hours=Универсальное рабочее место для оформления бланков, исследовательских пакетов, финансовых выписок и прочей рутины.
union-headquarters=Огромный комплекс, где согласовывается найм и ведётся позднеигровая работа над директивами. Первый штаб строится на казначейских облигациях и устных документах, а затем берёт на себя гранты, письменные согласования, аудиты и директивы. Закрывается на ночь, если не установлен модуль [item=overtime-exemption].
union-headquarters-no-working-hours=Огромный комплекс, где согласовывается найм и ведётся позднеигровая работа над директивами. Первый штаб строится на казначейских облигациях и устных документах, а затем берёт на себя гранты, письменные согласования, аудиты и директивы.
propaganda-distillery=Специализированный объект для переработки административных жидкостей. Перегоняет политическую жидкость в жидкую ложь, синтезирует жидкую дезинформацию и производит должностные полномочия.
administrative-science-pack=Розовый исследовательский пакет. Продвигает бюрократическую мысль. Собирается на столе клерка.
taxpayer-money=Трудно заработанная валюта, полученная после урегулирования жалоб кусак. Главный источник финансирования государственного аппарата, и технически может использоваться как топливо в обычных твердотопливных машинах.
treasury-bond=Государственная ценная бумага. Смесь денег налогоплательщиков и бесполезной макулатуры. Идёт на стройки века и высокую политику.
government-grant=Щедрое вливание бюджетных средств. Необходимо для управленческих директив, сложных дел и прочей элитной бюрократии.
job-offer=Официальный трудовой договор. Положите его в приёмную стойку — когда все жалобы кусаки будут закрыты, он заберёт договор и станет вашим сотрудником, а не уйдёт восвояси. Чем крупнее кусака, тем больше сотрудников вы получите.
biter-worker=Нанятый рабочий-кусака. Требуется для строительства административных зданий. Получается при найме довольных кусак с помощью трудовых договоров.
biter-logistics-formation=Кусака-грузчик, специально обученный строить кусакопорты и обслуживать сундуки запроса.
biterport=Наземный аналог робопорта, работающий на кусаках. Вмещает до 8 кусак-грузчиков и стопку денег налогоплательщиков, после чего рассылает пеших рабочих на строительные и логистические задания в пределах своей зоны. В ночную смену для каждого выхода рабочего требуется вливать жидкий кофе в любую из четырёх боковых труб.
paperwork-provider-chest=Сундук пассивного снабжения на один слот для логистики кусак. Роботы тоже могут им пользоваться, но никто этого не оценит.
paperwork-storage-chest=Однослотовый сундук хранения для логистики кусак и вывозов на склад.
paperwork-requester-chest=Сундук запроса на один слот для логистики кусак.
rideable-biter=Ездовой кусака, переведённый на личный транспорт. Расходует деньги налогоплательщиков во время движения, почти не имеет багажника и не подлежит демонтажу после установки. Если оставить его без финансирования на 10 минут, он снова станет обычным кусакой и подаст жалобу.
union-delegate=Рабочий-кусака, обученный как представитель профсоюза. Без него не построить Штаб-квартиру профсоюза.
chemical-operator=Кусака, допущенный к работе с опасными материалами. Нужен для постройки химзаводов.
nuclear-technician=Кусака, прошедший подготовку специалиста-ядерщика. Нужен для постройки реакторов и центрифуг.
formation-center=Учебно-тренировочный комплекс 5x5 для переквалификации рабочих-кусак, обучения кусак-грузчиков и сертификации специалистов.
field-office=Временный бюрократический форпост. Вызывает кусак из ульев в радиусе 200 клеток — одного рабочего на производственный цикл. Работает только пока кусака на месте. Во время работы даёт нулевое загрязнение.
biter-station=Хранит рабочих-кусак и деньги налогоплательщиков, затем отправляет рабочих включать ближайшие обслуживаемые здания. Ночью отправки также требуют жидкий кофе через любой из четырёх боковых входов. Каждая обслуженная машина выполняет один производственный цикл и снова ждёт визита.
transit-authorization=Официальный проездной ордер (Форма 12-Т). Положите его в специальный ящик на станции. На каждое прибытие поезда списывается один ордер. Лимит поездов на станции равен количеству ордеров в ящике.
greenhouse=Климатически контролируемая теплица. Делает древесину из воды, а при должной сноровке — выращивает драгоценные кофейные зёрна.

pneumatic-pipe=Герметичная труба цвета канцелярской папки для перекачки разжиженного документооборота. НЕ подключается к трубам с обычными жидкостями.
pneumatic-pipe-to-ground=Подземная секция пневмотрубы для прокладки документов под зданиями. НЕ подключается к трубам с обычными жидкостями.
tube-intake=Принимает допустимые документы и мгновенно отправляет их по пневмосети. Загружайте документы напрямую манипуляторами или логистикой.
tube-outtake=Выдаёт документы из пневмосети. Чтобы забрать документы из приёмного лотка, используйте манипуляторы или логистику.
transit-permit-chest=Ящик, который автоматически ставится у каждой железнодорожной станции. Загружайте сюда проездные ордера — по одному на каждое прибытие поезда. Лимит поездов равен количеству ордеров внутри. Доступен для манипуляторов и логистики.

provisional-work-order=Сводный наряд-допуск для сборочного автомата на основе временного разрешения. Используется только в сборочных автоматах. Расходуется при использовании.
safety-work-order=Сводный наряд-допуск для рецептов с базовыми требованиями техники безопасности. Используется только в сборочных автоматах. Расходуется при использовании.
construction-work-order=Сводный строительный наряд-допуск для сборочных автоматов. Используется только в сборочных автоматах. Расходуется при использовании.
management-verbal-work-order=Сводный наряд-допуск, подкрепленный устным согласованием руководителя. Используется только в сборочных автоматах. Расходуется при использовании.
management-written-work-order=Сводный наряд-допуск, завизированный официальным письменным согласованием руководства. Используется только в сборочных автоматах. Расходуется при использовании.
research-grant-work-order=Сводный наряд-допуск на освоение исследовательского бюджета. Используется только в сборочных автоматах. Расходуется при использовании.
chemical-handling-work-order=Узкопрофильный наряд-допуск для химзаводов. Собирается из бумаг по экологии, ТБ и логистической документации. Расходуется при запуске химических рецептов.
radiological-work-order=Наряд-допуск высшей категории секретности для центрифуг. Собирается из химических бумаг и письменного согласования руководства. Расходуется при запуске рецептов центрифуги.

carbon-offset-certificate-basic=Базовый углеродный сертификат, разрешающий ограниченную промышленную плавку. Расходуется в рецептах пакетной плавки в печах.
carbon-offset-certificate-verified=Улучшенный углеродный сертификат с официальным заверением. Выдаётся через цепочку проверок на столе клерка для строительства стальных печей и продвинутой плавки.

work-order=Базовый наряд-допуск для регулируемых рецептов сборки. Используется только в сборочных автоматах и для создания нарядов-допусков более высокого уровня.
form-27b-6=Печально известная унифицированная форма заявки. Используется в транспортных накладных, отчётах о проверках и бюрократии высшего уровня.
safety-waiver=Бумага, снимающая с администрации фабрики любую ответственность по ТБ. Нужна для постройки Т1 зданий и создания тяжёлых нарядов-допусков.
environmental-impact-report=Исчерпывающая (хотя и густо замазанная чёрным маркером) оценка экологического ущерба. Нужна для получения нарядов-допусков на химические и радиологические работы.
management-approval-verbal=Устное согласование руководства. Технически имеет силу, но его легко отрицать. Для получения требуется жидкий кофе.
management-approval-written=Письменное согласование руководства, заверенное нотариально. Достать сложно, зато оспорить невозможно.
research-grant-approval=Базовое согласование исследовательского гранта. Требуется для всех исследовательских пакетов; космическая наука расходует доставленные с планеты согласования на административной космической станции.
provisional-approval=Бюрократическое согласование начального уровня. Нужно для каменных печей и твердотопливного оборудования. Ваш первый глоток избыточного щебня.

filing-l=Зарегистрированная в реестре жалоба на изуродованный ландшафт. Первый шаг к урегулированию претензий граждан к состоянию местности.
filing-s=Зарегистрированная в реестре жалоба на смог. Документирует возмущение граждан качеством воздуха.
filing-n=Зарегистрированная в реестре жалоба на шум. Фиксирует жалобы на грохот вашей инфраструктуры.
filing-u=Зарегистрированная жалоба на безработицу. Самое тяжкое обвинение: граждане жалуются на системный крах экономики.
filing-lt=Зарегистрированная жалоба на захламление. Плеваки недовольны тем, что вы везде оставляете лужи кислоты.
filing-h=Зарегистрированная жалоба на опасные материалы. Плеваки возмущены контактом с вредными веществами.
filing-lo=Зарегистрированная жалоба на праздношатание. Документирует недовольство плевак закрытием территорий.
filing-v=Зарегистрированная жалоба на бродяжничество. Самая тяжёлая жалоба плевак, обвиняющих вас в сносе жилья и вытеснении.

case-s=Подтверждённое дело по смогу. Доказательства буквально висят в воздухе, но всё равно нужны в трёх экземплярах.
case-n=Подтверждённое дело о нарушении тишины с приложенными замерами в децибелах. Как ни странно, перекладывание этих бумаг — самая громкая часть процесса.
case-u=Подтверждённое дело о системном экономическом крахе, собранное из такого количества макулатуры, что её хватило бы на трудоустройство целого отдела. Ирония заложена в самой структуре.
case-h=Подтверждённое дело об опасных материалах задокументировано так тщательно, что к самой папке нужно прикасаться только в химзащитном костюме.
case-lo=Подтверждённое дело о том, что стоять не в том месте — преследуемое нарушение. Прецедент притянут за уши, но дело сшито намертво.
case-v=Подтверждённое дело о бродяжничестве, заведённое той же самой системой, которая этот снос и санкционировала. Никто не обещал, что у бюрократии есть совесть.

brief-n=Реликт более консервативной правовой эпохи, когда дела о шуме доходили аж до Верховного суда. Оставлен для совместимости сохранений — ваши старые документы всё ещё действуют.
brief-u=Артефакт из тех времен, когда безработица требовала решения Верховного суда, а не просто толстой папки на столе. Оставлен для совместимости сохранений.
brief-lo=Привет из эпохи, когда праздношатание считалось делом государственной важности. Сейчас процедуру упростили. Оставлен для совместимости.
brief-v=Меморандум Верховного суда из прошлого, когда дела о бродяжничестве требовали высшей судебной инстанции страны. Оставлен для совместимости — архив всё помнит.

construction-permit=Разрешение на строительство. Идёт как ингредиент в большинство рецептов зданий и тяжёлых нарядов-допусков.

dubious-data=Продукт переработки бредоруды. Достоверность нулевая, но технически классифицируется как "информация". Основа экономики отговорок.
basic-excuse=Простая отговорка, собранная из сомнительных данных. Используется в урегулировании жалоб на ландшафт и бюрократических процессах низкого уровня.
crappy-report=Некачественный отчёт сомнительной точности. Фундамент всей документации высшего звена.
credentials=Должностные полномочия, произведённые из жидкой лжи, сомнительных данных и рафинированного абсурда. Служат доказательством власти, каким бы сомнительным ни был их источник.
data=Синтезируется из некачественных отчётов и должностных полномочий. Реальная, применимая на практике информация. Редчайший ресурс в этой администрации.
good-excuse=Веская отговорка, объединяющая реальные данные с жидкой ложью. Нужна для согласований на высшем уровне и формирования официальной версии.
justification=Формальное юридическое обоснование. Состоит из жидкой дезинформации, должностных полномочий и политической жидкости. Используется для списания нарушений ТБ.
narrative=Утверждённая версия событий. Составляется из официальных обоснований, веских отговорок и рафинированного абсурда. Управляет общественным восприятием вашей администрации.
white-paper=Авторитетный меморандум по вопросам политики, замешанный на фактах, жидкой лжи и казначейски обеспеченном абсурде. Фундамент государственной политики.
policy=Директива, подготовленная на бесконечных совещаниях. Требует меморандумов, жидкой дезинформации, данных и государственных грантов.
regulation=Федеральный регламент, рождённый в муках бюрократического процесса. Высшее проявление государственной власти.
promise=Пустое обещание в капсуле. Бросьте в бастующего кусаку, чтобы временно его успокоить.
eviction-notice=Легальное право сносить ульи кусак, спрессованное в удобную для броска капсулу. Применять с крайней осторожностью.
hush-money=Мешок денег налогоплательщиков, который бросают в ульи кусак, чтобы временно их успокоить. Приостанавливает появление кусак на 3 минуты. Отсутствие токсичности в зелёном дыме не гарантируется.
hired-biter-capsule=Чудовищный кусака с полномочиями полевого агента. Выпустите его, выделите приказом полевого агента и позвольте логистической сети пополнять запас предписаний о сносе, которые он будет вручать лично.
hired-biter-command-capsule=Приказ полевого агента. Щелчок левой кнопкой — выделить/снять выделение агентов. Щелчок правой кнопкой по карте — отправить в точку. Shift + щелчок правой кнопкой — задать маршрут патрулирования. Shift + щелчок правой кнопкой по сундуку с предписаниями — отправить агентов туда за пополнением.

resolved-landscape=Полностью закрытое дело по жалобе на ландшафт. Доказательство того, что система иногда работает.
resolved-smog=Полностью закрытое дело по жалобе на смог. Потребовало значительного объёма жидкой дезинформации и кофе.
resolved-noise=Полностью закрытое дело по жалобе на шум. Потребовало подтверждённого дела, пачки директив, кофе, утверждённых версий событий и должностных полномочий.
resolved-unemployment=Полностью закрытое дело по жалобе на безработицу. Вершина бюрократической мысли. Вы искоренили безработицу.
resolved-littering=Полностью закрытое дело по жалобе на захламление. Отныне лужи кислоты официально считаются элементами декоративного благоустройства.
resolved-hazmat=Полностью закрытое дело по жалобе на опасные материалы. Потребовало доказательств из уплотнённого щебня, жидкой дезинформации и кофе.
resolved-loitering=Полностью закрытое дело по жалобе на праздношатание. Потребовало подтверждённого дела, пачки регламентов, кофе, утверждённых версий событий и должностных полномочий.
resolved-vagrancy=Полностью закрытое дело по жалобе на бродяжничество. Высшее бюрократическое достижение плевак. Вы решили проблему бездомности.

ticket-landscape=Жалоба от рядового гражданина на вырубку лесов и снос скал. Подаётся малыми кусаками на приёмных стойках.
ticket-smog=Жалоба от гражданина на то, что нечем дышать. Подаётся средними и крупными кусаками.
ticket-noise=Жалоба от гражданина на то, что невозможно спать. Подаётся большими и более крупными кусаками.
ticket-unemployment=Жалоба от гражданина на безработицу. Подаётся исключительно чудовищными кусаками.
ticket-littering=Жалоба от плеваки на разбросанные лужи. Подаётся малыми плеваками на приёмных стойках.
ticket-hazmat=Жалоба от плеваки на химические ожоги. Подаётся средними и крупными плеваками.
ticket-loitering=Жалоба от плеваки на заборы и закрытые зоны. Подаётся большими и более крупными плеваками.
ticket-vagrancy=Жалоба от плеваки на незаконный снос ульев и вытеснение. Подаётся исключительно чудовищными плеваками.

printer-t1=Обычный офисный принтер. Медленный, но надёжный. Печатает документы, расходуя картриджи.
printer-t2=Высокоскоростной промышленный принтер с функцией ксерокса. На планетах требуется отправка рабочего из центра занятости кусак; на космических платформах постоянное бортовое разрешение поддерживает его работу.
mechanical-printer=Примитивный печатный станок с ручным приводом. Ваша основная рабочая лошадка до внедрения электричества.



speed-module=Юридическая угроза, заставляющая автоматы работать в панике. Счета за электричество — уже не ваша проблема. (+20% скорости, +50% энергии)
speed-module-2=Повестка переросла в коллективный иск. Машины лихорадочно работают, чтобы уложиться в нормативы. (+30% скорости, +70% энергии)
speed-module-3=Федеральная повестка, подкрепленная всей тяжестью судебной машины. Оборудование ещё никогда не работало так быстро и не обходилось так дорого. (+50% скорости, +100% энергии)
productivity-module=Внутренний аудит, выжимающий дополнительную выгоду из каждого цикла. Аудиторы работают тщательно, поэтому всё тормозит. (+4% продуктивности, -скорость, +энергия, +загрязнение)
productivity-module-2=Глубокая аудиторская проверка. Больше нарушений, больше накладных расходов, больше документов. (+6% продуктивности, -скорость, +энергия, +загрязнение)
productivity-module-3=Полномасштабное федеральное расследование. Выход продукции бьет рекорды, но мораль, скорость и счета за электричество пробивают дно. (+10% продуктивности, -скорость, +энергия, +загрязнение)
efficiency-module=Креативная бухгалтерия, списывающая энергозатраты за баланс. Никто не спрашивает, откуда взялась экономия. (-30% энергии)
efficiency-module-2=Продвинутые методы хищения средств. Бухгалтеры стали смелее. (-40% энергии)
efficiency-module-3=Настоящая финансовая пирамида в сфере учета энергии. Машины расходуют вдвое меньше, а аудиторы пока ничего не заметили. (-50% энергии)

corporate-breakroom=Место притяжения сотрудников, где кофе превращается в сплетни. Генерирует сплетни, отговорки и устные согласования. Работает только при наличии рабочего из [entity=biter-station].
osha-violation=Грубое нарушение техники безопасности, неизбежное при опасном производстве. Можно списать по бумагам или переработать через профсоюз.
watercooler-gossip=Неформальная информация, собранная у кулера. Критически важна для принятия корпоративных решений.
office-drama=Межличностный конфликт, возникающий как побочный продукт офисных сплетен. Можно переработать в комнате отдыха, получив случайные наряды-допуски, новые сплетни или дежурные отговорки.
orbital-employment-catapult=Система развёртывания персонала в форме рельсотрона. Запущенные добровольные шахтёры-исследователи прикрепляются к астероидам и работают раз в секунду, пока порода не отдаст весь доступный для сбора выход. Изначально на астероид назначается один шахтёр, исследования поднимают лимит до пяти. Каждый назначенный шахтёр затем возвращается в виде фрагмента, который нужно будет подобрать.
voluntary-exploration-space-miner=Хорошо подготовленный космонавт, оснащённый для добычи астероидов с помощью катапульты. Шахтёры прикрепляются к астероидам, выполняют работу, масштабируемую исследованиями, и возвращаются в виде собираемых фрагментов сотрудника после сбора.




unapproved-safety-waiver=Напечатанный отказ от ответственности по ТБ, ожидающий одобрения администрации кусак на Стойке приёма петиций.
unapproved-construction-permit=Напечатанное разрешение на строительство, ожидающее одобрения администрации кусак на Стойке приёма петиций.
notary-office=Премиальное сертификационное бюро для плотной непечатной бюрократии. Оформляет хартии, заверения, печати и резервную документацию на Вулканусе.
verdigris-crust=Медно-зелёная минеральная корка, встречающаяся на Вулканусе. Перерабатывайте её в циановую суспензию, хроматические чернила и местную сертификационную документацию.
charged-toner=Концентрат тонера Фульгоры, добытый из электростатических залежей или восстановленный из лома. Питает как восстановление архивов, так и цепочку пурпурных чернил.
transfer-emulsion=Криогенно стабильное связующее для тонера, производимое на Аквило. Используется для восстановления документов без жидких чернил.
thermal-transfer-sheet=Премиальный твёрдый носитель печати для Лазерного принтера. Ответ Аквило на канцелярию, питаемую жидкостью.
composite-chroma-ribbon=Высококачественный многоцветный носитель, собранный из импортированной CMY-документации и переносного материала Аквило.
old-archive=Сжатый пакет полуразборчивых записей, восстановленных из лома Фульгоры. Быстро перерабатывается в случайные стартовые бланки и ничего больше.
archive-recombination-bureau=Разновидность Рециклера, постоянно укомплектованная Релейным клерком. Вставьте один поддерживаемый бланк; три бланка замены того же ранга и цвета выбираются независимо с вероятностью 25% каждый.
heatproof-form-stock=Термостойкая заготовка бланков, адаптированная под промышленность Вулкануса. Местная замена бумаге для тяжёлых чёрных разрешений.
permit-draft=Циановая заготовка разрешения на Вулканусе, напечатанная на термостойком материале. Питает хартии, разрешения и резервные местные одобрения.
inspection-docket=Плотный пакет промышленной проверки, напечатанный для комплаенса эпохи литейных цехов и сертификационной работы.
embossed-seal=Премиальная нотариальная печать, тиснённая из вулканических материалов. Используется для заверения хартий и резервной документации запуска.
industrial-charter=Сертифицированный пакет промышленных операций для металлургии и тяжёлой инфраструктуры Вулкануса.
blank-cyan-form=Термостойкая циановая канцелярия, напечатанная на Вулканусе и расходуемая Нотариальным бюро для выдачи местной льготной документации.
mycelial-form-stock=Волокнистая заготовка канцелярии Глебы, напечатанная жёлтыми чернилами. Служит местной основой для компактной документации исключений планеты.
blank-yellow-form=Жёлтая административная заготовка Глебы. Печатается на Хроматическом принтере и дорабатывается в Бюро примирения в семейство компактных местных бланков.
signal-form-stock=Пурпурная заготовка бланков, подготовленная на Фульгоре для цифро-обработанных архивных и сигнальных бланков.
blank-magenta-form=Пурпурная административная заготовка Фульгоры. Печатается на Хроматическом принтере и дорабатывается в архивную и электромагнитную документацию.
cyan-yellow-form=Двухчернильный административный бланк, напечатанный напрямую циановыми и жёлтыми чернилами. Используется для парной бюрократии Вулканус-Глеба и других двухнаучных сокращений.
cyan-magenta-form=Двухчернильный административный бланк, напечатанный напрямую циановыми и пурпурными чернилами. Используется для парной бюрократии Вулканус-Фульгора.
yellow-magenta-form=Двухчернильный административный бланк, напечатанный напрямую жёлтыми и пурпурными чернилами. Используется для парной бюрократии Глеба-Фульгора и сокращений, богатых ломом.
symbiosis-record=Компактный документ биологического реестра, используемый там, где Глеба заменяет насыщенный документами наполнитель прямым учётом образцов.
conciliation-order=Документ авторизации Глебы, заменяющий отдельные согласования, богатые ложью или деньгами налогоплательщиков, прямой обработкой примирительных исключений.
archive-recovery-permit=Разрешение на восстановление Фульгоры, авторизующее лом-ориентированную реконструкцию разрушенной документации и архивных фрагментов.
digital-processing-certificate=Сертификат Фульгоры, авторизующий компьютеризированную административную пропускную способность и цифро-обработанные бланки.
electromagnetic-operating-license=Лицензия на эксплуатацию электромагнитной инфраструктуры Фульгоры и бюрократии, смежной с гольмием.
data-recovery-order=Насыщенный маршрутизацией наряд Фульгоры, используемый для реконструкции и восстановления архивированных административных данных.
hardened-data-vault=Пакет ответственного хранения Вулканус-Фульгора, термически запечатывающий восстановленные данные для поздних орбитальных авторизаций и авторизаций разрушенной планеты.
trichromatic-permit=Полное трёхцветное разрешение слияния, производимое на Аквило для рецептов, охватывающих все администрации первой волны Space Age.
unified-operations-charter=Итоговая межпланетная авторизация, собранная из высшего семейства документации каждой планеты: Вулканус, Глеба, Фульгора и Аквило.
cryogenic-operations-license=Лицензия Аквило на эксплуатацию лития, фторкетона и криогенной инфраструктуры, управляемой в условиях замёрзших чернил.
public-transportation-contract=Двухцветный транзитный контракт, объединяющий циановую документацию и жёлтые бланки в исключение общественной маршрутизации.
public-train-stop=Ванильная железнодорожная остановка, работающая без требований проездного ордера. Разверните её после достижения бюрократической трансценденции.
thermal-process-license=Лицензия на процесс, доступная только на Вулканусе, сертифицирующая высокотемпературную вольфрамовую металлургию.
calcite-reagent-waiver=Льгота, доступная только на Вулканусе, авторизующая внепланетное использование промышленной химии на основе кальцита.
offworld-metallurgy-charter=Экспортированная хартия Вулкануса, необходимая для запуска ключевых металлургических процессов вдали от Вулкануса.
capture-bureau=Полевое бюро Глебы, принимающее враждебную живность, обрабатывающее предложения о работе и питающее цикл кусак-работников.
petition-counter=Небольшой офисный прилавок для кусак, штампующий одобрения разрешений при наличии поблизости гнезда.
conciliation-desk=Специализированное бюро Глебы для доработки жёлтых бланков. Обрабатывает компактную документацию биологических исключений, не дублируя всю лестницу разрешений Нависа.
digital-services-bureau=Быстрый компьютеризированный офис, построенный на Фульгоре. Обрабатывает рутинную административную работу круглосуточно, без обычного ночного закрытия.
laser-printer=Скоростной принтер Аквило, использующий твёрдый носитель переноса вместо жидких чернил. Обрабатывает термолисты, ленточные заряды, многоцветные бланки и финальную печать в замёрзшем мире.
unapproved-radiological-work-order=Пакет радиологических операций, ожидающий одобрения администрации кусак на Стойке приёма петиций.
chromatic-printer=Печатная платформа, готовая к Space Age. Начинает как мост совместимости и позже расширяется до хроматической документации.
enrolled-biter=Кусака, подписавший ровно столько бланков, чтобы войти в бюрократию. Пока бесполезен без переквалификации рабочей силы.
worker-biter=Бюрократически оформленная единица рабочей силы кусак. Обучен на Нависе из зачисленного кусаки, полномочий и оправданий для укомплектования инфраструктуры Space Age.
clerical-trainee=Обученный кусака, направленный в канцелярскую ветвь. Готов к насыщенным документацией специализированным ролям.
management-trainee=Обученный кусака, направленный в руководящий театр. Питает переговорщиков, абсурдное руководство и другие роли высшего звена.
astronaut=Обученный орбитальный администратор, подготовленный для работы с документацией в вакууме, соответствия станции и других внепланетных нелепостей.
night-shift-supervisor=Обученный специалист рабочей силы для административного соответствия в нерабочие часы.
licensed-notary=Сертифицированный хартией специалист для литейных цехов, разрешений и формальной промышленной сертификации Вулкануса.
conciliation-officer=Специалист по посредничеству с биологическим допуском для биокамер, умиротворения и переназначения рабочей силы.
relay-clerk=Специалист по электромагнитной маршрутизации для инфраструктуры, сигнальной бюрократии и цифровых услуг.
cryoprint-technician=Криогенный технический специалист для холодной администрации и прецизионных процессов печати.
field-negotiator=Мобильный специалист по эскалации для подавления протестов, экспроприации и враждебного административного взаимодействия.
middle-management-managing-manager=Абсурдный менеджер верхнего звена, ничего не привносящий, пока достаточно недавнее совещание не сделает его присутствие обязательным. Брифованные менеджеры со временем забывают инструктаж и возвращаются к этой обычной форме.
training-briefed-middle-management-managing-manager=Недавно посетил совещание по обучению персонала. Требуется один раз соответствующими рецептами формирования, которые затем возвращают обычного менеджера. Инструктаж истекает через три минуты.
staffing-briefed-middle-management-managing-manager=Недавно посетил совещание по укомплектованию объектов. Требуется при строительстве, зависящем от сотрудников, несмотря на нулевую практическую пользу. Инструктаж истекает через три минуты.
compliance-briefed-middle-management-managing-manager=Недавно посетил совещание по нормативному соответствию. Требуется отдельными сертификациями и формированиями высшего уровня. Инструктаж истекает через три минуты.
liaison-briefed-middle-management-managing-manager=Недавно посетил совещание по межведомственной связи. Требуется везде, где два отдела иначе могли бы общаться напрямую. Инструктаж истекает через три минуты.
orbital-briefed-middle-management-managing-manager=Недавно посетил совещание по орбитальным операциям с одной общей единицей ракетного топлива. Требуется космической администрацией и продвинутым орбитальным формированием. Инструктаж истекает через три минуты.
returning-orbital-employee=Доброволец-шахтёр, застрявший в обломках астероида. Коллектор астероидов добывает его прямо в переиспользуемые боеприпасы ДШИ в свой выходной инвентарь; промахнуться — значит навсегда потерять сотрудника в космосе.
orbital-deviation-order=Дешёвая авторизация, получаемая из астероидов, на один устойчивый толчок наружу. Для более тяжёлых астероидов может потребоваться несколько перекрывающихся плановых приказов.
priority-orbital-deviation-order=Усиленная авторизация, напечатанная из продвинутых астероидных продуктов. Каждый приказ обеспечивает вдвое большую силу толчка, чем плановый.
orbital-operations-form=Локально возобновляемая документация платформы, напечатанная на угле-водяной бумаге ферроуглеродными чернилами. Используется для топлива, окислителя, обработки астероидов, туризма и рутинной орбитальной администрации.
asteroid-processing-docket=Локально напечатанная документация дробилки для продвинутой обработки астероидов. Не содержит наземного щебня, чепухи или расходуемого персонала.
orbital-infrastructure-permit=Авторизация строительства, специфичная для вакуума, для административной инфраструктуры космических платформ. Обычные наземные разрешения не имеют там юрисдикции — что, честно говоря, их первая разумная граница.
trajectory-compliance-array=Младший двигатель документации, авторизованный отталкивать мелкие и средние астероиды от платформы. Камни остаются видимыми и не дают лома; более тяжёлые цели реагируют медленнее.
senior-trajectory-compliance-array=Более широкий старший двигатель отклонения с достаточной межпланетной юрисдикцией для отталкивания крупных астероидов. Перекрывающиеся массивы и более быстрая документация создают более сильное устойчивое отклонение.
executive-trajectory-compliance-array=Неоспоримый исполнительный двигатель отклонения, допущенный отталкивать астероиды любого размера, включая огромные, несущие Администраториум, которые обычно требуют нескольких перекрывающихся толчков.

