[virtual-signal-description]
signal-complaint-l=Считает висящие жалобы на ландшафт. Самая базовая жалоба — если график ползет вверх, клерки не справляются.
signal-complaint-s=Отслеживает активные дела о смоге. Если цифра растёт, значит, ваша фабрика слишком сильно коптит.
signal-complaint-n=Следит за жалобами на шум. Скачет вверх, если вы лепите станки вплотную к ульям.
signal-complaint-u=Считает жалобы на безработицу. Их приносят только чудовищные кусаки — рост показателя означает, что эволюция обгоняет ваш бумажный конвейер.
signal-complaint-lt=Следит за жалобами плевак на лужи кислоты. Электорат недоволен мусором.
signal-complaint-h=Мониторит дела об опасных материалах. Рост означает, что ваша химия привлекает слишком много внимания.
signal-complaint-lo=Считает жалобы на праздношатание. Штрафы за нахождение в закрытых зонах бьют рекорды.
signal-complaint-v=Отслеживает жалобы на бродяжничество — высшая стадия возмущения плевак. Если цифра поползла вверх, срочно расширяйте штат юристов.
signal-available-slots=Показывает, сколько свободных мест осталось в подключенных приёмных. Когда цифра падаёт до нуля, начинаются забастовки.
signal-total-waiting=Сколько кусак сейчас стоит в очереди. Чем выше это число, тем ближе ваш грандиозный провал.

