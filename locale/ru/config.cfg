[item-description]
bullshit-ore=Природное месторождение чистой, неочищенной чепухи. Основа всей бюрократической экономики. Добудьте, переработайте, превратите в оружие.
redundant-rubble=Минерализованные отходы, образовавшиеся в результате чрезмерного процедурного надзора. Совершенно бесполезны сами по себе, но юридически обязательны для скрепления официальных документов.
compacted-rubble=Промышленно спрессованные бюрократические отходы, сертифицированные для применения. Производится из избыточного щебня путём регламентированной плавки с сертификатом углеродного компенсирования.
useless-documentation=Избыточный щебень, тщательно обёрнутый слоями бумаги. Официально задокументированная бесполезность. Необходима для стандартизированной подачи и финансовых инструментов.
refined-nonsense=Чистый, концентрированный бюрократический абсурд. Создаётся путём сплавления спрессованного щебня с жидкой дезинформацией в Пропагандном Перегонном Заводе. Основа процессов высшего административного уровня.
paper=Стандартный бюрократический субстрат. Производится из дерева или синтезируется из пластика. Применяется для всего: от чистых бланков до краткого изложения для верховного суда.
coffee-bean=Редкий и драгоценный товар. Обнаруживается при просеивании компоста. Жизненная сила любой функционирующей бюрократии.
ink=Сырая писчая жидкость, извлечённая из угля. Может использоваться для рукописных документов или перерабатываться в картриджи.
blank-form=Пустой административный бланк, ожидающий своего предназначения. Чистый холст бюрократии. Используется практически в каждом рецепте делопроизводства.
blank-approval=Готовый шаблон согласования, требующий финальной подписи официальными чернилами. Используется для актов об отказе от ответственности, разрешений на строительство и транзитных разрешений.
blank-directive=Высокозащищённый шаблон директивы с тройным нанесением чернил. Необходим для согласований уровня руководства.
safety-waiver-draft=Неоконченный акт об отказе от ответственности, ожидающий верификации принтером и печати чернилами.
construction-permit-draft=Неоконченное разрешение на строительство, ожидающее верификации принтером и печати чернилами.
management-verbal-draft=Черновик устного согласования, извлечённый из разговора в комнате отдыха. Требует окончательной обработки на принтере.
management-written-proposal=Предложение руководства, подготовленное исполнительным комитетом штаб-квартиры профсоюза. Требует одного полноценного прогона через тяжёлый принтер.
admin-station=Стол интерфейса жуков. Встроенная зона ожидания показывает, где стоят жуки в очереди; помещайте обратно сюда урегулированные предметы для их удовлетворения. Только хранение — никакого крафта.
resolution-office=Специализированный офис для обработки жалоб. Обрабатывает подачи, делопроизводство и окончательные решения.
office-desk=Многофункциональная рабочая станция для бланков, наборов науки, финансовых документов и общих административных задач. Работает в дневное время, если не оснащён [item=overtime-exemption].
office-desk-no-working-hours=Многофункциональная рабочая станция для бланков, наборов науки, финансовых документов и общих административных задач.
union-headquarters=Обширный комплекс, где согласовывается одобрение рабочей силы и ведётся работа над политикой позднего этапа. Первый экземпляр загружается с помощью государственных облигаций и устных документов, затем занимается грантами, письменными согласованиями, аудитами и разработкой политики. Закрывается на ночь, если не оснащён [item=overtime-exemption].
union-headquarters-no-working-hours=Обширный комплекс, где согласовывается одобрение рабочей силы и ведётся работа над политикой позднего этапа. Первый экземпляр загружается с помощью государственных облигаций и устных документов, затем занимается грантами, письменными согласованиями, аудитами и разработкой политики.
propaganda-distillery=Специализированное предприятие по переработке административных жидкостей. Перерабатывает флюид политиканства в жидкую ложь, синтезирует дезинформацию и производит удостоверения.
administrative-science-pack=Серый научный набор. Питает административные исследования. Изготавливается на Административном Рабочем Столе.
taxpayer-money=Честно заработанная валюта, извлечённая из урегулированных жалоб жуков. Основной источник финансирования государственных операций.
treasury-bond=Финансовый инструмент, обеспеченный государством. Сочетает деньги налогоплательщиков с бесполезной документацией. Используется в строительстве высшего уровня и политике.
government-grant=Значительное выделение государственных средств. Используется для работы над политикой позднего этапа, делопроизводством по сложным жалобам и другой бюрократией высшего уровня.
transit-authorization=Официальный дорожный документ (Форма 12-Т). Поместите в сундук транзитных разрешений на остановке поезда. Одна форма расходуется при каждом прибытии — лимит поездов станции равен количеству форм в сундуке.
greenhouse=Климатически контролируемое сооружение для выращивания растений. Производит дерево из воды, а при правильных условиях — редкие кофейные зёрна.
pneumatic-pipe=Запечатанная труба манильского цвета для транспортировки бумажных форм. НЕ подключается к обычным трубам для жидкостей.
pneumatic-pipe-to-ground=Подземная пневматическая труба для прокладки маршрутов под зданиями. НЕ подключается к обычным трубам для жидкостей.
tube-intake=Принимает действительные бумажные предметы для мгновенной пневматической транспортировки. Размещайте предметы рядом; скрытый манипулятор автоматически подаёт их на приёмник.
tube-outtake=Выдаёт бумажные предметы из пневматической сигнальной сети. Используйте собственный манипулятор или логистику для извлечения предметов из выходного сундука.
transit-permit-chest=Сундук, автоматически размещаемый на остановках поезда. Загружайте сюда транзитные разрешения — одно расходуется при каждом прибытии поезда. Лимит поездов станции равен количеству форм. Доступен для манипуляторов и логистики.
safety-work-order=Комбинированное разрешение для сборщика для регламентированного крафта уровня безопасности. Используется только сборочными машинами. Расходуется при использовании.
construction-work-order=Комбинированное разрешение для сборщика для регламентированного крафта уровня строительства. Используется только сборочными машинами. Расходуется при использовании.
management-verbal-work-order=Комбинированное разрешение для сборщика, подкреплённое устным обещанием руководителя. Используется только сборочными машинами. Расходуется при использовании.
management-written-work-order=Комбинированное разрешение для сборщика, подкреплённое подписанной директивой руководства. Используется только сборочными машинами. Расходуется при использовании.
research-grant-work-order=Комбинированное разрешение для сборщика для производства научных исследований. Используется только сборочными машинами. Расходуется при использовании.
chemical-handling-work-order=Специализированный эксплуатационный наряд для химических заводов и обработки на продвинутых нефтеперегонных установках. Создаётся из нефтехимического разрешения, Формы 27Б-6 и необходимого оборудования. Расходуется рецептами химии высшего уровня, продвинутой переработки нефти и сжижения угля.
radiological-work-order=Высокозащищённый эксплуатационный наряд для центрифуг и радиологической обработки. Создаётся из химических документов и письменного согласования руководства. Расходуется рецептами центрифугирования.
carbon-offset-certificate-basic=Базовый сертификат, разрешающий ограниченную промышленную плавку. Расходуется при партийной плавке в печах.
carbon-offset-certificate-verified=Улучшенный сертификат с официальной верификацией. Выдаётся через цепочку соответствия рабочего стола для строительства стальных печей и продвинутой плавки.
work-order=Базовое рабочее разрешение сборщика для регламентированных рецептов крафта. Используется только сборочными машинами и для сборки документов сборщиков высшего уровня.
form-27b-6=Печально известная стандартизированная форма заявки. Используется в транспортных документах, отчётах о соответствии и бюрократии высшего уровня.
safety-waiver=Документ, освобождающий администрацию от всякой ответственности. Необходим для строительства объектов T1 и сборки более тяжёлых эксплуатационных разрешений.
environmental-impact-report=Всестороннее (хотя и сильно отредактированное) оценочное исследование экологического ущерба. Используется для выдачи нефтехимических и радиологических эксплуатационных документов.
management-approval-verbal=Устное согласие руководителя, технически обязывающее, но легко отрицаемое. Для получения необходим кофе.
management-approval-written=Подписанное, нотариально заверенное обязательство руководства. Значительно сложнее получить, но невозможно отрицать.
research-grant-approval=Базовое разрешение на исследовательский грант. Необходимо для производства всех научных наборов. Простое, но незаменимое.
petrochemical-operating-permit=Специализированное разрешение на эксплуатацию для базовой переработки нефти и простой нефтехимии. Создаётся из документов по безопасности и охране окружающей среды. Расходуется рецептами базовой переработки нефти, твёрдого топлива, пластика, серы и серной кислоты.
provisional-approval=Базовый бюрократический допуск начального уровня. Необходим для каменных печей и горелочного оборудования. Ваш первый вкус избыточного щебня.
filing-l=Официально поданная жалоба на пейзаж. Первый шаг в урегулировании претензии гражданина относительно местных видов.
filing-s=Официально поданная жалоба на смог. Документирует возражение гражданина против промышленного загрязнения воздуха.
filing-n=Официально поданная жалоба на шум. Фиксирует претензию гражданина по поводу шумовых помех от вашей инфраструктуры.
filing-u=Официально поданная жалоба на безработицу. Наиболее серьёзная гражданская претензия, утверждающая системный экономический сбой.
filing-lt=Официально поданная жалоба на мусор. Документирует возражение плевалки против кислотных луж, оставленных повсюду.
filing-h=Официально поданная жалоба на опасные вещества. Фиксирует претензию плевалки по поводу воздействия опасных материалов.
filing-lo=Официально поданная жалоба на бродяжничество. Документирует возражение плевалки против нарушений в ограниченных зонах.
filing-v=Официально поданная жалоба на бездомность. Наиболее серьёзная претензия плевалки, утверждающая перемещение и бездомность.
case-s=Подтверждённое судебное дело по нарушению режима смога.
case-n=Подтверждённое судебное дело по нарушению режима шума.
case-u=Подтверждённое судебное дело по безработице.
case-h=Подтверждённое судебное дело по нарушению режима опасных веществ.
case-lo=Подтверждённое судебное дело по нарушению режима бродяжничества.
case-v=Подтверждённое судебное дело по бездомности.
brief-n=Устаревшее краткое изложение для верховного суда из прежней системы жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-u=Устаревшее краткое изложение для верховного суда из прежней системы жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-lo=Устаревшее краткое изложение для верховного суда из прежней системы жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-v=Устаревшее краткое изложение для верховного суда из прежней системы жалоб. Сохраняется только для совместимости с существующими сохранениями.
construction-permit=Стандартное строительное разрешение. Необходимо как ингредиент в большинстве строительных рецептов и в более тяжёлых эксплуатационных разрешениях.
dubious-data=Переработанные из руды чепухи. Ненадёжные, но технически считаются информацией. Основа экономики отмазок.
basic-excuse=Простое обоснование, собранное из сомнительных данных. Используется в урегулировании пейзажных дел и бюрократических процессах низшего уровня.
crappy-report=Наспех составленный отчёт сомнительной точности. Основа для документации всех уровней.
credentials=Официальные удостоверения, произведённые из жидкой лжи, сомнительных данных и очищенного абсурда. Доказательство полномочий, сколь бы сомнительным ни был их источник.
data=Синтезированы из скверных отчётов и удостоверений. Реально пригодная информация. Редкость в этой администрации.
good-excuse=Тщательно проработанное обоснование, сочетающее реальные данные с жидкой ложью. Используется в согласованиях высшего уровня и создании нарратива.
justification=Официальное правовое обоснование, созданное из дезинформации, удостоверений и флюида политиканства. Используется при избавлении от нарушений охраны труда.
narrative=Официальная версия событий, сотканная из обоснований, убедительных отмазок и очищенного абсурда. Управляет общественным восприятием вашей администрации.
white-paper=Авторитетный политический документ, сочетающий данные, ложь и облигационную чепуху. Основа государственной политики.
policy=Директива, разработанная на бесконечных совещаниях. Требует белых книг, дезинформации, данных и правительственных грантов.
regulation=Федеральный регламент, разработанный посредством изнурительного бюрократического процесса. Высшее выражение государственной власти.
promise=Бросаемая капсула с бюрократическим обещанием. Бросьте в протестующего жука, чтобы временно его успокоить.
eviction-notice=Бросаемая капсула, уничтожающая постройки жуков. Применяйте с крайней осторожностью.
hush-money=Пакет с деньгами налогоплательщиков, брошенный в логово жуков, чтобы заткнуть им рот. Предотвращает появление новых особей на 3 минуты. Зелёный дым не гарантированно нетоксичен.
resolved-landscape=Полностью урегулированное дело о пейзаже. Доказательство того, что система работает (иногда).
resolved-smog=Полностью урегулированное дело о смоге. Потребовало значительной дезинформации и кофе.
resolved-noise=Полностью урегулированное дело о шуме. Потребовало подтверждённого дела, стека директив, кофе, нарративов и удостоверений.
resolved-unemployment=Полностью урегулированное дело о безработице. Вершина бюрократических достижений. Вы решили проблему безработицы.
resolved-littering=Полностью урегулированное дело о мусоре. Кислотные лужи официально переквалифицированы в декоративные элементы.
resolved-hazmat=Полностью урегулированное дело об опасных веществах. Потребовало спрессованного щебня в качестве улик, дезинформации и кофе.
resolved-loitering=Полностью урегулированное дело о бродяжничестве. Потребовало подтверждённого дела, регламентов, кофе, нарративов и удостоверений.
resolved-vagrancy=Полностью урегулированное дело о бездомности. Высшее бюрократическое достижение для плевалок. Вы решили проблему бездомности.
ticket-landscape=Гражданская жалоба на разрушение пейзажа. Генерируется маленькими жуками у столов администрации.
ticket-smog=Гражданская жалоба на загрязнение воздуха. Генерируется средними и более крупными жуками.
ticket-noise=Гражданская жалоба на шумовое загрязнение. Генерируется большими и более крупными жуками.
ticket-unemployment=Гражданская жалоба на безработицу. Генерируется только жуками-бегемотами.
ticket-littering=Жалоба плевалки на загрязнение кислотными лужами. Генерируется маленькими плевалками у столов администрации.
ticket-hazmat=Жалоба плевалки на воздействие опасных материалов. Генерируется средними и более крупными плевалками.
ticket-loitering=Жалоба плевалки на нарушения в ограниченных зонах. Генерируется большими и более крупными плевалками.
ticket-vagrancy=Жалоба плевалки на перемещение и бездомность. Генерируется только плевалками-бегемотами.
printer-t1=Базовый электрический принтер. Медленный, но надёжный. Производит печатные документы из картриджей с чернилами.
printer-t2=Высокоскоростной промышленный принтер с режимом копирования. Может дублировать документы: 1 оригинал даёт 6 копий.
mechanical-printer=Принтер с ручным приводом. Ваш основной инструмент до открытия электрической печати.
speed-module=Ускоряет скорость крафта машины на 20% ценой 50% дополнительного потребления энергии.
speed-module-2=Ускоряет скорость крафта машины на 30% ценой 70% дополнительного потребления энергии.
speed-module-3=Ускоряет скорость крафта машины на 50% ценой 100% дополнительного потребления энергии.
productivity-module=Даёт бонус к производительности 4%. Замедляет машины и увеличивает потребление энергии и загрязнение.
productivity-module-2=Даёт бонус к производительности 6%. Замедляет машины и увеличивает потребление энергии и загрязнение.
productivity-module-3=Даёт бонус к производительности 10%. Замедляет машины и увеличивает потребление энергии и загрязнение.
efficiency-module=Снижает потребление энергии на 30%.
efficiency-module-2=Снижает потребление энергии на 40%.
efficiency-module-3=Снижает потребление энергии на 50%.
corporate-breakroom=Социальный центр, где кофе питает мельницу слухов. Производит сплетни у кулера, убедительные отмазки и черновики устных согласований руководства. Закрывается на ночь, если не оснащён [item=overtime-exemption].
osha-violation=Нарушение охраны труда, возникающее в результате опасной промышленной обработки. Можно устранить или переработать через штаб-квартиру профсоюза.
watercooler-gossip=Неформальная информация, собранная у кулера с водой. Необходима для принятия корпоративных решений.
office-drama=Межличностный конфликт, возникающий как побочный продукт офисных сплетен. Можно переработать в комнате отдыха в случайные наряды на работу, сплетни и базовые отмазки.

