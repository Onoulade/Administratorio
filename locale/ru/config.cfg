[technology-description]
discovery-bullshit=Вы её нашли. Теперь вам просто нужно очистить её в действительный аргумент. Открывает очистку сомнительных данных, производство базовых отговорок, первую документацию по отказу от претензий по безопасности и разрешению на строительство, и базовые решения по ландшафту.
discovery-redundant-rubble=Прикосновение к местной геологии немедленно похоронило вас под лавиной избыточных требований. Открывает предварительные одобрения, бюрократические обещания, первые заявки по ландшафту и горелочный буровой станок.
administrative-science-research=Формализация системы обработки жалоб в воспроизводимую науку. Открывает наборы серой административной науки.
printing-technology=Механизированное производство документов. Открывает базовый принтер, стойку администрирования и офис решений, как только обе начальные технологии открытия установлены.
administrative-bureaucracy=Выращивайте возобновляемое дерево в контролируемых тепличных условиях. Открывает теплицу и производство дерева.
admin-station-capacity=Расширьте зону ожидания каждой стойки администрирования на одно дополнительное место.
rubble-compaction=Сжимайте избыточный щебень в стандартизированный строительный материал для последующей инфраструктуры. Открывает производство спрессованного щебня.
littering-resolution=Формализуйте процедуры обработки жалоб на незаконный сброс. Открывает дрянные отчёты, подачу жалоб на загрязнение и решение жалоб на загрязнение.
industrial-printing=Масштабируйте пропускную способность документации за пределы одного электрического принтера с инфраструктурой химической эры. Открывает промышленный принтер плюс рецепты массового копирования для чистых бланков, чистых бланков одобрения, углеродных сертификатов, формы 27Б-6, отчётов о воздействии на окружающую среду и чистых бланков директивы.
local-precedents=Стандартизируйте юридические шаблоны, лежащие в основе ж/д и документации соответствия. Открывает бесполезную документацию и форму 27Б-6.
nest-pacification=Формализуйте подкуп враждебной фауны в многоразовую административную процедуру. Открывает деньги за молчание для временного заглушения спавна гнёзд кусачей на 3 минуты.
streamlined-work-orders=Печатайте рабочие наряды напрямую из черновиков, минуя промежуточные этапы одобрения. Открывает прямую печать из черновика в рабочий наряд на электрических принтерах, производя 2 рабочих наряда за крафт.
office-agriculture=Индустриализируйте офисные поставки кофе сверх собирательства. Открывает кофейные плантации.
charcoal-production=Формализуйте регулируемое возобновляемое производство угля из тепличного дерева. Открывает производство древесного угля.
industrial-propaganda=Используйте дезинформацию как оружие в промышленных масштабах. Открывает пропагандистскую перегонную, очистку политической жидкости, дезинформацию, очищенную бессмыслицу и официальные полномочия.
corporate-hospitality=Превратите кофе и офисные слухи в полезный моральный дух. Открывает обнаружение кофе, корпоративную комнату отдыха, очистку кофе, сплетни у кулера и переработку офисной драмы.
information-management=Обрабатывайте сплетни и полномочия в действенные бумажные следы. Открывает синтез данных и хорошие отговорки.
verbal-approvals=Формализуйте устное обещание менеджера в многоразовую документацию. Открывает чистые бланки директивы, копирование директив и устные управленческие одобрения.
environmental-compliance=Разрешите нефтяную экономику посредством должным образом задокументированного экологического театра. Открывает отчёты о воздействии на окружающую среду, рабочие наряды по обращению с химикатами и заверенные углеродные сертификаты.
smog-abatement=Формализуйте цепь жалоб на загрязнение воздуха. Открывает подачу жалоб на смог, делопроизводство и окончательное решение.
hazmat-response=Формализуйте цепь жалоб на опасные материалы. Открывает подачу жалоб на опасные вещества, делопроизводство и окончательное решение.
nest-expropriation=Завоюйте территорию посредством силы, подкреплённой документацией. Открывает уведомления о выселении для очистки гнёзд кусачей.
synthetic-stationery=Формализуйте производство канцтоваров на основе нефти. Открывает синтетическую бумагу, изготовленную из пластика, серы и воды для высокопроизводительной поставки документации.
public-finance=Внесите казначейство и профсоюзы в бюрократию. Открывает казначейские облигации, штаб-квартиру профсоюза, профсоюзные одобрения и государственные гранты.
health-and-safety=Превратите профсоюзное влияние в регуляторный театр. Открывает очистку от нарушений охраны труда, обоснования и производство нарративов.
board-meetings=Расширьте штаб-квартиру профсоюза до этажа исполнительного комитета. Открывает письменные управленческие предложения и одобрения без добавления ещё одного выделенного здания.
executive-review=Эскалируйте бюрократию до подписанных директив. Открывает письменные управленческие рабочие наряды для самых тяжёлых регулируемых проектов.
radiological-compliance=Эскалируйте процессуальную документацию до ядерной территории. Открывает радиологические рабочие наряды для центрифуг и обработки урана.
eminent-domain-zoning=Составьте политические леса для масштабного расширения. Открывает белые книги, директивы политики и чёрные кассы.
work-order-duplication=Стандартизируйте промышленное копирование завершённых разрешений. Открывает массовое дублирование для каждого семейства рабочих нарядов на промышленном принтере, от базовых бланков сборщиков до радиологической операционной документации.
federal-regulation=Превратите политику в принудительный федеральный текст. Открывает составление предписаний.
noise-ordinances=Формализуйте цепь жалоб на шум. Открывает подачу жалоб на шум, делопроизводство и окончательное решение.
loitering-ordinances=Формализуйте цепь жалоб на праздношатание. Открывает подачу жалоб на праздношатание, делопроизводство и окончательное решение.
creative-accounting=Стандартизируйте переклассификацию чёрных касс в официальный доход. Открывает налоговый аудит.
constitutional-law=Финальный уровень жалоб кусачей. Открывает подачу жалоб на безработицу, делопроизводство и окончательное решение на стадии производственной науки.
vagrancy-ordinances=Финальный уровень жалоб плеваков. Открывает подачу жалоб на бродяжничество, делопроизводство и окончательное решение на стадии утилитарной науки.
filing-cabinet-logistics-1=Стандартизируйте офисную логистику подачи документов. Увеличивает количество слотов личных логистических запросов и мусора.
filing-cabinet-logistics-2=Расширяйте среднеуровневую канцелярскую пропускную способность логистики. Дополнительно увеличивает количество слотов личных логистических запросов и мусора.
filing-cabinet-logistics-3=Полностью централизуйте процессы логистической подачи документов. Дополнительно увеличивает количество слотов личных логистических запросов и мусора.
after-hours-operations=Стандартизируйте легальные ночные смены для административного аппарата. Открывает модуль [item=overtime-exemption] разрешения на сверхурочные, чтобы ключевые офисные здания могли оставаться открытыми ночью.
pneumatic-form-transport=Маршрутизируйте документацию через запечатанные пневматические трубы. Открывает приёмники пневмопочты, выдачи пневмопочты и пневматические трубы. Приёмники принимают только действительные предметы документации, и пневматические трубы не соединяются с обычной жидкостной инфраструктурой.
pneumatic-capacity=Увеличьте количество предметов документации, которые каждая пневматическая сеть может удерживать в транзите.
pneumatic-capacity-1=Укрепите соединения труб для обработки большего количества одновременных бланков. Увеличивает вместимость трубопроводной сети на 10.
pneumatic-capacity-2=Установите регуляторы давления для пневматической доставки с более высокой пропускной способностью. Увеличивает вместимость трубопроводной сети на 30.
pneumatic-capacity-3=Полная промышленная пневматическая инфраструктура. Увеличивает вместимость трубопроводной сети на 50.
biter-employment=Учредите официальную программу трудоустройства для решённых кусачей. Открывает предложения о работе, полный административный офисный стол и офис решений. Требует только бумажную волокиту и административную науку.
biter-employment-office=Откройте официальную биржу труда кусачей для отправки рабочих в промышленные здания. Открывает здание Биржи труда кусачей.
rideable-biter=Авторизуйте личный транспорт через назначения кусачей под надзором. Открывает Ездового кусача.
automobilism=Восстановите обычный одобренный государством автомобильный транспорт. Открывает ванильный автомобиль на стадии утилитарной науки.
biter-labor-efficiency=Увеличьте количество управляемых машин, которые отправленный рабочий кусач может авторизовать за один поход.
biter-labor-efficiency-1=Улучшенные протоколы маршрутизации позволяют каждому отправленному рабочему кусачу посещать до 3 управляемых машин за поход вместо 1. Каждая посещённая машина активируется на один цикл крафта перед следующим визитом.
biter-labor-efficiency-2=Продвинутые протоколы эффективности дополнительно увеличивают пропускную способность отправки до 5 посещений управляемых машин за поход рабочего.
biterport-logistics=Открывает инфраструктуру кусачепортов, обучение логистических рабочих кусачей и все варианты логистических сундуков для сетей, обслуживаемых кусачами.
biterport-transport-capacity=Увеличьте количество предметов, которые каждый логистический кусач может перенести за один поход к кусачепорту.
biterport-transport-capacity-1=Формализуйте первые логистические манифесты. Каждый логистический кусач может перевозить 2 предмета за поход.
biterport-transport-capacity-2=Улучшите седельные сумки кусачей и зажимы для документов. Каждый логистический кусач может перевозить 5 предметов за поход.
biterport-transport-capacity-3=Стандартизируйте массовую обработку для среднемасштабной логистики. Каждый логистический кусач может перевозить 10 предметов за поход.
biterport-transport-capacity-4=Выдайте усиленную транспортную упряжь для крупных перевозок. Каждый логистический кусач может перевозить 25 предметов за поход.
biterport-worker-speed=Увеличьте скорость движения логистических рабочих, отправленных из кусачепортов.
biterport-worker-speed-1=Отправляет более быстрых логистических рабочих из кусачепортов на строительные и логистические работы.
biterport-worker-speed-2=Отправляет ещё более быстрых логистических рабочих из кусачепортов на строительные и логистические работы.
formation-center=Постройте специализированное учебное заведение Центр подготовки. Требуется до того, как любая профессия кусача может быть обучена. Открывает здание Центра подготовки.
union-delegate-training=Сертифицируйте рабочих кусачей как профсоюзных делегатов. Открывает обучение профсоюзных делегатов в Центре подготовки.
chemical-operator-training=Сертифицируйте рабочих кусачей для строительства химических заводов и обращения с опасными материалами. Открывает обучение химических операторов в Центре подготовки.
nuclear-technician-training=Сертифицируйте рабочих кусачей как лицензированных ядерных техников для операций с реакторами. Открывает обучение ядерных техников в Центре подготовки.
hired-biter-fieldwork=Авторизуйте пилотную программу автономных полевых агентов по выселению. Обучите одного бегемотового кусача с полными юридическими полномочиями для самостоятельного поиска и вручения уведомлений о выселении вражеским гнёздам. Чрезвычайно дорого. Чрезвычайно эффективно.

