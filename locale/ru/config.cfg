paper-pusher=Производите 1000 Чистых Бланков в час. Деревья погибли не зря.
safety-first=Исследуйте Производство Дерева. OSHA была бы горда. Если бы OSHA здесь существовала.
capsule-promise=Используйте Капсулу Обещания. Обещание — это утешение для дурака.
its-a-copy-of-a-copy=Исследуйте Местные Прецеденты. Каким-то образом копия официальнее оригинала.
permit-denied=Постройте 10 остановок поезда. Ни один поезд не движется без бумажной работы.
coffee-break=Постройте Корпоративную Комнату Отдыха. Наконец-то, самое важное здание.
pneumatic-delivery=Исследуйте Пневматическую Транспортировку Форм. Вжух! Формы через трубы. Что за время наступило.
propaganda-machine=Постройте Пропагандный Перегонный Завод. Производим согласие, по одной бочке за раз.
endless-meetings=Исследуйте Заседания Совета Директоров. Это всё ещё могло быть письмом.
union-strong=Постройте Штаб-квартиру Профсоюза. Рабочие организовались. Руководство обеспокоено.
environmental-compliance-achievement=Исследуйте Экологическое Соответствие. Нефтяная и химическая экономика теперь может продолжаться под соответствующей бумажной работой.
constitutional-scholar=Исследуйте Конституционное Право. Вы прочитали каждый регламент. Все до единого.
know-it-all=Исследуйте все технологии. Поздравляем, вы сверхквалифицированы.
eviction-notice-achievement=Используйте 100 Уведомлений о Выселении. Ничего личного, это просто политика.
mass-transit=Пусть поезд проедет более 2000 клеток. Каждая остановка требует собственного транзитного разрешения.
first-complaint=Зарегистрируйте своего первого жука в столе администрации. У них есть претензии.
case-closed=Урегулируйте свою первую жалобу жука. Одна готова, бесконечность в очереди.
protest-suppressed=Успокойте протестующего жука с помощью обещания. Жук усмирён расплывчатыми заверениями.
department-of-everything=Имейте 10 столов администрации одновременно под питанием. Бюрократия расширяется, чтобы соответствовать потребностям расширяющейся бюрократии.
full-resolution=Урегулируйте хотя бы одну жалобу каждого из 8 видов. Жалоба на каждый случай жизни.
behemoth-paperwork=Зарегистрируйте жука-бегемота в столе администрации. Это... очень много форм.
