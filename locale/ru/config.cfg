[fluid-description]
politician-fluid=Вязкая, дурно пахнущая жидкость, добываемая из природных разломов. Отправьте её в Перегонный цех, чтобы получить жидкую ложь.
lie=Дистиллированный обман в жидком виде. Базовый ингредиент для создания жидкой дезинформации, веских отговорок, аналитических записок и пополнения чёрной кассы.
misinformation=Жидкая дезинформация оружейного класса. Синтезируется из жидкой лжи и сомнительных данных. Идёт на официальные обоснования и выпуск управленческих директив.
union-approval=Жидкое согласование рабочей силы. Согласовывается в штабе профсоюза за жидкий кофе, бумагу, данные и деньги налогоплательщиков.
liquid-coffee=Сваренный жидкий кофе. Универсальная смазка бюрократического аппарата. Без него не будет ни согласований, ни сплетен, ни закрытых дел.
slush-fund=Отмытые бюджетные средства в агрегатном состоянии жидкости. Перегоняются из казначейских облигаций и жидкой лжи через цеха пропаганды.

