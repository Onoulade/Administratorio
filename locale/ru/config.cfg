[entity-description]
bullshit-ore=Богатое месторождение природной чуши. Добывайте, чтобы получить сырую руду чуши для бюрократической экономики.
politician-fluid=Подземная трещина под давлением, наполненная политической эссенцией. Извлекайте насосной станцией, чтобы получить политическую жидкость.
redundant-rubble=Геологическое месторождение минерализованного надзора. Добывайте, чтобы получить избыточный щебень для обязательных официальных документов.
office-desk=Объединённое рабочее место для подачи документов, поставок и базовых административных задач. Закрывается ночью, если не оснащено [item=overtime-exemption].
field-office=Призывает кусачей из гнёзд в радиусе 100 клеток как рабочих «один на крафт». Работает только пока кусач на месте — нулевое загрязнение во время работы. Закрывается ночью, если не оснащён [item=overtime-exemption].
biter-station=Параллельно отправляет нескольких рабочих кусачей для активации ближайших управляемых зданий. Каждая активированная машина выполняет один крафт, затем ждёт следующего визита. Ночью каждая отправка также потребляет жидкий кофе из любого из четырёх боковых трубопроводных входов.
biterport=Хранит до 8 логистических рабочих кусачей и финансирование налогоплательщиков. Соединённые кусачепорты образуют пешеходную строительно-логистическую сеть с ванильными зонами строительства и логистики робопорта: кусачи могут строить призраков и перемещать предметы из сундуков запросов внутри зоны кусачепорта, в то время как обычные роботы могут по-прежнему использовать перекрывающуюся область родного робопорта. Возвращённые рабочие отдыхают краткие 30 тиков перед следующей отправкой. Ночью каждая отправка также потребляет жидкий кофе из любого из четырёх боковых трубопроводных входов.
formation-center=Учебное заведение для кусачей 5x5. Единственная машина, которая может крафтить рецепты, потребляющие рабочих кусачей или производящие обученные назначения кусачей.
rideable-biter=Личный транспорт с необычно энтузиастичным госслужащим под ним. Заправляется только [item=taxpayer-money], оснащён очень маленькой грузовой сумкой и навсегда назначен после размещения. Оставьте без финансирования на 10 минут, и он вернётся на гражданскую службу подачи жалоб.
field-office-no-working-hours=Призывает кусачей из гнёзд в радиусе 100 клеток как рабочих «один на крафт». Работает только пока кусач на месте — нулевое загрязнение во время работы.
office-desk-no-working-hours=Объединённое рабочее место для подачи документов, поставок и базовых административных задач.
admin-station=Интерфейс кусачей 5x5. Хранит жалобы и решённые предметы. Кусачи прибывают, регистрируются и ждут решения. Без крафта — только хранение.
resolution-office=Офис разрешения дел 3x3. Обрабатывает подачу, делопроизводство и окончательные решения с двумя портами для жидкостей.
union-headquarters=Заключает одобрения трудовых ресурсов и теперь обрабатывает объединённую исполнительную нагрузку поздней игры: гранты, письменные одобрения, разработку политики и налоговые аудиты. Первая копия запускается с казначейских облигаций и устной документации. Закрывается ночью, если не оснащена [item=overtime-exemption].
union-headquarters-no-working-hours=Заключает одобрения трудовых ресурсов и теперь обрабатывает объединённую исполнительную нагрузку поздней игры: гранты, письменные одобрения, разработку политики и налоговые аудиты. Первая копия запускается с казначейских облигаций и устной документации.
propaganda-distillery=Очистительная фабрика административных жидкостей 5x5. Очищает политическую жидкость в ложь, синтезирует дезинформацию, производит обоснования и чёрные кассы. Симметричная компоновка труб с двумя западными входами и двумя восточными выходами.
locomotive=Сундук транзитных разрешений автоматически размещается на каждой ж/д остановке. Загружайте бланки [item=transit-authorization] в него — один расходуется при каждом прибытии. Лимит поездов станции равен количеству бланков в сундуке.
greenhouse=Медленно выращивает дерево из воды или культивирует редкие кофейные зёрна. Электрическое питание.
printer-t1=Медленный, но надёжный электрический принтер. Производит документы из чернильных картриджей. Потребление 50 кВт.
printer-t2=Быстрый промышленный принтер с режимом копирования. Может дублировать печатные документы в соотношении 1:6. Потребление 200 кВт. Требует визита [item=biter-worker] рабочего кусача из ближайшей [entity=biter-station] биржи труда для авторизации каждого крафта.
mechanical-printer=Грубый, но функциональный принтер с ручным приводом (скорость 0,5x). Надёжная рабочая лошадка ранней игры.
corporate-breakroom=Потребляет жидкий кофе и сомнительные данные для генерации сплетен у кулера. Необходима для корпоративного принятия решений. Закрывается ночью, если не оснащена [item=overtime-exemption].
corporate-breakroom-no-working-hours=Потребляет жидкий кофе и сомнительные данные для генерации сплетен у кулера. Необходима для корпоративного принятия решений.
pneumatic-pipe=Запечатанная труба манильского цвета для транспортировки сжиженной документации. Не может соединяться с обычными жидкостными трубами.
pneumatic-pipe-to-ground=Подземная пневматическая труба. Не может соединяться с обычной жидкостной инфраструктурой.
tube-intake=Станция приёма 1x1. Скрытый манипулятор перекачивает действительные предметы документации с соседних лент или сундуков в трубопроводную сеть.
tube-outtake=Станция выдачи 1x1. Предметы из трубопроводной сети появляются в её инвентаре — используйте свой манипулятор или логистику для извлечения. Установите фильтр на слот инвентаря, чтобы запрашивать конкретный тип предмета.
overtime-exemption=Сертифицирует одно административное здание для законного ночного штатного укомплектования. Одного модуля достаточно, чтобы держать здание открытым после темноты; дополнительные копии — просто декоративная коррупция.

[administratorio-factoriopedia]
regulated-assembling-note=Также может быть создано в стандартных сборочных машинах через регулируемый рецепт с использованием соответствующей документации рабочего наряда.

