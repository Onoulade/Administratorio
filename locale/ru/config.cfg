[technology-description]
discovery-bullshit=Вы нашли это. Теперь нужно лишь переработать в убедительный аргумент. Открывает переработку сомнительных данных, производство базовых отмазок, первые документы об отказе от ответственности и разрешении на строительство, а также базовые урегулирования пейзажа.
discovery-redundant-rubble=Прикосновение к местной геологии немедленно погребло вас под лавиной избыточных требований. Открывает предварительные согласования, стол администрации, отдел урегулирования, бюрократические обещания, первые подачи пейзажных жалоб и горелочный добывающий бур.
administrative-science-research=Формализация конвейера урегулирования жалоб в воспроизводимую науку. Открывает серые административные научные наборы.
printing-technology=Механизированное производство документов. Открывает базовый принтер после установки обоих начальных открытий.
administrative-bureaucracy=Выращивание возобновляемого дерева в контролируемых тепличных условиях. Открывает теплицу и производство дерева.
admin-station-capacity=Расширение каждой зоны ожидания стола администрации на один дополнительный слот.
rubble-compaction=Сжатие избыточного щебня в стандартизированный строительный материал для дальнейшей инфраструктуры. Открывает производство спрессованного щебня.
littering-resolution=Формализация процедур обработки жалоб на незаконный сброс мусора. Открывает скверные отчёты, подачу жалоб на мусор и урегулирование мусорных дел.
industrial-printing=Масштабирование объёмов производства документов за пределы одного электрического принтера с инфраструктурой химической эпохи. Открывает промышленный принтер и рецепты массового копирования чистых бланков, бланков согласования, углеродных сертификатов, Формы 27Б-6, отчётов об экологическом воздействии и бланков директив.
local-precedents=Стандартизация правовой шаблонной базы для железнодорожных и документов соответствия. Открывает бесполезную документацию и Форму 27Б-6.
nest-pacification=Формализация подкупа враждебных существ в пригодную для повторного использования административную процедуру. Открывает деньги для затыкания рта для временного заглушения появления особей из логова жуков на 3 минуты.
streamlined-work-orders=Прямая печать нарядов на работу из черновиков, минуя промежуточные стадии согласования. Открывает прямую печать черновиков в наряды на работу на электрических принтерах, производя 2 наряда за цикл крафта.
office-agriculture=Индустриализация офисного снабжения кофе за пределами сбора. Открывает кофейные плантации.
charcoal-production=Формализация регламентированного возобновляемого производства угля из тепличного дерева. Открывает производство древесного угля.
industrial-propaganda=Вооружение дезинформацией в промышленных масштабах. Открывает Пропагандный Перегонный Завод, переработку флюида политиканства, дезинформацию, очищенный абсурд и официальные удостоверения.
corporate-hospitality=Превращение кофе и офисных слухов в пригодный моральный дух. Открывает открытие кофе, корпоративную комнату отдыха, варку кофе, сплетни у кулера и переработку офисной драмы.
information-management=Обработка сплетен и удостоверений в пригодные бумажные следы. Открывает синтез данных и убедительные отмазки.
verbal-approvals=Формализация устного обещания руководителя в пригодные документы. Открывает чистые бланки директив, копирование директив и устные согласования руководства.
environmental-compliance=Разрешение нефтяной экономики через надлежащим образом задокументированный экологический театр. Открывает нефтехимические разрешения, отчёты об экологическом воздействии, наряды на работу с химикатами и верифицированные углеродные сертификаты.
smog-abatement=Формализация цепочки жалоб на загрязнение воздуха. Открывает подачу жалоб на смог, делопроизводство и окончательное урегулирование.
hazmat-response=Формализация цепочки жалоб на опасные материалы. Открывает подачу жалоб на опасные вещества, делопроизводство и окончательное урегулирование.
nest-expropriation=Заявление прав на территорию с помощью документально подкреплённой силы. Открывает уведомления о выселении для расчистки логов жуков.
synthetic-stationery=Формализация производства канцтоваров из нефтепродуктов. Открывает синтетическую бумагу из пластика, серы и воды для высокопропускного снабжения делопроизводством.
public-finance=Включение казначейства и профсоюзов в бюрократию. Открывает государственные облигации, штаб-квартиру профсоюза, одобрения профсоюза и правительственные гранты.
health-and-safety=Превращение рычага профсоюза в регуляторный театр. Открывает устранение нарушений охраны труда, обоснования и производство нарратива.
board-meetings=Расширение штаб-квартиры профсоюза в зал исполнительного комитета. Открывает письменные предложения и согласования руководства без добавления отдельного здания.
executive-review=Эскалация бюрократии до подписанных директив. Открывает письменные наряды руководства для самых тяжёлых регламентированных проектов.
radiological-compliance=Эскалация документов процессов в ядерную сферу. Открывает радиологические наряды для центрифуг и обработки урана.
eminent-domain-zoning=Подготовка политического каркаса для крупномасштабного расширения. Открывает белые книги, директивы политики и тайные фонды.
work-order-duplication=Стандартизация промышленного копирования завершённых разрешений. Открывает массовое дублирование для каждого семейства нарядов на работу на промышленном принтере, от базовых форм сборщика до радиологических эксплуатационных документов.
federal-regulation=Превращение политики в обязательный федеральный текст. Открывает подготовку регламентов.
noise-ordinances=Формализация цепочки жалоб на шум. Открывает подачу жалоб на шум, делопроизводство и окончательное урегулирование.
loitering-ordinances=Формализация цепочки жалоб на бродяжничество. Открывает подачу жалоб на бродяжничество, делопроизводство и окончательное урегулирование.
creative-accounting=Стандартизация переквалификации тайных фондов в официальные доходы. Открывает налоговую проверку.
constitutional-law=Финальный уровень жалоб жуков. Открывает подачу жалоб на безработицу, делопроизводство и окончательное урегулирование на стадии производственной науки.
vagrancy-ordinances=Финальный уровень жалоб плевалок. Открывает подачу жалоб на бездомность, делопроизводство и окончательное урегулирование на стадии утилитарной науки.
filing-cabinet-logistics-1=Стандартизация офисной логистики делопроизводства. Увеличивает личные слоты запросов и мусора логистики.
filing-cabinet-logistics-2=Расширение пропускной способности клерков логистики среднего уровня. Дополнительно увеличивает личные слоты запросов и мусора логистики.
filing-cabinet-logistics-3=Полная централизация рабочих процессов делопроизводства логистики. Дополнительно увеличивает личные слоты запросов и мусора логистики.
after-hours-operations=Стандартизация законных ночных смен для административного аппарата. Открывает модуль [item=overtime-exemption] Разрешение на Сверхурочную Работу, чтобы ключевые офисные здания могли оставаться открытыми в ночное время.
pneumatic-form-transport=Маршрутизация документов через запечатанные пневматические трубы. Открывает приёмники трубы, выдатчики трубы и пневматические трубы. Приёмники принимают только действительные бумажные предметы, а пневматические трубы не подключаются к обычной инфраструктуре для жидкостей.
pneumatic-capacity=Увеличение количества бумажных предметов, которые каждая пневматическая трубная сеть может удерживать в транзите.
pneumatic-capacity-1=Укрепление трубных соединений для обработки большего количества одновременных форм. Увеличивает вместимость трубной сети на 10.
pneumatic-capacity-2=Установка регуляторов давления для более высокой пневматической доставки. Увеличивает вместимость трубной сети на 30.
pneumatic-capacity-3=Полноценная промышленная пневматическая инфраструктура. Увеличивает вместимость трубной сети на 50.

