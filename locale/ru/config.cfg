[recipe-description]
paper-production=Преобразование дерева в бумагу. Первый шаг в любой бюрократической цепочке поставок.
ink-production=Измельчение угля в сырые чернила. Можно изготовить вручную. Здесь начинается письмо.
blank-form-production=Печать чистых бланков с использованием бумаги и чернил. Универсальный административный субстрат.
blank-approval-production=Печать чистых бланков согласования. Шаблон более высокого качества для разрешений и согласований.
blank-directive-production=Печать чистых бланков директив. Премиальный защитный шаблон с тройными чернилами для согласований руководства.
carbon-offset-certificate-basic=Выдача базового сертификата углеродного компенсирования из чистого бланка и угля. Разрешает партийную плавку.
carbon-offset-certificate-verified=Улучшение базового сертификата дополнительной верификацией сомнительных данных на рабочем столе. Необходим для строительства стальных печей.
provisional-approval-production=Получение наиболее базовой формы бюрократического согласования. Требует бумаги и избыточного щебня.
work-order-production=Составление наряда на работу из чистого бланка и сомнительных данных. Базовое разрешение для регламентированного производства сборочных машин.
form-27b-6=Печать стандартизированной формы заявки из чистого бланка, чернил и бесполезной документации.
safety-waiver-draft=Подготовка черновика акта об отказе от ответственности на рабочем столе из чистого бланка согласования и базовой отмазки. Требует окончательной обработки на принтере.
safety-waiver-printing=Окончательная обработка черновика акта об отказе от ответственности с чернилами на принтере. Производит официальный акт.
transit-authorization-production=Подготовка транзитного разрешения (Форма 12-Т) для железнодорожных станций. Требует чистого бланка согласования и Формы 27Б-6.
environmental-impact-report=Составление комплексной экологической экспертизы на рабочем столе из скверного отчёта, Формы 27Б-6 и верифицированных углеродных сертификатов. Используется для получения разрешений более высокого уровня.
petrochemical-operating-permit-production=Выдача разрешения на эксплуатацию нефтеперегонного завода на рабочем столе путём сочетания акта об отказе от ответственности с отчётом об экологическом воздействии.
management-verbal-draft=Убеждение руководителя дать устное согласие в комнате отдыха. Требует чистого бланка директивы, базовой отмазки и кофе. Требует окончательной обработки на принтере.
management-verbal-printing=Окончательная обработка черновика устного согласования руководства с чернилами и бумагой. Производит официальное устное согласование.
management-written-proposal=Подготовка письменного предложения руководства в штаб-квартире профсоюза. Требует чистого бланка директивы, убедительной отмазки, нарратива и государственной облигации.
management-written-1st-printing=Окончательная обработка письменного предложения руководства за один тяжёлый прогон на принтере с использованием чернил, Формы 27Б-6 и бумаги. Производит официальное письменное согласование.
research-grant-approval-production=Выдача базового исследовательского гранта из чистого бланка, избыточного щебня и сомнительных данных. Необходимо для производства всех научных наборов.
construction-permit-draft=Подготовка черновика разрешения на строительство на рабочем столе из чистого бланка согласования, сомнительных данных и бумаги. Требует окончательной обработки на принтере.
construction-permit-printing=Окончательная обработка черновика разрешения на строительство с чернилами на принтере. Производит официальное разрешение на строительство.
safety-work-order-production=Сочетание акта об отказе от ответственности с нарядом на работу. Расходуется при регламентированном производстве сборочных машин T1.
construction-work-order-production=Сочетание разрешения на строительство с нарядом на работу. Расходуется при регламентированном производстве сборочных машин T2.
management-verbal-work-order-production=Сочетание устного согласования руководства с нарядом на работу. Расходуется при регламентированном производстве сборочных машин T3.
management-written-work-order-production=Сочетание письменного согласования руководства с нарядом на работу. Расходуется при регламентированном производстве сборочных машин T4.
research-grant-work-order-production=Сочетание согласования исследовательского гранта с нарядом на работу. Расходуется при регламентированном производстве науки в сборочных машинах.
chemical-handling-work-order-production=Сборка операционного наряда для химического завода на рабочем столе из нефтехимического разрешения, Формы 27Б-6, бочки и трубопроводной арматуры.
radiological-work-order-production=Сборка операционного наряда для центрифуги на рабочем столе из химических документов, письменного согласования руководства, обоснования и экологического отчёта.
safety-work-order-printing=Печать наряда на безопасность непосредственно из черновика, производя 2 за цикл крафта. Требует электрического принтера.
construction-work-order-printing=Печать наряда на строительство непосредственно из черновика, производя 2 за цикл крафта. Требует электрического принтера.
dubious-data-batch=Партийная плавка руды чепухи в сомнительные данные с использованием сертификата углеродного компенсирования. Для использования в каменных и стальных печах.
dubious-data-refining=Переработка сырой руды чепухи в сомнительные данные. Основа информационной экономики.
basic-excuse-production=Формулировка базовой отмазки из 5 сомнительных данных. Используется в урегулировании пейзажных дел и процессах низшего уровня.
crappy-report-production=Составление отчёта из 5 сомнительных данных. Основа для документации всех уровней.
politician-fluid-refining=Переработка флюида политиканства в жидкую ложь. Требует Пропагандного Перегонного Завода.
data-production=Синтез реальных данных из скверного отчёта и официальных удостоверений.
good-excuse-production=Создание убедительной отмазки путём смешивания реальных данных с жидкой ложью.
misinformation-production=Производство жидкой дезинформации из лжи и сомнительных данных. Ключевой ингредиент в разработке политики.
justification-production=Конструирование правового обоснования из дезинформации, удостоверений и флюида политиканства.
credentials-production=Производство официальных удостоверений из жидкой лжи, сомнительных данных и очищенного абсурда.
narrative-production=Сплетение официального нарратива из обоснований, убедительных отмазок и очищенного абсурда. Управляет общественным восприятием. Изготавливается в штаб-квартире профсоюза.
white-paper-production=Написание авторитетного политического документа из данных, лжи и государственной облигации в штаб-квартире профсоюза.
policy-production=Подготовка директивы политики в штаб-квартире профсоюза. Требует белых книг, дезинформации, данных и грантов.
regulation-production=Подготовка федерального регламента в штаб-квартире профсоюза. Требует эмпирических фактов, удостоверений, данных и значительных правительственных грантов.
promise-production=Ручное изготовление бросаемого бюрократического обещания из бланков, согласований и сомнительных данных. Бросайте в протестующих жуков, чтобы их успокоить.
eviction-notice-production=Производство бросаемого уведомления о выселении. Уничтожает постройки жуков.
hush-money-production=Упаковка денег налогоплательщиков в бросаемый пакет с минимальным количеством бумаг, чтобы выглядеть официально. Заглушает ближайшие логова на 3 минуты.
filing-landscape=Подача жалобы на пейзаж с чистым бланком. Первый шаг в цепочке урегулирования жалоб.
filing-smog=Подача жалобы на смог. Занимает больше времени, чем подача пейзажной жалобы, из-за дополнительной экологической документации.
filing-noise=Подача жалобы на шум. Требует значительного времени обработки и документации.
filing-unemployment=Подача жалобы на безработицу. Самая сложная подача, требующая обширной документации.
filing-littering=Подача жалобы на мусор с чистым бланком. Первый шаг в урегулировании жалоб плевалок.
filing-hazmat=Подача жалобы на опасные вещества. Требует дополнительной документации для опасных материалов.
filing-loitering=Подача жалобы на бродяжничество. Требует обширной документации об ограниченных зонах.
filing-vagrancy=Подача жалобы на бездомность. Самая сложная подача для плевалок, требующая исчерпывающих записей о перемещении.
case-smog=Формирование подтверждённого дела о смоге из подачи, бумажных улик и избыточного щебня.
case-noise=Формирование подтверждённого дела о шуме из подачи, верифицированных данных и экологической сертификации.
case-unemployment=Формирование подтверждённого дела о безработице из подачи, эмпирических фактов и правительственного гранта.
case-hazmat=Формирование подтверждённого дела об опасных веществах из подачи, бумажных улик и спрессованного щебня.
case-loitering=Формирование подтверждённого дела о бродяжничестве из подачи, данных, удостоверений и очищенного абсурда.
case-vagrancy=Формирование подтверждённого дела о бездомности из подачи, данных и директивы политики.
brief-noise=Устаревший рецепт совместимости из прежней системы жалоб.
brief-unemployment=Устаревший рецепт совместимости из прежней системы жалоб.
brief-loitering=Устаревший рецепт совместимости из прежней системы жалоб.
brief-vagrancy=Устаревший рецепт совместимости из прежней системы жалоб.
landscape-final=Урегулирование жалобы на пейзаж с использованием подачи и базовой отмазки. Простейшее урегулирование.
smog-final=Урегулирование жалобы на смог с использованием подтверждённого дела, дезинформации и жидкого кофе.
noise-final=Урегулирование жалобы на шум непосредственно из подтверждённого дела, включая прежние затраты стадии краткого изложения в единое тяжёлое окончательное решение.
unemployment-final=Урегулирование жалобы на безработицу непосредственно из подтверждённого дела, включая прежние затраты стадии краткого изложения в единое тяжёлое окончательное решение.
littering-final=Урегулирование жалобы на мусор с использованием подачи и скверного отчёта. Немного сложнее, чем пейзаж.
hazmat-final=Урегулирование жалобы на опасные вещества с использованием подтверждённого дела, дезинформации и жидкого кофе.
loitering-final=Урегулирование жалобы на бродяжничество непосредственно из подтверждённого дела, включая прежние затраты стадии краткого изложения в единое тяжёлое окончательное решение.
vagrancy-final=Урегулирование жалобы на бездомность непосредственно из подтверждённого дела, включая прежние затраты стадии краткого изложения в единое тяжёлое окончательное решение.
iron-plate-batch=Плавка 10 железной руды в 10 железных пластин с использованием сертификата углеродного компенсирования. Для каменных и электрических печей.
copper-plate-batch=Плавка 10 медной руды в 10 медных пластин с использованием сертификата углеродного компенсирования. Для каменных и электрических печей.
steel-plate-batch=Переработка 25 железных пластин в 5 стальных пластин с использованием сертификата углеродного компенсирования. Для каменных и электрических печей.
stone-brick-batch=Переработка 20 камня в 10 кирпичей с использованием сертификата углеродного компенсирования. Для каменных и электрических печей.
greenhouse-wood=Выращивание дерева из воды в теплице. Стабильно и устойчиво.
greenhouse-discovery=Копание во влажном компосте в поисках редких кофейных зёрен. Шанс 10% за цикл. В любом случае вы получите немного дерева, но никогда столько, сколько вложили.
synthetic-paper-production=Экструзия синтетической бумаги из пластика, серы и воды. Быстрее, чем бумага из тепличного дерева, но значительно более ресурсозатратно.
coffee-plantation=Культивирование кофейных зёрен с использованием зёрен и воды. Утраивает запас зёрен.
coffee-refining=Варка кофе из зёрен, воды и наряда на работу. Простые документы, мгновенный результат.
corporate-breakroom-production=Строительство корпоративной комнаты отдыха для генерации сплетен у кулера.
watercooler-gossip-production=Генерация сплетен у кулера из жидкого кофе и сомнительных данных. Незаменима для принятия корпоративных решений.
osha-scrubbing=Обработка нарушений охраны труда в отделе урегулирования с очищенным абсурдом и одобрением профсоюза для производства обоснований.
osha-violation-recycling=Массовая переработка нарушений охраны труда в штаб-квартире профсоюза с получением случайных бланков и промежуточных материалов. Дешевле, чем устранение, но менее предсказуемо.
office-drama-recycling=Обработка офисной драмы с кофе в комнате отдыха для случайного получения нарядов на работу, сплетен у кулера и базовых отмазок.
resolution-office-production=Строительство отдела урегулирования 3×3 для обработки урегулирований жалоб и разрешений.
copy-blank-form=Дублирование чистых бланков: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий. Небольшой шанс получить бумажные отходы.
copy-blank-approval=Дублирование чистых бланков согласования: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий.
copy-blank-directive=Дублирование чистых бланков директив: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий.
copy-carbon-offset-certificate=Дублирование сертификатов углеродного компенсирования: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий. Требует промышленного принтера.
copy-form-27b-6=Дублирование Формы 27Б-6: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий. Требует промышленного принтера.
copy-environmental-impact-report=Дублирование отчётов об экологическом воздействии: 1 оригинал + 5 бумаги + 1 картридж с чернилами + 1 улучшенная микросхема даёт 6 копий. Требует промышленного принтера.
copy-work-order=Дублирование базовых нарядов на работу на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-safety-work-order=Дублирование нарядов на безопасность на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-construction-work-order=Дублирование нарядов на строительство на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-management-verbal-work-order=Дублирование устных нарядов руководства на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-management-written-work-order=Дублирование письменных нарядов руководства на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-research-grant-work-order=Дублирование нарядов исследовательского гранта на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-chemical-handling-work-order=Дублирование нарядов на работу с химикатами на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
copy-radiological-work-order=Дублирование радиологических нарядов на промышленном принтере: 1 оригинал + 5 бумаги + 1 чернила + 1 процессорный блок даёт 6 копий всего.
office-desk-production=Строительство административного рабочего стола для делопроизводства и производства расходных материалов.
admin-station-production=Строительство центральной станции урегулирования 5×5 для обработки дел высшего уровня.
union-headquarters-production=Строительство первой штаб-квартиры профсоюза из государственных облигаций и устных документов, а затем её использование для переговоров об одобрении рабочей силы, грантах и политике позднего исполнительного уровня.
propaganda-distillery-production=Строительство пропагандного перегонного завода для переработки административных жидкостей, таких как ложь и дезинформация.
greenhouse-production=Строительство теплицы для производства дерева и кофе.
printer-t1-production=Строительство базового электрического принтера для производства документов на основе чернил.
printer-t2-production=Строительство промышленного принтера с возможностью копирования. Требует базового принтера и улучшенных микросхем в качестве компонентов.
mechanical-printer-production=Сборка механического принтера из железа, камня и бумаги. Надёжное улучшение в начале игры.
pneumatic-pipe-production=Производство запечатанных пневматических труб из железа и спрессованного щебня. Только для транспортировки документов.
pneumatic-pipe-to-ground-production=Производство подземных пневматических труб. Диапазон прокладки под землёй 16 клеток.
tube-intake-production=Строительство приёмной станции трубы. Расходует бумажные предметы для мгновенной пневматической транспортировки.
tube-outtake-production=Строительство станции выдачи трубы. Выдаёт бумажные предметы из пневматической сигнальной сети.
speed-module=Изготовление Модуля Повестки 1 (Скорость) из базовых отмазок и электронных схем.
speed-module-2=Улучшение: требует 4 модуля 1-го уровня, убедительных отмазок и улучшенных микросхем.
speed-module-3=Улучшение: требует 4 модуля 2-го уровня, нарративов, процессорных блоков, спрессованного щебня и удостоверений.
productivity-module=Изготовление Модуля Аудита 1 (Производительность) из сомнительных данных и электронных схем.
productivity-module-2=Улучшение: требует 4 модуля 1-го уровня, данных и улучшенных микросхем.
productivity-module-3=Улучшение: требует 4 модуля 2-го уровня, обоснований, процессорных блоков, спрессованного щебня и удостоверений.
efficiency-module=Изготовление Модуля Растраты 1 (Эффективность) из скверных отчётов и электронных схем.
efficiency-module-2=Улучшение: требует 4 модуля 1-го уровня, белых книг и улучшенных микросхем.
efficiency-module-3=Улучшение: требует 4 модуля 2-го уровня, директив политики, процессорных блоков, спрессованного щебня и удостоверений.
union-approval-production=Переговоры об одобрении профсоюза с использованием кофе, бумаги, данных и денег налогоплательщиков.
treasury-bond-production=Выпуск государственной облигации из денег налогоплательщиков, чистых бланков и бесполезной документации.
government-grant-production=Получение правительственного гранта из государственных облигаций, скверного отчёта и устного согласования руководства. Изготавливается в штаб-квартире профсоюза.
tax-audit=Переквалификация тайных фондов с использованием базовой документации облигаций и данных в значительно большее количество денег налогоплательщиков. Коррупционно, но эффективно.
slush-fund-production=Отмывание государственных облигаций с ложью в тайный фонд.
useless-documentation-production=Упаковка избыточного щебня в слои бумаги. Результат — официально задокументированная бесполезность, необходимая для подачи документов и финансовых инструментов.
compacted-rubble-production=Сжатие избыточного щебня в сертифицированных условиях. Требует сертификата углеродного компенсирования. Используется в строительстве зданий и производстве модулей.
charcoal-production=Массовое сжигание дерева в печи с сертификатом углеродного компенсирования для производства угля. Возобновляемый источник угля при сочетании с теплицами.
refined-nonsense-production=Сплавление спрессованного щебня с жидкой дезинформацией для производства чистого очищенного абсурда. Незаменимый ингредиент для бюрократических процессов высшего уровня.
overtime-exemption=Выдача разрешения на ночную работу для одного административного здания. Требует модуля производительности, кучи государственного финансирования и достаточного количества кофе для законного содержания огней включёнными.

