[recipe-description]
middle-management-training-briefing=Инструктирует одного многоразового руководителя за одну шестерню и 5 единиц кофе, без денег налогоплательщиков, на любой планете.
middle-management-staffing-briefing=Инструктирует одного многоразового руководителя за один ремкомплект и 5 единиц кофе, без денег налогоплательщиков, на любой планете.
middle-management-compliance-briefing=Инструктирует одного многоразового руководителя за один пустой бланк и 5 единиц кофе, без денег налогоплательщиков, на любой планете.
middle-management-liaison-briefing=Инструктирует одного многоразового руководителя за одну электронную схему и 5 единиц кофе, без денег налогоплательщиков, на любой планете.
middle-management-orbital-briefing=Инструктирует одного многоразового руководителя за одну единицу ракетного топлива и 5 единиц кофе, без денег налогоплательщиков, на любой планете.
promethium-science-pack=Преобразует куски астероидов с Администраториумом в финальные исследования под действием подписанной экспедиционной хартии.
promethium-research-charter-production=Оформляет хартию, разрешающую добычу Администраториума под бюрократическим контролем астероидов.
paper-production=Превращает древесину в бумагу. Первый шаг в любой бюрократической цепочке поставок.
ink-production=Перемалывает уголь в сырые чернила. Можно создавать вручную. С этого начинается письменная работа.

blank-form-production=Печатает чистые бланки из бумаги и чернил. Универсальный фундамент для любой отчётности.
blank-approval-production=Печатает чистые бланки согласований. Более качественный шаблон для разрешений и согласований.
blank-directive-production=Печатает чистые бланки директив. Премиальный защищённый шаблон с тройным расходом чернил для приказов высшего руководства.

carbon-offset-certificate-basic=Ваша лицензия на плавку. Один сертификат на партию в печи держит экологов на безопасном расстоянии.
carbon-offset-certificate-verified=Углеродный сертификат с официальным заверением. Нужен, чтобы бюрократия позволила вам поставить стальную печь.
provisional-approval-production=Самая простая форма бюрократического согласования. Ваш первый глоток избыточного щебня и согласование для инфраструктуры на твердом топливе.
work-order-production=Универсальный наряд-допуск для сборочного автомата. Без него ваши станки — это просто очень дорогие пресс-папье.
form-27b-6=Форма, благодаря которой существуют все остальные формы. Вы ещё не подали свою 27Б-6?
safety-waiver-draft=Снимает с администрации фабрики любую ответственность с помощью одной дежурной отговорки. Чтобы обрести юридическую силу, нуждаётся в распечатке и печати.
safety-waiver-printing=Ставит печать и вводит отказ от ответственности по ТБ в действие. Нужен для постройки Т1 зданий и создания тяжёлых нарядов-допусков.
transit-authorization-production=Официальный проездной ордер для поездов. Один ордер списывается на каждое прибытие состава — нет ордера, нет поезда.

environmental-impact-report=Исчерпывающая (хотя и густо замазанная чёрным маркером) оценка экологического ущерба. Нужна для получения нарядов-допусков на химические и радиологические работы.
management-verbal-draft=Получите устное согласование руководства у кофемашины. Чтобы согласование нельзя было отрицать, его придётся пропустить через принтер.
management-verbal-printing=Переносит устное согласование на бумагу, пока начальник не успел передумать. Выдаёт на руки официальное устное согласование.
management-written-proposal=Составляет проект письменного согласования через профсоюз. Потребует вескую отговорку, официальную версию и казначейскую облигацию — руководство не подписывает документы бесплатно.
management-written-1st-printing=Финализирует проект письменного согласования одним тяжёлым проходом через принтер. На выходе получается заверенное письменное согласование руководства, которое невозможно оспорить.
research-grant-approval-production=Минимально достаточное согласование финансирования. Для партий космической науки эти обычные согласования необходимо доставлять на орбиту.
construction-permit-draft=Запускает процесс согласования строительства на столе клерка. Черновик ещё не имеет юридической силы — его нужно заверить печатью.
construction-permit-printing=Финализирует разрешение на строительство чернилами и должностными полномочиями. Без этого документа ничего не строится.

provisional-work-order-production=Предварительный наряд-допуск для автомата. Ваши машины ещё даже не включились, а бумаги уже пошли.
safety-work-order-production=Разрешите автоматам делать что-то слегка опасное — то есть, в реалиях этой фабрики, вообще всё. Стартовый наряд-допуск для автоматизации.
construction-work-order-production=Наряд-допуск среднего уровня для автомата. Ваше оборудование эволюционировало из стадии «вроде не рванет» в «официально разрешено».
management-verbal-work-order-production=Начальник сказал, что можно. Это ведь считается, да? Наряд-допуск T3, подкрепленный устным согласованием.
management-written-work-order-production=Наряд-допуск высшего уровня для автомата с настоящей подписью. Самый дорогой наряд-допуск на всей фабрике.
research-grant-work-order-production=Наряд-допуск по исследовательскому гранту запускает круговорот бюрократии: науке нужны деньги, деньгам нужны бумаги, бумагам нужны исследовательские пакеты.
chemical-handling-work-order-production=Наряд-допуск на химические работы. Собирает бумаги по ТБ, экологии и логистические документы в одну очень толстую папку.
radiological-work-order-production=Наряд-допуск высшей категории секретности. Разрешает центрифугам работать с ураном — при условии, что руководство поставило подпись.
safety-work-order-printing=Позволяет обойти лишние шаги и печатать наряды-допуски по ТБ напрямую из черновиков. Выдаёт по два бланка за производственный цикл — принтер сам всё сшивает.
construction-work-order-printing=Печатает строительные наряды-допуски напрямую из черновиков. Выдаёт по два бланка за производственный цикл — быстрее, чем собирать их вручную.

dubious-data-batch=Промышленная переплавка бреда в сомнительные данные. Один сертификат покрывает всю партию — экологи не пересчитывают каждую строчку по отдельности.
dubious-data-refining=Извлекает из сырого бреда нечто, отдаленно напоминающее информацию. Достоверность нулевая, но формально сойдет за статистику.
basic-excuse-production=Пять фрагментов ненадёжной информации, сжатые в одну правдоподобно звучащую отговорку. Основа урегулирования жалоб на испорченный ландшафт.
crappy-report-production=Пять сомнительных фактов, скрепленных степлером и названных «отчётом». Фундамент всей документации высшего звена.
politician-fluid-refining=Перегоняет сырую политическую жидкость в чистую жидкую ложь. Перегонный цех пропаганды не задаёт вопросов — он просто перерабатывает.
data-production=Реальная, применимая на практике информация — редчайший ресурс. Получается при сопоставлении некачественного отчёта с чьими-то должностными полномочиями.
good-excuse-production=Смешивайте реальные факты с жидкой ложью до тех пор, пока результат не станет звучать правдоподобно. Жизненно необходимо для согласований на высшем уровне.
misinformation-production=Жидкая дезинформация в промышленных масштабах. Ключевой ингредиент для политики, официальных обоснований и рафинированного абсурда.
justification-production=Формальное юридическое обоснование, составленное из жидкой дезинформации, должностных полномочий и сырой политической жидкости. Используется для списания нарушений ТБ.
credentials-production=Доказательство вашей власти, каким бы сомнительным ни был источник. Бюрократия не проверяет подлинность — она лишь смотрит, стоит ли печать.
narrative-production=Утверждённая версия событий, составленная в штабе профсоюза. Управляет общественным восприятием вашей администрации.
white-paper-production=Авторитетный меморандум по вопросам политики. Читается как научный труд, финансируется как коррупционная схема, а управляет как нечто совершенно иное.
policy-production=Итог бесконечных совещаний, отлитый в форму директивы. Питает конвейер регламентов и урегулирование дел высшего уровня.
regulation-production=Высшее проявление государственной власти. Для составления требует абсурдного объёма денег и данных.
promise-production=Размытый, но успокаивающий документ, который можно бросить в бастующих кусак. Юридической силы не имеет, конкретики нет, но позволяет выиграть время.
eviction-notice-production=Легальное право сносить ульи кусак, спрессованное в удобную для броска капсулу. Кусаки при этом не умирают — они просто становятся бездомными.
hush-money-production=Деньги налогоплательщиков, расфасованные по мешкам с достаточным количеством документов, чтобы взятка выглядела официальной. Успокаивает ульи на 3 минуты.
rideable-biter=Назначает рабочего-кусаку на личный транспорт. Получившееся транспортное средство расходует деньги налогоплательщиков, имеет крошечный багажник, не подлежит демонтажу, а если оставить его без финансирования на 10 минут — снова подаёт жалобу.
job-offer-production=Составляет трудовой договор. Положите его в слот приёмной стойки — довольный кусака заберёт его вместо того, чтобы уйти. Вы получаете сотрудника, он получает карьеру.
biter-logistics-formation=Переквалифицирует рабочего-кусаку в кусаку-грузчика. Такой кусака-грузчик приписывается к кусакопортам и переносит предметы между сундуками.
union-delegate-training=Изнурительная сертификация с формальными документами, юридическими шаблонами и чрезмерным потреблением кофе. Без делегата не построить Штаб-квартиру профсоюза.
chemical-operator-training=Сертификация кусаки для работы с опасными материалами. На удивление жёсткий отбор для существа, которое раньше плевалось кислотой совершенно бесплатно.
nuclear-technician-training=Обучить кусаку на специалиста-ядерщика. Требуется для реакторов и центрифуг — вы же не хотите пускать нелицензированную фауну к обогащенному урану?
filing-landscape=Официально признайте, что испортили местный пейзаж. Первый шаг к тому, чтобы сделать вид, будто вам не всё равно.
filing-smog=Папка с жалобой на смог толще, чем сам смог. Оформление занимает больше времени, чем хотелось бы.
filing-noise=Документирование нарушений тишины — по иронии судьбы, очень громкий процесс. Требует уйму времени.
filing-unemployment=Зарегистрировать жалобу на то, что работы нет ни у кого. При том, что у того, кто её регистрирует, работа есть. Самая сложная жалоба кусак.
filing-littering=Формальное внесение кислотных луж в реестр. С этого начинается разбор жалоб от плевак.
filing-hazmat=Само оформление этих бумаг может потребовать процедур по работе с опасными материалами. Ожидайте долгую обработку.
filing-loitering=Признать нахождение в неположенном месте преследуемым нарушением. Пик бюрократии. Требует обширной документации по закрытым зонам.
filing-vagrancy=Документирование вытеснения и лишения жилья системой, которая сама же это и санкционировала. Самая тяжёлая жалоба плевак.
case-smog=Превратите зарегистрированную жалобу на смог в готовое для суда дело. Доказательства буквально висят в воздухе, но всё равно нужны на бумаге.
case-noise=Превратите жалобы на шум в дело. Требует строгих данных и экологических экспертиз — слухи в суде кусак не принимаются.
case-unemployment=Докажите системный крах экономики с помощью такого объёма бумаг, которым можно загрузить работой целый отдел. Требует госфинансирования.
case-hazmat=Подошейте вещественные доказательства к делу об опасных материалах. Образцы щебня несут важную смысловую нагрузку.
case-loitering=Выстройте юридическую базу под то, что стоять на месте — это преступление. Потребуются полномочия, данные и ровно столько рафинированного абсурда, чтобы всё склеилось.
case-vagrancy=Соберите дело о бродяжничестве, подкрепленное директивой. Самая тяжёлая работа с плеваками — вам нужна директива просто для того, чтобы открыть папку.
brief-noise=Пережиток тех эпох, когда суды ещё работали. Оставлен для совместимости сохранений — сейчас суды оптимизировали процессы.
brief-unemployment=Из времен, когда безработицу мог признать только Верховный суд. Оставлен для совместимости сохранений.
brief-loitering=Артефакт старой цепочки обвинений в праздношатании. Оставлен для совместимости сохранений.
brief-vagrancy=Судебный меморандум времен, когда дела о бродяжничестве требовали высшей судебной инстанции. Оставлен для совместимости сохранений.
landscape-final=Самое тривиальное решение проблемы. Одна отговорка, один бланк, один довольный кусака. Если бы всё было так просто.
smog-final=Официально признать качество воздуха удовлетворительным. Потребует жидкой дезинформации и кофе — писать правду слишком долго.
noise-final=Поставить точку в деле о шуме одним ударом судейского молотка. Тяжёлое решение, расходующее директивы, полномочия, официальные версии и чрезмерные объёмы кофе.
unemployment-final=Урегулируйте безработицу огромным объёмом макулатуры. Вы не создали рабочие места — вы создали достаточно бланков, чтобы сделать вид, что проблема решена.
littering-final=Переквалифицировать кислотные лужи в элемент декоративного благоустройства. Легкое дело — хватит одного отчёта и одной регистрации.
hazmat-final=Задокументировать факт того, что опасные материалы были утилизированы с соблюдением всех нарушений. Потребует жидкой дезинформации и кофе — стандартных бюрократических растворителей.
loitering-final=Прецедентное решение о том, что стоять на месте больше не преступление (в данном конкретном случае). Потребует регламентов, официальных версий, полномочий и кофе.
vagrancy-final=Высшее бюрократическое достижение плевак. Вы решили проблему бездомности — ну или, по крайней мере, наплодили достаточно бумаг, чтобы сдать дело в архив.

iron-plate-batch=Лицензированная плавка железа. Один сертификат покрывает всю партию — инспекторы считают циклы печи, а не слитки.
copper-plate-batch=Лицензированная плавка меди. Один сертификат на партию. Ущерб экологии тщательно не расследуется.
steel-plate-batch=Лицензированная выплавка стали. Сертификаты горят быстрее, чем руда, но пропускная способность того стоит.
stone-brick-batch=Лицензированный обжиг камня. В этой экономике даже кирпичам нужны углеродные сертификаты.
greenhouse-wood=Возобновляемое производство древесины. Деревья вырастают заново, а потраченная бумага — нет.
greenhouse-discovery=Просеивание влажного компоста в надежде найти кофейные зёрна. Шанс 10% за цикл. Древесина частично возвращается, но всегда меньше, чем вы вложили.
synthetic-paper-production=Канцелярия из нефти для обеспечения высоконагруженного документооборота. Быстрее, чем растить деревья, но счета за химреагенты кусаются.
coffee-plantation=Посадите зёрна, полейте водой, соберите пять зёрен за полминуты. Самая критичная цепочка поставок на всей фабрике.
coffee-refining=Сварите кровь бюрократии. Наряд-допуск гарантирует, что кофе расходуется строго официально.
corporate-breakroom-production=Каждому офису нужно место, куда сотрудники приходят убивать рабочее время. Заодно генерирует сплетни, без которых фабрика почему-то не работает.
watercooler-gossip-production=Залейте сомнительные факты кофе и посмотрите, какие сплетни из этого родятся. Жизненно необходимо для принятия корпоративных решений.
osha-scrubbing=Списывает нарушения техники безопасности путём правильного применения абсурда и согласования профсоюза. Производит официальные обоснования.
osha-violation-recycling=Верните нарушения в профсоюзный аппарат и посмотрите, какие документы из него выйдут. Дешевле, чем списание по бумагам, но результат непредсказуем.
office-drama-recycling=Добавьте кофе к офисным скандалам и хорошенько взболтайте. На выходе случайным образом получаются наряды-допуски, сплетни или дежурные отговорки — три кита корпоративной культуры.
resolution-office-production=Место, куда жалобы отправляются на урегулирование — или хотя бы на переквалификацию. Основной элемент вашей цепочки урегулирования.
copy-blank-form=Массовое ксерокопирование пустоты в промышленных масштабах. Пик эффективности. Есть небольшой шанс получить макулатуру.
copy-blank-approval=Один шаблон согласования заходит, шесть выходят. Оригинал неотличим от копий — в этом-то и вся суть.
copy-blank-directive=Массовая печать секретных бланков директив. Тройной расход чернил скопирован безупречно, в отличие от изначального смысла.
copy-carbon-offset-certificate=Ксерокопирование углеродных сертификатов на промышленном принтере. Иронию происходящего здесь оценили все.
copy-form-27b-6=Бланк, который размножается почкованием. Один заходит, шесть выходят. Кафка плачет от зависти.
copy-environmental-impact-report=Отксерокопируйте экологический отчёт до того, как кто-то вчитается в его суть. Шесть абсолютно идентичных оценок одного и того же ущерба.
copy-work-order=Обеспечьте сборочные автоматы бесперебойным потоком нарядов-допусков. Один оригинал, шесть копий.
copy-safety-work-order=Промышленная безопасность в промышленных масштабах. Напечатайте столько нарядов-допусков по ТБ, чтобы хватило на весь цех.
copy-construction-work-order=Штампуйте строительные наряды-допуски пачками, чтобы экспансия не встала из-за нехватки одной подписи.
copy-management-verbal-work-order=Размножьте устное согласование руководства в шести экземплярах. Каждая копия не имеет абсолютно никакой юридической силы.
copy-management-written-work-order=Шесть копий письменного согласования руководства. Каждая нотариально заверена, обязательна к исполнению и неоспорима.
copy-research-grant-work-order=Размножьте наряды-допуски по исследовательским грантам, чтобы в лабораториях никогда не гас свет. Грантовому комитету об этом знать не обязательно.
copy-chemical-handling-work-order=Ксерокопируйте наряды-допуски на химические работы. Безопасность — это просто статистика, а шесть нарядов-допусков безопаснее одного.
copy-radiological-work-order=Ксерокопируйте наряды-допуски на радиологические работы на промышленных скоростях. Каждая копия фонит ровно той же юридической силой, что и оригинал.
office-desk-production=Нервный центр вашей бумажной империи. Если документа нет на этом столе, значит в природе его не существует.
admin-station-production=Приёмная стойка цивилизованного управления. Кусаки выстраиваются в очередь, подают жалобы и — если вы напечатаете им нужные документы — уходят довольными.
union-headquarters-production=Раздутый памятник организованному труду. Первый штаб строится на казначейских облигациях и устных согласованиях, после чего становится бьющимся сердцем всей политики поздних этапов.
propaganda-distillery-production=Завод по производству согласия. Перегоняет политическую жидкость в жидкую ложь, жидкую дезинформацию и прочие побочные продукты эффективного менеджмента.
greenhouse-production=Теплица, обеспечивающая вас двумя столпами бюрократии: древесиной (чтобы делать бумагу) и кофе (чтобы было кому эту бумагу перекладывать).
printer-t1-production=Ваш первый офисный электрический принтер. Медленный, надёжный и вечно готовый зажевать бумагу.
printer-t2-production=Улучшает печатную инфраструктуру функцией ксерокса. Один документ входит, шесть выходят. Требует авторизации от рабочего-кусаки при каждом запуске.
mechanical-printer-production=Ручной станок из доэлектрической эры. Работает медленно, но шестеренки бюрократии начинают крутиться.
pneumatic-pipe-production=Герметичные трубы для быстрой пересылки документов по фабрике. Обычные трубы годятся для жидкостей, а не для юридических текстов.
pneumatic-pipe-to-ground-production=Позволяет пробрасывать пневмотрубы под зданиями и конвейерами. Дальность подземного участка — 16 клеток.
tube-intake-production=Загрузочный люк в пневмосеть. Помещайте документы сюда, и они мгновенно появятся в любом выходном шлюзе.
tube-outtake-production=Пункт выдачи пневмосети. Выставите фильтр, чтобы запрашивать конкретный тип документов.
speed-module=Подготовьте юридическую угрозу, заставляющую станки работать быстрее. Отговорка должна быть достаточно веской, чтобы оправдать огромные счета за электричество.
speed-module-2=Переведите угрозу в статус коллективного иска. Четыре копии первоначальной повестки, приправленные вескими отговорками и продвинутыми микросхемами.
speed-module-3=Федеральная повестка, подкрепленная утверждёнными версиями, должностными полномочиями и всей тяжестью судебной машины. Максимальное юридическое ускорение.
productivity-module=Инициируйте внутреннее расследование, чтобы выжать дополнительную выгоду из каждого производственного цикла. Аудиторы работают тщательно, поэтому всё тормозит.
productivity-module-2=Расширьте зону аудита. Четыре предварительных заключения, скрепленные реальными фактами, обеспечат более глубокую проверку.
productivity-module-3=Полномасштабное федеральное расследование. Четыре предыдущих аудита, официальные обоснования и должностные полномочия сливаются в самый продуктивный — и самый навязчивый — надзор из возможных.
efficiency-module=Измените учет энергии. Некачественный отчёт и моток проводов заставят счётчик электроэнергии показывать именно то, что нужно.
efficiency-module-2=Более смелое бухгалтерское мошенничество. Четыре предыдущие схемы и пара аналитических записок обеспечат гораздо более креативный учет расходов.
efficiency-module-3=Настоящая финансовая пирамида в сфере учета энергии. Четыре модуля креативной бухгалтерии, прикрытие директивой и нужные полномочия — аудиторы ничего не заметят.
union-approval-production=Получите согласование рабочей силы через древний ритуал: жидкий кофе, данные и государственное финансирование. Без согласования профсоюза ничего не сдвинется с места.
treasury-bond-production=Упакуйте деньги налогоплательщиков в торгуемый финансовый инструмент. Приложенная документация абсолютно бесполезна, но юридически обязательна.
government-grant-production=Превратите казначейские облигации в крупный транш финансирования. Потребует устного согласования руководства и отчёта, который всё равно никто не прочитает.
tax-audit=Переквалифицируйте отмытые деньги обратно в легальную выручку. Документы входят грязными, а выходят чистыми — и почему-то размножаются в процессе.
slush-fund-production=Превратите легальные казначейские облигации в неотслеживаемые ликвидные активы. Все абсолютно законно. Не задавайте лишних вопросов.
useless-documentation-production=Официально задокументируйте бесполезность. Получившиеся отходы почему-то обязательны для выпуска финансовых инструментов и подачи типовых заявлений.
compacted-rubble-production=Спрессуйте бюрократические отходы в стандартизированный стройматериал. Сертификат доказывает, что уплотнение прошло с заботой об экологии.
compacted-rubble-electric=Спрессуйте одну единицу избыточного щебня в электрической печи без расхода углеродного сертификата.
charcoal-production=Возобновляемый источник угля, при условии, что у вас стоят теплицы с древесиной. Сертификат покрывает все выбросы в атмосферу.
refined-nonsense-production=Несущая конструкция бюрократии высшего уровня. Возникает, когда физические отходы соединяются с жидкой ложью.
overtime-exemption=Выдайте зданию разрешение на сверхурочную работу после заката. Слоту модуля безразличен ваш баланс работы и личной жизни — ему важны только запасы кофе.

