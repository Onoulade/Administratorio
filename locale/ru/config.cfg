administratorio-enable-working-hours=Включить рабочие часы
administratorio-debug-protest-belts-and-inserters=Протесты у конвейеров и манипуляторов
administratorio-debug-hard-mode=HARD MODE

[mod-setting-description]
administratorio-enable-working-hours=Если включено, рабочие столы клерков и штабы профсоюзов будут закрываться на ночь без разрешения на сверхурочную работу, а центры занятости и кусакопорты откажутся отправлять рабочих без подачи жидкого кофе. Станкам, запускающимся от кусак из центра занятости, личные разрешения на сверхурочную работу не нужны. Отключение настройки полностью удаляет из игры ночные простои, модули сверхурочной работы, соответствующие исследования, подсказки и дневные бонусы к скорости.
administratorio-debug-protest-belts-and-inserters=Если включено, выбор целей забастовок также включает транспортные конвейеры, подземные конвейеры, разделители и манипуляторы. По умолчанию выключено, потому что забастовки становятся заметно шумнее и могут останавливать мелкие элементы логистики во время тестирования.
administratorio-debug-hard-mode=Если включено, бастующие кусаки продолжают накапливать недовольство после обычного порога. Они бастуют при 70 % ёмкости недовольства, а при 100 % выходят из-под контроля как обычные вражеские атакующие, пока пустое обещание не отправит их обратно к стойке.

