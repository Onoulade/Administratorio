[item-description]
bullshit-ore=Природное месторождение чистой, неочищенной чуши. Основа всей бюрократической экономики. Добывайте, очищайте, используйте как оружие.
redundant-rubble=Минерализованные отходы, образующиеся в результате избыточного процедурного надзора. Сами по себе совершенно бесполезны, но юридически необходимы для обязательных официальных документов.
compacted-rubble=Промышленно спрессованные бюрократические отходы, сертифицированные для использования. Изготавливаются из избыточного щебня, переработанного посредством регулируемой плавки с сертификатом углеродной компенсации.
useless-documentation=Избыточный щебень, тщательно обёрнутый слоями бумаги. Официально задокументированная бесполезность. Требуется для стандартизированной подачи документов и финансовых инструментов.
refined-nonsense=Чистый, концентрированный бюрократический абсурд. Создаётся путём слияния спрессованного щебня с жидкой дезинформацией в Пропагандистской перегонной. Основа высокоуровневых административных процессов.
paper=Стандартная бюрократическая основа. Изготавливается из дерева или синтезируется из пластика. Используется для всего: от чистых бланков до записок в Верховный суд.
coffee-bean=Редкий и драгоценный товар. Обнаружен при просеивании компоста. Жизненная сила любой функционирующей бюрократии.

ink=Сырая пишущая жидкость, извлекаемая из угля. Может использоваться для рукописных документов или перерабатываться в картриджи.
blank-form=Пустой административный бланк, ожидающий своего предназначения. Чистый холст бюрократии. Используется почти в каждом рецепте документации.
blank-approval=Предварительно отпечатанный шаблон одобрения, требующий финализации официальными чернилами. Используется для отказов от претензий, разрешений на строительство и транзитных разрешений.
blank-directive=Высокобезопасный шаблон директивы с тройным нанесением чернил. Требуется для одобрений на управленческом уровне.
safety-waiver-draft=Незавершённый отказ от претензий по безопасности, ожидающий проверки на принтере и чернильной печати.
construction-permit-draft=Незавершённое разрешение на строительство, ожидающее проверки на принтере и чернильной печати.
management-verbal-draft=Черновик устного одобрения, извлечённый из разговора в комнате отдыха. Требует финализации на принтере.
management-written-proposal=Управленческое предложение, составленное исполнительным комитетом Штаб-квартиры профсоюза. Требует одного тяжёлого прохода финализации на принтере.
admin-station=Интерфейсная стойка для кусачей. Встроенная зона ожидания показывает, где именно стоят в очереди кусачи; помещайте сюда обратно решённые жалобы, чтобы их удовлетворить. Только хранение — без крафта.
resolution-office=Специализированный офис для обработки жалоб. Занимается подачей, делопроизводством и окончательными решениями.
office-desk=Универсальное рабочее место для бланков, наборов науки, финансовой документации и общих административных задач. Работает в дневные часы, если только не оснащён [item=overtime-exemption].
office-desk-no-working-hours=Универсальное рабочее место для бланков, наборов науки, финансовой документации и общих административных задач.
union-headquarters=Разросшийся комплекс, где обсуждаются одобрения трудовых ресурсов и поздняя политическая работа. Первая копия запускается с казначейских облигаций и устной документации, затем обрабатывает гранты, письменные одобрения, аудиты и работу с политикой. Закрывается ночью, если не оснащена [item=overtime-exemption].
union-headquarters-no-working-hours=Разросшийся комплекс, где обсуждаются одобрения трудовых ресурсов и поздняя политическая работа. Первая копия запускается с казначейских облигаций и устной документации, затем обрабатывает гранты, письменные одобрения, аудиты и работу с политикой.
propaganda-distillery=Специализированное предприятие для обработки административных жидкостей. Очищает политическую жидкость в жидкую ложь, синтезирует дезинформацию и производит полномочия.
administrative-science-pack=Набор серой науки. Питает административные исследования. Создаётся за административным офисным столом.
taxpayer-money=Заработанная тяжёлым трудом валюта, извлечённая из решённых жалоб кусачей. Основной источник финансирования государственных операций.
treasury-bond=Финансовый инструмент с государственной поддержкой. Сочетает деньги налогоплательщиков с бесполезной документацией. Используется в высокоуровневом строительстве и политике.
government-grant=Значительное выделение государственных средств. Используется для поздней работы с политикой, продвинутого делопроизводства по жалобам и другой бюрократии высокого уровня.
job-offer=Официальный трудовой договор. Поместите в стойку администрирования — когда жалобы кусача полностью разрешены, он заберёт предложение о работе и станет рабочим вместо того, чтобы уйти. Более крупные кусачи производят больше рабочих.
biter-worker=Одомашненный кусач-сотрудник. Требуется для строительства административных зданий. Производится путём найма решённых кусачей через предложения о работе.
biter-logistics-formation=Рабочий кусач, обученный специально для строительства кусачепортов и логистики через сундуки запросов.
biterport=Аналог робопорта для пеших рабочих. Хранит до 8 логистических рабочих кусачей и финансирование налогоплательщиков, затем отправляет ходячих кусачей на строительные и логистические работы внутри соединённых зон кусачепортов. Ночью отправки также требуют жидкого кофе через любой из четырёх боковых трубопроводных входов.
rideable-biter=Ездовой кусач, переназначенный на службу личного транспорта. Сжигает деньги налогоплательщиков во время движения, перевозит лишь крошечную сумочку груза и не может быть подобран после размещения. Если оставить без финансирования на 10 минут, становится обычным кусачом и подаёт жалобу.
union-delegate=Рабочий кусач, обученный как представитель профсоюза. Требуется для строительства Штаб-квартиры профсоюза.
chemical-operator=Специализированный рабочий, сертифицированный для работы с опасными химикатами. Требуется для химических заводов.
nuclear-technician=Специализированный рабочий, обученный радиологическим операциям. Требуется для ядерных реакторов и центрифуг.
formation-center=Специализированное учебное заведение 5x5 для всех назначений рабочих кусачей, логистических рабочих и сертификации специалистов.
field-office=Импровизированный бюрократический форпост. Призывает кусачей из гнёзд в радиусе 100 клеток — один рабочий за цикл крафта. Работает только пока кусач на месте. Нулевое загрязнение во время работы.
biter-station=Хранит рабочих кусачей и финансирование налогоплательщиков, затем отправляет рабочих, чтобы активировать ближайшие управляемые здания. Ночью отправки также требуют жидкого кофе через любой из четырёх боковых трубопроводных входов. Каждая активированная машина может выполнить один крафт перед тем, как потребуется новый визит.
transit-authorization=Официальная документация на проезд (форма 12-Т). Помещается в сундук транзитных разрешений на ж/д остановке. Один расходуется при каждом прибытии — лимит поездов станции равен количеству бланков в сундуке.
greenhouse=Климатически контролируемое выращивающее предприятие. Производит дерево из воды, а при правильных входных материалах — редкие кофейные зёрна.

pneumatic-pipe=Запечатанная труба манильского цвета для транспортировки сжиженной документации. НЕ соединяется с обычными жидкостными трубами.
pneumatic-pipe-to-ground=Подземная пневматическая труба для прокладки документации под зданиями. НЕ соединяется с обычными жидкостными трубами.
tube-intake=Принимает действительные предметы документации для мгновенной пневматической транспортировки. Размещайте предметы рядом; скрытый манипулятор автоматически загружает их в приёмник.
tube-outtake=Выдаёт предметы документации из пневматической сигнальной сети. Используйте свой манипулятор или логистику для извлечения предметов из выходного сундука.
transit-permit-chest=Сундук, автоматически размещаемый на ж/д остановках. Загружайте сюда транзитные разрешения — одно расходуется при каждом прибытии поезда. Лимит поездов станции равен количеству бланков. Доступен для манипуляторов и логистики.

safety-work-order=Объединённое разрешение для сборщиков на регулируемое производство уровня безопасности. Используется только сборочными машинами. Расходуется при использовании.
construction-work-order=Объединённое разрешение для сборщиков на регулируемое производство строительного уровня. Используется только сборочными машинами. Расходуется при использовании.
management-verbal-work-order=Объединённое разрешение для сборщиков, подкреплённое устным обещанием менеджера. Используется только сборочными машинами. Расходуется при использовании.
management-written-work-order=Объединённое разрешение для сборщиков, подкреплённое подписанной управленческой директивой. Используется только сборочными машинами. Расходуется при использовании.
research-grant-work-order=Объединённое разрешение для сборщиков на производство научных исследований. Используется только сборочными машинами. Расходуется при использовании.
chemical-handling-work-order=Специальный операционный рабочий наряд для химических заводов. Создаётся из документации по безопасности и экологии плюс оборудования. Расходуется в каждом рецепте химии.
radiological-work-order=Высокобезопасный операционный рабочий наряд для центрифуг и радиологической обработки. Создаётся из химической документации и письменного управленческого одобрения. Расходуется в рецептах центрифугирования.

carbon-offset-certificate-basic=Базовый сертификат, разрешающий ограниченную промышленную плавку. Расходуется в рецептах пакетной плавки в печах.
carbon-offset-certificate-verified=Усовершенствованный сертификат с официальным подтверждением. Выдаётся через цепочку соответствия офисного стола для строительства стальной печи и продвинутой плавки.

work-order=Базовое разрешение сборщика для регулируемых рецептов крафта. Используется только сборочными машинами и для сборки документации сборщиков более высокого уровня.
form-27b-6=Печально известная стандартизированная форма заявок. Используется в транзитной документации, отчётности о соответствии и бюрократии высокого уровня.
safety-waiver=Документ, освобождающий администраторию от всякой ответственности. Требуется для строительства объектов уровня T1 и для сборки более тяжёлых операционных разрешений.
environmental-impact-report=Всеобъемлющая (хотя и сильно отредактированная) оценка экологического ущерба. Используется для выдачи документации по обращению с химикатами и радиологической операционной документации.
management-approval-verbal=Устное согласие менеджера, технически обязательное, но легко отрицаемое. Для извлечения требуется кофе.
management-approval-written=Подписанное, нотариально заверенное управленческое обязательство. Гораздо труднее получить, но невозможно отрицать.
research-grant-approval=Базовое разрешение исследовательского гранта. Требуется для производства всех наборов науки. Простое, но необходимое.
provisional-approval=Бюрократический допуск начального уровня. Требуется для каменных печей и горелочного оборудования. Ваш первый вкус избыточного щебня.

filing-l=Официально поданная жалоба на ландшафт. Первый шаг в разрешении жалобы гражданина на местные пейзажи.
filing-s=Официально поданная жалоба на смог. Документирует возражение гражданина против промышленного загрязнения воздуха.
filing-n=Официально поданная жалоба на шум. Регистрирует жалобу гражданина на шумовые помехи от вашей инфраструктуры.
filing-u=Официально поданная жалоба на безработицу. Самая серьёзная жалоба граждан, утверждающая системный экономический провал.
filing-lt=Официально поданная жалоба на загрязнение. Документирует возражение плевака против лужиц кислоты, оставленных повсюду.
filing-h=Официально поданная жалоба на опасные вещества. Регистрирует жалобу плевака на воздействие опасных материалов.
filing-lo=Официально поданная жалоба на праздношатание. Документирует возражение плевака против нарушений запретных зон.
filing-v=Официально поданная жалоба на бродяжничество. Самая серьёзная жалоба плеваков, утверждающая о вытеснении и бездомности.

case-s=Подтверждённое юридическое дело о нарушении смога.
case-n=Подтверждённое юридическое дело о нарушении шума.
case-u=Подтверждённое юридическое дело о безработице.
case-h=Подтверждённое юридическое дело о нарушении обращения с опасными веществами.
case-lo=Подтверждённое юридическое дело о нарушении праздношатания.
case-v=Подтверждённое юридическое дело о бродяжничестве.

brief-n=Устаревшая записка в Верховный суд из старой системы обработки жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-u=Устаревшая записка в Верховный суд из старой системы обработки жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-lo=Устаревшая записка в Верховный суд из старой системы обработки жалоб. Сохраняется только для совместимости с существующими сохранениями.
brief-v=Устаревшая записка в Верховный суд из старой системы обработки жалоб. Сохраняется только для совместимости с существующими сохранениями.

construction-permit=Стандартное разрешение на строительство. Требуется как ингредиент в большинстве рецептов зданий и в более тяжёлых операционных разрешениях.

dubious-data=Очищены из руды чуши. Ненадёжные, но технически считаются информацией. Основа экономики отговорок.
basic-excuse=Простое обоснование, собранное из сомнительных данных. Используется в разрешении ландшафтных дел и низкоуровневых бюрократических процессах.
crappy-report=Наспех составленный отчёт сомнительной точности. Основа для всей документации более высокого уровня.
credentials=Официальные полномочия, произведённые из жидкой лжи, сомнительных данных и очищенной бессмыслицы. Доказательство власти, каким бы сомнительным ни был источник.
data=Синтезированы из дрянных отчётов и полномочий. Реально пригодная информация. Редкий товар в этой администратории.
good-excuse=Хорошо составленное обоснование, смешивающее реальные данные с жидкой ложью. Используется в одобрениях высокого уровня и построении нарративов.
justification=Формальное юридическое обоснование, построенное из дезинформации, полномочий и политической жидкости. Используется в очистке от нарушений охраны труда.
narrative=Официальная история, сотканная из обоснований, хороших отговорок и очищенной бессмыслицы. Контролирует общественное восприятие вашей администратории.
white-paper=Авторитетный политический документ, смешивающий данные, ложь и казначейски обеспеченную бессмыслицу. Основа государственной политики.
policy=Директива, составленная на бесконечных совещаниях. Требует белые книги, дезинформацию, данные и государственные гранты.
regulation=Федеральное предписание, составленное путём исчерпывающего бюрократического процесса. Высшее выражение правительственной власти.
promise=Метаемая капсула, содержащая бюрократическое обещание. Бросьте в протестующего кусача, чтобы временно его утихомирить.
eviction-notice=Метаемая капсула, разрушающая структуры кусачей. Используйте с предельной осторожностью.
hush-money=Сумка денег налогоплательщиков, бросаемая в гнёзда кусачей, чтобы они молчали. Предотвращает спавн на 3 минуты. Зелёный смог не гарантированно нетоксичен.
hired-biter-capsule=Полностью аккредитованный бегемотовый кусач — полевой офицер. Разместите его, выберите Приказом о развёртывании и позвольте логистике пополнять его скрытый запас уведомлений о выселении.
hired-biter-command-capsule=Полевой пульт для полевых агентов. Кликайте по агентам, чтобы выбрать или снять выбор, правый клик по карте — отправить их туда, Shift+правый клик — добавить путевую точку. Правый клик по сундуку с уведомлениями отправит агентов туда для пополнения запаса.

resolved-landscape=Полностью решённая жалоба на ландшафт. Доказательство того, что система работает (иногда).
resolved-smog=Полностью решённая жалоба на смог. Потребовалось значительное количество дезинформации и кофе.
resolved-noise=Полностью решённая жалоба на шум. Потребовалось подтверждённое дело, стек политики, кофе, нарративы и полномочия.
resolved-unemployment=Полностью решённая жалоба на безработицу. Вершина бюрократических достижений. Вы решили проблему безработицы.
resolved-littering=Полностью решённая жалоба на загрязнение. Лужицы кислоты официально переклассифицированы как декоративные элементы.
resolved-hazmat=Полностью решённая жалоба на опасные вещества. Потребовались доказательства из спрессованного щебня, дезинформация и кофе.
resolved-loitering=Полностью решённая жалоба на праздношатание. Потребовалось подтверждённое дело, предписания, кофе, нарративы и полномочия.
resolved-vagrancy=Полностью решённая жалоба на бродяжничество. Высшее бюрократическое достижение для плеваков. Вы решили проблему бездомности.

ticket-landscape=Жалоба гражданина на разрушение ландшафта. Создаётся малыми кусачами на стойках администрирования.
ticket-smog=Жалоба гражданина на загрязнение воздуха. Создаётся средними или более крупными кусачами.
ticket-noise=Жалоба гражданина на шумовое загрязнение. Создаётся большими или более крупными кусачами.
ticket-unemployment=Жалоба гражданина на безработицу. Создаётся только бегемотовыми кусачами.
ticket-littering=Жалоба плевака на засорение лужицами кислоты. Создаётся малыми плеваками на стойках администрирования.
ticket-hazmat=Жалоба плевака на воздействие опасных материалов. Создаётся средними или более крупными плеваками.
ticket-loitering=Жалоба плевака на нарушения запретных зон. Создаётся большими или более крупными плеваками.
ticket-vagrancy=Жалоба плевака на вытеснение и бездомность. Создаётся только бегемотовыми плеваками.

printer-t1=Базовый электрический принтер. Медленный, но надёжный. Производит печатные документы из чернильных картриджей.
printer-t2=Высокоскоростной промышленный принтер с режимом копирования. Может дублировать документы: 1 оригинал производит 6 копий. Требует визита рабочего кусача из ближайшей биржи труда для авторизации каждого крафта.
mechanical-printer=Принтер с ручным приводом. Ваша рабочая лошадка, пока вы не разблокируете электрическую печать.



speed-module=Ускоряет скорость крафта машины на 20% за счёт 50% дополнительного потребления энергии.
speed-module-2=Ускоряет скорость крафта машины на 30% за счёт 70% дополнительного потребления энергии.
speed-module-3=Ускоряет скорость крафта машины на 50% за счёт 100% дополнительного потребления энергии.
productivity-module=Обеспечивает 4% бонус к производительности. Замедляет машины и увеличивает энергопотребление и загрязнение.
productivity-module-2=Обеспечивает 6% бонус к производительности. Замедляет машины и увеличивает энергопотребление и загрязнение.
productivity-module-3=Обеспечивает 10% бонус к производительности. Замедляет машины и увеличивает энергопотребление и загрязнение.
efficiency-module=Снижает потребление энергии на 30%.
efficiency-module-2=Снижает потребление энергии на 40%.
efficiency-module-3=Снижает потребление энергии на 50%.

corporate-breakroom=Социальный центр, где кофе питает мельницу слухов. Производит сплетни у кулера, хорошие отговорки и черновики устных управленческих одобрений. Закрывается ночью, если не оснащена [item=overtime-exemption].
osha-violation=Нарушение охраны труда, образующееся из-за опасных промышленных процессов. Можно очистить или переработать через Штаб-квартиру профсоюза.
watercooler-gossip=Неформальная разведка, собранная вокруг кулера. Необходима для корпоративного принятия решений.
office-drama=Межличностный конфликт, образующийся как побочный продукт офисных сплетен. Можно переработать в комнате отдыха в случайные рабочие наряды, сплетни и базовые отговорки.




