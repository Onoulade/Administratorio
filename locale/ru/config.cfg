[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Добро пожаловать в Administratorio![/font]\n\nЭто [font=default-bold]мод полного преобразования[/font], заменяющий военные конфликты Factorio бюрократическим управлением. Жуки больше не атакуют ваши стены. Их перехватывают, регистрируют и превращают в [item=ticket-landscape] жалобы на вашем [entity=admin-station] Столе Администрации Жуков.\n\n[font=default-bold]Ключевые отличия от ванильной игры:[/font]\n• [color=red]Никакой военной техники[/color] — оружие, турели и военная наука удалены\n• [color=green]Делопроизводство блокирует всё[/color] — машины, плавка, жидкости и исследования потребляют формы\n• [color=green]Граждане заменяют рейды[/color] — жуки становятся источниками очередей жалоб вместо боевых целей\n• [color=green]Предметы для бросания являются административными[/color] — [item=promise] обещания успокаивают протестующих, а [item=eviction-notice] уведомления о выселении расчищают логова, создавая больше бумажной работы\n• [color=green]Рабочие часы имеют значение[/color] — некоторые здания закрываются ночью, если не легализовать сверхурочную работу\n\nВаша цель: провести дерево жалоб жуков через [technology=constitutional-law] Конституционное Право, а дерево жалоб плевалок — через [technology=vagrancy-ordinances] Нормативы по Бездомности, сохраняя офис достаточно функциональным, чтобы задолженность не взбунтовалась.

administratorio-paperwork=[font=default-bold]Бумага — основа всей бюрократии.[/font]\n\n[item=paper] Бумага начинается как дерево, а [item=ink] чернила перерабатываются из угля. После исследования [technology=synthetic-stationery] вы также можете синтезировать бумагу напрямую из [item=plastic-bar] пластика, [item=sulfur] серы и воды — намного быстрее, но значительно более ресурсозатратно.\n\n[font=default-bold]Принтеры:[/font]\n• [entity=mechanical-printer] [font=default-bold]Механический Принтер[/font] — вы начинаете с одним на месте крушения для первых печатных форм\n• [entity=printer-t1] [font=default-bold]Принтер T1[/font] — электрическая печать для рутинного производства форм\n• [entity=printer-t2] [font=default-bold]Принтер T2[/font] — более быстрая печать плюс рецепты массового копирования, открытые с [technology=industrial-printing]\n\n[font=default-bold]Ключевые формы:[/font]\n• [item=blank-form] Чистый Бланк — основа для большинства административного делопроизводства\n• [item=blank-approval] Чистый Бланк Согласования — шаблон для актов об отказе, разрешений и транзитных форм\n• [item=form-27b-6] Форма 27Б-6 — стандартизированная форма заявки для железнодорожных документов и соответствия\n• [item=carbon-offset-certificate-basic] Сертификат Углеродного Компенсирования — необходим для партийной плавки

administratorio-regulation=[font=default-bold]Крафт сборщика и рецепты строительства обёрнуты в систему уровней форм.[/font]\n\n[font=default-bold]Система уровней:[/font]\n• [color=green]T0[/color] [item=work-order] Наряд на Работу — только сборщик, базовые утилитарные предметы\n• [color=green]T1[/color] [item=safety-waiver] Акт об Отказе / [item=safety-work-order] Наряд на Безопасность — манипуляторы, радар, стены, столбы, котёл и СМ1\n• [color=yellow]T2[/color] [item=construction-permit] Разрешение на Строительство / [item=construction-work-order] Наряд на Строительство — печи, добывающие буры, насосы, СМ2, тяжёлые промышленные рецепты строительства и работы по сносу\n• [color=yellow]T3[/color] [item=management-approval-verbal] Устное Согласование Руководства / [item=management-verbal-work-order] Устный Наряд Руководства — рельсы, робопорты, личные робопорты, робологистика, солнечные панели, аккумуляторы\n• [color=red]T4[/color] [item=management-approval-written] Письменное Согласование Руководства / [item=management-written-work-order] Письменный Наряд Руководства — СМ3, маяк, ракетная шахта, ядерная поддержка и другие мегапроекты\n• [item=research-grant-approval] Согласование Исследовательского Гранта — все научные наборы\n\n[font=default-bold]Важно:[/font]\n[item=work-order] Наряды на Работу и их уровневые варианты используются только рецептами сборочных машин. Печи, нефтеперегонные заводы, химия и центрифугирование используют отдельные эксплуатационные документы.\n\n[font=default-bold]Ручной крафт:[/font]\nТолько рецепты, доступные с самого начала или открытые технологией уровня красной науки, можно изготовить вручную. Более поздние регламентированные рецепты скрыты от крафта игрока и должны быть автоматизированы.

administratorio-operating-paperwork=[font=default-bold]Не каждая машина работает на документах сборщика.[/font]\n\n[font=default-bold]С первого дня:[/font]\n• [item=carbon-offset-certificate-basic] Сертификат Углеродного Компенсирования — печи и плавка\n\n[font=default-bold]Последующие специализированные документы:[/font]\n• [item=petrochemical-operating-permit] Нефтехимическое Разрешение на Эксплуатацию — базовый запуск нефтеперегонного завода плюс простая нефтехимия: твёрдое топливо, пластик, сера и серная кислота\n• [item=chemical-handling-work-order] Наряд на Работу с Химикатами — химические заводы, продвинутая переработка, сжижение угля и более тяжёлая химия\n• [item=radiological-work-order] Радиологический Наряд — центрифуги и рецепты центрифугирования\n\nЭти специализированные формы создаются из согласований нижнего уровня: [item=safety-waiver] Актов об Отказе, [item=form-27b-6] Формы 27Б-6, [item=environmental-impact-report] Отчётов об Экологическом Воздействии и последующих согласований руководства. Жалобы остаются в цепочке урегулирования. Они финансируют и косвенно открывают бюрократию, но не расходуются этими эксплуатационными формами.

administratorio-biter-complaints=[font=default-bold]Столы администрации — это стойка регистрации всего мода.[/font]\n\nВражеские юниты, которые обычно атакуют, перенаправляются в вашу очередь [entity=admin-station]. Зарегистрированные жуки становятся нейтральными, занимают один из [font=default-bold]4 слотов ожидания станции (расширяемых до 12 через исследования)[/font] и генерируют предметы-тикеты жалоб в инвентаре стола.\n\n[font=default-bold]Основной цикл:[/font]\n1. Постройте [entity=admin-station] и дайте ему место для хранения предметов жалоб\n2. Позвольте жукам и плевалкам войти в центральную зону ожидания и зарегистрироваться\n3. Извлеките тикеты жалоб из стола и обработайте их через цепочку [entity=resolution-office]\n4. Поместите обратно в стол соответствующий итоговый предмет [item=resolved-landscape]\n5. Гражданин уходит и выплачивает [item=taxpayer-money] Деньги Налогоплательщиков\n\n[font=default-bold]Семейства жалоб:[/font]\n• Жуки: пейзаж → смог → шум → безработица\n• Плевалки: мусор → опасные вещества → бродяжничество → бездомность\nБольшие враги могут получать жалобы более высокого уровня, и игра предупреждает вас до того, как эволюция сделает эти новые уровни значимыми.\n\n[font=default-bold]Масштабирование:[/font]\nКаждый стол также выводит сигналы схемы для количества жалоб, свободных слотов и общего числа ожидающих жуков, чтобы вы могли следить за задолженностью и добавлять мощности до начала протестов.

administratorio-frustration=[font=default-bold]Ожидающие жуки идут на таймере.[/font]\n\nКаждый зарегистрированный жук отслеживает собственное недовольство во время ожидания или прогулки к столу. Наведите курсор на жука, чтобы проверить его текущее настроение и неурегулированные жалобы.\n\n[font=default-bold]Уровни недовольства:[/font]\n• [color=green]0–25%[/color] — Спокойный\n• [color=yellow]25–50%[/color] — Раздражённый\n• [color=yellow]50–75%[/color] — Злой\n• [color=red]75–100%[/color] — Яростный\nПри [color=red]100%[/color] недовольства жук покидает очередь и начинает протестовать. Жуки, не нашедшие свободного места в столе, также могут сразу начать протестовать вместо того, чтобы вставать в очередь.\n\n[font=default-bold]Важно:[/font]\nУровень жалобы определяется типом врага и прогрессом технологий, [color=red]а не[/color] недовольством. Недовольство лишь показывает, как близко вы к отключению зданий.\n\n[font=default-bold]Как оставаться в плюсе:[/font]\nБольше столов [entity=admin-station] снижает переполнение очереди. Больше [entity=resolution-office] Отделов Урегулирования и пропускная способность делопроизводства сокращают время урегулирования. При расширении с помощью [item=eviction-notice] Уведомлений о Выселении помните, что перемещённые жуки прибывают уже наполовину разочарованными.

administratorio-protest-resolution=[font=default-bold]Протест — это живое отключение, а не просто предупреждение.[/font]\n\nКогда недовольство достигает максимума, жук выбирает доступное здание игрока, идёт туда и [color=red]отключает его[/color]. Активные протесты вызывают предупреждения, метки на карте и сирены. Разрешения на сверхурочную работу [color=red]не[/color] защищают здания от отключений при протестах.\n\n[font=default-bold]Ваш инструмент против протестов:[/font]\n[item=promise] [font=default-bold]Бюрократическое Обещание[/font] — это бросаемая капсула, доступная с начала игры. Бросайте её в [font=default-bold]протестующего жука[/font], а не в здание.\n• Если слот стола свободен, жук немедленно перенаправляется обратно в ближайшую очередь\n• Если свободных слотов нет, жук становится [font=default-bold]успокоенным[/font] на 60 секунд, затем возобновляет протест, если мощность так и не освободилась\n• Обещание [color=red]не[/color] стирает жалобу и не сбрасывает частичный прогресс дела\n\n[font=default-bold]Постоянное исправление:[/font]\nОбещания выигрывают время. Окончание жалобы и возврат итогового урегулированного предмета в стол — вот что действительно убирает гражданина из системы.

administratorio-nest-expropriation=[font=default-bold]Уведомления о Выселении — ваш инструмент расширения.[/font]\n\nИсследуйте [technology=nest-expropriation] Экспроприацию Логов для изготовления [item=eviction-notice] Уведомлений о Выселении. Бросьте одно на вражескую территорию, и оно уничтожит ближайшее вражеское логово или спаунер в зоне поражения.\n\n[font=default-bold]Подводный камень:[/font]\nБлижайшие враждебные юниты примерно в [font=default-bold]25 клетках[/font] не убиваются. Они [color=red]перемещаются в вашу систему жалоб[/color] с [font=default-bold]начальным недовольством 50%[/font]. Если у вас нет свободных мест в столе, эти перемещённые жуки могут сразу начать протестовать.\n\nИспользуйте выселения, когда вам нужна земля, но относитесь к ним как к всплеску административной нагрузки. Расчищайте территорию только тогда, когда ваши столы, отделы урегулирования и конвейер делопроизводства могут поглотить перемещённую очередь.

administratorio-hush-money=[font=default-bold]Деньги для Затыкания Рта дают вам время вблизи логов жуков.[/font]\n\nИсследуйте [technology=nest-pacification] Умиротворение Логов для изготовления [item=hush-money] Денег для Затыкания Рта. Бросьте вблизи логова жуков, чтобы временно [color=green]прекратить появление новых особей[/color] на [font=default-bold]3 минуты[/font].\n\n[font=default-bold]Как это работает:[/font]\n• Капсула уничтожает все спаунеры в радиусе действия\n• Зелёный [font=default-bold]денежный смог[/font] отмечает затронутую зону\n• Призрачный контур показывает, где стоял каждый спаунер\n• [color=red]Нельзя строить[/color] на месте спаунера — оно зарезервировано\n• Через 3 минуты спаунер возвращается автоматически\n\n[font=default-bold]Когда использовать:[/font]\nДеньги для затыкания рта дешевле, чем уведомления о выселении, и не заполняют очередь жалоб перемещёнными жуками. Используйте их, когда вам нужен безопасный проход через вражескую территорию — разведка, прокладка рельсов или выигрыш времени, пока конвейер делопроизводства наверстывает.\n\n[font=default-bold]Стоимость:[/font]\n50 [item=taxpayer-money] Денег Налогоплательщиков, 1 [item=form-27b-6] Форма 27Б-6 и 1 [item=useless-documentation] Бесполезная Документация за капсулу. Деньги налогоплательщиков в начале игры редки, поэтому используйте их мудро.

administratorio-propaganda-distillery=[font=default-bold]Пропагандный Перегонный Завод перерабатывает все административные жидкости.[/font]\n\nОткрыт с помощью [font=default-bold]Промышленной Пропаганды[/font], это здание заменяет химическую обработку бюрократических жидкостей.\n\n[font=default-bold]Ключевые рецепты:[/font]\n• [fluid=politician-fluid] Флюид Политиканства → [fluid=lie] Жидкая Ложь\n• [fluid=lie] Ложь + [item=dubious-data] Сомнительные Данные → [fluid=misinformation] Дезинформация\n• [fluid=lie] Ложь + [item=dubious-data] Сомнительные Данные + [item=refined-nonsense] Очищенный Абсурд → [item=credentials] Удостоверения\n• [item=compacted-rubble] Спрессованный Щебень + [fluid=misinformation] Дезинформация → [item=refined-nonsense] Очищенный Абсурд\n• [item=treasury-bond] Государственные Облигации + ложь → [fluid=slush-fund] Тайные Фонды\n\nХимические заводы и нефтеперегонные заводы [color=red]не[/color] обрабатывают эти рецепты. Вся переработка лжи, дезинформации и тайных фондов проходит через Пропагандный Перегонный Завод.

administratorio-complaint-chain=[font=default-bold]Жалобы эскалируются поэтапно.[/font]\n\nВся обработка жалоб происходит в [entity=resolution-office]. Ранние уровни — короткие цепочки; более поздние вырастают в делопроизводство, а затем в единое тяжёлое окончательное решение вместо дополнительных промежуточных стадий.\n\n[font=default-bold]Жалобы жуков:[/font]\n[item=ticket-landscape] Тикет → [item=filing-l] Подача → урегулировано\n[item=ticket-smog] Тикет → [item=filing-s] Подача → [item=case-s] Дело → урегулировано\n[item=ticket-noise] Тикет → [item=filing-n] Подача → [item=case-n] Дело → урегулировано\n[item=ticket-unemployment] Тикет → [item=filing-u] Подача → [item=case-u] Дело → урегулировано\n\n[font=default-bold]Жалобы плевалок:[/font]\n[item=ticket-littering] Тикет → [item=filing-lt] Подача → урегулировано\n[item=ticket-hazmat] Тикет → [item=filing-h] Подача → [item=case-h] Дело → урегулировано\n[item=ticket-loitering] Тикет → [item=filing-lo] Подача → [item=case-lo] Дело → урегулировано\n[item=ticket-vagrancy] Тикет → [item=filing-v] Подача → [item=case-v] Дело → урегулировано\n\n[font=default-bold]Разделение позднего этапа:[/font]\nЖалобы жуков завершаются через [technology=noise-ordinances] и [technology=constitutional-law]. Жалобы плевалок завершаются через [technology=loitering-ordinances] и [technology=vagrancy-ordinances]. Когда цепочка завершена, верните итоговый урегулированный предмет в стол, обслуживающий этого жука, для выплаты и освобождения.

administratorio-pneumatic-transport=[font=default-bold]Мгновенно перемещайте документы через запечатанные манильские трубы.[/font]\n\nСистема пневматических труб транспортирует бумажные предметы через скрытую сигнальную цепочку — предметы входят с одного конца и мгновенно появляются с другого:\n\n[font=default-bold]Здания:[/font]\n• [entity=tube-intake] [font=default-bold]Приёмник Трубы[/font] — поглощает действительные бумажные предметы с соседней ленты/сундука через скрытый манипулятор\n• [entity=tube-outtake] [font=default-bold]Выдатчик Трубы[/font] — выдаёт предметы из сигнального пула; используйте собственный манипулятор или логистику для извлечения\n• [entity=pneumatic-pipe] [font=default-bold]Пневматическая Труба[/font] — манильского цвета, соединяет приёмники с выдатчиками\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Подземная Пневматическая Труба[/font] — диапазон 16 клеток\n\n[font=default-bold]Как это работает:[/font]\nПриёмные станции имеют скрытый манипулятор, который извлекает только действительные бумажные предметы с соседних лент или из сундуков. Станции выдачи являются контейнерами — используйте собственный манипулятор или логистику для извлечения предметов. Установите фильтр в ячейку инвентаря выдатчика для запроса конкретного типа предметов.\n\nПневматические трубы определяют сигнальную сеть — любые приёмники и выдатчики, соединённые трубами, мгновенно делятся предметами. Несколько типов предметов могут течь через одну трубную сеть (суши-транспорт). Каждая сеть имеет ограничение вместимости, которое можно увеличить через исследования.\n\nПневматические трубы используют отдельную категорию соединений — они [color=red]не могут[/color] подключаться к обычным трубам для жидкостей.\n\nНаведите курсор на любой приёмник или выдатчик трубы, чтобы увидеть живую панель статуса с информацией о сетевом соединении, использовании вместимости и содержимом предметов.\n\nОткрыто исследованием [font=default-bold]Пневматической Транспортировки Форм[/font] после [font=default-bold]Технологии Печати[/font] и [font=default-bold]Логистической Науки[/font].

administratorio-bullshit-economy=[font=default-bold]Руда Чепухи питает всю цепочку поставок сертификатов и отмазок.[/font]\n\nДобывайте [item=bullshit-ore] Руду Чепухи для производства:\n• [item=dubious-data] Сомнительных Данных (переработанных из руды)\n• [item=basic-excuse] Базовой Отмазки → [item=good-excuse] Убедительной Отмазки\n• [item=crappy-report] Скверного Отчёта → [item=justification] Обоснования → [item=narrative] Нарратива\n• [item=white-paper] Белой Книги → [item=policy] Директивы Политики → [item=regulation] Регламента\n\n[font=default-bold]Производные Избыточного Щебня:[/font]\n[item=redundant-rubble] Избыточный Щебень перерабатывается в три уровня производных:\n• [item=useless-documentation] [font=default-bold]Бесполезная Документация[/font] — щебень + бумага, используется в Форме 27Б-6 и государственных облигациях\n• [item=compacted-rubble] [font=default-bold]Спрессованный Щебень[/font] — щебень + углеродный сертификат, используется в строительстве и поздних рецептах\n• [item=refined-nonsense] [font=default-bold]Очищенный Абсурд[/font] — спрессованный щебень + дезинформация, используется в удостоверениях, нарративах и урегулированиях высшего уровня\n\n[font=default-bold]Цепочка государственного финансирования:[/font]\n[item=taxpayer-money] Деньги Налогоплательщиков (от урегулирования жалоб жуков) → [item=treasury-bond] Государственная Облигация → [fluid=slush-fund] Тайный Фонд → [item=taxpayer-money] Больше Денег Налогоплательщиков\n\nДеньги налогоплательщиков — критическое узкое место. Бюрократы позднего этапа также могут проводить [font=default-bold]Налоговые Проверки[/font] в [entity=union-headquarters] Штаб-квартире Профсоюза, чтобы превратить тайные фонды, базовые документы облигаций и данные в дополнительное финансирование.\n\n[font=default-bold]Многозданиевая производственная цепочка:[/font]\n• [entity=office-desk] Рабочий Стол: формы, научные наборы, данные, государственные облигации, верифицированные сертификаты, экологические отчёты и разрешения нефтеперегонного завода\n• [entity=corporate-breakroom] Комната Отдыха: кофе, сплетни, убедительные отмазки, черновики устных согласований\n• [entity=union-headquarters] Штаб-квартира Профсоюза: одобрения профсоюза, правительственные гранты, нарративы, письменные согласования, белые книги, политика, регламент и налоговые проверки\n• [entity=propaganda-distillery] Перегонный Завод: ложь, дезинформация, удостоверения, тайные фонды, очищенный абсурд

administratorio-transit-authorization=[font=default-bold]Остановки поездов имеют встроенный сундук для документов.[/font]\n\nКаждая [entity=train-stop] Остановка Поезда теперь требует форм [item=transit-authorization] Транзитного Разрешения (Форма 12-Т) для работы.\n\n[font=default-bold]Как это работает:[/font]\n1. Каждая Остановка Поезда получает встроенный [entity=transit-permit-chest] сундук транзитных разрешений.\n2. Вставьте [item=transit-authorization] Транзитные Разрешения в этот сундук.\n3. Одна форма [font=default-bold]расходуется при прибытии поезда[/font] и начале его ожидания на станции.\n4. Если станция исчерпывает формы, она автоматически закрывается, устанавливая лимит поездов в 0.\n\n[font=default-bold]Настройка:[/font]\n• Исследуйте технологию [font=default-bold]Железной Дороги[/font], чтобы открыть рецепт форм.\n• Изготавливайте формы на [entity=office-desk] Административном Рабочем Столе.\n• Поддерживайте запас форм на станциях с помощью лент, манипуляторов или логистики, чтобы занятые узлы не останавливались.\n\nЭта система делает железнодорожную логистику ещё одной бумажной проблемой вместо боевой.

administratorio-admin-science=[font=default-bold]Административная Наука питает ваше бюрократическое расширение.[/font]\n\nАдминистративные исследования требуют [item=administrative-science-pack] Административного Набора Науки (Серого). Этот набор — узкое место для большинства технологий бюрократии.\n\n[font=default-bold]Производство:[/font]\nПроизводится на [entity=office-desk] Административном Рабочем Столе из:\n• [item=blank-form] Чистого Бланка\n• [item=provisional-approval] Предварительного Согласования\n• [item=basic-excuse] Базовой Отмазки\n• [item=research-grant-approval] Согласования Исследовательского Гранта\n\n[font=default-bold]Применение:[/font]\nЭтот набор заменяет военную науку в затратах на ванильные исследования и также используется во всём пользовательском дереве технологий. Если ваш конвейер делопроизводства останавливается, ваши исследования останавливаются вместе с ним.

administratorio-working-hours=[font=default-bold]Некоторые административные здания теперь соблюдают рабочие часы.[/font]\n\n[entity=office-desk] Рабочий Стол, [entity=corporate-breakroom] Корпоративная Комната Отдыха и [entity=union-headquarters] Штаб-квартира Профсоюза закрываются ночью, если в них не установлен [item=overtime-exemption] Модуль Разрешения на Сверхурочную Работу.\n\n[font=default-bold]Как работают ночные смены:[/font]\n• Исследуйте [technology=after-hours-operations], чтобы открыть модуль\n• Установите [font=default-bold]один[/font] экземпляр в инвентарь модулей здания; дополнительные ничего не делают\n• Дневная пропускная способность намеренно выше, поэтому ранняя автоматизация предназначена для всплеска в рабочие часы, а не для медленного круглосуточного потока\n• Протесты [color=red]по-прежнему[/color] могут отключать эти здания, даже если у них есть разрешение на сверхурочную работу\n\n[font=default-bold]Опционально:[/font]\nЕсли вам совсем не нравится этот механизм, отключите рабочие часы в настройках запуска перед загрузкой мода. Подсказка, модуль, исследование и ночные отключения во время выполнения — всё исчезнет вместе с настройкой.

