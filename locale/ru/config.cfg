administratorio-enable-working-hours=При включении рабочие столы, комнаты отдыха и штаб-квартиры профсоюза закрываются ночью, если не оснащены Разрешением на Сверхурочную Работу. Отключение этой опции убирает ночные отключения, модуль Разрешения на Сверхурочную Работу, исследование Внерабочих Операций, подсказку о рабочих часах и дневные ускорения скорости.

