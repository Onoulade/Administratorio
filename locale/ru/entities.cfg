[entity-description]
slop-refinery=Всё, что происходит после токена. Забирает Токены инференса из оптоволокна, перерабатывает их в Административную бурду, бурду — в сфабрикованные документы и разбирается со Сфабрикованными ссылками, которые при этом выпадают. [entity=ai-server] производит только инференс; эта машина превращает его в документооборот.
optical-fibre=Передаёт только [fluid=inference-token]. Не соединяется с обычными трубами и пневмотрубами.
involuntary-relocation-cannon=Отправляет персонал семейства кусак на другую планету, партиями за выстрел. Это не турель: ей не нужно наводиться.\n\nЗагрузите груз во входной слот. Больше ничего не требуется — пушка стреляет, когда подходящий [entity=involuntary-relocation-receiver] на другой планете запрашивает груз, расходуя один приказ о переводе этого получателя за каждый прибывший предмет.\n\n[font=default-bold]Настройки цели нет.[/font] Отвечает любой получатель на другой планете с подходящим запросом. Только персонал семейства кусак, никогда не яйца, и только между планетами. Планете, которая и отправляет, и получает, нужно по одному зданию каждого вида.
involuntary-relocation-receiver=Запрашивает персонал семейства кусак с другой планеты, партиями за выстрел.\n\nЗагрузите [item=involuntary-transfer-order] во входной слот и подключите к логической сети с сигналом каждого предмета, который хочет получить [color=green]эта[/color] планета. За каждый прибывший предмет тратится один приказ, и прибытия попадают в выходные слоты.\n\n[font=default-bold]Настройки цели нет.[/font] Отвечает любая [entity=involuntary-relocation-cannon] на другой планете с подходящим грузом. Планете, которая и отправляет, и получает, нужно по одному зданию каждого вида.
synthetic-personnel-bureau=Производит профессии, а не здания. Синтезирует Лицензированных нотариусов, Сотрудников примирения, Релейных клерков и Техников криопечати из яиц кусак, токенов инференса и административной бурды, так что специалисту больше не нужен рейс на Навис. Реальное ограничение — потребление электричества.
ai-server=Вычислительное ядро Аквило, и это его единственная работа. Потребляет огромное количество электричества, производя Токены инференса, и во время работы выделяет настоящее тепло в ванильную тепловую сеть. Сервер, который не может отвести тепло, останавливается полностью — он не снижает темп. У него нет выбора рецепта, а токены уходят только по оптоволокну в [entity=slop-refinery].
heat-exhaust=Ограничивает температуру тепловой сети, сбрасывая избыток. Для игроков, которым нужны вычисления без выработки энергии. Он никогда не выгоднее реального использования тепла.
interplanetary-terminus=Перевозит документы между планетами через общий, медленный и узкий пул магистрали. По одному на планету.\n\n[font=default-bold]Чтобы отправить:[/font] манипуляторы кладут экспортируемый бланк во входной слот. Он уходит по собственному таймеру — запрос не нужен — и попадает в пул, общий для всех планет вашей команды. За раз — только один вид бланка.\n[font=default-bold]Чтобы запросить (зелёный провод):[/font] подключите зелёный и задайте сигнал для каждого бланка, который нужен этой планете. Подходящий бланк из пула забирается мгновенно, независимо от происхождения — даже бланк, который эта же планета сама туда добавила: это просто возврат, а не лазейка.\n[font=default-bold]Чтобы посмотреть содержимое пула (красный провод):[/font] подключите красный, чтобы увидеть, что сейчас находится в пуле, по всей империи. Оба цвета используют один и тот же разъём Терминуса, не мешая друг другу.\n[font=default-bold]Чтобы получить:[/font] прибывшие предметы попадают в выходные слоты. Заберите их манипулятором сами — перенести их на ленту, в сундук или в локальную сеть труб — ваш явный следующий шаг, а не магистрали.
bullshit-ore=Богатая жила природного бреда. Добывайте его, чтобы обеспечить сырьем вашу бюрократическую машину.
politician-fluid=Подземный резервуар, до краев наполненный политической жидкостью. Откачивается насосными станциями.
redundant-rubble=Геологические залежи окаменевшего надзора. Добывайте избыточный щебень, чтобы придавать документам юридический вес.
office-desk=Универсальное место для работы с бумагами, канцелярией и рутиной. Закрывается на ночь, если не установлен модуль [item=overtime-exemption].
field-office=Вызывает кусак из ульев в радиусе 200 клеток как рабочих на один производственный цикл. Работает только пока кусака на месте — нулевое загрязнение во время работы. Работает днём и ночью и не принимает модули.
biter-station=Параллельно отправляет рабочих-кусак включать ближайшие обслуживаемые здания. Каждая включенная машина выполняет один производственный цикл, затем ждёт следующего визита. Ночью каждая отправка также расходует жидкий кофе из любого из четырёх боковых входов.
biterport=Наземный аналог робопорта, работающий на кусаках. Вмещает до 8 кусак-грузчиков и стопку денег налогоплательщиков. Соединённые кусакопорты образуют единую логистическую и строительную сеть: кусаки могут строить объекты по чертежам и носить вещи из сундуков запроса. Обычные роботы при этом могут работать в пересекающейся зоне обычного робопорта. После возвращения рабочий отдыхает 30 тиков. В ночную смену для каждой отправки требуется вливать жидкий кофе в любую из четырёх боковых труб.
paperwork-provider-chest=Сундук пассивного снабжения на один слот для логистики кусак. Роботы тоже могут им пользоваться.
paperwork-storage-chest=Однослотовый сундук хранения для логистики кусак и утилизации при разборке.
paperwork-requester-chest=Сундук запроса на один слот для логистики кусак.
formation-center=Комплекс для обучения кусак и брифинга менеджеров. Обучение новым специальностям доступно только на Наувисе; переиспользуемые менеджеры могут проходить недорогие брифинги на любой планете. Принимает жидкий кофе с обеих сторон и поддерживает модули скорости.
rideable-biter=Личный транспорт с необычно исполнительным государственным служащим внутри. Заправляется только [item=taxpayer-money], почти не имеет багажника и закрепляется окончательно после размещения. Если оставить его без финансирования на 10 минут, он вернётся к гражданскому статусу и подаст жалобу.
field-office-no-working-hours=Вызывает кусак из ближайших ульев в радиусе 200 клеток как рабочих на один производственный цикл. Работает только пока кусака находится на месте. В процессе работы загрязнение нулевое.
office-desk-no-working-hours=Универсальное место для работы с бумагами, канцелярией и рутиной.
admin-station=Приёмная стойка 5x5. Хранит талоны с жалобами и закрытые дела. Кусаки подходят, регистрируются и ждут решения своей проблемы. Работает только как склад.
resolution-office=Офис 3x3 для разбора жалоб. Берёт на себя ведение дел и вынесение решений. Имеет два жидкостных входа.
union-headquarters=Согласовывает найм и берёт на себя объединённую работу поздних этапов: гранты, письменные согласования, подготовку директив и налоговые проверки. Первый штаб строится на казначейских облигациях и устных документах. Закрывается на ночь, если не вставлено [item=overtime-exemption].
union-headquarters-no-working-hours=Согласовывает найм и берёт на себя объединённую работу поздних этапов: гранты, письменные согласования, подготовку директив и налоговые проверки. Первый штаб строится на казначейских облигациях и устных документах.
propaganda-distillery=Административный жидкостный переработчик 5x5. Перегоняет политическую жидкость в жидкую ложь, синтезирует жидкую дезинформацию, производит официальные обоснования и чёрную кассу. Симметричная раскладка труб: два входа слева и два выхода справа.
locomotive=Возле каждой станции автоматически ставится ящик для проездных ордеров. Складывайте в него [item=transit-authorization] — по одному на каждое прибытие поезда. Лимит поездов равен количеству ордеров в ящике.
greenhouse=Неспешно выращивает древесину из воды. При правильном подходе культивирует редкие кофейные зёрна. Питается от сети.
printer-t1=Обычный, медленный, но надёжный офисный принтер. Печатает документы, расходуя картриджи. Потребляет 50 кВт.
printer-t2=Быстрый промышленный принтер с функцией ксерокса. На планетах требуется визит [item=biter-worker] из ближайшей [entity=biter-station]. На космических платформах бортовое разрешение заменяет отправку и позволяет продвинутую орбитальную печать.
mechanical-printer=Примитивный печатный станок с ручным приводом (скорость 0.5x). Безотказная рабочая лошадка до внедрения электричества.
corporate-breakroom=Потребляет жидкий кофе и сомнительные данные, выдавая взамен сплетни от кулера. Крайне важное звено в принятии корпоративных решений. Работает только при авторизации от [entity=biter-station].
corporate-breakroom-no-working-hours=Потребляет жидкий кофе и сомнительные данные, выдавая взамен сплетни от кулера. Крайне важное звено в принятии корпоративных решений.
pneumatic-pipe=Герметичная труба цвета канцелярской папки для перекачки разжиженного документооборота. Не подключается к трубам с обычными жидкостями.
pneumatic-pipe-to-ground=Подземная секция пневмотрубы. Не подключается к трубам с обычными жидкостями.
tube-intake=Входной шлюз 1x1. Манипуляторы могут подавать документы прямо в пневмосеть.
tube-outtake=Выходной шлюз 1x1. Бумаги из пневмосети появляются в его инвентаре — вытаскивайте их манипуляторами или логистикой. Повесьте фильтр на слот инвентаря, чтобы запросить конкретный тип документа.
overtime-exemption=Сертифицирует одно административное здание для легальной работы в ночную смену. Одного модуля хватит, чтобы всё здание работало после заката. Дополнительные копии — просто коррупция ради декора.
orbital-employment-catapult=Запускает снаряды [item=voluntary-exploration-space-miner] на расстояние до 56 клеток через узкий сектор стрельбы в 18°. Шахтёры прикрепляются при попадании и наносят 125 базового урона добычи в секунду после задержки в одну секунду. Каждый астероид изначально принимает одного шахтёра, до пяти — благодаря исследованиям штата. Уничтоженный астероид даёт полный ванильный выход фрагментов плюс один собираемый фрагмент сотрудника за каждого прикреплённого шахтёра; сбор этого фрагмента возвращает переиспользуемые боеприпасы для добровольных шахтёров прямо на выход коллектора.
administrative-space-station=Специализированный орбитальный административный офис. Обычные офисы остаются на земле; Промышленный принтер и Лазерный принтер — единственные другие административные машины, допущенные к работе в вакууме. Производит возобновляемую платформенную документацию из астероидных материалов.
amber-sap-seep=Липкий источник Глебы. Откачивайте его, чтобы получить янтарный сок для местной бессмыслицы, чернил и жёлтых бланков-заменителей.
archive-recombination-bureau=Использует обычные входной и выходной инвентари Рециклера и постоянно укомплектован [item=relay-clerk], использованным при постройке. Вставьте один поддерживаемый бланк: три кандидата на замену того же ранга и того же цвета выбираются независимо с вероятностью 25% каждый, так что за одну операцию можно получить ноль, один, два или три бланка.
capture-bureau=Специализированная машина для враждебного захвата. Загрузите в неё споры-приманки, чтобы создать видимое облако спор: трудовые споры привлекают кусак, туристические — плевак, а споры откладки привлекают пентаподов Глебы.
chromatic-printer=Печатает чёрные и цветные документы в атмосферных мирах. Циан — Вулканус, жёлтый — Глеба, маджента — Фульгора. Импорт цвета поддерживает удалённую печать, но не открывает рецепты юрисдикции. Аквило нужен Лазерный принтер.
conciliation-desk=Специализированное бюро примирения на Глебе. Завершает компактное семейство жёлтых бланков для ускоренных запусков и обработки биологических исключений.
digital-services-bureau=Специализированный цифровой офис на Фульгоре. Обрабатывает административные задачи уровня офиса на высокой скорости и без ночного закрытия.
executive-trajectory-compliance-array=Расходует плановые или приоритетные приказы об орбитальном отклонении, чтобы отталкивать любые астероиды в радиусе 40 клеток. Приоритетные приказы толкают вдвое сильнее; огромные астероиды Администраториума обычно требуют нескольких одновременных толчков.
laser-printer=Принтер Аквило на твёрдых носителях. Он использует импортированные цветные формы и местные носители; планируйте межпланетные входы заранее.
notary-office=Специализированное сертификационное бюро на Вулканусе. Оформляет печати, хартии, заверения и резервную стартовую документацию с помощью нотариальной обработки на жидкостной основе.
petition-counter=Пункт одобрения разрешений. Обрабатывает неодобренные разрешения только при наличии поблизости хотя бы одного гнезда кусак.
propaganda-distillery-space-age=Административный жидкостный переработчик 5x5. Перегоняет политическую жидкость в ложь, синтезирует дезинформацию и производит официальные обоснования. В Space Age возобновляемое государственное финансирование поступает от орбитального туризма, а не от отмывания через чёрную кассу. Симметричная раскладка труб: два входа слева и два выхода справа.
senior-trajectory-compliance-array=Расходует плановые или приоритетные приказы об орбитальном отклонении, чтобы отталкивать мелкие, средние и крупные астероиды в радиусе 30 клеток. Приоритетные приказы толкают вдвое сильнее; крупным астероидам может по-прежнему требоваться несколько перекрывающихся массивов.
territorial-arbitration-post=Специализированное бюро переселения на Вулканусе. Расходует приказы о территориальном переселении и жидкую ложь, чтобы подавить активность разрушителей вокруг спорных участков, освобождая территорию на пути к территориальному акту.
trajectory-compliance-array=Расходует плановые или приоритетные приказы об орбитальном отклонении, чтобы медленно отталкивать наружу мелкие и средние астероиды в радиусе 20 клеток. Приоритетные приказы толкают вдвое сильнее; перекрывающиеся выстрелы и массивы складываются, но не создают фрагментов.
union-headquarters-space-age=Согласовывает найм и берёт на себя объединённую работу поздних этапов: гранты, письменные согласования и подготовку директив. В Space Age финансирование поступает от орбитального туризма, а не от отмывания через налоговые проверки. Первый штаб строится на казначейских облигациях и устных документах. Закрывается на ночь, если не вставлено [item=overtime-exemption].
union-headquarters-space-age-no-working-hours=Согласовывает найм и берёт на себя объединённую работу поздних этапов: гранты, письменные согласования и подготовку директив. В Space Age финансирование поступает от орбитального туризма, а не от отмывания через налоговые проверки. Первый штаб строится на казначейских облигациях и устных документах.
verdigris-crust=Медно-зелёное минеральное месторождение на Вулканусе. Добывайте его, чтобы запустить циановую цепочку документов планеты.
