[item-description]
administrative-slop=Правдоподобный административный текст без фиксированного смысла. Перерабатывается в настоящие документы и ссылки, которые на самом деле не существуют.
ai-server=Вычислительное ядро Аквило, и это его единственная работа. Потребляет огромное количество электричества, производя Токены инференса, и во время работы выделяет настоящее тепло в ванильную тепловую сеть. Сервер, который не может отвести тепло, останавливается полностью — он не снижает темп. У него нет выбора рецепта, а токены уходят только по оптоволокну в [entity=slop-refinery].
fabricated-citations=Ссылка, которая выглядит настоящей, но ей не является. Сбросьте её, проверьте и верните сырьё, либо дайте ей накопиться и остановить сервер.
geotechnical-assessment-manager=Менеджер среднего звена, отправленный оценить почву Глебы. Возвращается после крафта, поэтому Глеба копит менеджеров, пока вы не отправите их домой. Через 30 минут превращается в обычного менеджера.
heat-exhaust=Ограничивает температуру тепловой сети, сбрасывая избыток. Для игроков, которым нужны вычисления без выработки энергии. Он никогда не выгоднее реального использования тепла.
interplanetary-terminus=Перевозит документы между планетами по медленной узкой магистрали. По одному на планету.\n\n[font=default-bold]Чтобы отправить:[/font] манипуляторы кладут экспортируемый бланк во входной слот. За раз — только один вид бланка.\n[font=default-bold]Чтобы запросить:[/font] подключите Терминус к логической сети и задайте сигнал для каждого бланка, который нужен [color=green]этой[/color] планете. Магистраль забирает совпадающие документы из входного слота Терминуса любой другой планеты.\n[font=default-bold]Чтобы получить:[/font] прибывшие предметы попадают в выходные слоты. Заберите их манипулятором: магистраль никуда их сама не подаёт. Перенести их на ленту, в сундук или в локальную сеть труб — ваш явный следующий шаг.
involuntary-relocation-cannon=Переводит персонал семейства кусак между планетами партиями, по одному выстрелу. Это не турель: ей не нужно наводиться.\n\n[font=default-bold]Отправляющая пушка:[/font] загрузите персонал во входной слот. Больше ничего не требуется.\n[font=default-bold]Принимающая пушка:[/font] загрузите [item=involuntary-transfer-order] во входной слот и подключите пушку к логической сети с сигналом каждого предмета, который хочет получить [color=green]эта[/color] планета. На каждый прибывший предмет тратится один приказ; прибытия попадают в выходные слоты.\n\n[font=default-bold]Настройки цели нет.[/font] Принимающая пушка запрашивает, а любая отправляющая пушка другой планеты с подходящим грузом отвечает. Планете, которая и отправляет, и получает, нужны две пушки. Только персонал семейства кусак, никогда не яйца, и только между планетами.
involuntary-transfer-order=Разрешает перевод ровно одного сотрудника, с его согласием или без него. Загружается в [color=green]принимающую[/color] [entity=involuntary-relocation-cannon] и расходуется по одному за каждый прибывший предмет.
missionary-manager=Менеджер среднего звена, несущий на Аквило разрешение стоимостью в десять яиц кусак. Расходуется генератором пленных кусак. Через 30 минут превращается в обычного менеджера: теряются яйца и перелёт, но не менеджер.
optical-fibre=Передаёт только [fluid=inference-token]. Не соединяется с обычными трубами и пневмотрубами.
slop-refinery=Всё, что происходит после токена. Забирает Токены инференса из оптоволокна, перерабатывает их в Административную бурду, бурду — в сфабрикованные документы и разбирается со Сфабрикованными ссылками, которые при этом выпадают. [entity=ai-server] производит только инференс; эта машина превращает его в документооборот.
synthetic-personnel-bureau=Производит профессии, а не здания. Синтезирует Лицензированных нотариусов, Сотрудников примирения, Релейных клерков и Техников криопечати из яиц кусак, токенов инференса и административной бурды, так что специалисту больше не нужен рейс на Навис. Реальное ограничение — потребление электричества.
unstaffed-operations-waiver=Позволяет одному зданию, обслуживаемому станцией кусак, работать без отправленного рабочего-кусаки. Занимает слот модуля, который иначе пошёл бы на производительность. Не портится, но стоит дорого и подходит только зданиям, ожидающим отправленного работника.
voluntary-research-subject=Менеджер среднего звена, который вызвался добровольно в том смысле, что его никто не спрашивал. Расходуется на науку Администраториума на орбите. Через 30 минут превращается в обычного менеджера.

