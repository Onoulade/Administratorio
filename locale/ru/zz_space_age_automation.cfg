inference-token=Машинное рассуждение, получаемое из материала, которого никто не читал, по разорительной цене в электричестве. Это поток, а не ящик: его нельзя разливать в бочки, везти по ленте или отправлять ракетой; он идёт только по оптоволокну. Перерабатывается в Административную бурду и питает Бюро синтетического персонала.

