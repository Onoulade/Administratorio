pneumatic-transport-note-prefix=Можно поместить в
cross-planet-cyan=Источник: Вулканус. Циановая/вольфрамовая юрисдикция. Ракета до хроматического ствола Аквило.
cross-planet-yellow=Источник: Глеба. Жёлтая/биологическая юрисдикция. Портится; ракета до хроматического ствола Аквило.
cross-planet-magenta=Источник: Фульгора. Маджентовая/гольмиевая юрисдикция. Ракета до хроматического ствола Аквило.
cross-planet-cyan-yellow=Юрисдикции: Вулканус + Глеба. Явное требование двух планет. Только хроматическая нагрузка.
cross-planet-cyan-magenta=Юрисдикции: Вулканус + Фульгора. Явное требование двух планет. Только хроматическая нагрузка.
cross-planet-yellow-magenta=Юрисдикции: Глеба + Фульгора. Явное требование двух планет. Только хроматическая нагрузка.
cross-planet-vulcanus-charter=Источник: Вулканус. Явно разрешает указанную металлургию вне Вулкануса.
cross-planet-aquilo=Источник: Аквило. Требуется для криогеники; нужен хроматический ствол.
cross-planet-trichromatic=Источник: Аквило. Явная конвергенция Вулканус + Глеба + Фульгора.
cross-planet-unified=Источник: Аквило. Явная зависимость от четырёх миров.
