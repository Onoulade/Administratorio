route-handcraft=__1__ — Ручное изготовление
route-specialist=__1__ — Специализированное производство
route-handcraft-specialist=__1__ — Ручное / специализированное производство
route-regulated=__1__ — Регламентированная сборка
paired-unlocks=Открывает оба способа для парных рецептов: исходный способ и регламентированную сборку. Откройте продукт в Factoriopedia, чтобы сравнить ингредиенты, партии и машины.
acquire-enrolled=На Наувисе положите 1 [item=job-offer] в ячейку посетителя в [entity=admin-station] до окончательного решения его дела. Зачислить можно только кусак. Предложение расходуется при каждой попытке; успех заменяет денежную выплату на 1 [item=enrolled-biter]. Шанс по уровню недовольства: до 50% → 75%; свыше 50% до 75% → 50%; свыше 75% до 90% → 25%; свыше 90% → 0%. Обучите новобранца в [entity=formation-center].
acquire-worker-base=Положите 1 [item=job-offer] в ячейку посетителя в [entity=admin-station] до окончательного решения его дела. Кусака или плевака принимает предложение, заменяя денежную выплату на [item=worker-biter]: маленький 1, средний 2, большой 3, чудовищный 5.
acquire-worker-space=Обучение на Наувисе: используйте __1__ в [entity=formation-center] с [item=enrolled-biter] и [item=provisional-approval].\nПрямой отлов: [entity=capture-bureau] с [fluid=workforce-lure-spores] превращает каждого прибывшего кусаку в 1 [item=worker-biter] независимо от размера. Радиус привлечения — 48 клеток, расход приманки — 1 в секунду. Требуется место на выходе.
acquire-workforce=Подайте [fluid=workforce-lure-spores] в [entity=capture-bureau], чтобы привлекать кусак в радиусе 48 клеток. Каждый прибывший кусака даёт 1 [item=worker-biter] независимо от размера. Расход приманки — 1 в секунду, в том числе в ожидании. Оставляйте место на выходе. Режим выбирается флюидом-приманкой; не смешивайте разные приманки в общей системе.
acquire-tourism=Подайте [fluid=tourism-lure-spores] в [entity=capture-bureau], чтобы привлекать плевак в радиусе 48 клеток. Каждый прибывший плевака даёт пакет своего размера: [item=small-spitter-tourism-package] [item=medium-spitter-tourism-package] [item=big-spitter-tourism-package] [item=behemoth-spitter-tourism-package]. Расход приманки — 1 в секунду, в том числе в ожидании. Оставляйте место на выходе. Запустите пакеты до порчи и обработайте в [entity=administrative-space-station]. Режим выбирается флюидом-приманкой.
acquire-tourism-package=Поймайте __1__ через [entity=capture-bureau] с [fluid=tourism-lure-spores]. Один плевака даёт один пакет соответствующего размера. Радиус — 48 клеток; расход приманки — 1 в секунду; требуется место на выходе. Через __2__ мин. пакет портится и выпускает враждебного плеваку. До этого запустите его и обработайте в [entity=administrative-space-station].
acquire-eggs-sampling=Первые яйца на Глебе: бросьте [item=pentapod-sampling-capsule] прямо в дикого пентапода. Маленький / средний / большой даёт 1 / 2 / 4 [item=pentapod-egg]. Существо выживает; повторный отбор возможен через 30 секунд. Преждевременная попытка возвращает капсулу.
acquire-eggs-capture=Сбор у диких особей: подайте [fluid=oviposition-lure-spores] в [entity=capture-bureau], чтобы привлекать пентаподов в радиусе 48 клеток. Маленький / средний / большой даёт 1 / 2 / 4 [item=pentapod-egg] и расходует 5 / 8 / 12 приманки при захвате. В ожидании приманка не расходуется. Нужны достаточный запас приманки и место на выходе. Режим выбирается флюидом-приманкой.
acquire-eggs-breeding=Возобновляемое разведение: исследуйте [technology=pentapod-egg-cultivation], затем выполняйте [recipe=pentapod-egg] в [entity=biochamber]. Отбор проб и отлов дают первые яйца. Яйца портятся и могут выпускать враждебных пентаподов.
