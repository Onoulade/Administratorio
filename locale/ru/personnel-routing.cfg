personnel-path=Дорожка персонала
personnel-recovery-crate=Ящик спасённого персонала
[entity-description]
personnel-deployment-office=Загрузите обученный персонал. Полевые агенты и верховые кусаки не принимаются. Отправляет одного кусаку пешком по полному маршруту с указателями к бюро приёма. Поверните бюро для выбора направления отправки. Не требует электричества или зарплаты. Автоматически привязывается к общей сетке 2×2, как рельсы.
personnel-reception-office=Возвращает прибывший персонал в исходные предметы в выходном инвентаре, доступном манипуляторам. Заполненный выход безопасно задерживает очередь. Автоматически привязывается к общей сетке 2×2, как рельсы.
personnel-routing-sign=Направляет персонал по стрелке. Автоматически создаёт прямую свободную дорожку шириной две клетки до следующего указателя или бюро приёма на той же линии. Требуется полный маршрут до приёма. Зарезервированный указатель нельзя убрать или повернуть. Привязывается к общей сетке 2×2, как рельсы.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-recovery-crate=Персонал, спасённый после разрыва маршрута. Откройте ящик или используйте манипулятор, чтобы забрать исходные предметы. Защищён от боевых повреждений.
personnel-in-transit=Персонал в пути. Непрерывно движется со стандартной скоростью малого кусаки по зарезервированным дорожкам 2×2, с обычной анимацией ходьбы. Исходный предмет сохранён до приёма или спасения. Менеджеры после инструктажа показывают значок и полоску оставшегося времени. Инструктаж истекает как обычно в пути и в очереди; затем значок и полоска исчезают. Цвет тела обозначает роль при отправке.
[item-name]
personnel-deployment-office=Бюро отправки персонала
personnel-reception-office=Бюро приёма персонала
personnel-routing-sign=Указатель движения персонала
personnel-path=Дорожка персонала
[item-description]
personnel-deployment-office=Материализует обученный персонал на защищённой дорожке с указателями. Для изготовления нужны жёлто-пурпурные бланки.
personnel-reception-office=Возвращает пеший персонал в предметы для манипуляторов. Для изготовления нужны жёлто-пурпурные бланки.
personnel-routing-sign=Указатель для защищённой дорожки персонала. Поверните стрелку до отправки.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
[technology-name]
personnel-routing=Маршрутизация персонала
[technology-description]
personnel-routing=Жёлто-пурпурные бланки разрешают пешие перемещения между бюро отправки и приёма. Для исследования нужны жёлтая наука и науки Глебы и Фульгоры. Принимает обученный персонал кусак, кроме полевых агентов и верховых кусак. Кусаки стоят в очереди на зарезервированных блоках 2×2; при разрыве маршрута груз сохраняется или возвращается в ящик спасения.
[personnel-routing]
no-route=Нет полного маршрута с указателями до приёма
empty=Ожидание персонала
invalid-cargo=Только обученный персонал; без полевых агентов и верховых кусак
queued=Ожидание свободного блока дорожки
running=Персонал отправлен
received=Персонал принят
output-full=Выход заполнен: персонал безопасно ожидает
alignment=Сначала уберите твёрдые препятствия. Ставьте на суше на общей сетке 2×2, без перекрытия блоков. Занятые маршруты нельзя менять.
recovered=Персонал спасён в этот ящик после разрыва маршрута.
recovery-pending=Спасённый персонал ожидает: освободите место у отправки для ящика спасения.
