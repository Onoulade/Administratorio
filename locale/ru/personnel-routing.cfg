[entity-description]
personnel-deployment-office=Загрузите обученный персонал. Полевые агенты и верховые кусаки не принимаются. Отправляет к следующему доступному указателю или бюро приёма; полный маршрут до приёма не нужен. При недоступном продолжении персонал ждёт в очереди. Поверните для выбора направления. Не требует электричества или зарплаты. Общая сетка 2×2, как рельсы.
personnel-reception-office=Возвращает прибывший персонал в исходные предметы в выходном инвентаре, доступном манипуляторам. Заполненный выход безопасно задерживает очередь. Автоматически привязывается к общей сетке 2×2, как рельсы.
personnel-routing-sign=Отправляет к следующему доступному указателю или бюро приёма и автоматически создаёт прямую свободную дорожку. Если продолжения нет, персонал останавливается перед зоной указателя 2×2, а очередь заполняет дорожку позади. Добавьте следующую точку для продолжения. Конечный указатель можно повернуть, даже пока персонал продолжает подходить. Поворот блокируется только при зарезервированном исходящем сегменте или пока последний кусака освобождает поворот. Занятый указатель нельзя убрать. Общая сетка 2×2.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-recovery-crate=Персонал, спасённый после разрыва маршрута. Откройте ящик или используйте манипулятор, чтобы забрать исходные предметы. Защищён от боевых повреждений.
personnel-in-transit=Персонал в пути. Непрерывно движется со стандартной скоростью малого кусаки по защищённой дорожке. Тело 2×2 не перекрывает другие; расстояние между центрами в очереди — 2,5 клетки. Ждёт у недоступного продолжения или полного приёма и возобновляет движение после освобождения. Исходный предмет сохранён. Менеджеры после инструктажа показывают значок и полоску времени; инструктаж истекает как обычно в пути и в очереди. Цвет обозначает роль при отправке.
[item-name]
personnel-deployment-office=Бюро отправки персонала
personnel-reception-office=Бюро приёма персонала
personnel-routing-sign=Указатель движения персонала
personnel-path=Дорожка персонала
[item-description]
personnel-deployment-office=Материализует обученный персонал на защищённой дорожке с указателями. Для изготовления нужны жёлто-пурпурные бланки.
personnel-reception-office=Возвращает пеший персонал в предметы для манипуляторов. Для изготовления нужны жёлто-пурпурные бланки.
personnel-routing-sign=Указатель для защищённой дорожки персонала. Поверните стрелку до отправки.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
[technology-name]
personnel-routing=Маршрутизация персонала
[technology-description]
personnel-routing=Жёлто-пурпурные бланки разрешают пешие перемещения персонала. Нужны жёлтая наука и науки Глебы и Фульгоры. Обученные кусаки, кроме полевых агентов и верховых кусак, идут от указателя к указателю и стоят в плотной очереди у недоступного продолжения. Продлите дорожку для возобновления; принудительное удаление спасает исходные предметы.
[personnel-routing]
no-route=Ожидание следующего доступного указателя или бюро приёма
empty=Ожидание персонала
invalid-cargo=Только обученный персонал; без полевых агентов и верховых кусак
queued=Ожидание свободного блока дорожки
running=Персонал отправлен
received=Персонал принят
output-full=Выход заполнен: персонал безопасно ожидает
alignment=Уберите препятствия. Ставьте на суше на общей сетке 2×2 без перекрытия. Зарезервированные сегменты нельзя перестроить; конечные указатели с остановленной очередью можно безопасно перенаправить.
recovered=Персонал спасён в этот ящик после разрыва маршрута.
recovery-pending=Спасённый персонал ожидает: освободите место у отправки для ящика спасения.
