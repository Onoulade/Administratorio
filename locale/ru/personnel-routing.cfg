[item-description]
personnel-deployment-office=Материализует персонал на защищённой дорожке. Сталь, электронные схемы и форма 27B/6 зелёного уровня разрешают отправку.
personnel-reception-office=Возвращает пеший персонал в предметы для манипуляторов. Сталь, электронные схемы и форма 27B/6 зелёного уровня разрешают приём.
personnel-routing-sign=Указатель с логическими сигналами числа приближающихся сотрудников. Можно поворачивать в любое время; входящие сохраняют выбранное направление.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-routing-multisign=Поворотный указатель с тремя выходами: до пяти ручных фильтров персонала или независимый вход логической сети на каждом выходе.
[technology-name]
personnel-routing-speed=Скорость персонала
personnel-routing=Маршрутизация персонала
personnel-routing-speed-1=Скорость персонала 1
personnel-routing-speed-2=Скорость персонала 2
personnel-routing-multisign=Логическая маршрутизация персонала
[technology-description]
personnel-routing=Зелёная наука и форма 27B/6 разрешают дорожки, бюро и подсчёт приближающегося персонала. Персонал идёт со скоростью 50 % от обычной скорости малого кусаки. Продлите заблокированные пути для разгрузки очередей. Электричество и зарплата не нужны.
personnel-routing-speed-1=Синяя наука разрешает ускоренные поездки: скорость на всех дорожках достигает 100 % обычной скорости малого кусаки.
personnel-routing-speed-2=Фиолетовая наука разрешает ускоренный проезд: скорость на всех дорожках достигает 150 % обычной скорости малого кусаки.
personnel-routing-multisign=Синяя наука открывает поворотный указатель с тремя выходами. Выберите до пяти ручных фильтров персонала или сигналы сети отдельно для каждого выхода; закрытый или недоступный выход задерживает очередь.
[personnel-routing]
no-route=Ожидание следующего доступного указателя или бюро приёма
empty=Ожидание персонала
invalid-cargo=Только обученный персонал; без полевых агентов и верховых кусак
queued=Ожидание свободного блока дорожки
running=Персонал отправлен
received=Персонал принят
output-full=Выход заполнен: персонал безопасно ожидает
alignment=Уберите препятствия. Ставьте на суше на общей сетке 2×2 без перекрытия. Зарезервированные сегменты нельзя перестроить; указатели можно безопасно поворачивать в любой момент.
recovered=Персонал спасён в этот ящик после разрыва маршрута.
recovery-pending=Спасённый персонал ожидает: освободите место у отправки для ящика спасения.
left=Налево
straight=Прямо
right=Направо
filter-port=Многосторонний указатель: логический порт __1__
manual=Вручную
circuit=Сеть
gui-directions=Направления указаны относительно главной стрелки. Выберите источник фильтров для каждого выхода.
manual-help=Выберите до пяти типов персонала. Подходят все качества. Без фильтров выход закрыт.
circuit-help=Читает положительные сигналы персонала с гнезда этого выхода. Сохранённые ручные фильтры неактивны.
filter-slot=Фильтр персонала __1__ (все качества). Правая кнопка мыши — очистить.
gui-priority=При совпадении: налево, прямо, направо. Отсутствующий путь задерживает очередь. Вошедший персонал сохраняет выбранный выход.
[technology-effect]
personnel-routing-speed-1=Скорость ходьбы: 50 % → 100 % скорости малого кусаки
personnel-routing-speed-2=Скорость ходьбы: 100 % → 150 % скорости малого кусаки
