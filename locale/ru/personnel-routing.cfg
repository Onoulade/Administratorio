[entity-description]
personnel-deployment-office=Загрузите обученный персонал. Полевые агенты и верховые кусаки не принимаются. Отправляет к следующему доступному указателю или бюро приёма; полный маршрут до приёма не нужен. При недоступном продолжении персонал ждёт в очереди. Поверните для выбора направления. Не требует электричества или зарплаты. Общая сетка 2×2, как рельсы.
personnel-reception-office=Принимает дорожки со всех четырёх сторон и не поворачивается. Возвращает прибывший персонал в исходные предметы в выходном инвентаре, доступном манипуляторам. Заполненный выход безопасно задерживает очередь. Автоматически привязывается к общей сетке 2×2, как рельсы.
personnel-routing-sign=Направляет персонал по стрелке и создаёт свободную дорожку. Подключите указатель к логической сети, чтобы узнать число каждого типа персонала на ВСЕХ непосредственных входящих участках, включая очереди; качества суммируются. Можно поворачивать в любое время. Входящий кусака сохраняет выбранный поворот. При недоступном продолжении очередь ждёт восстановления пути. Общая сетка 2×2. На перекрёсток входит один кусака за раз; занятый указатель нельзя убрать.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-recovery-crate=Персонал, спасённый после разрыва маршрута. Откройте ящик или используйте манипулятор, чтобы забрать исходные предметы. Защищён от боевых повреждений.
personnel-in-transit=Персонал в пути. Непрерывно движется со скоростью 50 % от обычной скорости малого кусаки; синее исследование повышает её до 100 %, фиолетовое — до 150 % по защищённой дорожке. Тело 2×2 не перекрывает другие; расстояние между центрами в очереди — 2,5 клетки. Ждёт у недоступного продолжения или полного приёма и возобновляет движение после освобождения. Исходный предмет сохранён. Менеджеры после инструктажа показывают значок и полоску времени; инструктаж истекает как обычно в пути и в очереди. Цвет обозначает роль при отправке.
personnel-routing-multisign=Три выхода относительно стрелки: налево, прямо и направо. Подключайте латунное гнездо на конце нужной стрелки: налево, прямо или направо. Каждое гнездо — независимый вход логической сети; при нажатии редактор сигналов не открывается. Положительные сигналы предметов персонала разрешают эти типы; без положительного сигнала выход закрыт. Значения красной и зелёной сети и всех качеств суммируются. Отсутствующий путь или неподходящий тип удерживает кусак полностью вне перекрёстка. Поворачивайте указатель или любое гнездо на конце стрелки, даже при заблокированной очереди. При нескольких совпадениях приоритет: налево, прямо, направо, без обхода. Входящий кусака сохраняет выход при изменении сигналов или повороте. Общая сетка 2×2. На перекрёсток входит один кусака за раз; занятый указатель нельзя убрать.
personnel-routing-filter-port=Независимый вход красной/зелёной логической сети для этого выхода указателя. Положительные сигналы предметов персонала разрешают эти типы. Без положительного сигнала выход закрыт. Поворот этого гнезда поворачивает весь указатель, даже если кусаки ждут. Провода остаются подключёнными; гнездо нельзя удалить отдельно. Подключайте провод здесь; сигналы не задаются нажатием.
