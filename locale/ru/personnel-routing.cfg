[item-description]
personnel-deployment-office=Материализует персонал на защищённой дорожке. Сталь, электронные схемы и форма 27B/6 зелёного уровня разрешают отправку.
personnel-reception-office=Возвращает пеший персонал в предметы для манипуляторов. Сталь, электронные схемы и форма 27B/6 зелёного уровня разрешают приём.
personnel-routing-sign=Указатель с логическими сигналами числа приближающихся сотрудников. Можно поворачивать в любое время; входящие сохраняют выбранное направление.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-routing-multisign=Поворотный указатель с тремя независимыми логическими фильтрами: налево, прямо и направо.
