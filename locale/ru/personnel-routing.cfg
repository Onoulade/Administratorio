personnel-routing-speed-2=Скорость персонала 2
personnel-routing-multisign=Логическая маршрутизация персонала
[technology-description]
personnel-routing=Зелёная наука и форма 27B/6 разрешают дорожки, бюро и подсчёт приближающегося персонала. Персонал идёт со скоростью 50 % от обычной скорости малого кусаки. Продлите заблокированные пути для разгрузки очередей. Электричество и зарплата не нужны.
personnel-routing-speed-1=Синяя наука разрешает ускоренные поездки: скорость на всех дорожках достигает 100 % обычной скорости малого кусаки.
personnel-routing-speed-2=Фиолетовая наука разрешает ускоренный проезд: скорость на всех дорожках достигает 150 % обычной скорости малого кусаки.
personnel-routing-multisign=Синяя наука открывает поворотный указатель с тремя выходами. Независимые логические сигналы фильтруют типы персонала налево, прямо и направо; закрытый или недоступный выход задерживает очередь.
