[entity-description]
personnel-deployment-office=Загрузите обученный персонал. Полевые агенты и верховые кусаки не принимаются. Отправляет к следующему доступному указателю или бюро приёма; полный маршрут до приёма не нужен. При недоступном продолжении персонал ждёт в очереди. Поверните для выбора направления. Не требует электричества или зарплаты. Общая сетка 2×2, как рельсы.
personnel-reception-office=Принимает дорожки со всех четырёх сторон и не поворачивается. Возвращает прибывший персонал в исходные предметы в выходном инвентаре, доступном манипуляторам. Заполненный выход безопасно задерживает очередь. Автоматически привязывается к общей сетке 2×2, как рельсы.
personnel-routing-sign=Направляет персонал по стрелке и создаёт свободную дорожку. Подключите указатель к логической сети, чтобы узнать число каждого типа персонала на ВСЕХ непосредственных входящих участках, включая очереди; качества суммируются. Можно поворачивать в любое время. Входящий кусака сохраняет выбранный поворот. При недоступном продолжении очередь ждёт восстановления пути. Общая сетка 2×2. На перекрёсток входит один кусака за раз; занятый указатель нельзя убрать.
personnel-path=Обычный бетон с бирюзовым оттенком автоматически обозначает защищённую дорожку. Появляется между соединёнными указателями и бюро; отдельный предмет покрытия не изготавливается и не размещается. Допускает конвейеры, манипуляторы и опоры электросети. Обновляется после удаления или поворота свободных сооружений.
personnel-recovery-crate=Персонал, спасённый после разрыва маршрута. Откройте ящик или используйте манипулятор, чтобы забрать исходные предметы. Защищён от боевых повреждений.
personnel-in-transit=Персонал в пути. Непрерывно движется со скоростью 50 % от обычной скорости малого кусаки; синее исследование повышает её до 100 %, фиолетовое — до 150 % по защищённой дорожке. Тело 2×2 не перекрывает другие; расстояние между центрами в очереди — 2,5 клетки. Ждёт у недоступного продолжения или полного приёма и возобновляет движение после освобождения. Исходный предмет сохранён. Менеджеры после инструктажа показывают значок и полоску времени. Порча идёт вдвое медленнее в пути и в очереди. По истечении срока менеджеры после инструктажа и курьеры яиц становятся обычными MMMM прямо на дорожке и продолжают путь; цвет соответствует текущей роли.
personnel-routing-multisign=Три выхода относительно стрелки: налево, прямо и направо. Откройте указатель или латунное гнездо, чтобы задать до пяти фильтров персонала для каждого выхода либо читать сигналы логической сети. Ручные фильтры принимают все качества; без фильтров выход закрыт. В режиме Сеть положительные сигналы предметов персонала разрешают эти типы; значения красной и зелёной сети и всех качеств суммируются. Отсутствующий путь или неподходящий тип удерживает кусак полностью вне перекрёстка. Приоритет: налево, прямо, направо, без обхода. Поворачивайте указатель или гнездо даже при очереди. Вошедшие кусаки сохраняют выбранный выход. Общая сетка 2×2. Входит один кусака за раз; занятый указатель нельзя убрать.
personnel-routing-filter-port=Независимый вход красной/зелёной сети для этого выхода указателя. Откройте для настройки всего указателя. В режиме Сеть положительные сигналы предметов персонала разрешают эти типы; без положительного сигнала выход закрыт. Ручной режим использует пять сохранённых фильтров и игнорирует этот вход. Поворот гнезда поворачивает весь указатель. Провода сохраняются; гнездо нельзя удалить отдельно.
