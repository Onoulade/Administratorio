empty=Ожидание персонала
invalid-cargo=Только обученный персонал; без полевых агентов и верховых кусак
queued=Ожидание свободного блока дорожки
running=Персонал отправлен
received=Персонал принят
output-full=Выход заполнен: персонал безопасно ожидает
alignment=Уберите препятствия. Ставьте на суше на общей сетке 2×2 без перекрытия. Зарезервированные сегменты нельзя перестроить; указатели можно безопасно поворачивать в любой момент.
recovered=Персонал спасён в этот ящик после разрыва маршрута.
recovery-pending=Спасённый персонал ожидает: освободите место у отправки для ящика спасения.
left=Налево
straight=Прямо
right=Направо
filter-port=Многосторонний указатель: логический порт __1__
[technology-effect]
personnel-routing-speed-1=Скорость ходьбы: 50 % → 100 % скорости малого кусаки
personnel-routing-speed-2=Скорость ходьбы: 100 % → 150 % скорости малого кусаки
