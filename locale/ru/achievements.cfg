[achievement-description]
tube-terminus=Постройте __ENTITY__interplanetary-terminus__. Тот же почтовый ящик, теперь с расходами на доставку.
chromatic-trunk=Исследуйте __TECHNOLOGY__interplanetary-tube-chromatic__. Теперь можно ответить всем планетам, даже тем, которые ни о чём не спрашивали.
research-with-promethium=Исследуйте технологию с пакетами Администраториума. Даже финалу игры нужны ссылки на источники.
welcome-to-the-department=Постройте __ENTITY__admin-station__. Ваш кабинет уже ждёт. У кусаки есть вопросы.
discovery-of-bullshit=Исследуйте __TECHNOLOGY__discovery-bullshit__. Он всё это время был у вас под ногами. Теперь понятны некоторые отрасли экономики.
ink-stained=Исследуйте __TECHNOLOGY__printing-technology__. Принтер снова зажевал бумагу и отрицает свою компетенцию по этому вопросу.
form-27b-6-achievement=Произведите 100 __ITEM__form-27b-6__ в час. Свою собственную вы, разумеется, ещё не подали.
paper-pusher=Произведите 1000 __ITEM__blank-form__ в час. Деревья погибли не зря. Они погибли ради пропускной способности.
capsule-promise=Используйте 1 __ITEM__promise__. Полные условия предоставляются после получения согласия.
its-a-copy-of-a-copy=Исследуйте __TECHNOLOGY__local-precedents__. Копия официальнее оригинала. В этом и состоит вся теория.
permit-denied=Постройте 10 __ENTITY__train-stop__. Пунктуальность теперь административная привилегия.
coffee-break=Постройте __ENTITY__corporate-breakroom__. Наконец-то критически важная инфраструктура.
pneumatic-delivery=Исследуйте __TECHNOLOGY__pneumatic-form-transport__. Идея вылетела в трубу и получила отдельный бюджет.
propaganda-machine=Постройте __ENTITY__propaganda-distillery__. Производство согласия, по одному баррелю и тщательно подобранному прилагательному.
endless-meetings=Исследуйте __TECHNOLOGY__board-meetings__. Хватило бы одного письма. Вместо этого получилась технология.
union-strong=Постройте __ENTITY__union-headquarters__. Рабочие организовались. Руководство открыло таблицу.
environmental-compliance-achievement=Исследуйте __TECHNOLOGY__environmental-compliance__. Загрязнение разрешено продолжить под надлежащим слоем документации.
constitutional-scholar=Исследуйте __TECHNOLOGY__administratorio-behemoth-complaints__. Вы разрешили жалобы покрупнее. Комитет достижений благодарит вас за новый контент.
know-it-all=Произведите 1000 __ITEM__useless-documentation__ за одну игру. Тысяча источников, и ни один не отвечает на вопрос.
eviction-notice-achievement=Используйте 100 __ITEM__eviction-notice__ за одну игру. Ничего личного: просто политика, напечатанная оптом.
mass-transit=Пусть поезд рассчитает маршрут длиннее 2000 клеток. Ехать необязательно. Прогнозируемая эффективность уже заслуживает награды.
first-complaint=Зарегистрируйте первого кусаку за административным столом. Его тревогам присвоен номер дела.
first-protest=Дождитесь, пока раздражение кусаки перерастёт в протест. Вы знали, к чему всё идёт. Панель управления знала раньше.
case-closed=Разрешите первую жалобу кусаки. Минус одна, впереди бесконечность. Всё должным образом проиндексировано.
protest-suppressed=Успокойте протестующего кусаку Обещанием. Проблема перенесена на следующий квартал.
department-of-everything=Имейте одновременно 10 административных столов. Вы создали игру в управление внутри игры о фабрике. Теперь управляйте управлением.
full-resolution=Разрешите жалобы каждой из восьми категорий. Жалоба на любой случай, случай для любой жалобы.
behemoth-paperwork=Зарегистрируйте кусаку или плеваку-бегемота за административным столом. Вы хотели контент для финала игры. Он хочет поговорить с вашим начальником.
terms-and-conditions-apply=Исследуйте __TECHNOLOGY__vulcanus-certification__. Ландшафт нанял адвоката.
organically-sourced-nonsense=Исследуйте __TECHNOLOGY__gleba-conciliation__. Бумаги биоразлагаемые, особенно в эмоциональном смысле.
file-not-found=Постройте __ENTITY__archive-recombination-bureau__. Удаление оригинала теперь функция, а не заявка в поддержку.
frozen-pdf=Исследуйте __TECHNOLOGY__aquilo-cryogenic-administration__. Даже на Аквило документам нужен тёплый приём.
workforce-formation-achievement=Исследуйте __TECHNOLOGY__worker-formation__. Дерево технологий стало карьерной лестницей. Собеседования при увольнении нет ни там, ни там.
administrative-space-station-achievement=Постройте __ENTITY__administrative-space-station__. Руководство просило поднять накладные расходы. Вы поняли буквально.
orbital-employment-catapult-achievement=Постройте __ENTITY__orbital-employment-catapult__. В вакансии обещали стремительный взлёт карьеры.
trajectory-compliance-array-achievement=Постройте __ENTITY__trajectory-compliance-array__. Гравитацию попросили заполнить бланк.
senior-trajectory-compliance-array=Постройте __ENTITY__senior-trajectory-compliance-array__. Камни крупнее, должности выше. Совещание то же.
executive-trajectory-compliance-array=Постройте __ENTITY__executive-trajectory-compliance-array__. На таком уровне последствия относятся к чужим обязанностям.
vesm-mass-production=Произведите 10 __ITEM__voluntary-exploration-space-miner__ в час. В анкете только один вариант ответа: добровольно.
orbital-permit-mill=Произведите 50 __ITEM__orbital-infrastructure-permit__ в час. Космос почти пуст. Для ведомства это место под новые бланки.
chromatic-printing-achievement=Исследуйте __TECHNOLOGY__chromatic-printing__. Бюрократия открыла цвет. Бюджет остаётся в минусе.
chromatic-printer-achievement=Постройте __ENTITY__chromatic-printer__. Спасение галактики подождёт. Закончился голубой.
triple-ink-threat=Произведите 100 __ITEM__trichromatic-permit__ в час. Голубой, пурпурный, жёлтый, чёрный. Ясного ответа всё ещё нет.
ink-hoarder=Произведите 10000 __ITEM__ink__ за одну игру. Бюджет на чернила засекречен. Поэтому бюджетное совещание длится весь день.
cyan-magenta-yellow-black=Произведите 1000 __ITEM__trichromatic-permit__ за одну игру. Четыре краски для трёхцветного разрешения. Даже название предмета нуждается в проверке.
notary-public=Постройте __ENTITY__notary-office__. Официальным сделкам нужны официальные печати. И отдельное здание.
territorial-arbitrator=Постройте __ENTITY__territorial-arbitration-post__. Разрушителям вручены повестки. Местность готовит показания.
demolisher-eviction-specialist=Произведите 5 __ITEM__territorial-deed__ за одну игру. Выселение бумагами: менее зрелищно, чем динамит, зато обиднее.
chartered-accountant=Произведите 100 __ITEM__offworld-metallurgy-charter__ за одну игру. Интеллектуальная собственность Вулкануса путешествует с бейджем.
conciliation-officer-achievement=Постройте __ENTITY__conciliation-desk__. Биология встречает бюрократию и сразу назначает следующую встречу.
capture-bureau-achievement=Постройте __ENTITY__capture-bureau__. Ярмарка вакансий для враждебной фауны. Нетворкинг непростой.
space-tourism-mogul=Произведите 500 __ITEM__public-transportation-contract__ за одну игру. Вы изобрели транспорт. Юристы изобрели 500 причин его пропустить.
symbiosis-specialist=Произведите 100 __ITEM__symbiosis-record__ в час. Вы индустриализировали учёт образцов. Очень узкая, но настоящая власть.
digital-services-bureau-achievement=Постройте __ENTITY__digital-services-bureau__. Очередь стала электронной. Это засчитывается как её устранение.
archive-recombinator=Исследуйте __TECHNOLOGY__fulgora-salvage-administration__. Кто-то бросил эти бумаги. Вы купили дополнение, чтобы получить их в наследство.
form-gambler=Произведите 1000 __ITEM__old-archive__ за одну игру. Археология, где каждую находку можно было отправить письмом.
relay-clerk-corps=Произведите 10 __ITEM__relay-clerk__ за одну игру. Специалисты по передаче данных, которые никак не уберут вас из копии письма.
laser-printer-achievement=Постройте __ENTITY__laser-printer__. Жидкие чернила не прошли дресс-код Аквило. Твёрдый носитель понял задание.
thermal-paper-pusher=Произведите 5000 __ITEM__thermal-transfer-sheet__ за одну игру. Премиальный носитель для планеты, которая замораживает даже формальности.
ribbon-collector=Произведите 2000 __ITEM__composite-chroma-ribbon__ за одну игру. Сжатый цвет для пустоты, которой всё ещё не хватает документации.
interplanetary-correspondent=Произведите 50 __ITEM__unified-operations-charter__ за одну игру. Четыре мира объединены в один очень дорогой групповой чат.
cyan-yellow-bureaucrat=Произведите 500 __ITEM__cyan-yellow-form__ за одну игру. Вулканус и Глеба объединены, но название отдела ещё не согласовано.
cyan-magenta-bureaucrat=Произведите 500 __ITEM__cyan-magenta-form__ за одну игру. Вулканус и Фулгора защищены от повреждений и ответственности.
yellow-magenta-bureaucrat=Произведите 500 __ITEM__yellow-magenta-form__ за одну игру. Глеба и Фулгора: биологическое архивирование, электрические объяснения.
hardened-data-hoarder=Произведите 100 __ITEM__hardened-data-vault__ за одну игру. Резервная копия без комитета — просто оптимизм.
bureaucratic-transcendence-achievement=Исследуйте __TECHNOLOGY__bureaucratic-transcendence__. Бумаги больше не тормозят поезда. Следующее узкое место получило повышение.
form-free-transit=Постройте 50 __ENTITY__public-train-stop__. Поезда, которые работают: чудо, ради которого понадобилось позднее исследование.
maxed-out-orbital-capacity=Исследуйте __TECHNOLOGY__orbital-employment-capacity-4__. Пять шахтёров на астероид. Отдел кадров открыл плотность.
maxed-out-orbital-damage=Исследуйте __TECHNOLOGY__orbital-employment-damage-5__. Шахтёры бьют как тонна кирпичей с годовыми показателями.
speed-demon-arrays=Исследуйте __TECHNOLOGY__trajectory-compliance-speed-9__. Приказ каждые 1,5 секунды. Пометка «срочно» на всём наконец сработала.
executive-jurisdiction=Исследуйте __TECHNOLOGY__trajectory-compliance-jurisdiction-3__. Любой размер астероида, никакого обжалования и омбудсмена.
vulcanus-export-licensed=Исследуйте __TECHNOLOGY__vulcanus-export-charters__. Лицензия путешествует лучше лавы.
cyan-yellow-merged=Исследуйте __TECHNOLOGY__cyan-yellow-bureaucracy__. Две планеты, один бланк, вдвое больше согласующих.
cyan-magenta-merged=Исследуйте __TECHNOLOGY__cyan-magenta-bureaucracy__. Металлургия встречает электромагнетизм. Обоим нужна подпись.
yellow-magenta-merged=Исследуйте __TECHNOLOGY__yellow-magenta-bureaucracy__. Биология встречает лом. Это либо инновация, либо предупреждение на этикетке.
boots-on-the-ground=Постройте __ENTITY__field-office__. Вы автоматизировали фабрику и изобрели дорогу на работу.
human-resources=Произведите 10 __ITEM__biter-logistics-formation__ за одну игру. Название отдела пережило полное отсутствие людей.
last-mile-management=Постройте __ENTITY__biterport__. У сети доставки есть ноги. Заслуги всё равно присвоит руководство.
company-car=Постройте __ENTITY__rideable-biter__. Служебный транспорт запросил стоматологическую страховку.
business-class=Постройте __ENTITY__passenger-wagon__. Ваши жалобы путешествуют вместе. Это называется нетворкинг.
middle-management=Постройте __ENTITY__personnel-routing-multisign__. Три направления, один начальник. Ходить будут остальные.
per-my-last-prompt=Постройте __ENTITY__ai-server__. Вы автоматизировали письма, которые должны были заменить совещания.
procedurally-generated-excuses=Произведите 1000 __ITEM__administrative-slop__ за одну игру. Один ИИ написал документы. Другой его похвалит.
manufactured-consent=Постройте __ENTITY__synthetic-personnel-bureau__. В вакансии говорилось, что вы поможете сформировать следующего сотрудника.
mandatory-team-building=Постройте __ENTITY__involuntary-relocation-cannon__. Присутствие обязательно. Перелёт баллистический.
