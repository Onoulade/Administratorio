[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Добро пожаловать в Administratorio.[/font]\n\nЭтот мод заменяет военные действия на бюрократию. Кусаки и плеваки больше не собираются в группы атаки — они выстраиваются в очередь. Они приходят к вашим [entity=admin-station], подают жалобы и ждут, пока вы их рассмотрите. Чтобы выжить, вам придётся безостановочно перемещать документы.\n\n[font=default-bold]Основной цикл:[/font]\n1. Кусака занимает место у стойки и выкладывает талоны с жалобами.\n2. Вы забираете эти талоны и обрабатываете их в [entity=resolution-office], получая закрытые дела.\n3. Вы вставляете закрытые дела обратно в тот слот стойки, где сидит кусака.\n4. Получив все нужные закрытые дела, кусака оставляет [item=taxpayer-money] и уходит домой, исчезая из игры.\n\nЕсли очередь переполняется или кусаке приходится ждать слишком долго, он объявляет забастовку и отключает ближайшее к нему здание. Следующие подсказки объяснят, как не доводить до этого.
administratorio-work-orders=[font=default-bold]Станки потребляют документы как полноценный ингредиент.[/font]\n\nАдминистративные документы — это такие же ресурсы, как железо или медь. Если в автомате нет нужного документа, он встанет, даже если все остальные ингредиенты уже есть на конвейере.\n\n[font=default-bold]Сборочные автоматы работают на нарядах-допусках:[/font]\nКаждый рецепт автомата расходует [item=work-order] или один из его продвинутых вариантов. Тяжёлые рецепты требуют более строгих нарядов-допусков: [item=safety-work-order], [item=construction-work-order], [item=management-verbal-work-order] или [item=management-written-work-order]. Новые рецепты открываются синхронно с требуемым уровнем документов, поэтому бумажная эволюция идёт рука об руку с деревом технологий.\n\n[font=default-bold]У других станков своя бюрократия:[/font]\n• Печи расходуют [item=carbon-offset-certificate-basic]\n• Химзаводы расходуют [item=chemical-handling-work-order]\n• Центрифуги расходуют [item=radiological-work-order]\n\nЭто независимые цепочки поставок — наряды-допуски не заменят вам углеродные сертификаты, а документы для разных машин не взаимозаменяемы.\n\n[font=default-bold]Исключение — нефтепереработка:[/font]\nНефтезаводы [color=red]не[/color] потребляют эксплуатационные документы. Они и так требуют диспетчеризации через центр занятости кусак (кусака должен физически подойти к НПЗ, чтобы запустить производственный цикл). Бюрократия считает такой надзор достаточным.\n\nПроектируйте линии документов так же тщательно, как линии с медью и железом.
administratorio-biter-complaints=[font=default-bold]Приёмная стойка заменяет волны атак на организованную очередь.[/font]\n\nВместо того чтобы собираться в рейды, кусаки и плеваки идут к вашим [entity=admin-station] в поисках свободного окошка. Каждая стойка начинает с 4 окон обслуживания; ветка исследований [technology=admin-station-capacity-1] (8 уровней) увеличивает это число до 12.\n\n[font=default-bold]Как проходит приём граждан:[/font]\n1. Кусака занимает окно и выкладывает в инвентарь стойки одну или несколько жалоб.\n2. Вы забираете их и обрабатываете в [entity=resolution-office], превращая в закрытые дела.\n3. Вы вставляете эти закрытые дела обратно в окно к кусаке.\n4. Получив все свои закрытые дела, кусака оставляет [item=taxpayer-money] и уходит домой, исчезая из игры.\n\n[font=default-bold]Уровни жалоб и габариты граждан:[/font]\nТип жалобы зависит от вида существа. Кусаки жалуются на ландшафт, смог, шум и безработицу; плеваки — на лужи кислоты, опасные материалы, праздношатание в закрытых зонах и бродяжничество. По мере роста эволюции открываются новые типы жалоб, и ваш Отдел урегулирования должен успевать их обрабатывать. Крупные особи приносят [font=default-bold]сразу несколько жалоб[/font] — один чудовищный кусака может затребовать целый набор закрытых дел, прежде чем уйдёт.\n\n[font=default-bold]Эволюция никуда не делась:[/font]\nУльи по-прежнему впитывают загрязнение и наращивают эволюцию. Каждый новый скачок эволюции меняет тип жалоб, так что ваша цепочка урегулирования должна расти вместе с фабрикой.\n\n[item=taxpayer-money] идут на оплату капсул, зарплат и экспансию. Чем быстрее вы закрываете жалобы, тем больше средств поступает в бюджет. Кроме того, каждая стойка выдаёт логические сигналы о количестве жалоб, свободных местах и общем размере очереди: подключите провода и расширяйте приёмные до того, как они переполнятся.
administratorio-frustration=[font=default-bold]Недовольство начинает копиться в тот момент, когда кусака выходит из улья.[/font]\n\nТаймер тикает до тех пор, пока гражданин не получит на руки [color=green]все[/color] закрытые дела по [color=green]каждой[/color] своей жалобе. Наведите курсор на любого кусака, чтобы узнать его настроение.\n\n[font=default-bold]Забастовка начинается в двух случаях:[/font]\n• Таймер недовольства доходит до 100% до того, как вы успеваете закрыть дело.\n• Кусака приходит к приёмной, а свободных окошек больше нет.\n\nВ обоих случаях он идёт к ближайшему станку игрока и отключает его, пока вы не вмешаетесь.\n\n[font=default-bold]Пустые обещания:[/font]\nБросьте [item=promise] в [color=red]бастующего кусаку[/color] (а не в здание):\n• Если в приёмной есть свободное место, кусака вернётся в очередь с недовольством [font=default-bold]50%[/font] и продолжит ждать.\n• Если свободных мест нет, он будет искать свободное место [font=default-bold]одну минуту[/font], а затем снова начнет бастовать, если ничего не освободится.\n• Обещание [color=red]не[/color] закрывает жалобу и не обнуляет прогресс производства документов.\n\nОбещания лишь выигрывают время. Единственный способ окончательно убрать кусаку из очереди — выдать ему нужное закрытое дело, чтобы он ушел сам. Ставьте новые стойки до того, как переполнится очередь, и масштабируйте производство закрытых дел так, чтобы дела закрывались быстрее, чем накапливается недовольство кусак.
administratorio-complaint-chain=[font=default-bold]Талоны с жалобами — это ваша новая кривая эволюции.[/font]\n\nФактор эволюции по-прежнему растёт из-за загрязнения. Однако теперь вместо более сильных волн к вам приходят более высокопоставленные граждане, требующие более длинных бюрократических цепочек. На первых порах стойки будут получать простые талоны; позже та же самая очередь будет требовать от вас вести сразу несколько параллельных дел.\n\n[font=default-bold]Кусаки жалуются на воздействие фабрики:[/font]\n• [item=ticket-landscape] Жалобы на порчу ландшафта — начало бюрократической цепочки.\n• [item=ticket-smog] Дела по смогу появляются по мере роста выбросов.\n• [item=ticket-noise] Дела по шуму приходят вместе с тяжёлой промышленностью.\n• [item=ticket-unemployment] Жалобы на безработицу — поздний тип дел кусак.\n\n[font=default-bold]Плеваки жалуются на поведение и нормы безопасности:[/font]\n• [item=ticket-littering] Лужи кислоты — стартовые проблемы с плеваками.\n• [item=ticket-hazmat] Жалобы на опасные материалы приходят вместе с химзаводами.\n• [item=ticket-loitering] Штрафы за закрытые территории добавляют ещё одну ветку на средних этапах.\n• [item=ticket-vagrancy] Дела о бродяжничестве — высшая инстанция жалоб плевак.\n\n[font=default-bold]Размер имеет значение:[/font]\nМелким особям обычно хватает одного закрытого дела. Средние, большие и чудовищные граждане приносят сразу несколько заявлений, и они не уйдут до тех пор, пока [color=green]каждый[/color] требуемый документ не окажется в их слоте. Один поздний гражданин способен заблокировать окно обслуживания, ожидая несколько разных закрытых дел.\n\nКаждое семейство жалоб требует своих рецептов в [entity=resolution-office] и дальнейшей обработки документов. Создавайте буферы для всех открытых типов жалоб, мониторьте датчики на стойках и расширяйте конвейеры до того, как эволюция откроет следующий тип жалоб.
administratorio-nest-expropriation=[font=default-bold]Снос улья уничтожает его навсегда — и напрямую влияет на вашу кривую эволюции.[/font]\n\nБросьте [item=eviction-notice] на территорию противника, и ближайший улей будет уничтожен окончательно. Это единственный способ освободить территорию в этом моде.\n\n[font=default-bold]Рычаг эволюции:[/font]\nСнесённые ульи перестают впитывать загрязнение, так что снос — это ещё и способ замедлить эволюцию. Загвоздка в том, что ульи генерируют кусак, а кусаки генерируют [item=taxpayer-money]. Если вы уничтожите все ульи, фабрика останется без финансирования. Вся игра строится на балансе: оставьте достаточно ульев для финансирования операций, и сносите ровно столько, чтобы эволюция не обгоняла вашу способность закрывать дела.\n\n[font=default-bold]Проблема бездомных:[/font]\nКусаки, оказавшиеся рядом со снесённым ульем, не умирают. Их выселяют прямо к вам в приёмную, причём с уже повышенным градусом недовольства. Проводите выселения только тогда, когда ваши клерки готовы обработать волну возмущённых переселенцев.\n\nЕсли вам нужно временно замедлить улей без перемещения кусак, используйте [item=hush-money].
administratorio-hush-money=[font=default-bold]Взятка за молчание временно приостанавливает появление кусак из улья.[/font]\n\nБросьте [item=hush-money] во вражеский улей. Ульи в радиусе действия временно затихают на несколько минут, после чего возвращаются к штатной работе. Пока они подавлены, новые кусаки не выходят подавать жалобы.\n\nИспользуйте этот метод, когда очередь переполнена, и вам нужно замедлить приток, чтобы клерки успели разобрать накопившиеся жалобы. Каждая такая взятка стоит вам [item=taxpayer-money], так что относитесь к ней как к аварийному инструменту, а не долгосрочной стратегии.\n\nВ отличие от [item=eviction-notice], взятки не уничтожают ульи и не перемещают кусак к вам в очередь — их единственная задача — приостановить появление новых кусак.
administratorio-working-hours=[font=default-bold]Некоторые административные здания не работают по ночам.[/font]\n\nПравило тематическое: если в здании либо работают кусаки, [font=default-bold]приходящие на смену[/font] ([entity=office-desk], [entity=corporate-breakroom], [entity=union-headquarters], [entity=biter-station], [entity=biterport]), либо кусаки используются [font=default-bold]как ингредиент рецепта[/font], его персонал расходится по домам на закате. Без вмешательства здание простаивает до рассвета.\n\nЧтобы оставить их работать в ночную смену, нужно выдать им правильный ресурс:\n• [font=default-bold]Для офисных зданий[/font] — вставьте [item=overtime-exemption] в слот модуля здания. Хватит и одного; лишние копии не дают бонусов.\n• [font=default-bold]Для зданий диспетчеризации[/font] — подайте [fluid=liquid-coffee] в любую из четырёх боковых труб. Каждый ночной выход рабочего расходует одну порцию.\n\nЧастичного ночного штрафа нет: здание с нужным ресурсом работает ровно с той же скоростью днём и ночью. Без него оно просто полностью простаивает ночью, а не замедляется — это переключатель «вкл/выкл», а не регулятор производительности. Забастовки всё равно отключают здания даже при разрешении на сверхурочную работу — разрешение даёт ночную работу, а не защищает от очереди.\n\nЕсли эта механика вам не нравится, выключите настройку «Рабочие часы» в стартовых опциях перед началом игры.
administratorio-biter-employment=[font=default-bold]Трудовые договоры перенаправляют закрывших дело граждан в штат работников.[/font]\n\nПоложите [item=job-offer] в слот [entity=admin-station] до того, как гражданин получит финальное закрытое дело. Договор расходуется при попытке найма, а успешный найм заменяет обычную выплату [item=taxpayer-money].\n\n[font=default-bold]Без Space Age:[/font] соглашается любой закрывший дело кусака или плевака. Размер определяет выход [item=biter-worker]: Малый 1, Средний 2, Большой 3, Чудовищный 5.\n\n[font=default-bold]С Space Age:[/font] прямой найм заменяется системой зачисления. Шанс получить одного [item=enrolled-biter] есть только у спокойных кусак с Nauvis, и его затем нужно провести через рецепт [recipe=worker-biter-formation] в [entity=formation-center]. Пороги недовольства смотрите в подсказке «Зачисление Space Age».\n\nРабочие обслуживают рассылку [entity=biter-station], логистику кусак и обучение специалистов. Держите трудовые договоры именно в тех окнах, откуда вы хотите нанимать.
administratorio-biter-workers=[font=default-bold]Рабочие-кусаки — это ресурсы, необходимые для запуска поднадзорных машин.[/font]\n\n[item=biter-worker] сидит на [entity=biter-station], пока диспетчер не отправит его на задание. Рабочий идёт к станку, позволяет выполнить один производственный цикл и возвращается обратно. Весь производственный конвейер держится на этом цикле.\n\n[font=default-bold]Обучение в [entity=formation-center]:[/font]\nУчебный центр работает как обычный сборочный автомат. Откройте его интерфейс и выберите специальность. Загружайте [item=biter-worker] и нужные документы через конвейеры и манипуляторы — готовый специалист выйдет с другой стороны. Заберите его в инвентарь. Когда вы решите [color=red]построить[/color] соответствующее здание, специалист будет списан в момент закладки фундамента, а не во время работы.\n\nПрофессии и что они открывают:\n• [item=union-delegate] — для возведения [entity=union-headquarters]\n• [item=chemical-operator] — для постройки [entity=chemical-plant]\n• [item=nuclear-technician] — для постройки [entity=centrifuge] и реакторов\n• [item=biter-logistics-formation] — кусаки-грузчики для работы в [entity=biterport]\n• [item=rideable-biter] — переводит рабочего в личный автопарк\n\nИсключение — нефтепереработка: НПЗ строятся по обычной строительной цепочке, а работают от кусак из центра занятости. Переучивать их через Учебный центр не нужно. Планируйте запас специалистов под строительство, а не под пропускную способность конвейеров.
administratorio-rideable-biter=[font=default-bold]Служебный транспорт на деньги налогоплательщиков.[/font]\n\nРазместите [item=rideable-biter], чтобы использовать рабочего в качестве личного авто. Он расходует [item=taxpayer-money] из топливного бака, чтобы оставаться назначенным, и практически не имеет багажника.\n\n[font=default-bold]Правила эксплуатации:[/font]\n• После установки его [color=red]нельзя ни добыть, ни разобрать[/color] — он уходит сам.\n• Оставленный без присмотра, может бесцельно бродить неподалеку.\n• Если топливный слот пустует [font=default-bold]10 минут[/font], контракт разрывается.\n\n[font=default-bold]Что происходит при заморозке финансирования:[/font]\nКусака возвращается в дикое состояние [entity=medium-biter] и отправляется прямиком в систему жалоб. Если в приёмной есть место, он встаёт в очередь. Если всё забито, он начинает бастовать как любой другой необслуженный гражданин — и вполне вероятно, что он отключит именно то здание, возле которого вы его оставили.\n\nДержите несколько монет в запасе.
administratorio-biter-station=[font=default-bold]Обязательная инфраструктура: некоторые здания без неё просто не включатся.[/font]\n\nЭти поднадзорные станки работают только тогда, когда к ним подходит кусака и разрешает запуск:\n• [entity=oil-refinery]\n• [entity=centrifuge]\n• [entity=printer-t2]\n• [entity=corporate-breakroom]\n• [entity=propaganda-distillery]\n\nБез [entity=biter-station] в зоне видимости эти машины будут простаивать, сколько бы документов вы в них ни загрузили. [entity=union-headquarters] в этот список не входит — он и так потребляет кусаку ещё на этапе строительства.\n\n[font=default-bold]Как работает диспетчеризация:[/font]\n• Загрузите в центр занятости [item=biter-worker] и [item=taxpayer-money].\n• Центр занятости обслуживает все подотчётные здания в радиусе [font=default-bold]30 клеток[/font].\n• Он по кругу рассылает рабочих к каждому станку в зоне ответственности.\n• Каждый визит разрешает ровно один производственный цикл; после этого рабочий возвращается.\n• Одно здание может обслуживаться [color=green]сразу несколькими станциями[/color] — перекрытие зон означает более частые визиты и рост производительности.\n\nНаведите курсор на станок, чтобы увидеть, кто именно его обслуживает. Наведите курсор на центр занятости, чтобы увидеть зону покрытия и статус рассылки.\n\n[font=default-bold]Эффективность труда:[/font]\nПо умолчанию рабочий авторизует 1 станок за выезд; прокачка увеличивает это число до 3, а затем до 5 машин за рейс. Внешний вид отправленного кусаки меняется с каждым улучшением: небольшой кусака на 1 уровне, бригада на 2-м, и крупный проверяющий на 3-м. Оплата списывается соответственно: 1, 2 и 3 [item=taxpayer-money] за выход.\n\n[font=default-bold]Ночные смены:[/font]\nНочью каждый выход дополнительно списывает [fluid=liquid-coffee] из любой боковой трубы. Нет жидкого кофе — нет ночных смен.\n\n[font=default-bold]Примечание по бюджету:[/font]\nМеньше рейсов означает меньше выплат. Прокачка эффективности снижает затраты [item=taxpayer-money] на единицу продукции, а не просто увеличивает частоту визитов.
administratorio-biterport=[font=default-bold]Кусакопорт — это аналог робопорта, только с кусаками-грузчиками.[/font]\n\nЗагрузите в него [item=biter-logistics-formation] (обучаются в [entity=formation-center]) и [item=taxpayer-money]. Кусаки-грузчики будут выходить наружу, перетаскивать вещи между сундуками логистики и строить объекты по чертежам в своей зоне.\n\n[font=default-bold]Зона покрытия:[/font]\n• Радиус логистики: [font=default-bold]25 клеток[/font]\n• Радиус строительства: [font=default-bold]55 клеток[/font]\n• Радиус объединения в сеть: кусакопорты, стоящие в пределах [font=default-bold]50 клеток[/font] друг от друга, объединяют штат кусак-грузчиков — их зонам не обязательно пересекаться, чтобы установить связь.\n\n[font=default-bold]Улучшения грузоподъёмности[/font] (вещей за один рейс):\n• База: [font=default-bold]1[/font]\n• Уровень 1: [font=default-bold]2[/font]\n• Уровень 2: [font=default-bold]5[/font]\n• Уровень 3: [font=default-bold]10[/font]\n• Уровень 4: [font=default-bold]25[/font] (требует химических исследовательских пакетов)\n\nКаждый уровень также улучшает саму единицу кусаки-грузчика, постепенно повышая скорость передвижения. Исследуйте грузоподъёмность как можно раньше — 8 базовых кусак-грузчиков перенесут всего 8 предметов суммарно, что сильно ограничивает строительство до первого же улучшения.\n\n[font=default-bold]Ночные смены:[/font]\nНочью каждый выход кусаки-грузчика дополнительно списывает [fluid=liquid-coffee] из любой боковой трубы.\n\nНаведите курсор на кусакопорт, чтобы увидеть статус сети, активный штат и количество подключений.
administratorio-field-office=[font=default-bold]Бесплатная рабочая сила без оформления в штат.[/font]\n\nПоставьте [entity=field-office] недалеко от вражеского улья (примерно в пределах [font=default-bold]200 клеток[/font]). Канцелярия вызовет кусаку из ближайшего улья и позволит ему выполнить работу на месте. Выполнив [font=default-bold]2 производственных цикла[/font], кусака уйдёт домой, и его заменит следующий.\n\n[font=default-bold]Правила эксплуатации:[/font]\n• Здание работает, только пока кусака физически находится на объекте.\n• Скорость 0.5x и 0 загрязнения в процессе работы.\n• Офис простаивает, если в радиусе нет ни одного живого улья.\n• Работает всю ночь и не имеет слотов для модулей.\n\n[font=default-bold]Зачем это нужно:[/font]\nВыездная канцелярия — временное решение между «у меня вообще нет кусак» и «у меня полностью укомплектована [entity=biter-station]». Она позволяет создать пару критически важных предметов до того, как отдел жалоб обеспечит вас штатным персоналом — в обмен на необходимость строиться рядом с ульем.
administratorio-hired-biter=[font=default-bold]Ручной кусака, подчиняющийся прямым приказам.[/font]\n\nБросьте [item=hired-biter-capsule], чтобы выпустить в поле управляемого кусаку. Он переносит до [font=default-bold]20[/font] [item=eviction-notice] в 4-слотовом инвентаре и самостоятельно патрулирует территорию в поисках ульев для выселения.\n\n[font=default-bold]Управление[/font] (держите в руках [item=hired-biter-command-capsule]):\n• [font=default-bold]Щелчок левой кнопкой[/font] по земле — выделить/снять выделение с агентов под курсором.\n• [font=default-bold]Щелчок правой кнопкой[/font] по земле — отправить выделенных агентов в точку.\n• [font=default-bold]Shift + щелчок правой кнопкой[/font] по земле — добавить точку к маршруту (задать патрулирование).\n• [font=default-bold]Shift + щелчок правой кнопкой[/font] по сундуку — добавить точку пополнения: агент дойдёт до ящика и пополнит запас [item=eviction-notice] на ходу.\n• [font=default-bold]Shift + щелчок левой кнопкой[/font] по сундуку — принудительно загрузить инвентарь агентов [item=eviction-notice] из этого сундука прямо сейчас.\n\n[font=default-bold]Поведение в бою:[/font]\nЗаряженный агент сканирует территорию на [font=default-bold]60 клеток[/font] вокруг в поисках вражеских ульев. Найдя цель, он подходит вплотную и списывает одно [item=eviction-notice] на ликвидацию улья. Один агент на патруле может удерживать территорию под контролем, если вы вовремя пополняете его запас предписаний.\n\n[font=default-bold]Автоматическое пополнение:[/font]\nАгенты, находящиеся в зоне покрытия обычных робопортов, будут автоматически запрашивать [item=eviction-notice] у логистической сети, когда у них заканчиваются документы. Поставьте ящик пассивного снабжения с предписаниями неподалеку от зоны патрулирования, и агент будет обслуживать себя сам без ручных приказов на пополнение.\n\nСнос ульев силами агентов по-прежнему перемещает ближайших кусак прямо к вам в приёмную, как при ручном броске капсул. Планируйте вместимость стоек заранее.
administratorio-orbital-employment-catapult=[font=default-bold]Орбитальная катапульта трудоустройства запускает добровольных шахтёров-исследователей (ДШИ) на астероиды.[/font]\n\nОткрывается технологией [technology=orbital-compliance-systems]. Катапульта бьёт на 56 клеток, но стреляет только через узкий сектор в 18°, центрированный по направлению установки. При попадании ДШИ прикрепляется и начинает добычу после короткой задержки.\n\n[font=default-bold]Механика добычи:[/font]\n• Базовый урон: 137,5/сек за каждого прикреплённого шахтёра (масштабируется с [technology=orbital-employment-damage-1..5])\n• Каждый астероид принимает 1 шахтёра по умолчанию, до 5 — с [technology=orbital-employment-capacity-1..4]\n• Урон складывается линейно за каждого прикреплённого шахтёра\n• Когда астероид погибает, он даёт полный ванильный выход фрагментов ПЛЮС один фрагмент [item=returning-orbital-employee] за каждого прикреплённого шахтёра\n• Фрагмент сотрудника добывается коллекторами астероидов прямо в переиспользуемые боеприпасы\n\n[font=default-bold]Важно — собирайте фрагменты сотрудников:[/font] Если коллектор астероидов упускает фрагмент сотрудника (он уносится за пределы радиуса сбора), этот шахтёр ПОТЕРЯН НАВСЕГДА. Располагайте коллекторы внимательно или используйте несколько коллекторов, чтобы покрыть зону сноса.\n\n[font=default-bold]Приоритет назначения:[/font] Катапульта выбирает ближайший подходящий астероид внутри своего сектора стрельбы со свободной вместимостью. Запуски резервируют вместимость немедленно, и астероид с прикреплённым или летящим ДШИ нельзя отклонить. Если все подходящие астероиды заполнены, катапульта приостанавливается до освобождения места.
administratorio-orbital-infrastructure-permit=[font=default-bold]Разрешения на орбитальную инфраструктуру дают право на административное строительство космических платформ.[/font]\n\nОткрывается технологией [technology=space-platform] (ваниль). Производятся в бюро, способном оформлять регистрацию, из [item=blank-directive], [item=transit-authorization], [item=low-density-structure] и [item=processing-unit].\n\n[font=default-bold]Применение:[/font] Требуется как ингредиент для размещения [entity=administrative-space-station], [entity=trajectory-compliance-array], [entity=orbital-employment-catapult] и других орбитальных административных зданий. Обычное [item=construction-permit] не имеет юрисдикции в вакууме — это его космический эквивалент.\n\n[font=default-bold]Цепочка поставок:[/font] Изготавливайте разрешения до или одновременно с постройкой первой платформы. Держите запас вместе со строительными материалами: каждое орбитальное сооружение расходует одно разрешение при установке.
administratorio-relocation-cannon=[font=default-bold]Настройки цели нет. Запрашивает принимающая сторона.[/font]\n\nДва отдельных здания: [entity=involuntary-relocation-cannon] отправляет, [entity=involuntary-relocation-receiver] запрашивает.\n\n[font=default-bold]Отправка:[/font] загрузите во входной слот пушки персонал семейства кусак. Это всё. Она ответит любому получателю на другой планете, чей запрос совпадает с тем, что она хранит — пока слот не опустеет полностью, она не примет другой тип груза.\n\n[font=default-bold]Приём:[/font] загрузите [item=involuntary-transfer-order] во входной слот получателя и подключите его к логической сети с сигналом, называющим каждый предмет, нужный этой планете. За каждый прибывший предмет тратится один приказ, а прибытия появляются в выходных слотах.\n\n[font=default-bold]Планете, работающей в обоих направлениях, нужно по одному зданию каждого вида.[/font] В отличие от [entity=interplanetary-terminus], ни одно из них не ограничено одним на планету.\n\n[font=default-bold]Она переносит персонал, но не яйца[/font], и только между планетами. Для всего остального остаются ракеты.
administratorio-egg-couriers=[font=default-bold]Яйца кусак никогда не покидают Навис.[/font]\n\nИспорченные яйца выводят враждебных кусак, по одному на 25 яиц. Вне Нависа нет [entity=admin-station], цепочки жалоб и способа справиться с результатом. Поэтому каждый ванильный рецепт, который тратил яйца вне мира, теперь принимает курьера, подготовленного на Нависе. Ванильная цена в яйцах не изменилась — изменилось только то, что пересекает космос.\n\n• [item=missionary-manager] — на Аквило, расходуется [entity=captive-biter-spawner]\n• [item=voluntary-research-subject] — на орбиту, расходуется наукой Администраториума\n• [item=geotechnical-assessment-manager] — на Глебу, [color=green]возвращается[/color] после почвенного крафта\n\n[font=default-bold]Все трое истекают через 30 минут[/font] в обычного [item=middle-management-managing-manager]. Просроченный курьер стоит яиц и перелёта, но не менеджера.\n\n[font=default-bold]Ловушка входного слота:[/font] наука Администраториума производится пачками: перед запуском должны лежать 250 [item=promethium-asteroid-chunk] и 10 [item=quantum-processor]. [color=red]Cobaye, вставленный до прибытия обломков, тратит свои 30 минут во входном слоте и там истекает.[/color] Сначала подготовьте обломки и процессоры, последним доставляйте курьера. Эта ошибка тихая и дорогая.
administratorio-chromatic-trunk=[font=default-bold]Цветные документы не проходят по базовой магистрали.[/font]\n\nПока на Аквило не исследована [technology=interplanetary-tube-chromatic], [entity=interplanetary-terminus] перевозит только обычные чёрночернильные документы: бланки, тикеты, дела, папки, записки, бумагу, чернила и деньги налогоплательщиков. Голубые, жёлтые, пурпурные и составные документы не являются допустимым грузом, и манипуляторы откажутся их загружать.\n\n[font=default-bold]После хроматического уровня:[/font] пустые цветные бланки, три двухцветных бланка, [item=cryogenic-operations-license], [item=hardened-data-vault], [item=trichromatic-permit], [item=unified-operations-charter] и [item=promethium-research-charter] становятся допустимыми грузами магистрали.\n\n[font=default-bold]Стратегическое замечание:[/font] попав в пул, документ доступен по запросу любой планеты, включая ту, что его только что добавила. Зарезервировать документ из пула для конкретного получателя невозможно.
administratorio-interplanetary-terminus=[font=default-bold]Межпланетный терминус — это конечная точка магистрали. По одному на планету, больше с исследованиями.[/font]\n\nОткрывается [technology=interplanetary-tube-network]. Его входной слот хранит один тип бланка для экспорта и принимает только допустимые грузы. Он уходит по собственному таймеру и попадает в пул, общий для всех планет вашей команды — запрос для загрузки не нужен.\n\n[font=default-bold]Зелёный провод:[/font] задайте сигнал для каждого бланка, нужного этой планете; подходящий бланк из пула забирается мгновенно, независимо от происхождения — даже бланк, который эта же планета сама туда добавила.\n[font=default-bold]Красный провод:[/font] читает текущее содержимое пула по всей империи. Оба цвета используют один и тот же разъём Терминуса, не мешая друг другу.\n\n[font=default-bold]Больше одного на планету:[/font] [technology=interplanetary-tube-additional-terminus-3] и два его предварительных условия каждое позволяют построить ещё один Терминус на той же планете. Последнее из трёх — бесконечное: дорогое, но без потолка.\n\n[font=default-bold]Прибытия не подаются автоматически.[/font] Прибывшие документы лежат в выходном инвентаре Терминуса, пока вы их не заберёте. Это намеренно: так есть видимый буфер, список содержимого, читаемый логической сетью, и реальное разделение локального пула труб и межпланетного.
administratorio-interplanetary-trunk=[font=default-bold]Магистраль намеренно узкая и медленная.[/font]\n\nЛокальная пневматическая сеть мгновенна, отдельна для каждой поверхности и расширяется до 200 бланков. Межпланетная магистраль — [color=red]отдельный[/color] пул: она начинает с 3 предметов в полёте, по 30 секунд каждый, и никогда не сливается с локальным пулом. Иначе вы получили бы бесплатную телепортацию между планетами, и ракеты потеряли бы смысл.\n\n[font=default-bold]Транзит считается по предмету, не по партии.[/font] Каждый предмет несёт собственный таймер, поэтому многие могут лететь одновременно; вместимость задаёт количество, время транзита — длительность каждого.\n\n[font=default-bold]Груз:[/font] только обычные чёрночернильные документы. Цветные бланки ждут [technology=interplanetary-tube-chromatic] на Аквило.
administratorio-trunk-capacity=[font=default-bold]Исследования вместимости одновременно расширяют и ускоряют магистраль.[/font]\n\nКаждый уровень повышает число предметов в полёте и сокращает время каждого:\n• базовый — 3 предмета, по 30 с\n• [technology=interplanetary-tube-capacity-2] — 5 предметов, 15 с\n• [technology=interplanetary-tube-capacity-3] — 10 предметов, 5 с\n• [technology=interplanetary-tube-capacity-4] — 15 предметов, 2 с\n• [technology=interplanetary-tube-capacity-5] — 20 предметов, 1 с\n\nПоследний уровень — работа Администраториума. Даже после полного исследования 20 бланков в полёте — тонкая струйка по сравнению с ракетой; в этом и смысл.
administratorio-aquilo-tube-network=[font=default-bold]Аквило заменяет замёрзшие жидкие чернила твёрдыми носителями и открывает хроматическую магистраль.[/font]\n\n[entity=laser-printer] потребляет [item=thermal-transfer-sheet] и [item=composite-chroma-ribbon]. Уровень [technology=interplanetary-tube-chromatic] расширяет межпланетную магистраль на цветные документы, которые базовый уровень не переносит.\n\nЭта же ветка разрешает трёхцветные документы, криогенные лицензии, экспедицию к Администраториуму и в конце — общественные железнодорожные остановки без бланков. Подготовьте [item=cryoprint-technician] для каждого принтера, который собираетесь построить.
administratorio-workforce-formation-title=[font=default-bold]Космическая инфраструктура имеет собственный персонал, разрешения, эксплуатационные бланки и политику по астероидам.[/font]\n\nЭта категория проходит по полному орбитальному административному циклу: финансировать расширение переносными инструментами вместо локальных выплат налогоплательщикам, выдавать [item=orbital-infrastructure-permit] перед строительством, обучать специалистов, брифовать менеджеров точно в срок, печатать возобновляемые [item=orbital-operations-form] на борту платформы и выбирать, отталкивать ли каждый астероид или укомплектовать его Добровольным Шахтёром-Исследователем.\n\nНачните с записей о финансировании и разрешениях. Системы кадров и астероидов открываются позже, по мере доступности их технологий.
administratorio-chromatic-printing=[font=default-bold]Цвет означает юрисдикцию, источник и настоящую зависимость.[/font]\n\nЦиан идёт с Вулкануса, жёлтый с Глебы, маджента с Фульгоры. Цветной ингредиент означает: создайте цепочку планеты и доставьте готовую форму потребителю. До хроматического ствола Аквило используйте ракеты.
administratorio-chromatic-printer=[font=default-bold]Хроматический Принтер — наземная печатная платформа Space Age.[/font]\n\nОн принимает рецепты чёрной, циановой, жёлтой и пурпурной печати по мере разблокировки их технологий. Используйте его для термостойких циановых бланков, портящихся жёлтых, стабильных по сигналу пурпурных и двухцветной бумажной работы. Он работает на планетах с атмосферой, но не в вакууме и не в криогенном режиме давления Аквило; там используйте [entity=laser-printer].\n\nМашина не производит все цвета сразу после первоначального исследования [technology=chromatic-printing]. Каждая планетарная ветка обработки открывает свои чернила и итоговые бланки, так что оставьте место под четыре входных канала, даже если ранний принтер использует только чёрный и циан.
administratorio-chromatic-inks=[font=default-bold]У каждых цветных чернил есть локальное сырьё и своя юрисдикция.[/font]\n\n• [fluid=cyan-ink] — рафинируются из [fluid=cyan-slurry] Vulcanus, используются для металлургии и термостойкой бумажной работы\n• [fluid=yellow-ink] — рафинируются из [fluid=amber-sap] и питательных веществ Gleba, используются для биологической бумажной работы\n• [fluid=magenta-ink] — рафинируются из утиля Fulgora, используются для архивной и электромагнитной бумажной работы\n• Чёрные [item=ink] — остаются обычным копировальным средством\n\nИмпорт чернил может поддержать удалённую печать, но не обходит технологию, разрешающую соответствующие бланки. Аквило не может использовать эти жидкости напрямую и вместо этого сжимает импортированные CMY-бланки в [item=composite-chroma-ribbon].
administratorio-multicolor-forms=[font=default-bold]Составные бланки заменяют накопление планетарной бумажной работы в межотраслевых рецептах.[/font]\n\nТри двухцветные ветки выпускают [item=cyan-yellow-form], [item=cyan-magenta-form] и [item=yellow-magenta-form]. Когда обычный рецепт потребляет промежуточные продукты, связанные с двумя планетами, Administratorio добавляет соответствующий составной бланк вместо требования обоих одноцветных бланков. Трёхпланетные и некоторые рецепты конца игры повышаются до [item=trichromatic-permit], [item=unified-operations-charter] или другого явного завершающего документа.\n\nЭто ограничение применяется и к ванильному производству Space Age. Проверяйте затронутый рецепт, а не предполагайте, что его ванильный список ингредиентов пережил межведомственную проверку.
administratorio-vulcanus-certification=[font=default-bold]Vulcanus заменяет бой минеральной пропагандой и территориальным арбитражем.[/font]\n\nДобывайте [item=verdigris-crust], чтобы запустить циановую цепочку, превращайте лаву в [fluid=molten-promises] и обильные [fluid=lie], сертифицируйте местную промышленность в [entity=notary-office] и отбирайте территорию у демолишеров через обработку [entity=territorial-arbitration-post]. Полученный [item=territorial-deed] — это местный этап выхода планеты.\n\nЗдания Vulcanus потребляют своего специалиста при строительстве, но не требуют постоянного рабочего или эксплуатационного бланка. Берите достаточно персонала [item=licensed-notary] для офисов и литейных, которые планируете разместить.
administratorio-gleba-conciliation=[font=default-bold]Gleba выращивает свою бюрократию, и, естественно, она тоже портится.[/font]\n\nКачайте [fluid=amber-sap], чтобы засеять локальный [item=bullshit-ore], чёрные чернила, углеродные сертификаты и короткие пути к одобрению. Рафинируйте жёлтые чернила для [entity=chromatic-printer], завершайте биологические исключения в [entity=conciliation-desk] и используйте режимы приманки [entity=capture-bureau] для отлова живности.\n\nЖёлтый бланк-заготовка и готовая бумажная работа по примирению портятся. Локальная цепочка намеренно обильна, но чувствительна ко времени — как косметика в ванной без дисциплины закрывать крышки.
administratorio-cross-planet-bureaucracy=[font=default-bold]Межпланетное производство сходится через составные документы.[/font]\n\nИсследования голубой-жёлтой, голубой-пурпурной и жёлтой-пурпурной бюрократии объединяют по две планетарные юрисдикции в один бланк и несколько межпланетных разрешений. Голубо-жёлтая ветка также открывает экономику орбитального туризма. Затем Аквило объединяет все три цвета в сухие носители переноса, трёхцветные разрешения, допуск хроматической магистрали и финальные экспедиционные хартии.\n\nПо возможности перемещайте между мирами прочные готовые документы. Исходная жёлтая бумага портится, жидкие чернила подходят не каждой поверхности, а перегруженная межпланетная магистраль эмоционально доступна примерно как Реджина Джордж в понедельник.
administratorio-space-age-enrollment=[font=default-bold]Space Age превращает прямой найм в вероятностный конвейер зачисления.[/font]\n\nПоложите [item=job-offer] в слот [entity=admin-station] на Nauvis до того, как придёт финальное закрытое дело кусаки. Договор расходуется при попытке зачисления. Годятся только кусаки; плеваки никогда не зачисляются. Успех зависит от недовольства на момент решения дела:\n• При недовольстве 50% или ниже — 75% шанс\n• Выше 50% и до 75% включительно — 50% шанс\n• Выше 75% и до 90% включительно — 25% шанс\n• Выше 90% — 0% шанс\n\nУспех даёт ровно одного [item=enrolled-biter], независимо от размера кусаки. Проведите его через [recipe=worker-biter-formation] в [entity=formation-center], чтобы получить одного многоразового [item=worker-biter]. Без Space Age старое правило вместо этого напрямую превращает решённого гражданина в рабочих по размеру.
administratorio-offworld-economy=[font=default-bold]Деньги налогоплательщиков — это доходный поток, привязанный к Nauvis, а не универсальный планетарный ресурс.[/font]\n\nПри активном Space Age решённые граждане платят [item=taxpayer-money] только на Nauvis. Урегулирование жалоб вне мира по-прежнему закрывает дела, но не даёт местной денежной выплаты. Формируйте профессии кусак на Nauvis, затем локально перебрифуйте многоразовых MMMM без трат денег налогоплательщиков.\n\n[item=treasury-bond] Облигации Казначейства — переносная повседневная валюта. Орбитальный туризм подготавливает довольных туристов, но их крупные выплаты [item=taxpayer-money] собираются только при оформлении на Nauvis. Превращайте этот доход в облигации на месте; [item=government-grant] Государственные Субсидии остаются уровнем крупных проектов, используемым для масштабного строительства вроде ракетных шахт.
administratorio-management-briefings=[font=default-bold]Middle-Management Managing Managers должны посетить нужное совещание, прежде чем смогут курировать специализированную работу.[/font]\n\nКаждое совещание расходует одного обычного менеджера, один небольшой тематический материал и 5 [fluid=liquid-coffee], после чего возвращает одного соответствующего проинструктированного менеджера. Оно никогда не расходует [item=taxpayer-money] и может проводиться в [entity=formation-center] на любой планете. Пять тем — это Обучение, Кадры, Соответствие, Связь и Орбитальные Операции.\n\nПроинструктированные менеджеры возвращаются в обычных менеджеров через [font=default-bold]3 минуты[/font]. Формирования и укомплектованное строительство возвращают менеджера непроинструктированным, так что держите небольшой многоразовый запас менеджеров и брифуйте его на месте точно в срок.
administratorio-yellow-paperwork-spoilage=[font=default-bold]У жёлтой бумажной работы Gleba есть срок подачи.[/font]\n\n[item=mycelial-form-stock] и [item=blank-yellow-form] портятся в [item=paper] через 5 минут. Готовые [item=symbiosis-record] и [item=conciliation-order] держатся 10 минут, прежде чем снова стать бумагой. Циановые, пурпурные и составные бланки стабильны, если в их собственной подсказке не сказано иное.\n\nДержите жёлтое производство рядом с потребителями, используйте короткие буферы и следите за свежестью при перевозке. Если прочный рецепт может вместо этого потребить готовый составной бланк, напечатайте его прежде, чем жёлтый компонент состарится.
administratorio-pentapod-bargaining=[font=default-bold]У яиц пентаподов есть ручной запуск и автоматизированный маршрут сбора.[/font]\n\n[font=default-bold]Запуск:[/font] бросьте [item=taxpayer-money] на землю в пределах 24 клеток от дикого пентапода. Он подойдёт к деньгам, заберёт кучу поблизости и оставит яйца на земле. Каждое базовое яйцо стоит случайные 10–20 денег; более крупные пентаподы умножают выход.\n\n[font=default-bold]Автоматизация:[/font] на Gleba настройте [entity=capture-bureau] на рецепт сбора яиц и подайте [fluid=oviposition-lure-spores]. Бюро расходует 1 единицу приманки в секунду, привлекает совместимых пентаподов в пределах 48 клеток и производит яйца по виду и размеру.\n\nЯйца пентаподов сохраняют ванильную порчу. Если они вылупятся, недозрелые пентаподы враждебны к игроку, так что обрабатывайте или охлаждайте их с некоторой срочностью.
administratorio-space-tourism=[font=default-bold]Туризм плеваков превращает живность Nauvis и астероидные закуски в крупный доход на Nauvis.[/font]\n\n1. Разместите [entity=capture-bureau] на Nauvis, выберите приём туристов и подайте [fluid=tourism-lure-spores]. Каждый пойманный плевака расходует разрешение [item=cyan-yellow-form] режима и становится туристическим пакетом, подобранным по размеру.\n2. Запустите пакет в течение 5 минут. Если он испортится, из него снова вылупится злой плевака.\n3. Удовлетворите туриста на [entity=administrative-space-station], используя один [item=orbital-operations-form] и фрагменты астероидов: маленькому нужен 1 металлический; среднему 1 металлический + 1 углеродный; большому 1 оксидный + 1 металлический + 1 углеродный; чудовищному по 2 каждого.\n4. Верните довольного туриста на [entity=office-desk] на Nauvis и выполните рецепт оформления с 10 [fluid=liquid-coffee]. Маленькие, средние, большие и чудовищные туристы платят соответственно 100, 200, 450 и 1 200 [item=taxpayer-money]. Турист мирно освобождается и уходит, чтобы исчезнуть.
administratorio-promethium-administration=[font=default-bold]Экспедиция за Администраториумом — финальная проверка межпланетной документации.[/font]\n\nВанильная ветка [technology=promethium-science-pack] дополнительно требует [technology=interplanetary-tube-chromatic] и административную науку. На орбите объедините [item=unified-operations-charter], [item=cryogenic-operations-license], [item=hardened-data-vault] и [item=asteroid-processing-docket] в одну [item=promethium-research-charter].\n\nКаждый рецепт [item=promethium-science-pack] расходует эту экспедиционную хартию вместе с ингредиентами Space Age. Магистраль может доставить нужные документы, но саму хартию собирают в вакууме. Закончите цветные ветки планет до подготовки похода к разрушенной планете.
administratorio-vulcanus-manifest=[font=default-bold]Vulcanus работает на пропаганде.[/font]\n\nЛокальная цепочка превращает лаву и циановые минералы в [fluid=molten-promises] Расплавленные Обещания, а затем в обильную [fluid=lie] Ложь. Территориальный Арбитраж расходует ордера [item=territorial-resettlement-order] плюс 50/100/200 лжи в секунду для маленьких/средних/крупных демолишеров. Крупные территории стоят дороже, потому что, видимо, у геологии есть правосубъектность.\n\n[font=default-bold]Привезти намеренно:[/font] достаточно [item=licensed-notary] Нотариусов, обученных на Nauvis, на каждое специализированное здание, небольшой запас обычных MMMM, готовых к локальному перебрифингу, и [item=chemical-operator] Химического Оператора, если нужен.\n[font=default-bold]Производить на месте:[/font] циановую бумажную работу, обычные бланки, дешёвые брифинги MMMM, пропагандистский флюид и материалы для ракеты.\n[font=default-bold]Этап выхода:[/font] очистить территорию демолишера, получить [item=territorial-deed], завершить обычную письменную управленческую бумажную работу и построить общую рецепту ракетной шахты.
administratorio-gleba-manifest=[font=default-bold]На Gleba слишком много галиматьи — и так задумано.[/font]\n\nКачайте янтарный сок и засевайте им большие количества [item=bullshit-ore]. Местные рецепты возделывания превращают этот избыток в сомнительные данные, отговорки, рафинированную чушь, временные одобрения и одноразовую документацию. Жёлтая бумажная работа по-прежнему портится, так что предложение обильно, пока логистика остаётся биологически раздражающей.\n\n[font=default-bold]Привезти намеренно:[/font] [item=conciliation-officer] Офицеров Примирения, обученных на Nauvis, для биокамерной ветки, небольшой многоразовый запас MMMM и [item=chemical-operator] Химического Оператора, если нужен.\n[font=default-bold]Производить на месте:[/font] обычные административные материалы, дешёвые брифинги MMMM и снабжение для ракеты.\n[font=default-bold]Этап выхода:[/font] завершить обычную письменную управленческую бумажную работу и построить ту же рецепту ракетной шахты, что используется повсюду.
administratorio-fulgora-archives=[font=default-bold]Fulgora перерабатывает картотечный шкаф, затем папки, затем объяснение.[/font]\n\nМеталлолом может дать [item=old-archive]. Архивы быстро перерабатываются, но только в случайные стартовые бланки. Любой бланк бумажной работы можно также переработать в обычном [entity=recycler] Утилизаторе в один [item=paper] с шансом 25%. Избыточные обломки и тонер дают детерминированное обычное производство через местные рецепты утилизации.\n\n[entity=archive-recombination-bureau] — это отдельная разновидность Утилизатора с одним входом. Вставьте один поддерживаемый бланк, и машина автоматически выберет рецепт переназначения для этого бланка. Три бланка-кандидата на замену (того же ранга, безопасные по цвету) каждый бросают независимо с шансом 25%, так что операция может вернуть ноль, один, два или три бланка в обычный инвентарь результата. Кандидаты никогда не включают сам входной бланк, никогда не повышают ранг прогрессии и никогда не выдумывают цвет. [item=relay-clerk], расходуемый при постройке машины, — её постоянный сотрудник.\n\n[font=default-bold]Привезти намеренно:[/font] Агентов Связи, обученных на Nauvis, на каждое укомплектованное цифровое, электромагнитное или архивное здание, небольшой многоразовый запас MMMM и [item=chemical-operator] Химического Оператора, если нужен. Перебрифуйте менеджеров на месте из материалов, дружелюбных к металлолому, и небольшого количества кофе.
administratorio-aquilo-manifest=[font=default-bold]Аквило — это слияние, а не изобилие.[/font]\n\nПривезите цветные документы с ранних планет, специалистов [item=cryoprint-technician], подготовленных на Нависе, и небольшой запас обычных менеджеров. [entity=interplanetary-terminus] перемещает готовые бланки между мирами по медленной узкой магистрали; прибывшие лежат в его собственном инвентаре, пока вы их не заберёте. Проводите брифинги менеджеров на месте, используя один тематический материал и 5 кофе.\n\n[font=default-bold]Ракетная шахта:[/font] общая рецептура доступна здесь, но [item=government-grant] Государственный грант и [item=management-approval-written] Письменное одобрение руководства должны прибыть межпланетной логистикой.\n\n[entity=archive-recombination-bureau] тоже работает здесь, но критическая криогенная прогрессия остаётся детерминированной. Используйте броски переназначения одного бланка для выравнивания избытков, а не для азартной игры единственным разрешением, от которого зависит фабрика.
administratorio-propaganda-distillery=[font=default-bold]Дистиллерия Пропаганды обрабатывает цепочку флюидов Лжи и Дезинформации.[/font]\n\nОткрывается с [font=default-bold]Индустриальной Пропагандой[/font], это здание заменяет химическую обработку для этих бюрократических флюидов. Её категория производства эксклюзивна — здесь выполняются только рецепты дистиллерии.\n\n[font=default-bold]Ключевые рецепты:[/font]\n• [fluid=politician-fluid] Флюид Политика → [fluid=lie] Ложь\n• [fluid=lie] Ложь + [item=dubious-data] Сомнительные Данные → [fluid=misinformation] Дезинформация\n• [fluid=misinformation] Дезинформация + [item=credentials] Аккредитации + [fluid=politician-fluid] Флюид Политика → [item=justification] Обоснование\n• [item=treasury-bond] Облигация Казначейства + [fluid=lie] Ложь → [fluid=slush-fund] Чёрная Касса (только базовая игра; этого рецепта не существует при активном Space Age)\n\n[font=default-bold]Не рецепты дистиллерии, несмотря на использование тех же флюидов:[/font]\n[item=credentials] Аккредитации печатаются в [entity=office-desk], а [item=refined-nonsense] Рафинированная Чушь варится в [entity=corporate-breakroom]. Химзаводы и нефтеперерабатывающие заводы не занимаются [color=red]ни одной[/color] частью этой цепочки.
administratorio-pneumatic-transport=[font=default-bold]Перемещайте бумажную работу мгновенно по герметичным крафтовым трубам.[/font]\n\nСистема пневматических труб перевозит предметы бумажной работы через скрытую цепочку сигналов — предметы входят с одного конца и мгновенно появляются с другого:\n\n[font=default-bold]Здания:[/font]\n• [entity=tube-intake] [font=default-bold]Приёмник Трубы[/font] — потребляет допустимые предметы бумажной работы с соседнего конвейера/сундука через скрытый манипулятор\n• [entity=tube-outtake] [font=default-bold]Выдача Трубы[/font] — выдаёт предметы из пула сигналов; используйте собственный манипулятор или логистику для извлечения\n• [entity=pneumatic-pipe] [font=default-bold]Пневматическая Труба[/font] — крафтового цвета, соединяет приёмники с выдачами\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Подземная Пневматическая Труба[/font] — радиус 16 клеток\n\n[font=default-bold]Как это работает:[/font]\nСтанции приёма имеют скрытый манипулятор, который забирает только допустимые предметы бумажной работы с соседних конвейеров или сундуков. Станции выдачи — это контейнеры; используйте собственный манипулятор или логистику для извлечения предметов. Установите фильтр на слоте инвентаря выдачи, чтобы запросить конкретный тип предмета.\n\nПневматические трубы определяют сеть сигналов — любые приёмники и выдачи, соединённые трубами, мгновенно делят предметы. Несколько типов предметов могут течь по одной трубной сети (транспорт «суши»). У каждой сети есть лимит вместимости, который можно увеличить исследованиями.\n\nПневматические трубы используют отдельную категорию соединения — они [color=red]не могут[/color] подключаться к обычным трубам для жидкостей.\n\nНаведите курсор на любой приёмник или выдачу трубы, чтобы увидеть панель состояния в реальном времени с подключением к сети, использованием вместимости и содержимым предметов.\n\nОткрывается исследованием [font=default-bold]Пневматической Перевозки Бланков[/font] после [font=default-bold]Технологии Печати[/font] и [font=default-bold]Логистической Науки[/font].
administratorio-bullshit-economy=[font=default-bold]Руда Галиматьи питает всю цепочку поставок сертификатов и отговорок.[/font]\n\nДобывайте [item=bullshit-ore] Руду Галиматьи для производства:\n• [item=dubious-data] Сомнительные Данные (рафинируются из руды)\n• [item=basic-excuse] Базовая Отговорка → [item=good-excuse] Хорошая Отговорка\n• [item=crappy-report] Дрянной Отчёт → [item=justification] Обоснование → [item=narrative] Нарратив\n• [item=white-paper] Белая Книга → [item=policy] Политика → [item=regulation] Регламент\n\n[font=default-bold]Производные Избыточных Обломков:[/font]\n[item=redundant-rubble] Избыточные Обломки перерабатываются в три уровня производных:\n• [item=useless-documentation] [font=default-bold]Бесполезная Документация[/font] — обломки + бумага, используется в Форме 27B-6 и облигациях казначейства\n• [item=compacted-rubble] [font=default-bold]Спрессованные Обломки[/font] — обломки + углеродный сертификат, используются в зданиях и поздних рецептах\n• [item=refined-nonsense] [font=default-bold]Рафинированная Чушь[/font] — спрессованные обломки + дезинформация, используется в аккредитациях, нарративах и решениях высокого уровня\n\n[font=default-bold]Цепочка государственного финансирования:[/font]\n[item=taxpayer-money] Деньги Налогоплательщиков (только Nauvis) → [item=treasury-bond] Облигация Казначейства (50 денег) → [item=government-grant] Государственная Субсидия (10 облигаций)\n\nОблигации казначейства — это повседневная, обмениваемая бюрократическая валюта; государственные субсидии зарезервированы для крупных инвестиционных проектов вроде ракетных шахт. [fluid=slush-fund] Чёрные Кассы и [font=default-bold]Налоговые Проверки[/font] позднего этапа игры в [entity=union-headquarters] Штабе Профсоюза могут производить дополнительное финансирование на Nauvis.\n\n[font=default-bold]Многозданная производственная цепочка:[/font]\n• [entity=office-desk] Бюро: бланки, пакеты науки, данные, облигации казначейства, проверенные сертификаты, экологические отчёты и разрешения на НПЗ\n• [entity=corporate-breakroom] Комната отдыха: кофе, сплетни, хорошие отговорки, черновики устных одобрений\n• [entity=union-headquarters] Штаб Профсоюза: профсоюзные одобрения, государственные субсидии, нарративы, письменные одобрения, белые книги, политика, регламент и налоговые проверки\n• [entity=propaganda-distillery] Дистиллерия: ложь, дезинформация, аккредитации, чёрные кассы, рафинированная чушь
administratorio-transit-authorization=[font=default-bold]У станций есть встроенный сундук для бумажной работы.[/font]\n\nКаждая [entity=train-stop] Станция теперь требует бланки [item=transit-authorization] Транзитное Разрешение (Форма 12-T), чтобы оставаться работоспособной.\n\n[font=default-bold]Как это работает:[/font]\n1. Каждая Станция получает [entity=transit-permit-chest] встроенный сундук транзитных разрешений.\n2. Вставьте [item=transit-authorization] Транзитные Разрешения в этот сундук.\n3. Один бланк [font=default-bold]расходуется при прибытии поезда[/font], который начинает ждать на станции.\n4. Если на станции заканчиваются бланки, она автоматически закрывается, устанавливая лимит поездов в 0.\n\n[font=default-bold]Настройка:[/font]\n• Исследуйте технологию [font=default-bold]Железная дорога[/font], чтобы открыть рецепт бланка.\n• Изготавливайте бланки в [entity=office-desk] Административном Бюро.\n• Держите станции снабжёнными конвейерами, манипуляторами или логистикой, чтобы загруженные узлы не застревали.\n\nЭта система превращает железнодорожную логистику в проблему бумажной работы вместо боевой.
administratorio-admin-science=[font=default-bold]Административная Наука питает вашу бюрократическую экспансию.[/font]\n\nАдминистративные исследования требуют [item=administrative-science-pack] Пакет Административной Науки (Розовый). Этот пакет — узкое место для большинства пользовательских бюрократических технологий.\n\n[font=default-bold]Производство:[/font]\nПроизводится в [entity=office-desk] Административном Бюро из:\n• [item=provisional-approval] Временное Одобрение ×5\n• [item=basic-excuse] Базовая Отговорка ×5\n• [item=research-grant-approval] Одобрение Исследовательского Гранта ×1\n\n[font=default-bold]Использование:[/font]\nЭтот пакет заменяет военную науку в ванильных затратах на исследования и также используется по всему пользовательскому дереву технологий. Если ваша цепочка бумажной работы застопорится, ваши исследования застопорятся вместе с ней.
administratorio-workforce-formation=[font=default-bold]Прогрессия кадров Space Age превращает зачисленного гражданина в профессию.[/font]\n\n[technology=worker-formation] открывает [recipe=worker-biter-formation]. Позже [technology=management-formation] добавляет Стажёров Делопроизводства, Стажёров Управления, Middle-Management Managing Managers и их брифинги; [technology=specialized-formation] добавляет Астронавтов. Донаучный запуск каждой планеты открывает нужного ей специалиста раньше здания, которое его потребляет, а [technology=orbital-compliance-systems] разрешает Добровольных Шахтёров-Исследователей.\n\nВсё формирование профессий остаётся на Nauvis. Экспортируйте готовых специалистов и обычных MMMM; менеджеры могут посещать дешёвые, бесплатные брифинги на любой планете. Специалисты обычно расходуются при постройке соответствующего здания. МСЕВ — исключение: это многоразовые боеприпасы пушки, если собраны их возвращающиеся фрагменты сотрудника.
administratorio-orbital-specialists=[font=default-bold]Специалисты — расходники строительства, а не топливо для работы.[/font]\n\nВ отличие от рабочих кусак, которые проходят назначения [entity=biter-station], Астронавты, Лицензированные нотариусы, Сотрудники примирения, Релейные клерки, Техники криопечати и Полевые переговорщики обучаются на Нависе, лежат в инвентаре и расходуются, когда вы [color=red]размещаете[/color] подходящее здание.\n\n[font=default-bold]Правило планирования:[/font] подготовьте одного специалиста для [font=default-bold]каждого[/font] подходящего здания в очереди строительства. Например, каждому [entity=digital-services-bureau], [entity=interplanetary-terminus] и [entity=archive-recombination-bureau] нужен собственный [item=relay-clerk]; каждой [entity=administrative-space-station] нужен [item=astronaut]. Запасайте их до отправления.\n\n[font=default-bold]Менеджеры среднего звена (MMMM):[/font] держите многоразовый запас обычных менеджеров. Брифованные варианты создаются на месте из одного менеджера, тематического материала и 5 кофе, истекают через 3 минуты и возвращаются из строительства с персоналом без брифинга. Деньги налогоплательщиков не нужны.
administratorio-trajectory-compliance-arrays=[font=default-bold]Массивы Коррекции Траекторий толкают астероиды — они их не добывают.[/font]\n\n[entity=trajectory-compliance-array] (Младший), [entity=senior-trajectory-compliance-array] (Старший) и [entity=executive-trajectory-compliance-array] (Исполнительный) принимают обычные ордера [item=orbital-deviation-order] и приоритетные ордера [item=priority-orbital-deviation-order]. Приоритетная бумажная работа даёт вдвое большую устойчивую толкающую силу.\n\n[font=default-bold]Юрисдикция по уровням:[/font]\n• Младший: малые и средние астероиды, радиус 20 клеток\n• Старший: малые, средние и большие астероиды, радиус 30 клеток\n• Исполнительный: все размеры, включая огромные Администраториум, радиус 40 клеток\n\n[font=default-bold]Механика:[/font]\n• Каждый выстрел создаёт толчок фиксированной длительности. Перекрывающиеся выстрелы и несколько массивов складываются.\n• Масса астероида ослабляет толчок — тяжёлым камням нужно больше одновременных ордеров.\n• Массивы каждые 30 тиков выбирают подходящий астероид, ближайший к центральной оси платформы, а затем к хабу.\n• Одна девиация не производит фрагментов — камень должен быть добыт МСЕВ или уничтожен иначе, чтобы дать утиль.\n• Если к астероиду прикрепляется шахтёр, все массивы автоматически перенацеливаются с него (укомплектованные камни защищены).\n\n[font=default-bold]Исследования:[/font] Продвинутая Обработка Астероидов открывает приоритетные ордера, сделанные из меди, серы и кальцита. [technology=trajectory-compliance-speed-1] по [technology=trajectory-compliance-speed-9] увеличивают скорострельность.
administratorio-senior-trajectory-compliance-array=[font=default-bold]Старшие Массивы расширяют юрисдикцию на большие астероиды.[/font]\n\nОткрывается технологией [technology=trajectory-compliance-jurisdiction-2] (требует Системы Орбитального Соответствия + Металлургическую + Аграрную + Электромагнитную науку). Старший Массив толкает малые, средние И большие астероиды в радиусе 30 клеток. Большие астероиды имеют коэффициент массы в 2,5 раза больше средних, так что для эффективной девиации часто нужны перекрывающиеся Старшие Массивы или исследование скорострельности.\n\n[font=default-bold]Стратегическая заметка:[/font] большие астероиды несут по 18 фрагментов каждый. Отклонение защищает вашу платформу, но не даёт ресурсов — рассмотрите возможность сначала дать МСЕВ добыть их, а затем зачистить остаток массивами.
administratorio-executive-trajectory-compliance-array=[font=default-bold]Исполнительные Массивы имеют неоспоримую юрисдикцию над астероидами любого размера.[/font]\n\nОткрывается технологией [technology=trajectory-compliance-jurisdiction-3] (требует Старшие Массивы + Квантовый Процессор). Исполнительный Массив толкает малые, средние, большие И огромные астероиды с Администраториумом в радиусе 40 клеток. Огромные астероиды имеют коэффициент массы ×5 и дают 54 фрагмента — обычно требуется несколько одновременных Исполнительных Массивов или максимальная скорострельность для значимой девиации.\n\n[font=default-bold]Стратегия Администраториума:[/font] огромные астероиды Администраториум — основной источник фрагментов Администраториума. Обычно их нужно ДОБЫВАТЬ МСЕВ, а не отклонять. Используйте Исполнительные Массивы, чтобы защитить платформу, пока ваши шахтёры работают, или чтобы зачистить огромные камни без Администраториума, угрожающие хабу.
administratorio-orbital-employment-damage=[font=default-bold]Исследование Урона Орбитального Трудоустройства масштабирует урон добычи МСЕВ.[/font]\n\nПять уровней, каждый +50% урона (аддитивно):\n• Уровень 1: 206,25/с • Уровень 2: 275/с • Уровень 3: 343,75/с • Уровень 4: 412,5/с • Уровень 5: 481,25/с\n\n[font=default-bold]Требования:[/font] Уровни 1-2: Системы Орбитального Соответствия. Уровни 3-4: +Металлургическая/Аграрная/Электромагнитная. Уровень 5: +Криогенная. Уровень 6 (если расширено): +Администраториум.\n\n[font=default-bold]Суммирование:[/font] урон умножается на количество прикреплённых шахтёров. При вместимости 5 с уроном уровня 5: 5 × 481,25 = 2406,25 урона/с — достаточно, чтобы расколоть огромный астероид Администраториум примерно за 2,1 секунды. Сначала приоритизируйте исследование вместимости (больше шахтёров = линейный урон), затем исследование урона.
administratorio-orbital-employment-capacity=[font=default-bold]Исследование Вместимости Орбитального Трудоустройства повышает лимит шахтёров на астероид.[/font]\n\nЧетыре уровня, каждый +1 шахтёр на астероид:\n• Уровень 1: 2 шахтёра • Уровень 2: 3 шахтёра • Уровень 3: 4 шахтёра • Уровень 4: 5 шахтёров\n\n[font=default-bold]Требования:[/font] Уровень 1: Системы Орбитального Соответствия. Уровень 2: +Металлургическая/Аграрная/Электромагнитная. Уровень 3: +Криогенная. Уровень 4: +Администраториум.\n\n[font=default-bold]Экономика:[/font] каждый дополнительный шахтёр = ещё один фрагмент сотрудника для сбора = ещё один многоразовый МСЕВ. Вместимость — самое влиятельное орбитальное исследование: она линейно масштабирует и скорость добычи, И восстановление боеприпасов. Исследуйте вместимость до 3-4 перед тяжёлыми вложениями в урон.
administratorio-administrative-space-station=[font=default-bold]Административная Космическая Станция замыкает цикл бумажной работы платформы.[/font]\n\nОткрывается технологией [technology=orbital-employment-infrastructure] до утилитарной или космической науки. Это полноценный административный офис, допущенный к вакууму; родная обработка астероидов Space Age остаётся единственным рецептом космической науки.\n\n[font=default-bold]Базовый цикл астероидов:[/font]\n• Углерод + вода → бумага\n• Углерод + железная руда + вода → чернила\n• Бумага + чернила → [item=orbital-operations-form]\n• Родная космическая наука расходует одно импортированное [item=research-grant-approval] на изготовление одного пакета\n• Операционные бланки разрешают топливо и окислитель двигателя, туризм, обычные ордера девиации и [item=asteroid-processing-docket]\n\nБазовое дробление астероидов и плавление льда остаются без бумажной работы, чтобы застрявшая платформа не могла зайти в тупик. Продвинутое дробление расходует докеты и даёт медь, серу и кальцит для архивной бумаги, защищённых чернил, массового копирования и [item=priority-orbital-deviation-order].\n\n[font=default-bold]Персонал:[/font] один [item=astronaut] плюс необходимые проинструктированные менеджеры используются при строительстве. Станция возвращает менеджеров в обычной форме; повторяющиеся рецепты не расходуют персонал.
administratorio-trajectory-compliance-speed=[font=default-bold]Исследование Скорости Коррекции Траекторий увеличивает частоту стрельбы массивов.[/font]\n\nДевять уровней, каждый сокращает перезарядку:\n• Уровень 1: 4,5 с → Уровень 2: 4,0 с → Уровень 3: 3,5 с → Уровень 4: 3,0 с → Уровень 5: 2,5 с\n• Уровень 6: 2,0 с → Уровень 7: 1,5 с → Уровень 8: 1,0 с → Уровень 9: 0,5 с\n\n[font=default-bold]Требования:[/font] Уровень 1: Системы Орбитального Соответствия. Уровни 5-7: +Металлургическая/Аграрная/Электромагнитная. Уровень 8: +Криогенная. Уровень 9: +Администраториум.\n\n[font=default-bold]Влияние:[/font] быстрее стрельба = больше одновременных толчков девиации = сильнее суммарное отклонение на тяжёлых астероидах. Уровень 9 (перезарядка 0,5 с) с 3 Исполнительными Массивами способен в одиночку толкать огромные камни Администраториум. Дорогая наука — сначала приоритизируйте вместимость и юрисдикцию.
administratorio-cyan-yellow-bureaucracy=[font=default-bold]Бюрократия «циан-жёлтый» объединяет бумажную работу Vulcanus и Gleba.[/font]\n\nОткрывается технологией [technology=cyan-yellow-bureaucracy] (требует Сертификацию Vulcanus + Примирение Gleba + Металлургическую + Аграрную науку). Открывает:\n• [item=cyan-yellow-form] — двухчернильный бланк, печатаемый напрямую в циане + жёлтом\n• [item=public-transportation-contract] — двухцветный транзитный контракт, объединяющий циан + жёлтый\n• [item=tourism-lure-spores] — туристическая приманка для плеваков, для Бюро Отлова\n• Орбитальное удовлетворение туристов и оформление на Nauvis\n\n[font=default-bold]Туризм:[/font] упакуйте плеваков на Nauvis, накормите их фрагментами астероидов на орбите, затем оформите довольных туристов через [entity=office-desk] на Nauvis с кофе. Оформление выплачивает [item=taxpayer-money] и отпускает каждого туриста домой.
administratorio-cyan-magenta-bureaucracy=[font=default-bold]Бюрократия «циан-пурпурный» объединяет бумажную работу Vulcanus и Fulgora.[/font]\n\nОткрывается технологией [technology=cyan-magenta-bureaucracy] (требует Сертификацию Vulcanus + Цифровые Услуги Fulgora + Металлургическую + Электромагнитную науку). Открывает:\n• [item=cyan-magenta-form] — двухчернильный бланк для Vulcanus + Fulgora\n• [item=hardened-data-vault] — термозапечатанный пакет хранения для передачи данных Vulcanus-Fulgora\n\n[font=default-bold]Применение:[/font] орбитальная авторизация и авторизация для разбитой планеты часто требуют одновременно тяжёлой металлургии (Vulcanus) и электромагнитно-архивной работы (Fulgora). Двухцветный бланк и бронированный сейф — это сходящаяся бумажная работа.
administratorio-yellow-magenta-bureaucracy=[font=default-bold]Бюрократия «жёлтый-пурпурный» объединяет бумажную работу Gleba и Fulgora.[/font]\n\nОткрывается технологией [technology=yellow-magenta-bureaucracy] (требует Жёлтую администрацию Gleba + Цифровые Услуги Fulgora + Аграрную + Электромагнитную науку). Открывает:\n• [item=yellow-magenta-form] — двухчернильный бланк для Gleba + Fulgora\n• [item=anecdotal-data-reprocessing] — рецепт-сокращение с большой долей утиля\n\n[font=default-bold]Применение:[/font] биологическая архивная работа и пересечение электромагнетизма с биологией. Жёлто-пурпурный бланк заменяет отдельные жёлтую и пурпурную цепочки для совместных рецептов Gleba-Fulgora.
administratorio-fulgora-digital-services=[font=default-bold]Цифровые службы Фульгоры открывают компьютеризированную бюрократическую ветку планеты.[/font]\n\nОткрываются [technology=fulgora-digital-services] (требуется хроматическая печать, запуск — после создания 20 [item=charged-toner]). Открывают [entity=digital-services-bureau], [item=archive-recovery-permit], [item=digital-processing-certificate], [item=electromagnetic-operating-license] и [item=data-recovery-order].\n\n[font=default-bold]Триггер исследования:[/font] создайте 20 [item=charged-toner], добываемого из свалок Фульгоры или возвращаемого переработкой. Это заставляет пройти цикл лома и переработки Фульгоры до цифровых служб.\n\n[font=default-bold]Ключевые здания:[/font]\n• [entity=digital-services-bureau] — компьютеризированный офис 24/7 без ночного закрытия\n• [entity=archive-recombination-bureau] — переработчик переназначения: один бланк в три возможных\n• [entity=interplanetary-terminus] — конечная точка межпланетной магистрали
administratorio-notary-office=[font=default-bold]Нотариальная Контора — премиальный офис сертификации Vulcanus.[/font]\n\nОткрывается технологией [technology=vulcanus-certification]. Категория производства: [entity=bureaucracy-certification]. Скорость ×2, базовая продуктивность 50%, 4 слота модулей. Входы флюида для циановых чернил и выходы лжи как побочный продукт нотаризации.\n\n[font=default-bold]Рецепты:[/font]\n• [item=embossed-seal] — премиальная печать нотаризации из материалов Vulcanus\n• [item=industrial-charter] — сертифицированный пакет промышленных операций для металлургии Vulcanus\n• [item=good-excuse] — местный выход из тупика кофе-и-сплетен\n• [item=management-approval-written] — исключение территориального акта для этапа выхода\n• [item=inspection-docket] — плотная промышленная проверка для соответствия эпохи литейных цехов\n\n[font=default-bold]Персонал:[/font] требует одного [item=licensed-notary] (изготавливается в [entity=formation-center], расходуется при установке). Нотариальная Контора — это врата Vulcanus для местной сертификационной работы — привезите нотариусов на каждое запланированное специализированное здание.
administratorio-territorial-arbitration=[font=default-bold]Посты Территориального Арбитража сокращают территории демолишеров через бумажную работу.[/font]\n\nОткрываются технологией [technology=vulcanus-certification]. Фиксированный рецепт: [item=territorial-arbitration-processing]. Расходует [item=territorial-resettlement-order] + [fluid=lie] за цикл обработки (60 тиков).\n\n[font=default-bold]Механика:[/font]\n1. Разместите пост с перекрытием территории демолишера (должен покрывать хотя бы одну клетку территории).\n2. Подавайте ордера и ложь. Пост постепенно удаляет клетки территории из зоны патрулирования демолишера, сокращая его эффективную площадь.\n3. Прогресс отслеживается по территории. Несколько постов на одной территории складывают прогресс.\n4. Когда все клетки удалены, демолишер уничтожается и роняет [item=territorial-deed].\n5. Территория естественным образом восстанавливается (деградация обратного хода), если не поддерживается активно — посты должны непрерывно подавать ордера/ложь.\n\n[font=default-bold]Стоимость по размеру демолишера:[/font]\n• Малый: 1 ордер + 50 лжи/с • Средний: 2 ордера + 100 лжи/с • Большой: 4 ордера + 200 лжи/с\n\n[font=default-bold]Источник лжи:[/font] [entity=propaganda-distillery] на Vulcanus (флюид политика → ложь). Обеспечьте достаточную пропускную способность дистиллерии под желаемый размер.\n\n[font=default-bold]Стратегическая заметка:[/font] это единственный способ окончательно очистить территории демолишеров Vulcanus. Акт открывает этап выхода через ракетную шахту.
administratorio-vulcanus-export-charters=[font=default-bold]Экспортные Хартии Vulcanus позволяют использовать металлургию Vulcanus вне мира.[/font]\n\nОткрываются технологией [technology=vulcanus-export-charters] (требует Сертификацию Vulcanus + Металлургическую Науку). Три хартии:\n• [item=thermal-process-license] — сертифицирует высокотемпературную вольфрамовую металлургию вне Vulcanus\n• [item=calcite-reagent-waiver] — разрешает внепланетную промышленную химию на основе кальцита\n• [item=offworld-metallurgy-charter] — требуется для запуска ключевых металлургических процессов Vulcanus вдали от Vulcanus\n\n[font=default-bold]Орбитальные варианты:[/font] [item=thermal-process-license-orbital], [item=calcite-reagent-waiver-orbital], [item=offworld-metallurgy-charter-orbital] производятся на [entity=administrative-space-station] для использования на космической платформе.\n\n[font=default-bold]Почему это важно:[/font] без этих хартий рецепты, специфичные для Vulcanus (вольфрам, химия кальцита, литейные процессы), не могут выполняться на других планетах или платформах. Хартии — это бюрократическая экспортная лицензия для промышленной интеллектуальной собственности Vulcanus.
administratorio-conciliation-desk=[font=default-bold]Стол Примирения — специализированный офис Gleba для финализации жёлтых бланков.[/font]\n\nОткрывается технологией [technology=gleba-conciliation]. Категория производства: [entity=bureaucracy-conciliation]. Скорость ×1,75, базовая продуктивность 50%, 4 слота модулей. Входы флюида для жёлтых чернил и производных янтарного сока.\n\n[font=default-bold]Рецепты:[/font]\n• [item=blank-yellow-form] → [item=conciliation-order] — компактная бумажная работа биологического исключения\n• [item=symbiosis-record] — биологический реестр, заменяющий тяжёлый документационный наполнитель\n• Местные запасные одобрения, заменяющие насыщенные ложью цепочки Nauvis\n\n[font=default-bold]Персонал:[/font] требует одного [item=conciliation-officer] (изготавливается в [entity=formation-center], расходуется при установке).\n\n[font=default-bold]Зачем он существует:[/font] интенсивная биологическая прогрессия Gleba не нуждается во всей лестнице разрешений Nauvis. Стол Примирения предлагает компактную ветку жёлтых бланков, обходящую насыщенные ложью/деньгами налогоплательщиков одобрения прямым биологическим примирением. Это родной путь урегулирования Gleba.
administratorio-capture-bureau=[font=default-bold]У Бюро Отлова три режима враждебного захвата, специфичных для поверхности.[/font]\n\nИзготовьте здание на Gleba, затем разместите его на поверхности, требуемой выбранным рецептом. Подайте соответствующий флюид приманки; активная приманка расходует 1 единицу в секунду и привлекает подходящую живность в радиусе 48 клеток. У выхода должно быть место, прежде чем животное будет принято.\n\n• [fluid=workforce-lure-spores] на Nauvis — привлекает кусак и производит одного [item=worker-biter]\n• [fluid=tourism-lure-spores] на Nauvis — привлекает плеваков и производит туристические пакеты, подобранные по размеру; этот режим также расходует [item=cyan-yellow-form]\n• [fluid=oviposition-lure-spores] на Gleba — привлекает пентаподов и производит свежие [item=pentapod-egg] по виду и размеру\n\nБюро захватывает напрямую; животные не подают жалоб, и режим кадров не расходует [item=job-offer]. Держите несовместимые флюиды приманки вне общей системы флюидов, чтобы нужный режим оставался активным.
administratorio-digital-services-bureau=[font=default-bold]Бюро Цифровых Услуг — компьютеризированный офис Fulgora, работающий 24/7.[/font]\n\nОткрывается технологией [technology=fulgora-digital-services]. Выполняет только рецепты регистрации и запуска, специфичные для Fulgora:\n• [item=digital-processing-certificate] — разрешает компьютеризированную административную пропускную способность\n• [item=electromagnetic-operating-license] — электромагнитная инфраструктура и бюрократия гольмия\n• [item=data-recovery-order] — наряд с большим объёмом маршрутизации для восстановления архивов\n• [item=archive-recovery-permit] — восстановление бумажной работы через утиль\n• Местные стартовые бланки для прогрессии Fulgora\n\n[font=default-bold]Механика:[/font] базовая продуктивность ×3, 6 слотов модулей, БЕЗ ночного закрытия (цифровые услуги работают непрерывно). Вход флюида для [fluid=electromagnetic-lubricant] (или эквивалента). Укомплектовано одним [item=relay-clerk] (изготавливается в [entity=formation-center], расходуется при установке).\n\n[font=default-bold]Почему это важно:[/font] в отличие от офисов Nauvis, Бюро Цифровых Услуг не закрывается на ночь. Это ваш всегда работающий движок бумажной работы Fulgora для восстановления архивов, цифровых сертификатов и электромагнитных лицензий.
administratorio-archive-recombination=[font=default-bold]Бюро Рекомбинации Архивов перерабатывает один бланк в три случайные замены того же ранга.[/font]\n\nОткрывается технологией [technology=archive-recombination] (требует Цифровые Услуги Fulgora). Разновидность Утилизатора, постоянно укомплектованная [item=relay-clerk] (расходуется при строительстве).\n\n[font=default-bold]Как это работает:[/font]\n1. Вставьте ОДИН поддерживаемый бланк бумажной работы (любой перерабатываемый бланк любого ранга).\n2. Машина автоматически выбирает рецепт переназначения для этого бланка.\n3. ТРИ бланка-кандидата на замену (того же ранга, безопасные по цвету) каждый бросают независимо с шансом 25%.\n4. Результаты выходят в инвентарь результата на 12 слотов. Вы можете получить 0, 1, 2 или 3 бланка.\n\n[font=default-bold]Ограничения:[/font]\n• Кандидаты НИКОГДА не включают сам входной бланк.\n• Кандидаты НИКОГДА не повышают ранг прогрессии (T1 остаётся T1, T2 остаётся T2 и т.д.).\n• Кандидаты НИКОГДА не выдумывают цвет (чисто чёрный бланк даёт только чисто чёрные бланки; циановый бланк даёт циан или чёрный).\n• Работает только с «перерабатываемыми» бланками (большинство печатных документов).\n\n[font=default-bold]Применение:[/font] перебалансировка излишков — сдайте избыточные разрешения T2, получите случайные разрешения T2 обратно. НЕ рискуйте критичными предметами прогрессии (единственным разрешением, поддерживающим фабрику в живых) — используйте для них детерминированные рецепты утилизации.
administratorio-laser-printer=[font=default-bold]Лазерный принтер — принтер Аквило с замёрзшими чернилами и твёрдыми носителями.[/font]\n\nОткрывается [technology=interplanetary-tube-chromatic]. Жидких чернил нет, используются:\n• [item=thermal-transfer-sheet] — премиальный носитель печати, заменяет бумагу\n• [item=composite-chroma-ribbon] — сжатый носитель CMY, заменяет жидкие цветные чернила\n\n[font=default-bold]Возможности:[/font]\n• Все старые категории печати\n• Хроматическая и многоцветная печать, а также продвинутая орбитальная печать\n• Скорость крафта ×5, базовая производительность 50 %, 6 слотов модулей\n• Нет жидкостных входов, только предметы\n• Работает при низком давлении Аквило и на космических платформах\n\n[font=default-bold]Зачем он нужен:[/font] жидкие чернила замерзают на Аквило. Лазерный принтер использует термостойкие твёрдые носители. Ленты собираются из импортных CMY-документов и [item=transfer-emulsion] Аквило.
administratorio-bureaucratic-transcendence=[font=default-bold]Бюрократическая трансценденция: документы больше не ограничивают перевозки.[/font]\n\nОткрывается [technology=bureaucratic-transcendence]. Главная награда — [entity=public-train-stop], железнодорожная остановка, которая просто работает без бланков.\n\n[font=default-bold]Лор:[/font] ваша администрация достигла такой пропускной способности и надёжности, что центральное бюро выдало постоянное исключение для обычных железнодорожных операций. Документы всё ещё существуют для всего остального: это относится только к транзиту.\n\n[font=default-bold]Требование:[/font] [technology=interplanetary-tube-chromatic], вся цепочка межпланетной магистрали. Нужно освоить бюрократическое слияние всех четырёх планет Space Age, прежде чем система доверит вам поезда без бланков.
administratorio-public-train-stop=[font=default-bold]Общественная железнодорожная остановка работает без бланков разрешения на транзит.[/font]\n\nОткрывается [technology=bureaucratic-transcendence], требующей хроматический уровень магистрали Аквило. Это ванильная [entity=train-stop], которой НЕ нужны [item=transit-authorization].\n\n[font=default-bold]Механика:[/font]\n• Не создаётся сундук разрешений на транзит.\n• При прибытии поезда не тратятся бланки.\n• Лимит поездов не связан с документами.\n• Работает точно как ванильная остановка.\n\n[font=default-bold]Зачем она нужна:[/font] Бюрократическая трансценденция — момент, когда администрация настолько эффективна, что обычный транзит больше не требует разрешения на каждое прибытие. Это удобство для огромных железнодорожных сетей, но его надо заслужить, завершив всю межпланетную цепочку.
