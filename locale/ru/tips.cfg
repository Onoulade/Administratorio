[tips-and-tricks-item-description]
administratorio-welcome=Кусаки приходят с жалобами вместо атак.\n• Постройте [entity=admin-station] со свободным подходом.\n• Обработайте талоны и верните соответствующие решения в бюро.\n• Закройте все жалобы, чтобы получить [item=taxpayer-money].\nНеобслуженные посетители раздражаются и протестуют у ваших зданий. Наведите курсор на посетителя, чтобы увидеть его дело и настроение.
administratorio-work-orders=Многие машины расходуют разрешительный документ как ингредиент рецепта. Без него производство останавливается, даже если остальные материалы есть.\nПроверьте нужный документ и допустимые машины в Factoriopedia. Документы для разных классов машин не взаимозаменяемы.
administratorio-field-office=Поставьте [entity=field-office] дальше 32 клеток от любого гнезда и не дальше 200 клеток от вражеского (обычное качество). Выберите рецепт и подайте ингредиенты.\nРабота начнётся только после прихода рабочего из гнезда. После 2 изготовлений он возвращается, затем приходит следующий. Оставьте оба пути свободными.\nКаждое гнездо даёт 10 полевых рабочих на все офисы. Если ближайшее занято, офис ищет другое в пределах радиуса. Без свободных рабочих он ждёт. Нанимать персонал и платить зарплату не нужно; офис работает всю ночь.
administratorio-biter-complaints=Ставьте [entity=admin-station] дальше 32 клеток от любого гнезда и оставляйте места обслуживания доступными.\nИзвлекайте талоны, обрабатывайте их в [entity=resolution-office] и возвращайте решения в инвентарь того же бюро. Ячейки инвентаря не соответствуют местам посетителей.\nПосетитель уходит только после закрытия всех жалоб. Более крупные существа подают больше жалоб. Изначально у бюро 4 места; исследования добавляют новые.
administratorio-visitor-routing=Посетители выбирают свободное место в пределах 256 клеток (8 чанков): бюро или действующую платформу посадки. Обычно побеждает ближайшее доступное место.\nЕсли в этом радиусе есть подходящее место, даже заполненное или ожидающее поезд, поиск дальше не идёт. Посетители ждут поблизости и ходят к местам в пределах 96 клеток (3 чанков).\nСтавьте посадку рядом с источником посетителей. Полное бюро поблизости может удержать их от поиска дальней платформы. Дальше они ищут только при отсутствии мест поблизости.
administratorio-desk-signals=Подключите [entity=admin-station] проводом, чтобы читать сигналы жалоб, свободные места [virtual-signal=signal-available-slots] и присутствующих посетителей [virtual-signal=signal-total-waiting]. Резервирование уже уменьшает число свободных мест.\nУсловие Свободные места = 0 удобно для тревоги; сигнал жалобы > 0 — для включения нужной линии решений. Сигналы описывают дела посетителей, а не содержимое инвентаря.\nНаведите курсор на посетителя для разбора его случая. Обзор административных бюро показывает общую нагрузку.
administratorio-frustration=Раздражение растёт при поиске обслуживания и ожидании решений. Путь к забронированному месту приостанавливает отсчёт. В обычном режиме 100 % вызывает протест, отключающий здание.\nБросьте [item=promise] в протестующего. Если место свободно, он возвращается с 50 % раздражения; иначе получает 60 секунд на поиск, после чего снова протестует.\nОбещание сохраняет незавершённое дело. Закройте оставшиеся жалобы и обеспечьте свободный проход.
administratorio-hush-money=Бросьте [item=hush-money] в гнёзда, чтобы остановить появление существ на 3 минуты. Уже прибывших посетителей всё равно нужно обслужить.\nИспользуйте паузу для разгрузки очереди или ремонта линии решений. Затем гнёзда возобновят работу.
administratorio-nest-expropriation=Бросьте [item=eviction-notice] рядом с гнездом, чтобы удалить его навсегда. Соседние граждане переходят в систему жалоб с повышенным раздражением.\nПодготовьте места обслуживания до выселения. Сохраните часть гнёзд, если нужны доход, новобранцы или рабочие полевых офисов.
administratorio-biter-employment=Положите [item=job-offer] в бюро до выдачи последнего решения посетителю. Успешный наём заменяет его денежную выплату.\nБез Space Age кусаки и плеваки всегда соглашаются: маленький/средний/большой/чудовищный дают 1/2/3/5 [item=worker-biter].\nРабочие многократно выполняют задания. Специалисты в рецептах зданий расходуются при изготовлении здания.
administratorio-space-age-enrollment=Положите [item=job-offer] в бюро на Наувисе до последнего решения. Зачисляются только кусаки, не плеваки. Предложение тратится на попытку.\nШанс по раздражению: ≤50 %: 75 %; >50–75 %: 50 %; >75–90 %: 25 %; >90 %: 0 %.\nУспех даёт одного [item=enrolled-biter] вместо денег. Обучите его в [entity=formation-center], чтобы получить многоразового [item=worker-biter]. Обычная подготовка персонала проходит на Наувисе; инструктажи менеджеров доступны и в других местах.
administratorio-biter-station=Загрузите [entity=biter-station] предметами [item=worker-biter] и [item=taxpayer-money]. Оставьте проход к машинам в пределах 30 клеток от центра станции.\nВизит разрешает одно изготовление. Рабочий возвращается и используется снова; рейс стоит 1 единицу денег. Эффективность труда позволяет посетить 3, затем 5 машин за рейс.\nКаждую машину обслуживает ближайшая станция, даже без рабочих или денег. Перекрытие зон не умножает визиты. Наведите курсор на станцию для просмотра покрытия и состояния отправки.
administratorio-worker-machines=Визиты обслуживают [entity=oil-refinery], [entity=centrifuge], [entity=propaganda-distillery], [entity=corporate-breakroom] и [entity=printer-t2] на планетах.\nОстальным сборочным машинам визиты не нужны. Штаб профсоюза использует ингредиенты рецептов. Орбитальный принтер на космической платформе имеет постоянное разрешение.\nМашине нужны выбранный рецепт и свободный подход. При ожидании проверьте ближайшую станцию, рабочих, зарплату и ночной кофе.
administratorio-biterport=Загрузите [entity=biterport] предметами [item=biter-logistics-formation] и [item=taxpayer-money]. Каждый рейс стоит 1 единицу денег.\nРабочие ходят к логистическим сундукам, игрокам, призракам строительства и заданиям демонтажа. Оставляйте проходы: препятствия они не перелетают.\nПри обычном качестве покрытие квадратное: 25 клеток по каждой оси для логистики, 55 для строительства. Порты объединяются, если расстояние между центрами не превышает 50 клеток по каждой оси, включая диагонали. Наведите курсор на порт для просмотра сети.
administratorio-biterport-cargo=Держите запасы поставщиков, свободные места запросов и хранилища в одной сети битерпортов. Качество предметов сохраняется. Исследования вместимости и скорости раздельные.\nПодобранные предметы идут сначала нуждающемуся сундуку запроса, затем в хранилище. Без подходящего места рабочий сохраняет груз и подаёт тревогу; остальные продолжают работать.\nОсвободите место или добавьте хранилище в этой сети. Повторная попытка — каждые 5 секунд. Дополнительные рабочие не заменят место доставки.
administratorio-orphaned-workers=Рабочий без дома, места в домашнем инвентаре или пути обратно подаёт тревогу и накапливает раздражение.\nВосстановите подходящий [entity=biter-station] или [entity=biterport], освободите место рабочего либо расчистите проход. Заблокированные пути повторно проверяются каждые 10 секунд.\nВозвращение в подходящий дом снимает тревогу и раздражение. Иначе рабочий со временем становится протестующим.
administratorio-rideable-biter=Разместите [item=rideable-biter] и заправляйте его [item=taxpayer-money]. Без всадника он может бродить.\nРазмещённого кусаку нельзя добыть или разобрать. После 10 минут с пустым топливным слотом он становится диким средним кусакой и переходит в систему жалоб. Держите деньги в топливном слоте, чтобы сохранить его.
administratorio-hired-biter=Разверните [item=hired-biter-capsule] и снабдите [item=eviction-notice]. Агент носит до 20 уведомлений и ищет гнёзда в радиусе 60 клеток. Каждое выселение тратит одно уведомление.\nСнабжённые агенты патрулируют и выселяют автоматически. Пополнение доступно из логистической сети робопортов или на назначенных остановках снабжения.\nВыселения всё равно отправляют граждан в систему жалоб. Пускайте агентов только по территориям, которые хотите освободить.
administratorio-field-agent-controls=Держите [item=hired-biter-command-capsule].\n• Левый щелчок: выбрать или снять выбор агентов под курсором.\n• Правый щелчок по земле: заменить маршрут точкой.\n• Shift + правый щелчок по земле: добавить точку.\n• Shift + правый щелчок по сундуку: добавить остановку снабжения.\n• Shift + левый щелчок по сундуку: немедленно загрузить уведомления выбранным агентам.
administratorio-working-hours=При включённых рабочих часах [entity=office-desk] и [entity=union-headquarters] закрываются ночью, если в слоте модуля нет [item=overtime-exemption]. Освобождение постоянно; дополнительные копии бесполезны.\n[entity=biter-station] и [entity=biterport] вместо этого тратят 5 [fluid=liquid-coffee] за ночную отправку. Подведите кофе к боковому соединению. Их рабочие разрешают работу управляемых машин, включая комнату отдыха.\nПолевые офисы работают всю ночь. Ночное разрешение не отменяет протесты. Отключите рабочие часы в настройках запуска, чтобы убрать ночные закрытия.
administratorio-administrative-clock=Подключите [entity=administrative-clock] для чтения [virtual-signal=signal-working-hours]: 1 в дневную смену, отсутствует ночью. Условие > 0 позволяет включать подачу днём.\n[virtual-signal=signal-daytime] идёт от 0 до 100, полночь — 0/100. [virtual-signal=signal-day-shift-start] и [virtual-signal=signal-day-shift-end] обозначают границы смены.\nЧасы сообщают время работы; они не дают разрешение на сверхурочную работу и не подают кофе.
administratorio-pneumatic-transport=Соедините [entity=tube-intake] и [entity=tube-outtake] пневмотрубами. Загружайте допустимые документы во вход манипулятором.\nФильтр ячейки выхода выбирает предмет; извлекайте его манипулятором. Без фильтра выход берёт самый многочисленный предмет. Следующий запрашивается только после опустошения ячейки.\nСоединённые концы мгновенно делят общий запас разных предметов. Обычные жидкостные трубы не подключаются. Наведите курсор на конец сети для просмотра запаса, вместимости и соединения.
administratorio-tube-limits=Изначально сеть вмещает всего 10 предметов на все типы документов. Исследования расширяют этот запас. При заполнении входы ждут, пока выход освободит место.\nКаждая труба должна находиться не дальше 120 клеток по прямой от каждого входа, выхода или порта насоса этой сети. Превышение останавливает всю сеть.\nРазделяйте длинные линии с помощью [entity=tube-pump]. У каждой стороны будет собственный предел дальности и запас предметов.
administratorio-tube-circuits=Входы и выходы передают количества предметов общего запаса по обоим цветам проводов.\nДля входа с [item=form-27b-6] задайте условие включения Форма 27B-6 < 5. Он перестанет добавлять форму, когда в запасе будет пять.\nЧитайте один конец на логическую сеть: несколько концов складывают одинаковые показания. Не включайте чтение инвентаря на том же проводе, если нужен только общий запас. Предмет получения задаётся фильтром выходной ячейки, а не сигналами запроса.
administratorio-tube-pump=Подайте электричество на [entity=tube-pump] и подключите отдельные сети сзади и спереди. Документы идут сзади вперёд, пока в принимающей сети есть место.\nФильтры разрешения или запрета выбирают документы. При отключённых фильтрах проходят все допустимые формы.\nНе соединяйте стороны обходной трубой: она объединит запасы и отменит разделение дальности. Насос не работает, если хотя бы одна сеть слишком протяжённая.
administratorio-passenger-rail-service=[item=passenger-wagon] перевозит 24 посетителей с нерешёнными жалобами. Предметы персонала и грузы он не возит.\nСтавьте платформы у места остановки вагона: рельс не дальше 2,75 клетки от центра платформы, центр вагона — не дальше 4. Каждая платформа обслуживает только ближайший пассажирский вагон. Центр посадочной платформы должен быть доступен пешком.\nДля движения по расписанию оставьте ровно одну станцию в пределах 24 клеток для автоматической привязки. В пункте назначения нужны [entity=deboarding-platform] и доступные бюро.
administratorio-passenger-boarding=[entity=boarding-platform] резервирует до 24 посетителей. Обычно новые места выдаются только при наличии неподвижного соседнего пассажирского вагона со свободным сиденьем.\nДля очереди до прибытия поезда подайте [virtual-signal=signal-boarding-enabled] Посадка разрешена > 0 по любому цвету провода. Без сигнала ожидающая платформа всё равно удерживает поиск посетителей поблизости.\nПосадка возможна только у центра, не дальше 0,85 клетки. Полная очередь продолжает садиться. Удаление сигнала не закрывает посадку при наличии подходящего вагона.
administratorio-passenger-unboarding=Неподвижный вагон высаживает через соседнюю [entity=deboarding-platform]. Оставьте вокруг место для появления пассажиров.\nПодайте [virtual-signal=signal-deboarding-closed] Высадка закрыта > 0 по любому цвету, чтобы удержать пассажиров; уберите сигнал для высадки.\nПосетители снова ищут обслуживание, пропускают посещённые станции и делают не более 3 поездок, затем ищут только бюро. Раздражение растёт в очереди и пути. При достижении порога вспышки затронутые пассажиры выходят протестовать. Делайте маршруты короткими.
administratorio-passenger-signals=Платформа сообщает о соседнем вагоне; привязанная станция — обо всём остановившемся поезде.\n• [virtual-signal=signal-train-passengers] Пассажиры поезда: занятые места.\n• [virtual-signal=signal-train-free-seats] Свободные места поезда: доступные сиденья.\n• [virtual-signal=signal-boarders-waiting] Ожидающие посадки: резерв очереди.\n• [virtual-signal=signal-passenger-outbreak] Вспышка пассажиров: активная вспышка.\n• [virtual-signal=signal-passenger-highest-frustration] Максимальное раздражение: 0–100.\nДля расписания используйте общие значения станции, например Пассажиры поезда = 0 после высадки. Не подключайте выходы платформ к этому проводу: они продублируют числа.
administratorio-transit-authorization=Положите [item=transit-authorization] в разрешительный сундук рядом с каждой обычной [entity=train-stop]. Одно разрешение тратится при прибытии и ожидании поезда.\nЛимит поездов равен числу разрешений; ноль закрывает станцию. Ручные лимиты и логические команды включения или лимита переопределяются.\nРегулируйте прибытие количеством разрешений в сундуке. Пассажирским поездам на обычных станциях они тоже нужны.
administratorio-public-train-stop=[entity=public-train-stop] не требует разрешений и не создаёт сундук. Используйте её для обычного ручного или логического управления лимитами поездов.\nЗамените обычную станцию, сохранив имя из расписаний. Пассажирские платформы тоже могут привязываться к ней.
administratorio-personnel-routing=Выровняйте [entity=personnel-deployment-office], указатели и [entity=personnel-reception-office] по сетке 2×2. Направьте отправление к следующему указателю или приёмке; на каждом повороте нужен указатель. Свободные прямые соединения мостятся автоматически.\nЗагружайте обученный персонал или туристические пакеты при отправлении и забирайте те же предметы при приёмке. Полевые агенты и ездовые кусаки развёртываются отдельно.\nДля старта достаточно соединения до следующего узла. Электричество и зарплата не нужны. Маршрут не управляет посетителями с жалобами или рабочими на заданиях.
administratorio-personnel-traffic=Отсутствие пути дальше, занятая полоса, неподходящий фильтр или полная приёмка удерживают очередь. Первый кусака блокирует следующих. Почините путь или разгрузите приёмку.\nУказатели можно поворачивать при движении: уже входящий кусака сохранит поворот, следующий использует новую стрелку. Приёмка принимает со всех четырёх сторон.\nЗанятую инфраструктуру нельзя добыть. Прекратите загрузку, достройте путь до приёмки и освободите его. Конвейеры, манипуляторы и столбы допустимы на покрытии; мешающие здания — нет.
administratorio-personnel-multisign=Откройте [entity=personnel-routing-multisign] или латунный разъём стрелки. Лево, прямо и право отсчитываются от главной стрелки. У каждого выхода свой режим Ручной/Логический.\nРучной режим допускает до 5 типов персонала; правый щелчок очищает фильтр. Пустой список закрывает выход. Подходят все качества.\nПри нескольких совпадениях приоритет: лево, прямо, право. Блокировка приоритетного выхода останавливает очередь без обхода. Изменения фильтров действуют на ожидающих, но не на уже входящих в поворот.
administratorio-personnel-circuits=Для выхода перекрёстка в логическом режиме подключите его латунный разъём. Положительный сигнал предмета персонала разрешает этот тип. Красный + зелёный и все качества суммируются; ноль или меньше закрывает тип.\nПример: Рабочий кусака = 1 на левом разъёме направляет рабочих налево. Разделяйте сети выходов. После размещения чертежа подключите провода разъёмов заново.
administratorio-personnel-spoilage=Инструктажи и курьеры яиц портятся вдвое медленнее на маршрутах с указателями, включая очереди. Время замедляется, но не сбрасывается.\nПосле истечения срока путешественник становится обычным [item=middle-management-managing-manager] с прежним качеством. Следующим перекрёсткам нужен фильтр обычного менеджера; уже забронированный поворот сохраняется.\nОставьте путь возврата обычным менеджерам, чтобы просроченный персонал не блокировал очередь. У проинструктированных менеджеров над кусакой видно оставшееся время.
administratorio-management-briefings=Инструктируйте менеджеров в [entity=formation-center] рядом с работой. Сроки — 30/25/20/15/10 минут для обучения/кадров/соответствия/связей/орбитальных операций.\nПо истечении срока возвращается обычный [item=middle-management-managing-manager]. Обучение и строительство с персоналом также возвращают менеджеров без инструктажа. Забирайте их для повторного использования.\nИнструктаж возможен на любой планете без денег налогоплательщиков. Не запасайте проинструктированных менеджеров перед долгой поездкой.
administratorio-specialist-approval=[entity=foundry], [entity=biochamber], [entity=electromagnetic-plant] и [entity=cryogenic-plant] сначала создаются как неодобренные корпуса. Одобрите корпус с нужной лицензией в [entity=corporate-breakroom] или [entity=union-headquarters].\nОдобрение в комнате отдыха не требует визита рабочего. Корпусу повышенного качества нужны документы того же качества.\nДобыча и демонтаж возвращают неодобренный корпус: перед размещением одобрите его снова. Уничтожение ничего не возвращает. Специалист расходуется при изготовлении корпуса, а не при размещении здания.
administratorio-unstaffed-operations=Установите один [item=unstaffed-operations-waiver] в слот модуля машины, обслуживаемой станцией. Она работает без визитов и оплаты рейсов, в том числе ночью.\nРазрешение постоянно и занимает слот. Извлечение сразу возвращает требование рабочих. Дополнительные копии бесполезны. Разрешение не отменяет ингредиенты рецепта и протесты.
administratorio-quality=Радиус полевых офисов и покрытие битерпортов растут на 10 % за уровень: необычное +10 %, редкое +20 %, эпическое +30 %, легендарное +50 %. Связь битерпортов всё равно ограничена 50 клетками по каждой оси; станции рабочих остаются в радиусе 30 клеток.\nКачество не увеличивает вместимость и дальность пневмотруб. Трубы и маршруты сохраняют качество груза.\nЗапросы терминала и переселения должны указывать качество. Фильтры перекрёстков объединяют все качества одного типа персонала.
administratorio-trajectory-compliance-arrays=Загрузите в установку соответствия траекторий приказы отклонения. Она отталкивает астероиды, не создавая обломков. Приоритетные приказы удваивают толчок.\nМладшая: малые/средние в 24 клетках; старшая: также большие в 36; исполнительная: также огромные в 48.\nТяжёлым камням нужны несколько одновременных толчков. Эффекты разных установок складываются. Они избегают камней с закреплёнными или летящими к ним шахтёрами: выбирайте отклонение или добычу.
administratorio-orbital-employment-catapult=Загрузите [entity=orbital-employment-catapult] предметами [item=voluntary-exploration-space-miner]. Список приоритетов выбирает допустимые размеры; предпочтение огромным, затем большим, средним и малым.\nШахтёры прикрепляются и работают до разрушения камня. Изначально разрешён один на астероид; исследования увеличивают лимит. Летящие шахтёры уже резервируют места.\nЗаполненная цель заставляет катапульту ждать. Занятые камни не отклоняются: оставьте достаточно времени для добычи до столкновения.
administratorio-orbital-miner-recovery=При разрушении занятого астероида обломки с сотрудниками появляются раньше обычных. Сборщики астероидов возвращают их сразу как многоразовых [item=voluntary-exploration-space-miner].\nОтправляйте возвращённых шахтёров в катапульту. Покройте сборщиками область дрейфа: ушедший обломок сотрудника означает потерянного шахтёра. Дополнительные места на астероиде требуют возвращать больше сотрудников.
administratorio-territorial-arbitration=Поставьте [entity=territorial-arbitration-post] так, чтобы его площадь пересекала нужную территорию. Непрерывно подавайте приказы переселения и ложь.\nУспешные циклы уменьшают территорию; несколько постов складывают прогресс. Без обработки территория отрастает, пока арбитраж не завершён.\nЗавершение удаляет разрушителя и даёт [item=territorial-deed]. Состояние поста показывает прогресс и нехватку снабжения. Закончите территорию, прежде чем перемещать посты.
administratorio-capture-bureau=Поставьте [entity=capture-bureau] дальше 32 клеток от гнёзд и в пределах 48 клеток от нужных существ. Освободите выход и подавайте один тип приманки.\n• Наувис + рабочая приманка: кусаки становятся рабочими.\n• Наувис + туристическая: плеваки становятся туристами.\n• Глеба + приманка яйцекладки: пятилапые дают яйца.\nНа Наувисе тратится 1 приманка/секунду даже в ожидании. Яйца требуют 5/8/12 приманки на малого/среднего/большого пятилапого, без расхода в простое. Смесь приманок может выбрать нежелательный режим.
administratorio-pentapod-bargaining=На Глебе бросьте [item=pentapod-sampling-capsule] прямо в дикого пятилапого. Он выживает и даёт 1/2/4 свежих яйца по размеру. Повторный сбор с него возможен через 30 секунд; ранняя попытка возвращает капсулу.\nБюро захвата автоматизирует сбор с диких существ; исследование выращивания яиц позже открывает разведение. Гнёзда Глебы создают только малых пятилапых; эволюция повышает частоту.\nЯйца всё ещё портятся в агрессивных пятилапых. Держите производство и потребление рядом.
administratorio-space-tourism=Ловите плевак на Наувисе туристической приманкой. Отправьте пакет в [entity=administrative-space-station] для орбитального отдыха, затем верните довольного туриста в [entity=office-desk] на Наувисе для оформления отъезда.\nНеудовлетворённые пакеты через 5 минут становятся злыми плеваками. Отправляйте их быстро.\nОформление отъезда платит деньги и мирно освобождает посетителя. Один лишь захват или отдых не оплачивается: завершите обратный путь.
administratorio-offworld-economy=Со Space Age решения жалоб приносят [item=taxpayer-money] только на Наувисе. На других планетах они всё равно закрывают дела.\nИмпортируйте деньги для зарплат рабочих и требующих их рецептов вне Наувиса. Туризм также оплачивается только при оформлении отъезда на Наувисе.\nДержите запас многоразовых менеджеров на месте: их инструктажи не требуют денег и доступны вне Наувиса.
administratorio-archive-recombination=Вставьте подходящую форму в [entity=archive-recombination-bureau]; перераспределение выберется автоматически.\nТри альтернативные формы имеют по отдельной вероятности 25 %: цикл даёт от 0 до 3 предметов. Ранг сохраняется; новый цвет и исходная форма не появляются.\nПодавайте излишки и сортируйте выход. Это случайный результат, а не надёжное снабжение критически важной линии.
administratorio-ai-cooling=Соедините [entity=ai-server] тепловыми трубами с потребителем тепла, например [entity=heat-exhaust]. Работающий сервер выделяет 4 МВт тепла и останавливается при 950 °C. Он продолжит только после охлаждения ниже порога.\nПодавайте [fluid=inference-token] через [entity=optical-fibre] в [entity=slop-refinery]. Обычные и пневматические трубы токены не переносят.\nВыводите побочные выдуманные цитаты, чтобы переработка не останавливалась. Система производит допустимые бесцветные документы, но не заменяет цветные формы.
administratorio-interplanetary-terminus=Постройте [entity=interplanetary-terminus] на каждой участвующей планете. Изначально разрешён один на планету; исследование дополнительных терминалов повышает предел.\nЗагрузите допустимые документы во вход. После перелёта они попадают в общий запас вашей стороны без предварительного запроса получателя.\nПрибывшее остаётся в выходном инвентаре: извлекайте сами. Местные пневмосети отдельные. Начальная магистраль принимает чёрные документы; хроматическое исследование добавляет подходящие цветные.
administratorio-terminus-circuits=У терминала зелёный провод запрашивает, красный сообщает общий запас. Положительный сигнал предмета на зелёном постоянно запрашивает эту форму соответствующего качества.\nЭто непрерывный запрос, а не целевой запас. Уберите его, когда местный буфер заполнен.\nЗабрать документы может любой конец, включая отправившую планету. Резервировать их для назначения нельзя. Читайте один терминал на красную сеть, чтобы не складывать дублирующиеся показания.
administratorio-interplanetary-trunk=Начальная вместимость — 3 предмета, перелёт каждого — 30 секунд. Исследования повышают вместимость и сокращают время.\nМеста занимают и летящие предметы, и невостребованные формы в общем запасе. Никем не запрашиваемая форма способна бессрочно блокировать следующие отправки.\nПроверьте запас красным проводом, запросите застрявшие формы и очистите выходные инвентари. Дополнительные терминалы не создают отдельных запасов или дополнительной общей вместимости.
administratorio-relocation-cannon=Загрузите персонал в [entity=involuntary-relocation-cannon]. На другой планете положите [item=involuntary-transfer-order] в [entity=involuntary-relocation-receiver] и подайте зелёным проводом сигнал нужного персонала.\nПолучатель выбирает груз; назначение на пушке задавать не нужно. Каждое прибытие стоит один приказ. Красный сообщает собственный инвентарь здания.\nПоложительный запрос повторяется; уберите его после пополнения. Обеспечьте приказы на всю запрошенную партию и извлекайте прибывшее. Яйца и космические платформы не поддерживаются.
administratorio-egg-couriers=Яйца кусак остаются на Наувисе. Для работы вне планеты обучите там нужного курьера: [item=missionary-manager], [item=voluntary-research-subject] или [item=geotechnical-assessment-manager].\nКаждый через 30 минут становится обычным менеджером. Во входной ячейке машины курьер продолжает стареть.\nПодготовьте остальные ингредиенты до его доставки, особенно для науки Администраториума. Маршруты с указателями замедляют порчу в пути и очереди, но не обновляют срок.
administratorio-hard-mode=Включите HARD MODE в настройках карты для эскалации нерешённых протестов. Посетители протестуют при 70 % вместимости раздражения и атакуют здания при 100 %.\n[item=promise] прерывает атаку и возвращает посетителя к поиску обслуживания. Подготовьте доступное свободное бюро и решения: одно обещание дело не закрывает.\nРежим меняется во время игры. При выключении действует обычное правило: протест на 100 %.
administratorio-personnel-counts=Обычный указатель передаёт количества персонала на непосредственно входящих отрезках, включая очереди и все качества. Весь маршрут он не считает.\nИспользуйте показания для наблюдения за очередью или управления загрузочным манипулятором. У самих офисов нет логического управления.
administratorio-evolution-approvals=Эволюция кусак и плевак ограничена до исследования следующего разрешения на жалобы. Более крупные особи также не появляются без соответствующего разрешения.\nПодготовьте новые линии решений до разрешения следующего размера. Повышение предела позволяет эволюции расти дальше, но не повышает её мгновенно: заблокированный рост не накапливается.\nЭти ограничения не действуют на пентаподов Глебы.
