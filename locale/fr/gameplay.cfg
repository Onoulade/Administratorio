[virtual-signal-description]
signal-complaint-l=Compte les griefs de paysage en attente. La plainte la plus basique : si ce nombre monte, vos bureaux prennent du retard.
signal-complaint-s=Suit les dossiers de smog actifs. Si ce nombre grimpe, votre pollution aussi.
signal-complaint-n=Surveille l'arriéré de plaintes de bruit. A tendance à exploser quand vous construisez trop de machines trop près des nids.
signal-complaint-u=Compte les dépôts de chômage. Seuls les biters béhémoths déposent ceux-là : une hausse signifie que l'évolution dépasse votre chaîne de traitement.
signal-complaint-lt=Suit les plaintes de déchets des spitters. Le lobby des flaques d'acide a des préoccupations.
signal-complaint-h=Surveille les dossiers hazmat. Une hausse signifie que votre infrastructure chimique attire l'attention.
signal-complaint-lo=Compte les dépôts de flânerie. Les infractions de zone réglementée s'accumulent.
signal-complaint-v=Suit les plaintes de vagabondage, le palier spitter le plus lourd. Si ce nombre bouge, il vous faut plus de capacité de résolution.
signal-available-slots=Nombre d'emplacements de bureau ouverts dans les stations connectées. Quand il tombe à zéro, les manifestations commencent.
signal-total-waiting=Nombre de biters actuellement dans la file. Plus il monte, plus vous approchez d'une très mauvaise journée.
signal-daytime=Heure résolue sur un cycle de 0 à 100, avec minuit à 0 et 100, et midi à 50.
signal-working-hours=Émis à 1 lorsque la surface résolue est dans les heures de bureau. Absent pendant la fenêtre nocturne.
signal-day-shift-start=Début configuré du service de jour, sur l'échelle 0–100 de l'horloge.
signal-day-shift-end=Fin configurée du service de jour, sur l'échelle 0–100 de l'horloge.
