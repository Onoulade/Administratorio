[entity-description]
slop-refinery=Tout ce qui suit un jeton. Tire les Jetons d'inférence de la fibre optique, les raffine en Bouillie administrative, transforme la bouillie en paperasse fabriquée et traite les Citations fabriquées qui en tombent. Le [entity=ai-server] ne produit que l'inférence ; c'est cette machine qui la transforme en classement.
optical-fibre=Transporte uniquement du [fluid=inference-token]. Ne se connecte ni aux tuyaux ordinaires ni aux tubes pneumatiques.
involuntary-relocation-cannon=Envoie le personnel de la famille des biters vers une autre planète, par lot et par tir. Ce n'est pas une tourelle : il ne vise rien.\n\nChargez la cargaison dans son emplacement d'entrée. Rien d'autre n'est nécessaire — il tire dès qu'un [entity=involuntary-relocation-receiver] correspondant sur une autre planète en fait la demande, dépensant un des ordres de transfert de ce récepteur par objet arrivé.\n\n[font=default-bold]Il n'y a aucun réglage de cible.[/font] N'importe quel récepteur d'une autre planète avec une demande correspondante reçoit une réponse. Personnel de la famille des biters uniquement, jamais des œufs, et uniquement entre planètes. Une planète qui envoie et reçoit construit l'un et l'autre.
involuntary-relocation-receiver=Demande du personnel de la famille des biters à une autre planète, par lot et par tir.\n\nChargez des [item=involuntary-transfer-order] dans son emplacement d'entrée, et reliez-le à un réseau de circuits avec un signal pour chaque objet que [color=green]cette[/color] planète veut recevoir. Il dépense un ordre par objet arrivé, et les arrivées atterrissent dans ses emplacements de sortie.\n\n[font=default-bold]Il n'y a aucun réglage de cible.[/font] N'importe quel [entity=involuntary-relocation-cannon] sur une autre planète avec la cargaison correspondante répond. Une planète qui envoie et reçoit construit l'un et l'autre.
synthetic-personnel-bureau=Fabrique des professions plutôt que des bâtiments. Synthétise Notaires agréés, Agents de conciliation, Commis relais et Techniciens cryo-impression à partir d'œufs de biters, de jetons d'inférence et de bouillie administrative : un spécialiste ne demande donc plus un aller-retour vers Nauvis. Sa consommation électrique est la vraie contrainte.
ai-server=Cœur de calcul d'Aquilo, et sa seule tâche. Il consomme énormément d'électricité pour produire des Jetons d'inférence et émet de la vraie chaleur dans le réseau thermique vanilla pendant son fonctionnement. Un serveur incapable d'évacuer sa chaleur s'arrête net : il ne ralentit pas. Il n'offre aucun choix de recette, et ses jetons ne sortent que par fibre optique vers une [entity=slop-refinery].
heat-exhaust=Limite la température d'un réseau thermique en évacuant l'excédent. Pour les joueurs qui veulent le calcul sans la production d'énergie. Il n'est jamais plus efficace que d'utiliser réellement la chaleur.
interplanetary-terminus=Transporte la paperasse entre les planètes via un pool de tronc commun, lent et étroit. Un par planète.\n\n[font=default-bold]Pour envoyer :[/font] les inserteurs placent le formulaire à exporter dans son emplacement d'entrée. Il repart sur son propre minuteur — aucune demande n'est nécessaire — et rejoint un pool partagé par toutes les planètes de votre force. Un seul type de formulaire à la fois.\n[font=default-bold]Pour demander (câble [color=green]vert[/color]) :[/font] connectez le vert et définissez un signal pour chaque formulaire que cette planète veut. Un formulaire correspondant dans le pool est réclamé instantanément, peu importe son origine — même un formulaire que cette même planète y a déposé elle-même, ce qui est un simple retrait, pas un raccourci.\n[font=default-bold]Pour consulter le contenu du pool (câble [color=red]rouge[/color]) :[/font] connectez le rouge pour lire ce qui s'y trouve actuellement, à l'échelle de l'empire. Les deux couleurs partagent l'unique connecteur du Terminus sans interférer l'une avec l'autre.\n[font=default-bold]Pour recevoir :[/font] les arrivées atterrissent dans ses emplacements de sortie. Retirez-les vous-même avec un inserteur — les mettre sur un tapis, dans un coffre ou dans le réseau local de tubes est votre étape explicite, jamais celle du tronc.
bullshit-ore=Un riche gisement de non-sens naturel. Exploitez-le pour obtenir du minerai de foutaises brut destiné à l'économie bureaucratique.
politician-fluid=Une fissure souterraine sous pression d'essence politique. Extrayez-la avec une pompe à pétrole pour obtenir du fluide politicien.
redundant-rubble=Un gisement géologique de contrôle minéralisé. Exploitez-le pour obtenir des gravats redondants nécessaires aux documents officiels contraignants.
office-desk=Poste de travail consolidé pour dépôts, fournitures et tâches administratives de base. Ferme la nuit sauf avec une [item=overtime-exemption].
field-office=Appelle des biters depuis les nids dans un rayon de 200 tuiles comme travailleurs d'un cycle. Fonctionne seulement quand un biter est sur place ; aucune pollution pendant l'exploitation. Fonctionne jour et nuit et n'accepte aucun module.
biter-station=Envoie plusieurs travailleurs biters en parallèle pour autoriser les bâtiments gérés proches. Chaque machine autorisée effectue une fabrication, puis attend la visite suivante. La nuit, chaque envoi consomme aussi du café liquide depuis l'une des quatre entrées latérales.
biterport=Contient jusqu'à 8 travailleurs logistiques biters et du financement public. Les biterports connectés forment un réseau terrestre de construction et de logistique avec des zones de taille roboport : les biters construisent les fantômes et déplacent les objets des coffres demandeurs dans la couverture du biterport, tandis que les robots normaux peuvent encore utiliser la zone native superposée. Les travailleurs revenus se reposent 30 ticks avant un nouvel envoi. La nuit, chaque envoi consomme aussi du café liquide depuis l'une des quatre entrées latérales.
paperwork-provider-chest=Coffre fournisseur passif à un emplacement pour la logistique opérée par biters. Les robots peuvent encore l'utiliser.
paperwork-storage-chest=Coffre de stockage à un emplacement pour la logistique biter et les dépôts de déconstruction.
paperwork-requester-chest=Coffre demandeur à un emplacement pour la logistique opérée par biters.
formation-center=Installation de formation des biters et de briefing des managers. La création de nouvelles professions est réservée à Nauvis ; les managers réutilisables peuvent suivre des briefings peu coûteux sur n'importe quelle planète. Accepte le café liquide des deux côtés et prend en charge les modules de vitesse.
rideable-biter=Transport personnel avec un fonctionnaire étonnamment enthousiaste dessous. Alimenté uniquement par [item=taxpayer-money], équipé d'une très petite sacoche, et affecté définitivement une fois placé. Sans financement pendant 10 minutes, il retourne au service civil des plaintes.
field-office-no-working-hours=Appelle des biters depuis les nids dans un rayon de 200 tuiles comme travailleurs d'un cycle. Fonctionne seulement quand un biter est sur place ; aucune pollution pendant l'exploitation.
office-desk-no-working-hours=Poste de travail consolidé pour dépôts, fournitures et tâches administratives de base.
admin-station=Interface biter 5x5. Stocke les tickets de plainte et les objets résolus. Les biters arrivent, sont enregistrés et attendent une résolution. Pas de fabrication : stockage uniquement.
resolution-office=Bureau de résolution 3x3. Gère les dépôts, les dossiers et les décisions finales avec deux entrées de fluide.
union-headquarters=Négocie l'approbation de la main-d'oeuvre et gère maintenant la charge exécutive de fin de partie : subventions, approbations écrites, directives et audits fiscaux. Le premier exemplaire démarre avec des bons du Trésor et de la paperasse verbale. Ferme la nuit sauf avec une [item=overtime-exemption].
union-headquarters-no-working-hours=Négocie l'approbation de la main-d'oeuvre et gère maintenant la charge exécutive de fin de partie : subventions, approbations écrites, directives et audits fiscaux. Le premier exemplaire démarre avec des bons du Trésor et de la paperasse verbale.
propaganda-distillery=Raffinerie administrative 5x5 pour fluides. Raffine le fluide politicien en mensonges, synthétise la désinformation, produit des justifications et des caisses noires. Schéma de tuyaux symétrique avec deux entrées à l'ouest et deux sorties à l'est.
locomotive=Un coffre de permis de transit est placé automatiquement à chaque arrêt de train. Chargez-y des formulaires [item=transit-authorization] : un formulaire est consommé par arrivée. La limite de trains de la gare égale le nombre de formulaires dans le coffre.
greenhouse=Fait pousser lentement du bois avec de l'eau, ou cultive des grains de café rares. Alimentée électriquement.
printer-t1=Imprimante électrique lente mais fiable. Produit des documents à partir de cartouches d'encre. Consommation : 50 kW.
printer-t2=Imprimante industrielle rapide avec mode copie. Sur les planètes, elle exige la visite d'un [item=biter-worker] depuis une [entity=biter-station] proche. Sur les plateformes spatiales, une autorisation embarquée remplace l'envoi et permet une impression orbitale avancée.
mechanical-printer=Imprimante à manivelle rudimentaire mais fonctionnelle (vitesse 0,5x). Cheval de trait fiable du début de partie.
corporate-breakroom=Consomme du café liquide et des données douteuses pour générer des rumeurs de fontaine à eau. Essentielle aux décisions corporatives. Ferme la nuit sauf avec une [item=overtime-exemption].
corporate-breakroom-no-working-hours=Consomme du café liquide et des données douteuses pour générer des rumeurs de fontaine à eau. Essentielle aux décisions corporatives.
pneumatic-pipe=Tuyau scellé couleur chemise manille pour transporter de la paperasse fluidisée. Ne se connecte pas aux tuyaux de fluide ordinaires.
pneumatic-pipe-to-ground=Tube pneumatique souterrain. Ne se connecte pas à l'infrastructure de fluides ordinaire.
tube-intake=Station d'entrée 1x1. Les bras peuvent insérer directement les objets de paperasse valides dans le réseau de tubes.
tube-outtake=Station de sortie 1x1. Les objets du réseau de tubes apparaissent dans son inventaire ; utilisez vos propres bras ou votre logistique pour les extraire. Définissez un filtre sur l'emplacement d'inventaire pour demander un type d'objet précis.
overtime-exemption=Certifie un bâtiment administratif pour le personnel nocturne légal. Un seul module suffit à garder tout le bâtiment ouvert après la tombée de la nuit ; les copies supplémentaires sont seulement de la corruption décorative.
orbital-employment-catapult=Déploie des projectiles [item=voluntary-exploration-space-miner] jusqu'à 56 cases à travers un corridor de tir étroit de 18°. Les mineurs s'accrochent à l'impact et infligent 125 dégâts de minage de base par seconde après un délai d'une seconde. Chaque astéroïde accepte un mineur au départ, jusqu'à cinq grâce à la recherche de dotation. Un astéroïde détruit produit son plein rendement de fragments équivalent au jeu de base, plus un fragment d'employé récupérable par mineur attaché ; récupérer ce fragment renvoie directement des munitions de mineur réutilisables vers la sortie du collecteur.
administrative-space-station=Bureau administratif orbital dédié. Les bureaux ordinaires restent au sol ; l'Imprimante industrielle et l'Imprimante laser sont les seules autres machines administratives homologuées pour le vide. Produit une paperasse de plateforme renouvelable à partir de matériaux d'astéroïdes.
amber-sap-seep=Un suintement collant de Gleba. Pompez-le pour obtenir de la sève ambrée, utilisée pour le non-sens, l'encre et les substituts jaunes de la planète.
archive-recombination-bureau=Utilise les emplacements d'entrée et de sortie normaux d'un Recycleur et reste en permanence géré par le [item=relay-clerk] utilisé lors de sa construction. Insérez un formulaire compatible : ses trois candidats de remplacement de même rang et de même couleur sont chacun tirés indépendamment à 25 %, si bien qu'une opération peut rendre zéro, un, deux ou trois formulaires.
capture-bureau=Machine dédiée aux acquisitions hostiles. Chargez-la de spores-leurres pour créer un nuage de spores visible : les spores de main-d'oeuvre attirent les biters, les spores de tourisme attirent les cracheurs, et les spores d'oviposition attirent les pentapodes de Gleba.
chromatic-printer=Imprime les documents noirs et colorés dans les mondes atmosphériques. Cyan : Vulcanus ; jaune : Gleba ; magenta : Fulgora. Importer une couleur permet l'impression distante, jamais le déblocage de sa juridiction. Aquilo exige une Imprimante laser.
conciliation-desk=Bureau de conciliation dédié à Gleba. Finalise la famille compacte des formulaires jaunes pour les raccourcis de lancement et le traitement des exceptions biologiques.
digital-services-bureau=Bureau numérique dédié à Fulgora. Traite les tâches administratives de niveau bureau à grande vitesse et sans fermeture nocturne.
executive-trajectory-compliance-array=Consomme des ordres de déviation orbitale, routiniers ou prioritaires, pour repousser tout astéroïde dans un rayon de 40 cases. Les ordres prioritaires poussent deux fois plus fort ; les énormes astéroïdes d'Administratorium nécessitent en général plusieurs poussées simultanées.
laser-printer=Imprimante à support solide d'Aquilo. Elle emploie des formulaires colorés importés et des supports locaux : planifiez ces entrées interplanétaires avant toute ligne cryogénique ou charte finale.
notary-office=Bureau de certification dédié à Vulcanus. Gère les sceaux, chartes, homologations et la paperasse de lancement de secours grâce à un traitement notarial alimenté en fluide.
petition-counter=Poste d'approbation des permis. Traite les permis non approuvés uniquement si un nid de biters se trouve à proximité.
propaganda-distillery-space-age=Raffinerie administrative 5x5 pour fluides. Raffine le fluide politicien en mensonges, synthétise la désinformation et produit des justifications. En Space Age, le financement public renouvelable provient du tourisme orbital plutôt que du blanchiment de caisses noires. Schéma de tuyaux symétrique avec deux entrées à l'ouest et deux sorties à l'est.
senior-trajectory-compliance-array=Consomme des ordres de déviation orbitale, routiniers ou prioritaires, pour repousser les petits, moyens et gros astéroïdes dans un rayon de 30 cases. Les ordres prioritaires poussent deux fois plus fort ; les gros astéroïdes peuvent encore nécessiter plusieurs réseaux superposés.
territorial-arbitration-post=Bureau de réinstallation dédié à Vulcanus. Consomme des ordres de réinstallation territoriale et du mensonge liquide pour faire cesser l'activité des démolisseurs autour des zones contestées, dégageant le territoire vers un titre de propriété territoriale.
trajectory-compliance-array=Consomme des ordres de déviation orbitale, routiniers ou prioritaires, pour appliquer une lente poussée vers l'extérieur aux petits et moyens astéroïdes dans un rayon de 20 cases. Les ordres prioritaires poussent deux fois plus fort ; les tirs et réseaux superposés se cumulent, mais ne créent aucun fragment.
union-headquarters-space-age=Négocie l'approbation de la main-d'oeuvre et gère la charge exécutive de fin de partie : subventions, approbations écrites et directives. En Space Age, le financement provient du tourisme orbital plutôt que du blanchiment par audit fiscal. Le premier exemplaire démarre avec des bons du Trésor et de la paperasse verbale. Ferme la nuit sauf avec une [item=overtime-exemption].
union-headquarters-space-age-no-working-hours=Négocie l'approbation de la main-d'oeuvre et gère la charge exécutive de fin de partie : subventions, approbations écrites et directives. En Space Age, le financement provient du tourisme orbital plutôt que du blanchiment par audit fiscal. Le premier exemplaire démarre avec des bons du Trésor et de la paperasse verbale.
verdigris-crust=Un gisement minéral vert-de-gris de Vulcanus. Exploitez-le pour amorcer la chaîne de paperasse cyan de la planète.
