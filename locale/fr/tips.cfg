[tips-and-tricks-item-description]
administratorio-welcome=Les biters viennent déposer des plaintes au lieu de lancer des assauts.\n• Construisez des [entity=admin-station] accessibles à pied.\n• Traitez leurs tickets, puis rapportez les résolutions correspondantes au bureau.\n• Résolvez toutes les plaintes pour recevoir de l'[item=taxpayer-money].\nLes visiteurs non servis s'impatientent et manifestent devant vos bâtiments. Survolez un visiteur pour consulter son dossier et son humeur.
administratorio-work-orders=De nombreuses machines consomment un document d'exploitation comme ingrédient. Sans ce document, la production s'arrête même si les autres ingrédients sont disponibles.\nConsultez la recette et ses machines autorisées dans Factoriopedia. Les documents destinés aux différentes catégories de machines ne sont pas interchangeables.
administratorio-field-office=Placez un [entity=field-office] à plus de 32 cases de tout nid et à 200 cases maximum d'un nid ennemi (qualité normale). Choisissez une recette et fournissez ses ingrédients.\nUn ouvrier doit venir du nid avant le début du travail. Après 2 fabrications, il rentre ; un autre prend sa place. Gardez les deux trajets libres.\nChaque nid fournit 10 ouvriers de terrain, partagés entre les bureaux. Si le nid le plus proche est occupé, le bureau en cherche un autre à portée. Sans ouvrier disponible, il attend. Aucun recrutement ni salaire ; travail toute la nuit.
administratorio-biter-complaints=Placez un [entity=admin-station] à plus de 32 cases de tout nid, avec des places de service accessibles.\nSortez les tickets, traitez-les au [entity=resolution-office], puis insérez les résolutions correspondantes dans l'inventaire du même bureau. Les cases d'inventaire ne correspondent pas aux positions des visiteurs.\nUn visiteur ne repart qu'après résolution de toutes ses plaintes. Les plus grands en déposent davantage. Un bureau commence avec 4 places ; la recherche en ajoute.
administratorio-visitor-routing=Les visiteurs choisissent une destination disponible dans un rayon de 256 cases (8 chunks) : bureau ou quai d'embarquement actif. La destination disponible la plus proche est normalement prioritaire.\nS'il existe une destination admissible dans ce rayon, même pleine ou en attente de train, ils ne cherchent pas plus loin. Ils patientent localement et se déplacent vers les destinations à moins de 96 cases (3 chunks).\nPlacez les quais près de l'origine des visiteurs. Un bureau plein à proximité peut les retenir loin d'un quai distant. Ils cherchent plus loin seulement sans destination locale.
administratorio-desk-signals=Câblez un [entity=admin-station] pour lire ses signaux de plaintes, les places libres [virtual-signal=signal-available-slots] et les visiteurs présents [virtual-signal=signal-total-waiting]. Les réservations réduisent déjà les places libres.\nUtilisez Places libres = 0 pour une alerte de capacité ; un signal de plainte > 0 peut activer la ligne de résolution correspondante. Ces signaux décrivent les dossiers, pas l'inventaire.\nSurvolez un visiteur pour son cas individuel. La vue d'ensemble des bureaux montre la charge globale.
administratorio-frustration=La frustration augmente pendant la recherche d'une place et l'attente des résolutions. Le trajet vers une place réservée suspend ce délai. En mode normal, 100 % déclenche une manifestation qui désactive un bâtiment.\nLancez une [item=promise] sur le manifestant. Avec un bureau libre, il revient à 50 % ; sinon il dispose de 60 secondes pour trouver une place avant de manifester à nouveau.\nLa promesse conserve le dossier inachevé. Terminez les plaintes restantes et gardez les trajets libres.
administratorio-hush-money=Lancez un [item=hush-money] sur les nids pour suspendre les apparitions pendant 3 minutes. Les visiteurs déjà présents doivent toujours être servis.\nProfitez de la pause pour résorber la file ou réparer une ligne de résolution. Les nids reprennent ensuite leur activité.
administratorio-nest-expropriation=Lancez un [item=eviction-notice] près d'un nid pour le supprimer définitivement. Les citoyens voisins rejoignent le système de plaintes avec une frustration élevée.\nPréparez des places avant l'expulsion. Conservez des nids si vous avez encore besoin de revenus, de recrues ou d'ouvriers pour les Bureaux de terrain.
administratorio-biter-employment=Insérez une [item=job-offer] dans le bureau avant la dernière résolution d'un visiteur. Un recrutement réussi remplace son paiement.\nSans Space Age, biters et spitters acceptent toujours : petit/moyen/grand/béhémoth donnent 1/2/3/5 [item=worker-biter].\nLes ouvriers sont réutilisés pour les missions. Les spécialistes figurant dans les recettes de bâtiments sont consommés à la fabrication.
administratorio-space-age-enrollment=Insérez une [item=job-offer] dans un bureau sur Nauvis avant la dernière résolution. Seuls les biters s'inscrivent, jamais les spitters. L'offre est dépensée lors de la tentative.\nChances selon la frustration : ≤50 % : 75 % ; >50–75 % : 50 % ; >75–90 % : 25 % ; >90 % : 0 %.\nUne réussite donne un [item=enrolled-biter] au lieu d'argent. Formez-le au [entity=formation-center] pour obtenir un [item=worker-biter] réutilisable. La formation ordinaire se fait sur Nauvis ; les briefings de cadres peuvent se faire ailleurs.
administratorio-biter-station=Chargez un [entity=biter-station] avec des [item=worker-biter] et de l'[item=taxpayer-money]. Gardez un passage vers les machines à moins de 30 cases de son centre.\nChaque visite autorise une fabrication. L'ouvrier revient et sert à nouveau ; chaque tournée coûte 1 argent. Efficacité du travail permet de visiter 3, puis 5 machines par tournée.\nLa station la plus proche dessert chaque machine, même sans ouvriers ni argent. Superposer les zones ne multiplie pas ses visites. Survolez la station pour voir sa couverture et son état.
administratorio-worker-machines=Les visites font fonctionner [entity=oil-refinery], [entity=centrifuge], [entity=propaganda-distillery], [entity=corporate-breakroom] et [entity=printer-t2] sur une planète.\nLes autres assembleuses n'en ont pas besoin. Le Siège syndical utilise les ingrédients de ses recettes. Une imprimante orbitale sur plateforme spatiale possède une autorisation permanente.\nLa machine doit avoir une recette et un accès libre. Si elle attend, vérifiez la station la plus proche, ses ouvriers, leur salaire et le café nocturne.
administratorio-biterport=Chargez un [entity=biterport] avec des [item=biter-logistics-formation] et de l'[item=taxpayer-money]. Chaque tournée coûte 1 argent.\nLes ouvriers marchent vers les coffres logistiques, joueurs, fantômes de construction et tâches de déconstruction. Gardez les passages libres : ils ne volent pas au-dessus des obstacles.\nEn qualité normale, la couverture est carrée : 25 cases sur chaque axe pour la logistique, 55 pour la construction. Les ports se relient si leurs centres sont séparés d'au plus 50 cases sur chaque axe, diagonales comprises. Survolez un port pour inspecter son réseau.
administratorio-biterport-cargo=Gardez les stocks fournisseurs, les places de demande et le stockage dans le même réseau de Biterports. Les ouvriers préservent la qualité. Les recherches de capacité et de vitesse sont distinctes.\nLes objets au sol vont d'abord à un coffre demandeur intéressé, puis au stockage. Sans destination adaptée, un ouvrier conserve sa cargaison et signale le problème ; les autres continuent.\nLibérez de la place ou ajoutez du stockage dans ce réseau. L'ouvrier réessaie toutes les 5 secondes. Ajouter des ouvriers ne crée pas de destination.
administratorio-orphaned-workers=Un ouvrier privé de foyer, de place dans son inventaire ou de chemin de retour émet une alerte et accumule de la frustration.\nReconstruisez un [entity=biter-station] ou [entity=biterport] compatible, libérez une place d'ouvrier ou dégagez le passage. Les trajets bloqués sont retentés toutes les 10 secondes.\nRejoindre un foyer adapté efface l'alerte et la frustration. Sinon, l'ouvrier finit par manifester.
administratorio-rideable-biter=Déployez un [item=rideable-biter] et alimentez-le en [item=taxpayer-money]. Sans cavalier, il peut se promener.\nUne monture déployée ne peut être minée ni déconstruite. Après 10 minutes avec un emplacement de carburant vide, elle redevient un biter moyen sauvage et rejoint les plaignants. Gardez de l'argent dans son emplacement de carburant pour la conserver.
administratorio-hired-biter=Déployez un [item=hired-biter-capsule] et fournissez des [item=eviction-notice]. Un agent porte jusqu'à 20 avis et cherche les nids dans un rayon de 60 cases. Chaque expulsion dépense un avis.\nLes agents approvisionnés patrouillent et expulsent automatiquement. Ils se ravitaillent dans un réseau logistique de roboports ou aux étapes de ravitaillement désignées.\nLes expulsions envoient toujours des citoyens vers vos bureaux. Limitez les patrouilles aux zones que vous voulez libérer.
administratorio-field-agent-controls=Tenez [item=hired-biter-command-capsule].\n• Clic gauche : sélectionner ou désélectionner les agents au curseur.\n• Clic droit au sol : remplacer leur trajet par une destination.\n• Maj + clic droit au sol : ajouter une destination.\n• Maj + clic droit sur un coffre : ajouter une étape de ravitaillement.\n• Maj + clic gauche sur un coffre : charger immédiatement les avis dans les agents sélectionnés.
administratorio-working-hours=Avec les Horaires de travail activés, [entity=office-desk] et [entity=union-headquarters] ferment la nuit sauf si un [item=overtime-exemption] occupe un emplacement de module. Il est permanent ; les copies supplémentaires n'apportent rien.\n[entity=biter-station] et [entity=biterport] consomment plutôt 5 [fluid=liquid-coffee] par départ nocturne. Raccordez le café sur un côté. Leurs ouvriers autorisent les machines gérées, dont la Salle de pause.\nLes Bureaux de terrain restent ouverts. L'autorisation nocturne n'annule pas les manifestations. Désactivez les Horaires de travail au démarrage pour supprimer ces fermetures.
administratorio-administrative-clock=Câblez [entity=administrative-clock] pour lire [virtual-signal=signal-working-hours] : 1 pendant les heures ouvrées, absent la nuit. Activez un approvisionnement quand ce signal > 0 pour travailler le jour.\n[virtual-signal=signal-daytime] va de 0 à 100, avec minuit à 0/100. [virtual-signal=signal-day-shift-start] et [virtual-signal=signal-day-shift-end] indiquent les limites de la journée de travail.\nL'horloge indique l'horaire ; elle n'accorde aucune dérogation et ne fournit pas de café.
administratorio-pneumatic-transport=Reliez [entity=tube-intake] et [entity=tube-outtake] par des tubes pneumatiques. Un bras insère les documents acceptés dans l'entrée.\nFiltrez l'emplacement d'inventaire de la sortie pour choisir l'objet ; retirez-le avec un bras. Sans filtre, elle prend l'objet le plus abondant. Elle attend que son emplacement soit vide pour en demander un autre.\nLes extrémités connectées partagent instantanément une réserve d'objets variés. Les tuyaux ordinaires ne s'y raccordent pas. Survolez une extrémité pour voir le contenu, la capacité et la connexion.
administratorio-tube-limits=Un réseau commence avec 10 objets de capacité totale, partagée par tous les documents. La recherche agrandit cette réserve. Une réserve pleine bloque les entrées jusqu'à libération d'une place.\nChaque tube connecté doit rester à moins de 120 cases de chaque extrémité ou raccord de pompe du réseau, en ligne droite. Dépasser cette limite arrête tout le réseau.\nCoupez les longues lignes avec [entity=tube-pump]. Chaque côté possède alors sa propre limite de portée et sa réserve.
administratorio-tube-circuits=Les entrées et sorties émettent les quantités de la réserve sur les deux couleurs de câble.\nPour une entrée alimentée en [item=form-27b-6], réglez la condition d'activation sur Formulaire 27B-6 < 5. Elle cesse d'en ajouter quand cinq sont en réserve.\nLisez une seule extrémité par réseau logique : plusieurs additionnent la même mesure. Évitez la lecture d'inventaire sur ce câble pour ne mesurer que la réserve. Le filtre d'emplacement de sortie choisit l'objet reçu ; les signaux ne le demandent pas.
administratorio-tube-pump=Alimentez [entity=tube-pump] en électricité et raccordez deux réseaux distincts à l'arrière et à l'avant. Les documents passent de l'arrière vers l'avant tant qu'il reste de la place.\nSes filtres d'autorisation ou d'exclusion sélectionnent les documents. Sans filtres, tous les documents acceptés peuvent passer.\nNe reliez pas les deux côtés par un tube de contournement : il fusionnerait les réserves et annulerait la séparation de portée. La pompe ne transfère rien si l'un des réseaux dépasse sa portée.
administratorio-passenger-rail-service=[item=passenger-wagon] transporte 24 visiteurs dont les plaintes restent à résoudre. Il ne transporte ni objets de personnel ni marchandises.\nPlacez les quais près du wagon à l'arrêt : rail à 2,75 cases maximum du centre du quai, centre du wagon à 4 cases maximum. Chaque quai ne dessert que son wagon voyageurs le plus proche. Laissez le centre du quai d'embarquement accessible.\nPour un service programmé, placez un seul arrêt à moins de 24 cases pour l'association automatique. À destination, prévoyez [entity=deboarding-platform] et des bureaux accessibles.
administratorio-passenger-boarding=Un [entity=boarding-platform] réserve jusqu'à 24 visiteurs. Normalement, il accepte de nouvelles réservations seulement avec un wagon adjacent immobile et une place libre.\nPour former la file avant l'arrivée du train, envoyez [virtual-signal=signal-boarding-enabled] Embarquement activé > 0 sur l'une des couleurs. Sans signal, un quai en attente retient quand même les recherches dans le voisinage.\nLes visiteurs embarquent au centre du quai, à 0,85 case maximum. Une file pleine continue d'embarquer. Retirer le signal ne ferme pas l'embarquement si un wagon adapté est présent.
administratorio-passenger-unboarding=Un wagon immobile décharge via son [entity=deboarding-platform] adjacent. Laissez de la place autour pour l'apparition des passagers.\nEnvoyez [virtual-signal=signal-deboarding-closed] Débarquement fermé > 0 sur l'une des couleurs pour les garder à bord ; effacez le signal pour décharger.\nLes visiteurs reprennent leur recherche, ignorent les arrêts déjà visités et font au plus 3 trajets ferroviaires avant de chercher uniquement des bureaux. La frustration monte en file et en voyage. Au seuil de crise, les passagers concernés sortent pour manifester. Gardez les trajets courts.
administratorio-passenger-signals=Les quais décrivent leur wagon adjacent ; les arrêts associés décrivent tout le train arrêté.\n• [virtual-signal=signal-train-passengers] Passagers du train : places occupées.\n• [virtual-signal=signal-train-free-seats] Places libres du train : sièges disponibles.\n• [virtual-signal=signal-boarders-waiting] Voyageurs en attente : file réservée.\n• [virtual-signal=signal-passenger-outbreak] Crise des passagers : crise active.\n• [virtual-signal=signal-passenger-highest-frustration] Frustration maximale : 0–100.\nUtilisez les valeurs de l'arrêt pour les conditions horaires, par exemple Passagers du train = 0 après déchargement. Ne reliez pas les sorties des quais au même câble : elles dupliqueraient les comptes.
administratorio-transit-authorization=Mettez des [item=transit-authorization] dans le coffre de permis de chaque [entity=train-stop] ordinaire. Un permis est consommé lorsqu'un train arrive et attend.\nLa limite de trains égale le nombre de permis ; zéro ferme l'arrêt. Les limites manuelles et les commandes logiques d'activation ou de limite sont remplacées.\nContrôlez les arrivées en régulant le stock de permis. Les trains de voyageurs en ont aussi besoin aux arrêts ordinaires.
administratorio-public-train-stop=[entity=public-train-stop] ne demande aucun permis et ne crée pas de coffre. Utilisez-le pour régler normalement les limites de trains, manuellement ou par circuit.\nRemplacez l'arrêt ordinaire en conservant le nom utilisé dans les horaires. Les quais de voyageurs peuvent également s'y associer.
administratorio-personnel-routing=Alignez [entity=personnel-deployment-office], panneaux et [entity=personnel-reception-office] sur la grille 2×2. Orientez le départ vers le prochain panneau ou la réception ; mettez un panneau à chaque virage. Les liaisons droites dégagées se pavent automatiquement.\nInsérez du personnel formé ou des touristes au départ ; récupérez les mêmes objets à l'arrivée. Agents de terrain et montures utilisent leur propre déploiement.\nSeule la prochaine étape doit être reliée pour démarrer. Aucun courant ni salaire requis. Ces parcours ne dirigent ni plaignants ni ouvriers en mission.
administratorio-personnel-traffic=Une liaison manquante, une voie occupée, un filtre incompatible ou une réception pleine retient la file. Le premier biter bloque les suivants. Réparez le parcours ou videz la réception.\nTournez les panneaux pendant le trafic : un biter déjà engagé garde son virage ; le suivant utilise la nouvelle flèche. La réception accepte les quatre directions.\nL'infrastructure occupée ne peut être minée. Arrêtez le chargement, terminez le parcours et videz-le avant de reconstruire. Convoyeurs, bras et poteaux peuvent partager le pavement ; les bâtiments obstructifs ne le peuvent pas.
administratorio-personnel-multisign=Ouvrez [entity=personnel-routing-multisign] ou une prise en laiton. Gauche, tout droit et droite dépendent de la flèche principale. Chaque sortie possède son mode Manuel/Circuit.\nLe mode Manuel accepte 5 types de personnel ; un clic droit efface un filtre. Une liste vide ferme la sortie. Toutes les qualités correspondent.\nEn cas de correspondances multiples : gauche, puis tout droit, puis droite. Une sortie prioritaire bloquée retient la file sans détour. Les changements affectent les personnes en attente, jamais celles déjà engagées.
administratorio-personnel-circuits=Pour une sortie de carrefour en mode Circuit, câblez sa prise en laiton. Un signal d'objet personnel positif autorise ce type. Rouge + vert et toutes les qualités s'additionnent ; zéro ou moins le ferme.\nExemple : Ouvrier biter = 1 sur la prise gauche envoie les ouvriers à gauche. Séparez les réseaux de sorties. Recâblez les prises après placement d'un plan.
administratorio-personnel-spoilage=Les briefings et courriers d'œufs se périment deux fois moins vite en marche ou en file sur un parcours balisé. Le délai ralentit, sans être réinitialisé.\nÀ expiration, le voyageur redevient [item=middle-management-managing-manager] ordinaire et conserve sa qualité. Les prochains carrefours exigent alors le filtre de cadre ordinaire ; un virage déjà réservé reste inchangé.\nPrévoyez leur retour pour éviter qu'ils bloquent la file. Les cadres briefés affichent leur temps restant au-dessus du biter.
administratorio-management-briefings=Briefez les cadres au [entity=formation-center] près de leur mission. Les briefings durent 30/25/20/15/10 minutes pour Formation/Effectifs/Conformité/Liaison/Opérations orbitales.\nÀ expiration, le [item=middle-management-managing-manager] ordinaire revient. Formation et construction avec personnel rendent aussi les cadres non briefés. Récupérez-les et réutilisez-les.\nLes briefings se font sur toute planète sans argent du contribuable. Évitez les stocks de cadres briefés destinés à de longs voyages.
administratorio-specialist-approval=[entity=foundry], [entity=biochamber], [entity=electromagnetic-plant] et [entity=cryogenic-plant] sont d'abord des châssis non approuvés. Approuvez-les avec leur licence au [entity=corporate-breakroom] ou [entity=union-headquarters].\nL'approbation en Salle de pause ne demande aucune visite d'ouvrier. Un châssis de qualité supérieure exige des documents de même qualité.\nMinage et déconstruction rendent le châssis non approuvé : approuvez-le de nouveau avant placement. La destruction ne rend rien. Le spécialiste est consommé lors de la fabrication du châssis, pas au placement.
administratorio-unstaffed-operations=Installez un [item=unstaffed-operations-waiver] dans un emplacement de module d'une machine gérée par station. Elle fonctionne sans visites ni salaires de mission, même la nuit.\nLa dérogation est permanente et occupe un emplacement. La retirer rétablit immédiatement le besoin d'ouvriers. Plusieurs copies n'apportent rien. Elle ne supprime ni ingrédients de recette ni manifestations.
administratorio-quality=La portée des Bureaux de terrain et la couverture des Biterports gagnent 10 % par niveau : inhabituel +10 %, rare +20 %, épique +30 %, légendaire +50 %. Les liens entre Biterports restent limités à 50 cases sur chaque axe ; les Stations biter restent à 30 cases.\nLa qualité n'augmente ni capacité ni portée des tubes. Tubes et parcours préservent la qualité transportée.\nLes demandes de Terminus et de relocalisation doivent préciser la qualité. Les filtres des carrefours réunissent toutes les qualités d'un type de personnel.
administratorio-trajectory-compliance-arrays=Chargez un Réseau de conformité des trajectoires en ordres de déviation. Il repousse les astéroïdes sans produire de fragments. Les ordres prioritaires doublent la poussée.\nJunior : petits/moyens à 24 cases ; Senior : ajoute les grands à 36 cases ; Exécutif : ajoute les énormes à 48 cases.\nLes rochers lourds demandent plusieurs poussées superposées. Plusieurs réseaux cumulent leurs effets. Ils évitent les astéroïdes ayant des mineurs fixés ou en approche : choisissez entre déviation et exploitation.
administratorio-orbital-employment-catapult=Chargez [entity=orbital-employment-catapult] en [item=voluntary-exploration-space-miner]. La liste de cibles détermine les tailles admissibles ; priorité aux énormes, puis grands, moyens et petits.\nLes mineurs se fixent et travaillent jusqu'à rupture du rocher. Un mineur par astéroïde au départ ; la recherche augmente la limite. Ceux en approche réservent déjà leur place.\nUne cible pleine fait attendre la catapulte. Un rocher occupé ne peut être dévié : laissez assez de temps avant l'impact.
administratorio-orbital-miner-recovery=Quand un astéroïde occupé se brise, les fragments d'employés sortent avant les fragments ordinaires. Les collecteurs les récupèrent directement en [item=voluntary-exploration-space-miner] réutilisables.\nRenvoyez ces mineurs à la catapulte. Couvrez leur zone de dérive : un fragment d'employé qui échappe aux collecteurs est un mineur perdu. Augmenter la capacité impose aussi de récupérer davantage d'employés.
administratorio-territorial-arbitration=Placez [entity=territorial-arbitration-post] à cheval sur le territoire visé. Alimentez-le continuellement en ordres de réinstallation et en mensonges.\nLes cycles réussis réduisent ce territoire ; plusieurs postes additionnent leurs progrès. Si le traitement cesse, le territoire repousse tant que l'arbitrage n'est pas achevé.\nL'achèvement supprime le démolisseur et fournit [item=territorial-deed]. Consultez l'état du poste pour la progression et les manques. Terminez le territoire avant de déplacer vos postes.
administratorio-capture-bureau=Placez [entity=capture-bureau] à plus de 32 cases des nids et à moins de 48 cases des créatures visées. Libérez sa sortie et fournissez un seul type de leurre.\n• Nauvis + leurre de main-d'œuvre : biters en ouvriers.\n• Nauvis + leurre touristique : spitters en touristes.\n• Gleba + leurre de ponte : pentapodes en œufs.\nLes modes de Nauvis consomment 1 leurre/seconde même en attente. Les œufs coûtent 5/8/12 leurres par petit/moyen/grand pentapode, sans dépense à vide. Mélanger les leurres peut sélectionner le mauvais mode.
administratorio-pentapod-bargaining=Sur Gleba, lancez [item=pentapod-sampling-capsule] directement sur un pentapode sauvage. Il survit et donne 1/2/4 œufs frais selon sa taille. Attendez 30 secondes pour le prélever à nouveau ; une tentative anticipée rend la capsule.\nLe Bureau de capture automatise la récolte sauvage ; la recherche de culture des œufs permet ensuite l'élevage. Les nids de Gleba ne produisent que de petits pentapodes ; l'évolution augmente leur fréquence.\nLes œufs se périment en pentapodes hostiles. Rapprochez production et consommation.
administratorio-space-tourism=Capturez des spitters sur Nauvis avec le leurre touristique. Envoyez le touriste à [entity=administrative-space-station] pour son séjour orbital, puis ramenez-le à un [entity=office-desk] sur Nauvis pour clôturer le séjour.\nLes touristes non satisfaits expirent après 5 minutes en spitters furieux. Lancez-les rapidement.\nLa clôture paie l'argent du contribuable et libère paisiblement le visiteur. Capture et séjour orbital seuls ne paient rien : il faut terminer le retour.
administratorio-offworld-economy=Avec Space Age, les plaintes résolues ne rapportent de l'[item=taxpayer-money] que sur Nauvis. Ailleurs, elles clôturent tout de même le dossier.\nImportez de l'argent pour les salaires et recettes hors Nauvis. Le tourisme paie également uniquement à la clôture sur Nauvis.\nGardez des cadres réutilisables sur place : leurs briefings ne coûtent pas d'argent et peuvent être renouvelés localement.
administratorio-archive-recombination=Insérez un formulaire accepté dans [entity=archive-recombination-bureau] ; la réaffectation se choisit automatiquement.\nTrois formulaires alternatifs ont chacun 25 % de chance de sortir : un cycle peut produire 0 à 3 objets. Ils restent du même rang, sans nouvelle couleur ni reproduction du formulaire d'entrée.\nFournissez les surplus et triez la sortie. C'est un pari, pas une source garantie pour une ligne indispensable.
administratorio-ai-cooling=Reliez [entity=ai-server] à des conduites thermiques et à un dissipateur comme [entity=heat-exhaust]. En fonctionnement, il produit 4 MW de chaleur et s'arrête à 950 °C. Il repart seulement après refroidissement sous ce seuil.\nEnvoyez ses [fluid=inference-token] par [entity=optical-fibre] vers [entity=slop-refinery]. Ni tuyaux ordinaires ni tubes pneumatiques ne les transportent.\nÉvacuez les citations fabriquées pour éviter de bloquer la raffinerie. Ce système produit des documents sans couleur autorisés ; il ne remplace pas la production de formulaires colorés.
administratorio-interplanetary-terminus=Construisez [entity=interplanetary-terminus] sur chaque planète participante. Un seul est autorisé au départ ; la recherche de Terminus supplémentaires augmente cette limite.\nChargez les documents acceptés à l'entrée. Après transit, ils rejoignent la réserve partagée de votre force sans demande préalable du destinataire.\nLes arrivées restent dans la sortie du Terminus : retirez-les. Les réseaux pneumatiques locaux restent séparés. Le réseau initial accepte les documents noirs ; la recherche chromatique ajoute les documents colorés compatibles.
administratorio-terminus-circuits=Au Terminus, le câble vert demande et le rouge affiche la réserve partagée. Envoyez un signal d'objet positif sur le vert pour recevoir continuellement ce formulaire, de qualité correspondante.\nC'est une demande continue, pas un objectif de stock. Coupez-la quand votre réserve locale est pleine.\nToute extrémité peut reprendre les formulaires, même la planète exportatrice. Aucune réservation par destination n'est possible. Lisez un seul Terminus par réseau rouge pour éviter les comptes doublés.
administratorio-interplanetary-trunk=Capacité initiale : 3 objets, 30 secondes de transit chacun. La recherche augmente la capacité et réduit le délai.\nLes objets en transit et ceux non réclamés dans la réserve partagée occupent tous la capacité. Un formulaire jamais demandé peut donc bloquer les exports suivants indéfiniment.\nLisez la réserve sur le câble rouge, réclamez les documents bloqués et videz les sorties. Ajouter des Terminus ne crée ni réserves distinctes ni capacité commune supplémentaire.
administratorio-relocation-cannon=Chargez le personnel dans [entity=involuntary-relocation-cannon]. Sur une autre planète, mettez des [item=involuntary-transfer-order] dans [entity=involuntary-relocation-receiver] et demandez le personnel par signal d'objet vert.\nLe récepteur choisit la cargaison ; aucune destination à régler au canon. Chaque arrivée coûte un ordre. Le rouge indique l'inventaire propre du bâtiment.\nUne demande positive se répète : retirez-la une fois approvisionné. Fournissez assez d'ordres pour le lot demandé et extrayez les arrivées. Œufs et plateformes spatiales sont exclus.
administratorio-egg-couriers=Les œufs de biters restent sur Nauvis. Formez-y le courrier adapté aux travaux hors planète : [item=missionary-manager], [item=voluntary-research-subject] ou [item=geotechnical-assessment-manager].\nChacun redevient un cadre ordinaire après 30 minutes. Un courrier dans l'entrée d'une machine continue de vieillir.\nPréparez les autres ingrédients avant sa livraison, surtout pour la science Administratorium. Les parcours balisés ralentissent la péremption en marche et en file, sans renouveler le courrier.
administratorio-hard-mode=Activez HARD MODE dans les paramètres de carte pour permettre l'escalade des manifestations. Les visiteurs manifestent à 70 % de leur capacité de frustration, puis attaquent les bâtiments à 100 %.\nUne [item=promise] interrompt un attaquant et le renvoie vers le service. Prévoyez un bureau libre accessible et les résolutions : la promesse seule ne termine pas le dossier.\nCe réglage peut changer en cours de partie. Sans lui, la règle ordinaire reste : manifestation à 100 %.
administratorio-personnel-counts=Un panneau simple émet les quantités de personnel qui l'approche sur ses segments entrants immédiats, files et qualités comprises. Il ne compte pas tout le parcours.\nUtilisez ces quantités pour surveiller une file ou piloter le bras qui charge le départ. Les bureaux eux-mêmes n'ont pas de commandes logiques.
administratorio-evolution-approvals=L'évolution des biters et cracheurs est plafonnée jusqu'à la prochaine recherche d'autorisation des plaintes. Les tailles supérieures restent aussi bloquées sans leur autorisation.\nPréparez les nouvelles chaînes de résolution avant d'autoriser la taille suivante. Relever le plafond permet à l'évolution de reprendre ; cela ne l'augmente pas instantanément et ne libère aucun retard accumulé.\nCes limites ne concernent pas les pentapodes de Gleba.
