route-specialist=__1__ — Production spécialisée
route-handcraft-specialist=__1__ — Fabrication manuelle / spécialisée
route-regulated=__1__ — Assemblage réglementé
paired-unlocks=Débloque les deux voies des recettes jumelées : la voie d'origine et l'assemblage réglementé. Ouvrez le produit dans Factoriopedia pour comparer ingrédients, lots et machines.
acquire-enrolled=Sur Nauvis, placez 1 [item=job-offer] dans l'emplacement du citoyen à la [entity=admin-station] avant sa résolution finale. Seuls les biters peuvent s'inscrire. L'offre est consommée à chaque tentative ; un succès remplace le paiement par 1 [item=enrolled-biter]. Acceptation selon la frustration : jusqu'à 50% → 75% ; plus de 50% à 75% → 50% ; plus de 75% à 90% → 25% ; au-delà de 90% → 0%. Formez la recrue au [entity=formation-center].
acquire-worker-base=Placez 1 [item=job-offer] dans l'emplacement du citoyen à la [entity=admin-station] avant sa résolution finale. Le biter ou spitter accepte et remplace le paiement par des [item=worker-biter] : petit 1, moyen 2, gros 3, béhémoth 5.
acquire-worker-space=Formation sur Nauvis : utilisez __1__ au [entity=formation-center] avec [item=enrolled-biter] et [item=provisional-approval].\nCapture directe : un [entity=capture-bureau] alimenté en [fluid=workforce-lure-spores] convertit chaque biter arrivé en 1 [item=worker-biter], quelle que soit sa taille. Il attire la faune dans un rayon de 48 cases et consomme 1 unité de leurre par seconde. La sortie doit avoir de la place.
acquire-workforce=Alimentez un [entity=capture-bureau] en [fluid=workforce-lure-spores] pour attirer les biters dans un rayon de 48 cases. Chaque arrivée produit 1 [item=worker-biter], quelle que soit la taille. Consommation : 1 unité de leurre par seconde, même en attente. Gardez de la place en sortie. Le fluide-leurre sélectionne le mode ; évitez les autres leurres dans le circuit commun.
acquire-tourism=Alimentez un [entity=capture-bureau] en [fluid=tourism-lure-spores] pour attirer les spitters dans un rayon de 48 cases. Chaque arrivée produit un forfait adapté : [item=small-spitter-tourism-package] [item=medium-spitter-tourism-package] [item=big-spitter-tourism-package] [item=behemoth-spitter-tourism-package]. Consommation : 1 unité de leurre par seconde, même en attente. Gardez de la place en sortie. Lancez les forfaits avant leur péremption, puis traitez-les à la [entity=administrative-space-station]. Le fluide-leurre sélectionne le mode.
acquire-tourism-package=Capturez __1__ au [entity=capture-bureau] alimenté en [fluid=tourism-lure-spores]. Chaque spitter fournit un forfait adapté à sa taille. Rayon : 48 cases ; consommation : 1 unité de leurre par seconde ; place en sortie requise. Après __2__ minutes, le forfait éclot en spitter hostile. Lancez-le et traitez-le à la [entity=administrative-space-station] avant ce délai.
acquire-eggs-sampling=Premiers œufs sur Gleba : lancez [item=pentapod-sampling-capsule] directement sur un pentapode sauvage. Petit / moyen / gros fournit 1 / 2 / 4 [item=pentapod-egg]. La créature survit ; son délai entre prélèvements est de 30 secondes. Une tentative prématurée restitue la capsule.
acquire-eggs-capture=Récolte sauvage : alimentez un [entity=capture-bureau] en [fluid=oviposition-lure-spores] pour attirer les pentapodes dans un rayon de 48 cases. Petit / moyen / gros fournit 1 / 2 / 4 [item=pentapod-egg] et consomme 5 / 8 / 12 unités de leurre par capture. Aucune consommation au repos. Il faut assez de leurre et de place en sortie. Le fluide-leurre sélectionne le mode.
acquire-eggs-breeding=Élevage renouvelable : recherchez [technology=pentapod-egg-cultivation], puis utilisez [recipe=pentapod-egg] dans une [entity=biochamber]. Le prélèvement et la capture fournissent les premiers œufs. Les œufs se périment et peuvent éclore en pentapodes hostiles.
