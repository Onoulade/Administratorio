cross-planet-cyan=Origine : Vulcanus. Juridiction cyan/tungstène. Fusée jusqu'au tronc chromatique d'Aquilo.
cross-planet-yellow=Origine : Gleba. Juridiction jaune/biologique. Se gâte ; fusée jusqu'au tronc chromatique d'Aquilo.
cross-planet-magenta=Origine : Fulgora. Juridiction magenta/holmium. Fusée jusqu'au tronc chromatique d'Aquilo.
cross-planet-cyan-yellow=Juridictions : Vulcanus + Gleba. Exigence explicite à deux planètes. Charge chromatique uniquement.
cross-planet-cyan-magenta=Juridictions : Vulcanus + Fulgora. Exigence explicite à deux planètes. Charge chromatique uniquement.
cross-planet-yellow-magenta=Juridictions : Gleba + Fulgora. Exigence explicite à deux planètes. Charge chromatique uniquement.
cross-planet-vulcanus-charter=Origine : Vulcanus. Autorise explicitement le procédé métallurgique indiqué hors Vulcanus.
cross-planet-aquilo=Origine : Aquilo. Requis pour la cryogénie ; exige le tronc chromatique.
cross-planet-trichromatic=Origine : Aquilo. Convergence explicite Vulcanus + Gleba + Fulgora.
cross-planet-unified=Origine : Aquilo. Dépendance explicite à quatre mondes.
