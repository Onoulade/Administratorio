cross-planet-aquilo=Origine : Aquilo. Requis pour la cryogénie ; exige le tronc chromatique.
cross-planet-trichromatic=Origine : Aquilo. Convergence explicite Vulcanus + Gleba + Fulgora.
cross-planet-unified=Origine : Aquilo. Dépendance explicite à quatre mondes.
