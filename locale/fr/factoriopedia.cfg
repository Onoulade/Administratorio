cross-planet-magenta=Origine : Fulgora. Juridiction magenta/holmium. Fusée jusqu'au tronc chromatique d'Aquilo.
cross-planet-cyan-yellow=Juridictions : Vulcanus + Gleba. Exigence explicite à deux planètes. Charge chromatique uniquement.
cross-planet-cyan-magenta=Juridictions : Vulcanus + Fulgora. Exigence explicite à deux planètes. Charge chromatique uniquement.
cross-planet-yellow-magenta=Juridictions : Gleba + Fulgora. Exigence explicite à deux planètes. Charge chromatique uniquement.
