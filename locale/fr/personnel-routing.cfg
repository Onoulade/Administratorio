[entity-description]
personnel-deployment-office=Insérez du personnel formé. Les agents de terrain et les montures sont exclus. Envoie vers le prochain panneau accessible ou bureau de réception ; aucun itinéraire complet jusqu'à la réception n'est requis. Le personnel attend en file si la connexion suivante est invalide. Tournez pour choisir le départ. Sans électricité ni salaire. Grille commune de 2×2 cases, comme les rails.
personnel-reception-office=Accepte les voies des quatre côtés et ne peut pas être tourné. Rend aux arrivants leur objet d'origine dans l'inventaire de sortie, accessible aux bras mécaniques. Une sortie pleine retient la file en toute sécurité. S'aligne automatiquement sur la grille commune de 2×2 cases, comme les rails.
personnel-routing-sign=Oriente le personnel selon sa flèche et pave la voie dégagée. Reliez ce panneau au réseau logique pour lire le nombre de chaque type de personnel en approche sur TOUS les segments entrants immédiats, files comprises ; les qualités sont additionnées. Tournez à tout moment. Un biter entrant garde son virage mémorisé. Sans continuation valide, la file reste bloquée jusqu’à réparation. Grille commune de 2×2 cases. Un seul biter entre à la fois ; un panneau occupé ne peut être retiré.
personnel-path=Béton classique teinté bleu-vert marquant automatiquement une voie protégée. Apparaît entre panneaux et bureaux reliés ; aucun objet de pavement à fabriquer ni à poser. Autorise tapis, bras mécaniques et poteaux électriques. Se met à jour après le retrait ou la rotation des bâtiments au repos.
personnel-recovery-crate=Personnel récupéré après l'interruption d'un itinéraire. Ouvrez cette caisse ou utilisez un bras mécanique pour reprendre les objets d'origine. Protégée des dégâts de combat.
personnel-in-transit=Personnel en transit. Avance sans arrêt à 50 % de la vitesse classique d’un petit déchiqueteur ; recherche bleue : 100 %, violette : 150 % sur une voie protégée. Son corps de 2×2 cases ne chevauche aucun autre ; les centres sont espacés de 2,5 cases dans la file. Attend à une connexion invalide ou une réception pleine, puis reprend dès que la voie est libre. L'objet d'origine reste conservé. Les managers briefés affichent un insigne et une barre de temps ; les briefings expirent normalement en trajet ou en file. La couleur indique le rôle au départ.
personnel-routing-multisign=Trois sorties par rapport à la flèche : gauche, tout droit et droite. Ouvrez le panneau ou une prise en laiton pour choisir jusqu’à cinq filtres de personnel par sortie, ou des signaux logiques en temps réel pour chaque sortie. Les filtres manuels acceptent toutes les qualités ; sans filtre, la sortie est fermée. En mode Circuit, les signaux positifs d’objets de personnel autorisent ces types ; les valeurs rouges, vertes et toutes les qualités sont additionnées. Une voie absente ou un type non autorisé retient les biters entièrement hors de la jonction. Priorité : gauche, tout droit, droite, sans repli. Tournez le panneau ou une prise, même si la file est bloquée. Les biters engagés gardent leur sortie réservée. Grille commune de 2×2 cases. Un seul biter entre à la fois ; un panneau occupé ne peut être retiré.
personnel-routing-filter-port=Entrée logique rouge/verte indépendante pour cette sortie du panneau multiple. Ouvrez pour configurer le panneau entier. En mode Circuit, les signaux positifs d’objets de personnel autorisent ces types ; sans signal positif, la sortie est fermée. Le mode Manuel utilise les cinq filtres conservés et ignore cette entrée. Tournez la prise pour tourner le panneau entier. Les câbles restent attachés ; la prise ne peut être retirée séparément.
