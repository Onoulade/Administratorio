[entity-description]
personnel-deployment-office=Insérez du personnel formé. Les agents de terrain et les montures sont exclus. Envoie un déchiqueteur à pied sur un itinéraire balisé complet jusqu'à un bureau de réception. Tournez le bureau pour choisir le sens du départ. Sans électricité ni salaire. S'aligne automatiquement sur la grille commune de 2×2 cases, comme les rails.
personnel-reception-office=Rend aux arrivants leur objet d'origine dans l'inventaire de sortie, accessible aux bras mécaniques. Une sortie pleine retient la file en toute sécurité. S'aligne automatiquement sur la grille commune de 2×2 cases, comme les rails.
personnel-routing-sign=Oriente le personnel dans le sens de la flèche. Pave automatiquement une voie droite dégagée de deux cases de large jusqu'au prochain panneau aligné ou bureau de réception. Un itinéraire complet jusqu'à la réception est requis. Un panneau réservé ne peut être retiré ni tourné. S'aligne sur la grille commune de 2×2 cases, comme les rails.
personnel-path=Béton classique teinté bleu-vert marquant automatiquement une voie protégée. Apparaît entre panneaux et bureaux reliés ; aucun objet de pavement à fabriquer ni à poser. Autorise tapis, bras mécaniques et poteaux électriques. Se met à jour après le retrait ou la rotation des bâtiments au repos.
personnel-recovery-crate=Personnel récupéré après l'interruption d'un itinéraire. Ouvrez cette caisse ou utilisez un bras mécanique pour reprendre les objets d'origine. Protégée des dégâts de combat.
personnel-in-transit=Personnel en transit. Avance sans arrêt à la vitesse classique d'un petit déchiqueteur sur des voies réservées de 2×2 cases, avec l'animation de marche native. L'objet d'origine reste conservé jusqu'à la réception ou la récupération. Les managers briefés affichent un insigne et une barre de temps restant. Les briefings expirent normalement pendant le trajet ou l'attente ; l'affichage disparaît à l'expiration. La couleur identifie le rôle chargé au départ.
