[item-description]
personnel-deployment-office=Matérialise le personnel sur une voie balisée protégée. Acier, circuits électroniques et formulaire 27B/6 du palier vert autorisent le départ.
personnel-reception-office=Rend au personnel sa forme d’objet pour les bras mécaniques. Acier, circuits électroniques et formulaire 27B/6 du palier vert autorisent la réception.
personnel-routing-sign=Panneau directionnel avec comptage logique du personnel en approche. Tournez à tout moment ; les entrants gardent leur direction.
personnel-path=Béton classique teinté bleu-vert marquant automatiquement une voie protégée. Apparaît entre panneaux et bureaux reliés ; aucun objet de pavement à fabriquer ni à poser. Autorise tapis, bras mécaniques et poteaux électriques. Se met à jour après le retrait ou la rotation des bâtiments au repos.
personnel-routing-multisign=Panneau rotatif à trois sorties, avec jusqu’à cinq filtres manuels de personnel ou une entrée logique indépendante par sortie.
