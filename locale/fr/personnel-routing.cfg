[technology-description]
personnel-routing=La science verte et le formulaire 27B/6 autorisent voies balisées, bureaux et comptage des approches. Le personnel marche à 50 % de la vitesse classique du petit déchiqueteur. Prolongez les voies bloquées pour vider les files. Sans électricité ni salaire.
personnel-routing-speed-1=La science bleue autorise des trajets plus rapides : toutes les voies atteignent 100 % de la vitesse classique du petit déchiqueteur.
personnel-routing-speed-2=La science violette autorise des trajets accélérés : toutes les voies atteignent 150 % de la vitesse classique du petit déchiqueteur.
personnel-routing-multisign=La science bleue débloque un panneau rotatif à trois sorties. Choisissez jusqu’à cinq filtres manuels de personnel ou des signaux logiques indépendamment pour chaque sortie ; une sortie fermée ou inaccessible bloque la file.
[personnel-routing]
no-route=En attente d'un prochain panneau ou bureau accessible
empty=En attente de personnel
invalid-cargo=Personnel formé uniquement ; ni agents de terrain ni montures
queued=En attente d'un bloc de voie libre
running=Personnel déployé
received=Personnel reçu
output-full=Sortie pleine : personnel en attente sécurisée
alignment=Retirez les obstacles. Posez sur sol sec sur la grille commune de 2×2 cases, sans chevauchement. Les segments réservés ne peuvent être reconstruits ; les panneaux peuvent être tournés sans danger à tout moment.
recovered=Personnel récupéré dans cette caisse après l'interruption d'un itinéraire.
recovery-pending=Personnel récupéré en attente : libérez de la place près du départ pour une caisse de récupération.
left=Gauche
straight=Tout droit
right=Droite
filter-port=Panneau multiple : port logique __1__
manual=Manuel
circuit=Circuit
gui-directions=Les directions sont relatives à la flèche principale. Choisissez la source des filtres pour chaque sortie.
manual-help=Choisissez jusqu’à cinq types de personnel. Toutes les qualités correspondent. Sans filtre, cette sortie est fermée.
circuit-help=Lit les signaux positifs de personnel sur la prise de cette sortie. Les filtres manuels conservés sont inactifs.
filter-slot=Filtre de personnel __1__ (toutes qualités). Clic droit pour effacer.
gui-priority=En cas de doublon : gauche, tout droit, puis droite. Une voie absente bloque la file. Le personnel engagé garde sa sortie réservée.
[technology-effect]
personnel-routing-speed-1=Vitesse de marche : 50 % → 100 % de celle du petit déchiqueteur
personnel-routing-speed-2=Vitesse de marche : 100 % → 150 % de celle du petit déchiqueteur
