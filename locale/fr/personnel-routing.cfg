[item-description]
personnel-deployment-office=Matérialise le personnel formé sur une voie balisée protégée. Fabrication avec des formulaires jaune-magenta.
personnel-reception-office=Rend au personnel à pied sa forme d'objet, accessible aux bras mécaniques. Fabrication avec des formulaires jaune-magenta.
personnel-routing-sign=Panneau directionnel pour une voie protégée. Orientez la flèche avant le départ.
personnel-path=Béton classique teinté bleu-vert marquant automatiquement une voie protégée. Apparaît entre panneaux et bureaux reliés ; aucun objet de pavement à fabriquer ni à poser. Autorise tapis, bras mécaniques et poteaux électriques. Se met à jour après le retrait ou la rotation des bâtiments au repos.
[technology-name]
personnel-routing=Orientation du personnel
[technology-description]
personnel-routing=Les formulaires jaune-magenta autorisent les transferts à pied entre bureaux de déploiement et de réception. Recherche avec la science jaune et la science jaune et les sciences de Gleba et Fulgora. Accepte le personnel déchiqueteur formé, sauf les agents de terrain et les montures. File sur blocs réservés de 2×2 cases ; les voies interrompues conservent leur cargaison ou la récupèrent dans une caisse.
[personnel-routing]
no-route=Aucun itinéraire balisé complet vers la réception
empty=En attente de personnel
invalid-cargo=Personnel formé uniquement ; ni agents de terrain ni montures
