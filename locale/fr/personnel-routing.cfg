output-full=Sortie pleine : personnel en attente sécurisée
alignment=Retirez d'abord les obstacles solides. Posez sur sol sec, sur la grille commune de 2×2 cases, sans chevauchement. Les voies occupées ne peuvent être modifiées.
recovered=Personnel récupéré dans cette caisse après l'interruption d'un itinéraire.
