[achievement-description]
tube-terminus=Construisez __ENTITY__interplanetary-terminus__. La même boîte de réception, avec des frais de port.
chromatic-trunk=Recherchez __TECHNOLOGY__interplanetary-tube-chromatic__. Vous pouvez répondre à toutes les planètes, même à celles qui n’avaient rien demandé.
research-with-promethium=Recherchez une technologie avec des packs scientifiques d’Administratorium. Même la fin du jeu exige des références.
welcome-to-the-department=Construisez __ENTITY__admin-station__. Votre box vous attend. Le biter, lui, a des questions.
discovery-of-bullshit=Recherchez __TECHNOLOGY__discovery-bullshit__. Elles étaient sous vos pieds depuis le début. Plusieurs industries s’expliquent enfin.
ink-stained=Recherchez __TECHNOLOGY__printing-technology__. L’imprimante est encore bloquée. Elle décline toute compétence sur le dossier.
form-27b-6-achievement=Produisez 100 __ITEM__form-27b-6__ par heure. Vous n’avez toujours pas déposé le vôtre, évidemment.
paper-pusher=Produisez 1 000 __ITEM__blank-form__ par heure. Les arbres ne sont pas morts pour rien. Ils sont morts pour le débit.
capsule-promise=Utilisez 1 __ITEM__promise__. Les conditions générales seront communiquées après votre consentement.
its-a-copy-of-a-copy=Recherchez __TECHNOLOGY__local-precedents__. La copie est plus officielle que l’original. Voilà toute la théorie.
permit-denied=Construisez 10 __ENTITY__train-stop__. La ponctualité est désormais un privilège administratif.
coffee-break=Construisez __ENTITY__corporate-breakroom__. Enfin, l’infrastructure critique.
pneumatic-delivery=Recherchez __TECHNOLOGY__pneumatic-form-transport__. Une idée de tuyau qui a obtenu son propre budget.
propaganda-machine=Construisez __ENTITY__propaganda-distillery__. Fabriquer l’accord général, un baril et un adjectif soigneusement choisi à la fois.
endless-meetings=Recherchez __TECHNOLOGY__board-meetings__. Un courriel aurait suffi. Vous en avez fait une technologie.
union-strong=Construisez __ENTITY__union-headquarters__. Les travailleurs se sont organisés. La direction a ouvert un tableur.
environmental-compliance-achievement=Recherchez __TECHNOLOGY__environmental-compliance__. La pollution peut reprendre sous une couche réglementaire de papier.
constitutional-scholar=Recherchez __TECHNOLOGY__administratorio-behemoth-complaints__. Vous avez autorisé de plus grosses plaintes. Le comité des succès vous remercie pour le contenu.
know-it-all=Produisez 1 000 __ITEM__useless-documentation__ dans une seule partie. Mille sources, et aucune ne répond à la question.
eviction-notice-achievement=Utilisez 100 __ITEM__eviction-notice__ dans une seule partie. Rien de personnel : c’est la politique, imprimée en série.
mass-transit=Faites calculer à un train un trajet de plus de 2 000 cases. Le voyage est facultatif ; l’efficacité prévisionnelle mérite une récompense.
first-complaint=Enregistrez votre premier biter à un bureau d’administration. Ses préoccupations ont maintenant un numéro de dossier.
first-protest=Laissez la frustration d’un biter devenir une manifestation. Vous l’aviez vu venir. Le tableau de bord l’avait vu avant vous.
case-closed=Résolvez votre première plainte de biter. Une de moins, une infinité à traiter. Le tout bien indexé.
protest-suppressed=Calmez un biter manifestant avec une Promesse. Le problème a été transféré au prochain trimestre.
department-of-everything=Possédez simultanément 10 bureaux d’administration. Vous avez créé un jeu de gestion dans un jeu d’usine. Gérez maintenant la gestion.
full-resolution=Résolvez chacune des huit catégories de plaintes. Un grief pour chaque occasion, une occasion pour chaque grief.
behemoth-paperwork=Enregistrez un biter ou cracheur béhémoth à un bureau d’administration. Vous vouliez du contenu de fin de jeu. Il veut voir votre responsable.
terms-and-conditions-apply=Recherchez __TECHNOLOGY__vulcanus-certification__. Le paysage a retenu un avocat.
organically-sourced-nonsense=Recherchez __TECHNOLOGY__gleba-conciliation__. La paperasse est biodégradable, surtout sur le plan émotionnel.
file-not-found=Construisez __ENTITY__archive-recombination-bureau__. Supprimer l’original est désormais une fonctionnalité, pas un incident technique.
frozen-pdf=Recherchez __TECHNOLOGY__aquilo-cryogenic-administration__. Même sur Aquilo, les dossiers réclament un accueil chaleureux.
workforce-formation-achievement=Recherchez __TECHNOLOGY__worker-formation__. L’arbre technologique est devenu un plan de carrière. Aucun des deux ne prévoit d’entretien de départ.
administrative-space-station-achievement=Construisez __ENTITY__administrative-space-station__. La direction jugeait les frais généraux trop bas. Vous l’avez prise au mot.
orbital-employment-catapult-achievement=Construisez __ENTITY__orbital-employment-catapult__. L’annonce promettait de propulser votre carrière.
trajectory-compliance-array-achievement=Construisez __ENTITY__trajectory-compliance-array__. La gravité est priée de remplir un formulaire.
senior-trajectory-compliance-array=Construisez __ENTITY__senior-trajectory-compliance-array__. Plus gros cailloux, plus gros titres. Même réunion.
executive-trajectory-compliance-array=Construisez __ENTITY__executive-trajectory-compliance-array__. À ce niveau, les conséquences sont le travail de quelqu’un d’autre.
vesm-mass-production=Produisez 10 __ITEM__voluntary-exploration-space-miner__ par heure. Le formulaire ne comporte qu’une case : volontaire.
orbital-permit-mill=Produisez 50 __ITEM__orbital-infrastructure-permit__ par heure. L’espace est surtout vide. Le département y voit de la place pour des formulaires.
chromatic-printing-achievement=Recherchez __TECHNOLOGY__chromatic-printing__. La bureaucratie a débloqué la couleur. Le budget reste dans le rouge.
chromatic-printer-achievement=Construisez __ENTITY__chromatic-printer__. Sauver la galaxie attendra. Il n’y a plus de cyan.
triple-ink-threat=Produisez 100 __ITEM__trichromatic-permit__ par heure. Cyan, magenta, jaune, noir. Toujours aucune réponse claire.
ink-hoarder=Produisez 10 000 __ITEM__ink__ dans une seule partie. Le budget encre est confidentiel. C’est pour cela que la réunion budgétaire dure toute la journée.
cyan-magenta-yellow-black=Produisez 1 000 __ITEM__trichromatic-permit__ dans une seule partie. Quatre encres pour un permis trichromatique. Même le nom de l’objet mérite un audit.
notary-public=Construisez __ENTITY__notary-office__. Les accords officiels méritent des sceaux officiels. Et leur propre bâtiment.
territorial-arbitrator=Construisez __ENTITY__territorial-arbitration-post__. Les démolisseurs ont été assignés. Le terrain prépare sa déposition.
demolisher-eviction-specialist=Produisez 5 __ITEM__territorial-deed__ dans une seule partie. Expulser par la paperasse : moins spectaculaire que la dynamite, plus vexant.
chartered-accountant=Produisez 100 __ITEM__offworld-metallurgy-charter__ dans une seule partie. La propriété intellectuelle de Vulcanus voyage avec un badge.
conciliation-officer-achievement=Construisez __ENTITY__conciliation-desk__. La biologie rencontre la bureaucratie et propose immédiatement une autre réunion.
capture-bureau-achievement=Construisez __ENTITY__capture-bureau__. Un salon de recrutement pour faune hostile. Le réseautage est délicat.
space-tourism-mogul=Produisez 500 __ITEM__public-transportation-contract__ dans une seule partie. Vous avez inventé les transports. Le service juridique a inventé 500 raisons de les rater.
symbiosis-specialist=Produisez 100 __ITEM__symbiosis-record__ par heure. Vous avez industrialisé la comptabilité des spécimens. C’est une forme de pouvoir très précise.
digital-services-bureau-achievement=Construisez __ENTITY__digital-services-bureau__. La file d’attente est électronique. Cela compte comme sa suppression.
archive-recombinator=Recherchez __TECHNOLOGY__fulgora-salvage-administration__. Quelqu’un a abandonné cette paperasse. Vous avez acheté l’extension pour en hériter.
form-gambler=Produisez 1 000 __ITEM__old-archive__ dans une seule partie. De l’archéologie où chaque découverte aurait pu être un courriel.
relay-clerk-corps=Produisez 10 __ITEM__relay-clerk__ dans une seule partie. Spécialistes de la transmission, incapables de vous retirer des destinataires en copie.
laser-printer-achievement=Construisez __ENTITY__laser-printer__. L’encre liquide a échoué au contrôle vestimentaire d’Aquilo. Le support solide a compris la consigne.
thermal-paper-pusher=Produisez 5 000 __ITEM__thermal-transfer-sheet__ dans une seule partie. Un support haut de gamme pour une planète qui congèle même les formalités.
ribbon-collector=Produisez 2 000 __ITEM__composite-chroma-ribbon__ dans une seule partie. De la couleur comprimée pour un vide qui manque encore de documentation.
interplanetary-correspondent=Produisez 50 __ITEM__unified-operations-charter__ dans une seule partie. Quatre mondes coordonnés dans une conversation de groupe très chère.
cyan-yellow-bureaucrat=Produisez 500 __ITEM__cyan-yellow-form__ dans une seule partie. Vulcanus et Gleba fusionnent sans s’accorder sur le nom du service.
cyan-magenta-bureaucrat=Produisez 500 __ITEM__cyan-magenta-form__ dans une seule partie. Vulcanus et Fulgora, scellées contre les dégâts et la responsabilité.
yellow-magenta-bureaucrat=Produisez 500 __ITEM__yellow-magenta-form__ dans une seule partie. Gleba et Fulgora, archivées biologiquement et expliquées électriquement.
hardened-data-hoarder=Produisez 100 __ITEM__hardened-data-vault__ dans une seule partie. Une sauvegarde sans comité n’est que de l’optimisme.
bureaucratic-transcendence-achievement=Recherchez __TECHNOLOGY__bureaucratic-transcendence__. La paperasse n’est plus le goulot d’étranglement. Le prochain vient d’être promu.
form-free-transit=Construisez 50 __ENTITY__public-train-stop__. Des trains qui fonctionnent : un miracle qui a nécessité une recherche avancée.
maxed-out-orbital-capacity=Recherchez __TECHNOLOGY__orbital-employment-capacity-4__. Cinq mineurs par astéroïde. Les RH ont découvert la densité.
maxed-out-orbital-damage=Recherchez __TECHNOLOGY__orbital-employment-damage-5__. Vos mineurs frappent comme une tonne de briques avec des objectifs annuels.
speed-demon-arrays=Recherchez __TECHNOLOGY__trajectory-compliance-speed-9__. Un ordre toutes les 1,5 secondes. Tout marquer urgent a enfin fonctionné.
executive-jurisdiction=Recherchez __TECHNOLOGY__trajectory-compliance-jurisdiction-3__. Toute taille d’astéroïde, aucun recours, aucun médiateur.
vulcanus-export-licensed=Recherchez __TECHNOLOGY__vulcanus-export-charters__. La licence voyage mieux que la lave.
cyan-yellow-merged=Recherchez __TECHNOLOGY__cyan-yellow-bureaucracy__. Deux planètes, un formulaire, deux fois plus d’interlocuteurs.
cyan-magenta-merged=Recherchez __TECHNOLOGY__cyan-magenta-bureaucracy__. Métallurgie et électromagnétisme exigent tous deux un visa.
yellow-magenta-merged=Recherchez __TECHNOLOGY__yellow-magenta-bureaucracy__. Biologie et récupération : une innovation ou une mention d’avertissement.
boots-on-the-ground=Construisez __ENTITY__field-office__. Vous avez automatisé l’usine et inventé le trajet domicile-travail.
human-resources=Produisez 10 __ITEM__biter-logistics-formation__ dans une seule partie. Le nom du service a survécu à l’absence totale d’humains.
last-mile-management=Construisez __ENTITY__biterport__. Le réseau de livraison a des pattes. La direction récolte les félicitations.
company-car=Construisez __ENTITY__rideable-biter__. Le véhicule de fonction réclame une mutuelle dentaire.
business-class=Construisez __ENTITY__passenger-wagon__. Vos plaintes voyagent ensemble. On appelle cela du réseautage.
middle-management=Construisez __ENTITY__personnel-routing-multisign__. Trois directions, un responsable, les autres font la marche.
per-my-last-prompt=Construisez __ENTITY__ai-server__. Vous avez automatisé les courriels qui auraient dû remplacer les réunions.
procedurally-generated-excuses=Produisez 1 000 __ITEM__administrative-slop__ dans une seule partie. Une IA a rédigé les dossiers. Une autre la félicitera.
manufactured-consent=Construisez __ENTITY__synthetic-personnel-bureau__. L’annonce disait que vous façonneriez la prochaine recrue.
mandatory-team-building=Construisez __ENTITY__involuntary-relocation-cannon__. Présence obligatoire. Voyage balistique.
