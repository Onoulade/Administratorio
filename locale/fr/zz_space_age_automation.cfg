; Localisation française du passage automatisation et logistique Space Age.

[achievement-description]
chromatic-trunk=Recherchez le tronc pneumatique chromatique. Enfin, les formulaires trichromatiques peuvent voyager.
frozen-pdf=Débloquez le tronc chromatique d'Aquilo et cessez enfin d'acheminer de l'encre liquide vers un congélateur.
tube-terminus=Construisez un Terminus interplanétaire. Un par planète. Sans exception.

[achievement-name]
chromatic-trunk=Tronc chromatique
tube-terminus=Diplomatie pneumatique

[entity-description]
ai-server=Cœur de calcul d'Aquilo, et sa seule tâche. Il consomme énormément d'électricité pour produire des Jetons d'inférence et émet de la vraie chaleur dans le réseau thermique vanilla pendant son fonctionnement. Un serveur incapable d'évacuer sa chaleur s'arrête net : il ne ralentit pas. Il n'offre aucun choix de recette, et ses jetons ne sortent que par fibre optique vers une [entity=slop-refinery].
heat-exhaust=Limite la température d'un réseau thermique en évacuant l'excédent. Pour les joueurs qui veulent le calcul sans la production d'énergie. Il n'est jamais plus efficace que d'utiliser réellement la chaleur.
interplanetary-terminus=Transporte la paperasse entre les planètes par un tronc lent et étroit. Un par planète.\n\n[font=default-bold]Pour envoyer :[/font] les inserteurs placent le formulaire à exporter dans son emplacement d'entrée. Un seul type de formulaire à la fois.\n[font=default-bold]Pour demander :[/font] reliez le Terminus à un réseau de circuits et définissez un signal pour chaque formulaire que [color=green]cette[/color] planète veut. Le tronc prélève la paperasse correspondante dans l'emplacement d'entrée des Terminus des autres planètes.\n[font=default-bold]Pour recevoir :[/font] les arrivées atterrissent dans ses emplacements de sortie. Retirez-les avec un inserteur : le tronc ne les envoie jamais ailleurs. Les mettre sur un tapis, dans un coffre ou dans le réseau local de tubes est votre étape explicite.
involuntary-relocation-cannon=Réaffecte le personnel de la famille des biters entre les planètes, par lot et par tir. Ce n'est pas une tourelle : il ne vise rien.\n\n[font=default-bold]Canon expéditeur :[/font] chargez le personnel dans son emplacement d'entrée. Rien d'autre n'est nécessaire.\n[font=default-bold]Canon récepteur :[/font] chargez des [item=involuntary-transfer-order] dans son emplacement d'entrée, puis reliez-le à un réseau de circuits avec un signal pour chaque objet que [color=green]cette[/color] planète veut recevoir. Il dépense un ordre par objet arrivé, dans les emplacements de sortie.\n\n[font=default-bold]Il n'y a aucun réglage de cible.[/font] Le canon récepteur demande ; n'importe quel canon expéditeur d'une autre planète avec la cargaison correspondante répond. Une planète qui envoie et reçoit construit deux canons. Personnel de la famille des biters uniquement, jamais des œufs, et uniquement entre planètes.
optical-fibre=Transporte uniquement du [fluid=inference-token]. Ne se connecte ni aux tuyaux ordinaires ni aux tubes pneumatiques.
slop-refinery=Tout ce qui suit un jeton. Tire les Jetons d'inférence de la fibre optique, les raffine en Bouillie administrative, transforme la bouillie en paperasse fabriquée et traite les Citations fabriquées qui en tombent. Le [entity=ai-server] ne produit que l'inférence ; c'est cette machine qui la transforme en classement.
synthetic-personnel-bureau=Fabrique des professions plutôt que des bâtiments. Synthétise Notaires agréés, Agents de conciliation, Commis relais et Techniciens cryo-impression à partir d'œufs de biters, de jetons d'inférence et de bouillie administrative : un spécialiste ne demande donc plus un aller-retour vers Nauvis. Sa consommation électrique est la vraie contrainte.

