[tips-and-tricks-item-description]
administratorio-aquilo-manifest=[font=default-bold]Aquilo est une convergence, pas une abondance.[/font]\n\nApportez les documents colorés des planètes précédentes, des spécialistes [item=cryoprint-technician] formés sur Nauvis et une petite réserve de cadres ordinaires. Le [entity=interplanetary-terminus] déplace les formulaires finis entre les mondes sur un tronc lent et étroit ; les arrivées attendent dans son propre inventaire jusqu'à ce que vous les retiriez. Briefiez les cadres localement avec un seul matériau thématique et 5 cafés.\n\n[font=default-bold]Silo à fusées :[/font] la recette commune est disponible ici, mais sa [item=government-grant] Subvention publique et son [item=management-approval-written] Approbation écrite de la direction doivent arriver par la logistique interplanétaire.\n\nL'[entity=archive-recombination-bureau] fonctionne aussi ici, mais la progression cryogénique critique reste déterministe. Utilisez ses tirages de réaffectation à un formulaire pour équilibrer les surplus, pas pour jouer le seul permis qui maintient l'usine en vie.
administratorio-aquilo-tube-network=[font=default-bold]Aquilo remplace l'encre liquide gelée par des supports solides et ouvre le tronc chromatique.[/font]\n\nL'[entity=laser-printer] consomme des [item=thermal-transfer-sheet] et du [item=composite-chroma-ribbon]. Le palier [technology=interplanetary-tube-chromatic] étend le tronc interplanétaire aux documents colorés, que le palier de base ne transporte pas.\n\nLa même branche autorise les documents tricolores, les licences cryogéniques, l'expédition vers l'Administratorium et, finalement, les arrêts de train publics sans formulaire. Prévoyez un [item=cryoprint-technician] pour chaque imprimante que vous comptez construire.
administratorio-bureaucratic-transcendence=[font=default-bold]Transcendance bureaucratique : la paperasse n'est plus un goulot d'étranglement du transit.[/font]\n\nDébloqué par [technology=bureaucratic-transcendence]. L'[entity=public-train-stop] est la récompense phare : un arrêt de train qui fonctionne simplement, sans formulaire.\n\n[font=default-bold]Lore :[/font] votre administration a atteint un tel débit et une telle fiabilité que le bureau central accorde une dérogation permanente aux opérations ferroviaires courantes. La paperasse existe toujours pour tout le reste : ceci ne concerne que le transit.\n\n[font=default-bold]Prérequis :[/font] [technology=interplanetary-tube-chromatic], toute la chaîne du tronc interplanétaire. Vous devez avoir conquis la convergence bureaucratique des quatre planètes Space Age avant que le système vous fasse confiance avec des trains sans formulaire.
administratorio-chromatic-trunk=[font=default-bold]Les documents colorés ne traversent pas le tronc de base.[/font]\n\nAvant la recherche [technology=interplanetary-tube-chromatic] sur Aquilo, le [entity=interplanetary-terminus] ne transporte que la paperasse noire ordinaire : formulaires, tickets, dossiers, affaires, mémoires, papier, encre et argent des contribuables. Les documents cyan, jaunes, magenta et composites ne sont pas des charges valides ; les inserteurs refusent de les charger.\n\n[font=default-bold]Après le palier chromatique :[/font] les formulaires colorés vierges, les trois formulaires bicolores, [item=cryogenic-operations-license], [item=hardened-data-vault], [item=trichromatic-permit], [item=unified-operations-charter] et [item=promethium-research-charter] deviennent tous autorisés dans le tronc.\n\n[font=default-bold]Note stratégique :[/font] le tronc déplace le document lui-même, pas une copie. Demandez-vous si la planète source a encore besoin de l'original avant de le réclamer.
administratorio-cross-planet-bureaucracy=[font=default-bold]La production interplanétaire converge grâce à la paperasse composite.[/font]\n\nLes recherches cyan-jaune, cyan-magenta et jaune-magenta combinent chacune deux juridictions planétaires en un formulaire et quelques autorisations interplanétaires. La branche cyan-jaune ouvre aussi l'économie du tourisme orbital. Aquilo réunit ensuite les trois couleurs en supports de transfert secs, permis trichromatiques, autorisation de tronc chromatique et chartes d'expédition finales.\n\nDéplacez les formulaires finis et durables entre les mondes dès que possible. La paperasse jaune source se périme, l'encre liquide ne sert pas sur chaque surface et un tronc interplanétaire saturé a la disponibilité émotionnelle de Regina George un lundi.
administratorio-egg-couriers=[font=default-bold]Les œufs de biters ne quittent jamais Nauvis.[/font]\n\nLes œufs avariés éclosent en biters hostiles, un par 25. Hors de Nauvis, il n'y a ni [entity=admin-station], ni chaîne de plaintes, ni moyen de gérer ce qui en sort. Chaque recette vanilla qui consommait des œufs hors monde utilise donc à la place un coursier formé sur Nauvis. Les coûts vanilla en œufs ne changent pas ; seul ce qui traverse l'espace est différent.\n\n• [item=missionary-manager] — vers Aquilo, consommé par [entity=captive-biter-spawner]\n• [item=voluntary-research-subject] — vers l'orbite, consommé par la science de l'Administratorium\n• [item=geotechnical-assessment-manager] — vers Gleba, [color=green]rendu[/color] après la fabrication du sol\n\n[font=default-bold]Les trois expirent après 30 minutes[/font] en [item=middle-management-managing-manager] ordinaire. Un coursier expiré coûte les œufs et le voyage, jamais le cadre.\n\n[font=default-bold]Le piège de l'emplacement d'entrée :[/font] la science de l'Administratorium est produite par lots : 250 [item=promethium-asteroid-chunk] et 10 [item=quantum-processor] doivent être prêts avant qu'elle commence. Un [color=red]Cobaye inséré avant les fragments passe ses 30 minutes dans l'emplacement d'entrée et y expire.[/color] Préparez d'abord les fragments et processeurs, livrez le coursier en dernier. Cet échec est silencieux et coûteux.
administratorio-fulgora-digital-services=[font=default-bold]Les Services numériques de Fulgora ouvrent la branche bureaucratique informatisée de la planète.[/font]\n\nDébloqués par [technology=fulgora-digital-services] (nécessite l'Impression chromatique, déclenchée après avoir fabriqué 20 [item=charged-toner]). Débloque le [entity=digital-services-bureau], le [item=archive-recovery-permit], le [item=digital-processing-certificate], la [item=electromagnetic-operating-license] et l'[item=data-recovery-order].\n\n[font=default-bold]Déclencheur de recherche :[/font] fabriquez 20 [item=charged-toner], extrait du rebut de Fulgora ou récupéré du recyclage. Cela vous force à utiliser la boucle de rebut/recyclage de Fulgora avant de débloquer les services numériques.\n\n[font=default-bold]Bâtiments clés :[/font]\n• [entity=digital-services-bureau] — bureau informatisé 24 h/24, sans fermeture nocturne\n• [entity=archive-recombination-bureau] — recycleur de réaffectation un formulaire vers trois formulaires\n• [entity=interplanetary-terminus] — extrémité du tronc interplanétaire
administratorio-interplanetary-terminus=[font=default-bold]Le Terminus interplanétaire est l'extrémité du tronc. Un par planète.[/font]\n\nDébloqué par [technology=interplanetary-tube-network]. Son emplacement d'entrée contient un seul type de formulaire à exporter et n'accepte que les charges valides. Reliez-le à un réseau de circuits et définissez un signal pour chaque formulaire voulu par cette planète ; le tronc prélève la paperasse correspondante dans l'entrée du Terminus de toute autre planète.\n\n[font=default-bold]Les arrivées ne sont pas distribuées automatiquement.[/font] La paperasse arrivée reste dans l'inventaire de sortie du Terminus jusqu'à ce que vous la retiriez. C'est délibéré : cela offre un tampon visible, une liste de contenu lisible par circuit et une vraie séparation entre le réseau local de tubes et le réseau interplanétaire.
administratorio-interplanetary-trunk=[font=default-bold]Le tronc est volontairement étroit et lent.[/font]\n\nLe réseau pneumatique local est instantané, propre à chaque surface et monte jusqu'à 200 formulaires. Le tronc interplanétaire est un pool [color=red]séparé[/color] : il commence à 3 objets en vol, 30 secondes chacun, et ne fusionne jamais avec le réseau local. Sinon, vous auriez une téléportation planétaire gratuite et les fusées perdraient leur intérêt.\n\n[font=default-bold]Le transit est par objet, pas par lot.[/font] Chaque objet porte son propre minuteur ; beaucoup peuvent traverser en même temps. La capacité indique combien, le transit indique combien de temps.\n\n[font=default-bold]Charge :[/font] uniquement de la paperasse noire ordinaire. Les formulaires colorés attendent [technology=interplanetary-tube-chromatic] sur Aquilo.
administratorio-laser-printer=[font=default-bold]L'Imprimante laser est l'imprimante à encre gelée d'Aquilo, utilisant des supports solides.[/font]\n\nDébloquée par [technology=interplanetary-tube-chromatic]. Elle n'utilise pas d'encre liquide :\n• [item=thermal-transfer-sheet] — support d'impression haut de gamme, remplace le papier\n• [item=composite-chroma-ribbon] — support CMJ compressé, remplace les encres de couleur liquides\n\n[font=default-bold]Capacités :[/font]\n• Toutes les catégories d'impression héritées\n• Impression chromatique et multicolore, plus impression orbitale avancée\n• Vitesse de fabrication ×5, productivité de base de 50 %, 6 emplacements de modules\n• Aucun fluide en entrée, uniquement des objets\n• Fonctionne sous la basse pression d'Aquilo et sur les plateformes spatiales\n\n[font=default-bold]Pourquoi elle existe :[/font] l'encre liquide gèle sur Aquilo. L'Imprimante laser emploie des supports solides thermiquement stables. Les rubans sont assemblés à partir de paperasse CMJ importée et d'[item=transfer-emulsion] d'Aquilo.
administratorio-orbital-specialists=[font=default-bold]Les spécialistes sont des consommables de construction, pas du carburant de fonctionnement.[/font]\n\nContrairement aux travailleurs biters qui passent par les affectations de [entity=biter-station], les Astronautes, Notaires agréés, Agents de conciliation, Commis relais, Techniciens cryo-impression et Négociateurs de terrain sont formés sur Nauvis, stockés dans votre inventaire et consommés lorsque vous [color=red]placez[/color] le bâtiment correspondant.\n\n[font=default-bold]Règle de planification :[/font] préparez un spécialiste pour [font=default-bold]chaque[/font] bâtiment correspondant dans votre file de construction. Par exemple, chaque [entity=digital-services-bureau], [entity=interplanetary-terminus] et [entity=archive-recombination-bureau] exige son propre [item=relay-clerk] ; chaque [entity=administrative-space-station] exige son [item=astronaut]. Constituez un stock avant le départ.\n\n[font=default-bold]Cadres de gestion intermédiaire (MMMM) :[/font] gardez une réserve réutilisable de cadres ordinaires. Les variantes briefées sont produites localement avec un cadre, un matériau thématique et 5 cafés ; elles expirent après 3 minutes et les constructions avec personnel rendent le cadre sans briefing. Aucun argent des contribuables n'est impliqué.
administratorio-promethium-administration=[font=default-bold]L'expédition vers l'Administratorium est le contrôle final de la paperasse interplanétaire.[/font]\n\nLa voie vanilla [technology=promethium-science-pack] exige en plus [technology=interplanetary-tube-chromatic] et la Science administrative. En orbite, combinez une [item=unified-operations-charter], une [item=cryogenic-operations-license], un [item=hardened-data-vault] et un [item=asteroid-processing-docket] en une [item=promethium-research-charter].\n\nChaque recette de [item=promethium-science-pack] consomme cette charte d'expédition en plus de ses ingrédients Space Age. Le tronc peut positionner les formulaires prérequis, mais la charte elle-même est assemblée dans le vide. Terminez les branches colorées des planètes avant de planifier la course vers la planète pulvérisée.
administratorio-public-train-stop=[font=default-bold]L'Arrêt de train public fonctionne sans formulaire d'autorisation de transit.[/font]\n\nDébloqué par [technology=bureaucratic-transcendence], qui exige le palier chromatique du tronc d'Aquilo. C'est un [entity=train-stop] vanilla qui ne demande PAS de [item=transit-authorization].\n\n[font=default-bold]Mécanique :[/font]\n• Aucun coffre de permis de transit n'est créé.\n• Aucun formulaire n'est consommé à l'arrivée d'un train.\n• La limite de trains ne dépend pas de la paperasse.\n• Fonctionne exactement comme un arrêt de train vanilla.\n\n[font=default-bold]Pourquoi il existe :[/font] la Transcendance bureaucratique représente le moment où l'administration est assez efficace pour que le transit courant n'exige plus d'autorisation par arrivée. C'est un confort pour les grands réseaux ferroviaires, mais vous devez terminer toute la chaîne interplanétaire pour le mériter.
administratorio-relocation-cannon=[font=default-bold]Le canon n'a aucun réglage de cible. C'est le récepteur qui demande.[/font]\n\nChaque canon est l'une ou l'autre extrémité du système selon ce que vous mettez dans son unique emplacement d'entrée.\n\n[font=default-bold]Envoi :[/font] chargez le personnel de la famille des biters dans l'entrée. C'est tout. Il répond à toute demande correspondante d'une autre planète.\n\n[font=default-bold]Réception :[/font] chargez à la place des [item=involuntary-transfer-order] dans l'entrée, puis reliez le canon à un réseau de circuits avec un signal nommant chaque objet voulu par cette planète. Un ordre est dépensé par objet arrivé, qui apparaît dans les emplacements de sortie.\n\n[font=default-bold]Une planète qui fait les deux directions a donc besoin de deux canons[/font] : un avec la cargaison, l'autre avec les ordres. Contrairement au [entity=interplanetary-terminus], ils ne sont pas limités à un par planète.\n\n[font=default-bold]Il transporte du personnel, jamais des œufs[/font], et seulement entre les planètes. Les fusées gardent tout le reste.
administratorio-trunk-capacity=[font=default-bold]La recherche de capacité élargit et accélère le tronc en même temps.[/font]\n\nChaque palier augmente le nombre d'objets en vol et réduit la durée de chacun :\n• base — 3 objets, 30 s chacun\n• [technology=interplanetary-tube-capacity-2] — 5 objets, 15 s\n• [technology=interplanetary-tube-capacity-3] — 10 objets, 5 s\n• [technology=interplanetary-tube-capacity-4] — 15 objets, 2 s\n• [technology=interplanetary-tube-capacity-5] — 20 objets, 1 s\n\nLe dernier palier est un travail d'Administratorium. Même entièrement recherché, 20 formulaires en vol restent un filet à côté d'une fusée : c'est précisément le but.

