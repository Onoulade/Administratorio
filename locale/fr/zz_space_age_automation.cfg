involuntary-transfer-order=Autorise le transfert d'un seul membre du personnel, avec ou sans son accord. Chargé dans le [color=green]Canon de relocalisation involontaire récepteur[/color] [entity=involuntary-relocation-cannon] et consommé à raison d'un par objet arrivé.
missionary-manager=Un Cadre de gestion intermédiaire portant l'autorisation de dix œufs de biters vers Aquilo. Consommé par le générateur de biters captifs. Expire après 30 minutes en cadre ordinaire : vous perdez les œufs et le voyage, jamais le cadre.
optical-fibre=Transporte uniquement du [fluid=inference-token]. Ne se connecte ni aux tuyaux ordinaires ni aux tubes pneumatiques.
slop-refinery=Tout ce qui suit un jeton. Tire les Jetons d'inférence de la fibre optique, les raffine en Bouillie administrative, transforme la bouillie en paperasse fabriquée et traite les Citations fabriquées qui en tombent. Le [entity=ai-server] ne produit que l'inférence ; c'est cette machine qui la transforme en classement.
synthetic-personnel-bureau=Fabrique des professions plutôt que des bâtiments. Synthétise Notaires agréés, Agents de conciliation, Commis relais et Techniciens cryo-impression à partir d'œufs de biters, de jetons d'inférence et de bouillie administrative : un spécialiste ne demande donc plus un aller-retour vers Nauvis. Sa consommation électrique est la vraie contrainte.
unstaffed-operations-waiver=Autorise un bâtiment géré par une station de biters à fonctionner sans travailleur biter dépêché. Occupe un emplacement de module qui servirait autrement à la productivité. Il n'expire pas, mais il est cher et ne convient qu'aux bâtiments qui attendent un travailleur dépêché.
voluntary-research-subject=Un Cadre de gestion intermédiaire qui s'est porté volontaire, au sens où personne ne lui a demandé. Consommé par la science de l'Administratorium en orbite. Expire après 30 minutes en cadre ordinaire.

