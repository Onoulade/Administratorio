[fluid-description]
inference-token=Raisonnement machine produit à un coût électrique ruineux à partir de matière que personne n'a lue. C'est un flux, pas une caisse : il ne peut être ni mis en baril, ni transporté sur tapis, ni expédié, et ne circule que par fibre optique. Il se raffine en Bouillie administrative et alimente le Bureau du personnel synthétique.
amber-sap=Une sécrétion collante de Gleba pompée depuis les champs de suintement ambré. Elle finance le non-sens bon marché de la planète, son encre noire locale et sa bureaucratie en formulaires jaunes.
liquid-black-ink=Fluide d'écriture noir pressurisé, préparé pour la tuyauterie chromatique et les imprimantes à haut débit alimentées en liquide.
cyan-slurry=Une suspension minérale brute extraite de la croûte de vert-de-gris. Raffinable en encre cyan de Vulcanus et en quelques sous-produits douteux de notarisation.
cyan-ink=Le canal chromatique de Vulcanus. Alimente les Imprimantes chromatiques pour les brouillons locaux de permis et de chartes.
yellow-ink=Le canal chromatique de Gleba. Produite à partir de sève ambrée et de matière biologique, puis envoyée aux Imprimantes chromatiques pour la famille compacte de formulaires jaunes de la planète.
magenta-ink=Le canal chromatique de Fulgora. Préparée à partir de toner de récupération et de documentation pour le traitement numérique, la récupération d'archives et la paperasse de verrouillage à l'holmium.
hostile-spore-culture=Une base de spores cultivée sur Gleba, pouvant être spécialisée en fluides-leurres pour le Bureau des acquisitions.
workforce-lure-spores=Un nuage-leurre parfumé à l'offre d'emploi. Chargez-le dans un Bureau des acquisitions pour attirer des biters en vue du recrutement.
tourism-lure-spores=Un nuage-leurre parfumé au transit. Chargez-le dans un Bureau des acquisitions pour attirer des cracheurs en vue du conditionnement touristique.
oviposition-lure-spores=Un nuage-leurre expérimental de Gleba. Chargez-le dans un Bureau des acquisitions pour attirer des pentapodes en vue de la récolte d'œufs.
politician-fluid=Un fluide visqueux et nauséabond extrait de fissures naturelles. Raffinez-le dans une distillerie de propagande pour obtenir des mensonges liquides.
lie=Tromperie distillée sous forme liquide. Ingrédient critique pour la désinformation, les bonnes excuses, les livres blancs et les caisses noires.
misinformation=Mensonge militarisé sous forme fluide. Synthétisé à partir de mensonges et de données douteuses. Utilisé dans les justifications et la production de directives.
union-approval=Consentement liquide de la main-d'oeuvre. Négocié au siège syndical avec café, papier, données et argent des contribuables.
liquid-coffee=Café administratif infusé. Le lubrifiant universel de la bureaucratie. Requis pour les approbations, les rumeurs et les résolutions.
slush-fund=Fonds publics blanchis sous forme liquide. Produit à partir de bons du Trésor et de mensonges via la propagande.
