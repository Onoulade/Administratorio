[item-description]
slop-refinery=Tout ce qui suit un jeton. Tire les Jetons d'inférence de la fibre optique, les raffine en Bouillie administrative, transforme la bouillie en paperasse fabriquée et traite les Citations fabriquées qui en tombent. Le [entity=ai-server] ne produit que l'inférence ; c'est cette machine qui la transforme en classement.
optical-fibre=Transporte uniquement du [fluid=inference-token]. Ne se connecte ni aux tuyaux ordinaires ni aux tubes pneumatiques.
involuntary-relocation-cannon=Envoie le personnel de la famille des biters vers une autre planète, par lot et par tir. Ce n'est pas une tourelle : il ne vise rien.\n\nChargez la cargaison dans son emplacement d'entrée. Rien d'autre n'est nécessaire — il tire dès qu'un [entity=involuntary-relocation-receiver] correspondant sur une autre planète en fait la demande, dépensant un des ordres de transfert de ce récepteur par objet arrivé.\n\n[font=default-bold]Il n'y a aucun réglage de cible.[/font] N'importe quel récepteur d'une autre planète avec une demande correspondante reçoit une réponse. Personnel de la famille des biters uniquement, jamais des œufs, et uniquement entre planètes. Une planète qui envoie et reçoit construit l'un et l'autre.
involuntary-relocation-receiver=Demande du personnel de la famille des biters à une autre planète, par lot et par tir.\n\nChargez des [item=involuntary-transfer-order] dans son emplacement d'entrée, et reliez-le à un réseau de circuits avec un signal pour chaque objet que [color=green]cette[/color] planète veut recevoir. Il dépense un ordre par objet arrivé, et les arrivées atterrissent dans ses emplacements de sortie.\n\n[font=default-bold]Il n'y a aucun réglage de cible.[/font] N'importe quel [entity=involuntary-relocation-cannon] sur une autre planète avec la cargaison correspondante répond. Une planète qui envoie et reçoit construit l'un et l'autre.
involuntary-transfer-order=Autorise le transfert d'un seul membre du personnel, avec ou sans son accord. Chargé dans un [entity=involuntary-relocation-receiver] et consommé à raison d'un par objet arrivé.
missionary-manager=Un Cadre de gestion intermédiaire portant l'autorisation de dix œufs de biters vers Aquilo. Consommé par le générateur de biters captifs. Expire après 30 minutes en cadre ordinaire : vous perdez les œufs et le voyage, jamais le cadre.
voluntary-research-subject=Un Cadre de gestion intermédiaire qui s'est porté volontaire, au sens où personne ne lui a demandé. Consommé par la science de l'Administratorium en orbite. Expire après 30 minutes en cadre ordinaire.
geotechnical-assessment-manager=Un Cadre de gestion intermédiaire envoyé évaluer le sol de Gleba. Rendu après la fabrication, donc Gleba accumule des cadres à moins que vous ne les renvoyiez. Expire après 30 minutes en cadre ordinaire.
synthetic-personnel-bureau=Fabrique des professions plutôt que des bâtiments. Synthétise Notaires agréés, Agents de conciliation, Commis relais et Techniciens cryo-impression à partir d'œufs de biters, de jetons d'inférence et de bouillie administrative : un spécialiste ne demande donc plus un aller-retour vers Nauvis. Sa consommation électrique est la vraie contrainte.
unstaffed-operations-waiver=Autorise un bâtiment géré par une station de biters à fonctionner sans travailleur biter dépêché. Occupe un emplacement de module qui servirait autrement à la productivité. Il n'expire pas, mais il est cher et ne convient qu'aux bâtiments qui attendent un travailleur dépêché.
ai-server=Cœur de calcul d'Aquilo, et sa seule tâche. Il consomme énormément d'électricité pour produire des Jetons d'inférence et émet de la vraie chaleur dans le réseau thermique vanilla pendant son fonctionnement. Un serveur incapable d'évacuer sa chaleur s'arrête net : il ne ralentit pas. Il n'offre aucun choix de recette, et ses jetons ne sortent que par fibre optique vers une [entity=slop-refinery].
heat-exhaust=Limite la température d'un réseau thermique en évacuant l'excédent. Pour les joueurs qui veulent le calcul sans la production d'énergie. Il n'est jamais plus efficace que d'utiliser réellement la chaleur.
administrative-slop=Texte administratif plausible, sans sens déterminé. Se raffine en vraie paperasse et en citations qui ne sont pas réelles.
fabricated-citations=Une référence qui a l'air réelle mais ne l'est pas. Évacuez-la, vérifiez-la pour récupérer des matières premières, ou laissez-la s'accumuler et arrêter le serveur.
interplanetary-terminus=Transporte la paperasse entre les planètes via un pool de tronc commun, lent et étroit. Un par planète.\n\n[font=default-bold]Pour envoyer :[/font] les inserteurs placent le formulaire à exporter dans son emplacement d'entrée. Il repart sur son propre minuteur — aucune demande n'est nécessaire — et rejoint un pool partagé par toutes les planètes de votre force. Un seul type de formulaire à la fois.\n[font=default-bold]Pour demander (câble [color=green]vert[/color]) :[/font] connectez le vert et définissez un signal pour chaque formulaire que cette planète veut. Un formulaire correspondant dans le pool est réclamé instantanément, peu importe son origine — même un formulaire que cette même planète y a déposé elle-même, ce qui est un simple retrait, pas un raccourci.\n[font=default-bold]Pour consulter le contenu du pool (câble [color=red]rouge[/color]) :[/font] connectez le rouge pour lire ce qui s'y trouve actuellement, à l'échelle de l'empire. Les deux couleurs partagent l'unique connecteur du Terminus sans interférer l'une avec l'autre.\n[font=default-bold]Pour recevoir :[/font] les arrivées atterrissent dans ses emplacements de sortie. Retirez-les vous-même avec un inserteur — les mettre sur un tapis, dans un coffre ou dans le réseau local de tubes est votre étape explicite, jamais celle du tronc.
promethium-asteroid-chunk=Un fragment d'astéroïde classifié contenant de l'Administratorium, récupéré près de la planète pulvérisée et acheminé par la bureaucratie orbitale.
promethium-science-pack=Le pack de recherche administrative final. Produit en orbite avec des fragments d'Administratorium, des processeurs quantiques, des œufs de biters et une [item=promethium-research-charter] charte d'expédition vers l'Administratorium.
promethium-research-charter=Une charte d'expédition vers la planète pulvérisée autorisant l'enregistrement officiel de l'Administratorium au moyen de dossiers orbitaux et d'une validation interplanétaire unifiée.
bullshit-ore=Un gisement naturel de pur non-sens non raffiné. La fondation de toute l'économie bureaucratique. Exploitez-le, raffinez-le, transformez-le en arme.
redundant-rubble=Déchet minéralisé produit par un excès de contrôle procédural. Totalement inutile seul, mais légalement requis pour les documents officiels contraignants.
compacted-rubble=Déchet bureaucratique compressé industriellement. Fabriqué avec des gravats redondants dans un four électrique, ou dans tout four par fusion réglementée avec un certificat de compensation carbone.
useless-documentation=Gravats redondants soigneusement enveloppés dans des couches de papier. Inutilité officiellement documentée. Requis pour les dépôts normalisés et les instruments financiers.
refined-nonsense=Absurdité bureaucratique pure et concentrée. Créé en fusionnant des gravats compactés avec de la désinformation liquide dans une distillerie de propagande. L'ossature des processus administratifs de haut niveau.
paper=Substrat bureaucratique réglementaire. Fabriqué à partir de bois ou synthétisé à partir de plastique. Utilisé pour tout, des formulaires vierges aux mémoires de cour suprême.
coffee-bean=Le sang vital de toute bureaucratie fonctionnelle.
ink=Fluide d'écriture brut extrait du charbon. Utilisable pour des documents manuscrits ou raffiné en cartouches.
blank-form=Un formulaire administratif vide en attente de sa vocation. La toile vierge de la bureaucratie. Utilisé dans presque toutes les recettes de paperasse.
blank-approval=Un modèle d'approbation préimprimé nécessitant une finalisation officielle à l'encre. Utilisé pour les décharges de sécurité, les permis de construire et les autorisations de transit.
blank-directive=Un modèle de directive haute sécurité avec triple application d’encre. Requis pour les approbations de niveau direction.
safety-waiver-draft=Une décharge de sécurité non finalisée attendant vérification d'imprimante et sceau d'encre.
construction-permit-draft=Un permis de construire non finalisé attendant vérification d'imprimante et sceau d'encre.
management-verbal-draft=Un brouillon d'approbation verbale extrait d'une conversation de salle de pause. Nécessite une finalisation à l'imprimante.
management-written-proposal=Une proposition de direction rédigée par le comité exécutif du siège syndical. Nécessite un lourd passage de finalisation à l'imprimante.
admin-station=Bureau d'interface avec les biters. Sa zone d'attente intégrée montre où les biters font la queue ; remettez ici les objets résolus pour les satisfaire. Stockage uniquement, sans fabrication.
resolution-office=Bureau dédié au traitement des plaintes. Gère les dépôts, les dossiers et les résolutions finales.
office-desk=Poste de travail polyvalent pour formulaires, packs de science, paperasse de financement et tâches administratives générales. Respecte les heures de bureau sauf avec une [item=overtime-exemption].
office-desk-no-working-hours=Poste de travail polyvalent pour formulaires, packs de science, paperasse de financement et tâches administratives générales.
union-headquarters=Vaste complexe où se négocient l'approbation de la main-d'oeuvre et les politiques de fin de partie. Le premier démarre avec des bons du Trésor et de la paperasse verbale, puis gère subventions, approbations écrites, audits et directives. Ferme la nuit sauf avec une [item=overtime-exemption].
union-headquarters-no-working-hours=Vaste complexe où se négocient l'approbation de la main-d'oeuvre et les politiques de fin de partie. Le premier démarre avec des bons du Trésor et de la paperasse verbale, puis gère subventions, approbations écrites, audits et directives.
propaganda-distillery=Installation spécialisée dans le traitement des fluides administratifs. Raffine le fluide politicien en mensonges liquides, synthétise la désinformation et produit des accréditations.
administrative-science-pack=Le pack de science rose. Alimente la recherche administrative. Fabriqué au bureau administratif.
taxpayer-money=Monnaie durement gagnée extraite des plaintes de biters résolues. La source principale de financement des opérations publiques.
treasury-bond=Un instrument financier garanti par le gouvernement. Combine l'argent des contribuables avec de la documentation inutile. Utilisé dans la construction et les directives de haut niveau.
government-grant=Une allocation importante de fonds publics. Utilisée pour les directives avancées, les dossiers de plaintes complexes et la bureaucratie de haut niveau.
job-offer=Un contrat de travail officiel. Placez-le dans un bureau administratif — quand les plaintes du biter sont entièrement résolues, il prend l'offre d'emploi et devient travailleur au lieu de repartir. Les biters plus grands produisent plus de travailleurs.
biter-worker=Un employé biter domestiqué. Requis pour construire des bâtiments administratifs. Produit en embauchant des biters résolus avec des offres d'emploi.
biter-logistics-formation=Un travailleur biter formé pour la construction de biterports et la logistique des coffres demandeurs.
biterport=Substitut terrestre au roboport. Contient jusqu'à 8 travailleurs logistiques biters et du financement public, puis envoie des biters marcheurs aux tâches de construction et de logistique dans les zones de biterport connectées. La nuit, les envois exigent aussi du café liquide par l'une des quatre entrées latérales.
paperwork-provider-chest=Coffre fournisseur passif à un emplacement pour logistique opérée par biters. Les robots peuvent aussi l'utiliser, mais personne ne sera impressionné.
paperwork-storage-chest=Coffre de stockage à un emplacement pour logistique opérée par biters et dépôts de recyclage.
paperwork-requester-chest=Coffre demandeur à un emplacement pour logistique opérée par biters.
rideable-biter=Un biter montable réaffecté au transport personnel. Consomme l'argent des contribuables en se déplaçant, ne porte qu'une minuscule sacoche et ne peut pas être récupéré après placement. Sans financement pendant 10 minutes, il redevient un biter ordinaire et dépose une plainte.
union-delegate=Un travailleur biter formé comme représentant syndical. Requis pour construire le siège syndical.
chemical-operator=Un travailleur spécialiste certifié pour la manipulation chimique dangereuse. Requis pour les usines chimiques.
nuclear-technician=Un travailleur spécialiste formé aux opérations radiologiques. Requis pour les réacteurs nucléaires et les centrifugeuses.
formation-center=Une installation de formation 5x5 dédiée aux affectations de travailleurs biters, aux logisticiens et aux certifications spécialisées.
field-office=Un avant-poste bureaucratique improvisé. Appelle des biters depuis les nids dans un rayon de 200 tuiles — un travailleur par cycle de fabrication. Fonctionne seulement lorsqu'un biter est sur place. Aucune pollution pendant l'exploitation.
biter-station=Stocke des travailleurs biters et du financement public, puis envoie les travailleurs autoriser les bâtiments gérés proches. La nuit, les envois exigent aussi du café liquide par l'une des quatre entrées latérales. Chaque machine autorisée peut fabriquer une fois avant de nécessiter une nouvelle visite.
transit-authorization=Documentation officielle de voyage (formulaire 12-T). Placez-la dans le coffre de permis de transit à un arrêt de train. Un formulaire est consommé par arrivée ; la limite de trains de la gare égale le nombre de formulaires dans le coffre.
greenhouse=Une installation de culture climatisée. Produit du bois à partir d'eau et, avec les bons intrants, des grains de café rares.
pneumatic-pipe=Tuyau scellé couleur manille pour transporter de la paperasse fluidisée. Ne se connecte PAS aux tuyaux de fluide ordinaires.
pneumatic-pipe-to-ground=Tube pneumatique souterrain pour faire passer la paperasse sous les bâtiments. Ne se connecte PAS aux tuyaux de fluide ordinaires.
tube-intake=Reçoit les objets de paperasse valides pour un transport pneumatique instantané. Insérez la paperasse directement avec des bras ou la logistique.
tube-outtake=Distribue les objets de paperasse du réseau pneumatique. Utilisez vos propres bras ou votre logistique pour extraire les objets du coffre de sortie.
transit-permit-chest=Coffre placé automatiquement aux arrêts de train. Chargez les autorisations de transit ici : une est consommée par arrivée de train. La limite de trains de la gare égale le nombre de formulaires. Accessible aux bras et à la logistique.
safety-work-order=Autorisation d'assemblage combinée pour la fabrication réglementée de sécurité. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
construction-work-order=Autorisation d'assemblage combinée pour la fabrication réglementée de construction. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
management-verbal-work-order=Autorisation d'assemblage combinée appuyée par une promesse verbale de responsable. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
management-written-work-order=Autorisation d'assemblage combinée appuyée par une directive de direction signée. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
research-grant-work-order=Autorisation d'assemblage combinée pour la production scientifique financée. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
chemical-handling-work-order=Un ordre d'exploitation spécialisé pour les usines chimiques. Construit à partir de paperasse de sécurité et environnementale, plus du matériel de manipulation. Consommé par chaque recette de chimie.
radiological-work-order=Un ordre d'exploitation haute sécurité pour les centrifugeuses et le traitement radiologique. Construit à partir de paperasse chimique et d'une approbation écrite de la direction. Consommé par les recettes de centrifugation.
carbon-offset-certificate-basic=Un certificat de base autorisant une fonte industrielle limitée. Consommé par les recettes de fonte par lot au four.
carbon-offset-certificate-verified=Un certificat amélioré avec vérification officielle. Émis via la chaîne de conformité du bureau pour les fours en acier et la fonte avancée.
work-order=Autorisation de travail de base pour les recettes réglementées de construction et d'assemblage. Utilisée pour construire les bras mécaniques ordinaires et assembler la paperasse de niveau supérieur.
form-27b-6=Le tristement célèbre formulaire de réquisition normalisé. Utilisé dans la paperasse de transit, les rapports de conformité et la bureaucratie supérieure.
safety-waiver=Un document dégageant l'administration de toute responsabilité. Requis pour certaines constructions T1 et pour assembler les permis d’exploitation plus lourds.
environmental-impact-report=Une évaluation complète, bien que fortement caviardée, des dégâts environnementaux. Utilisée pour émettre la paperasse d'exploitation chimique et radiologique.
management-approval-verbal=L'accord verbal d'un responsable, techniquement contraignant mais facilement nié. Nécessite du café pour être extrait.
management-approval-written=Un engagement de direction signé et notarié. Bien plus difficile à obtenir, mais impossible à nier.
research-grant-approval=Une autorisation de subvention de recherche de base. Requise pour tous les packs de science ; la science spatiale consomme les approbations importées dans la station administrative spatiale.
provisional-approval=Une habilitation bureaucratique de premier niveau. Votre premier goût des gravats redondants.
filing-l=Plainte de paysage officiellement déposée. Première étape pour résoudre le grief d'un citoyen concernant le décor local.
filing-s=Plainte de smog officiellement déposée. Documente l'objection d'un citoyen à la pollution atmosphérique industrielle.
filing-n=Plainte de bruit officiellement déposée. Consigne le grief d'un citoyen sur les nuisances sonores de votre infrastructure.
filing-u=Plainte de chômage officiellement déposée. Le grief citoyen le plus grave, alléguant un échec économique systémique.
filing-lt=Plainte de déchets officiellement déposée. Documente l'objection d'un spitter aux flaques d'acide laissées partout.
filing-h=Plainte de matières dangereuses officiellement déposée. Consigne le grief d'un spitter sur l'exposition aux matières dangereuses.
filing-lo=Plainte de flânerie officiellement déposée. Documente l'objection d'un spitter aux violations de zone restreinte.
filing-v=Plainte de vagabondage officiellement déposée. Le grief spitter le plus grave, alléguant déplacement et sans-abrisme.
case-s=Un dossier de smog prêt pour le tribunal. La preuve est littéralement dans l'air, mais il la faut quand même en trois exemplaires.
case-n=Un dossier de bruit validé, appuyé par des attestations de décibels sous serment. Étrangement, la partie la plus bruyante du processus est la paperasse.
case-u=Preuve d’échec économique systémique, compilée avec assez de paperasse pour employer un petit bureau. L'ironie est structurelle.
case-h=Un dossier matières dangereuses si documenté que le dossier lui-même pourrait nécessiter une manipulation protégée.
case-lo=Un argument juridique selon lequel se tenir au mauvais endroit est une infraction poursuivable. Le précédent est fragile, mais le dépôt est hermétique.
case-v=Un dossier de déplacement construit par le système qui a causé le déplacement. Personne n'a dit que la bureaucratie devait être lucide.
brief-n=Vestige d'une époque juridique plus simple où les dossiers de bruit allaient jusqu'à la cour suprême. Conservé pour la compatibilité des sauvegardes : votre ancienne paperasse est protégée.
brief-u=Artefact de l'époque où le chômage exigeait une décision de cour suprême plutôt qu'un dossier très épais. Conservé pour la compatibilité des sauvegardes.
brief-lo=Souvenir de la brève période où les dossiers de flânerie exigeaient l'intervention de la cour suprême. Le système a depuis été rationalisé. Conservé pour la compatibilité des sauvegardes.
brief-v=Mémoire de cour suprême datant de l'époque où le vagabondage exigeait l'autorité judiciaire maximale. Conservé pour la compatibilité des sauvegardes : la bureaucratie se souvient.
construction-permit=Une autorisation de construction standard. Requise comme ingrédient dans la plupart des recettes de bâtiments et dans les permis d'exploitation lourds.
dubious-data=Raffiné à partir de minerai de foutaises. Peu fiable, mais techniquement admissible comme information. L'ossature de l'économie des excuses.
basic-excuse=Une justification simple assemblée à partir de données douteuses. Utilisée dans la résolution paysage et les processus bureaucratiques bas niveau.
crappy-report=Un rapport compilé à la hâte et d’exactitude douteuse. La base de toute documentation de niveau supérieur.
credentials=Accréditations officielles produites à partir de mensonges liquides, de données douteuses et de non-sens raffiné. Preuve d'autorité, quelle que soit la source douteuse.
data=Synthétisées à partir de rapports minables et d’accréditations. Information réellement utilisable. Une denrée rare dans cette administration.
good-excuse=Une justification bien ficelée mêlant vraies données et mensonges liquides. Utilisée dans les approbations avancées et la construction du récit.
justification=Une justification juridique formelle construite avec désinformation, accréditations et fluide politicien. Utilisée dans la construction de récits.
narrative=L'histoire officielle, tissée de justifications, de bonnes excuses et de non-sens raffiné. Contrôle la perception publique de votre administration.
white-paper=Un document politique faisant autorité, mêlant données, mensonges et non-sens garanti par le Trésor. La base des politiques publiques.
policy=Une directive rédigée en réunions interminables. Exige livres blancs, désinformation, données et subventions publiques.
regulation=Une réglementation fédérale rédigée par un processus bureaucratique épuisant. L'expression ultime de l'autorité gouvernementale.
promise=Une capsule jetable contenant une promesse bureaucratique. Lancez-la sur un biter manifestant pour le pacifier temporairement.
eviction-notice=Une capsule jetable qui détruit les structures biters. À utiliser avec une extrême prudence.
hush-money=Un sac d'argent des contribuables lancé aux nids de biters pour les faire taire. Empêche l'apparition pendant 3 minutes. Smog vert non garanti non toxique.
hired-biter-capsule=Un agent de terrain biter béhémoth pleinement accrédité. Placez-le, sélectionnez-le avec un ordre de déploiement et laissez la logistique remplir son registre d'avis d'expulsion dissimulé.
hired-biter-command-capsule=Télécommande de terrain pour les agents. Cliquez sur les agents pour les sélectionner ou désélectionner, faites un clic droit sur les positions cartographiées pour les envoyer, et Maj + clic droit pour ajouter des points de passage. Clic droit sur un coffre d'avis pour y envoyer les agents se réapprovisionner.
resolved-landscape=Plainte de paysage entièrement résolue. Preuve que le système fonctionne, parfois.
resolved-smog=Plainte de smog entièrement résolue. A exigé beaucoup de désinformation et de café.
resolved-noise=Plainte de bruit entièrement résolue. A demandé un dossier validé, une pile de directives, du café, des récits et des accréditations.
resolved-unemployment=Plainte de chômage entièrement résolue. Sommet de l'accomplissement bureaucratique : vous avez résolu le chômage.
resolved-littering=Plainte de déchets entièrement résolue. Les flaques d'acide ont été officiellement reclassées comme éléments décoratifs.
resolved-hazmat=Plainte de matières dangereuses entièrement résolue. A exigé des preuves en gravats compactés, de la désinformation et du café.
resolved-loitering=Plainte de flânerie entièrement résolue. A demandé un dossier validé, des règlements, du café, des récits et des accréditations.
resolved-vagrancy=Plainte de vagabondage entièrement résolue. Sommet bureaucratique des spitters : vous avez résolu le sans-abrisme.
ticket-landscape=Plainte citoyenne pour destruction du paysage. Générée par les petits biters aux bureaux administratifs.
ticket-smog=Plainte citoyenne pour pollution de l'air. Générée par les biters moyens ou plus grands.
ticket-noise=Plainte citoyenne pour pollution sonore. Générée par les gros biters ou plus grands.
ticket-unemployment=Plainte citoyenne pour chômage. Générée uniquement par les biters béhémoths.
ticket-littering=Plainte de spitter pour flaques d'acide abandonnées. Générée par les petits spitters aux bureaux administratifs.
ticket-hazmat=Plainte de spitter pour exposition aux matières dangereuses. Générée par les spitters moyens ou plus grands.
ticket-loitering=Plainte de spitter pour violation de zone restreinte. Générée par les gros spitters ou plus grands.
ticket-vagrancy=Plainte de spitter pour déplacement et sans-abrisme. Générée uniquement par les spitters béhémoths.
printer-t1=Imprimante électrique basique. Lente mais fiable. Produit des documents imprimés à partir de cartouches d'encre.
printer-t2=Imprimante industrielle rapide avec mode copie. Sur les planètes, elle exige l'envoi d'un travailleur depuis l'agence pour l'emploi des biters ; sur les plateformes spatiales, une autorisation permanente embarquée la maintient opérationnelle.
mechanical-printer=Imprimante à manivelle. Votre cheval de bataille jusqu'au déblocage de l'impression électrique.
speed-module=Menace juridique qui pousse les machines à produire plus vite. La facture d'énergie est le problème de quelqu'un d'autre. (+20 % vitesse, +50 % énergie)
speed-module-2=Assignation collective escaladée. Les machines travaillent frénétiquement pour se conformer. (+30 % vitesse, +70 % énergie)
speed-module-3=Assignation fédérale appuyée par tout le poids du judiciaire. Les machines n'ont jamais travaillé aussi vite ni aussi cher. (+50 % vitesse, +100 % énergie)
productivity-module=Audit interne qui extrait une production supplémentaire de chaque cycle. Les auditeurs ralentissent tout pendant qu'ils travaillent. (+4 % productivité, -vitesse, +énergie, +pollution)
productivity-module-2=Audit judiciaire au périmètre élargi. Plus de constats, plus de frais généraux, plus de paperasse. (+6 % productivité, -vitesse, +énergie, +pollution)
productivity-module-3=Enquête fédérale complète. La production est maximisée, mais le moral, la vitesse et la facture d'énergie en paient tous le prix. (+10 % productivité, -vitesse, +énergie, +pollution)
efficiency-module=Comptabilité créative qui sort les coûts d'énergie des livres. Personne ne demande où sont passées les économies. (-30 % énergie)
efficiency-module-2=Techniques avancées de détournement. Les comptables sont devenus plus audacieux. (-40 % énergie)
efficiency-module-3=Montage de Ponzi complet appliqué à l'énergie. Les machines tournent à moitié coût et les auditeurs n'ont encore rien remarqué. (-50 % énergie)
corporate-breakroom=Lieu social où le café alimente les rumeurs. Produit des rumeurs de fontaine à eau, de bonnes excuses et des brouillons d'approbation verbale. Ferme la nuit sauf avec une [item=overtime-exemption].
osha-violation=Infraction de sécurité au travail générée par des procédés industriels dangereux. Peut être nettoyée ou recyclée via le siège syndical.
watercooler-gossip=Renseignements informels recueillis autour de la fontaine à eau. Requis pour les décisions corporatives.
office-drama=Conflit interpersonnel généré comme sous-produit des rumeurs de bureau. Peut être recyclé à la salle de pause en ordres de travail, rumeurs ou excuses de base aléatoires.
orbital-employment-catapult=Un système de déploiement de personnel en forme de canon-rail. Les Mineurs Spatiaux d'Exploration Volontaire lancés s'accrochent aux astéroïdes et travaillent une fois par seconde jusqu'à ce que les roches cèdent tout leur rendement récupérable. La dotation commence à un mineur par astéroïde et la recherche relève ce plafond à cinq. Chaque mineur affecté revient ensuite sous forme de fragment qu'il faut effectivement récupérer.
voluntary-exploration-space-miner=Un astronaute hautement entraîné, équipé pour l'extraction d'astéroïdes assistée par catapulte. Les mineurs s'accrochent aux astéroïdes, effectuent un travail dont l'ampleur dépend de la recherche, et reviennent sous forme de fragments d'employé récupérables une fois récupérés.
unapproved-safety-waiver=Une décharge de sécurité imprimée, en attente d'approbation par l'administration biter à un Guichet des pétitions.
unapproved-construction-permit=Un permis de construire imprimé, en attente d'approbation par l'administration biter à un Guichet des pétitions.
notary-office=Un bureau de certification haut de gamme pour la bureaucratie dense sans impression. Gère les chartes, homologations, sceaux et la paperasse de secours sur Vulcanus.
verdigris-crust=Une croûte minérale vert-de-gris trouvée sur Vulcanus. Transformez-la en boue cyan, encres chromatiques et paperasse de certification locale.
charged-toner=Un concentré de toner de Fulgora extrait de gisements électrostatiques ou récupéré du rebut. Alimente à la fois la récupération d'archives et la chaîne d'encre magenta.
transfer-emulsion=Un liant de toner stable en conditions cryogéniques, produit sur Aquilo. Utilisé pour reconstruire des documents sans encre liquide.
thermal-transfer-sheet=Un support d'impression solide haut de gamme pour l'Imprimante laser. La réponse d'Aquilo à la papeterie alimentée en liquide.
composite-chroma-ribbon=Un support multicolore haut de gamme assemblé à partir de paperasse CMJ importée et de support de transfert d'Aquilo.
old-archive=Un lot compressé de dossiers à moitié illisibles récupérés du rebut de Fulgora. Il se recycle rapidement en formulaires de départ aléatoires, et rien d'autre.
archive-recombination-bureau=Une variante du Recycleur en permanence géré par un Commis relais. Insérez un formulaire compatible ; trois formulaires de remplacement de même rang et de même couleur sont chacun tirés indépendamment à 25 % de chances.
heatproof-form-stock=Papier à formulaire thermorésistant adapté à l'industrie de Vulcanus. Le substitut local du papier à permis fortement noir.
permit-draft=Une coquille de permis vulcanien imprimée en cyan sur papier thermorésistant. Alimente les chartes, permis et approbations de secours locales.
inspection-docket=Un dossier d'examen industriel dense, imprimé pour la conformité de l'ère des fonderies et le travail de certification.
embossed-seal=Un sceau de notarisation haut de gamme, gaufré à partir de matériaux vulcaniens. Utilisé pour certifier les chartes et la paperasse de lancement de secours.
industrial-charter=Un dossier certifié d'opérations industrielles pour la métallurgie et les infrastructures lourdes de Vulcanus.
blank-cyan-form=Document cyan originaire de Vulcanus pour le tungstène et l'industrie thermique. Utilisable hors monde si la recette l'autorise ; le Terminus ne l'accepte qu'après le Tronc chromatique d'Aquilo.
mycelial-form-stock=Papeterie fibreuse de Gleba imprimée à partir d'encre jaune. Sert de substrat local à la paperasse d'exception compacte de la planète.
blank-yellow-form=Document jaune originaire de Gleba pour l'industrie biologique. Il se gâte : expédiez le formulaire fini ; le Terminus ne l'accepte qu'après le Tronc chromatique d'Aquilo.
signal-form-stock=Support de formulaire magenta préparé sur Fulgora pour les formulaires d'archives et de signal traités numériquement.
blank-magenta-form=Document magenta originaire de Fulgora pour l'holmium, les archives et l'électromagnétisme. Le Terminus ne l'accepte qu'après le Tronc chromatique d'Aquilo.
cyan-yellow-form=Convergence Vulcanus + Gleba : métallurgie cyan et biologie jaune. Charge du tronc chromatique uniquement, après la recherche d'Aquilo.
cyan-magenta-form=Convergence Vulcanus + Fulgora : métallurgie cyan et électromagnétisme magenta. Charge du tronc chromatique uniquement, après la recherche d'Aquilo.
yellow-magenta-form=Convergence Gleba + Fulgora : biologie jaune et archives magenta. Charge du tronc chromatique uniquement, après la recherche d'Aquilo.
symbiosis-record=Un document de registre biologique compact utilisé là où Gleba remplace la paperasse de remplissage par une comptabilité directe des spécimens.
conciliation-order=Un document d'autorisation de Gleba qui remplace certaines approbations riches en mensonges ou en argent public par un traitement direct des exceptions conciliatoires.
archive-recovery-permit=Un permis de récupération de Fulgora autorisant la reconstruction par rebut de paperasse ruinée et de fragments d'archives.
digital-processing-certificate=Un certificat de Fulgora autorisant le débit administratif informatisé et les formulaires traités numériquement.
electromagnetic-operating-license=Une licence d'exploitation de Fulgora pour l'infrastructure électromagnétique et la bureaucratie liée à l'holmium.
data-recovery-order=Un ordre de travail de Fulgora axé sur le routage, utilisé pour reconstruire et récupérer des données administratives archivées.
hardened-data-vault=Un dossier de garde Vulcanus-Fulgora qui scelle thermiquement les données récupérées pour les autorisations orbitales tardives et de planète brisée.
trichromatic-permit=Produit sur Aquilo à partir des trois juridictions. Requis par les recettes qui combinent Vulcanus, Gleba et Fulgora ; charge chromatique uniquement.
unified-operations-charter=Produit sur Aquilo depuis les documents de Vulcanus, Gleba, Fulgora et Aquilo. Il signale une dépendance volontaire à quatre mondes.
cryogenic-operations-license=Produit sur Aquilo. Nécessaire pour l'infrastructure cryogénique ; cette charge exige le tronc chromatique, pas le Terminus de base.
public-transportation-contract=Un contrat de transit à deux couleurs fusionnant la paperasse cyan et les formulaires jaunes en une exemption de routage public.
public-train-stop=Un arrêt de train vanilla qui fonctionne sans exigence d'autorisation de transit. Déployez-le après avoir atteint la transcendance bureaucratique.
thermal-process-license=Produit sur Vulcanus. Nécessaire pour la métallurgie tungstène à haute température hors Vulcanus ; utilisez des fusées jusqu'au tronc chromatique d'Aquilo.
calcite-reagent-waiver=Produit sur Vulcanus. Nécessaire pour la chimie à calcite hors Vulcanus ; utilisez des fusées jusqu'au tronc chromatique d'Aquilo.
offworld-metallurgy-charter=Produit sur Vulcanus. Autorisation explicite pour les processus clés de fonderie, tungstène et calcite sur une autre planète ou plateforme.
capture-bureau=Un bureau de terrain de Gleba qui reçoit la faune hostile, traite les offres d'emploi et alimente le cycle des biters travailleurs.
petition-counter=Un petit guichet biter qui tamponne les approbations de permis quand un nid se trouve à proximité.
conciliation-desk=Un bureau spécialisé de Gleba pour la finalisation des formulaires jaunes. Gère la paperasse d'exception biologique compacte sans dupliquer toute l'échelle de permis de Nauvis.
digital-services-bureau=Un bureau informatisé rapide construit sur Fulgora. Il traite le travail administratif de routine 24 h/24 sans la fermeture nocturne habituelle.
laser-printer=Une imprimante rapide d'Aquilo qui utilise un support de transfert solide au lieu d'encre liquide. Gère les feuilles thermiques, les charges de ruban, les formulaires multicolores et l'impression finale en monde gelé.
provisional-work-order=Une autorisation d'assemblage combinée adossée à une approbation provisoire. Utilisée uniquement par les machines d'assemblage. Consommée à l'usage.
unapproved-radiological-work-order=Un dossier d'opérations radiologiques en attente d'approbation par l'administration biter à un Guichet des pétitions.
chromatic-printer=Plateforme d'impression prête pour Space Age. Commence comme un pont de compatibilité et s'étend à la paperasse chromatique plus tard.
enrolled-biter=Un biter qui a signé juste assez de formulaires pour entrer dans la bureaucratie. Pas encore utile sans formation de main-d'oeuvre.
worker-biter=Une unité de main-d'oeuvre biter formée bureaucratiquement. Formée sur Nauvis à partir d'un biter enrôlé, d'habilitations et d'excuses pour le personnel des infrastructures Space Age.
clerical-trainee=Un biter formé poussé dans la filière administrative. Prêt pour des rôles de spécialiste riches en paperasse.
management-trainee=Un biter formé poussé vers le théâtre hiérarchique. Alimente les négociateurs, la gestion absurde et d'autres rôles de personnel de niveau supérieur.
astronaut=Un administrateur orbital formé, conditionné pour le travail de paperasse en milieu sous vide, la conformité de station et d'autres absurdités extraplanétaires.
night-shift-supervisor=Un spécialiste de main-d'oeuvre formé pour la conformité administrative après les heures ouvrables.
licensed-notary=Un spécialiste certifié par charte pour les fonderies, permis et certification industrielle formelle de Vulcanus.
conciliation-officer=Un spécialiste de médiation à habilitation biologique pour les biochambres, la pacification et la réaffectation de main-d'oeuvre.
relay-clerk=Un spécialiste du routage électromagnétique pour l'infrastructure, la bureaucratie de signal et les services numériques.
cryoprint-technician=Un spécialiste technique cryogénique pour l'administration à froid et les procédés d'impression de précision.
field-negotiator=Un spécialiste d'escalade mobile pour la répression des manifestations, l'expropriation et la médiation administrative hostile.
middle-management-managing-manager=Un manager absurde de haut niveau qui ne contribue à rien jusqu'à ce qu'une réunion suffisamment récente rende sa présence obligatoire. Les managers briefés finissent par oublier le briefing et redeviennent cette forme ordinaire.
training-briefed-middle-management-managing-manager=A récemment assisté à une réunion de formation de main-d'oeuvre. Requis une fois par les recettes de formation concernées, qui renvoient ensuite un manager ordinaire. Le briefing expire après trois minutes.
staffing-briefed-middle-management-managing-manager=A récemment assisté à une réunion de dotation des installations. Requis lors des constructions dépendant d'employés, malgré une aide pratique nulle. Le briefing expire après trois minutes.
compliance-briefed-middle-management-managing-manager=A récemment assisté à une réunion de conformité réglementaire. Requis par certaines certifications et formations haut de gamme. Le briefing expire après trois minutes.
liaison-briefed-middle-management-managing-manager=A récemment assisté à une réunion de liaison interservices. Requis partout où deux services pourraient sinon communiquer directement. Le briefing expire après trois minutes.
orbital-briefed-middle-management-managing-manager=A récemment assisté à une réunion d'opérations orbitales, avec une unité partagée de carburant de fusée. Requis par l'administration spatiale et la formation orbitale avancée. Le briefing expire après trois minutes.
returning-orbital-employee=Un mineur spatial volontaire pris dans les débris d'astéroïde. Un collecteur d'astéroïdes le mine directement en munitions MSEV réutilisables dans son inventaire de sortie ; le manquer perd l'employé définitivement dans l'espace.
orbital-deviation-order=Une autorisation bon marché, dérivée d'astéroïde, pour une poussée soutenue vers l'extérieur. Plusieurs ordres routiniers superposés peuvent être nécessaires pour les astéroïdes plus lourds.
priority-orbital-deviation-order=Une autorisation renforcée imprimée à partir de produits d'astéroïde avancés. Chaque ordre fournit deux fois la poussée d'un ordre routinier.
orbital-operations-form=Paperasse de plateforme localement renouvelable, imprimée sur papier carbone-eau avec de l'encre au carbone ferreux. Utilisée pour le carburant, l'oxydant, le traitement d'astéroïdes, le tourisme et l'administration orbitale de routine.
asteroid-processing-docket=Paperasse de broyage imprimée localement pour le traitement avancé des astéroïdes. Ne contient aucun gravat terrestre, non-sens ou personnel jetable.
orbital-infrastructure-permit=Une autorisation de construction spécifique au vide pour l'infrastructure administrative des plateformes spatiales. Les permis terrestres ordinaires n'ont aucune juridiction là-haut, ce qui est franchement leur première limite sensée.
trajectory-compliance-array=Un moteur de paperasse junior autorisé à repousser les petits et moyens astéroïdes loin de la plateforme. Les roches restent visibles et ne produisent aucun rebut ; les cibles plus lourdes réagissent plus lentement.
senior-trajectory-compliance-array=Un moteur de déviation senior plus large avec assez de juridiction interplanétaire pour repousser les gros astéroïdes. Les réseaux superposés et une paperasse plus rapide créent une déviation soutenue plus forte.
executive-trajectory-compliance-array=Un moteur de déviation exécutif sans appel, autorisé à repousser toute taille d'astéroïde, y compris les énormes porteurs d'Administratorium, qui exigent généralement plusieurs poussées superposées.

