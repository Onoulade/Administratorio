[recipe-description]
laser-printer=Construisez l'imprimante rapide d'Aquilo à supports solides pour les formulaires multicolores et les charges du tronc chromatique.
middle-management-training-briefing=Briefe un manager réutilisable avec un engrenage et 5 unités de café, sans argent public, sur n'importe quelle planète.
middle-management-staffing-briefing=Briefe un manager réutilisable avec un kit de réparation et 5 unités de café, sans argent public, sur n'importe quelle planète.
middle-management-compliance-briefing=Briefe un manager réutilisable avec un formulaire vierge et 5 unités de café, sans argent public, sur n'importe quelle planète.
middle-management-liaison-briefing=Briefe un manager réutilisable avec un circuit électronique et 5 unités de café, sans argent public, sur n'importe quelle planète.
middle-management-orbital-briefing=Briefe un manager réutilisable avec une unité de carburant pour fusée et 5 unités de café, sans argent public, sur n'importe quelle planète.
promethium-science-pack=Convertit des fragments d'astéroïde d'Administratorium en recherche de niveau final sous couvert d'une charte d'expédition signée.
promethium-research-charter-production=Émet la charte qui permet de récupérer l'Administratorium sous contrôle administratif des astéroïdes.
paper-production=Transforme le bois en papier. Première étape de toute chaîne d'approvisionnement bureaucratique.
ink-production=Broie le charbon en encre brute. Fabricable à la main. L'écriture commence ici.
blank-form-production=Imprime des formulaires vierges avec du papier et de l'encre. Le support administratif universel.
blank-approval-production=Imprime des formulaires d'approbation vierges. Un modèle de meilleure qualité pour les permis et autorisations.
blank-directive-production=Imprime des formulaires de directive vierges. Modèle de sécurité haut de gamme à triple dose d'encre pour les validations de la direction.
carbon-offset-certificate-basic=Votre permis de fondre. Un certificat par lot de four maintient les régulateurs environnementaux à distance.
carbon-offset-certificate-verified=Un permis environnemental correctement vérifié. Obligatoire avant que la bureaucratie ne vous laisse construire un four en acier.
provisional-approval-production=La forme la plus élémentaire d'approbation bureaucratique. Votre premier goût de gravats redondants, et la porte d'entrée vers l'infrastructure de l'âge des brûleurs.
work-order-production=L'autorisation universelle pour assembleurs. Sans elle, vos machines sont de coûteux presse-papiers.
form-27b-6=Le formulaire qui rend tous les autres formulaires possibles. Vous n'avez pas déposé votre 27B-6.
safety-waiver-draft=Décharge Administratorio de toute responsabilité avec une excuse de base. Doit être finalisé à l'imprimante pour devenir juridiquement contraignant.
safety-waiver-printing=Donne existence officielle à la décharge de sécurité. Obligatoire pour certaines constructions T1 et les permis d'exploitation plus lourds ; les bras mécaniques ordinaires utilisent plutôt un ordre de travail.
transit-authorization-production=Documents de voyage officiels pour la logistique ferroviaire. Un formulaire consommé par arrivée : pas de formulaire, pas de train.
environmental-impact-report=Évaluation complète, quoique lourdement censurée, des dégâts environnementaux. Obligatoire pour les permis d'exploitation chimiques et radiologiques.
management-verbal-draft=Coincez un manager près de la machine à café et faites-lui accepter quelque chose. Doit être finalisé à l'imprimante avant que quelqu'un puisse nier que c'est arrivé.
management-verbal-printing=Fixe une promesse orale sur papier avant que le manager ne change d'avis. Produit l'approbation verbale officielle.
management-written-proposal=Rédige une proposition écrite au quartier général syndical. Exige une bonne excuse, un récit et une obligation du Trésor : les managers ne signent pas gratuitement.
management-written-1st-printing=Finalise la proposition écrite en une passe d'impression lourde. Produit une approbation de la direction signée, notariée et impossible à nier.
research-grant-approval-production=L'autorisation de financement minimale viable. Les lots de science spatiale consomment ces approbations ordinaires après leur expédition en orbite.
construction-permit-draft=Lance la procédure de permis au bureau. Le brouillon n'est pas encore juridiquement contraignant : il lui faut le tampon d'une imprimante.
construction-permit-printing=Finalise le permis de construire avec de l'encre et de l'autorité. Rien ne se construit sans l'un de ces documents.
safety-work-order-production=Autorise vos assembleurs à faire quoi que ce soit d'un peu dangereux, ce qui, dans cette bureaucratie, veut dire tout. Le permis d'assembleur de base.
construction-work-order-production=Autorisation d'assembleur intermédiaire. Vos machines sont passées de « probablement sûres » à « officiellement permises ».
management-verbal-work-order-production=Un manager a dit que c'était bon. Ça compte, non ? L'autorisation d'assembleur T3, soutenue par une promesse orale.
management-written-work-order-production=Autorisation d'assembleur de haut niveau avec une vraie signature. Le laissez-passer le plus cher de l'usine.
research-grant-work-order-production=La science exige du financement. Le financement exige de la paperasse. La paperasse exige des packs de science. Le cercle de la vie bureaucratique.
chemical-handling-work-order-production=Le permis d'exploitation pour usines chimiques. Combine paperasse de sécurité, environnementale et logistique en une autorisation très épaisse.
radiological-work-order-production=Le permis d'exploitation le plus élevé. Autorise les centrifugeuses à manipuler des matières nucléaires, à condition que la direction ait signé par écrit.
safety-work-order-printing=Court-circuite les étapes intermédiaires et imprime directement des ordres de travail de sécurité depuis les brouillons. Deux par fabrication : l'imprimante fait la combinaison.
construction-work-order-printing=Imprime les ordres de travail de construction directement depuis les brouillons. Deux par fabrication : plus rapide que de les assembler à la main.
dubious-data-batch=Raffine l'absurde à l'échelle industrielle. Un certificat couvre tout le lot : les régulateurs ne comptent pas les points de données individuels.
dubious-data-refining=Extrait quelque chose qui ressemble à de l'information à partir d'absurdité brute. Peu fiable, mais techniquement admissible comme donnée.
basic-excuse-production=Cinq informations peu fiables, compressées en une justification à l'air plausible. L'épine dorsale de la résolution des paysages.
crappy-report-production=Cinq points de données d'origine douteuse, agrafés ensemble et appelés rapport. La base de toute documentation de niveau supérieur.
politician-fluid-refining=Distille l'essence politique brute en tromperie liquide pure. La distillerie de propagande ne juge pas : elle raffine.
data-production=De véritables informations utilisables, une denrée rare. Apparaissent quand vous recoupez un rapport minable avec les accréditations de quelqu'un.
good-excuse-production=Mélange des données réelles avec des mensonges liquides jusqu'à ce que le résultat paraisse plausible. Essentiel pour les approbations de haut niveau et la construction de récits.
misinformation-production=Transforme le mensonge en arme à l'échelle fluide. Ingrédient clé des politiques, des justifications et de l'absurde raffiné.
justification-production=Argumentaire juridique formel bâti avec de la désinformation, des accréditations et de l'essence politique brute. Utilisé pour la construction de récits.
credentials-production=Preuve d'autorité, aussi douteuse qu'en soit la source. La bureaucratie ne vérifie pas : elle cherche seulement le tampon.
narrative-production=La version officielle, tissée au quartier général syndical. Contrôle la perception publique de votre administration.
white-paper-production=Document de politique faisant autorité. Se lit comme de la recherche, se finance comme de la corruption, et gouverne comme ni l'un ni l'autre.
policy-production=Le produit de réunions interminables, maintenant sous forme de directive. Alimente la chaîne réglementaire et les résolutions de niveau supérieur.
regulation-production=L'expression ultime de l'autorité gouvernementale. Exige une quantité absurde de financement et de données pour être rédigée.
promise-production=Document vague mais rassurant à lancer aux biters qui manifestent. Non contraignant, non spécifique, non permanent, mais il achète du temps.
eviction-notice-production=Autorité légale de détruire les structures de biters, compressée en forme jetable. Les biters ne partent pas : ils perdent simplement leur maison.
hush-money-production=Argent du contribuable fourré dans un sac jetable avec juste assez de paperasse pour donner à la corruption un air officiel. Réduit les nids au silence pendant 3 minutes.
rideable-biter=Affecte un travailleur biter au transport personnel. Le véhicule obtenu fonctionne à l'argent du contribuable, possède un tout petit inventaire, ne peut pas être retiré après placement, et redevient un biter plaignant s'il reste sans financement pendant 10 minutes.
job-offer-production=Rédige un contrat de travail. Placez-le dans un emplacement de bureau administratif avant la résolution. Avec Space Age, il est consommé à la tentative et produit un biter enrôlé : 75 % de chance jusqu'à 50 % de frustration inclus, 50 % jusqu'à 75 %, 25 % jusqu'à 90 %, puis 0 % ; formez-le au centre de formation.
biter-logistics-formation=Reforme un travailleur général pour des tâches logistiques à pied. La formation obtenue équipe les biterports et transporte des objets entre coffres.
union-delegate-training=Processus de certification épuisant impliquant paperasse formelle, jargon juridique et une consommation de café franchement excessive. Obligatoire pour construire le quartier général syndical.
chemical-operator-training=Certifie un biter pour la manipulation de produits chimiques dangereux. La formation est étonnamment rigoureuse pour une créature qui crachait autrefois de l'acide gratuitement.
nuclear-technician-training=Forme un biter à la sécurité radiologique. Obligatoire pour les réacteurs et centrifugeuses : vous ne voulez pas de faune non licenciée près de l'uranium enrichi.
filing-landscape=Reconnaît officiellement que vous avez ravagé le paysage. Première étape pour faire semblant de vous en soucier.
filing-smog=La paperasse des plaintes de smog est plus épaisse que le smog lui-même. Son traitement prend plus longtemps que prévu.
filing-noise=Documenter les nuisances sonores est, ironiquement, un processus très bruyant. Exige un temps de traitement conséquent.
filing-unemployment=Dépose la preuve que personne ne travaille. La personne qui dépose cette preuve travaille. Le dépôt biter le plus complexe.
filing-littering=Catalogue formellement les emplacements de flaques d'acide pour le dossier. Point d'entrée de la résolution des plaintes de spitters.
filing-hazmat=Le dépôt lui-même peut exiger des procédures de manipulation de matières dangereuses. Prévoyez un temps de traitement plus long.
filing-loitering=Criminalise le fait de rester au mauvais endroit. Sommet de la bureaucratie. Exige une documentation étendue de zone réglementée.
filing-vagrancy=Documente le déplacement avec le même système qui l'a causé. Le dépôt spitter le plus complexe.
case-smog=Élève un dépôt de smog en dossier prêt pour le tribunal. La preuve est littéralement dans l'air, mais il la faut quand même sur papier.
case-noise=Transforme un dépôt de bruit en dossier poursuivable. Exige des données solides et une certification environnementale : le ouï-dire ne tient pas au tribunal biter.
case-unemployment=Prouve l'échec économique systémique avec assez de paperasse pour employer un petit bureau. Exige un financement garanti par l'État pour être traité.
case-hazmat=Compile des preuves physiques et un dépôt en dossier de poursuite hazmat. Les échantillons de gravats sont structurellement indispensables.
case-loitering=Construit un argument juridique selon lequel rester immobile est un crime. Exige accréditations, données et juste assez d'absurde raffiné pour tenir debout.
case-vagrancy=Assemble un dossier de déplacement soutenu par une politique. Le plus lourd travail de dossier spitter : il vous faut une directive rien que pour l'ouvrir.
brief-noise=Vestige d'une époque plus procédurière. Conservé pour la compatibilité des sauvegardes : les tribunaux ont depuis rationalisé.
brief-unemployment=Du temps où les affaires de chômage montaient jusqu'à la cour suprême. Conservé pour la compatibilité des sauvegardes.
brief-loitering=Artefact de l'ancienne chaîne de poursuite pour flânerie. Conservé pour la compatibilité des sauvegardes.
brief-vagrancy=Mémoire de cour suprême datant de l'époque où le vagabondage exigeait l'autorité judiciaire maximale. Conservé pour la compatibilité des sauvegardes.
landscape-final=La résolution la plus simple. Une excuse, un dépôt, un biter satisfait. Si seulement elles étaient toutes aussi faciles.
smog-final=Déclare officiellement la qualité de l'air acceptable. Exige de la désinformation et du café : la vérité prendrait trop de temps.
noise-final=Abat le marteau sur une affaire de bruit. Décision lourde qui consomme politique, accréditations, récits et une quantité franchement déraisonnable de café.
unemployment-final=Résout le chômage par pur volume de paperasse. Vous n'avez pas créé d'emplois : vous avez créé assez de formulaires pour prétendre l'avoir fait.
littering-final=Reclasse les flaques d'acide comme particularité naturelle du paysage. Résolution légère : un rapport et un dépôt suffisent.
hazmat-final=Certifie que les matières dangereuses ont été correctement mal gérées. Exige désinformation et café : les solvants bureaucratiques standards.
loitering-final=Décision historique établissant que rester immobile n'est plus un crime, dans ce cas précis. Exige réglementations, récits, accréditations et café.
vagrancy-final=La résolution spitter ultime. Vous avez résolu le sans-abrisme, ou du moins généré assez de paperasse pour fermer le dossier.
iron-plate-batch=Fonte du fer autorisée. Un certificat couvre tout le lot : les régulateurs comptent les passages, pas les lingots.
copper-plate-batch=Fonte du cuivre autorisée. Un certificat par lot. L'impact environnemental est soigneusement ignoré.
steel-plate-batch=Traitement de l'acier autorisé. Le certificat se consume plus vite que le fer. Ça vaut le débit gagné.
stone-brick-batch=Maçonnerie autorisée. Même les briques ont besoin d'une compensation carbone dans cette économie.
greenhouse-wood=Production de bois renouvelable. Les arbres repoussent, la paperasse non.
greenhouse-discovery=Fouille le compost humide en espérant trouver des grains de café. 10 % de chance par cycle. Vous récupérez toujours un peu de bois, mais jamais autant que vous en avez mis.
synthetic-paper-production=Papeterie dérivée du pétrole pour alimenter une paperasse à haut débit. Plus rapide que faire pousser des arbres, mais la facture chimique grimpe vite.
coffee-plantation=Plante des grains, ajoute de l'eau, récolte cinq grains en une demi-minute. La chaîne d'approvisionnement la plus importante de l'usine.
coffee-refining=Prépare le fluide vital de la bureaucratie. Un ordre de travail garantit que le café est officiellement autorisé.
corporate-breakroom-production=Chaque bureau a besoin d'un endroit où la productivité vient mourir. Produit aussi des rumeurs, qui sont inexplicablement essentielles.
watercooler-gossip-production=Verse du café sur des données douteuses et observe quelles rumeurs en sortent. Essentiel à la prise de décision d'entreprise.
osha-scrubbing=Fait disparaître les infractions de sécurité au travail par application correcte d'absurdité et de consentement syndical. Produit des justifications.
osha-violation-recycling=Réinjecte les infractions dans la machine syndicale et regarde quelle paperasse en tombe. Moins cher que le nettoyage, mais vous prenez ce qui vient.
office-drama-recycling=Ajoute du café à un conflit interpersonnel et secoue. Produit aléatoirement des ordres de travail, des rumeurs ou des excuses : les trois piliers de la culture de bureau.
resolution-office-production=L'endroit où les plaintes vont pour être résolues, ou au moins reclassées. Le pilier de votre chaîne de résolution.
copy-blank-form=Production industrielle de vide. L'efficacité à son sommet. Petite chance de papier gâché.
copy-blank-approval=Un modèle d'approbation entre, six en sortent. L'original est indiscernable des copies, et c'est justement le but.
copy-blank-directive=Imprime en masse des modèles de directives haute sécurité. La triple application d'encre est fidèlement reproduite, sinon l'intention originale.
copy-carbon-offset-certificate=Copie de documents de conformité environnementale sur imprimante industrielle. L'ironie n'échappe à personne.
copy-form-27b-6=Le formulaire qui se reproduit. Un entre, six sortent. Kafka serait fier.
copy-environmental-impact-report=Copie le rapport d'impact avant que quelqu'un ne le lise de trop près. Six évaluations identiques des mêmes dégâts.
copy-work-order=Alimente vos assembleurs avec un flux constant de paperasse d'autorisation. Un original, six permissions.
copy-safety-work-order=Conformité de sécurité à l'échelle industrielle. Imprime assez de décharges pour couvrir chaque machine de l'atelier.
copy-construction-work-order=Duplique les permis de construire pour que votre expansion ne soit jamais bloquée par une seule signature.
copy-management-verbal-work-order=Reproduit six fois la promesse orale d'un manager. Chaque copie est tout aussi non contraignante.
copy-management-written-work-order=Six copies d'une directive signée par la direction. Chacune est notariée, contraignante et impossible à nier.
copy-research-grant-work-order=Multiplie les autorisations de financement de recherche pour que les laboratoires ne s'éteignent jamais. Le comité des subventions n'a pas besoin de le savoir.
copy-chemical-handling-work-order=Duplique les permis d'exploitation dangereux. La sécurité est une affaire de nombres, et six est plus sûr qu'un.
copy-radiological-work-order=Copie la paperasse d'autorisation nucléaire à vitesse industrielle. Chaque copie rayonne de la même autorité légale que l'original.
office-desk-production=Le centre nerveux de votre empire de papier. Si ce n'est pas sur ce bureau, ça n'existe pas.
admin-station-production=Le guichet de la gouvernance civilisée. Les biters y font la queue, y déposent des plaintes et, avec assez de paperasse, en repartent satisfaits.
union-headquarters-production=Monument tentaculaire au travail organisé. Le premier se construit avec des obligations et des promesses verbales, puis devient le coeur battant des politiques de fin de partie.
propaganda-distillery-production=Fabrique le consentement, un baril à la fois. Convertit le fluide politicien en mensonges, désinformation et autres sous-produits essentiels de gouvernance.
greenhouse-production=Installation climatisée pour les deux piliers de la bureaucratie : du bois pour le papier, et du café pour les gens qui le poussent.
printer-t1-production=Votre première imprimante électrique. Lente, fiable et définitivement bourrée dans l'esprit, sinon dans les faits.
printer-t2-production=Améliore votre infrastructure d'impression avec la capacité de copie. Un document entre, six sortent. L'exploitation planétaire exige une autorisation de travailleur biter ; l'exploitation en plateforme utilise une autorisation permanente embarquée.
mechanical-printer-production=Bête de somme à manivelle de l'ère préélectrique. Lente, mais elle met les formulaires en mouvement.
pneumatic-pipe-production=Tubes scellés pour expédier la paperasse à grande vitesse dans votre usine. Les tuyaux ordinaires sont pour les liquides, pas pour le jargon juridique.
pneumatic-pipe-to-ground-production=Fait passer les tubes pneumatiques sous les bâtiments et les tapis. Portée souterraine de 16 cases.
tube-intake-production=La bretelle d'entrée de votre réseau pneumatique. Insérez la paperasse, elle apparaît instantanément à toute sortie connectée.
tube-outtake-production=La bretelle de sortie de votre réseau pneumatique. Définissez un filtre pour demander le type précis de formulaire requis.
speed-module=Rédige une menace juridique forçant les machines à produire plus vite. L'excuse a intérêt à justifier la facture d'énergie.
speed-module-2=Fait monter l'assignation d'un cran. Quatre copies de la menace originale, améliorées avec de meilleures excuses et des circuits plus persuasifs.
speed-module-3=Assignation fédérale appuyée par des récits, des accréditations et tout le poids du système judiciaire. Accélération légale maximale.
productivity-module=Lance une enquête interne qui arrache du rendement supplémentaire à chaque cycle. Les auditeurs sont minutieux, mais lents.
productivity-module-2=Élargit le périmètre de l'audit. Quatre conclusions préliminaires, renforcées par de vraies données, produisent un examen plus profond.
productivity-module-3=Enquête fédérale complète. Quatre audits antérieurs, des justifications et des accréditations fusionnent en la supervision la plus productive et la plus intrusive possible.
efficiency-module=Trafique les comptes d'énergie. Un rapport minable et quelques fils font mentir le compteur juste assez.
efficiency-module-2=Fraude comptable plus audacieuse. Quatre montages précédents et quelques livres blancs produisent une comptabilité nettement plus créative.
efficiency-module-3=Montage de Ponzi complet appliqué à la comptabilité énergétique. Quatre modules de détournement antérieurs, une couverture politique et des accréditations : les auditeurs ne verront rien.
union-approval-production=Obtient le consentement des travailleurs par l'ancien rituel du café, des données et du financement public. Rien ne bouge sans la bénédiction du syndicat.
treasury-bond-production=Emballe des fonds publics dans un instrument financier négociable. La documentation est inutile, mais juridiquement obligatoire.
government-grant-production=Convertit des obligations du Trésor en allocation majeure de financement. Exige la promesse verbale d'un manager et un rapport que personne ne lira.
tax-audit=Reclasse l'argent blanchi en revenus légitimes. La paperasse entre sale et ressort propre, et d'une manière ou d'une autre multipliée.
slush-fund-production=Convertit des obligations gouvernementales légitimes en actifs liquides intraçables. Totalement régulier. Ne posez pas de questions.
useless-documentation-production=Documente officiellement l'inutilité. Le résultat devient malgré tout un intrant obligatoire pour les instruments financiers et le dépôt standardisé.
compacted-rubble-production=Compresse les déchets bureaucratiques en matériau de construction standardisé. Le certificat prouve que la compression était écologiquement responsable.
compacted-rubble-electric=Compresse les gravats redondants une unité à la fois dans un four électrique sans consommer de certificat de compensation carbone.
charcoal-production=Source renouvelable de charbon, à condition d'avoir des serres qui produisent du bois. Le certificat couvre les émissions.
refined-nonsense-production=L'épine dorsale de la bureaucratie de haut niveau. Créée quand des déchets physiques rencontrent du mensonge liquide et qu'aucun des deux ne recule.
overtime-exemption=Autorise un seul bâtiment à fonctionner après la tombée de la nuit. L'emplacement de module se moque de votre équilibre vie-travail : il veut seulement votre réserve de café.
orbital-employment-catapult=Construit une catapulte de déploiement longue portée, avec une portée de 56 cases et un corridor de tir étroit de 18°. Elle lance visiblement des mineurs spatiaux volontaires sur les astéroïdes. La recherche étend la dotation de chaque astéroïde d'un à cinq mineurs ; les démolitions terminées produisent la récupération complète plus un fragment d'employé récupérable par mineur.
archive-form-reassignment=Consomme un formulaire dans le Bureau de réaffectation des archives. Chaque formulaire de remplacement listé est tiré indépendamment à 25 % de probabilité.
safety-waiver-approval=Soumettez une décharge de sécurité non approuvée pour approbation par l'administration biter à un Guichet des pétitions proche.
provisional-work-order-production=L'habilitation d'assemblage avant toute entrée. Vos machines n'ont même pas commencé, mais la paperasse, si.
radiological-work-order-approval=Soumettez un ordre de travail radiologique non approuvé pour approbation par l'administration biter à un Guichet des pétitions proche.
chromatic-printer=Construisez une plateforme d'impression chromatique pour l'expansion de la paperasse Space Age.
conciliation-desk=Construisez le bureau de certification compact de Gleba pour le traitement des exceptions en formulaire jaune.
notary-office=Construisez un bureau de certification vulcanien haut de gamme pour les sceaux, chartes, homologations et la paperasse de lancement de secours.
territorial-arbitration-post=Construisez un bureau de terrain vulcanien blindé au tungstène qui alimente directement la paperasse de réinstallation des démolisseurs à l'intérieur du territoire contesté.
amber-sap-nonsense-seeding=Utilisez la sève ambrée et la biologie de Gleba pour précipiter du minerai de foutaises local sans importer toute l'économie du non-sens.
ink-production-gleba=Produisez de l'encre d'écriture solide à partir de sève ambrée et de nutriments plutôt que de charbon.
carbon-offset-certificate-basic-gleba=Émettez un certificat de compensation carbone basique à partir de formulaires vierges, de sève ambrée et de biologie locale plutôt que de charbon.
management-approval-written-gleba=La seule exception locale de paperasse exécutive : les pièces de fusée consomment des approbations en masse, donc la conciliation de Gleba convertit lentement des registres biologiques périssables en approbations.
yellow-ink-production=Raffinez la sève ambrée et les nutriments en encre jaune de Gleba pour la famille compacte de paperasse jaune.
hostile-spore-culture-production=Cultivez la culture de spores exclusive à Gleba utilisée par tous les fluides-leurres du Bureau des acquisitions. Nécessite une Biochambre.
workforce-lure-spores-production=Imprégnez des spores importées de Gleba avec des offres d'emploi et des habilitations pour que les Bureaux des acquisitions attirent des biters pour le recrutement. Nécessite une Biochambre.
tourism-lure-spores-production=Imprégnez des spores importées de Gleba avec de la paperasse de transit pour que les Bureaux des acquisitions attirent des cracheurs pour le conditionnement touristique. Nécessite une Biochambre.
oviposition-lure-spores-production=Imprégnez des spores de Gleba avec des registres biologiques expérimentaux pour que les Bureaux des acquisitions attirent des pentapodes pour la récolte d'oeufs. Nécessite une Biochambre.
mycelial-form-stock=Imprimez le papier à formulaire mycélien jaune fibreux utilisé par la bureaucratie d'exception locale de Gleba.
blank-yellow-form-production=Imprimez des formulaires jaunes vierges pour le Bureau de conciliation.
symbiosis-record=Finalisez un document de registre biologique compact à partir d'un formulaire jaune vierge, de données douteuses et de nutriments.
conciliation-order=Émettez un ordre d'exception jaune de Gleba à partir d'un formulaire jaune vierge, d'un registre de symbiose et de café.
capture-bureau=Construisez le bureau d'acquisitions hostiles de Gleba, tenu par des biters travailleurs, à partir de paperasse de construction émise localement.
petition-counter=Construisez un guichet compact d'approbation biter-gouvernement pour tamponner les pétitions de permis près des nids actifs.
digital-services-bureau=Construisez la mise à niveau informatisée de Fulgora pour un débit administratif rapide et permanent.
charged-toner=Récupérez une base de toner magenta depuis le rebut récupéré de Fulgora.
transfer-emulsion-production=Stabilisez un support de transfert cryogénique pour la bureaucratie d'impression solide d'Aquilo.
thermal-transfer-sheet-production=Préparez le support d'impression solide utilisé par l'Imprimante laser.
composite-chroma-ribbon-production=Assemblez un support CMJ haut de gamme à partir de formulaires colorés importés et de support de transfert d'Aquilo.
cyan-yellow-form-production=Imprimez un formulaire cyan-jaune à double encre directement à partir d'encres cyan et jaune liquides.
cyan-magenta-form-production=Imprimez un formulaire cyan-magenta à double encre directement à partir d'encres cyan et magenta liquides.
yellow-magenta-form-production=Imprimez un formulaire jaune-magenta à double encre directement à partir d'encres jaune et magenta liquides.
hardened-data-vault-production=Scellez les ordres de récupération de Fulgora dans la paperasse de garde industrielle de Vulcanus pour les audits orbitaux tardifs.
trichromatic-permit-production=Émettez le permis trois couleurs utilisé par les recettes couvrant toutes les administrations Space Age précoces.
unified-operations-charter-production=Assemblez une charte interplanétaire ultime à partir de la plus haute famille de paperasse de chaque planète.
cryogenic-operations-license-production=Émettez la licence autorisant la chimie cryogénique et les opérations d'usine d'Aquilo.
public-transportation-contract=Fusionnez la paperasse cyan de Vulcanus avec les formulaires jaunes de Gleba en un contrat de routage public qui contourne le permis de transit de routine.
public-train-stop-production=Construisez un arrêt de train public fonctionnant sans exigence d'autorisation de transit — l'accomplissement bureaucratique ultime.
anecdotal-data-reprocessing=Transformez de la pourriture importée et un formulaire jaune-magenta en un lot rapide et renouvelable de données douteuses.
archive-rubble-recovery=Récupérez des gravats d'archives de Fulgora depuis le rebut.
archive-documentation-recovery=Récupérez de la paperasse de remplissage archivée depuis le rebut et le toner.
magenta-ink-production=Mélangez le toner chargé en encre magenta de Fulgora pour la paperasse d'archives et électromagnétique.
signal-form-stock=Imprimez le support de formulaire magenta utilisé par la famille de paperasse numérique de Fulgora.
blank-magenta-form-production=Imprimez des formulaires magenta vierges pour la paperasse d'archives et d'exploitation de Fulgora.
archive-recovery-permit=Émettez un permis de reconstruction par rebut à partir de paperasse magenta, de toner chargé et de documentation récupérée.
digital-processing-certificate=Émettez un certificat de débit informatisé à partir de paperasse magenta, de données et d'unités de traitement.
electromagnetic-operating-license=Émettez la licence d'exploitation exportée utilisée par l'infrastructure électromagnétique et l'industrie riche en holmium.
data-recovery-order=Émettez un ordre de routage de récupération pour reconstruire la paperasse archivée depuis le rebut.
liquid-black-ink=Convertissez l'encre noire solide en approvisionnement fluide alimenté par tuyau pour l'impression chromatique.
electromagnetic-lubricant-fulgora=L'électrolyte, le toner chargé et le carburant solide donnent le petit mais coûteux approvisionnement en lubrifiant nécessaire aux moteurs électriques de Fulgora. Ne produit ni pétrole brut ni produits de raffinerie.
composted-rubble-recovery-gleba=Récupérez lentement les gravats redondants nécessaires à la paperasse environnementale canonique depuis la pourriture, les registres biologiques et la sève ambrée.
dubious-data-analysis-vulcanus=Extrayez des données douteuses locales depuis le vert-de-gris pour que Vulcanus amorce son propre arbre de permis.
cyan-slurry-production=Liquéfiez le vert-de-gris en boue cyan pour la bureaucratie chromatique de Vulcanus.
cyan-ink-production=Raffinez la boue cyan en encre cyan pour l'impression chromatique alimentée en liquide.
heatproof-form-stock=Imprimez le papier à formulaire thermorésistant de Vulcanus à l'aide d'encre cyan et d'acide sulfurique.
blank-cyan-form-production=Imprimez la papeterie cyan thermorésistante qui alimente toute la chaîne de paperasse notariale de Vulcanus.
permit-draft=Imprimez une coquille de permis cyan réutilisable pour notarisation ultérieure.
inspection-docket=Imprimez une coquille d'examen industriel réutilisable pour les chartes, excuses et la distillation de mensonges.
embossed-seal=Pressez un sceau gaufré haut de gamme à partir de boue cyan et de documentation inutile.
industrial-charter=Certifiez une charte industrielle à partir de la paperasse de brouillon locale de Vulcanus.
territorial-resettlement-order=Assemblez le dense dossier de réinstallation vulcanien utilisé pour négocier la retraite des démolisseurs case par case.
territorial-deed=Certificat officiel de revendication foncière émis lorsque le territoire des démolisseurs est arbitré avec succès. C'est une preuve de conflit, pas une approbation exécutive imprimable localement.
liquid-stimulant-production=Distillez un concentré stimulant à base de boue cyan qui remplace l'agriculture sur Vulcanus.
liquid-coffee-vulcanus=Transformez le concentré stimulant et le carbone en substitut de café utilisé par les bureaux de Vulcanus.
molten-promises-production=Liquéfiez la lave et la boue cyan en un précurseur industriel riche en rhétorique.
thermal-process-license=Légalisez un procédé à haute température à l'aide d'un formulaire cyan vierge, de mensonges et d'un sceau.
calcite-reagent-waiver=Légalisez la chimie de procédé riche en calcite à l'aide d'un formulaire cyan vierge et de données douteuses.
offworld-metallurgy-charter=Combinez la paperasse thermique et de calcite de Vulcanus dans la charte d'exportation requise par la métallurgie extraplanétaire.
vulcanus-lie-distillation=Transformez les promesses en fusion et la paperasse d'inspection en un énorme volume de mensonges, plus un filet de données douteuses.
formation-center=Construisez un centre dédié à la bureaucratie de main-d'oeuvre pour transformer des biters enrôlés en personnel administratif formé.
administrative-space-station=Construisez le seul bureau administratif homologué pour le vide. Il produit de la paperasse orbitale pour la métallurgie extraplanétaire, le traitement d'astéroïdes et le travail de déviation.
orbital-infrastructure-permit=Convertissez une directive, une autorisation de transit, de la science spatiale et une unité de traitement en un permis reconnu par l'infrastructure Administratorio réservée au vide.
worker-biter-formation=Convertissez un biter enrôlé en travailleur utilisable sur Nauvis grâce à des habilitations et des excuses, sans consommer d'argent public.
trajectory-compliance-array=Construisez un réseau de déviation junior alimenté qui repousse visiblement les petits et moyens astéroïdes loin de la plateforme sans produire de rebut.
senior-trajectory-compliance-array=Améliorez le réseau avec une juridiction interplanétaire, une portée de 30 cases et l'autorité d'appliquer des poussées à masse limitée aux gros astéroïdes.
executive-trajectory-compliance-array=Ajoutez une confiance exécutive assistée par quantique, une portée de 40 cases et l'autorité de coordonner des poussées superposées contre d'énormes astéroïdes avant l'existence de la recherche Administratorium.
clerical-trainee-formation=Orientez un biter travailleur vers la filière administrative pour des rôles de spécialiste riches en paperasse.
management-trainee-formation=Orientez un biter travailleur vers la filière de gestion pour les négociateurs et l'absurdité exécutive.
astronaut-formation=Formez un spécialiste orbital de la filière gestion pour la paperasse sous vide et l'administration de plateforme spatiale.
night-shift-supervisor-formation=Spécialisez un stagiaire administratif en superviseur de nuit.
licensed-notary-formation=Spécialisez un stagiaire administratif en notaire vulcanien pour le travail lié aux fonderies.
conciliation-officer-formation=Spécialisez un stagiaire administratif en agent de conciliation de Gleba.
relay-clerk-formation=Spécialisez un stagiaire administratif en commis relais de Fulgora.
cryoprint-technician-formation=Spécialisez un stagiaire administratif en technicien cryo-impression d'Aquilo.
field-negotiator-formation=Spécialisez un stagiaire manager en négociateur de terrain pour le travail d'expropriation et de répression des manifestations.
middle-management-managing-manager-formation=Promouvez un stagiaire manager en manager absurde et réutilisable sur Nauvis. Le manager peut ensuite être rebriefé à bas coût sur n'importe quelle planète.
voluntary-exploration-space-miner-formation=Équipez un astronaute d'une foreuse électrique sous la supervision simultanée de managers briefés en formation, conformité et opérations orbitales. Les trois managers reviennent immédiatement débriefés.
thermal-process-license-orbital=Émettez directement en orbite la paperasse de métallurgie thermique, sans dépendre de la chaîne notariale de Vulcanus.
calcite-reagent-waiver-orbital=Émettez directement en orbite la dérogation de fusion riche en calcite pour le soutien aux fonderies extraplanétaires.
offworld-metallurgy-charter-orbital=Assemblez la charte de métallurgie extraplanétaire finalisée à l'intérieur de la station administrative orbitale.
orbital-deviation-order=Émettez huit autorisations peu coûteuses de redirection d'astéroïdes à partir de formulaires localement renouvelables et de minerai de fer.
priority-orbital-deviation-order=Améliorez les ordres routiniers avec du cuivre, du soufre et de la calcite. Chaque ordre prioritaire applique deux fois la poussée soutenue.
orbital-paper-production=Transformez le carbone et l'eau de fonte en paperasse synthétique sans bois ni gravats terrestres.
orbital-ink-production=Combinez le carbone, le minerai de fer et l'eau de fonte en encre noire compatible avec le vide.
orbital-operations-form=Imprimez un grand lot de formulaires localement renouvelables pour le carburant, l'oxydant, la trajectoire et le travail de traitement de la plateforme.
orbital-archival-paper-production=Utilisez une sortie d'oxyde avancée pour enrober un lot à haut rendement de papier orbital.
orbital-secure-ink-production=Utilisez des sorties métalliques et carboniques avancées pour de l'encre authentifiée à haut rendement.
orbital-operations-form-copying=Utilisez une Imprimante industrielle ou laser pour multiplier les formulaires orbitaux avec authentification au cuivre conducteur.
asteroid-processing-docket-copying=Utilisez une Imprimante industrielle ou laser pour copier des dossiers de broyage certifiés sur support enrobé de calcite.
