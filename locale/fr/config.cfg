[achievement-description]
tube-terminus=Construire un Terminus interplanétaire. Un par planète, sauf à payer cher pour plus.
chromatic-trunk=Rechercher le Tronc pneumatique chromatique. Enfin, les formulaires trichromatiques peuvent voyager.
terms-and-conditions-apply=Formaliser la certification de Vulcanus et commencer à plaider contre le paysage.
organically-sourced-nonsense=Formaliser la conciliation de Gleba tout en prétendant que la paperasse est biodégradable.
file-not-found=Construire un Bureau de réaffectation des archives. Les originaux ne seront pas rendus.
frozen-pdf=Débloquer le tronc chromatique d'Aquilo et enfin arrêter d'envoyer de l'encre liquide dans un congélateur.
workforce-formation-achievement=Rechercher la Formation de la main-d'oeuvre. Vos biters ont désormais des plans de carrière.
administrative-space-station-achievement=Construire une Station spatiale administrative. Enfin, la bureaucratie orbitale.
trajectory-compliance-array-achievement=Construire un Réseau de conformité des trajectoires. Repousser les astéroïdes à coups de paperasse.
senior-trajectory-compliance-array=Construire un Réseau de conformité des trajectoires supérieur. Les gros cailloux ont besoin de gros formulaires.
executive-trajectory-compliance-array=Construire un Réseau de conformité des trajectoires exécutif. Aucun astéroïde ne fait appel de cette décision.
vesm-mass-production=Produire 10 Mineurs Spatiaux d'Exploration Volontaire par heure. Ça fait beaucoup de CV.
asteroid-miner-veteran=Récupérer 100 Mineurs Spatiaux Volontaires de retour. Bon retour, employé.
orbital-permit-mill=Produire 50 Permis d'infrastructure orbitale par heure. La construction spatiale exige des formulaires spatiaux.
chromatic-printing-achievement=Rechercher l'Impression chromatique. Maintenant en couleurs.
chromatic-printer-achievement=Construire une Imprimante chromatique. Quatre réservoirs d'encre, zéro compromis.
triple-ink-threat=Produire 100 Permis trichromatiques par heure. Cyan, magenta, jaune, et une touche de noir.
ink-hoarder=Produire 10 000 unités d'Encre. Le budget encre est un secret d'État.
cyan-magenta-yellow-black=Produire 1000 Rubans chroma composites. Toutes les couleurs de l'arc-en-ciel bureaucratique.
notary-public=Construire un Bureau notarial. Des sceaux officiels pour des accords officiels.
territorial-arbitrator=Construire un Poste d'arbitrage territorial. Les démolisseurs ont été assignés.
demolisher-eviction-specialist=Obtenir 5 Titres de propriété territoriale. Expulsés par la bureaucratie.
chartered-accountant=Produire 100 Chartes de métallurgie extraplanétaire. La propriété intellectuelle de Vulcanus, désormais sous juridiction interplanétaire.
conciliation-officer-achievement=Construire un Bureau de conciliation. La biologie rencontre la bureaucratie.
capture-bureau-achievement=Construire un Bureau des acquisitions. Salon de l'emploi pour la faune hostile.
space-tourism-mogul=Produire 500 Contrats de transport public. Le tourisme spatial : désormais avec paperasse.
symbiosis-specialist=Produire 100 Registres de symbiose par heure. Comptabilité de spécimens à grande échelle.
digital-services-bureau-achievement=Construire un Bureau des services numériques. Disponibilité 24h/24, zéro pause café.
archive-recombinator=Construire un Bureau de réaffectation des archives. Un formulaire entre, trois peut-être en sortent.
form-gambler=Traiter 1000 Vieilles archives. La maison gagne toujours, mais parfois vous obtenez un permis.
relay-clerk-corps=Former 10 Commis relais. Spécialistes du routage électromagnétique, prêts au service.
laser-printer-achievement=Construire une Imprimante laser. Aucune encre liquide ne survit au code vestimentaire d'Aquilo.
thermal-paper-pusher=Produire 5000 Feuilles de transfert thermique. Support haut de gamme pour planètes haut de gamme.
ribbon-collector=Produire 2000 Rubans chroma composites. Couleur compressée pour le vide incolore.
interplanetary-correspondent=Produire 50 Chartes d'opérations unifiées. L'aboutissement de la bureaucratie interplanétaire.
cyan-yellow-bureaucrat=Produire 500 Formulaires cyan-jaune. Vulcanus et Gleba, fusionnés.
cyan-magenta-bureaucrat=Produire 500 Formulaires cyan-magenta. Vulcanus et Fulgora, thermoscellés.
yellow-magenta-bureaucrat=Produire 500 Formulaires jaune-magenta. Gleba et Fulgora, archivés biologiquement.
hardened-data-hoarder=Produire 100 Coffres de données blindés. Garde de données pour l'apocalypse.
bureaucratic-transcendence-achievement=Rechercher la Transcendance bureaucratique. La paperasse n'est plus un goulot d'étranglement pour le transit.
form-free-transit=Construire 50 Arrêts de train publics. Des trains qui fonctionnent tout simplement. Un miracle.
maxed-out-orbital-capacity=Rechercher Capacité minière orbitale 4. Cinq mineurs par astéroïde. Approuvé par les RH.
maxed-out-orbital-damage=Rechercher Efficacité minière astéroïdale 5. Les mineurs frappent désormais comme une tonne de briques.
speed-demon-arrays=Rechercher Vitesse de conformité des trajectoires 9. Tirer des ordres de déviation toutes les demi-secondes.
executive-jurisdiction=Rechercher Juridiction astéroïdale exécutive. Toutes les tailles d'astéroïdes. Aucun appel possible.
vulcanus-export-licensed=Rechercher les Chartes d'exportation de Vulcanus. La métallurgie devient interplanétaire.
cyan-yellow-merged=Rechercher la Bureaucratie cyan-jaune. Deux planètes, un seul formulaire.
cyan-magenta-merged=Rechercher la Bureaucratie cyan-magenta. La métallurgie rencontre l'électromagnétisme.
yellow-magenta-merged=Rechercher la Bureaucratie jaune-magenta. La biologie rencontre le rebut.
research-with-promethium=Rechercher une technologie à l'aide de packs de science de l'Administratorium.
welcome-to-the-department=Construire votre premier bureau d'administration des biters. Votre box vous attend.
discovery-of-bullshit=Rechercher la découverte des foutaises. C'était juste sous vos pieds depuis le début.
ink-stained=Rechercher la technologie d'impression. L'imprimante est coincée. Encore.
form-27b-6-achievement=Produire 100 formulaires 27B/6 par heure. Vous n'avez toujours pas déposé votre 27B/6.
paper-pusher=Produire 1000 formulaires vierges par heure. Les arbres ne sont pas morts pour rien.
capsule-promise=Utiliser une capsule de promesse. Une promesse console les naïfs.
its-a-copy-of-a-copy=Rechercher les précédents locaux. D'une manière ou d'une autre, la copie est plus officielle que l'original.
permit-denied=Construire 10 arrêts de train. Aucun train ne circule sans paperasse.
coffee-break=Construire une salle de pause corporative. Enfin, le bâtiment le plus important.
pneumatic-delivery=Rechercher le transport pneumatique de formulaires. Woooosh ! Des formulaires dans les tubes. Quelle époque formidable.
propaganda-machine=Construire une distillerie de propagande. Fabriquer le consentement, un tonneau à la fois.
endless-meetings=Rechercher les réunions du conseil. Ça aurait quand même pu être un courriel.
union-strong=Construire un siège syndical. Les travailleurs se sont organisés. La direction s'inquiète.
environmental-compliance-achievement=Rechercher la conformité environnementale. L'économie pétrolière et chimique peut maintenant avancer sous paperasse appropriée.
constitutional-scholar=Rechercher le droit constitutionnel. Vous avez lu chaque règlement. Tous.
know-it-all=Rechercher toutes les technologies. Félicitations, vous êtes surqualifié.
eviction-notice-achievement=Utilisez 100 avis d'expulsion. Rien de personnel, c'est seulement la politique.
mass-transit=Faire parcourir plus de 2000 tuiles à un train. Chaque arrêt exige sa propre autorisation de transit.
first-complaint=Enregistrer votre premier biter dans un bureau administratif. Il a des préoccupations.
first-protest=Laisser la frustration d'un biter déborder en véritable manifestation. Vous l'aviez vu venir.
case-closed=Résoudre votre première plainte de biter. Une de faite, une infinité à venir.
protest-suppressed=Pacifier un biter manifestant avec une promesse. Le biter a été calmé par de vagues assurances.
department-of-everything=Avoir 10 bureaux administratifs alimentés simultanément. La bureaucratie s'étend pour répondre aux besoins de la bureaucratie qui s'étend.
full-resolution=Résoudre au moins une plainte de chacun des 8 types. Une plainte pour chaque occasion.
behemoth-paperwork=Enregistrer un biter béhémoth dans un bureau administratif. Ça fait... beaucoup de formulaires.
orbital-employment-catapult-achievement=Construisez une Catapulte Orbitale de Déploiement de Mineurs. Un canon-rail spatial, mais pour les ressources humaines.
