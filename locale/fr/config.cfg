transit-authorization-production=Documents de voyage officiels pour la logistique ferroviaire. Un formulaire consommé par arrivée : pas de formulaire, pas de train.

environmental-impact-report=Évaluation complète, quoique lourdement censurée, des dégâts environnementaux. Obligatoire pour les permis d'exploitation chimiques et radiologiques.
management-verbal-draft=Coincez un cadre près de la machine à café et faites-lui accepter quelque chose. Doit être finalisé à l'imprimante avant que quelqu'un puisse nier que c'est arrivé.
management-verbal-printing=Fixe une promesse orale sur papier avant que le cadre ne change d'avis. Produit l'approbation verbale officielle.
management-written-proposal=Rédige une proposition écrite au quartier général syndical. Exige une bonne excuse, un récit et une obligation du Trésor : les cadres ne signent pas gratuitement.
management-written-1st-printing=Finalise la proposition écrite en une passe d'impression lourde. Produit une approbation de la direction signée, notariée et impossible à nier.
research-grant-approval-production=L'autorisation de financement minimale viable. Les lots de science spatiale consomment ces approbations ordinaires après leur expédition en orbite.
construction-permit-draft=Lance la procédure de permis au bureau. Le brouillon n'est pas encore juridiquement contraignant : il lui faut le tampon d'une imprimante.
construction-permit-printing=Finalise le permis de construire avec de l'encre et de l'autorité. Rien ne se construit sans l'un de ces documents.

safety-work-order-production=Autorise vos assembleurs à faire quoi que ce soit d'un peu dangereux, ce qui, dans cette bureaucratie, veut dire tout. Le permis d'assembleur de base.
construction-work-order-production=Autorisation d'assembleur intermédiaire. Vos machines sont passées de « probablement sûres » à « officiellement permises ».
management-verbal-work-order-production=Un cadre a dit que c'était bon. Ça compte, non ? L'autorisation d'assembleur T3, soutenue par une promesse orale.
management-written-work-order-production=Autorisation d'assembleur de haut niveau avec une vraie signature. Le laissez-passer le plus cher de l'usine.
research-grant-work-order-production=La science exige du financement. Le financement exige de la paperasse. La paperasse exige des packs de science. Le cercle de la vie bureaucratique.
chemical-handling-work-order-production=Le permis d'exploitation pour usines chimiques. Combine paperasse de sécurité, environnementale et logistique en une autorisation très épaisse.
radiological-work-order-production=Le permis d'exploitation le plus élevé. Autorise les centrifugeuses à manipuler des matières nucléaires, à condition que la direction ait signé par écrit.
safety-work-order-printing=Court-circuite les étapes intermédiaires et imprime directement des ordres de travail de sécurité depuis les brouillons. Deux par fabrication : l'imprimante fait la combinaison.
construction-work-order-printing=Imprime les ordres de travail de construction directement depuis les brouillons. Deux par fabrication : plus rapide que de les assembler à la main.

dubious-data-batch=Raffine l'absurde à l'échelle industrielle. Un certificat couvre tout le lot : les régulateurs ne comptent pas les points de données individuels.
dubious-data-refining=Extrait quelque chose qui ressemble à de l'information à partir d'absurdité brute. Peu fiable, mais techniquement admissible comme donnée.
basic-excuse-production=Cinq informations peu fiables, compressées en une justification à l'air plausible. L'épine dorsale de la résolution des paysages.
crappy-report-production=Cinq points de données d'origine douteuse, agrafés ensemble et appelés rapport. La base de toute documentation de niveau supérieur.
politician-fluid-refining=Distille l'essence politique brute en tromperie liquide pure. La distillerie de propagande ne juge pas : elle raffine.
data-production=De véritables informations utilisables, une denrée rare. Apparaissent quand vous recoupez un rapport minable avec les accréditations de quelqu'un.
good-excuse-production=Mélange des données réelles avec des mensonges liquides jusqu'à ce que le résultat paraisse plausible. Essentiel pour les approbations de haut niveau et la construction de récits.
misinformation-production=Transforme le mensonge en arme à l'échelle fluide. Ingrédient clé des politiques, des justifications et de l'absurde raffiné.
justification-production=Argumentaire juridique formel bâti avec de la désinformation, des accréditations et de l'essence politique brute. Utilisé pour le nettoyage OSHA et la construction de récits.
credentials-production=Preuve d'autorité, aussi douteuse qu'en soit la source. La bureaucratie ne vérifie pas : elle cherche seulement le tampon.
narrative-production=La version officielle, tissée au quartier général syndical. Contrôle la perception publique de votre administration.
white-paper-production=Document de politique faisant autorité. Se lit comme de la recherche, se finance comme de la corruption, et gouverne comme ni l'un ni l'autre.
policy-production=Le produit de réunions interminables, maintenant sous forme de directive. Alimente la chaîne réglementaire et les résolutions de niveau supérieur.
regulation-production=L'expression ultime de l'autorité gouvernementale. Exige une quantité absurde de financement et de données pour être rédigée.
promise-production=Document vague mais rassurant à lancer aux biters qui manifestent. Non contraignant, non spécifique, non permanent, mais il achète du temps.
eviction-notice-production=Autorité légale de détruire les structures de biters, compressée en forme jetable. Les biters ne partent pas : ils perdent simplement leur maison.
hush-money-production=Argent du contribuable fourré dans un sac jetable avec juste assez de paperasse pour donner à la corruption un air officiel. Réduit les nids au silence pendant 3 minutes.
rideable-biter=Affecte un travailleur biter au transport personnel. Le véhicule obtenu fonctionne à l'argent du contribuable, possède un tout petit inventaire, ne peut pas être retiré après placement, et redevient un biter plaignant s'il reste sans financement pendant 10 minutes.
job-offer-production=Rédige un contrat de travail. Placez-le dans un emplacement de bureau administratif : un biter résolu le prend au lieu de partir. Vous obtenez un travailleur ; lui obtient une carrière.
biter-logistics-formation=Reforme un travailleur général pour des tâches logistiques à pied. La formation obtenue équipe les biterports et transporte des objets entre coffres.
union-delegate-training=Processus de certification épuisant impliquant paperasse formelle, jargon juridique et une consommation de café franchement excessive. Obligatoire pour construire le quartier général syndical.
chemical-operator-training=Certifie un biter pour la manipulation de produits chimiques dangereux. La formation est étonnamment rigoureuse pour une créature qui crachait autrefois de l'acide gratuitement.
nuclear-technician-training=Forme un biter à la sécurité radiologique. Obligatoire pour les réacteurs et centrifugeuses : vous ne voulez pas de faune non licenciée près de l'uranium enrichi.
filing-landscape=Reconnaît officiellement que vous avez ravagé le paysage. Première étape pour faire semblant de vous en soucier.
filing-smog=La paperasse des plaintes de smog est plus épaisse que le smog lui-même. Son traitement prend plus longtemps que prévu.
filing-noise=Documenter les nuisances sonores est, ironiquement, un processus très bruyant. Exige un temps de traitement conséquent.
filing-unemployment=Dépose la preuve que personne ne travaille. La personne qui dépose cette preuve travaille. Le dépôt biter le plus complexe.
filing-littering=Catalogue formellement les emplacements de flaques d'acide pour le dossier. Point d'entrée de la résolution des plaintes de spitters.
filing-hazmat=Le dépôt lui-même peut exiger des procédures de manipulation de matières dangereuses. Prévoyez un temps de traitement plus long.
filing-loitering=Criminalise le fait de rester au mauvais endroit. Sommet de la bureaucratie. Exige une documentation étendue de zone réglementée.
filing-vagrancy=Documente le déplacement avec le même système qui l'a causé. Le dépôt spitter le plus complexe.
case-smog=Élève un dépôt de smog en dossier prêt pour le tribunal. La preuve est littéralement dans l'air, mais il la faut quand même sur papier.
case-noise=Transforme un dépôt de bruit en dossier poursuivable. Exige des données solides et une certification environnementale : le ouï-dire ne tient pas au tribunal biter.
case-unemployment=Prouve l'échec économique systémique avec assez de paperasse pour employer un petit bureau. Exige un financement garanti par l'État pour être traité.
case-hazmat=Compile des preuves physiques et un dépôt en dossier de poursuite hazmat. Les échantillons de gravats sont structurellement indispensables.
case-loitering=Construit un argument juridique selon lequel rester immobile est un crime. Exige accréditations, données et juste assez d'absurde raffiné pour tenir debout.
case-vagrancy=Assemble un dossier de déplacement soutenu par une politique. Le plus lourd travail de dossier spitter : il vous faut une directive rien que pour l'ouvrir.
brief-noise=Vestige d'une époque plus procédurière. Conservé pour la compatibilité des sauvegardes : les tribunaux ont depuis rationalisé.
brief-unemployment=Du temps où les affaires de chômage montaient jusqu'à la cour suprême. Conservé pour la compatibilité des sauvegardes.
brief-loitering=Artefact de l'ancienne chaîne de poursuite pour flânerie. Conservé pour la compatibilité des sauvegardes.
brief-vagrancy=Mémoire de cour suprême datant de l'époque où le vagabondage exigeait l'autorité judiciaire maximale. Conservé pour la compatibilité des sauvegardes.
landscape-final=La résolution la plus simple. Une excuse, un dépôt, un biter satisfait. Si seulement elles étaient toutes aussi faciles.
smog-final=Déclare officiellement la qualité de l'air acceptable. Exige de la désinformation et du café : la vérité prendrait trop de temps.
noise-final=Abat le marteau sur une affaire de bruit. Décision lourde qui consomme politique, accréditations, récits et une quantité franchement déraisonnable de café.
unemployment-final=Résout le chômage par pur volume de paperasse. Vous n'avez pas créé d'emplois : vous avez créé assez de formulaires pour prétendre l'avoir fait.
littering-final=Reclasse les flaques d'acide comme particularité naturelle du paysage. Résolution légère : un rapport et un dépôt suffisent.
hazmat-final=Certifie que les matières dangereuses ont été correctement mal gérées. Exige désinformation et café : les solvants bureaucratiques standards.
loitering-final=Décision historique établissant que rester immobile n'est plus un crime, dans ce cas précis. Exige réglementations, récits, accréditations et café.
vagrancy-final=La résolution spitter ultime. Vous avez résolu le sans-abrisme, ou du moins généré assez de paperasse pour fermer le dossier.

iron-plate-batch=Fonte du fer autorisée. Un certificat couvre tout le lot : les régulateurs comptent les passages, pas les lingots.
copper-plate-batch=Fonte du cuivre autorisée. Un certificat par lot. L'impact environnemental est soigneusement ignoré.
steel-plate-batch=Traitement de l'acier autorisé. Le certificat se consume plus vite que le fer. Ça vaut le débit gagné.
stone-brick-batch=Maçonnerie autorisée. Même les briques ont besoin d'une compensation carbone dans cette économie.
greenhouse-wood=Production de bois renouvelable. Les arbres repoussent, la paperasse non.
greenhouse-discovery=Fouille le compost humide en espérant trouver des grains de café. 10 % de chance par cycle. Vous récupérez toujours un peu de bois, mais jamais autant que vous en avez mis.
synthetic-paper-production=Papeterie dérivée du pétrole pour alimenter une paperasse à haut débit. Plus rapide que faire pousser des arbres, mais la facture chimique grimpe vite.
coffee-plantation=Plante des grains, ajoute de l'eau, récolte cinq grains en une demi-minute. La chaîne d'approvisionnement la plus importante de l'usine.
coffee-refining=Prépare le fluide vital de la bureaucratie. Un ordre de travail garantit que le café est officiellement autorisé.
corporate-breakroom-production=Chaque bureau a besoin d'un endroit où la productivité vient mourir. Produit aussi des rumeurs, qui sont inexplicablement essentielles.
watercooler-gossip-production=Verse du café sur des données douteuses et observe quelles rumeurs en sortent. Essentiel à la prise de décision d'entreprise.
osha-scrubbing=Fait disparaître les infractions de sécurité au travail par application correcte d'absurdité et de consentement syndical. Produit des justifications.
osha-violation-recycling=Réinjecte les infractions dans la machine syndicale et regarde quelle paperasse en tombe. Moins cher que le nettoyage, mais vous prenez ce qui vient.
office-drama-recycling=Ajoute du café à un conflit interpersonnel et secoue. Produit aléatoirement des ordres de travail, des rumeurs ou des excuses : les trois piliers de la culture de bureau.
resolution-office-production=L'endroit où les plaintes vont pour être résolues, ou au moins reclassées. Le pilier de votre chaîne de résolution.
copy-blank-form=Production industrielle de vide. L'efficacité à son sommet. Petite chance de papier gâché.
copy-blank-approval=Un modèle d'approbation entre, six en sortent. L'original est indiscernable des copies, et c'est justement le but.
copy-blank-directive=Imprime en masse des modèles de directives haute sécurité. La triple application d'encre est fidèlement reproduite, sinon l'intention originale.
copy-carbon-offset-certificate=Copie de documents de conformité environnementale sur imprimante industrielle. L'ironie n'échappe à personne.
copy-form-27b-6=Le formulaire qui se reproduit. Un entre, six sortent. Kafka serait fier.
copy-environmental-impact-report=Copie le rapport d'impact avant que quelqu'un ne le lise de trop près. Six évaluations identiques des mêmes dégâts.
copy-work-order=Alimente vos assembleurs avec un flux constant de paperasse d'autorisation. Un original, six permissions.
copy-safety-work-order=Conformité de sécurité à l'échelle industrielle. Imprime assez de décharges pour couvrir chaque machine de l'atelier.
copy-construction-work-order=Duplique les permis de construire pour que votre expansion ne soit jamais bloquée par une seule signature.
copy-management-verbal-work-order=Reproduit six fois la promesse orale d'un cadre. Chaque copie est tout aussi non contraignante.
copy-management-written-work-order=Six copies d'une directive signée par la direction. Chacune est notariée, contraignante et impossible à nier.
copy-research-grant-work-order=Multiplie les autorisations de financement de recherche pour que les laboratoires ne s'éteignent jamais. Le comité des subventions n'a pas besoin de le savoir.
copy-chemical-handling-work-order=Duplique les permis d'exploitation dangereux. La sécurité est une affaire de nombres, et six est plus sûr qu'un.
copy-radiological-work-order=Copie la paperasse d'autorisation nucléaire à vitesse industrielle. Chaque copie rayonne de la même autorité légale que l'original.
office-desk-production=Le centre nerveux de votre empire de papier. Si ce n'est pas sur ce bureau, ça n'existe pas.
admin-station-production=Le guichet de la gouvernance civilisée. Les biters y font la queue, y déposent des plaintes et, avec assez de paperasse, en repartent satisfaits.
union-headquarters-production=Monument tentaculaire au travail organisé. Le premier se construit avec des obligations et des promesses verbales, puis devient le coeur battant des politiques de fin de partie.
propaganda-distillery-production=Fabrique le consentement, un baril à la fois. Convertit le fluide politicien en mensonges, désinformation et autres sous-produits essentiels de gouvernance.
greenhouse-production=Installation climatisée pour les deux piliers de la bureaucratie : du bois pour le papier, et du café pour les gens qui le poussent.
printer-t1-production=Votre première imprimante électrique. Lente, fiable et définitivement bourrée dans l'esprit, sinon dans les faits.
printer-t2-production=Améliore votre infrastructure d'impression avec la capacité de copie. Un document entre, six sortent. Exige une autorisation de travailleur biter à chaque fabrication.
mechanical-printer-production=Bête de somme à manivelle de l'ère préélectrique. Lente, mais elle met les formulaires en mouvement.
pneumatic-pipe-production=Tubes scellés pour expédier la paperasse à grande vitesse dans votre usine. Les tuyaux ordinaires sont pour les liquides, pas pour le jargon juridique.
pneumatic-pipe-to-ground-production=Fait passer les tubes pneumatiques sous les bâtiments et les tapis. Portée souterraine de 16 cases.
tube-intake-production=La bretelle d'entrée de votre réseau pneumatique. Insérez la paperasse, elle apparaît instantanément à toute sortie connectée.
tube-outtake-production=La bretelle de sortie de votre réseau pneumatique. Définissez un filtre pour demander le type précis de formulaire requis.
speed-module=Rédige une menace juridique forçant les machines à produire plus vite. L'excuse a intérêt à justifier la facture d'énergie.
speed-module-2=Fait monter l'assignation d'un cran. Quatre copies de la menace originale, améliorées avec de meilleures excuses et des circuits plus persuasifs.
speed-module-3=Assignation fédérale appuyée par des récits, des accréditations et tout le poids du système judiciaire. Accélération légale maximale.
productivity-module=Lance une enquête interne qui arrache du rendement supplémentaire à chaque cycle. Les auditeurs sont minutieux, mais lents.
productivity-module-2=Élargit le périmètre de l'audit. Quatre conclusions préliminaires, renforcées par de vraies données, produisent un examen plus profond.
productivity-module-3=Enquête fédérale complète. Quatre audits antérieurs, des justifications et des accréditations fusionnent en la supervision la plus productive et la plus intrusive possible.
efficiency-module=Trafique les comptes d'énergie. Un rapport minable et quelques fils font mentir le compteur juste assez.
efficiency-module-2=Fraude comptable plus audacieuse. Quatre montages précédents et quelques livres blancs produisent une comptabilité nettement plus créative.
efficiency-module-3=Montage de Ponzi complet appliqué à la comptabilité énergétique. Quatre modules de détournement antérieurs, une couverture politique et des accréditations : les auditeurs ne verront rien.
union-approval-production=Obtient le consentement des travailleurs par l'ancien rituel du café, des données et du financement public. Rien ne bouge sans la bénédiction du syndicat.
treasury-bond-production=Emballe des fonds publics dans un instrument financier négociable. La documentation est inutile, mais juridiquement obligatoire.
government-grant-production=Convertit des obligations du Trésor en allocation majeure de financement. Exige la promesse verbale d'un cadre et un rapport que personne ne lira.
tax-audit=Reclasse l'argent blanchi en revenus légitimes. La paperasse entre sale et ressort propre, et d'une manière ou d'une autre multipliée.
slush-fund-production=Convertit des obligations gouvernementales légitimes en actifs liquides intraçables. Totalement régulier. Ne posez pas de questions.
useless-documentation-production=Documente officiellement l'inutilité. Le résultat devient malgré tout un intrant obligatoire pour les instruments financiers et le dépôt standardisé.
compacted-rubble-production=Compresse les déchets bureaucratiques en matériau de construction standardisé. Le certificat prouve que la compression était écologiquement responsable.
compacted-rubble-electric=Compresse les gravats redondants une unité à la fois dans un four électrique sans consommer de certificat de compensation carbone.
charcoal-production=Source renouvelable de charbon, à condition d'avoir des serres qui produisent du bois. Le certificat couvre les émissions.
refined-nonsense-production=L'épine dorsale de la bureaucratie de haut niveau. Créée quand des déchets physiques rencontrent du mensonge liquide et qu'aucun des deux ne recule.
overtime-exemption=Autorise un seul bâtiment à fonctionner après la tombée de la nuit. L'emplacement de module se moque de votre équilibre vie-travail : il veut seulement votre réserve de café.

