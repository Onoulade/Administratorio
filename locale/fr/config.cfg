[mod-setting-description]
administratorio-enable-working-hours=Quand ce réglage est activé, les bureaux, salles de pause et sièges syndicaux ferment la nuit sauf avec une exemption d'heures supplémentaires, tandis que les agences pour l'emploi des biters et les biterports exigent du café liquide pour les envois nocturnes. Le désactiver supprime les fermetures de nuit, le module d'exemption d'heures supplémentaires, la recherche Opérations après les heures, l'astuce sur les heures de bureau et les bonus de vitesse de jour.
administratorio-debug-protest-belts-and-inserters=Quand ce réglage est activé, le choix des cibles de manifestation inclut aussi les convoyeurs, convoyeurs souterrains, répartiteurs et bras mécaniques. Désactivé par défaut, car cela rend les manifestations beaucoup plus bruyantes et peut bloquer de petites pièces logistiques pendant les tests.
administratorio-debug-hard-mode=Quand ce réglage est activé, les biters manifestants continuent de gagner en frustration après le seuil normal. Ils manifestent à 70 % de capacité, puis à 100 % restent en manifestation et attaquent le bâtiment admissible le plus proche jusqu'à ce qu'une Promesse bureaucratique les renvoie vers un bureau.

