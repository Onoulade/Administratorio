[item-description]
bullshit-ore=Un gisement naturel de pur non-sens non raffiné. La fondation de toute l'économie bureaucratique. Exploitez-le, raffinez-le, transformez-le en arme.
redundant-rubble=Déchet minéralisé produit par un excès de contrôle procédural. Totalement inutile seul, mais légalement requis pour les documents officiels contraignants.
compacted-rubble=Déchet bureaucratique compressé industriellement, certifié pour usage. Fabriqué avec des gravats redondants traités par fonte réglementée avec certificat de compensation carbone.
useless-documentation=Gravats redondants soigneusement enveloppés dans des couches de papier. Inutilité officiellement documentée. Requis pour les dépôts normalisés et les instruments financiers.
refined-nonsense=Absurdité bureaucratique pure et concentrée. Créé en fusionnant des gravats compactés avec de la désinformation liquide dans une distillerie de propagande. L'ossature des processus administratifs de haut niveau.
paper=Substrat bureaucratique réglementaire. Fabriqué à partir de bois ou synthétisé depuis le plastique. Utilisé pour tout, des formulaires vierges aux mémoires de cour suprême.
coffee-bean=Une denrée rare et précieuse. Découverte en tamisant du compost. Le sang vital de toute bureaucratie fonctionnelle.

ink=Fluide d'écriture brut extrait du charbon. Utilisable pour des documents manuscrits ou raffiné en cartouches.
blank-form=Un formulaire administratif vide en attente de sa vocation. La toile vierge de la bureaucratie. Utilisé dans presque toutes les recettes de paperasse.
blank-approval=Un modèle d'approbation préimprimé nécessitant une finalisation officielle à l'encre. Utilisé pour les décharges de sécurité, les permis de construire et les autorisations de transit.
blank-directive=Un modèle de directive haute sécurité avec triple application d’encre. Requis pour les approbations de niveau direction.
safety-waiver-draft=Une décharge de sécurité non finalisée attendant vérification d'imprimante et sceau d'encre.
construction-permit-draft=Un permis de construire non finalisé attendant vérification d'imprimante et sceau d'encre.
management-verbal-draft=Un brouillon d'approbation verbale extrait d'une conversation de salle de pause. Nécessite une finalisation à l'imprimante.
management-written-proposal=Une proposition de direction rédigée par le comité exécutif du siège syndical. Nécessite un lourd passage de finalisation à l'imprimante.
admin-station=Bureau d'interface avec les biters. Sa zone d'attente intégrée montre où les biters font la queue ; remettez ici les objets résolus pour les satisfaire. Stockage uniquement, sans fabrication.
resolution-office=Bureau dédié au traitement des plaintes. Gère les dépôts, les dossiers et les résolutions finales.
office-desk=Poste de travail polyvalent pour formulaires, packs de science, paperasse de financement et tâches administratives générales. Respecte les heures de bureau sauf avec une [item=overtime-exemption].
office-desk-no-working-hours=Poste de travail polyvalent pour formulaires, packs de science, paperasse de financement et tâches administratives générales.
union-headquarters=Vaste complexe où se négocient l'approbation de la main-d'oeuvre et les politiques de fin de partie. Le premier démarre avec des bons du Trésor et de la paperasse verbale, puis gère subventions, approbations écrites, audits et directives. Ferme la nuit sauf avec une [item=overtime-exemption].
union-headquarters-no-working-hours=Vaste complexe où se négocient l'approbation de la main-d'oeuvre et les politiques de fin de partie. Le premier démarre avec des bons du Trésor et de la paperasse verbale, puis gère subventions, approbations écrites, audits et directives.
propaganda-distillery=Installation spécialisée dans le traitement des fluides administratifs. Raffine le fluide politicien en mensonges liquides, synthétise la désinformation et produit des accréditations.
administrative-science-pack=Le pack de science gris. Alimente la recherche administrative. Fabriqué au bureau administratif.
taxpayer-money=Monnaie durement gagnée extraite des plaintes de biters résolues. La source principale de financement des opérations publiques.
treasury-bond=Un instrument financier garanti par le gouvernement. Combine l'argent des contribuables avec de la documentation inutile. Utilisé dans la construction et les directives de haut niveau.
government-grant=Une allocation importante de fonds publics. Utilisée pour les directives avancées, les dossiers de plaintes complexes et la bureaucratie de haut niveau.
job-offer=Un contrat de travail officiel. Placez-le dans un bureau administratif — quand les plaintes du biter sont entièrement résolues, il prend l'offre d'emploi et devient travailleur au lieu de repartir. Les biters plus grands produisent plus de travailleurs.
biter-worker=Un employé biter domestiqué. Requis pour construire des bâtiments administratifs. Produit en embauchant des biters résolus avec des offres d'emploi.
biter-logistics-formation=Un travailleur biter formé pour la construction de biterports et la logistique des coffres demandeurs.
biterport=Substitut terrestre au roboport. Contient jusqu'à 8 travailleurs logistiques biters et du financement public, puis envoie des biters marcheurs aux tâches de construction et de logistique dans les zones de biterport connectées. La nuit, les envois exigent aussi du café liquide par l'entrée arrière.
paperwork-provider-chest=Coffre fournisseur passif à un emplacement pour logistique opérée par biters. Les robots peuvent aussi l'utiliser, mais personne ne sera impressionné.
paperwork-storage-chest=Coffre de stockage à un emplacement pour logistique opérée par biters et dépôts de recyclage.
paperwork-requester-chest=Coffre demandeur à un emplacement pour logistique opérée par biters.
rideable-biter=Un biter montable réaffecté au transport personnel. Consomme l'argent des contribuables en se déplaçant, ne porte qu'une minuscule sacoche et ne peut pas être récupéré après placement. Sans financement pendant 10 minutes, il redevient un biter ordinaire et dépose une plainte.
union-delegate=Un travailleur biter formé comme représentant syndical. Requis pour construire le siège syndical.
chemical-operator=Un travailleur spécialiste certifié pour la manipulation chimique dangereuse. Requis pour les usines chimiques.
nuclear-technician=Un travailleur spécialiste formé aux opérations radiologiques. Requis pour les réacteurs nucléaires et les centrifugeuses.
formation-center=Une installation de formation 5x5 dédiée aux affectations de travailleurs biters, aux logisticiens et aux certifications spécialisées.
field-office=Un avant-poste bureaucratique improvisé. Appelle des biters depuis les nids dans un rayon de 200 tuiles — un travailleur par cycle de fabrication. Fonctionne seulement lorsqu'un biter est sur place. Aucune pollution pendant l'exploitation.
biter-station=Stocke des travailleurs biters et du financement public, puis envoie les travailleurs autoriser les bâtiments gérés proches. La nuit, les envois exigent aussi du café liquide par l'entrée arrière. Chaque machine autorisée peut fabriquer une fois avant de nécessiter une nouvelle visite.
transit-authorization=Documentation officielle de voyage (formulaire 12-T). Placez-la dans le coffre de permis de transit à un arrêt de train. Un formulaire est consommé par arrivée ; la limite de trains de la gare égale le nombre de formulaires dans le coffre.
greenhouse=Une installation de culture climatisée. Produit du bois à partir d'eau et, avec les bons intrants, des grains de café rares.

pneumatic-pipe=Tuyau scellé couleur manille pour transporter de la paperasse fluidisée. Ne se connecte PAS aux tuyaux de fluide ordinaires.
pneumatic-pipe-to-ground=Tube pneumatique souterrain pour faire passer la paperasse sous les bâtiments. Ne se connecte PAS aux tuyaux de fluide ordinaires.
tube-intake=Reçoit les objets de paperasse valides pour un transport pneumatique instantané. Insérez la paperasse directement avec des bras ou la logistique.
tube-outtake=Distribue les objets de paperasse du réseau pneumatique. Utilisez vos propres bras ou votre logistique pour extraire les objets du coffre de sortie.
transit-permit-chest=Coffre placé automatiquement aux arrêts de train. Chargez les autorisations de transit ici : une est consommée par arrivée de train. La limite de trains de la gare égale le nombre de formulaires. Accessible aux bras et à la logistique.

safety-work-order=Autorisation d'assemblage combinée pour la fabrication réglementée de sécurité. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
construction-work-order=Autorisation d'assemblage combinée pour la fabrication réglementée de construction. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
management-verbal-work-order=Autorisation d'assemblage combinée appuyée par une promesse verbale de responsable. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
management-written-work-order=Autorisation d'assemblage combinée appuyée par une directive de direction signée. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
research-grant-work-order=Autorisation d'assemblage combinée pour la production scientifique financée. Utilisée uniquement par les machines d'assemblage. Consommée à l'utilisation.
chemical-handling-work-order=Un ordre d'exploitation spécialisé pour les usines chimiques. Construit à partir de paperasse de sécurité et environnementale, plus du matériel de manipulation. Consommé par chaque recette de chimie.
radiological-work-order=Un ordre d'exploitation haute sécurité pour les centrifugeuses et le traitement radiologique. Construit à partir de paperasse chimique et d'une approbation écrite de la direction. Consommé par les recettes de centrifugation.

carbon-offset-certificate-basic=Un certificat de base autorisant une fonte industrielle limitée. Consommé par les recettes de fonte par lot au four.
carbon-offset-certificate-verified=Un certificat amélioré avec vérification officielle. Émis via la chaîne de conformité du bureau pour les fours en acier et la fonte avancée.

work-order=Autorisation de travail d'assemblage de base pour les recettes réglementées. Utilisée uniquement par les machines d'assemblage et pour assembler la paperasse de niveau supérieur.
form-27b-6=Le tristement célèbre formulaire de réquisition normalisé. Utilisé dans la paperasse de transit, les rapports de conformité et la bureaucratie supérieure.
safety-waiver=Un document dégageant l'administration de toute responsabilité. Requis pour la construction T1 et pour assembleur les permis d’exploitation plus lourds.
environmental-impact-report=Une évaluation complète, bien que fortement caviardée, des dégâts environnementaux. Utilisée pour émettre la paperasse d'exploitation chimique et radiologique.
management-approval-verbal=L'accord verbal d'un responsable, techniquement contraignant mais facilement nié. Nécessite du café pour être extrait.
management-approval-written=Un engagement de direction signé et notarié. Bien plus difficile à obtenir, mais impossible à nier.
research-grant-approval=Une autorisation de subvention de recherche de base. Requise pour toute production de packs de science. Simple mais essentielle.
provisional-approval=Une habilitation bureaucratique de premier niveau. Requise pour les fours en pierre et les équipements à combustion. Votre premier goût des gravats redondants.

filing-l=Plainte de paysage officiellement déposée. Première étape pour résoudre le grief d'un citoyen concernant le décor local.
filing-s=Plainte de smog officiellement déposée. Documente l'objection d'un citoyen à la pollution atmosphérique industrielle.
filing-n=Plainte de bruit officiellement déposée. Consigne le grief d'un citoyen sur les nuisances sonores de votre infrastructure.
filing-u=Plainte de chômage officiellement déposée. Le grief citoyen le plus grave, alléguant un échec économique systémique.
filing-lt=Plainte de déchets officiellement déposée. Documente l'objection d'un spitter aux flaques d'acide laissées partout.
filing-h=Plainte de matières dangereuses officiellement déposée. Consigne le grief d'un spitter sur l'exposition aux matières dangereuses.
filing-lo=Plainte de flânerie officiellement déposée. Documente l'objection d'un spitter aux violations de zone restreinte.
filing-v=Plainte de vagabondage officiellement déposée. Le grief spitter le plus grave, alléguant déplacement et sans-abrisme.

case-s=Un dossier de smog prêt pour le tribunal. La preuve est littéralement dans l'air, mais il la faut quand même en trois exemplaires.
case-n=Un dossier de bruit validé, appuyé par des attestations de décibels sous serment. Étrangement, la partie la plus bruyante du processus est la paperasse.
case-u=Preuve d’échec économique systémique, compilée avec assez de paperasse pour employer un petit bureau. L'ironie est structurelle.
case-h=Un dossier matières dangereuses si documenté que le dossier lui-même pourrait nécessiter une manipulation protégée.
case-lo=Un argument juridique selon lequel se tenir au mauvais endroit est une infraction poursuivable. Le précédent est fragile, mais le dépôt est hermétique.
case-v=Un dossier de déplacement construit par le système qui a causé le déplacement. Personne n'a dit que la bureaucratie devait être lucide.

brief-n=Vestige d'une époque juridique plus simple où les dossiers de bruit allaient jusqu'à la cour suprême. Conservé pour la compatibilité des sauvegardes : votre ancienne paperasse est protégée.
brief-u=Artefact de l'époque où le chômage exigeait une décision de cour suprême plutôt qu'un dossier très épais. Conservé pour la compatibilité des sauvegardes.
brief-lo=Souvenir de la brève période où les dossiers de flânerie exigeaient l'intervention de la cour suprême. Le système a depuis été rationalisé. Conservé pour la compatibilité des sauvegardes.
brief-v=Mémoire de cour suprême datant de l'époque où le vagabondage exigeait l'autorité judiciaire maximale. Conservé pour la compatibilité des sauvegardes : la bureaucratie se souvient.

construction-permit=Une autorisation de construction standard. Requise comme ingrédient dans la plupart des recettes de bâtiments et dans les permis d'exploitation lourds.

dubious-data=Raffiné à partir de minerai de foutaises. Peu fiable, mais techniquement admissible comme information. L'ossature de l'économie des excuses.
basic-excuse=Une justification simple assemblée à partir de données douteuses. Utilisée dans la résolution paysage et les processus bureaucratiques bas niveau.
crappy-report=Un rapport compilé à la hâte et d’exactitude douteuse. La base de toute documentation de niveau supérieur.
credentials=Accréditations officielles produites à partir de mensonges liquides, de données douteuses et de non-sens raffiné. Preuve d'autorité, quelle que soit la source douteuse.
data=Synthétisées à partir de rapports minables et d’accréditations. Information réellement utilisable. Une denrée rare dans cette administration.
good-excuse=Une justification bien ficelée mêlant vraies données et mensonges liquides. Utilisée dans les approbations avancées et la construction du récit.
justification=Une justification juridique formelle construite avec désinformation, accréditations et fluide politicien. Utilisée dans le nettoyage OSHA.
narrative=L'histoire officielle, tissée de justifications, de bonnes excuses et de non-sens raffiné. Contrôle la perception publique de votre administration.
white-paper=Un document politique faisant autorité, mêlant données, mensonges et non-sens garanti par le Trésor. La base des politiques publiques.
policy=Une directive rédigée en réunions interminables. Exige livres blancs, désinformation, données et subventions publiques.
regulation=Une réglementation fédérale rédigée par un processus bureaucratique épuisant. L'expression ultime de l'autorité gouvernementale.
promise=Une capsule jetable contenant une promesse bureaucratique. Lancez-la sur un biter manifestant pour le pacifier temporairement.
eviction-notice=Une capsule jetable qui détruit les structures biters. À utiliser avec une extrême prudence.
hush-money=Un sac d'argent des contribuables lancé aux nids de biters pour les faire taire. Empêche l'apparition pendant 3 minutes. Smog vert non garanti non toxique.
hired-biter-capsule=A fully credentialed behemoth biter terrain officer. Place it, select it avec a Deployment Order, et let logistique refill its concealed eviction notice ledger.
hired-biter-command-capsule=A terrain remote pour Terrain Agents. Click agents à select ou unselect them, right-click charted map positions à send them, et Shift-right-click à append waypoints. Right-click a notice chest à send agents there pour resupply.

resolved-landscape=Plainte de paysage entièrement résolue. Preuve que le système fonctionne, parfois.
resolved-smog=Plainte de smog entièrement résolue. A exigé beaucoup de désinformation et de café.
resolved-noise=Plainte de bruit entièrement résolue. A demandé un dossier validé, une pile de directives, du café, des récits et des accréditations.
resolved-unemployment=Plainte de chômage entièrement résolue. Sommet de l'accomplissement bureaucratique : vous avez résolu le chômage.
resolved-littering=Plainte de déchets entièrement résolue. Les flaques d'acide ont été officiellement reclassées comme éléments décoratifs.
resolved-hazmat=Plainte de matières dangereuses entièrement résolue. A exigé des preuves en gravats compactés, de la désinformation et du café.
resolved-loitering=Plainte de flânerie entièrement résolue. A demandé un dossier validé, des règlements, du café, des récits et des accréditations.
resolved-vagrancy=Plainte de vagabondage entièrement résolue. Sommet bureaucratique des spitters : vous avez résolu le sans-abrisme.

ticket-landscape=Plainte citoyenne pour destruction du paysage. Générée par les petits biters aux bureaux administratifs.
ticket-smog=Plainte citoyenne pour pollution de l'air. Générée par les biters moyens ou plus grands.
ticket-noise=Plainte citoyenne pour pollution sonore. Générée par les gros biters ou plus grands.
ticket-unemployment=Plainte citoyenne pour chômage. Générée uniquement par les biters béhémoths.
ticket-littering=Plainte de spitter pour flaques d'acide abandonnées. Générée par les petits spitters aux bureaux administratifs.
ticket-hazmat=Plainte de spitter pour exposition aux matières dangereuses. Générée par les spitters moyens ou plus grands.
ticket-loitering=Plainte de spitter pour violation de zone restreinte. Générée par les gros spitters ou plus grands.
ticket-vagrancy=Plainte de spitter pour déplacement et sans-abrisme. Générée uniquement par les spitters béhémoths.

printer-t1=A basic electric printer. Slow but reliable. Produit printed documents depuis ink cartridges.
printer-t2=Imprimante industrielle rapide avec mode copie. Peut dupliquer les documents : 1 original produit 6 copies. Exige la visite d'un travailleur biter depuis une agence proche pour autoriser chaque fabrication.
mechanical-printer=A hand-cranked printer. Votre workhorse until vous unlock electric printing.



speed-module=Menace juridique qui pousse les machines à produire plus vite. La facture d'énergie est le problème de quelqu'un d'autre. (+20 % vitesse, +50 % énergie)
speed-module-2=Assignation collective escaladée. Les machines travaillent frénétiquement pour se conformer. (+30 % vitesse, +70 % énergie)
speed-module-3=Assignation fédérale appuyée par tout le poids du judiciaire. Les machines n'ont jamais travaillé aussi vite ni aussi cher. (+50 % vitesse, +100 % énergie)
productivity-module=An internal audit que squeezes extra output depuis every cycle. Le auditors slow everything down while they work. (+4% productivity, -vitesse, +energy, +pollution)
productivity-module-2=A forensic audit avec expanded scope. More findings, more overhead, more paperasse. (+6% productivity, -vitesse, +energy, +pollution)
productivity-module-3=A full federal investigation. Output is maximized but morale, vitesse, et le power bill are tous casualties. (+10% productivity, -vitesse, +energy, +pollution)
efficiency-module=Comptabilité créative qui sort les coûts d'énergie des livres. Personne ne demande où sont passées les économies. (-30 % énergie)
efficiency-module-2=Advanced embezzlement techniques. Le accountants have gotten bolder. (-40% energy)
efficiency-module-3=Montage de Ponzi complet appliqué à l'énergie. Les machines tournent à moitié coût et les auditeurs n'ont encore rien remarqué. (-50 % énergie)

