[tips-and-tricks-item-description]
administratorio-welcome=[font=default-bold]Bienvenue dans Administratorio.[/font]\n\nCe mod remplace le conflit militaire par la bureaucratie. Les biters et les spitters ne forment pas de groupes d'attaque : ils font la queue. Ils se rendent à vos [entity=admin-station], déposent des plaintes et attendent que vous les résolviez. Vous survivez en maintenant la paperasse en mouvement.\n\n[font=default-bold]La boucle de base :[/font]\n1. Un biter prend un emplacement de bureau et dépose des tickets de plainte\n2. Vous traitez les tickets au [entity=resolution-office] pour produire les résolutions correspondantes\n3. Vous remettez les résolutions dans l'emplacement occupé par le biter\n4. Une fois toutes les résolutions reçues, le biter laisse de l'[item=taxpayer-money] et rentre chez lui pour disparaître\n\nSi la file déborde ou si un biter attend trop longtemps, il manifeste et bloque un bâtiment proche. Les autres astuces expliquent les outils qui évitent d'en arriver là.
administratorio-work-orders=[font=default-bold]Les machines consomment de la paperasse comme ingrédient de recette.[/font]\n\nLes documents administratifs sont de vrais intrants, comme le fer ou le cuivre. Si la bonne autorisation manque, la machine s'arrête même si tous les autres ingrédients sont sur le tapis.\n\n[font=default-bold]Les machines d'assemblage utilisent des ordres de travail :[/font]\nChaque recette d'assemblage consomme un [item=work-order] ou l'une de ses variantes transformées. Les recettes plus lourdes exigent des variantes plus avancées, comme [item=safety-work-order], [item=construction-work-order], [item=management-verbal-work-order] et [item=management-written-work-order]. Les nouvelles recettes se débloquent avec la variante nécessaire, donc les paliers de paperasse suivent l'arbre technologique.\n\n[font=default-bold]Les autres familles de machines ont leur propre paperasse :[/font]\n• Les fours consomment des [item=carbon-offset-certificate-basic]\n• Les usines chimiques consomment des [item=chemical-handling-work-order]\n• Les centrifugeuses consomment des [item=radiological-work-order]\n\nCes chaînes sont indépendantes : les ordres de travail ne les remplacent pas, et ces documents ne sont pas interchangeables entre familles de machines.\n\n[font=default-bold]Exception : les raffineries de pétrole[/font]\nLes raffineries ne consomment [color=red]aucune[/color] paperasse d'exploitation. Elles sont déjà contrôlées par l'envoi d'un travailleur depuis une [entity=biter-station], ce que la bureaucratie juge suffisamment supervisé.\n\nPlanifiez vos lignes de paperasse comme vos lignes de fer et de cuivre.
administratorio-biter-complaints=[font=default-bold]Le bureau d'administration remplace les vagues ennemies par une file d'attente.[/font]\n\nAu lieu de lancer des raids, les biters et les spitters marchent jusqu'à vos [entity=admin-station] pour chercher un emplacement libre. Chaque bureau démarre avec 4 emplacements de service actifs ; la filière de recherche [technology=admin-station-capacity-1] (8 paliers) porte ce nombre à 12.\n\n[font=default-bold]Parcours d'un citoyen :[/font]\n1. Le biter prend un emplacement et dépose un ou plusieurs tickets de plainte\n2. Vous sortez les tickets et les traitez au [entity=resolution-office]\n3. Vous insérez chaque résolution dans l'emplacement du biter concerné\n4. Quand toutes les résolutions attendues sont reçues, le biter dépose de l'[item=taxpayer-money] et rentre chez lui\n\n[font=default-bold]Paliers et taille des biters :[/font]\nLes plaintes dépendent du type d'ennemi. Les biters déposent des plaintes de paysage, smog, bruit ou chômage ; les spitters déposent des plaintes de déchets, matières dangereuses, flânerie ou vagabondage. Quand l'évolution monte, des paliers plus difficiles apparaissent et votre chaîne de résolution doit suivre. Les ennemis plus gros déposent [font=default-bold]plusieurs plaintes à la fois[/font] : un seul béhémoth peut demander toute une pile de résolutions avant de partir.\n\n[font=default-bold]L'évolution fonctionne toujours :[/font]\nLes nids absorbent la pollution et font lentement monter l'évolution comme dans le jeu de base. Chaque palier change ce que vos bureaux reçoivent, donc la chaîne de résolution doit grandir avec l'usine.\n\n[item=taxpayer-money] finance les capsules, les bâtiments d'envoi et la plupart des expansions. Plus vous traitez vite les plaintes, plus l'argent circule. Chaque bureau émet aussi des signaux de circuit pour les tickets, les places libres et le total des biters en attente : câblez-les pour augmenter la capacité avant le débordement.
administratorio-frustration=[font=default-bold]La frustration commence dès qu'un biter quitte son nid.[/font]\n\nLe minuteur monte jusqu'à ce que le biter ait reçu [color=green]toutes[/color] les résolutions pour [color=green]toutes[/color] ses plaintes. Survolez un biter pour voir son humeur actuelle.\n\n[font=default-bold]Deux causes de manifestation :[/font]\n• La frustration atteint 100 % avant la clôture du dossier\n• Un biter arrive dans la file alors qu'aucun bureau n'a de place libre\n\nDans les deux cas, le biter marche vers un bâtiment joueur proche et le désactive jusqu'à votre intervention.\n\n[font=default-bold]Promesse bureaucratique :[/font]\nLancez une [item=promise] sur un [color=red]biter manifestant[/color], pas sur le bâtiment :\n• Si une place est libre, le biter retourne vers un bureau à [font=default-bold]50 % de frustration[/font] et reprend son dossier\n• Si aucune place n'est libre, il cherche pendant [font=default-bold]une minute[/font], puis reprend la manifestation si rien ne s'est libéré\n• La promesse [color=red]n'efface pas[/color] la plainte et ne réinitialise pas l'avancement de la paperasse\n\nLes promesses achètent du temps. La vraie solution reste de terminer le dossier pour que le biter parte de lui-même : ajoutez des bureaux avant que la file soit pleine et augmentez le débit de résolution avant que la frustration s'accumule.
administratorio-complaint-chain=[font=default-bold]Les tickets de plainte sont la courbe d'évolution bureaucratique.[/font]\n\nL'évolution ennemie continue de monter avec la pollution absorbée par les nids. Au lieu d'améliorer les attaques, une évolution plus haute change les citoyens qui arrivent et les chaînes de paperasse qu'ils exigent. Les premiers bureaux voient surtout des tickets simples ; plus tard, la même file doit alimenter plusieurs chaînes de résolution spécialisées à la fois.\n\n[font=default-bold]Les biters déposent des plaintes d'impact industriel :[/font]\n• [item=ticket-landscape] Plaintes de paysage au début de la chaîne\n• [item=ticket-smog] Plaintes de smog quand la pollution augmente\n• [item=ticket-noise] Plaintes de bruit avec l'industrie lourde\n• [item=ticket-unemployment] Plaintes de chômage en fin de chaîne biter\n\n[font=default-bold]Les spitters déposent des plaintes de conduite et de sécurité :[/font]\n• [item=ticket-littering] Plaintes de détritus au début de la chaîne spitter\n• [item=ticket-hazmat] Plaintes hazmat avec les procédés dangereux\n• [item=ticket-loitering] Plaintes de flânage comme branche intermédiaire\n• [item=ticket-vagrancy] Plaintes de vagabondage en fin de chaîne spitter\n\n[font=default-bold]La taille change la quantité :[/font]\nLes petits ennemis demandent généralement une résolution. Les ennemis moyens, gros et béhémoths peuvent déposer plusieurs plaintes à la fois, et ils ne partent pas tant que [color=green]chaque[/color] résolution demandée n'a pas été insérée dans leur emplacement de bureau. Un seul citoyen de fin de partie peut donc bloquer un slot de service tout en demandant plusieurs résolutions terminées différentes.\n\nChaque famille de tickets a son propre chemin de recette via le [entity=resolution-office] et la paperasse ultérieure. Préparez des tampons pour chaque type de ticket débloqué, surveillez les signaux de circuit des bureaux pour voir le mélange actuel, et agrandissez avant que l'évolution ne débloque la prochaine famille de cas.
administratorio-nest-expropriation=[font=default-bold]L'expulsion détruit un nid définitivement et influence votre courbe d'évolution.[/font]\n\nLancez un [item=eviction-notice] en territoire ennemi et le géniteur le plus proche est détruit pour de bon. C'est la seule façon de reprendre du terrain dans le mod.\n\n[font=default-bold]Levier d'évolution :[/font]\nLes nids détruits n'absorbent plus la pollution, donc l'expulsion ralentit aussi l'évolution. Mais les nids sont la source des biters, et les biters sont la source de l'[item=taxpayer-money]. Éliminer tous les nids affame l'usine en financement. Tout est affaire d'équilibre : gardez assez de nids pour financer les opérations, expulsez-en assez pour éviter que l'évolution dépasse votre chaîne de résolution.\n\n[font=default-bold]Déplacement :[/font]\nLes biters proches du géniteur détruit ne meurent pas. Ils sont envoyés directement dans votre système de plaintes avec une frustration élevée. N'expulsez que si vos bureaux et votre chaîne de résolution peuvent absorber la vague.\n\nPour ralentir temporairement les nids sans déplacer de biters, utilisez plutôt [item=hush-money].
administratorio-hush-money=[font=default-bold]Le pot-de-vin empêche temporairement un nid de générer des biters.[/font]\n\nLancez [item=hush-money] sur un nid ennemi. Les géniteurs dans le rayon d'effet se taisent pendant quelques minutes, puis reprennent exactement comme avant. Tant qu'ils sont calmés, aucun nouveau biter ne part de ce nid pour déposer une plainte.\n\nUtilisez-le quand la file est saturée et que vous devez ralentir les arrivées le temps de vider l'arriéré. Chaque lancer coûte de l'[item=taxpayer-money], donc considérez-le comme une soupape d'urgence plutôt qu'une stratégie permanente.\n\nContrairement à [item=eviction-notice], le pot-de-vin ne détruit pas le nid et ne déplace aucun biter dans votre file : il suspend seulement les nouvelles arrivées.
administratorio-working-hours=[font=default-bold]Les bâtiments dépendant des biters ferment la nuit.[/font]\n\nLa règle est thématique : si un bâtiment a des biters [font=default-bold]qui viennent travailler[/font] ([entity=office-desk], [entity=corporate-breakroom], [entity=union-headquarters], [entity=biter-station], [entity=biterport]) ou utilise des biters [font=default-bold]comme ingrédient de recette[/font], sa main-d'oeuvre rentre chez elle au coucher du soleil. Sans intervention, le bâtiment reste inactif jusqu'à l'aube.\n\nPour le garder ouvert la nuit, fournissez le bon consommable :\n• [font=default-bold]Bâtiments de bureau[/font] : installez une [item=overtime-exemption] dans l'emplacement de module. Une seule suffit ; les autres ne servent à rien.\n• [font=default-bold]Bâtiments d'envoi[/font] : injectez du [fluid=liquid-coffee] dans l'une des quatre entrées latérales. Chaque envoi nocturne consomme une unité.\n\nIl n'y a pas de pénalité partielle la nuit : un bâtiment couvert tourne exactement à la même vitesse, de jour comme de nuit. Sans le bon consommable, il reste simplement inactif la nuit au lieu de ralentir — c'est un interrupteur, pas un curseur de débit. Les manifestations désactivent quand même les bâtiments même avec l'exemption : l'exemption achète la nuit, pas la file.\n\nSi cette mécanique ne vous plaît pas, désactivez les heures de bureau dans les réglages de démarrage avant de charger le mod.
administratorio-biter-employment=[font=default-bold]Les offres d'emploi redirigent les citoyens résolus vers la main-d'oeuvre.[/font]\n\nPlacez une [item=job-offer] dans un emplacement de [entity=admin-station] avant que ce citoyen ne reçoive sa résolution finale. L'offre est consommée quand l'embauche est tentée, et une embauche réussie remplace le paiement normal en [item=taxpayer-money].\n\n[font=default-bold]Sans Space Age :[/font] tout biter ou spitter résolu accepte. La taille détermine le rendement en [item=biter-worker] : Petit 1, Moyen 2, Gros 3, Béhémoth 5.\n\n[font=default-bold]Avec Space Age :[/font] l'embauche directe est remplacée par le système d'inscription. Seuls les biters calmes de Nauvis ont une chance de produire un [item=enrolled-biter], qui doit ensuite terminer la recette [recipe=worker-biter-formation] au [entity=formation-center]. Consultez l'astuce « Inscription Space Age » pour les seuils de frustration.\n\nLes travailleurs équipent l'envoi de la [entity=biter-station], la logistique biter et la formation de spécialistes. Gardez vos offres d'emploi exactement dans les emplacements où vous voulez recruter.
administratorio-biter-workers=[font=default-bold]Les travailleurs biters sont des objets stockés qui autorisent les machines gérées.[/font]\n\nUn [item=biter-worker] reste dans une [entity=biter-station] jusqu'à son envoi. Il marche jusqu'à un bâtiment géré, l'autorise à effectuer un cycle de fabrication, puis revient. Toute l'arborescence de production de type assemblage repose sur cette boucle.\n\n[font=default-bold]Formation au [entity=formation-center] :[/font]\nLe centre de formation fonctionne comme une machine d'assemblage. Cliquez dessus pour ouvrir son menu de recettes et sélectionnez une spécialisation. Alimentez des [item=biter-worker] et la paperasse requise dans ses emplacements d'entrée via des convoyeurs ou des bras mécaniques : le spécialiste apparaîtra dans l'emplacement de sortie. Récupérez-le et gardez-le dans votre inventaire. Quand vous [color=red]posez[/color] le bâtiment correspondant, le spécialiste est consommé à la pose, pas pendant l'exploitation.\n\nTypes de spécialistes et déblocages :\n• [item=union-delegate] : construire le [entity=union-headquarters]\n• [item=chemical-operator] : construire des [entity=chemical-plant]\n• [item=nuclear-technician] : construire des [entity=centrifuge] et des réacteurs nucléaires\n• [item=biter-logistics-formation] : unité qui équipe le [entity=biterport]\n• [item=rideable-biter] : transformer un travailleur en monture personnelle\n\nLes raffineries de pétrole font exception : elles utilisent la paperasse d'assemblage réglementée pour la construction et l'envoi par agence pour l'exploitation, sans étape au centre de formation. Planifiez les spécialistes pour les chantiers, pas pour le débit.
administratorio-rideable-biter=[font=default-bold]Un véhicule personnel qui fonctionne à l'argent des contribuables.[/font]\n\nDéployez un [item=rideable-biter] pour monter un travailleur. Il brûle de l'[item=taxpayer-money] dans son emplacement de carburant pour rester affecté et ne possède qu'une minuscule sacoche.\n\n[font=default-bold]Règles d'exploitation :[/font]\n• Une fois placé, il [color=red]ne peut pas être miné ni déconstruit[/color] : il partira de lui-même\n• Sans cavalier, il peut errer sur une courte distance\n• Si son emplacement de carburant reste vide pendant [font=default-bold]10 minutes[/font], le contrat expire\n\n[font=default-bold]Quand le financement expire :[/font]\nLe biter redevient un [entity=medium-biter] sauvage et entre dans le système de plaintes. Si un bureau a de la capacité, il fait la queue normalement. Si tout est plein, il manifeste comme tout citoyen non servi, possiblement contre le bâtiment à côté duquel vous l'avez garé.\n\nGardez quelques pièces dans la selle.
administratorio-biter-station=[font=default-bold]Infrastructure obligatoire : certains bâtiments ne fonctionnent pas sans elle.[/font]\n\nCes bâtiments gérés ne fabriquent que lorsqu'un biter vient autoriser le cycle :\n• [entity=oil-refinery]\n• [entity=centrifuge]\n• [entity=printer-t2]\n• [entity=corporate-breakroom]\n• [entity=propaganda-distillery]\n\nSans [entity=biter-station] à portée, ces bâtiments restent inactifs même avec toute la paperasse nécessaire. Le [entity=union-headquarters] n'est pas dans cette liste : il consomme déjà un biter comme ingrédient de recette.\n\n[font=default-bold]Fonctionnement de l'envoi :[/font]\n• Chargez la station avec des [item=biter-worker] et de l'[item=taxpayer-money]\n• La station envoie dans un rayon de [font=default-bold]30 tuiles[/font]\n• Elle envoie un travailleur vers chaque bâtiment géré de sa zone, en rotation\n• Chaque visite autorise un cycle de fabrication, puis le travailleur revient\n• Un seul bâtiment peut être servi par [color=green]plusieurs stations[/color] à la fois : les zones superposées augmentent la fréquence et le débit\n\nSurvolez un bâtiment géré pour voir quelles stations l'envoient. Survolez la station pour voir sa zone et son état d'envoi.\n\n[font=default-bold]Efficacité du travail :[/font]\nPar défaut, un travailleur autorise 1 machine par trajet ; la recherche porte ce nombre à 3, puis à 5. L'entité expédiée change d'apparence à chaque palier : un petit biter au palier 1, une formation plus imposante au palier 2, une unité encore plus lourde au palier 3. Le salaire par envoi suit la même progression : 1, 2 puis 3 [item=taxpayer-money] par trajet.\n\n[font=default-bold]La nuit :[/font]\nChaque envoi consomme aussi du [fluid=liquid-coffee] depuis l'une des quatre entrées latérales. Pas de café, pas d'envois nocturnes.\n\n[font=default-bold]Note économique :[/font]\nMoins de trajets signifie moins de paies. L'efficacité du travail réduit le coût en [item=taxpayer-money] par unité produite, pas seulement la fréquence d'envoi.
administratorio-biterport=[font=default-bold]Le biterport est une version terrestre du roboport.[/font]\n\nChargez-le avec des [item=biter-logistics-formation] (formés au [entity=formation-center]) et de l'[item=taxpayer-money]. Les travailleurs sortent pour transporter des objets entre coffres logistiques et construire les fantômes d'entités dans la zone.\n\n[font=default-bold]Couverture :[/font]\n• Rayon logistique : [font=default-bold]25 tuiles[/font]\n• Rayon de construction : [font=default-bold]55 tuiles[/font]\n• Portée réseau : les ports à [font=default-bold]50 tuiles[/font] les uns des autres partagent leurs travailleurs, même sans chevauchement de zone\n\n[font=default-bold]Améliorations de capacité de transport[/font] (objets portés par travailleur par trajet) :\n• Base : [font=default-bold]1[/font]\n• Palier 1 : [font=default-bold]2[/font]\n• Palier 2 : [font=default-bold]5[/font]\n• Palier 3 : [font=default-bold]10[/font]\n• Palier 4 : [font=default-bold]25[/font] (nécessite la science chimique)\n\nChaque palier améliore aussi l'entité du travailleur, qui se déplace progressivement plus vite. Priorisez la capacité de transport tôt : 8 travailleurs en base ne transportent que 8 objets au total, ce qui bloque la construction avant la première amélioration.\n\n[font=default-bold]La nuit :[/font]\nChaque envoi consomme du [fluid=liquid-coffee] depuis l'une des quatre entrées latérales.\n\nSurvolez un biterport pour voir l'état du réseau, les travailleurs actifs et le nombre de connexions.
administratorio-field-office=[font=default-bold]Du travail biter gratuit sans embaucher personne.[/font]\n\nConstruisez un [entity=field-office] près d'un nid ennemi (environ [font=default-bold]200 tuiles[/font]). Il appelle un biter du nid le plus proche pour fabriquer sur place. Après [font=default-bold]2 fabrications[/font], le biter rentre au nid et un autre est appelé.\n\n[font=default-bold]Règles d'exploitation :[/font]\n• Ne fabrique que lorsqu'un biter est physiquement présent\n• Vitesse 0,5x et 0 pollution pendant le travail\n• Inactif si aucun nid ennemi n'est à portée\n• Fonctionne toute la nuit et ne possède aucun emplacement de module\n\n[font=default-bold]Pourquoi il existe :[/font]\nLe bureau de terrain fait le pont entre "aucune main-d'oeuvre biter" et "[entity=biter-station] pleinement équipée". Il permet de produire quelques objets critiques avant que la chaîne de résolution n'ait embauché des travailleurs permanents, au prix d'une dépendance à un nid proche.
administratorio-hired-biter=[font=default-bold]Un biter contrôlable que vous commandez directement.[/font]\n\nLancez une [item=hired-biter-capsule] pour déployer un biter auquel vous pouvez donner des ordres. Il transporte jusqu'à [font=default-bold]20[/font] [item=eviction-notice] dans son inventaire de 4 emplacements et patrouille seul à la recherche de géniteurs à expulser.\n\n[font=default-bold]Commandes[/font] (en tenant [item=hired-biter-command-capsule]) :\n• [font=default-bold]Clic gauche[/font] au sol : sélectionner ou désélectionner les agents au curseur\n• [font=default-bold]Clic droit[/font] au sol : définir un point de passage pour les agents sélectionnés\n• [font=default-bold]Maj + clic droit[/font] au sol : ajouter un point de passage à l'itinéraire\n• [font=default-bold]Maj + clic droit[/font] sur un coffre : ajouter un arrêt de ravitaillement — l'agent se rend au coffre pour se recharger en [item=eviction-notice] en chemin\n• [font=default-bold]Maj + clic gauche[/font] sur un coffre : charger immédiatement des [item=eviction-notice] depuis ce coffre dans les agents sélectionnés\n\n[font=default-bold]Comportement avec stock :[/font]\nUn agent chargé scanne [font=default-bold]60 tuiles[/font] autour de lui pour trouver des géniteurs ennemis. Quand il en trouve un, il s'en approche et consomme un [item=eviction-notice] pour le détruire. Un seul agent en patrouille peut garder une zone pacifiée tant que vous le réapprovisionnez.\n\n[font=default-bold]Ravitaillement automatique :[/font]\nLes agents dans la zone de couverture d'un roboport logistique vanilla se réapprovisionnent automatiquement en [item=eviction-notice] depuis le réseau logistique quand leur stock est bas. Placez un coffre fournisseur passif avec des avis près de la zone de patrouille et l'agent se maintiendra sans intervention ni arrêts de ravitaillement explicites.\n\nLes expulsions livrées par agent déplacent quand même les biters proches dans votre système de plaintes, comme les avis lancés à la main. Prévoyez la capacité des bureaux.
administratorio-orbital-employment-catapult=[font=default-bold]La Catapulte d'Emploi Orbital lance des Mineurs Spatiaux d'Exploration Volontaire (MSEV) sur les astéroïdes.[/font]\n\nDébloquée par [technology=orbital-compliance-systems]. La catapulte a une portée de 56 cases mais ne tire qu'à travers un corridor étroit de 18° centré sur sa direction de pose. À l'impact, le MSEV s'accroche et commence le minage après un délai d'une seconde.\n\n[font=default-bold]Mécanique de minage :[/font]\n• Dégâts de base : 125/seconde par mineur attaché (évolue avec [technology=orbital-employment-damage-1..5])\n• Chaque astéroïde accepte 1 mineur de base, jusqu'à 5 avec [technology=orbital-employment-capacity-1..4]\n• Les dégâts s'additionnent linéairement par mineur attaché\n• Quand l'astéroïde meurt, il libère son rendement complet de fragments du jeu de base PLUS un fragment [item=returning-orbital-employee] par mineur attaché\n• Le fragment d'employé est extrait par les collecteurs d'astéroïdes directement en munitions MSEV réutilisables\n\n[font=default-bold]Critique — récupérez les fragments d'employé :[/font] Si un collecteur d'astéroïdes rate le fragment d'employé (il dérive au-delà du rayon de collecte), ce mineur est PERDU DÉFINITIVEMENT. Positionnez les collecteurs avec soin ou utilisez plusieurs collecteurs pour couvrir la zone de dérive.\n\n[font=default-bold]Priorité de dotation :[/font] La catapulte privilégie l'astéroïde éligible le plus proche à l'intérieur de son corridor de tir avec de la capacité disponible. Les tirs réservent la capacité immédiatement, et un astéroïde avec un MSEV attaché ou en approche ne peut pas être dévié. Si tous les astéroïdes éligibles sont à pleine capacité, la catapulte se met en pause jusqu'à ce qu'une place se libère.
administratorio-orbital-infrastructure-permit=[font=default-bold]Les Permis d'Infrastructure Orbitale autorisent la construction administrative de plateformes spatiales.[/font]\n\nDébloqués par [technology=space-platform] (vanilla). Produisez-les dans un bureau habilité à l'enregistrement à partir de [item=blank-directive], [item=transit-authorization], [item=low-density-structure] et [item=processing-unit].\n\n[font=default-bold]Utilisation :[/font] Requis comme ingrédient pour placer [entity=administrative-space-station], [entity=trajectory-compliance-array], [entity=orbital-employment-catapult], et d'autres bâtiments administratifs orbitaux. Le [item=construction-permit] ordinaire n'a aucune juridiction dans le vide — ceci en est l'équivalent homologué pour l'espace.\n\n[font=default-bold]Chaîne d'approvisionnement :[/font] Fabriquez des permis avant ou en même temps que votre première plateforme. Gardez-en une réserve avec vos matériaux de construction : chaque installation orbitale en consomme un lors de sa pose.

administratorio-relocation-cannon=[font=default-bold]Pas de réglage de cible. C'est le récepteur qui demande.[/font]\n\nDeux bâtiments distincts : le [entity=involuntary-relocation-cannon] envoie, le [entity=involuntary-relocation-receiver] demande.\n\n[font=default-bold]Envoi :[/font] chargez du personnel de la famille biter dans l'emplacement d'entrée du canon. C'est tout. Il répondra à tout récepteur d'une autre planète dont la demande correspond à ce qu'il contient — tant que cet emplacement n'est pas entièrement épuisé, il n'acceptera pas un autre type de cargaison.\n\n[font=default-bold]Réception :[/font] chargez des formulaires [item=involuntary-transfer-order] dans l'emplacement d'entrée du récepteur, et connectez-le à un réseau de circuits avec un signal nommant chaque objet que cette planète désire. Un ordre est consommé par objet livré, et les arrivées apparaissent dans les emplacements de sortie pour que vous les récupériez.\n\n[font=default-bold]Une planète pratiquant les deux sens construit un de chaque.[/font] Contrairement au [entity=interplanetary-terminus], aucun des deux n'est limité à un exemplaire par planète.\n\n[font=default-bold]Il transporte du personnel, jamais des œufs[/font], et seulement entre planètes. Les fusées gèrent tout le reste.
administratorio-egg-couriers=[font=default-bold]Les œufs de biters ne quittent jamais Nauvis.[/font]\n\nLes œufs avariés font éclore des biters hostiles, un pour 25. Hors de Nauvis, il n'y a ni [entity=admin-station], ni chaîne de plaintes, ni aucun moyen de gérer ce qui en sort. Donc chaque recette vanilla qui consommait des œufs hors-monde utilise désormais à la place un coursier formé sur Nauvis. Les coûts en œufs vanilla restent inchangés — seul ce qui traverse l'espace change.\n\n• [item=missionary-manager] — vers Aquilo, consommé par [entity=captive-biter-spawner]\n• [item=voluntary-research-subject] — vers l'orbite, consommé par la science Administratorium\n• [item=geotechnical-assessment-manager] — vers Gleba, [color=green]rendu[/color] après la recette du sol\n\n[font=default-bold]Les trois expirent après 30 minutes[/font] en un [item=middle-management-managing-manager] ordinaire. Un coursier expiré vous coûte les œufs et le trajet, jamais le manager.\n\n[font=default-bold]Le piège de l'emplacement d'entrée :[/font] la science Administratorium fonctionne par lot — il lui faut 250 [item=promethium-asteroid-chunk] et 10 [item=quantum-processor] en attente avant de démarrer. Un [color=red]cobaye inséré avant l'arrivée des fragments épuise son minuteur de 30 minutes dans l'emplacement d'entrée et y expire.[/color] Placez d'abord les fragments et processeurs, livrez le coursier en dernier. Cet échec est silencieux et coûteux.
administratorio-chromatic-trunk=[font=default-bold]La paperasse colorée ne traverse pas le tronc de base.[/font]\n\nTant que [technology=interplanetary-tube-chromatic] n'est pas recherché sur Aquilo, le [entity=interplanetary-terminus] ne transporte que la paperasse ordinaire à encre noire — formulaires, tickets, dossiers, affaires, mémoires, papier, encre et argent des contribuables. Les documents cyan, jaunes, magenta et composites ne sont tout simplement pas des cargaisons valides, et les bras mécaniques refuseront de les charger.\n\n[font=default-bold]Après le palier chromatique :[/font] les formulaires vierges colorés, les trois formulaires bicolores, [item=cryogenic-operations-license], [item=hardened-data-vault], [item=trichromatic-permit], [item=unified-operations-charter] et [item=promethium-research-charter] deviennent tous autorisés dans le tronc.\n\n[font=default-bold]Remarque stratégique :[/font] une fois mutualisé, un document est disponible pour la demande de n'importe quelle planète, y compris celle qui vient de le fournir. Il n'existe aucun moyen de réserver un document mutualisé pour une destination précise.
administratorio-interplanetary-terminus=[font=default-bold]Le Terminus Interplanétaire est le point d'accès au tronc. Un par planète, plus avec la recherche.[/font]\n\nDébloqué par [technology=interplanetary-tube-network]. Son emplacement d'entrée contient un seul type de formulaire à la fois pour l'export, et seules les cargaisons valides sont acceptées. Il part selon son propre minuteur et rejoint un pool partagé par toutes les planètes de votre force — aucune demande n'est nécessaire pour le charger.\n\n[font=default-bold]Fil vert :[/font] définissez un signal pour chaque formulaire que cette planète désire ; un formulaire correspondant dans le pool est instantanément réclamé, peu importe sa provenance — même un formulaire fourni par cette même planète.\n[font=default-bold]Fil rouge :[/font] lit le contenu actuel du pool, à l'échelle de l'empire. Les deux couleurs partagent le seul connecteur du Terminus sans interférer.\n\n[font=default-bold]Plus d'un par planète :[/font] [technology=interplanetary-tube-additional-terminus-3] et ses deux prérequis autorisent chacun un Terminus supplémentaire sur la même planète. Le dernier des trois est illimité — coûteux, mais jamais plafonné.\n\n[font=default-bold]Les arrivées ne s'auto-alimentent pas.[/font] La paperasse arrivée reste dans l'inventaire de sortie du Terminus jusqu'à ce que vous la déplaciez. C'est volontaire : cela vous donne un tampon visible, une liste de contenu lisible par circuit, et une vraie séparation entre le pool de tubes local et l'interplanétaire.
administratorio-interplanetary-trunk=[font=default-bold]Le tronc est étroit et lent, volontairement.[/font]\n\nLe réseau pneumatique local est instantané, propre à chaque surface, et monte jusqu'à 200 formulaires. Le tronc interplanétaire est un pool [color=red]distinct[/color] : il commence à 3 objets en transit, 30 secondes chacun, et ne fusionne jamais avec le réseau local. S'il le faisait, vous auriez une téléportation gratuite de planète à planète et les fusées cesseraient d'avoir de l'importance.\n\n[font=default-bold]Le transit se fait par objet, pas par lot.[/font] Chaque objet a son propre minuteur, donc plusieurs peuvent traverser en même temps : la capacité indique combien, le transit indique combien de temps chacun prend.\n\n[font=default-bold]Cargaison :[/font] uniquement la paperasse ordinaire à encre noire. Les formulaires colorés attendent [technology=interplanetary-tube-chromatic] sur Aquilo.
administratorio-trunk-capacity=[font=default-bold]La recherche de capacité du tronc l'élargit et l'accélère à la fois.[/font]\n\nChaque palier augmente le nombre d'objets pouvant être en transit et réduit la durée de chacun :\n• base — 3 objets, 30 s chacun\n• [technology=interplanetary-tube-capacity-2] — 5 objets, 15 s\n• [technology=interplanetary-tube-capacity-3] — 10 objets, 5 s\n• [technology=interplanetary-tube-capacity-4] — 15 objets, 2 s\n• [technology=interplanetary-tube-capacity-5] — 20 objets, 1 s\n\nLe palier ultime relève du travail Administratorium. Même entièrement recherché, 20 formulaires en transit restent un filet d'eau comparé à une fusée — c'est voulu.
administratorio-aquilo-tube-network=[font=default-bold]Aquilo remplace l'encre liquide gelée par un support solide et ouvre le tronc chromatique.[/font]\n\nLe [entity=laser-printer] consomme du [item=thermal-transfer-sheet] et du [item=composite-chroma-ribbon]. Le palier [technology=interplanetary-tube-chromatic] étend le tronc interplanétaire à la paperasse colorée, que le palier de base ne transporte pas.\n\nCette même branche autorise la paperasse trichrome, les licences cryogéniques, l'expédition Administratorium et, à terme, les arrêts de train publics sans formulaire. Prévoyez un [item=cryoprint-technician] pour chaque imprimante que vous comptez construire.
administratorio-workforce-formation-title=[font=default-bold]L'infrastructure spatiale a son propre personnel, ses permis, ses formulaires d'exploitation et sa politique d'astéroïdes.[/font]\n\nCette catégorie suit la boucle administrative orbitale complète : financer l'expansion avec des instruments portables plutôt que des paiements locaux aux contribuables, délivrer un [item=orbital-infrastructure-permit] avant construction, former des spécialistes, briefer les managers juste à temps, imprimer des [item=orbital-operations-form] renouvelables à bord de la plateforme, et choisir si chaque astéroïde doit être repoussé ou pris en charge par un Mineur Spatial d'Exploration Volontaire.\n\nCommencez par les entrées de financement et de permis. Les systèmes de main-d'œuvre et d'astéroïdes se débloquent plus tard, à mesure que leurs technologies deviennent disponibles.
administratorio-chromatic-printing=[font=default-bold]La paperasse de Space Age est codée par couleur selon la juridiction planétaire.[/font]\n\n[fluid=cyan-ink] Le cyan appartient à Vulcanus, [fluid=yellow-ink] le jaune à Gleba, et [fluid=magenta-ink] le magenta à Fulgora. L'[entity=chromatic-printer] combine ces encres avec l'impression noire ordinaire pour produire les formulaires planétaires puis, plus tard, des documents bicolores. Aquilo remplace les encres liquides par un support de transfert solide à l'[entity=laser-printer].\n\nLes formulaires colorés sont des verrous de recette fonctionnels, pas des intermédiaires décoratifs : les ingrédients de classe tungstène ajoutent de la paperasse cyan, les recettes de fibre de carbone ajoutent de la paperasse jaune, les ingrédients de classe holmium ajoutent de la paperasse magenta, et les recettes couvrant plusieurs industries planétaires condensent ces exigences en un seul formulaire composite.
administratorio-chromatic-printer=[font=default-bold]L'Imprimante Chromatique est la plateforme d'impression terrestre de Space Age.[/font]\n\nElle accepte les recettes d'impression noire, cyan, jaune et magenta au fur et à mesure que leurs technologies se débloquent. Utilisez-la pour le stock cyan résistant à la chaleur, le stock jaune périssable, le stock magenta stable au signal, et la paperasse bicolore. Elle fonctionne sur les planètes atmosphériques mais pas dans le vide ni sous le régime de pression cryogénique d'Aquilo ; utilisez-y une [entity=laser-printer].\n\nLa machine ne produit pas toutes les couleurs dès la recherche initiale de [technology=chromatic-printing]. Chaque branche de traitement planétaire débloque sa propre encre et ses formulaires finaux, donc prévoyez de la place pour quatre canaux d'entrée même si l'imprimante précoce n'utilise que le noir et le cyan.
administratorio-chromatic-inks=[font=default-bold]Chaque encre colorée a une matière première locale et une juridiction distincte.[/font]\n\n• [fluid=cyan-ink] — raffinée à partir du [fluid=cyan-slurry] de Vulcanus, utilisée pour la métallurgie et la paperasse résistante à la chaleur\n• [fluid=yellow-ink] — raffinée à partir de la [fluid=amber-sap] et des nutriments de Gleba, utilisée pour la paperasse biologique\n• [fluid=magenta-ink] — raffinée à partir des rebuts de Fulgora, utilisée pour la paperasse d'archives et électromagnétique\n• L'[item=ink] noire — reste le support de copie ordinaire\n\nImporter une encre peut permettre l'impression à distance, mais ne contourne pas la technologie qui autorise les formulaires correspondants. Aquilo ne peut pas utiliser ces liquides directement et compresse à la place les formulaires CMJ importés en [item=composite-chroma-ribbon].
administratorio-multicolor-forms=[font=default-bold]Les formulaires composites remplacent l'empilement de paperasse planétaire sur les recettes interindustrielles.[/font]\n\nLes trois branches bicolores émettent [item=cyan-yellow-form], [item=cyan-magenta-form] et [item=yellow-magenta-form]. Quand une recette ordinaire consomme des intermédiaires associés à deux planètes, Administratorio ajoute le formulaire composite correspondant au lieu d'exiger les deux formulaires monocolores. Les recettes à trois planètes et certaines recettes de fin de partie montent jusqu'au [item=trichromatic-permit], à l'[item=unified-operations-charter], ou à un autre document capstone explicite.\n\nCe verrouillage s'applique aussi à la production Space Age vanilla. Inspectez la recette concernée plutôt que de supposer que sa liste d'ingrédients vanilla a survécu à la revue interdépartementale.
administratorio-vulcanus-certification=[font=default-bold]Vulcanus remplace le combat par la propagande minérale et l'arbitrage territorial.[/font]\n\nExtrayez du [item=verdigris-crust] pour démarrer la chaîne cyan, transformez la lave en [fluid=molten-promises] puis en abondants [fluid=lie], certifiez l'industrie locale à un [entity=notary-office], et retirez du territoire aux démolisseurs par le traitement du [entity=territorial-arbitration-post]. Le [item=territorial-deed] obtenu est le jalon d'évasion local de la planète.\n\nLes bâtiments de Vulcanus consomment leur spécialiste à la construction mais n'exigent aucun travailleur récurrent ni formulaire d'exploitation. Prévoyez assez de personnel [item=licensed-notary] pour les bureaux et fonderies que vous comptez installer.
administratorio-gleba-conciliation=[font=default-bold]Gleba cultive sa bureaucratie, et naturellement, elle s'avarie aussi.[/font]\n\nPompez de la [fluid=amber-sap] pour amorcer localement du [item=bullshit-ore], de l'encre noire, des certificats carbone et des raccourcis d'approbation. Raffinez de l'encre jaune pour l'[entity=chromatic-printer], finalisez les exceptions biologiques au [entity=conciliation-desk], et utilisez les modes de leurre du [entity=capture-bureau] pour la capture de faune.\n\nLe stock jaune et la paperasse de conciliation finie sont périssables. La chaîne locale est volontairement abondante mais sensible au temps, comme des cosmétiques dans une salle de bain sans discipline de fermeture.
administratorio-cross-planet-bureaucracy=[font=default-bold]La production interplanétaire converge par la paperasse composite.[/font]\n\nLes recherches cyan-jaune, cyan-magenta et jaune-magenta combinent chacune deux juridictions planétaires en un formulaire et un petit ensemble d'autorisations interplanétaires. La branche cyan-jaune ouvre aussi l'économie du tourisme orbital. Aquilo fait ensuite converger les trois couleurs vers un support de transfert sec, des permis trichromes, l'accès au tronc chromatique et les chartes d'expédition finales.\n\nDéplacez des formulaires finis durables entre les mondes dès que possible. La paperasse jaune source s'avarie, l'encre liquide ne peut pas servir toutes les surfaces, et un tronc interplanétaire saturé a la disponibilité émotionnelle de Regina George un lundi matin.
administratorio-space-age-enrollment=[font=default-bold]Space Age transforme l'embauche directe en un circuit d'inscription probabiliste.[/font]\n\nPlacez une [item=job-offer] dans un emplacement d'[entity=admin-station] sur Nauvis avant que la résolution finale du biter n'arrive. L'offre est consommée quand l'inscription est tentée. Seuls les biters sont éligibles ; les spitters ne s'inscrivent jamais. Le succès dépend de la frustration au moment de la résolution :\n• Moins de 25 % de frustration — 5 % de chance\n• De 25 % à moins de 50 % — 1 % de chance\n• 50 % ou plus — 0 % de chance\n\nUn succès produit exactement un [item=enrolled-biter], quelle que soit la taille du biter. Traitez-le via [recipe=worker-biter-formation] au [entity=formation-center] pour obtenir un [item=worker-biter] réutilisable. Sans Space Age, l'ancienne règle convertit directement un citoyen résolu en travailleurs selon sa taille.
administratorio-offworld-economy=[font=default-bold]L'Argent des Contribuables est un flux de revenu propre à Nauvis, pas une ressource planétaire universelle.[/font]\n\nAvec Space Age actif, les citoyens résolus ne paient de l'[item=taxpayer-money] que sur Nauvis. La résolution de plaintes hors-monde clôt toujours les dossiers mais ne produit aucun paiement local. Formez les professions biters sur Nauvis, puis rebriefez localement des MMMM réutilisables sans dépenser d'argent des contribuables.\n\nLes [item=treasury-bond] Bons du Trésor sont la monnaie courante portable. Le tourisme orbital produit des bons supplémentaires sans inventer de contribuables hors-monde, tandis que les [item=government-grant] Subventions Gouvernementales restent le palier des grands projets, utilisé pour les constructions majeures comme les silos à fusée.
administratorio-management-briefings=[font=default-bold]Les Middle-Management Managing Managers doivent assister à la bonne réunion avant de pouvoir superviser un travail spécialisé.[/font]\n\nChaque réunion consomme un manager ordinaire, un petit matériau thématique, et 5 [fluid=liquid-coffee], puis rend un manager briefé correspondant. Elle ne consomme jamais d'[item=taxpayer-money] et peut se tenir dans un [entity=formation-center] sur n'importe quelle planète. Les cinq thèmes sont Formation, Effectifs, Conformité, Liaison et Opérations Orbitales.\n\nLes managers briefés redeviennent des managers ordinaires après [font=default-bold]3 minutes[/font]. Les formations et constructions dotées en personnel rendent le manager non briefé, donc gardez un petit stock réutilisable de managers et briefez-le localement au dernier moment.
administratorio-yellow-paperwork-spoilage=[font=default-bold]La paperasse jaune de Gleba a une date limite de dépôt.[/font]\n\nLe [item=mycelial-form-stock] et le [item=blank-yellow-form] s'avarient en [item=paper] après 5 minutes. Les [item=symbiosis-record] et [item=conciliation-order] terminés durent 10 minutes avant de redevenir du papier. Les formulaires cyan, magenta et composites sont stables sauf indication contraire dans leur propre infobulle.\n\nGardez la production jaune près de ses consommateurs, utilisez des tampons courts, et surveillez la fraîcheur lors de l'expédition. Si une recette durable peut consommer un formulaire composite fini à la place, imprimez-le avant que le composant jaune ne se périme.
administratorio-pentapod-bargaining=[font=default-bold]Les œufs de pentapodes ont un amorçage manuel et une filière de récolte automatisée.[/font]\n\n[font=default-bold]Amorçage :[/font] déposez de l'[item=taxpayer-money] au sol dans un rayon de 24 cases d'un pentapode sauvage. Il marche jusqu'à l'argent, consomme le tas à proximité, et laisse des œufs au sol. Chaque œuf de base coûte un montant aléatoire de 10 à 20 pièces ; les pentapodes plus gros multiplient le rendement.\n\n[font=default-bold]Automatisation :[/font] sur Gleba, réglez un [entity=capture-bureau] sur sa recette de récolte d'œufs et fournissez des [fluid=oviposition-lure-spores]. Le bureau consomme 1 unité de leurre par seconde, attire les pentapodes compatibles dans un rayon de 48 cases, et produit des œufs selon l'espèce et la taille.\n\nLes œufs de pentapodes conservent l'avarie vanilla. S'ils éclosent, les pentapodes prématurés sont hostiles au joueur, donc traitez-les ou réfrigérez-les avec une certaine urgence.
administratorio-space-tourism=[font=default-bold]Le tourisme des spitters convertit la faune de Nauvis en revenu orbital portable.[/font]\n\n1. Placez un [entity=capture-bureau] sur Nauvis, sélectionnez l'accueil touristique, et fournissez des [fluid=tourism-lure-spores]. Chaque spitter capturé consomme l'autorisation [item=cyan-yellow-form] du mode et devient un forfait touristique adapté à sa taille.\n2. Lancez le forfait dans les 5 minutes. S'il s'avarie, il éclot à nouveau en spitter en colère.\n3. Traitez-le à une [entity=administrative-space-station] avec un [item=orbital-operations-form]. Les touristes petit, moyen, gros et béhémoth paient respectivement 2, 4, 9 et 24 [item=treasury-bond].\n4. Retournez l'objet touriste payé à une [entity=admin-station] sur Nauvis. Le bureau le relâche paisiblement ; il ne devient ni paperasse ni un autre travailleur.
administratorio-promethium-administration=[font=default-bold]L'expédition Administratorium est l'ultime contrôle de paperasse interplanétaire.[/font]\n\nLe chemin vanilla vers [technology=promethium-science-pack] exige en plus [technology=interplanetary-tube-chromatic] et la Science Administrative. En orbite, combinez un [item=unified-operations-charter], une [item=cryogenic-operations-license], un [item=hardened-data-vault] et un [item=asteroid-processing-docket] en une [item=promethium-research-charter].\n\nChaque recette de [item=promethium-science-pack] consomme cette charte d'expédition en plus de ses ingrédients Space Age. Le tronc peut acheminer les formulaires prérequis, mais la charte elle-même est assemblée dans le vide. Terminez les branches des planètes colorées avant de planifier l'expédition vers la planète brisée.
administratorio-vulcanus-manifest=[font=default-bold]Vulcanus fonctionne à la propagande.[/font]\n\nLa chaîne locale transforme la lave et les minéraux cyan en [fluid=molten-promises] Promesses en Fusion puis en abondants [fluid=lie] Mensonges. L'Arbitrage Territorial consomme des ordres [item=territorial-resettlement-order] plus 50/100/200 mensonges par seconde pour les démolisseurs petit/moyen/gros. Les territoires plus grands coûtent plus cher car apparemment la géologie a une personnalité juridique.\n\n[font=default-bold]À apporter délibérément :[/font] assez de [item=licensed-notary] Notaires Agréés formés sur Nauvis pour chaque bâtiment spécialisé, un petit stock de MMMM ordinaires rebriefables sur place, et un [item=chemical-operator] Opérateur Chimique si souhaité.\n[font=default-bold]À produire sur place :[/font] paperasse cyan, formulaires ordinaires, briefings MMMM bon marché, fluide de propagande et matériaux de fusée.\n[font=default-bold]Jalon d'évasion :[/font] nettoyer un territoire de démolisseur, recevoir un [item=territorial-deed], compléter la paperasse ordinaire de gestion écrite, et construire la recette de silo à fusée partagée.
administratorio-gleba-manifest=[font=default-bold]Gleba a trop de baratin, par conception.[/font]\n\nPompez la sève ambrée et ensemencez-en de grandes quantités de [item=bullshit-ore]. Les recettes de culture locale transforment ce surplus en données douteuses, excuses, absurdités raffinées, approbations provisoires et documentation jetable. La paperasse jaune s'avarie toujours, donc l'offre est abondante tandis que la logistique reste biologiquement pénible.\n\n[font=default-bold]À apporter délibérément :[/font] des [item=conciliation-officer] Officiers de Conciliation formés sur Nauvis pour la branche des biochambres, un petit stock réutilisable de MMMM, et un [item=chemical-operator] Opérateur Chimique si souhaité.\n[font=default-bold]À produire sur place :[/font] matériel administratif ordinaire, briefings MMMM bon marché, et fournitures pour fusée.\n[font=default-bold]Jalon d'évasion :[/font] compléter la paperasse ordinaire de gestion écrite et construire la même recette de silo à fusée utilisée partout ailleurs.
administratorio-fulgora-archives=[font=default-bold]Fulgora recycle le classeur, puis les dossiers, puis l'explication.[/font]\n\nLa ferraille peut donner du [item=old-archive]. Les archives se recyclent rapidement, mais seulement en formulaires de départ aléatoires. Tout formulaire de paperasse peut aussi être recyclé dans un [entity=recycler] Recycleur ordinaire en un [item=paper], avec 25 % de chance. Les gravats redondants et le toner offrent une production ordinaire déterministe via des recettes de récupération locales.\n\nLe [entity=archive-recombination-bureau] est une variante distincte de Recycleur à une seule entrée. Insérez un formulaire compatible et il sélectionne automatiquement la recette de réaffectation de ce formulaire. Trois formulaires de remplacement candidats, de même rang et respectant la couleur, tirent chacun indépendamment à 25 %, donc une opération peut rendre zéro, un, deux ou trois formulaires dans l'inventaire de résultat normal. Les candidats n'incluent jamais le formulaire d'entrée lui-même, ne montent jamais de rang de progression, et n'inventent jamais de couleur. Le [item=relay-clerk] consommé à la construction de la machine en est l'employé permanent.\n\n[font=default-bold]À apporter délibérément :[/font] des Agents de Liaison formés sur Nauvis pour chaque bâtiment numérique, électromagnétique ou d'archives équipé, un petit stock réutilisable de MMMM, et un [item=chemical-operator] Opérateur Chimique si souhaité. Rebriefez les managers sur place à partir de matériaux compatibles avec la ferraille et d'un peu de café.
administratorio-aquilo-manifest=[font=default-bold]Aquilo, c'est la convergence, pas l'abondance.[/font]\n\nApportez la paperasse colorée des planètes précédentes, des spécialistes [item=cryoprint-technician] formés sur Nauvis, et un petit stock de MMMM ordinaires. Le [entity=interplanetary-terminus] déplace les formulaires finis entre les mondes sur un tronc lent et étroit ; les arrivées attendent dans son propre inventaire jusqu'à ce que vous les déplaciez. Briefez les managers sur place avec un seul matériau thématique et 5 café.\n\n[font=default-bold]Silo à fusée :[/font] la recette partagée est disponible ici, mais sa [item=government-grant] Subvention Gouvernementale et son [item=management-approval-written] Approbation de Gestion Écrite doivent arriver par la logistique interplanétaire.\n\nLe [entity=archive-recombination-bureau] fonctionne aussi ici, mais la progression cryogénique critique reste déterministe. Utilisez ses tirages de réaffectation à un formulaire pour rééquilibrer les surplus, pas pour parier sur le seul permis qui maintient l'usine en vie.
administratorio-propaganda-distillery=[font=default-bold]La Distillerie de Propagande traite la chaîne de fluides Mensonges et Désinformation.[/font]\n\nDébloquée par [font=default-bold]Propagande Industrielle[/font], ce bâtiment remplace le traitement chimique pour ces fluides bureaucratiques. Sa catégorie de fabrication est exclusive — seules les recettes de distillerie s'y exécutent.\n\n[font=default-bold]Recettes clés :[/font]\n• [fluid=politician-fluid] Fluide Politicien → [fluid=lie] Mensonges\n• [fluid=lie] Mensonges + [item=dubious-data] Données Douteuses → [fluid=misinformation] Désinformation\n• [fluid=misinformation] Désinformation + [item=credentials] Accréditations + [fluid=politician-fluid] Fluide Politicien → [item=justification] Justification\n• [item=treasury-bond] Bon du Trésor + [fluid=lie] Mensonges → [fluid=slush-fund] Caisse Noire (jeu de base uniquement ; cette recette n'existe pas avec Space Age actif)\n\n[font=default-bold]Pas des recettes de distillerie, malgré l'usage des mêmes fluides :[/font]\n[item=credentials] Les Accréditations sont imprimées au [entity=office-desk], et l'[item=refined-nonsense] Absurdité Raffinée est préparée à la [entity=corporate-breakroom]. Les usines chimiques et raffineries de pétrole ne gèrent [color=red]aucune[/color] partie de cette chaîne.
administratorio-pneumatic-transport=[font=default-bold]Déplacez la paperasse instantanément par des tubes en papier kraft scellés.[/font]\n\nLe système de tubes pneumatiques transporte les objets de paperasse via une chaîne de signaux cachée — les objets entrent d'un côté et apparaissent instantanément de l'autre :\n\n[font=default-bold]Bâtiments :[/font]\n• [entity=tube-intake] [font=default-bold]Entrée de Tube[/font] — consomme les objets de paperasse valides depuis un tapis/coffre adjacent via un bras mécanique caché\n• [entity=tube-outtake] [font=default-bold]Sortie de Tube[/font] — distribue les objets depuis le pool de signaux ; utilisez votre propre bras mécanique ou logistique pour extraire\n• [entity=pneumatic-pipe] [font=default-bold]Tuyau Pneumatique[/font] — de couleur kraft, connecte les entrées aux sorties\n• [entity=pneumatic-pipe-to-ground] [font=default-bold]Tuyau Pneumatique Souterrain[/font] — portée de 16 cases\n\n[font=default-bold]Fonctionnement :[/font]\nLes stations d'entrée ont un bras mécanique caché qui ne prélève que des objets de paperasse valides depuis les tapis ou coffres adjacents. Les stations de sortie sont des conteneurs — utilisez votre propre bras mécanique ou logistique pour en extraire les objets. Réglez un filtre sur l'emplacement d'inventaire de la sortie pour demander un type d'objet précis.\n\nLes tuyaux pneumatiques définissent le réseau de signaux — toute entrée et sortie connectées par des tuyaux partagent instantanément leurs objets. Plusieurs types d'objets peuvent circuler dans le même réseau de tuyaux (transport sushi). Chaque réseau a une limite de capacité qui peut être augmentée par la recherche.\n\nLes tuyaux pneumatiques utilisent une catégorie de connexion distincte — ils [color=red]ne peuvent pas[/color] se connecter aux tuyaux de fluide ordinaires.\n\nSurvolez une entrée ou sortie de tube pour voir un panneau d'état en direct montrant la connexion au réseau, l'usage de la capacité et le contenu en objets.\n\nDébloqué par la recherche [font=default-bold]Transport Pneumatique de Formulaires[/font] après [font=default-bold]Technologie d'Impression[/font] et [font=default-bold]Science Logistique[/font].
administratorio-bullshit-economy=[font=default-bold]Le Minerai de Baratin alimente toute la chaîne d'approvisionnement en certificats et excuses.[/font]\n\nExtrayez du [item=bullshit-ore] Minerai de Baratin pour produire :\n• [item=dubious-data] Données Douteuses (raffinées à partir du minerai)\n• [item=basic-excuse] Excuse Basique → [item=good-excuse] Bonne Excuse\n• [item=crappy-report] Rapport Médiocre → [item=justification] Justification → [item=narrative] Récit\n• [item=white-paper] Livre Blanc → [item=policy] Politique → [item=regulation] Réglementation\n\n[font=default-bold]Dérivés des Gravats Redondants :[/font]\nLes [item=redundant-rubble] Gravats Redondants sont transformés en trois paliers de dérivés :\n• [item=useless-documentation] [font=default-bold]Documentation Inutile[/font] — gravats + papier, utilisée dans le Formulaire 27B-6 et les bons du trésor\n• [item=compacted-rubble] [font=default-bold]Gravats Compactés[/font] — gravats + certificat carbone, utilisés dans les bâtiments et recettes tardives\n• [item=refined-nonsense] [font=default-bold]Absurdité Raffinée[/font] — gravats compactés + désinformation, utilisée dans les accréditations, récits et résolutions de haut niveau\n\n[font=default-bold]Chaîne de financement gouvernemental :[/font]\n[item=taxpayer-money] Argent des Contribuables (Nauvis uniquement) → [item=treasury-bond] Bon du Trésor (50 argent) → [item=government-grant] Subvention Gouvernementale (10 bons)\n\nLes bons du trésor sont la monnaie bureaucratique courante et échangeable ; les subventions gouvernementales sont réservées aux grands projets d'investissement comme les silos à fusée. Les [fluid=slush-fund] Caisses Noires et les [font=default-bold]Audits Fiscaux[/font] de fin de partie au [entity=union-headquarters] Siège Syndical peuvent produire du financement supplémentaire sur Nauvis.\n\n[font=default-bold]Chaîne de production multi-bâtiments :[/font]\n• [entity=office-desk] Bureau : formulaires, paquets de science, données, bons du trésor, certificats vérifiés, rapports environnementaux et permis de raffinerie\n• [entity=corporate-breakroom] Salle de pause : café, ragots, bonnes excuses, brouillons d'approbation verbale\n• [entity=union-headquarters] Siège Syndical : approbations syndicales, subventions gouvernementales, récits, approbations écrites, livres blancs, politique, réglementation et audits fiscaux\n• [entity=propaganda-distillery] Distillerie : mensonges, désinformation, accréditations, caisses noires, absurdité raffinée
administratorio-transit-authorization=[font=default-bold]Les gares ont un coffre à paperasse intégré.[/font]\n\nChaque [entity=train-stop] Gare exige désormais des formulaires [item=transit-authorization] Autorisation de Transit (Formulaire 12-T) pour rester opérationnelle.\n\n[font=default-bold]Fonctionnement :[/font]\n1. Chaque Gare reçoit un [entity=transit-permit-chest] coffre à permis de transit intégré.\n2. Insérez des [item=transit-authorization] Autorisations de Transit dans ce coffre.\n3. Un formulaire est [font=default-bold]consommé à l'arrivée d'un train[/font] qui commence à attendre à la gare.\n4. Si une gare manque de formulaires, elle ferme automatiquement en réglant sa limite de trains à 0.\n\n[font=default-bold]Mise en place :[/font]\n• Recherchez la technologie [font=default-bold]Chemin de fer[/font] pour débloquer la recette du formulaire.\n• Fabriquez les formulaires au [entity=office-desk] Bureau Administratif.\n• Gardez les gares approvisionnées par tapis, bras mécaniques ou logistique pour que les hubs chargés ne se bloquent pas.\n\nCe système fait de la logistique ferroviaire un problème de paperasse plutôt que de combat.
administratorio-admin-science=[font=default-bold]La Science Administrative alimente votre expansion bureaucratique.[/font]\n\nLa recherche administrative exige le [item=administrative-science-pack] Paquet de Science Administrative (Rose). Ce paquet est le goulot d'étranglement de la plupart des technologies bureaucratiques personnalisées.\n\n[font=default-bold]Production :[/font]\nProduit au [entity=office-desk] Bureau Administratif à partir de :\n• [item=provisional-approval] Approbation Provisoire ×5\n• [item=basic-excuse] Excuse Basique ×5\n• [item=research-grant-approval] Approbation de Subvention de Recherche ×1\n\n[font=default-bold]Utilisation :[/font]\nCe paquet remplace la science militaire dans les coûts de recherche vanilla et est aussi utilisé dans tout l'arbre technologique personnalisé. Si votre chaîne de paperasse cale, votre recherche cale avec elle.
administratorio-workforce-formation=[font=default-bold]La progression de main-d'œuvre de Space Age transforme un citoyen inscrit en profession.[/font]\n\n[technology=worker-formation] débloque [recipe=worker-biter-formation]. Ensuite, [technology=management-formation] ajoute les Stagiaires de Bureau, Stagiaires de Direction, Middle-Management Managing Managers et leurs briefings ; [technology=specialized-formation] ajoute les Astronautes. L'amorçage pré-science de chaque planète débloque son spécialiste requis avant le bâtiment qui le consomme, tandis que [technology=orbital-compliance-systems] autorise les Mineurs Spatiaux d'Exploration Volontaire.\n\nToute la formation de profession reste sur Nauvis. Exportez les spécialistes finis et les MMMM ordinaires ; les managers peuvent assister à des briefings bon marché et sans argent sur n'importe quelle planète. Les spécialistes sont généralement consommés quand leur bâtiment correspondant est construit. Les MSEV font exception : ce sont des munitions de canon réutilisables si leurs fragments d'employé de retour sont récupérés.
administratorio-orbital-specialists=[font=default-bold]Les spécialistes sont des consommables de construction, pas un carburant continu.[/font]\n\nContrairement aux travailleurs biters qui enchaînent les envois de [entity=biter-station], les Astronautes, Notaires Agréés, Officiers de Conciliation, Agents de Liaison, Techniciens Cryoprint et Négociateurs de Terrain sont formés sur Nauvis, stockés dans votre inventaire, et consommés quand vous [color=red]posez[/color] le bâtiment correspondant.\n\n[font=default-bold]Règle de planification :[/font] construisez un spécialiste pour [font=default-bold]chaque[/font] bâtiment correspondant dans votre file de construction. Par exemple, chaque [entity=digital-services-bureau], [entity=interplanetary-terminus] et [entity=archive-recombination-bureau] a besoin de son propre [item=relay-clerk] ; chaque [entity=administrative-space-station] a besoin de son propre [item=astronaut]. Constituez un stock avant le départ.\n\n[font=default-bold]Middle-Management Managing Managers (MMMM) :[/font] gardez un stock réutilisable de managers ordinaires. Les variantes briefées sont produites sur place à partir d'un manager, un matériau thématique et 5 café, expirent après 3 minutes, et reviennent non briefées après une construction dotée en personnel. Aucun argent des contribuables n'est impliqué.
administratorio-trajectory-compliance-arrays=[font=default-bold]Les Réseaux de Conformité Trajectorielle poussent les astéroïdes — ils ne les minent pas.[/font]\n\nLe [entity=trajectory-compliance-array] (Junior), le [entity=senior-trajectory-compliance-array] (Senior) et le [entity=executive-trajectory-compliance-array] (Exécutif) acceptent les ordres routiniers [item=orbital-deviation-order] et les ordres prioritaires [item=priority-orbital-deviation-order]. La paperasse prioritaire applique deux fois la poussée soutenue.\n\n[font=default-bold]Juridictions par palier :[/font]\n• Junior : astéroïdes petits et moyens, portée de 20 cases\n• Senior : astéroïdes petits, moyens et gros, portée de 30 cases\n• Exécutif : toutes tailles y compris les énormes Administratorium, portée de 40 cases\n\n[font=default-bold]Mécanique :[/font]\n• Chaque tir crée une poussée de durée fixe. Les tirs qui se chevauchent et plusieurs réseaux s'additionnent.\n• La masse de l'astéroïde dilue la poussée — les rochers lourds ont besoin de plus d'ordres simultanés.\n• Les réseaux se reciblent toutes les 30 ticks vers l'astéroïde éligible le plus proche.\n• La déviation seule ne produit aucun fragment — le rocher doit être miné par des MSEV ou détruit autrement pour donner des rebuts.\n• Si un mineur s'accroche à un astéroïde, tous les réseaux se redirigent automatiquement ailleurs (les rochers dotés en personnel sont protégés).\n\n[font=default-bold]Recherche :[/font] le Traitement Avancé d'Astéroïdes débloque les ordres prioritaires fabriqués à partir de cuivre, soufre et calcite. [technology=trajectory-compliance-speed-1] à [technology=trajectory-compliance-speed-9] augmentent la vitesse de tir.
administratorio-senior-trajectory-compliance-array=[font=default-bold]Les Réseaux Senior étendent la juridiction aux gros astéroïdes.[/font]\n\nDébloqué par [technology=trajectory-compliance-jurisdiction-2] (exige Systèmes de Conformité Orbitale + science Métallurgique + Agricole + Électromagnétique). Le Réseau Senior pousse les astéroïdes petits, moyens ET gros dans un rayon de 30 cases. Les gros astéroïdes ont un facteur de masse 2,5× supérieur aux moyens, donc des Réseaux Senior en chevauchement ou la recherche de vitesse de tir sont souvent nécessaires pour une déflexion efficace.\n\n[font=default-bold]Remarque stratégique :[/font] les gros astéroïdes transportent 18 fragments chacun. Les dévier protège votre plateforme mais ne rapporte aucune ressource — envisagez de laisser d'abord des MSEV les miner, puis nettoyez le reste avec les réseaux.
administratorio-executive-trajectory-compliance-array=[font=default-bold]Les Réseaux Exécutifs ont une juridiction sans appel sur toutes les tailles d'astéroïdes.[/font]\n\nDébloqué par [technology=trajectory-compliance-jurisdiction-3] (exige les Réseaux Senior + Processeur Quantique). Le Réseau Exécutif pousse les astéroïdes petits, moyens, gros ET énormes porteurs d'Administratorium dans un rayon de 40 cases. Les astéroïdes énormes ont un facteur de masse 5× et un rendement de 54 fragments — ils exigent généralement plusieurs Réseaux Exécutifs simultanés ou une vitesse de tir maximale pour une déflexion significative.\n\n[font=default-bold]Stratégie Administratorium :[/font] les énormes astéroïdes Administratorium sont la principale source de fragments d'Administratorium. Vous voulez généralement les MINER avec des MSEV, pas les dévier. Utilisez les Réseaux Exécutifs pour protéger la plateforme pendant que vos mineurs travaillent, ou pour nettoyer les énormes rochers non-Administratorium qui menacent le hub.
administratorio-orbital-employment-damage=[font=default-bold]La recherche de Dégâts d'Emploi Orbital augmente les dégâts de minage des MSEV.[/font]\n\nCinq niveaux, chacun +50 % de dégâts (additif) :\n• Niveau 1 : 187,5/s • Niveau 2 : 250/s • Niveau 3 : 312,5/s • Niveau 4 : 375/s • Niveau 5 : 437,5/s\n\n[font=default-bold]Prérequis :[/font] Niveaux 1-2 : Systèmes de Conformité Orbitale. Niveaux 3-4 : +Métallurgique/Agricole/Électromagnétique. Niveau 5 : +Cryogénique. Niveau 6 (si étendu) : +Administratorium.\n\n[font=default-bold]Cumul :[/font] les dégâts se multiplient par mineur attaché. À capacité 5 avec dégâts niveau 5 : 5 × 437,5 = 2187,5 dégâts/s — assez pour fissurer un énorme astéroïde Administratorium en environ 2,3 secondes. Priorisez d'abord la recherche de capacité (plus de mineurs = dégâts linéaires), puis la recherche de dégâts.
administratorio-orbital-employment-capacity=[font=default-bold]La recherche de Capacité d'Emploi Orbital augmente la limite de mineurs par astéroïde.[/font]\n\nQuatre niveaux, chacun +1 mineur par astéroïde :\n• Niveau 1 : 2 mineurs • Niveau 2 : 3 mineurs • Niveau 3 : 4 mineurs • Niveau 4 : 5 mineurs\n\n[font=default-bold]Prérequis :[/font] Niveau 1 : Systèmes de Conformité Orbitale. Niveau 2 : +Métallurgique/Agricole/Électromagnétique. Niveau 3 : +Cryogénique. Niveau 4 : +Administratorium.\n\n[font=default-bold]Économie :[/font] chaque mineur supplémentaire = un fragment d'employé de plus à collecter = un MSEV réutilisable de plus. La capacité est la recherche orbitale la plus impactante — elle augmente linéairement à la fois la vitesse de minage ET la récupération de munitions. Recherchez la capacité jusqu'à 3-4 avant un lourd investissement en dégâts.
administratorio-administrative-space-station=[font=default-bold]La Station Spatiale Administrative referme la boucle de paperasse de la plateforme.[/font]\n\nDébloquée par [technology=orbital-employment-infrastructure] avant la science utilitaire ou spatiale. C'est le bureau administratif complet homologué pour le vide ; le traitement natif des astéroïdes de Space Age reste la seule recette de science spatiale.\n\n[font=default-bold]Boucle de base des astéroïdes :[/font]\n• Carbone + eau → papier\n• Carbone + minerai de fer + eau → encre\n• Papier + encre → [item=orbital-operations-form]\n• La science spatiale native consomme une [item=research-grant-approval] importée par lot de cinq paquets\n• Les formulaires d'opérations autorisent le carburant et l'oxydant de propulseur, le tourisme, les ordres de déviation routiniers et l'[item=asteroid-processing-docket]\n\nLe concassage d'astéroïdes de base et la fonte de glace restent sans paperasse, pour qu'une plateforme isolée ne puisse pas être bloquée. Le concassage avancé consomme des dockets et donne du cuivre, du soufre et de la calcite pour le papier d'archive, l'encre sécurisée, la copie en masse et l'[item=priority-orbital-deviation-order].\n\n[font=default-bold]Personnel :[/font] un [item=astronaut] plus les managers briefés requis sont utilisés pendant la construction. La station rend les managers sous leur forme ordinaire ; les recettes récurrentes ne consomment aucun personnel.
administratorio-trajectory-compliance-speed=[font=default-bold]La recherche de Vitesse de Conformité Trajectorielle augmente la cadence de tir des réseaux.[/font]\n\nNeuf niveaux, chacun réduisant le temps de recharge :\n• Niveau 1 : 4,5 s → Niveau 2 : 4,0 s → Niveau 3 : 3,5 s → Niveau 4 : 3,0 s → Niveau 5 : 2,5 s\n• Niveau 6 : 2,0 s → Niveau 7 : 1,5 s → Niveau 8 : 1,0 s → Niveau 9 : 0,5 s\n\n[font=default-bold]Prérequis :[/font] Niveau 1 : Systèmes de Conformité Orbitale. Niveaux 5-7 : +Métallurgique/Agricole/Électromagnétique. Niveau 8 : +Cryogénique. Niveau 9 : +Administratorium.\n\n[font=default-bold]Impact :[/font] tir plus rapide = plus de poussées de déviation simultanées = déflexion nette plus forte sur les astéroïdes lourds. Le niveau 9 (recharge de 0,5 s) avec 3 Réseaux Exécutifs peut à lui seul dévier d'énormes rochers Administratorium. Science coûteuse — priorisez d'abord la capacité et la juridiction.
administratorio-cyan-yellow-bureaucracy=[font=default-bold]La Bureaucratie Cyan-Jaune fusionne la paperasse de Vulcanus et de Gleba.[/font]\n\nDébloquée par [technology=cyan-yellow-bureaucracy] (exige Certification Vulcanus + Conciliation Gleba + science Métallurgique + Agricole). Débloque :\n• [item=cyan-yellow-form] — formulaire bi-encre imprimé directement en cyan + jaune\n• [item=public-transportation-contract] — contrat de transit bicolore fusionnant cyan + jaune\n• [item=tourism-lure-spores] — leurre touristique pour spitters, pour le Bureau de Capture\n• Traitement des revenus du tourisme orbital\n\n[font=default-bold]Tourisme :[/font] emballez des spitters sur Gleba, monétisez le voyage en orbite, puis renvoyez les touristes payés à un bureau administratif de Nauvis. Les touristes ne sont jamais convertis en paperasse parce que, littéralement, un peu de sérieux.
administratorio-cyan-magenta-bureaucracy=[font=default-bold]La Bureaucratie Cyan-Magenta fusionne la paperasse de Vulcanus et de Fulgora.[/font]\n\nDébloquée par [technology=cyan-magenta-bureaucracy] (exige Certification Vulcanus + Services Numériques Fulgora + science Métallurgique + Électromagnétique). Débloque :\n• [item=cyan-magenta-form] — formulaire bi-encre pour Vulcanus + Fulgora\n• [item=hardened-data-vault] — pochette de garde scellée à chaud pour le transfert de données Vulcanus-Fulgora\n\n[font=default-bold]Cas d'usage :[/font] l'autorisation orbitale et pour la planète brisée exige souvent à la fois la métallurgie lourde (Vulcanus) et l'électromagnétique/archives (Fulgora). Le formulaire bicolore et la pochette blindée sont la paperasse convergente.
administratorio-yellow-magenta-bureaucracy=[font=default-bold]La Bureaucratie Jaune-Magenta fusionne la paperasse de Gleba et de Fulgora.[/font]\n\nDébloquée par [technology=yellow-magenta-bureaucracy] (exige Conciliation Gleba + Services Numériques Fulgora + science Agricole + Électromagnétique). Débloque :\n• [item=yellow-magenta-form] — formulaire bi-encre pour Gleba + Fulgora\n• [item=anecdotal-data-reprocessing] — recette raccourcie à forte teneur en récupération\n\n[font=default-bold]Cas d'usage :[/font] le travail d'archives biologiques et le croisement biologie/électromagnétique. Le formulaire jaune-magenta remplace les chaînes jaune et magenta séparées pour les recettes conjointes Gleba-Fulgora.
administratorio-fulgora-digital-services=[font=default-bold]Les Services Numériques de Fulgora débloquent la branche bureaucratique informatisée de la planète.[/font]\n\nDébloqués par [technology=fulgora-digital-services] (exige Impression Chromatique, déclenché en fabriquant 20 [item=charged-toner]). Débloque le [entity=digital-services-bureau], l'[item=archive-recovery-permit], le [item=digital-processing-certificate], l'[item=electromagnetic-operating-license] et le [item=data-recovery-order].\n\n[font=default-bold]Déclencheur de recherche :[/font] fabriquez 20 [item=charged-toner] (extrait des gisements de ferraille de Fulgora ou récupéré par recyclage). Cela vous force à vous engager dans la boucle de ferraille/recyclage de Fulgora avant de débloquer les services numériques.\n\n[font=default-bold]Bâtiments clés :[/font]\n• [entity=digital-services-bureau] — bureau informatisé 24h/24 (pas de fermeture nocturne)\n• [entity=archive-recombination-bureau] — recycleur de réaffectation un-formulaire → trois-formulaires\n• [entity=interplanetary-terminus] — point d'accès au tronc interplanétaire (partagé avec la technologie d'Aquilo)
administratorio-notary-office=[font=default-bold]Le Bureau du Notaire est l'office de certification haut de gamme de Vulcanus.[/font]\n\nDébloqué par [technology=vulcanus-certification]. Catégorie de fabrication : [entity=bureaucracy-certification]. Vitesse ×2, productivité de base 50 %, 4 emplacements de module. Entrées de fluide en encre cyan et sorties de mensonges pour les sous-produits de notarisation.\n\n[font=default-bold]Recettes :[/font]\n• [item=embossed-seal] — sceau de notarisation haut de gamme à partir de matériaux de Vulcanus\n• [item=industrial-charter] — dossier certifié d'opérations industrielles pour la métallurgie de Vulcanus\n• [item=good-excuse] — passerelle locale hors de l'impasse café-et-ragots\n• [item=management-approval-written] — exception d'acte territorial pour le jalon d'évasion\n• [item=inspection-docket] — revue industrielle dense pour la conformité de l'ère des fonderies\n\n[font=default-bold]Personnel :[/font] exige un [item=licensed-notary] (fabriqué au [entity=formation-center], consommé à la pose). Le Bureau du Notaire est la porte d'entrée de Vulcanus pour le travail de certification local — apportez des notaires pour chaque bâtiment spécialisé prévu.
administratorio-territorial-arbitration=[font=default-bold]Les Postes d'Arbitrage Territorial réduisent les territoires de démolisseurs par la paperasse.[/font]\n\nDébloqués par [technology=vulcanus-certification]. Recette fixe : [item=territorial-arbitration-processing]. Consomme des [item=territorial-resettlement-order] + [fluid=lie] par cycle de traitement (60 ticks).\n\n[font=default-bold]Mécanique :[/font]\n1. Placez le poste en chevauchement avec un territoire de démolisseur (doit couvrir au moins une case de territoire).\n2. Fournissez des ordres et des mensonges. Le poste retire progressivement des cases de territoire de la zone de patrouille du démolisseur, réduisant sa zone effective.\n3. La progression est suivie par territoire. Plusieurs postes sur le même territoire cumulent leur progression.\n4. Quand toutes les cases sont retirées, le démolisseur est éliminé et laisse tomber un [item=territorial-deed].\n5. Le territoire repousse naturellement (dégradation) s'il n'est pas activement entretenu — les postes doivent continuellement fournir des ordres/mensonges.\n\n[font=default-bold]Coûts selon la taille du démolisseur :[/font]\n• Petit : 1 ordre + 50 mensonges/s • Moyen : 2 ordres + 100 mensonges/s • Gros : 4 ordres + 200 mensonges/s\n\n[font=default-bold]Source de mensonges :[/font] la [entity=propaganda-distillery] sur Vulcanus (fluide politicien → mensonges). Prévoyez assez de débit de distillerie pour la taille visée.\n\n[font=default-bold]Remarque stratégique :[/font] c'est le seul moyen de nettoyer définitivement les territoires de démolisseurs de Vulcanus. L'acte permet le jalon d'évasion du silo à fusée.
administratorio-vulcanus-export-charters=[font=default-bold]Les Chartes d'Exportation de Vulcanus permettent d'exploiter la métallurgie de Vulcanus hors-monde.[/font]\n\nDébloquées par [technology=vulcanus-export-charters] (exige Certification Vulcanus + Science Métallurgique). Trois chartes :\n• [item=thermal-process-license] — certifie la métallurgie haute température de classe tungstène hors de Vulcanus\n• [item=calcite-reagent-waiver] — autorise la chimie industrielle à base de calcite hors-monde\n• [item=offworld-metallurgy-charter] — requise pour exploiter les procédés métallurgiques clés de Vulcanus loin de Vulcanus\n\n[font=default-bold]Variantes orbitales :[/font] [item=thermal-process-license-orbital], [item=calcite-reagent-waiver-orbital], [item=offworld-metallurgy-charter-orbital] produites à la [entity=administrative-space-station] pour usage en plateforme spatiale.\n\n[font=default-bold]Pourquoi c'est important :[/font] sans ces chartes, les recettes spécifiques à Vulcanus (tungstène, chimie de calcite, procédés de fonderie) ne peuvent pas fonctionner sur d'autres planètes ou plateformes. Les chartes sont la licence d'exportation bureaucratique pour la propriété industrielle de Vulcanus.
administratorio-conciliation-desk=[font=default-bold]Le Bureau de Conciliation est l'office spécialisé de Gleba pour la finalisation des formulaires jaunes.[/font]\n\nDébloqué par [technology=gleba-conciliation]. Catégorie de fabrication : [entity=bureaucracy-conciliation]. Vitesse ×1,75, productivité de base 50 %, 4 emplacements de module. Entrées de fluide en encre jaune et dérivés de sève ambrée.\n\n[font=default-bold]Recettes :[/font]\n• [item=blank-yellow-form] → [item=conciliation-order] — paperasse compacte d'exception biologique\n• [item=symbiosis-record] — registre biologique remplaçant le remplissage lourd en documentation\n• Approbations de secours locales remplaçant les chaînes de Nauvis riches en mensonges\n\n[font=default-bold]Personnel :[/font] exige un [item=conciliation-officer] (fabriqué au [entity=formation-center], consommé à la pose).\n\n[font=default-bold]Pourquoi il existe :[/font] la progression biologique intense de Gleba n'a pas besoin de toute l'échelle de permis de Nauvis. Le Bureau de Conciliation offre une branche compacte de formulaires jaunes qui contourne les approbations riches en mensonges/argent des contribuables par une conciliation biologique directe. C'est le chemin de résolution natif de Gleba.
administratorio-capture-bureau=[font=default-bold]Le Bureau de Capture a trois modes d'acquisition hostile propres à chaque surface.[/font]\n\nFabriquez le bâtiment sur Gleba, puis placez-le sur la surface exigée par la recette sélectionnée. Fournissez le fluide de leurre correspondant ; le leurre actif consomme 1 unité par seconde et attire la faune éligible dans un rayon de 48 cases. La sortie doit avoir de la place avant qu'un animal soit accepté.\n\n• [fluid=workforce-lure-spores] sur Nauvis — attire les biters et produit un [item=worker-biter]\n• [fluid=tourism-lure-spores] sur Nauvis — attire les spitters et produit des forfaits touristiques adaptés à la taille ; ce mode consomme aussi un [item=cyan-yellow-form]\n• [fluid=oviposition-lure-spores] sur Gleba — attire les pentapodes et produit des [item=pentapod-egg] frais selon l'espèce et la taille\n\nLe bureau capture directement ; les animaux ne déposent pas de plaintes et le mode main-d'œuvre ne consomme pas de [item=job-offer]. Gardez les fluides de leurre incompatibles hors du système de fluide partagé pour que le mode voulu reste actif.
administratorio-digital-services-bureau=[font=default-bold]Le Bureau des Services Numériques est l'office informatisé 24h/24 de Fulgora.[/font]\n\nDébloqué par [technology=fulgora-digital-services]. N'exécute que des recettes d'enregistrement et d'amorçage propres à Fulgora :\n• [item=digital-processing-certificate] — autorise le débit administratif informatisé\n• [item=electromagnetic-operating-license] — infrastructure électromagnétique et bureaucratie de l'holmium\n• [item=data-recovery-order] — ordre de travail à fort routage pour la reconstruction d'archives\n• [item=archive-recovery-permit] — récupération de paperasse par récupération de rebuts\n• Formulaires d'amorçage locaux pour la progression de Fulgora\n\n[font=default-bold]Mécanique :[/font] productivité de base ×3, 6 emplacements de module, AUCUNE fermeture nocturne (les services numériques tournent en continu). Entrée de fluide en [fluid=electromagnetic-lubricant] (ou équivalent). Doté d'un [item=relay-clerk] (fabriqué au [entity=formation-center], consommé à la pose).\n\n[font=default-bold]Pourquoi c'est important :[/font] contrairement aux bureaux de Nauvis, le Bureau des Services Numériques ne ferme pas la nuit. C'est votre moteur de paperasse toujours actif pour la récupération d'archives, les certificats numériques et les licences électromagnétiques de Fulgora.
administratorio-archive-recombination=[font=default-bold]Le Bureau de Recombinaison d'Archives recycle un formulaire en trois remplacements aléatoires de même rang.[/font]\n\nDébloqué par [technology=archive-recombination] (exige les Services Numériques Fulgora). Une variante de Recycleur en permanence dotée d'un [item=relay-clerk] (consommé à la construction).\n\n[font=default-bold]Fonctionnement :[/font]\n1. Insérez UN formulaire de paperasse compatible (tout formulaire recyclable, quel que soit son rang).\n2. La machine sélectionne automatiquement la recette de réaffectation de ce formulaire.\n3. TROIS formulaires de remplacement candidats (même rang, couleur respectée) tirent chacun indépendamment à 25 % de chance.\n4. Les résultats sortent dans l'inventaire de résultat à 12 emplacements. Vous pouvez obtenir 0, 1, 2 ou 3 formulaires.\n\n[font=default-bold]Contraintes :[/font]\n• Les candidats n'incluent JAMAIS le formulaire d'entrée lui-même.\n• Les candidats ne montent JAMAIS de rang de progression (T1 reste T1, T2 reste T2, etc.).\n• Les candidats n'inventent JAMAIS de couleur (un formulaire uniquement noir ne donne que des formulaires uniquement noirs ; un formulaire cyan donne du cyan ou du noir).\n• Ne fonctionne que sur les formulaires « recyclables » (la plupart des documents imprimés).\n\n[font=default-bold]Cas d'usage :[/font] rééquilibrer les surplus — donnez des permis T2 en excès, récupérez des permis T2 aléatoires. Ne pariez PAS sur des objets de progression critiques (le seul permis qui maintient l'usine en vie) — utilisez pour ceux-là des recettes de récupération déterministes.
administratorio-laser-printer=[font=default-bold]L'Imprimante Laser est l'imprimante à encre gelée d'Aquilo, utilisant un support solide.[/font]\n\nDébloquée par [technology=interplanetary-tube-chromatic]. Pas d'encre liquide — utilise :\n• [item=thermal-transfer-sheet] — substrat d'impression haut de gamme (remplace le papier)\n• [item=composite-chroma-ribbon] — support CMJ compressé (remplace les encres colorées liquides)\n\n[font=default-bold]Capacités :[/font]\n• Toutes les catégories d'impression historiques\n• Impression chromatique et multicolore, plus impression orbitale avancée\n• Vitesse de fabrication ×5, productivité de base 50 %, 6 emplacements de module\n• Aucune entrée de fluide — alimentée uniquement par objets\n• Fonctionne à la basse pression d'Aquilo et à bord des plateformes spatiales\n\n[font=default-bold]Pourquoi elle existe :[/font] l'encre liquide gèle sur Aquilo. L'Imprimante Laser utilise un support solide thermiquement stable qui fonctionne en conditions cryogéniques. Les rubans sont assemblés à partir de paperasse CMJ importée + de l'[item=transfer-emulsion] d'Aquilo.
administratorio-bureaucratic-transcendence=[font=default-bold]Transcendance Bureaucratique : la paperasse n'est plus un goulot d'étranglement pour le transit.[/font]\n\nDébloquée par [technology=bureaucratic-transcendence]. L'[entity=public-train-stop] est le déblocage phare — une gare qui fonctionne tout simplement, sans formulaire requis.\n\n[font=default-bold]Contexte :[/font] votre administration a atteint un débit et une fiabilité tels que le bureau central a accordé une exemption permanente pour les opérations ferroviaires courantes. La paperasse existe toujours pour tout le reste — ceci est spécifique au transit.\n\n[font=default-bold]Prérequis :[/font] [technology=interplanetary-tube-chromatic] (la chaîne complète du tronc interplanétaire). Vous devez avoir conquis la convergence des bureaucraties des quatre planètes de Space Age avant que le système ne vous fasse confiance pour des trains sans formulaire.
administratorio-public-train-stop=[font=default-bold]L'Arrêt de Train Public fonctionne sans paperasse d'autorisation de transit.[/font]\n\nDébloqué par [technology=bureaucratic-transcendence] (exige le palier chromatique du tube d'Aquilo). Une [entity=train-stop] vanilla qui n'exige PAS de formulaires [item=transit-authorization] pour fonctionner.\n\n[font=default-bold]Mécanique :[/font]\n• Aucun coffre à permis de transit n'est créé.\n• Aucun formulaire n'est consommé à l'arrivée d'un train.\n• La limite de trains n'est pas liée à la paperasse.\n• Fonctionne exactement comme une gare vanilla.\n\n[font=default-bold]Pourquoi elle existe :[/font] la Transcendance Bureaucratique représente le point où votre administration est devenue assez efficace pour que le transit courant ne nécessite plus d'autorisation à chaque arrivée. C'est un déblocage de confort pour les réseaux ferroviaires massifs — mais vous devez compléter toute la chaîne du tronc interplanétaire pour l'obtenir.

