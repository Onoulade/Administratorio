[recipe-description]
paper-production=Convert wood into paper. Le first step dans any bureaucratique supply chain.
ink-production=Grind coal into raw ink. Handcraftable. Le writing begins here.

blank-form-production=Print blank formulaires using paper et ink. Le universal administrative substrate.
blank-approval-production=Print blank approbation formulaires. A higher-quality template pour permits et autorisations.
blank-directive-production=Print blank directive formulaires. Premium triple-ink security template pour direction approbations.

carbon-offset-certificate-basic=Votre license à smelt. One certificate per furnace batch keeps le environmental regulators à bay.
carbon-offset-certificate-verified=A properly verified environmental permit. Requis before le bureaucratie will let vous construire a steel furnace.
provisional-approval-production=Le most basic formulaire de bureaucratique approbation. Votre first taste de redundant rubble, et le gateway à burner-era infrastructure.
work-order-production=Le universal assembleur permission slip. Sans ce, votre machines are expensive paperweights.
form-27b-6=Le formulaire que makes tous other formulaires possible. Vous haven't filed votre 27B-6.
safety-waiver-draft=Absolve le administration de tous liability using one basic excuse. Needs printer finalization à become legally binding.
safety-waiver-printing=Stamp le safety waiver into existence. Requis pour T1 construction et heavier operating permits.
transit-authorization-production=Documentation officielle de voyage pour train logistique. One formulaire consumed per arrival — no formulaire, no train.

environmental-impact-report=Une évaluation complète, bien que fortement caviardée, des dégâts environnementaux. Requis pour chemical et radiological operating permits.
management-verbal-draft=Corner a manager à le café machine et get them à agree à something. Needs printer finalization before anyone can deny it happened.
management-verbal-printing=Commit a spoken promesse à paper before le manager changes their mind. Produit le officiel verbal approbation.
management-written-proposal=Draft a written proposal à le Union Headquarters. Exige a good excuse, a narrative, et a treasury bond — managers don't sign pour free.
management-written-1st-printing=Finalize le written proposal dans one heavy printer pass. Produit a signed, notarized direction approbation que is impossible à deny.
research-grant-approval-production=Le minimum viable financement autorisation. Every science pack dans le mod starts avec one de ces.
construction-permit-draft=Begin le permit process à le bureau bureau. Le draft is not yet legally binding — it needs a printer's stamp.
construction-permit-printing=Finalize le construction permit avec ink et authority. Nothing gets built sans one de ces.

safety-work-order-production=Authorize votre assembleurs à do anything mildly dangerous — which, dans ce bureaucratie, is everything. Le entry-level assembleur permit.
construction-work-order-production=Mid-tier assembleur clearance. Votre machines have graduated depuis "probably safe" à "officially permitted."
management-verbal-work-order-production=A manager said it was fine. Que counts, right? Le T3 assembleur autorisation, backed by a spoken promesse.
management-written-work-order-production=Top-tier assembleur clearance avec a real signature. Le most expensive permission slip dans le factory.
research-grant-work-order-production=Science exige financement. Financement exige paperasse. Paperasse exige science packs. Le circle de bureaucratique life.
chemical-handling-work-order-production=Le operating permit pour chemical plants. Combines safety, environmental, et logistical paperasse into one very thick autorisation.
radiological-work-order-production=Le highest-tier operating permit. Authorizes centrifuges à handle nuclear material — assuming direction signed off dans writing.
safety-work-order-printing=Bypass le intermediate steps et print safety ordres de travail directly depuis drafts. Two per fabrication — le printer does le combining.
construction-work-order-printing=Print construction ordres de travail straight depuis drafts. Two per fabrication — faster than assembling them by hand.

dubious-data-batch=Refine nonsense à industrial scale. One certificate covers le whole batch — le regulators don't count individual data points.
dubious-data-refining=Extract something resembling information depuis raw nonsense. Unreliable, but technically qualifies as data.
basic-excuse-production=Five pieces de unreliable information, compressed into one plausible-sounding justification. Le backbone de landscape resolution.
crappy-report-production=Five data points de questionable origin, stapled together et called a report. La base de toute documentation de niveau supérieur.
politician-fluid-refining=Distill raw political essence into pure liquid deception. Le Propaganda Distillery does not judge — it just refines.
data-production=Actual usable information — a rare commodity. Emerges when vous cross-reference a crappy report avec someone's credentials.
good-excuse-production=Blend real data avec liquid lies until le result sounds plausible. Essential pour high-tier approbations et narrative construction.
misinformation-production=Weaponize falsehood à fluid scale. A key ingredient dans policy-making, justifications, et refined nonsense.
justification-production=A formal juridique rationale built depuis misinformation, credentials, et raw political essence. Used pour OSHA scrubbing et narrative construction.
credentials-production=Preuve d'autorité, quelle que soit la source douteuse. Le bureaucratie does not verify — it just checks pour le stamp.
narrative-production=Le officiel story, woven à le Union Headquarters. Contrôle la perception publique de votre administration.
white-paper-production=An authoritative policy document. Reads like scholarship, funds like corruption, et governs like neither.
policy-production=Le product de endless meetings, now dans directive formulaire. Feeds le regulation pipeline et higher-tier resolutions.
regulation-production=L'expression ultime de l'autorité gouvernementale. Exige an absurd amount de financement et data à draft.
promise-production=A vague but soothing document vous can throw à protesting biters. Non-binding, non-specific, non-permanent — but it buys time.
eviction-notice-production=Juridique authority à destroy biter structures, compressed into throwable formulaire. Le biters don't leave — they just lose their home.
hush-money-production=Contribuable argent stuffed into a throwable bag avec just enough paperasse à make bribery look officiel. Silences nids pour 3 minutes.
rideable-biter=Assign a biter travailleur à personal transport duty. Le resulting vehicle runs on contribuable argent, has only a tiny cargo inventory, cannot be removed after placement, et becomes a complaining biter if unfunded pour 10 minutes.
job-offer-production=Draft an employment contract. Place dans an admin bureau slot — a resolved biter picks it up instead de leaving. Vous get a travailleur; they get a career.
biter-logistics-formation=Retrain a general travailleur pour walking logistique duty. Le resulting formation staffs biterports et hauls items between chests.
union-delegate-training=A grueling certification process involving formal paperasse, juridique boilerplate, et truly excessive café consumption. Requis à construire le Union Headquarters.
chemical-operator-training=Certify a biter pour hazardous chemical handling. Le training is surprisingly rigorous pour a creature que used à spit acid pour free.
nuclear-technician-training=Train a biter dans radiological safety. Requis pour reactors et centrifuges — vous do not want unlicensed wildlife near enriched uranium.
filing-landscape=Officially acknowledge que vous ruined le scenery. Le first step toward pretending vous care.
filing-smog=Le paperasse pour smog plaintes is thicker than le smog itself. Takes longer à process than vous'd expect.
filing-noise=Documenting noise disturbances is, ironically, a very loud process. Exige significant processing time.
filing-unemployment=Filing proof que nobody has work. Le person filing ce has work. Le most complex biter filing.
filing-littering=Formally cataloging acid puddle locations pour le record. Le entry point pour spitter plainte resolution.
filing-hazmat=Le filing itself may require hazardous material handling procedures. Expect a longer processing time.
filing-loitering=Criminalizing standing dans le wrong place. Peak bureaucratie. Exige extensive restricted-area documentation.
filing-vagrancy=Documenting displacement avec le same system que caused it. Le most complex spitter filing.
case-smog=Elevate a smog filing into a court-ready dossier. Le evidence is right there dans le air, but vous still need it on paper.
case-noise=Upgrade a noise filing into a prosecutable dossier. Exige hard data et environmental certification — hearsay doesn't hold up dans biter court.
case-unemployment=Prove systemic economic failure avec enough paperasse à employ a small bureau. Exige gouvernement-backed financement à process.
case-hazmat=Compile physical evidence et a filing into a hazmat prosecution package. Le rubble samples are load-bearing.
case-loitering=Construire a juridique argument que standing still is a crime. Exige credentials, data, et just enough refined nonsense à make it stick.
case-vagrancy=Assemble a displacement prosecution backed by policy. Le heaviest spitter casework — vous need a directive just à open it.
brief-noise=A relic depuis a more litigious era. Conservé pour la compatibilité des sauvegardes — le courts have since streamlined.
brief-unemployment=Depuis le days when unemployment dossiers went à le supreme court. Conservé pour la compatibilité des sauvegardes.
brief-loitering=An artifact de le old loitering prosecution pipeline. Conservé pour la compatibilité des sauvegardes.
brief-vagrancy=A supreme court brief depuis when vagrancy requis le highest judicial authority. Conservé pour la compatibilité des sauvegardes.
landscape-final=Le simplest resolution. One excuse, one filing, one satisfied biter. If only they were tous ce easy.
smog-final=Officially declare le air quality acceptable. Exige misinformation et café — le truth would take too long.
noise-final=Slam le gavel on a noise dossier. A heavy ruling que consumes policy, credentials, narratives, et a truly unreasonable amount de café.
unemployment-final=Resolve unemployment through sheer volume de paperasse. Vous did not create jobs — vous created enough formulaires à pretend vous did.
littering-final=Reclassify acid puddles as a natural feature de le landscape. A light resolution — one report et a filing is tous it takes.
hazmat-final=Certify que hazardous materials have been properly mishandled. Exige misinformation et café — le standard bureaucratique solvents.
loitering-final=A landmark ruling que standing still is no longer a crime — dans ce specific dossier. Exige regulations, narratives, credentials, et café.
vagrancy-final=Le ultimate spitter resolution. Vous solved homelessness — ou à least generated enough paperasse à close le file.

iron-plate-batch=Permitted iron smelting. One certificate covers le whole batch — le regulators count runs, not ingots.
copper-plate-batch=Permitted copper smelting. One certificate per batch. Le environmental impact is carefully unexamined.
steel-plate-batch=Permitted steel processing. Le certificate burns faster than le iron. Worth it pour le throughput.
stone-brick-batch=Permitted masonry. Even bricks need a carbon offset dans ce economy.
greenhouse-wood=Renewable wood production. Le trees grow back, le paperasse doesn't.
greenhouse-discovery=Dig through wet compost hoping à find café beans. 10% chance per cycle. Vous always get some wood back, but never as much as vous put dans.
synthetic-paper-production=Oil-derived stationery pour high-throughput paperasse supply. Faster than growing trees, but le chemical bill adds up.
coffee-plantation=Plant beans, add water, harvest three times as many beans. Le most important supply chain dans le factory.
coffee-refining=Brew le lifeblood de bureaucratie. A ordre de travail ensures le café is officially sanctioned.
corporate-breakroom-production=Every bureau needs a place where productivity goes à die. Also produit gossip, which is somehow essential.
watercooler-gossip-production=Pour café over dubious data et see what rumors come out. Essential pour corporate decision-making.
osha-scrubbing=Make workplace violations disappear through le proper application de nonsense et union consent. Produit justifications.
osha-violation-recycling=Feed violations back into le union machine et see what paperasse falls out. Cheaper than scrubbing, but vous get what vous get.
office-drama-recycling=Add café à interpersonal conflict et shake. Randomly produit ordres de travail, gossip, ou excuses — le three pillars de bureau culture.
resolution-office-production=Where plaintes go à be resolved — ou à least reclassified. Le workhorse de votre resolution pipeline.
copy-blank-form=Mass-producing emptiness à industrial scale. Efficiency à its finest. Small chance de waste paper.
copy-blank-approval=One approbation template goes dans, six come out. Le original is indistinguishable depuis le copies — which is actually le point.
copy-blank-directive=Bulk-print high-security directive templates. Le triple ink application is faithfully reproduced, if not le original intent.
copy-carbon-offset-certificate=Copying environmental compliance documents on an industrial printer. Le irony is not lost on anyone.
copy-form-27b-6=Le formulaire que breeds. One goes dans, six come out. Kafka would be proud.
copy-environmental-impact-report=Copy le impact report before anyone reads it too closely. Six identical assessments de le same damage.
copy-work-order=Keep votre assembleurs fed avec a steady stream de autorisation paperasse. One original, six permissions.
copy-safety-work-order=Industrial-scale safety compliance. Print enough waivers à cover every machine on le floor.
copy-construction-work-order=Duplicate construction permits so votre expansion never stalls waiting on a single signature.
copy-management-verbal-work-order=Reproduce a manager's spoken promesse six times over. Chaque copy is equally non-binding.
copy-management-written-work-order=Six copies de a signed direction directive. Chaque one is notarized, binding, et impossible à deny.
copy-research-grant-work-order=Multiply recherche financement autorisations so le labs never go dark. Le grant committee doesn't need à know.
copy-chemical-handling-work-order=Duplicate hazardous operating permits. Safety is a numbers game, et six is safer than one.
copy-radiological-work-order=Copy nuclear autorisation paperasse à industrial vitesse. Chaque copy glows avec le same juridique authority as le original.
office-desk-production=Le nerve center de votre paper empire. If it is not on ce bureau, it does not exist.
admin-station-production=Le front bureau de civilized governance. Biters queue here, file plaintes here, et — avec enough paperasse — leave satisfied here.
union-headquarters-production=A sprawling monument à organized labor. Le first one bootstraps depuis bonds et verbal promesses, then becomes le beating heart de late-game policy.
propaganda-distillery-production=Manufacturing consent, one barrel à a time. Converts politician fluid into lies, misinformation, et other essential governance byproducts.
greenhouse-production=A climate-controlled facility pour le two pillars de bureaucratie: wood pour paper, et café pour le people pushing it.
printer-t1-production=Votre first electric printer. Slow, reliable, et permanently jammed dans spirit if not dans practice.
printer-t2-production=Upgrades votre printing infrastructure avec copy capability. One document dans, six out. Exige biter travailleur autorisation per fabrication.
mechanical-printer-production=A hand-cranked workhorse pour le pre-electric era. Slow, but it gets le formulaires moving.
pneumatic-pipe-production=Sealed tubes pour shooting paperasse across votre factory à high vitesse. Regular pipes are pour liquids, not legalese.
pneumatic-pipe-to-ground-production=Route pneumatic pipes under bâtiments et belts. 16-tile underground range.
tube-intake-production=Le on-ramp à votre pneumatic network. Feed paperasse dans, et it appears instantly à any connected outtake.
tube-outtake-production=Le off-ramp depuis votre pneumatic network. Set a filter à request le specific formulaire type vous need.
speed-module=Draft a juridique threat compelling faster machine output. Le excuse had better be good enough à justify le energy bill.
speed-module-2=Escalate le subpoena. Four copies de le original threat, upgraded avec better excuses et more persuasive circuitry.
speed-module-3=A federal subpoena backed by narratives, credentials, et le full weight de le judiciary. Peak juridique acceleration.
productivity-module=Launch an internal investigation que wrings extra output depuis every cycle. Auditors are thorough but slow.
productivity-module-2=Expand le audit scope. Four preliminary findings, hardened avec real data, yield deeper scrutiny.
productivity-module-3=A full federal investigation. Four prior audits, justifications, et credentials merge into le most productive — et most intrusive — oversight possible.
efficiency-module=Cook le energy books. A crappy report et some wiring make le power meter lie just enough.
efficiency-module-2=Bolder accounting fraud. Four prior schemes et some white papers produire significantly more creative bookkeeping.
efficiency-module-3=A full Ponzi scheme de energy accounting. Four prior embezzlement modules, policy cover, et credentials — le auditors will never notice.
union-approval-production=Secure workforce consent through le ancient ritual de café, data, et public financement. Nothing moves sans le union's blessing.
treasury-bond-production=Package public funds into a tradeable financial instrument. Le documentation is useless, but legally requis.
government-grant-production=Convert treasury bonds into a major financement allocation. Exige a manager's verbal promesse et a report nobody will read.
tax-audit=Reclassify laundered argent back into legitimate revenue. Le paperasse goes dans dirty et comes out clean — et somehow multiplied.
slush-fund-production=Convert legitimate gouvernement bonds into untraceable liquid assets. Completely above board. Do not ask questions.
useless-documentation-production=Officially document uselessness. Le result is somehow a requis input pour financial instruments et standardized filing.
compacted-rubble-production=Compress bureaucratique waste into a standardized bâtiment material. Le certificate proves le compression was environmentally responsible.
charcoal-production=A renewable source de coal, assuming vous have greenhouses producing le wood. Le certificate covers le emissions.
refined-nonsense-production=Le backbone de high-tier bureaucratie. Created when physical waste meets liquid falsehood et neither backs down.
overtime-exemption=Authorize a single bâtiment à operate after dark. Le module slot doesn't care about votre work-life balance — just votre café supply.

