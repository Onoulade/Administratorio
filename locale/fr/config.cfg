[achievement-description]
welcome-to-the-department=Construire votre first Biter administration Bureau. Votre cubicle awaits.
discovery-of-bullshit=Recherche Discovery de Bullshit. It was right under votre feet ce whole time.
ink-stained=Recherche Printing Technology. Le printer is jammed. Again.
form-27b-6-achievement=Produire 100 Formulaire 27B/6 per hour. Vous haven't filed votre 27B/6.
paper-pusher=Produire 1000 Blank Formulaires per hour. Le trees didn't die pour nothing.
safety-first=Recherche Wood Production. OSHA would be proud. If OSHA existed here.
capsule-promise=Use a Promesse Capsule. A promesse is a comfort à a fool.
its-a-copy-of-a-copy=Recherche Local Precedents. Somehow le copy is more officiel than le original.
permit-denied=Construire 10 train stops. No train moves sans paperasse.
coffee-break=Construire a Corporate Breakroom. Finally, le most important bâtiment.
pneumatic-delivery=Recherche Pneumatic Formulaire Transport. Woooosh! Formulaires through pipes. What a time à be alive.
propaganda-machine=Construire a Propaganda Distillery. Manufacturing consent, one barrel à a time.
endless-meetings=Recherche Board Meetings. Ce still could have been an email.
union-strong=Construire a Union Headquarters. Le travailleurs have organized. Direction is concerned.
environmental-compliance-achievement=Recherche Environmental Compliance. Le oil et chemical economy can now proceed under proper paperasse.
constitutional-scholar=Recherche Constitutional Law. Vous have read every regulation. Tous de them.
know-it-all=Recherche tous technologies. Congratulations, vous're overqualified.
eviction-notice-achievement=Utilisez 100 avis d'expulsion. Rien de personnel, c'est seulement la politique.
mass-transit=Have a train travel more than 2000 tiles. Chaque stop exige its own transit autorisation.
first-complaint=Register votre first biter à an admin station. They have concerns.
case-closed=Resolve votre first biter plainte. One down, infinity à go.
protest-suppressed=Pacify a protesting biter avec a promesse. Le biter has been calmed avec vague assurances.
department-of-everything=Have 10 admin stations powered simultaneously. Le bureaucratie expands à meet le needs de le expanding bureaucratie.
full-resolution=Resolve à least one plainte de chaque de le 8 types. A plainte pour every occasion.
behemoth-paperwork=Register a behemoth biter à an admin station. Que's... a lot de formulaires.
