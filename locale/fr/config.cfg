[technology-description]
involuntary-relocation=Débloque le [entity=involuntary-relocation-cannon] et ses ordres de transfert. Déplace le personnel de la famille des biters entre les planètes, par lots : des coursiers d'une tonne à l'aller, des managers usés au retour, afin que la fenêtre de 30 minutes reste praticable.
egg-courier-formation=Les œufs de biters ne quittent jamais Nauvis : les œufs avariés éclosent en biters hostiles et, hors de Nauvis, aucun Bureau d'administration ne peut les traiter. Forme sur Nauvis des Managers missionnaires, des Sujets de recherche volontaires et des Managers d'évaluation géotechnique qui portent l'autorisation à leur place.
synthetic-personnel=Débloque le [entity=synthetic-personnel-bureau] et la synthèse des professions exigées par les bâtiments planétaires. Fini l'aller-retour vers Nauvis ; l'électricité est la contrainte.
unstaffed-operations=Débloque la [item=unstaffed-operations-waiver], un module qui permet à un bâtiment géré par une station de biters de fonctionner sans travailleur biter dépêché. Il ne convient à rien d'autre.
aquilo-ai-inference=Débloque le [entity=ai-server], la [entity=slop-refinery], l'[entity=heat-exhaust] et la [entity=optical-fibre]. Le serveur produit l'inférence avec de l'électricité seule ; la raffinerie la transforme en paperasse. L'inférence est un fluide que seule la fibre optique peut transporter. Les serveurs consomment énormément d'électricité et émettent de la vraie chaleur dans le réseau thermique vanilla ; un serveur insuffisamment refroidi s'arrête. Fabrique des documents incolores de rang 0-1.
administratorium-slop-synthesis=Étend la synthèse de bouillie aux documents de rang 2-3 sans couleur, à un coût énorme en jetons et un déluge de citations fabriquées. Les documents colorés ne sont jamais produits par la bouillie.
interplanetary-tube-network=Ouvre un tronc pneumatique lent et étroit entre les planètes. Débloque le [entity=interplanetary-terminus], un par planète, transportant les formulaires noirs ordinaires : 3 objets en vol, 30 secondes chacun.
interplanetary-tube-capacity-2=Élargit le tronc interplanétaire à 5 objets en vol et réduit le transit à 15 secondes par objet.
interplanetary-tube-capacity-3=Élargit le tronc interplanétaire à 10 objets en vol et réduit le transit à 5 secondes par objet.
interplanetary-tube-capacity-4=Élargit le tronc interplanétaire à 15 objets en vol et réduit le transit à 2 secondes par objet.
interplanetary-tube-capacity-5=Élargit le tronc interplanétaire à 20 objets en vol et réduit le transit à 1 seconde par objet.
interplanetary-tube-additional-terminus-1=Autorise un deuxième Terminus interplanétaire sur une même planète.
interplanetary-tube-additional-terminus-2=Autorise un troisième Terminus interplanétaire sur une même planète.
interplanetary-tube-additional-terminus-3=Autorise un Terminus interplanétaire de plus sur une même planète. Recherchez-la à nouveau pour un de plus, sans limite.
interplanetary-tube-chromatic=Étend le tronc interplanétaire aux formulaires cyan, jaune, magenta et composites. Délivre aussi le ruban composite, les permis trichromatiques et les chartes d'expédition finales.
promethium-science-pack=Autorise l'expédition vers l'Administratorium après l'achèvement du réseau de tubes chromatiques d'Aquilo. Débloque la route vers la planète pulvérisée et le pack scientifique final ; l'expédition consomme de la science administrative et ses packs exigent une [item=promethium-research-charter] charte d'expédition signée.
discovery-bullshit=Vous l'avez trouvée. Il ne reste plus qu'à la raffiner en argument valide. Débloque le raffinage des données douteuses, la production d'excuses de base, les premières paperasses de décharge de sécurité et de permis de construire, ainsi que les résolutions de paysage de base.
discovery-redundant-rubble=Toucher à la géologie locale vous a immédiatement enseveli sous un glissement de terrain d'exigences redondantes. Débloque les premiers dépôts de paysage et la foreuse minière thermique.
field-office-deployment=Votre premier bureau de terrain établit juste assez d'autorité locale pour émettre des approbations provisoires, des promesses et le premier bureau administratif.
administrative-science-research=Formalise la chaîne de résolution des plaintes en science reproductible. Débloque les packs de science administrative rose.
printing-technology=Production mécanisée de documents. Débloque l'imprimante basique une fois les deux découvertes de démarrage en place.
administrative-bureaucracy=Cultivez du bois renouvelable en serre contrôlée. Débloque la serre et la production de bois.
admin-station-capacity=Augmente d'un emplacement supplémentaire la zone d'attente de chaque bureau administratif.
rubble-compaction=Compresse les gravats redondants en matériau de construction standardisé pour les infrastructures ultérieures. Débloque la production de gravats compactés.
littering-resolution=Formalise les procédures de traitement des plaintes pour dépôts sauvages. Débloque les rapports minables, les dépôts de déchets et la résolution des déchets.
industrial-printing=Augmente le débit de paperasse au-delà d'une seule imprimante électrique avec une infrastructure de l'ère chimique. Débloque l'imprimante industrielle ainsi que les recettes de copie en masse pour formulaires vierges, approbations vierges, certificats carbone, formulaire 27B-6, rapports d'impact environnemental et directives vierges.
chromatic-printing=Introduit l'imprimante chromatique commune et l'encre noire. Chaque chaîne de couleur reste liée à la technologie d'amorçage de sa planète.
cyan-ink-production=Extrayez la croûte de vert-de-gris sur Vulcanus pour produire l'encre cyan et les formulaires cyan nécessaires avant la science métallurgique.
vulcanus-certification=Établit le bureau de certification de Vulcanus, forme les notaires agréés et ouvre les chartes industrielles locales après la science métallurgique.
vulcanus-export-charters=Étend la certification de Vulcanus aux licences orbitales et aux chartes métallurgiques d'exportation.
amber-sap-processing=Pompez une source de sève ambrée pour ouvrir les recettes administratives locales d'amorçage de Gleba.
gleba-conciliation=Ouvre avant la science agricole le Bureau de capture, la formation des agents de conciliation, la récolte des œufs, les spores d'appât et la chaîne de formulaires jaunes.
fulgora-salvage-administration=Récupère du toner chargé dans les débris et ouvre la chaîne magenta nécessaire avant la science électromagnétique.
fulgora-digital-services=Établit les services numériques, leur bureau spécialisé et les permis électromagnétiques après la science électromagnétique.
archive-recombination=Normalise la bureaucratie de récupération de Fulgora. Débloque le Bureau de réaffectation des archives, une variante de Recycleur à une entrée en permanence gérée par un Commis relais, avec trois candidats de remplacement tirés indépendamment à 25 % de chances chacun pour chaque formulaire pris en charge.
cyan-yellow-bureaucracy=Fusionne les formalités cyan de Vulcanus et jaunes de Gleba pour les usages communs aux deux planètes.
cyan-magenta-bureaucracy=Fusionne les formalités cyan de Vulcanus et magenta de Fulgora pour les usages communs aux deux planètes.
yellow-magenta-bureaucracy=Fusionne les formalités jaunes de Gleba et magenta de Fulgora pour les usages communs aux deux planètes.
aquilo-cryogenic-administration=Ouvre avant la science cryogénique les techniciens, l'imprimante laser, les supports secs et la licence nécessaire à la première usine cryogénique.
bureaucratic-transcendence=Ouvre l'arrêt ferroviaire public exempté d'autorisation de transit après l'achèvement du réseau interplanétaire.
worker-formation=Ouvre les offres d'emploi et la formation des travailleurs généraux sur Nauvis.
management-formation=Forme les managers sur Nauvis et autorise cinq briefings temporaires peu coûteux, sans argent public, utilisables sur toutes les planètes.
specialized-formation=Forme les astronautes destinés aux plateformes administratives sans exiger de science utilitaire, spatiale ou planétaire.
orbital-employment-infrastructure=Ouvre la station administrative spatiale et sa boucle documentaire avant les sciences utilitaire et spatiale. L'unique recette native de science spatiale de Space Age y consomme des approbations de recherche importées d'une planète.
orbital-compliance-systems=Autorise les réseaux de conformité, les ordres de déviation, la catapulte minière et les mineurs volontaires avant la propulsion de la plateforme.
trajectory-compliance-jurisdiction-2=Installe des représentants des trois premières planètes au comité de révision orbital. Les réseaux supérieurs peuvent rediriger les gros astéroïdes à 30 tuiles de distance.
trajectory-compliance-jurisdiction-3=Accorde une autorité exécutive appuyée par la quantique avant le début de l'expédition vers l'Administratorium. Les réseaux exécutifs peuvent rediriger les astéroïdes énormes à 40 tuiles de distance.
trajectory-compliance-speed-1=Réduit le cycle du réseau à 4,5 secondes.
trajectory-compliance-speed-2=Réduit le cycle du réseau à 4 secondes.
trajectory-compliance-speed-3=Réduit le cycle du réseau à 3,5 secondes.
trajectory-compliance-speed-4=Réduit le cycle du réseau à 3 secondes.
trajectory-compliance-speed-5=Réduit le cycle du réseau à 2,5 secondes grâce aux trois premières planètes.
trajectory-compliance-speed-6=Réduit le cycle du réseau à 2 secondes.
trajectory-compliance-speed-7=Réduit le cycle du réseau à 1,5 seconde.
trajectory-compliance-speed-8=Réduit le cycle du réseau à 1 seconde grâce à la science cryogénique.
trajectory-compliance-speed-9=Réduit le cycle du réseau à 0,5 seconde grâce à la science de l'Administratorium.
orbital-employment-damage-1=Augmente à 187,5 par seconde le travail minier de chaque mineur volontaire.
orbital-employment-damage-2=Augmente à 250 par seconde le travail minier de chaque mineur volontaire.
orbital-employment-damage-3=Augmente à 312,5 par seconde le travail minier de chaque mineur volontaire.
orbital-employment-damage-4=Augmente à 375 par seconde le travail minier de chaque mineur volontaire.
orbital-employment-damage-5=Augmente à 437,5 par seconde le travail minier de chaque mineur volontaire.
orbital-employment-capacity-1=Autorise deux mineurs volontaires simultanés par astéroïde.
orbital-employment-capacity-2=Autorise trois mineurs volontaires simultanés par astéroïde.
orbital-employment-capacity-3=Autorise quatre mineurs volontaires simultanés par astéroïde.
orbital-employment-capacity-4=Autorise cinq mineurs volontaires simultanés par astéroïde.
local-precedents=Standardise le jargon juridique derrière la paperasse ferroviaire et de conformité. Débloque la documentation inutile et le formulaire 27B-6.
nest-pacification=Formalise la corruption de la faune hostile en procédure administrative réutilisable. Débloque le pot-de-vin pour réduire temporairement au silence la génération des nids de biters pendant 3 minutes.
streamlined-work-orders=Imprime les ordres de travail directement depuis les brouillons, en contournant les étapes d'approbation intermédiaires. Débloque l'impression directe brouillon-vers-ordre de travail sur imprimantes électriques, produisant 2 ordres par fabrication.
office-agriculture=Industrialise l'approvisionnement en café de bureau au-delà de la récupération. Débloque les plantations de café.
charcoal-production=Formalise la production réglementée de charbon renouvelable à partir du bois de serre. Débloque la production de charbon de bois.
industrial-propaganda=Transforme la désinformation en arme à l'échelle industrielle. Débloque la distillerie de propagande, le raffinage de fluide politicien, la désinformation, l'absurde raffiné et les accréditations officielles.
corporate-hospitality=Transforme le café et les rumeurs de bureau en moral utilisable. Débloque la découverte du café, la salle de pause d'entreprise, le raffinage du café, les rumeurs de fontaine à eau et le recyclage des drames de bureau.
information-management=Transforme les rumeurs et les accréditations en pistes administratives exploitables. Débloque la synthèse de données et les bonnes excuses.
verbal-approvals=Formalise la promesse orale du manager en paperasse réutilisable. Débloque les directives vierges, la copie de directives et les approbations verbales de la direction.
environmental-compliance=Autorise l'économie pétrolière grâce à un théâtre environnemental correctement documenté. Débloque les rapports d'impact environnemental, les ordres de travail chimiques et les certificats carbone vérifiés.
smog-abatement=La qualité de l'air allait très bien jusqu'à ce que quelqu'un commence à la mesurer. Débloque les dépôts de smog, les dossiers et la résolution finale.
hazmat-response=Ce que vous ignorez ne peut pas vous blesser, sauf si c'est de la boue radioactive. Débloque les dépôts hazmat, les dossiers et la résolution finale.
nest-expropriation=Revendiquer un territoire par la force soutenue par la paperasse. Débloque les avis d'expulsion pour nettoyer les nids de biters.
synthetic-stationery=Formalise la production de papeterie dérivée du pétrole. Débloque le papier synthétique à base de plastique, soufre et eau pour alimenter une paperasse à haut débit.
public-finance=Fait entrer le Trésor et les syndicats dans la bureaucratie. Débloque les obligations du Trésor, le quartier général syndical, les approbations syndicales et les subventions gouvernementales.
health-and-safety=Transforme le levier syndical en théâtre réglementaire. Débloque le nettoyage OSHA, les justifications et la production de récits.
board-meetings=Agrandit le quartier général syndical en étage de comité exécutif. Débloque les propositions et approbations écrites de la direction sans ajouter de bâtiment dédié.
executive-review=Fait monter la bureaucratie jusqu'aux directives signées. Débloque les ordres de travail écrits de la direction pour les projets les plus lourdement réglementés.
radiological-compliance=Fait passer la paperasse de processus en territoire nucléaire. Débloque les ordres de travail radiologiques pour centrifugeuses et traitement de l'uranium.
eminent-domain-zoning=Rédige l'échafaudage politique des expansions à grande échelle. Débloque les livres blancs, les directives politiques et les caisses noires.
work-order-duplication=Standardise la copie industrielle des autorisations terminées. Débloque la duplication en masse de toutes les familles d'ordres de travail à l'imprimante industrielle, des formulaires d'assembleur de base à la paperasse d'exploitation radiologique.
federal-regulation=Transforme la politique en texte fédéral exécutoire. Débloque la rédaction de réglementations.
noise-ordinances=Le silence est d'or. Documenter les nuisances sonores coûte extrêmement cher. Débloque les dépôts de bruit, les dossiers et la résolution finale.
loitering-ordinances=Rester planté là sans rien faire est désormais passible de poursuites. Les biters ne sont pas amusés. Débloque les dépôts de flânerie, les dossiers et la résolution finale.
creative-accounting=Standardise la requalification des caisses noires en revenus officiels. Débloque l'audit fiscal.
constitutional-law=Le dernier palier de plainte biter. Débloque le dépôt de chômage, les dossiers et la résolution finale au stade de la science de production.
vagrancy-ordinances=Le dernier palier de plainte spitter. Débloque le dépôt de vagabondage, les dossiers et la résolution finale au stade de la science utilitaire.
filing-cabinet-logistics-1=Vos poches ont maintenant des sections de classement désignées. Plus d'emplacements de demande et plus de capacité de poubelle pour l'administrateur exigeant.
filing-cabinet-logistics-2=Les managers intermédiaires reçoivent des classeurs plus grands. Augmente encore la capacité logistique personnelle.
filing-cabinet-logistics-3=Tout est classé, recoupé et codé par couleur. Vous êtes devenu la bureaucratie. Capacité logistique personnelle maximale.
after-hours-operations=Standardise les quarts de nuit légaux pour l'appareil administratif. Débloque le module [item=overtime-exemption] Exemption d'heures supplémentaires afin que les bâtiments de bureau clés puissent rester ouverts la nuit.
pneumatic-form-transport=Fait circuler la paperasse dans des tubes pneumatiques scellés. Débloque les entrées de tube, les sorties de tube et les tubes pneumatiques. Les entrées n'acceptent que les documents valides, et les tubes pneumatiques ne se connectent pas aux infrastructures de fluides ordinaires.
pneumatic-capacity=Augmente le nombre de documents que chaque réseau de tubes pneumatiques peut contenir en transit.
pneumatic-capacity-1=Renforce les jonctions de tubes pour gérer plus de formulaires simultanés. Augmente la capacité du réseau de tubes de 15.
pneumatic-capacity-2=Installe des régulateurs de pression pour une livraison pneumatique à plus haut débit. Augmente la capacité du réseau de tubes de 25.
pneumatic-capacity-3=Infrastructure pneumatique industrielle à plein débit. Augmente la capacité du réseau de tubes de 50.
pneumatic-capacity-4=Confinement de pression documentaire de niveau exécutif. Augmente la capacité du réseau de tubes de 100.
biter-employment=Établit un programme d'emploi formel pour biters résolus. Débloque les offres d'emploi, le bureau administratif complet et le bureau de résolution. N'exige que de la paperasse rouge et de la science administrative.
biter-employment-office=Ouvre l'agence formelle pour l'emploi des biters afin d'envoyer des travailleurs vers les bâtiments industriels. Débloque le bâtiment Agence pour l'emploi des biters.
rideable-biter=Autorise le transport personnel par affectations supervisées de biters. Débloque le biter montable.
automobilism=Restaure la motorisation conventionnelle approuvée par l'État. Débloque la voiture vanilla au stade de la science utilitaire.
biter-labor-efficiency=Augmente le nombre de machines gérées qu'un travailleur biter envoyé peut autoriser par trajet.
biter-labor-efficiency-1=Des protocoles d'itinéraire améliorés permettent à chaque travailleur biter envoyé de visiter jusqu'à 3 machines gérées par trajet au lieu de 1. Chaque machine visitée est activée pour un cycle de fabrication avant de demander une autre visite.
biter-labor-efficiency-2=Des protocoles d'efficacité avancés augmentent encore la capacité d'envoi à 5 visites de machines gérées par trajet de travailleur.
biterport-logistics=Débloque l'infrastructure de biterports, forme des travailleurs logistiques biters et débloque des coffres de paperasse bon marché à un seul emplacement pour les réseaux opérés par biters.
biterport-transport-capacity=Augmente le nombre d'objets que chaque biter logistique peut transporter par trajet de biterport.
biterport-transport-capacity-1=Formalise les premiers manifestes logistiques. Chaque biter logistique peut transporter 2 objets par trajet.
biterport-transport-capacity-2=Améliore les sacoches de biters et les pinces à paperasse. Chaque biter logistique peut transporter 5 objets par trajet.
biterport-transport-capacity-3=Standardise la manutention en vrac pour la logistique intermédiaire. Chaque biter logistique peut transporter 10 objets par trajet.
biterport-transport-capacity-4=Délivre des harnais de transport renforcés pour les charges plus importantes. Chaque biter logistique peut transporter 25 objets par trajet.
biterport-worker-speed=Augmente la vitesse de marche des travailleurs logistiques envoyés depuis les biterports.
biterport-worker-speed-1=De meilleures chaussures. Les travailleurs logistiques se déplacent 35 % plus vite entre les tâches.
biterport-worker-speed-2=Des chaussures encore meilleures. Les travailleurs logistiques se déplacent 70 % plus vite. Ils courent presque.
formation-center=Construit le centre de formation dédié. Obligatoire avant de former n'importe quelle profession de biter. Débloque le bâtiment Centre de formation.
union-delegate-training=Certifie des travailleurs biters comme délégués syndicaux. Débloque la formation de délégué syndical au centre de formation.
chemical-operator-training=Certifie des travailleurs biters pour construire des usines chimiques et manipuler des matières dangereuses. Débloque la formation d'opérateur chimique au centre de formation.
nuclear-technician-training=Certifie des travailleurs biters comme techniciens nucléaires licenciés pour l'exploitation des réacteurs. Débloque la formation de technicien nucléaire au centre de formation.
hired-biter-fieldwork=Autorise un programme pilote d'agents d'expulsion autonomes. Forme un unique biter béhémoth doté de toute l'autorité légale nécessaire pour localiser et remettre indépendamment des avis d'expulsion aux nids ennemis. Extrêmement coûteux. Extrêmement efficace.

government-liaison=Formalisez la signature des permis par l'administration biter. Débloque le Guichet des pétitions et toutes les recettes de tamponnage d'approbation de permis.
workforce-formation=Établissez une bureaucratie de main-d'oeuvre dédiée post-spatiale. La formation de profession reste sur Nauvis, tandis que cinq briefings de manager bon marché et sans numéraire peuvent se dérouler sur n'importe quelle planète.
eminent-domain-zoning-space-age=Rédige l'échafaudage politique des expansions à grande échelle. Débloque les livres blancs et les directives politiques. En Space Age, le tourisme spatial, plutôt que le blanchiment de caisses noires, fournit un financement public renouvelable.

