[technology-description]
discovery-bullshit=Vous found it. Now vous just need à refine it into a valid argument. Débloque dubious data refining, basic excuse production, le first safety-waiver et construction-permit paperasse, et basic landscape resolutions.
discovery-redundant-rubble=Touching le local geology has immediately buried vous dans a landslide de redundant requirements. Débloque le first landscape filings et le burner mining drill.
field-office-deployment=Votre first terrain bureau establishes just enough local authority à issue provisional approbations, promesses, et le first admin station.
administrative-science-research=Formalizing le plainte resolution pipeline into a reproducible science. Débloque gray administrative science packs.
printing-technology=Mechanized document production. Débloque le Basic Printer once both bootstrap discoveries are dans place.
administrative-bureaucracy=Grow renewable wood under controlled greenhouse conditions. Débloque le Greenhouse et wood production.
admin-station-capacity=Expand chaque Admin Station waiting zone by one additional slot.
rubble-compaction=Compress redundant rubble into a standardized bâtiment material pour later infrastructure. Débloque compacted rubble production.
littering-resolution=Formalize procedures pour handling illegal dumping plaintes. Débloque crappy reports, littering filing, et littering resolution.
industrial-printing=Scale paperasse throughput beyond a single electric printer avec chemical-era infrastructure. Débloque le Industrial Printer plus bulk copy recettes pour blank formulaires, blank approbations, carbon certificates, Formulaire 27B-6, environmental impact reports, et blank directives.
local-precedents=Standardize le juridique boilerplate behind rail et compliance paperasse. Débloque useless documentation et Formulaire 27B-6.
nest-pacification=Formalize le bribery de hostile wildlife into a reusable administrative procedure. Débloque hush argent pour temporarily silencing biter nid apparition pour 3 minutes.
streamlined-work-orders=Print ordres de travail directly depuis drafts, bypassing intermediate approbation steps. Débloque direct draft-à-work-order printing à electric printers, producing 2 ordres de travail per fabrication.
office-agriculture=Industrialize le bureau café supply beyond scavenging. Débloque café plantations.
charcoal-production=Formalize regulated renewable coal production depuis greenhouse wood. Débloque charcoal production.
industrial-propaganda=Weaponize misinformation à industrial scale. Débloque le Propaganda Distillery, politician fluid refining, misinformation, refined nonsense, et officiel credentials.
corporate-hospitality=Turn café et bureau rumor into usable morale. Débloque café discovery, le Corporate Breakroom, café refining, watercooler gossip, et bureau-drama recycling.
information-management=Process gossip et credentials into actionable paper trails. Débloque data synthesis et good excuses.
verbal-approvals=Formalize le manager's spoken promesse into reusable paperasse. Débloque blank directives, directive copying, et verbal direction approbations.
environmental-compliance=Permit le oil economy through properly documented environmental theater. Débloque environmental impact reports, chemical-handling ordres de travail, et verified carbon certificates.
smog-abatement=Le air quality was fine until someone started measuring it. Débloque smog filing, casework, et final resolution.
hazmat-response=What vous don't know can't hurt vous — unless it's radioactive sludge. Débloque hazmat filing, casework, et final resolution.
nest-expropriation=Claim territory through paperasse-backed force. Débloque eviction notices pour clearing biter nids.
synthetic-stationery=Formalize oil-derived stationery production. Débloque synthetic paper made depuis plastic, sulfur, et water pour high-throughput paperasse supply.
public-finance=Bring le treasury et unions into le bureaucratie. Débloque treasury bonds, le Union Headquarters, union approbations, et gouvernement grants.
health-and-safety=Turn union leverage into regulatory theater. Débloque OSHA scrubbing, justifications, et narrative production.
board-meetings=Expand le Union Headquarters into an executive committee floor. Débloque written direction proposals et approbations sans adding another dedicated bâtiment.
executive-review=Escalate bureaucratie into signed directives. Débloque written direction ordres de travail pour le heaviest regulated projects.
radiological-compliance=Escalate process paperasse into nuclear territory. Débloque radiological ordres de travail pour centrifuges et uranium processing.
eminent-domain-zoning=Draft le policy scaffolding pour large-scale expansion. Débloque white papers, policy directives, et slush funds.
work-order-duplication=Standardize industrial copying de completed autorisations. Débloque bulk duplication pour every work-order family à le Industrial Printer, depuis basic assembleur formulaires through radiological operating paperasse.
federal-regulation=Turn policy into enforceable federal text. Débloque regulation drafting.
noise-ordinances=Silence is golden. Documenting noise violations is extremely expensive. Débloque noise filing, casework, et final resolution.
loitering-ordinances=Standing around doing nothing is now a prosecutable offense. Le biters are not amused. Débloque loitering filing, casework, et final resolution.
creative-accounting=Standardize le reclassification de slush funds into officiel revenue. Débloque Tax Audit.
constitutional-law=Le final biter plainte tier. Débloque unemployment filing, casework, et final resolution à le production-science stage.
vagrancy-ordinances=Le final spitter plainte tier. Débloque vagrancy filing, casework, et final resolution à le utility-science stage.
filing-cabinet-logistics-1=Votre pockets now have designated filing sections. More request slots et more trash capacité pour le discerning administrator.
filing-cabinet-logistics-2=Middle direction gets bigger filing cabinets. Further augmente personal logistique capacité.
filing-cabinet-logistics-3=Everything is filed, cross-referenced, et color-coded. Vous have become le bureaucratie. Maximum personal logistique capacité.
after-hours-operations=Standardize juridique nuit shifts pour le administrative apparatus. Débloque le [item=overtime-exemption] Overtime Exemption module so key bureau bâtiments can stay open overnight.
pneumatic-form-transport=Route paperasse through sealed pneumatic tubes. Débloque tube intakes, tube outtakes, et pneumatic pipes. Intakes accept only valid paperasse items, et pneumatic pipes do not connect à regular fluid infrastructure.
pneumatic-capacity=Raise le number de paperasse items chaque pneumatic tube network can hold dans transit.
pneumatic-capacity-1=Reinforce tube junctions à handle more concurrent formulaires. Augmente tube network capacité by 15.
pneumatic-capacity-2=Install pressure regulators pour higher-throughput pneumatic delivery. Augmente tube network capacité by 25.
pneumatic-capacity-3=Full-bore industrial pneumatic infrastructure. Augmente tube network capacité by 50.
pneumatic-capacity-4=Executive-grade document pressure containment. Augmente tube network capacité by 100.
biter-employment=Establish a formal employment programme pour resolved biters. Débloque job offers, le full administratif Bureau Bureau, et le Resolution Bureau. Exige only red tape et administrative science.
biter-employment-office=Open le formal Biter Employment Bureau à dispatch travailleurs à industrial bâtiments. Débloque le Biter Employment Bureau bâtiment.
rideable-biter=Authorize personal transport through supervised biter assignments. Débloque le Rideable Biter.
automobilism=Restore conventional state-approved motoring. Débloque le vanilla car à le utility-science stage.
biter-labor-efficiency=Augmente le number de managed machines a dispatched biter travailleur can authorize per trip.
biter-labor-efficiency-1=Improved routing protocols allow chaque dispatched biter travailleur à visit up à 3 managed machines per trip instead de 1. Chaque visited machine is enabled pour one fabrication cycle before requiring another visit.
biter-labor-efficiency-2=Advanced efficiency protocols further augmente dispatch capacité à 5 managed machine visits per travailleur trip.
biterport-logistics=Unlock biterport infrastructure, train biter logistique travailleurs, et unlock cheap one-slot paperasse chests pour biter-operated networks.
biterport-transport-capacity=Augmente how many items chaque logistique biter can carry per biterport trip.
biterport-transport-capacity-1=Formalize le first logistique manifests. Chaque logistique biter can carry 2 items per trip.
biterport-transport-capacity-2=Upgrade biter saddlebags et paperasse clips. Chaque logistique biter can carry 5 items per trip.
biterport-transport-capacity-3=Standardize bulk handling pour mid-scale logistique. Chaque logistique biter can carry 10 items per trip.
biterport-transport-capacity-4=Issue reinforced transport harnesses pour larger hauls. Chaque logistique biter can carry 25 items per trip.
biterport-worker-speed=Augmente le walking vitesse de logistique travailleurs dispatched depuis biterports.
biterport-worker-speed-1=Better shoes. Logistique travailleurs move 35% faster between jobs.
biterport-worker-speed-2=Even better shoes. Logistique travailleurs move 70% faster. They're practically jogging.
formation-center=Construct le dedicated Formation Center training facility. Requis before any biter profession can be trained. Débloque le Formation Center bâtiment.
union-delegate-training=Certify biter travailleurs as union delegates. Débloque union delegate training à le Formation Center.
chemical-operator-training=Certify biter travailleurs à construct chemical plants et handle hazardous materials. Débloque chemical operator training à le Formation Center.
nuclear-technician-training=Certify biter travailleurs as licensed nuclear technicians pour reactor operations. Débloque nuclear technician training à le Formation Center.
hired-biter-fieldwork=Authorize a pilot programme pour autonomous eviction terrain agents. Train a single behemoth biter avec full juridique authority à independently locate et serve eviction notices à enemy nids. Extremely expensive. Extremely effective.

